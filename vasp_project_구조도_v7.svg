<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="790" viewBox="0 0 760 600" role="img" font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif">
<title>VASP 프로젝트 — 요구사항 주도 구조도 v7</title>
<desc>v7: 결정 4항목 확정값(국내법인·콜드80/핫20 MPC·ETH-USDC Base·1% 중개단일) 반영, 에이전트를 도메인4+교차2로 갱신, 원천자료 15건 편입 현황과 변경신고(마목) 트랙(FIU 사전면담-ISMS 범위확대-변경신고 45일-수리, 8-20 게이트) 추가</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#666" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<style>
.th{font-size:13px;font-weight:700;fill:#222}
.ts{font-size:11px;fill:#3d3d3d}
.tc{font-size:10.5px;fill:#3d3d3d}
.tv{font-size:9px;fill:#8a6300;font-weight:600}
.note{font-size:10.5px;fill:#666}
.sm{font-size:9px;fill:#666}
.pu{fill:#F0EAFB;stroke:#8B6FC7;stroke-width:1.2}
.te{fill:#E3F3EE;stroke:#1D9E75;stroke-width:1}
.am{fill:#FBF1DE;stroke:#C77E00;stroke-width:1.2}
.co{fill:#FBE9E5;stroke:#C05442;stroke-width:1}
.gr{fill:#F1F1EF;stroke:#9A9990;stroke-width:1}
.gr2{fill:#E7E7E4;stroke:#83827A;stroke-width:1.2}
.trk{fill:#FFFFFF;stroke:#8B6FC7;stroke-width:1;stroke-dasharray:none}
.arr{stroke:#666;stroke-width:1.4;fill:none}
.fb{stroke:#C77E00;stroke-width:1.3;fill:none;stroke-dasharray:5 4}
</style>
</defs>
<rect x="0" y="0" width="760" height="600" fill="#FFFFFF"/>

<!-- ⓪ 요구사항 -->
<rect class="am" x="20" y="100" width="200" height="440" rx="10"/>
<text class="th" x="120" y="124" text-anchor="middle">⓪ 요구사항 — 전제 정의</text>
<text class="sm" x="120" y="138" text-anchor="middle">(결정 4항목 — 2026-07 확정값)</text>

<rect class="am" x="32" y="146" width="176" height="34" rx="6"/>
<text class="ts" x="120" y="160" text-anchor="middle">대상 고객</text>
<text class="tv" x="120" y="173" text-anchor="middle">국내 법인 · 자사 커스터디 가입</text>
<rect class="am" x="32" y="186" width="176" height="34" rx="6"/>
<text class="ts" x="120" y="200" text-anchor="middle">지갑·수탁 방식</text>
<text class="tv" x="120" y="213" text-anchor="middle">콜드≥80% + 핫≤20% · MPC 3-of-3</text>
<rect class="am" x="32" y="226" width="176" height="34" rx="6"/>
<text class="ts" x="120" y="240" text-anchor="middle">취급 자산</text>
<text class="tv" x="120" y="253" text-anchor="middle">ETH ↔ USDC · Base 단일</text>
<rect class="am" x="32" y="266" width="176" height="34" rx="6"/>
<text class="ts" x="120" y="280" text-anchor="middle">수수료 · 서비스 범위</text>
<text class="tv" x="120" y="293" text-anchor="middle">1% 양측 · 중개(마목)만 — 교환 안 함</text>

<text class="note" x="120" y="322" text-anchor="middle">고려사항</text>
<rect class="te" x="32" y="330" width="176" height="25" rx="6"/><text class="tc" x="120" y="346" text-anchor="middle">사용자 확장 (국적 · 지위)</text>
<rect class="te" x="32" y="361" width="176" height="25" rx="6"/><text class="tc" x="120" y="377" text-anchor="middle">취급 가상자산 확장 (체인 · 코인)</text>
<rect class="te" x="32" y="392" width="176" height="25" rx="6"/><text class="tc" x="120" y="408" text-anchor="middle">법률 변동 (외환업무 · 정산 지위)</text>
<rect class="te" x="32" y="423" width="176" height="25" rx="6"/><text class="tc" x="120" y="439" text-anchor="middle">은행 연동 (단순 정산 ~ 팩토링)</text>
<rect class="te" x="32" y="454" width="176" height="25" rx="6"/><text class="tc" x="120" y="470" text-anchor="middle">무역사 연동 (로지스틱스 등)</text>
<rect class="te" x="32" y="485" width="176" height="25" rx="6"/><text class="tc" x="120" y="501" text-anchor="middle">해외 온오프램프 연동</text>
<text class="sm" x="120" y="528" text-anchor="middle">2단계 입법·외국환 개정 = 상시 트래킹</text>

<text class="note" x="249" y="128" text-anchor="middle">전제 주입</text>
<line class="arr" x1="224" y1="140" x2="274" y2="140" marker-end="url(#arrow)"/>

<line class="fb" x1="318" y1="266" x2="226" y2="266" marker-end="url(#arrow)"/>
<text class="note" x="272" y="284" text-anchor="middle">전제 충돌 → 회귀</text>

<!-- 최종 산출 -->
<path class="pu" d="M 390 36 L 600 36 L 650 88 L 340 88 Z"/>
<text class="th" x="495" y="60" text-anchor="middle">최종 산출 — VASP 변경신고 제출 문서 (마목 추가)</text>
<text class="ts" x="495" y="78" text-anchor="middle">모든 내용은 아래 층 근거로만 구성</text>

<line class="arr" x1="495" y1="112" x2="495" y2="92" marker-end="url(#arrow)"/>

<!-- 기획 덱 -->
<rect class="te" x="280" y="114" width="430" height="58" rx="8"/>
<text class="th" x="495" y="138" text-anchor="middle">기획 덱 — 서비스 기획</text>
<text class="ts" x="495" y="158" text-anchor="middle">PRD · 플로우(스윔레인) · 예외 분기맵 · IA · 정책 — 진행 중</text>

<line class="arr" x1="405" y1="190" x2="405" y2="176" marker-end="url(#arrow)"/>
<line class="arr" x1="585" y1="190" x2="585" y2="176" marker-end="url(#arrow)"/>

<!-- ① 규제 -->
<rect class="gr" x="320" y="192" width="170" height="228" rx="8"/>
<text class="th" x="405" y="216" text-anchor="middle">① 규제</text>
<text class="note" x="405" y="234" text-anchor="middle">획득 요건 · 운영 컴플라이언스</text>
<rect class="co" x="340" y="250" width="130" height="30" rx="6"/>
<text class="ts" x="405" y="269" text-anchor="middle">이슈 트래커 (웹뷰)</text>
<line class="arr" x1="405" y1="330" x2="405" y2="286" marker-end="url(#arrow)"/>
<rect class="te" x="340" y="334" width="130" height="30" rx="6"/>
<text class="ts" x="405" y="353" text-anchor="middle">도메인 전문가</text>
<text class="note" x="405" y="392" text-anchor="middle">premise · vasp · aml</text>
<text class="note" x="405" y="408" text-anchor="middle">법령 · FIU 매뉴얼 · 판례</text>

<!-- ② 운영·보안 -->
<rect class="gr" x="500" y="192" width="170" height="228" rx="8"/>
<text class="th" x="585" y="216" text-anchor="middle">② 운영 · 보안</text>
<text class="note" x="585" y="234" text-anchor="middle">키관리 · FDS · 내부통제 · 사고대응</text>
<rect class="co" x="520" y="250" width="130" height="30" rx="6"/>
<text class="ts" x="585" y="269" text-anchor="middle">이슈 트래커 (웹뷰)</text>
<line class="arr" x1="585" y1="330" x2="585" y2="286" marker-end="url(#arrow)"/>
<rect class="te" x="520" y="334" width="130" height="30" rx="6"/>
<text class="ts" x="585" y="353" text-anchor="middle">도메인 전문가</text>
<text class="note" x="585" y="392" text-anchor="middle">isms (운영보안·사고대응 흡수)</text>
<text class="note" x="585" y="408" text-anchor="middle">ISMS-P 고시 · 세부점검항목</text>

<!-- 교차 검증 -->
<text class="sm" x="495" y="430" text-anchor="middle">+ 교차 검증 2종: examiner(FIU 반려사유 공격) · evidence-verifier(근거·할루시네이션)</text>

<line class="arr" x1="405" y1="442" x2="405" y2="436" marker-end="url(#arrow)"/>
<line class="arr" x1="585" y1="442" x2="585" y2="436" marker-end="url(#arrow)"/>

<!-- 원천 자료 층 -->
<rect class="gr2" x="280" y="446" width="430" height="52" rx="8"/>
<text class="th" x="495" y="468" text-anchor="middle">원천 자료 층 (기초) — 15건 전문 편입</text>
<text class="ts" x="495" y="487" text-anchor="middle">특금법(현행+8-20개정)·시행령·감독규정·이용자보호법·ISMS-P — 조항 단위 · 버전 관리</text>

<!-- 변경신고 트랙 -->
<rect class="trk" x="280" y="506" width="430" height="58" rx="8"/>
<text class="th" x="290" y="527" text-anchor="start" font-size="11.5">변경신고 트랙</text>
<text class="sm" x="290" y="540" text-anchor="start">(마목 추가)</text>
<rect class="te" x="384" y="513" width="60" height="32" rx="6"/><text class="sm" x="414" y="526" text-anchor="middle">FIU</text><text class="sm" x="414" y="538" text-anchor="middle">사전면담</text>
<line class="arr" x1="446" y1="529" x2="456" y2="529" marker-end="url(#arrow)"/>
<rect class="te" x="458" y="513" width="72" height="32" rx="6"/><text class="sm" x="494" y="526" text-anchor="middle">ISMS 범위확대</text><text class="sm" x="494" y="538" text-anchor="middle">(KISA 협의)</text>
<line class="arr" x1="532" y1="529" x2="542" y2="529" marker-end="url(#arrow)"/>
<rect class="te" x="544" y="513" width="60" height="32" rx="6"/><text class="sm" x="574" y="526" text-anchor="middle">변경신고</text><text class="sm" x="574" y="538" text-anchor="middle">(45일)</text>
<line class="arr" x1="606" y1="529" x2="616" y2="529" marker-end="url(#arrow)"/>
<rect class="pu" x="618" y="513" width="82" height="32" rx="6"/><text class="sm" x="659" y="526" text-anchor="middle" fill="#5b3fa0">수리 → 개시</text><text class="sm" x="659" y="538" text-anchor="middle" fill="#5b3fa0">(본인증 6개월 내)</text>
<text class="sm" x="495" y="557" text-anchor="middle" fill="#C05442">⚠ 선행: 정관 목적 추가(주총) · 8-20 진입규제 게이트 · 로펌/FIU 해석(중개 경계)</text>

<text class="note" x="495" y="578" text-anchor="middle">규칙 1. 위층의 모든 문장은 아래층 근거 없이 올라갈 수 없다</text>
<text class="note" x="495" y="593" text-anchor="middle">규칙 2. "전제가 틀렸다"는 이슈는 건물이 아니라 ⓪ 요구사항으로 돌아간다</text>
</svg>
