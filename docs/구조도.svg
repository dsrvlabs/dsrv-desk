<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="540" viewBox="0 0 760 540" role="img" font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif">
<title>VASP 프로젝트 — 요구사항 주도 구조도 v6</title>
<desc>왼쪽 요구사항 블록(결정 4항목 + 고려사항 6종)이 전제를 정의해 건물에 주입하고, 자료 기초 위 규제·운영보안 2기둥이 기획 덱과 VASP 신고 제출 문서를 떠받치는 구조</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#666" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<style>
.th{font-size:13px;font-weight:700;fill:#222}
.ts{font-size:11px;fill:#3d3d3d}
.tc{font-size:10.5px;fill:#3d3d3d}
.note{font-size:10.5px;fill:#666}
.pu{fill:#F0EAFB;stroke:#8B6FC7;stroke-width:1.2}
.te{fill:#E3F3EE;stroke:#1D9E75;stroke-width:1}
.am{fill:#FBF1DE;stroke:#C77E00;stroke-width:1.2}
.co{fill:#FBE9E5;stroke:#C05442;stroke-width:1}
.gr{fill:#F1F1EF;stroke:#9A9990;stroke-width:1}
.gr2{fill:#E7E7E4;stroke:#83827A;stroke-width:1.2}
.arr{stroke:#666;stroke-width:1.4;fill:none}
.fb{stroke:#C77E00;stroke-width:1.3;fill:none;stroke-dasharray:5 4}
</style>
</defs>
<rect x="0" y="0" width="760" height="540" fill="#FFFFFF"/>

<rect class="am" x="20" y="100" width="200" height="384" rx="10"/>
<text class="th" x="120" y="124" text-anchor="middle">⓪ 요구사항 — 전제 정의</text>
<rect class="am" x="32" y="138" width="176" height="25" rx="6"/><text class="ts" x="120" y="154" text-anchor="middle">대상 고객 정의</text>
<rect class="am" x="32" y="169" width="176" height="25" rx="6"/><text class="ts" x="120" y="185" text-anchor="middle">지갑·수탁 방식 (MPC 등)</text>
<rect class="am" x="32" y="200" width="176" height="25" rx="6"/><text class="ts" x="120" y="216" text-anchor="middle">취급 자산</text>
<rect class="am" x="32" y="231" width="176" height="25" rx="6"/><text class="ts" x="120" y="247" text-anchor="middle">수수료 · 서비스 범위</text>

<text class="note" x="120" y="280" text-anchor="middle">고려사항</text>
<rect class="te" x="32" y="288" width="176" height="25" rx="6"/><text class="tc" x="120" y="304" text-anchor="middle">사용자 확장 (국적 · 지위)</text>
<rect class="te" x="32" y="319" width="176" height="25" rx="6"/><text class="tc" x="120" y="335" text-anchor="middle">취급 가상자산 확장 (체인 · 코인)</text>
<rect class="te" x="32" y="350" width="176" height="25" rx="6"/><text class="tc" x="120" y="366" text-anchor="middle">법률 변동 (외환업무 · 정산 지위)</text>
<rect class="te" x="32" y="381" width="176" height="25" rx="6"/><text class="tc" x="120" y="397" text-anchor="middle">은행 연동 (단순 정산 ~ 팩토링)</text>
<rect class="te" x="32" y="412" width="176" height="25" rx="6"/><text class="tc" x="120" y="428" text-anchor="middle">무역사 연동 (로지스틱스 등)</text>
<rect class="te" x="32" y="443" width="176" height="25" rx="6"/><text class="tc" x="120" y="459" text-anchor="middle">해외 온오프램프 연동</text>

<text class="note" x="249" y="128" text-anchor="middle">전제 주입</text>
<line class="arr" x1="224" y1="140" x2="274" y2="140" marker-end="url(#arrow)"/>

<line class="fb" x1="318" y1="266" x2="226" y2="266" marker-end="url(#arrow)"/>
<text class="note" x="272" y="284" text-anchor="middle">전제 충돌 → 회귀</text>

<path class="pu" d="M 390 36 L 600 36 L 650 88 L 340 88 Z"/>
<text class="th" x="495" y="60" text-anchor="middle">최종 산출 — VASP 신고 제출 문서</text>
<text class="ts" x="495" y="78" text-anchor="middle">모든 내용은 아래 층 근거로만 구성</text>

<line class="arr" x1="495" y1="112" x2="495" y2="92" marker-end="url(#arrow)"/>

<rect class="te" x="280" y="114" width="430" height="58" rx="8"/>
<text class="th" x="495" y="138" text-anchor="middle">기획 덱 — 서비스 기획</text>
<text class="ts" x="495" y="158" text-anchor="middle">플로우 · IA · 정책 · 화면 · 요건 정의</text>

<line class="arr" x1="405" y1="190" x2="405" y2="176" marker-end="url(#arrow)"/>
<line class="arr" x1="585" y1="190" x2="585" y2="176" marker-end="url(#arrow)"/>

<rect class="gr" x="320" y="192" width="170" height="228" rx="8"/>
<text class="th" x="405" y="216" text-anchor="middle">① 규제</text>
<text class="note" x="405" y="234" text-anchor="middle">획득 요건 · 운영 컴플라이언스</text>
<rect class="co" x="340" y="250" width="130" height="30" rx="6"/>
<text class="ts" x="405" y="269" text-anchor="middle">이슈 백로그</text>
<line class="arr" x1="405" y1="330" x2="405" y2="286" marker-end="url(#arrow)"/>
<rect class="te" x="340" y="334" width="130" height="30" rx="6"/>
<text class="ts" x="405" y="353" text-anchor="middle">특화 에이전트</text>
<text class="note" x="405" y="392" text-anchor="middle">체커 · 근거검증 · 심사관</text>
<text class="note" x="405" y="408" text-anchor="middle">법령 · FIU 매뉴얼 · 판례</text>

<rect class="gr" x="500" y="192" width="170" height="228" rx="8"/>
<text class="th" x="585" y="216" text-anchor="middle">② 운영 · 보안</text>
<text class="note" x="585" y="234" text-anchor="middle">키관리 · FDS · 내부통제</text>
<rect class="co" x="520" y="250" width="130" height="30" rx="6"/>
<text class="ts" x="585" y="269" text-anchor="middle">이슈 백로그</text>
<line class="arr" x1="585" y1="330" x2="585" y2="286" marker-end="url(#arrow)"/>
<rect class="te" x="520" y="334" width="130" height="30" rx="6"/>
<text class="ts" x="585" y="353" text-anchor="middle">특화 에이전트</text>
<text class="note" x="585" y="392" text-anchor="middle">지갑 인프라 · 사고대응</text>
<text class="note" x="585" y="408" text-anchor="middle">ISMS-P · 보안 체계</text>

<line class="arr" x1="405" y1="434" x2="405" y2="424" marker-end="url(#arrow)"/>
<line class="arr" x1="585" y1="434" x2="585" y2="424" marker-end="url(#arrow)"/>

<rect class="gr2" x="280" y="438" width="430" height="54" rx="8"/>
<text class="th" x="495" y="461" text-anchor="middle">원천 자료 층 (기초)</text>
<text class="ts" x="495" y="480" text-anchor="middle">법령·시행령 원문 · FIU 매뉴얼 · 판례 · 리서치 — 조항 단위 MD · 버전 관리</text>

<text class="note" x="495" y="520" text-anchor="middle">규칙 1. 위층의 모든 문장은 아래층 근거 없이 올라갈 수 없다</text>
<text class="note" x="495" y="535" text-anchor="middle">규칙 2. "전제가 틀렸다"는 이슈는 건물이 아니라 ⓪ 요구사항으로 돌아간다</text>
</svg>
