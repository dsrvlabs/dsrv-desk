유효하며 1회만 사용할 수 있습니다. 진입 후 비밀번호를 직접 설정하고 2차 인증(OTP)을 등록하면 로그인할 수 있습니다. 비밀번호는 메일에 포함되지 않습니다.\u003c/span>\n          \u003c/div>\n        \u003c/div>\n      \u003c/div>\n\n      \u003c!-- 활성화 링크 버튼 -->\n      \u003cdiv class=\"zone\" data-idx=\"2\" style=\"background:#fff;\">\n        \u003cdiv class=\"zone-highlight\">\u003c/div>\n        \u003cdiv class=\"item-area\" data-highlight=\"2\" style=\"position:relative;padding:4px;border-radius:8px;\">\n          \u003cdiv class=\"pin\" data-idx=\"2\" style=\"top:-6px;right:-6px;\">3\u003c/div>\n          \u003cdiv class=\"btn primary fg\" style=\"border-radius:8px;\">계정 활성화 · 비밀번호 설정\u003c/div>\n        \u003c/div>\n      \u003c/div>\n\n      \u003c!-- 문의 안내 · 메일 푸터 (표시 전용) -->\n      \u003cdiv class=\"zone\" data-idx=\"4\" style=\"background:#fff;border-radius:0 0 8px 8px;\">\n        \u003cdiv class=\"zone-highlight\">\u003c/div>\n        \u003cdiv class=\"item-area\" data-highlight=\"4\" style=\"position:relative;padding:4px;border-radius:8px;\">\n          \u003cdiv class=\"pin\" data-idx=\"4\" style=\"top:-6px;right:-6px;\">5\u003c/div>\n          \u003cdiv style=\"font-size:10.5px;color:#9da8bb;\">계정 관련 문의는 \u003cspan style=\"color:#788297;\">portal.kyc@dsrvlabs.com\u003c/span> 으로 보내주세요.\u003c/div>\n          \u003cdiv class=\"hr-line\">\u003c/div>\n          \u003cdiv style=\"text-align:center;font-size:9.5px;color:#9da8bb;line-height:1.8;\">This is an automated email, please do not reply.\u003cbr>\u003cspan style=\"color:#0556ff;\">portal.kyc@dsrvlabs.com\u003c/span>\u003cbr>© 2026. DSRV labs. All rights reserved\u003c/div>\n        \u003c/div>\n      \u003c/div>\n\n    \u003c/div>\n  \u003c/div>\n\n  \u003csvg id=\"connSvg\" style=\"position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:10;overflow:visible;\">\u003c/svg>\n\n  \u003cdiv class=\"items\" id=\"items\">\n    \u003cdiv class=\"nav-global\">\n      \u003cdiv class=\"nav-global-title\">진입 · 전역 이동\u003c/div>\n      \u003cdiv class=\"nav-row\">\u003cspan class=\"nav-el\">메일 클라이언트 상단(받은편지함 · 수신자 배지)\u003c/span>\u003cspan class=\"nav-act\">—\u003c/span>\u003cspan class=\"nav-to stay\">목업 장식 · 콘솔 요소 아님(수신자 메일 클라이언트 UI) — 서술 대상 외\u003c/span>\u003c/div>\n    \u003c/div>\n\n    \u003cdiv class=\"itm\" data-idx=\"0\">\n      \u003cdiv class=\"num\">1\u003c/div>\n      \u003cdiv>\n        \u003cdiv class=\"itm-title\">발신 · 수신 · 제목 (표시 전용)\u003c/div>\n        \u003cdiv class=\"itm-desc\">\u003cstrong>값\u003c/strong> 수신 주소는 ADM-03 초대 발송에 입력한 {담당자 이메일}이다. 발신 주소와 문의 주소는 하나만 쓴다.\u003cbr>\u003cspan class=\"basis\">근거 초대 기반 계정 개설 · ADM-03 초대 발송\u003c/span>\u003c/div>\n      \u003c/div>\n    \u003c/div>\n\n    \u003cdiv class=\"itm\" data-idx=\"1\">\n      \u003cdiv class=\"num\">2\u003c/div>\n      \u003cdiv>\n        \u003cdiv class=\"itm-title\">초대 본문 (표시 전용)\u003c/div>\n        \u003cdiv class=\"itm-desc\">\u003cstrong>값\u003c/strong> {ORG명}과 {담당자 이메일}을 보인다.\u003cbr>· 비밀번호는 메일에 담지 않는다. 본인이 ONB-01에서 설정한다.\u003cbr>\u003cspan class=\"chk\">[디자인 요청]\u003c/span> 1조직 1계정 고지는 시안에 없다.\u003cbr>\u003cspan class=\"basis\">근거 ISMS 2.5 · ADM-03 초대 정책\u003c/span>\u003c/div>\n      \u003c/div>\n    \u003c/div>\n\n    \u003cdiv class=\"itm\" data-idx=\"2\">\n      \u003cdiv class=\"num\">3\u003c/div>\n      \u003cdiv>\n        \u003cdiv class=\"itm-title\">[계정 활성화 · 비밀번호 설정] 링크 버튼\u003cspan class=\"req\">필수\u003c/span>\u003c/div>\n        \u003cdiv class=\"itm-desc\">\u003cstrong>노출\u003c/strong> 초대 메일에 항상 들어간다. 메일 안의 유일한 클릭 요소다.\u003cbr>\u003cstrong>클릭 가능\u003c/strong> 메일에서는 항상 클릭된다. 토큰 유효성은 이동한 뒤에 판정한다.\u003cbr>\u003cstrong>확인 사항\u003c/strong> 링크 진입 시 서버가 토큰을 1회 검증한다(정상 / 재개 / 무효). 무효 = 만료·이미 사용됨이며 둘을 구분하지 않고 초대 링크 오류(ONB-04)로 보낸다.\u003cbr>\u003cstrong>액션\u003c/strong> 1회용 토큰이 붙은 활성화 URL을 새 탭으로 연다. 재발급 링크는 메일에 두지 않고 ADM-03 초대 재발송으로만 처리한다.\u003cbr>\u003cspan class=\"basis\">근거 ISMS 2.5 · 1회용 활성화 링크\u003c/span>\u003c/div>\n        \u003cdiv class=\"itm-nav\">\u003cspan class=\"nav-tag\">화면 이동 · 인터랙션\u003c/span>\n          \u003cdiv class=\"nav-row\">\u003cspan class=\"nav-el\">링크 — 유효(미사용 · {정책값 72시간} 이내)\u003c/span>\u003cspan class=\"nav-act\">클릭 → 토큰 검증 통과\u003c/span>\u003cspan class=\"nav-to\">\u003cstrong>계정 활성화(ONB-01)\u003c/strong> 정상 상태 — 비밀번호 설정부터 · 중도 이탈 후 재클릭이면 진행 중 화면(ONB-02/03)으로 라우팅(ONB-01 상세 1)\u003c/span>\u003c/div>\n          \u003cdiv class=\"nav-row\">\u003cspan class=\"nav-el\">링크 — 무효(만료: 발송 후 {정책값 72시간} 초과 · 이미 사용됨: 활성화 완료 계정)\u003c/span>\u003cspan class=\"nav-act\">클릭 → 토큰 검증 실패(만료·사용됨 구분 없음)\u003c/span>\u003cspan class=\"nav-to\">\u003cstrong>초대 링크 오류(ONB-04)\u003c/strong> 단일 문구 \"만료되었거나 이미 사용된 링크입니다. 관리자에게 초대 재발송을 요청해 주세요.\" · 조작 요소 없음 · ONB-01에 배너 변형을 두지 않는다(2026-09-02 사용자 결정)\u003c/span>\u003c/div>\n          \u003cdiv class=\"nav-row\">\u003cspan class=\"nav-el\">링크 — 진입 후 중도 이탈(활성화 미완료)\u003c/span>\u003cspan class=\"nav-act\">재클릭 → 토큰 유효(진행 중)\u003c/span>\u003cspan class=\"nav-to\">\u003cstrong>계정 활성화(ONB-01)\u003c/strong> 진행 중 화면(ONB-01/02/03)으로 재개(2026-09-02 채택 — \"1회만 사용\" = 활성화 완료 1회)\u003c/span>\u003c/div>\n        \u003c/div>\n      \u003c/div>\n    \u003c/div>\n\n    \u003cdiv class=\"itm\" data-idx=\"3\">\n      \u003cdiv class=\"num\">4\u003c/div>\n      \u003cdiv>\n        \u003cdiv class=\"itm-title\">활성화 안내 (표시 전용 · 유효기간·1회용·할 일)\u003c/div>\n        \u003cdiv class=\"itm-desc\">\u003cstrong>값\u003c/strong> 유효시간은 72시간 고정값이다.\u003cbr>· '1회만 사용'의 정의는 활성화 완료(ONB-03 [확인]) 1회다. 중도 이탈 후 재클릭은 재개로 처리한다.\u003cbr>\u003cspan class=\"basis\">근거 1회용 활성화 링크 · ADM-03 초대 발송\u003c/span>\u003c/div>\n      \u003c/div>\n    \u003c/div>\n\n    \u003cdiv class=\"itm\" data-idx=\"4\">\n      \u003cdiv class=\"num\">5\u003c/div>\n      \u003cdiv>\n        \u003cdiv class=\"itm-title\">문의 안내 · 메일 푸터 (표시 전용)\u003c/div>\n        \u003cdiv class=\"itm-desc\">\u003cstrong>값\u003c/strong> 푸터 주소는 발신·문의 주소와 같은 portal.kyc@dsrvlabs.com 하나만 쓴다. 전화번호는 넣지 않는다. 연도는 고정 텍스트로 두고 자동 갱신하지 않는다.\u003cbr>\u003cspan class=\"basis\">근거 notation 이메일 통지\u003c/span>\u003c/div>\n      \u003c/div>\n    \u003c/div>\n  \u003c/div>\n\n\u003c/div>\n\n\u003csection class=\"footer-note\" style=\"padding-bottom:0;\">\n  \u003cdiv class=\"note-card\">\n    \u003cdiv class=\"note-title\">상세내용\u003c/div>\n    \u003cdiv class=\"detail-grid\" id=\"detailCol\">\n      \u003cdiv class=\"dtl\" data-idx=\"0\">\n        \u003cdiv class=\"detail-label\">\u003cspan class=\"dtl-num\">1\u003c/span>왜 이메일 초대인가\u003c/div>\n      \u003cdiv class=\"dtl-body\">\u003cspan class=\"box\">\u003cstrong>신원 확인\u003c/strong> 본인 이메일 수신과 링크 접근이 1차 신원 확인 축이다.\u003cbr>\u003cstrong>책임 추적\u003c/strong> 계정별 개별 초대로 공용 계정을 막고 활동 로그의 책임자를 특정한다.\u003cbr>\u003cstrong>이메일 변경\u003c/strong> 수신 주소는 ADM-03 입력값으로 고정하고 콘솔에 변경 화면을 두지 않는다. 변경은 해지 후 재초대다.\u003c/span>\u003c/div>\n      \u003c/div>\n      \u003cdiv class=\"dtl\" data-idx=\"1\">\n        \u003cdiv class=\"detail-label\">\u003cspan class=\"dtl-num\">2\u003c/span>본문이 담는 것\u003c/div>\n      \u003cdiv class=\"dtl-body\">\u003cspan class=\"box\">\u003cstrong>비밀번호\u003c/strong> 메일에 담지 않으므로 서버와 이메일에 평문으로 존재한 적이 없다.\u003cbr>\u003cstrong>1조직 1계정\u003c/strong> 계정과 실제 사용자를 1:1로 묶어 행위 책임자를 특정한다. 조직 내 추가 가입 경로는 없다.\u003cbr>\u003cstrong>내용 제한\u003c/strong> 심사와 AML 내용은 넣지 않는다.\u003c/span>\u003c/div>\n      \u003c/div>\n      \u003cdiv class=\"dtl\" data-idx=\"2\">\n        \u003cdiv class=\"detail-label\">\u003cspan class=\"dtl-num\">3\u003c/span>토큰 케이스 → 표시 위치\u003c/div>\n      \u003cdiv class=\"dtl-body\">\u003cspan class=\"box\">\u003cstrong>표시 위치\u003c/strong> 토큰 오류는 \u003cstrong>초대 링크 오류(ONB-04)\u003c/strong> 한 화면에서만 보여준다. ONB-01에 배너 변형을 두지 않는다.\u003cbr>\u003cstrong>통합\u003c/strong> 만료(발송 + 72시간 경과)와 이미 사용됨(활성화 완료로 소멸)을 구분하지 않고 같은 문구를 쓴다 — 토큰 상태를 알려주지 않는다.\u003cbr>\u003cstrong>재발급\u003c/strong> ADM-03 초대 재발송으로만 한다(새 토큰 · 이전 토큰 즉시 무효).\u003cbr>\u003cstrong>재개\u003c/strong> 활성화 미완료 상태의 재클릭은 재개로 처리해 진행 중 화면으로 라우팅하므로 오류 화면에 오지 않는다.\u003c/span>\u003c/div>\n      \u003c/div>\n    \u003c/div>\n  \u003c/div>\n\u003c/section>\n\n\u003csection class=\"footer-note\">\n  \u003cdiv class=\"note-card\">\n    \u003cdiv class=\"note-title\">비고\u003c/div>\n    \u003cdiv class=\"note-body\">· 온보딩 시작점 · KYC 게이팅 화면 없음 — 계정은 KYC 완료 법인에만 생성·초대 · KYC 예외는 EXC-01 배너 + 거래 요청 차단으로 처리(ADM-03 종속).\u003cbr>· \u003cstrong>[Figma 반영 2026-09-02]\u003c/strong> 시안 메일 프레임 적용 · 1조직 1계정 고지는 시안 없음 → 기획 유지 \u003cspan class=\"chk\">[디자인 요청]\u003c/span> · 원본 \u003cspan class=\"mono\">reference/figma/_crops/F0_mail.png\u003c/span>.\u003cbr>· \u003cstrong>확정(구현 단순 우선)\u003c/strong> — 발신·문의 주소 단일 · 유효시간 72시간 고정값 · 연락처·연도 고정 텍스트 · 중도 이탈 재클릭은 재개.\u003cbr>· 남은 \u003cspan class=\"chk\">[확인필요]\u003c/span> — 활성화 URL 도메인.\u003cbr>· \u003cstrong>확정(2026-09-02)\u003c/strong> — 메일 하단 연락처는 portal.kyc@dsrvlabs.com 단일 · 전화번호 미표기.\u003cbr>· 다음 = ONB-01 → ONB-02 → ONB-03 / 토큰 오류 = ONB-04\u003c/div>\n  \u003c/div>\n\u003c/section>\n\n\u003cscript src=\"screen.js\">\u003c/script>\n\u003c/body>\n\u003c/html>\n", "onb-01.html": "\u003c!DOCTYPE html>\n\u003chtml lang=\"ko\">\n\u003chead>\n\u003cmeta charset=\"UTF-8\">\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n\u003ctitle>화면기획 — 계정 활성화 · 비밀번호 설정\u003c/title>\n\u003clink rel=\"stylesheet\" href=\"screen.css\">\n\u003c/head>\n\u003cbody>\n\n\u003cheader class=\"header\">\n  \u003cdiv class=\"crumb\">\u003cspan>인증·온보딩\u003c/span>\u003cspan class=\"s\">›\u003c/span>\u003cspan>계정 활성화\u003c/span>\u003cspan class=\"s\">›\u003c/span>\u003cspan>비밀번호 설정\u003c/span>\u003c/div>\n  \u003ch1 class=\"title\">계정 활성화 · 비밀번호 설정\u003c/h1>\n  \u003cspan class=\"sid\">ONB-01\u003c/span>\n  \u003cspan class=\"defense\">초대 기반 · 비번 본인설정 · 활성화 1/3\u003c/span>\n\u003c/header>\n\n\u003cdiv class=\"main\">\n  \u003cdiv class=\"screen-panel\">\n    \u003cdiv style=\"position:relative;display:flex;\">\n      \u003cdiv class=\"labels\" id=\"labels\">\n        \u003cdiv class=\"lbl\">\u003cspan class=\"lbl-text\">전역\u003cbr>브랜드 패널\u003c/span>\u003c/div>\n        \u003cdiv class=\"lbl\">\u003cspan class=\"lbl-text\">초대 확인\u003c/span>\u003c/div>\n        \u003cdiv class=\"lbl\">\u003cspan class=\"lbl-text\">비밀번호\u003cbr>설정\u003c/span>\u003c/div>\n        \u003cdiv class=\"lbl\">\u003cspan class=\"lbl-text\">규칙 · 다음\u003c/span>\u003c/div>\n        \u003cdiv class=\"lbl\">\u003cspan class=\"lbl-text\">푸터\u003c/span>\u003c/div>\n      \u003c/div>\n      \u003csvg id=\"bracketSvg\" width=\"24\" style=\"flex-shrink:0;overflow:visible;\">\u003c/svg>\n    \u003c/div>\n\n    \u003cdiv class=\"frame\" id=\"frame\" style=\"background:linear-gradient(135deg,#e3eafc 0%,#f1f4fa 55%,#edf3fb 100%);\">\n      \u003c!-- 전역: 브랜드 패널 (Figma 좌측 · 로그인 전 — GNB·기관 배지 없음 · 핀 없음) -->\n      \u003cdiv class=\"zone\" data-idx=\"\">\n        \u003cdiv class=\"zone-highlight\">\u003c/div>\n        \u003cdiv class=\"brand-panel\">\n          \u003cdiv class=\"bp-logo\">DSRV\u003cspan>®\u003c/span>\u003c/div>\n          \u003cdiv class=\"bp-tag\">한 번의 연동으로 완성하는\u003cbr>\u003cstrong>쉽고 강력한 온체인 금융 OS\u003c/strong>\u003c/div>\n          \u003cdiv class=\"bp-sub\">자산의 발행·결제·운용·보관을 위한 엔터프라이즈급 블록체인 인프라.\u003c/div>\n        \u003c/div>\n      \u003c/div>\n\n      \u003c!-- 초대·계정 확인 (표시 전용 + 토큰 오류 배너 조건부) -->\n      \u003cdiv class=\"zone card\" data-idx=\"\">\n        \u003cdiv class=\"zone-highlight\">\u003c/div>\n        \u003cdiv class=\"zone-title\">계정 활성화\u003c/div>\n      \u003c/div>\n\n      \u003c!-- 비밀번호 설정 -->\n      \u003cdiv class=\"zone card\" data-idx=\"0,1\">\n        \u003cdiv class=\"zone-highlight\">\u003c/div>\n        \u003cdiv class=\"item-area\" data-highlight=\"0\" style=\"position:relative;padding:4px;border-radius:8px;margin-bottom:4px;\">\n          \u003cdiv class=\"pin\" data-idx=\"0\" style=\"top:-6px;right:-6px;\">1\u003c/div>\n          \u003cdiv class=\"flabel\">새 비밀번호\u003cspan class=\"star\">*\u003c/span>\u003c/div>\n          \u003cdiv class=\"field fg\">\u003cspan class=\"ph\">비밀번호 입력\u003c/span>\u003c/div>\n        \u003c/div>\n        \u003cdiv class=\"item-area\" data-highlight=\"1\" style=\"position:relative;padding:4px;border-radius:8px;\">\n          \u003cdiv class=\"pin\" data-idx=\"1\" style=\"top:-6px;right:-6px;\">2\u003c/div>\n          \u003cdiv class=\"flabel\">새 비밀번호 확인\u003cspan class=\"star\">*\u003c/span>\u003c/div>\n          \u003cdiv class=\"field\">\u003cspan class=\"ph\">비밀번호 재입력\u003c/span>\u003c/div>\n        \u003c/div>\n      \u003c/div>\n\n      \u003c!-- 규칙 안내 + [다음] -->\n      \u003cdiv class=\"zone card\" data-idx=\"2\">\n        \u003cdiv class=\"zone-highlight\">\u003c/div>\n        \u003cdiv class=\"item-area\" data-highlight=\"2\" style=\"position:relative;padding:4px;border-radius:8px;margin-top:6px;\">\n          \u003cdiv class=\"pin\" data-idx=\"2\" style=\"top:-8px;right:-6px;\">3\u003c/div>\n          \u003cdiv class=\"btn primary fg\">다음\u003c/div>\n        \u003c/div>\n      \u003c/div>\n\n      \u003c!-- 푸터 -->\n      \u003cdiv class=\"zone\" data-idx=\"\">\n        \u003cdiv class=\"zone-highlight\">\u003c/div>\n        \u003cdiv class=\"pg-footer\">\u003cspan>© dsrv labs Co., Ltd. All Rights Reserved\u003c/span>\u003cspan class=\"lnk\">공지사항\u003c/span>\u003cspan class=\"lnk\">개인정보처리방침\u003c/span>\u003cspan class=\"lnk\">이용약관\u003c/span>\u003c/div>\n      \u003c/div>\n    \u003c/div>\n  \u003c/div>\n\n  \u003csvg id=\"connSvg\" style=\"position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:10;overflow:visible;\">\u003c/svg>\n\n  \u003cdiv class=\"items\" id=\"items\">\n    \u003cdiv class=\"nav-global\">\n      \u003cdiv class=\"nav-global-title\">진입 · 전역 이동\u003c/div>\n      \u003cdiv class=\"nav-row\">\u003cspan class=\"nav-el\">브랜드 패널 (로고 'DSRV' · 태그라인 · 소개문)\u003c/span>\u003cspan class=\"nav-act\">클릭\u003c/span>\u003cspan class=\"nav-to stay\">무반응. 표시 전용이다. 로그인 전 화면이라 상단 메뉴(GNB)와 기관 배지가 없다.\u003c/span>\u003c/div>\n      \u003cdiv class=\"nav-row\">\u003cspan class=\"nav-el\">푸터 '공지사항' / '개인정보처리방침' / '이용약관'\u003c/span>\u003cspan class=\"nav-act\">클릭\u003c/span>\u003cspan class=\"nav-to\">각 문서 페이지를 새 탭으로 연다. 대상 URL \u003cspan class=\"chk\">[확인필요]\u003c/span> · 이용약관·개인정보처리방침이 가입 시 동의한 문서와 같은 문서인지 \u003cspan class=\"chk\">[확인필요]\u003c/span>\u003c/span>\u003c/div>\n      \u003cdiv class=\"nav-row\">\u003cspan class=\"nav-el\">브라우저 뒤로가기\u003c/span>\u003cspan class=\"nav-act\">전 화면 미지원\u003c/span>\u003cspan class=\"nav-to\">\"접근할 수 없는 화면입니다\" 안내 후 이동한다. 로그인 전 화면(ONB-01~04 · AUTH-01·02)에서는 로그인(AUTH-01) 1단계로, 로그인 상태 화면(DASH-02·03)에서는 대시보드(DASH-01)로 간다.\u003c/span>\u003c/div>\n      \u003cdiv class=\"nav-note\">· 이 프레임(왼쪽 브랜드 패널 + 오른쪽 카드 + 푸터)은 ONB-01·02·03·04 · AUTH-01·02 · DASH-02·03이 같이 쓴다. 프레임 동작은 이 화면에만 적고, 나머지 화면에는 이 화면과 다른 점만 적는다.\u003cbr>\n      · \u003cstrong>진입\u003c/strong> 초대 메일(ONB-00)의 링크 클릭. 링크의 토큰을 진입 시 1회 검증해 정상이면 이 화면을 열고, 만료되었거나 이미 사용된 토큰이면 초대 링크 오류(ONB-04)로, 비밀번호까지 저장된 토큰이면 진행 중인 단계(ONB-02 또는 ONB-03)로 보낸다. 2차 인증 재설정(DASH-03)에서 보낸 메일의 링크도 같은 방식으로 이 화면에 들어온다.\u003cbr>\n      · 이 화면과 ONB-02·03의 브랜드 패널에는 'DSRV 서비스 소개 보기 →' 링크가 없다. 활성화 도중 외부로 나가는 동선을 두지 않는다.\u003c/div>\n    \u003c/div>\n\n    \u003cdiv class=\"itm\" data-idx=\"0\">\n      \u003cdiv class=\"num\">1\u003c/div>\n      \u003cdiv>\n        \u003cdiv class=\"itm-title\">새 비밀번호 입력\u003cspan class=\"req\">필수\u003c/span>\u003c/div>\n        \u003cdiv class=\"itm-desc\">\u003cstrong>입력 가능\u003c/strong> 항상 가능하다. 토큰이 유효하지 않으면 이 화면 자체가 열리지 않는다.\u003cbr>\u003cstrong>허용 문자\u003c/strong> 영문 대·소문자 · 숫자 · 특수문자 !@#$%^&amp;*()만 받고 그 외 문자는 입력 시점에 무시한다. 길이는 8~20자로, 20자를 넘는 입력은 받지 않는다.\u003cbr>\u003cstrong>검증\u003c/strong> 입력 중에는 판정하지 않는다. [다음] 클릭 시 입력된 값 전체를 대상으로 규칙 ①~④(조합 3종 이상 · 8~20자 · 이메일 @ 앞부분과 동일 금지 · 동일 문자 반복 금지)를 클라이언트가 한 번에 판정한다. 서버는 규칙을 다시 검증하지 않는다.\u003cbr>\u003cstrong>실패\u003c/strong> 빈칸이면 인라인 ⚠ \"값을 입력해 주세요\", 규칙 미충족이면 인라인 ⚠에 위반한 규칙을 문구로 보인다. 입력값은 유지하고 화면에 머문다.\u003cbr>\u003cstrong>연동\u003c/strong> 없음. 판정은 모두 [다음] 클릭 시 한다.\u003cbr>\u003cstrong>저장\u003c/strong> 단방향 해시와 salt로만 저장한다.\u003cbr>\u003cspan class=\"basis\">근거 ISMS 2.5.3 · 2.5.4\u003c/span>\u003c/div>\n        \u003cdiv class=\"itm-nav\">\u003cspan class=\"nav-tag\">화면 이동 · 인터랙션\u003c/span>\n          \u003cdiv class=\"nav-row\">\u003cspan class=\"nav-el\">새 비밀번호 필드\u003c/span>\u003cspan class=\"nav-act\">[다음] 클릭 시 빈칸·규칙 ①~④ 판정\u003c/span>\u003cspan class=\"nav-to stay\">위반 → 인라인 ⚠(위반 규칙 문구) · 값 유지 · 화면 잔류\u003c/span>\u003c/div>\n        \u003c/div>\n      \u003c/div>\n    \u003c/div>\n\n    \u003cdiv class=\"itm\" data-idx=\"1\">\n      \u003cdiv class=\"num\">2\u003c/div>\n      \u003cdiv>\n        \u003cdiv class=\"itm-title\">새 비밀번호 확인 입력\u003cspan class=\"req\">필수\u003c/span>\u003c/div>\n        \u003cdiv class=\"itm-desc\">\u003cstrong>입력 가능\u003c/strong> 항상 가능하다. 토큰이 유효하지 않으면 이 화면 자체가 열리지 않는다.\u003cbr>\u003cstrong>허용 문자\u003c/strong> 항목 1과 같다.\u003cbr>\u003cstrong>검증\u003c/strong> [다음] 제출 시에만 항목 1 값과 비교한다. 키 입력마다·포커스 아웃 시에는 판정하지 않는다.\u003cbr>\u003cstrong>실패 처리\u003c/strong> 불일치하면 인라인 ⚠ \"비밀번호가 일치하지 않습니다\"를 띄우고 이 필드를 초기화한다(항목 1 값은 유지). 일치 표시(✓)는 두지 않는다.\u003cbr>\u003cstrong>연동\u003c/strong> 없음. 항목 1을 고쳐도 다시 비교하지 않는다(제출 시 판정).\u003cbr>\u003cspan class=\"basis\">근거 ISMS 2.5.3 · 공통 UI 규격 오류 문구 ①\u003c/span>\u003c/div>\n        \u003cdiv class=\"itm-nav\">\u003cspan class=\"nav-tag\">화면 이동 · 인터랙션\u003c/span>\n          \u003cdiv class=\"nav-row\">\u003cspan class=\"nav-el\">새 비밀번호 확인 필드\u003c/span>\u003cspan class=\"nav-act\">[다음] 제출 시 비교\u003c/span>\u003cspan class=\"nav-to stay\">불일치 → 인라인 ⚠ · 이 필드 초기화 · 화면 잔류\u003c/span>\u003c/div>\n        \u003c/div>\n      \u003c/div>\n    \u003c/div>\n\n    \u003cdiv class=\"itm\" data-idx=\"2\">\n      \u003cdiv class=\"num\">3\u003c/div>\n      \u003cdiv>\n        \u003cdiv class=\"itm-title\">[다음] 버튼 (→ 2FA 앱 연결)\u003cspan class=\"req\">필수\u003c/span>\u003c/div>\n        \u003cdiv class=\"itm-desc\">\u003cstrong>노출\u003c/strong> 항상 보인다.\u003cbr>\u003cstrong>클릭 가능\u003c/strong> 항상 활성이다. 처리 중에만 비활성으로 두어 중복 클릭을 막는다. Enter 키도 같이 처리한다.\u003cbr>\u003cstrong>확인 사항\u003c/strong> 클릭 시 클라이언트가 두 필드를 한 번에 검사한다 — ① 빈칸 ② 새 비밀번호 규칙 ①~④ ③ 확인 값 일치. 문제가 있는 필드마다 인라인 ⚠를 동시에 보이고 서버 요청을 보내지 않는다. 모두 통과하면 요청한다. 확인 다이얼로그는 없고 서버가 규칙을 다시 검증하지도 않는다.\u003cbr>\u003cstrong>액션\u003c/strong> 비밀번호를 저장하고 계정 상태를 '활성화 진행 중'으로 기록해 재개 지점을 만든 뒤 ONB-02로 넘긴다. 활성화 중 비밀번호를 다시 바꾸는 동선은 만들지 않는다.\u003cbr>\u003cspan class=\"basis\">근거 ISMS 2.5.4 · 32 §2 ONB-01\u003c/span>\u003c/div>\n        \u003cdiv class=\"itm-nav\">\u003cspan class=\"nav-tag\">화면 이동 · 인터랙션\u003c/span>\n          \u003cdiv class=\"nav-row\">\u003cspan class=\"nav-el\">[다음] — 활성 조건\u003c/span>\u003cspan class=\"nav-act\">항상 활성 · 처리 중에만 비활성(중복 클릭 차단)\u003c/span>\u003cspan class=\"nav-to stay\">입력 상태와 무관하게 클릭 가능 · 검사는 클릭 시\u003c/span>\u003c/div>\n          \u003cdiv class=\"nav-row\">\u003cspan class=\"nav-el\">[다음] — 클릭 · 클라이언트 검사 실패\u003c/span>\u003cspan class=\"nav-act\">빈칸 / 규칙 ①~④ 미충족 / 확인 불일치 중 하나 이상\u003c/span>\u003cspan class=\"nav-to stay\">화면 잔류 · 문제 있는 필드마다 인라인 ⚠ 동시 표시(빈칸 \"값을 입력해 주세요\" · 규칙은 위반 문구 · 불일치 \"비밀번호가 일치하지 않습니다\"+확인 필드 초기화) · 서버 요청 없음\u003c/span>\u003c/div>\n          \u003cdiv class=\"nav-row\">\u003cspan class=\"nav-el\">[다음] — 클릭 · 클라이언트 검사 통과 · Enter\u003c/span>\u003cspan class=\"nav-act\">라벨 \"처리 중…\"·비활성 → 서버: 저장 · ONB-01 완료 기록 · 감사로그\u003c/span>\u003cspan class=\"nav-to\">\u003cstrong>2FA 앱 연결(ONB-02)\u003c/strong> · 시크릿·QR 생성\u003c/span>\u003c/div>\n          \u003cdiv class=\"nav-row\">\u003cspan class=\"nav-el\">[다음] — 실패\u003c/span>\u003cspan class=\"nav-act\">토큰 만료 / 서버 오류\u003c/span>\u003cspan class=\"nav-to stay\">만료 → 초대 링크 오류 화면(ONB-04)으로 이동 / 서버 오류 → 화면 잔류 · 상단 배너 \"일시적인 오류입니다. 잠시 후 다시 시도해 주세요\" · 라벨 복귀 · 입력값 유지\u003c/span>\u003c/div>\n        \u003c/div>\n      \u003c/div>\n    \u003c/div>\n  \u003c/div>\n\n\u003c/div>\n\n\u003csection class=\"footer-note\" style=\"padding-bottom:0;\">\n  \u003cdiv class=\"note-card\">\n    \u003cdiv class=\"note-title\">상세내용\u003c/div>\n    \u003cdiv class=\"detail-grid\" id=\"detailCol\">\n      \u003cdiv class=\"dtl\" data-idx=\"0\">\n        \u003cdiv class=\"detail-label\">\u003cspan class=\"dtl-num\">1\u003c/span>비번 방식 근거\u003c/div>\n      \u003cdiv class=\"dtl-body\">\u003cspan class=\"box\">\u003cstrong>방식\u003c/strong> 초기 비밀번호를 생성·전달하지 않고 활성화 링크에서 본인이 설정한다.\u003cbr>\u003cstrong>검증 위치\u003c/strong> 규칙 판정은 [다음] 클릭 시 클라이언트가 한 번에 하고 서버는 저장만 한다. 입력 중 실시간 검증은 없다.\u003c/span>\u003c/div>\n      \u003c/div>\n    \u003c/div>\n  \u003c/div>\n\u003c/section>\n\n\u003csection class=\"footer-note\">\n  \u003cdiv class=\"note-card\">\n    \u003cdiv class=\"note-title\">비고\u003c/div>\n    \u003cdiv class=\"note-body\">· 계정 활성화 \u003cstrong>1/3 — 비밀번호 본인 설정\u003c/strong> · ONB-00 링크 → 이 화면 → ONB-02 → ONB-03 → AUTH-01 · 2026-09-02 시안 프레임 단위로 3화면 분리(종전 단일 화면·3단계 카드 전환 폐기).\u003cbr>· \u003cstrong>[Figma 반영 2026-09-02]\u003c/strong> 시안 'Set Password' 적용 · 원본 \u003cspan class=\"mono\">reference/figma/_crops/F1_row1_c1.png\u003c/span>.\u003cbr>· \u003cstrong>확정(구현 단순 우선)\u003c/strong> — 표시 토글 없음 · 규칙 수치는 고정 · 규칙 ② 판정은 @ 앞부분 전체 일치 · 활성화 중 비밀번호 재설정 동선 없음.\u003cbr>· \u003cstrong>토큰 라우팅\u003c/strong> 진입 시 1회 검증해 정상이면 이 화면, 만료·사용됨이면 ONB-04, 비밀번호가 이미 저장된 토큰이면 ONB-02·03으로 보낸다. 만료 시 재발급은 ADM-03 초대 재발송(새 토큰 · 이전 토큰과 진행 상태 무효).\u003cbr>· 오류 화면 분리(2026-09-02) — 만료·사용됨 배너 2종을 ONB-04 단일 화면으로 옮김.\u003cbr>· 이전 = ONB-00 / 다음 = ONB-02 / 오류 = ONB-04\u003c/div>\n  \u003c/div>\n\u003c/section>\n\n\u003cscript src=\"screen.js\">\u003c/script>\n\u003c/body>\n\u003c/html>\n", "onb-02.html": "\u003c!DOCTYPE html>\n\u003chtml lang=\"ko\">\n\u003chead>\n\u003cmeta charset=\"UTF-8\">\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n\u003ctitle>화면기획 — 계정 활성화 · 2FA 앱 연결\u003c/title>\n\u003clink rel=\"stylesheet\" href=\"screen.css\">\n\u003c/head>\n\u003cbody>\n\n\u003cheader class=\"header\">\n  \u003cdiv class=\"crumb\">\u003cspan>인증·온보딩\u003c/span>\u003cspan class=\"s\">›\u003c/span>\u003cspan>계정 활성화\u003c/span>\u003cspan class=\"s\">›\u003c/span>\u003cspan>2FA 앱 연결\u003c/span>\u003c/div>\n  \u003ch1 class=\"title\">계정 활성화 · 2FA 앱 연결\u003c/h1>\n  \u003cspan class=\"sid\">ONB-02\u003c/span>\n  \u003cspan class=\"defense\">MFA 등록(TOTP) · 활성화 2/3\u003c/span>\n\u003c/header>\n\n\u003cdiv class=\"main\">\n  \u003cdiv class=\"screen-panel\">\n    \u003cdiv style=\"position:relative;display:flex;\">\n      \u003cdiv class=\"labels\" id=\"labels\">\n        \u003cdiv class=\"lbl\">\u003cspan class=\"lbl-text\">전역\u003cbr>브랜드 패널\u003c/span>\u003c/div>\n        \u003cdiv class=\"lbl\">\u003cspan class=\"lbl-text\">2FA 앱\u003cbr>연결\u003c/span>\u003c/div>\n        \u003cdiv class=\"lbl\">\u003cspan class=\"lbl-text\">푸터\u003c/span>\u003c/div>\n      \u003c/div>\n      \u003csvg id=\"bracketSvg\" width=\"24\" style=\"flex-shrink:0;overflow:visible;\">\u003c/svg>\n    \u003c/div>\n\n    \u003cdiv class=\"frame\" id=\"frame\" style=\"background:linear-gradient(135deg,#e3eafc 0%,#f1f4fa 55%,#edf3fb 100%);\">\n      \u003cdiv class=\"zone\" data-idx=\"\">\n        \u003cdiv class=\"zone-highlight\">\u003c/div>\n        \u003cdiv class=\"brand-panel\">\n          \u003cdiv class=\"bp-logo\">DSRV\u003cspan>®\u003c/span>\u003c/div>\n          \u003cdiv class=\"bp-tag\">한 번의 연동으로 완성하는\u003cbr>\u003cstrong>쉽고 강력한 온체인 금융 OS\u003c/strong>\u003c/div>\n          \u003cdiv class=\"bp-sub\">자산의 발행·결제·운용·보관을 위한 엔터프라이즈급 블록체인 인프라.\u003c/div>\n        \u003c/div>\n      \u003c/div>\n\n      \u003c!-- 2FA 앱 연결 — QR / 설정 키 / 6칸 코드 -->\n      \u003cdiv class=\"zone card\" data-idx=\"0,1,2\">\n        \u003cdiv class=\"zone-highlight\">\u003c/div>\n        \u003cdiv class=\"zone-title\" style=\"margin-bottom:2px;\">2FA 앱 연결\u003c/div>\n        \u003cdiv class=\"card-sub\" style=\"margin-top:0;\">Google Authenticator 등 2FA 앱으로 QR 코드를 스캔하세요.\u003c/div>\n        \u003cdiv class=\"item-area\" data-highlight=\"0\" style=\"position:relative;padding:4px;border-radius:8px;\">\n          \u003cdiv class=\"pin\" data-idx=\"0\" style=\"top:-6px;right:-6px;\">1\u003c/div>\n          \u003cdiv class=\"qr-img\">\u003c/div>\n        \u003c/div>\n        \u003cdiv class=\"item-area\" data-highlight=\"1\" style=\"position:relative;padding:4px;border-radius:8px;margin-top:6px;\">\n          \u003cdiv class=\"pin\" data-idx=\"1\" style=\"top:-6px;right:-6px;\">2\u003c/div>\n          \u003cdiv class=\"flabel\">설정 키\u003c/div>\n          \u003cdiv class=\"field fg\" style=\"font-family:var(--mono);color:#2f3747;\">JBSWY3DPEHPK3PXP\u003c/div>\n        \u003c/div>\n        \u003cdiv class=\"hr-line\">\u003c/div>\n        \u003cdiv class=\"item-area\" data-highlight=\"2\" style=\"position:relative;padding:4px;border-radius:8px;\">\n          \u003cdiv class=\"pin\" data-idx=\"2\" style=\"top:-6px;right:-6px;\">3\u003c/div>\n          \u003cdiv class=\"otp\">\u003cspan>1\u003c/span>\u003cspan>1\u003c/span>\u003cspan>1\u003c/span>\u003cspan>1\u003c/span>\u003cspan>1\u003c/span>\u003cspan>1\u003c/span>\u003c/div>\n          \u003cdiv style=\"font-size:9px;color:#94a3b8;padding:6px 4px 3px;\">▼ 검증 실패 직후에만 노출\u003c/div>\n          \u003cdiv class=\"warn-chip\" style=\"margin-bottom:0;\">인증 코드가 올바르지 않습니다 \u003cstrong>2회 남음\u003c/strong>\u003c/div>\n        \u003c/div>\n      \u003c/div>\n\n      \u003c!-- 보조 링크 -->\n\n      \u003cdiv class=\"zone\" data-idx=\"\">\n        \u003cdiv class=\"zone-highlight\">\u003c/div>\n        \u003cdiv class=\"pg-footer\">\u003cspan>© dsrv labs Co., Ltd. All Rights Reserved\u003c/span>\u003cspan class=\"lnk\">공지사항\u003c/span>\u003cspan class=\"lnk\">개인정보처리방침\u003c/span>\u003cspan class=\"lnk\">이용약관\u003c/span>\u003c/div>\n      \u003c/div>\n    \u003c/div>\n  \u003c/div>\n\n  \u003csvg id=\"connSvg\" style=\"position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:10;overflow:visible;\">\u003c/svg>\n\n  \u003cdiv class=\"items\" id=\"items\">\n    \u003cdiv class=\"nav-global\">\n      \u003cdiv class=\"nav-global-title\">진입 · 전역 이동\u003c/div>\n      \u003cdiv class=\"nav-note\">· \u003cstrong>전역 이동\u003c/strong> 프레임(브랜드 패널 · 푸터 · 뒤로가기)의 동작은 계정 활성화 1/3 비밀번호 설정(ONB-01)의 표와 같다. 다른 점 없음.\u003cbr>\n      · \u003cstrong>진입\u003c/strong> 계정 활성화 1/3(ONB-01) [다음] 성공 직후. 비밀번호 저장까지 끝난 뒤 초대 메일 링크를 다시 클릭한 경우에도 이 화면으로 들어온다.\u003c/div>\n    \u003c/div>\n\n    \u003cdiv class=\"itm\" data-idx=\"0\">\n      \u003cdiv class=\"num\">1\u003c/div>\n      \u003cdiv>\n        \u003cdiv class=\"itm-title\">2FA QR (표시 전용)\u003c/div>\n        \u003cdiv class=\"itm-desc\">\u003cstrong>값\u003c/strong> 계정별 TOTP 시크릿으로 QR을 만든다. 재생성은 연속 실패 {정책값 5회} 도달 시에만 한다.\u003cbr>\u003cstrong>등록 완료 상태\u003c/strong> QR과 설정 키를 흐리게 하고 \"등록됨\" 배지를 붙이며 6칸을 비활성으로 둔다.\u003cbr>\u003cspan class=\"chk\">[디자인 요청]\u003c/span> 등록 완료 상태 표시는 시안에 없다.\u003cbr>\u003cspan class=\"basis\">근거 ISMS 2.5 · F-5\u003c/span>\u003c/div>\n      \u003c/div>\n    \u003c/div>\n\n    \u003cdiv class=\"itm\" data-idx=\"1\">\n      \u003cdiv class=\"num\">2\u003c/div>\n      \u003cdiv>\n        \u003cdiv class=\"itm-title\">설정 키 (표시 전용 · 수동 입력용)\u003c/div>\n        \u003cdiv class=\"itm-desc\">\u003cstrong>값\u003c/strong> QR과 같은 시크릿을 Base32 문자열로 보여준다. 등록 확정 후에는 어느 화면에도 다시 노출하지 않는다.\u003cbr>\u003cspan class=\"basis\">근거 ISMS 2.5 · QR 대체 수단\u003c/span>\u003c/div>\n        \u003cdiv class=\"itm-nav\">\u003cspan class=\"nav-tag\">화면 이동 · 인터랙션\u003c/span>\n          \u003cdiv class=\"nav-row\">\u003cspan class=\"nav-el\">설정 키 필드\u003c/span>\u003cspan class=\"nav-act\">클릭 · 드래그\u003c/span>\u003cspan class=\"nav-to stay\">텍스트 선택만(편집 불가)\u003c/span>\u003c/div>\n        \u003c/div>\n      \u003c/div>\n    \u003c/div>\n\n    \u003cdiv class=\"itm\" data-idx=\"2\">\n      \u003cdiv class=\"num\">3\u003c/div>\n      \u003cdiv>\n        \u003cdiv class=\"itm-title\">6자리 인증 코드 입력 (6칸 · 자동 검증)\u003cspan class=\"req\">필수\u003c/span>\u003c/div>\n        \u003cdiv class=\"itm-desc\">\u003cstrong>입력 가능\u003c/strong> 2FA 등록 확정 전에만 가능하다. 등록 완료 상태(ONB-03에서 복귀)면 비활성이고, 검증 중에는 읽기 전용이다.\u003cbr>\u003cstrong>허용 문자\u003c/strong> 숫자만 받고 한 칸에 1자를 넣는다. 입력하면 다음 칸으로 포커스를 옮긴다.\u003cbr>\u003cstrong>검증\u003c/strong> 6번째 자리를 채우는 즉시 서버에 검증을 요청한다. 확인 버튼과 Enter는 두지 않는다.\u003cbr>\u003cstrong>실패\u003c/strong> 6칸을 초기화하고 첫 칸에 포커스를 주며 오류 칩에 {남은 횟수}를 표기한다. 실패는 감사로그에 남긴다. \u003cspan class=\"chk\">[확인필요: 연속 실패 임계 — 현재 고정 5회]\u003c/span>\u003cbr>\u003cstrong>연동\u003c/strong> 성공하면 2FA를 확정하고 복구 코드를 생성해 ONB-03으로 넘긴다. 연속 실패가 {정책값 5회}에 도달하면 시크릿을 재생성해 항목 1·2의 QR과 설정 키 값을 교체하고 재등록 안내 칩을 띄운다(토큰은 무효화하지 않는다).\u003cbr>\u003cspan class=\"basis\">근거 ISMS 2.5 · F-5\u003c/span>\u003c/div>\n        \u003cdiv class=\"itm-nav\">\u003cspan class=\"nav-tag\">화면 이동 · 인터랙션\u003c/span>\n          \u003cdiv class=\"nav-row\">\u003cspan class=\"nav-el\">6칸 코드 — 6자리 완성\u003c/span>\u003cspan class=\"nav-act\">자동 검증(\"확인 중…\" · 중복 검증 차단) → 성공 시 2FA 확정 · 복구 코드 생성 · ONB-02 완료 기록 · 감사로그\u003c/span>\u003cspan class=\"nav-to\">성공 → \u003cstrong>복구 코드 저장(ONB-03)\u003c/strong> / 실패 → 칩 · 6칸 초기화 / {정책값 5회} 도달 → 시크릿·QR 재생성 · 칩 안내\u003c/span>\u003c/div>\n        \u003c/div>\n      \u003c/div>\n    \u003c/div>\n  \u003c/div>\n\n\u003c/div>\n\n\u003csection class=\"footer-note\" style=\"padding-bottom:0;\">\n  \u003cdiv class=\"note-card\">\n    \u003cdiv class=\"note-title\">상세내용\u003c/div>\n    \u003cdiv class=\"detail-grid\" id=\"detailCol\">\n      \u003cdiv class=\"dtl\" data-idx=\"2\">\n        \u003cdiv class=\"detail-label\">\u003cspan class=\"dtl-num\">3\u003c/span>2FA 등록 · 시크릿\u003c/div>\n      \u003cdiv class=\"dtl-body\">\u003cspan class=\"box\">\u003cstrong>표준\u003c/strong> TOTP(RFC 6238)를 쓰고 QR과 설정 키는 같은 시크릿이다.\u003cbr>\u003cstrong>등록 확인\u003c/strong> 6자리 코드 1회 검증 성공으로 확정하고 실패는 감사로그에 남긴다.\u003cbr>\u003cstrong>시크릿 수명\u003c/strong> 등록 확정 전까지 같은 값을 유지하고 확정 시 복구 코드(ONB-03)를 함께 생성한다.\u003c/span>\u003c/div>\n      \u003c/div>\n    \u003c/div>\n  \u003c/div>\n\u003c/section>\n\n\u003csection class=\"footer-note\">\n  \u003cdiv class=\"note-card\">\n    \u003cdiv class=\"note-title\">비고\u003c/div>\n    \u003cdiv class=\"note-body\">· 계정 활성화 \u003cstrong>2/3 — 2FA 앱 연결\u003c/strong> · ONB-01 [다음] → 이 화면(QR·설정 키·6자리 검증) → 성공 시 ONB-03.\u003cbr>· \u003cstrong>[Figma 반영 2026-09-02]\u003c/strong> 시안 'Set 2FA Code'·'Invalid Credentials' 적용(남은 횟수 노출 포함) · 등록 완료 상태 표시는 시안 없음 → \u003cspan class=\"chk\">[디자인 요청]\u003c/span> · 원본 \u003cspan class=\"mono\">reference/figma/_crops/F2_row1_c2.png · F3_row1_c3.png\u003c/span>.\u003cbr>· \u003cstrong>확정(2026-09-02)\u003c/strong> — 보조 링크 영역 삭제(문의하기 · 로그인으로 돌아가기) · 활성화 도중 외부 이탈 동선 없음.\u003cbr>· \u003cstrong>확정(구현 단순 우선)\u003c/strong> — 6자리 붙여넣기 칸별 분배 삭제(2026-09-02 편의기능 제거 · paste 가로채기 없음) · 설정 키 복사 버튼 없음 · 연속 실패 도달 시 시크릿 재생성(토큰 무효화 없음) · 미완료 계정 로그인 안내는 기존 실패 칩 문구 재사용.\u003cbr>· 남은 \u003cspan class=\"chk\">[확인필요]\u003c/span> — 연속 실패 임계 값 · 등록 완료 상태 디자인.\u003cbr>· 이전 = ONB-01 / 다음 = ONB-03\u003c/div>\n  \u003c/div>\n\u003c/section>\n\n\u003cscript src=\"screen.js\">\u003c/script>\n\u003c/body>\n\u003c/html>\n", "onb-03.html": "\u003c!DOCTYPE html>\n\u003chtml lang=\"ko\">\n\u003chead>\n\u003cmeta charset=\"UTF-8\">\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n\u003ctitle>화면기획 — 계정 활성화 · 복구 코드 저장\u003c/title>\n\u003clink rel=\"stylesheet\" href=\"screen.css\">\n\u003c/head>\n\u003cbody>\n\n\u003cheader class=\"header\">\n  \u003cdiv class=\"crumb\">\u003cspan>인증·온보딩\u003c/span>\u003cspan class=\"s\">›\u003c/span>\u003cspan>계정 활성화\u003c/span>\u003cspan class=\"s\">›\u003c/span>\u003cspan>복구 코드 저장\u003c/span>\u003c/div>\n  \u003ch1 class=\"title\">계정 활성화 · 복구 코드 저장\u003c/h1>\n  \u003cspan class=\"sid\">ONB-03\u003c/span>\n  \u003cspan class=\"defense\">복구 코드 1회 노출 · 활성화 완료 3/3\u003c/span>\n\u003c/header>\n\n\u003cdiv class=\"main\">\n  \u003cdiv class=\"screen-panel\">\n    \u003cdiv style=\"position:relative;display:flex;\">\n      \u003cdiv class=\"labels\" id=\"labels\">\n        \u003cdiv class=\"lbl\">\u003cspan class=\"lbl-text\">전역\u003cbr>브랜드 패널\u003c/span>\u003c/div>\n        \u003cdiv class=\"lbl\">\u003cspan class=\"lbl-text\">복구 코드\u003cbr>저장\u003c/span>\u003c/div>\n        \u003cdiv class=\"lbl\">\u003cspan class=\"lbl-text\">푸터\u003c/span>\u003c/div>\n      \u003c/div>\n      \u003csvg id=\"bracketSvg\" width=\"24\" style=\"flex-shrink:0;overflow:visible;\">\u003c/svg>\n    \u003c/div>\n\n    \u003cdiv class=\"frame\" id=\"frame\" style=\"background:linear-gradient(135deg,#e3eafc 0%,#f1f4fa 55%,#edf3fb 100%);\">\n      \u003cdiv class=\"zone\" data-idx=\"\">\n        \u003cdiv class=\"zone-highlight\">\u003c/div>\n        \u003cdiv class=\"brand-panel\">\n          \u003cdiv class=\"bp-logo\">DSRV\u003cspan>®\u003c/span>\u003c/div>\n          \u003cdiv class=\"bp-tag\">한 번의 연동으로 완성하는\u003cbr>\u003cstrong>쉽고 강력한 온체인 금융 OS\u003c/strong>\u003c/div>\n          \u003cdiv class=\"bp-sub\">자산의 발행·결제·운용·보관을 위한 엔터프라이즈급 블록체인 인프라.\u003c/div>\n        \u003c/div>\n      \u003c/div>\n\n      \u003c!-- 복구 코드 저장 -->\n      \u003cdiv class=\"zone card\" data-idx=\"0,1,2\">\n        \u003cdiv class=\"zone-highlight\">\u003c/div>\n        \u003cdiv class=\"zone-title\" style=\"margin-bottom:2px;\">복구 코드 저장\u003c/div>\n        \u003cdiv class=\"card-sub\" style=\"margin-top:0;\">\u003cstrong>2FA\u003c/strong> 앱을 분실했을 때 사용하는 코드입니다\u003c/div>\n        \u003cdiv class=\"item-area\" data-highlight=\"0\" style=\"position:relative;padding:4px;border-radius:8px;\">\n          \u003cdiv class=\"pin\" data-idx=\"0\" style=\"top:-6px;right:-6px;\">1\u003c/div>\n          \u003cdiv class=\"warn-chip\">아래 코드를 안전한 곳에 보관하세요. 재발급이 불가합니다.\u003c/div>\n          \u003cdiv class=\"rc-code\">3G56 - SYN5 - YVT9 - DT68 - 5DDR - 14QD\u003c/div>\n        \u003c/div>\n        \u003cdiv class=\"item-area\" data-highlight=\"1\" style=\"position:relative;padding:4px;border-radius:8px;margin-top:6px;\">\n          \u003cdiv class=\"pin\" data-idx=\"1\" style=\"top:-8px;right:-6px;\">2\u003c/div>\n          \u003cdiv class=\"btn outline\">⧉ 복사하기\u003c/div>\n        \u003c/div>\n        \u003cdiv class=\"item-area\" data-highlight=\"2\" style=\"position:relative;padding:4px;border-radius:8px;margin-top:2px;\">\n          \u003cdiv class=\"pin\" data-idx=\"2\" style=\"top:-8px;right:-6px;\">3\u003c/div>\n          \u003cdiv class=\"btn primary fg\">확인\u003c/div>\n        \u003c/div>\n      \u003c/div>\n\n      \u003c!-- 보조 링크 -->\n\n      \u003cdiv class=\"zone\" data-idx=\"\">\n        \u003cdiv class=\"zone-highlight\">\u003c/div>\n        \u003cdiv class=\"pg-footer\">\u003cspan>© dsrv labs Co., Ltd. All Rights Reserved\u003c/span>\u003cspan class=\"lnk\">공지사항\u003c/span>\u003cspan class=\"lnk\">개인정보처리방침\u003c/span>\u003cspan class=\"lnk\">이용약관\u003c/span>\u003c/div>\n      \u003c/div>\n    \u003c/div>\n  \u003c/div>\n\n  \u003csvg id=\"connSvg\" style=\"position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:10;overflow:visible;\">\u003c/svg>\n\n  \u003cdiv class=\"items\" id=\"items\">\n    \u003cdiv class=\"nav-global\">\n      \u003cdiv class=\"nav-global-title\">진입 · 전역 이동\u003c/div>\n      \u003cdiv class=\"nav-note\">· \u003cstrong>전역 이동\u003c/strong> 프레임(브랜드 패널 · 푸터 · 뒤로가기)의 동작은 계정 활성화 1/3 비밀번호 설정(ONB-01)의 표와 같다. 다른 점 없음.\u003cbr>\n      · \u003cstrong>진입\u003c/strong> 계정 활성화 2/3(ONB-02) 6자리 코드 검증 성공 직후. 2차 인증 등록까지 끝난 뒤 초대 메일 링크를 다시 클릭한 경우에도 이 화면으로 들어온다.\u003c/div>\n    \u003c/div>\n\n    \u003cdiv class=\"itm\" data-idx=\"0\">\n      \u003cdiv class=\"num\">1\u003c/div>\n      \u003cdiv>\n        \u003cdiv class=\"itm-title\">복구 코드 · 보관 경고 (표시 전용)\u003c/div>\n        \u003cdiv class=\"itm-desc\">\u003cstrong>값\u003c/strong> 단일 코드 1개, 영숫자 24자, 4자씩 6그룹으로 표시하고 1회용이다. ONB-02 검증 성공 시 생성한다.\u003cbr>\u003cstrong>저장\u003c/strong> 비밀번호와 같은 방식으로 해시 저장하고 원문은 화면 표시용으로만 만든다.\u003cbr>\u003cstrong>재표시\u003c/strong> [확인] 전 재진입 시 같은 코드를 다시 보여준다.\u003cbr>\u003cstrong>재발급\u003c/strong> 새 코드는 DASH-03 재설정 완료 시에만 발급하고 이전 코드는 폐기한다.\u003cbr>\u003cspan class=\"basis\">근거 ISMS 2.5 · AUTH-01 상세 5\u003c/span>\u003c/div>\n      \u003c/div>\n    \u003c/div>\n\n    \u003cdiv class=\"itm\" data-idx=\"1\">\n      \u003cdiv class=\"num\">2\u003c/div>\n      \u003cdiv>\n        \u003cdiv class=\"itm-title\">[복사하기] 버튼\u003c/div>\n        \u003cdiv class=\"itm-desc\">\u003cstrong>노출\u003c/strong> 항상 보인다.\u003cbr>\u003cstrong>클릭 가능\u003c/strong> 항상 활성이다.\u003cbr>\u003cstrong>확인 사항\u003c/strong> 클립보드 권한을 확인한다.\u003cbr>\u003cstrong>액션\u003c/strong> 구분자를 포함한 표시 형식 그대로 클립보드에 복사하고 토스트를 2초 띄운다. 권한이 거부되면 직접 선택해 복사하라는 토스트를 띄운다.\u003cbr>\u003cspan class=\"basis\">근거 시안 'Save Code'\u003c/span>\u003c/div>\n        \u003cdiv class=\"itm-nav\">\u003cspan class=\"nav-tag\">화면 이동 · 인터랙션\u003c/span>\n          \u003cdiv class=\"nav-row\">\u003cspan class=\"nav-el\">[복사하기]\u003c/span>\u003cspan class=\"nav-act\">클릭\u003c/span>\u003cspan class=\"nav-to stay\">클립보드 복사 · 토스트 · 화면 잔류\u003c/span>\u003c/div>\n        \u003c/div>\n      \u003c/div>\n    \u003c/div>\n\n    \u003cdiv class=\"itm\" data-idx=\"2\">\n      \u003cdiv class=\"num\">3\u003c/div>\n      \u003cdiv>\n        \u003cdiv class=\"itm-title\">[확인] 버튼 (활성화 완료)\u003cspan class=\"req\">필수\u003c/span>\u003c/div>\n        \u003cdiv class=\"itm-desc\">\u003cstrong>노출\u003c/strong> 항상 보인다.\u003cbr>\u003cstrong>클릭 가능\u003c/strong> 항상 활성이다. 복사는 필수 조건이 아니다. 클릭 후 저장 요청이 끝나기 전까지만 중복 클릭을 막는다.\u003cbr>\u003cstrong>확인 사항\u003c/strong> 복구 코드를 다시 볼 수 없는 비가역 행위이므로 확인 다이얼로그를 띄운다.\u003cbr>\u003cstrong>액션\u003c/strong> 계정 활성화를 확정해 계정 상태를 활성으로 바꾸고 토큰을 소멸시킨다. 자동 로그인은 하지 않고 AUTH-01에서 새 비밀번호와 6자리 코드로 로그인한다.\u003cbr>\u003cspan class=\"chk\">[확인필요: ADM-03 계정 상태 라벨]\u003c/span> \u003cspan class=\"chk\">[디자인 요청]\u003c/span> 다이얼로그는 시안에 없다.\u003cbr>\u003cspan class=\"basis\">근거 ISMS 2.5 · 32 §2 ONB-01\u003c/span>\u003c/div>\n        \u003cdiv class=\"itm-nav\">\u003cspan class=\"nav-tag\">화면 이동 · 인터랙션\u003c/span>\n          \u003cdiv class=\"nav-row\">\u003cspan class=\"nav-el\">[확인] — 활성 조건\u003c/span>\u003cspan class=\"nav-act\">다음이 아님: ①처리 중\u003c/span>\u003cspan class=\"nav-to stay\">항상 활성(복사는 필수 아님) · 처리 중 → 회색\u003c/span>\u003c/div>\n          \u003cdiv class=\"nav-row\">\u003cspan class=\"nav-el\">[확인] — 클릭(활성)\u003c/span>\u003cspan class=\"nav-act\">다이얼로그: 제목 \"복구 코드를 저장했습니까?\" / 본문 \"이 화면을 벗어나면 복구 코드를 다시 볼 수 없습니다. 인증 앱 분실 시 로그인에 필요합니다.\" / [활성화 완료] [돌아가기] → [활성화 완료] → 라벨 \"처리 중…\" → 계정 활성 · 토큰 소멸 · 감사로그\u003c/span>\u003cspan class=\"nav-to\">\u003cstrong>로그인(AUTH-01)\u003c/strong> — 상단 안내 \"계정이 활성화되었습니다. 로그인해 주세요\" \u003cspan class=\"chk\">[확인필요: AUTH-01 안내 노출 여부 — 시안 없음]\u003c/span>\u003c/span>\u003c/div>\n          \u003cdiv class=\"nav-row\">\u003cspan class=\"nav-el\">[확인] — 실패\u003c/span>\u003cspan class=\"nav-act\">토큰 무효(만료·이미 사용) / 서버 오류\u003c/span>\u003cspan class=\"nav-to\">토큰 무효 → \u003cstrong>초대 링크 오류(ONB-04)\u003c/strong> 이동(ONB-01 [다음]과 동일 처리) / 서버 오류 → 화면 잔류 · 상단 배너 \"일시적인 오류입니다. 잠시 후 다시 시도해 주세요\" · 라벨 복귀\u003c/span>\u003c/div>\n        \u003c/div>\n      \u003c/div>\n    \u003c/div>\n  \u003c/div>\n\n\u003c/div>\n\n\u003csection class=\"footer-note\" style=\"padding-bottom:0;\">\n  \u003cdiv class=\"note-card\">\n    \u003cdiv class=\"note-title\">상세내용\u003c/div>\n    \u003cdiv class=\"detail-grid\" id=\"detailCol\">\n      \u003cdiv class=\"dtl\" data-idx=\"0\">\n        \u003cdiv class=\"detail-label\">\u003cspan class=\"dtl-num\">1\u003c/span>복구 코드 취급\u003c/div>\n      \u003cdiv class=\"dtl-body\">\u003cspan class=\"box\">\u003cstrong>형식\u003c/strong> 단일 코드 24자(4×6), 1회용, 해시 저장. 인증 앱 분실 시 AUTH-02에 입력한다.\u003cbr>\u003cstrong>사용 후\u003c/strong> 사용 즉시 폐기하고 DASH-01 권고 배너로 DASH-03 재설정을 유도해 새 코드를 발급한다.\u003cbr>\u003cstrong>이탈\u003c/strong> [확인] 전 이탈이면 재개 시 같은 코드를 다시 보여준다.\u003c/span>\u003c/div>\n      \u003c/div>\n      \u003cdiv class=\"dtl\" data-idx=\"2\">\n        \u003cdiv class=\"detail-label\">\u003cspan class=\"dtl-num\">3\u003c/span>완료 이후 상태\u003c/div>\n      \u003cdiv class=\"dtl-body\">\u003cspan class=\"box\">\u003cstrong>상태 전이\u003c/strong> 계정 상태를 ADM-03 기관·가입자 관리에 반영하고 토큰을 소멸시킨다.\u003cbr>\u003cstrong>로그인\u003c/strong> 자동 로그인 없이 AUTH-01 정상 로그인 1회로 등록을 검증한다.\u003cbr>\u003cstrong>DASH-03 재수행\u003c/strong> [확인] 시점에 기존 세션을 전체 로그아웃하고 이전 복구 코드를 폐기하며 비밀번호도 새로 설정한다.\u003c/span>\u003c/div>\n      \u003c/div>\n    \u003c/div>\n  \u003c/div>\n\u003c/section>\n\n\u003csection class=\"footer-note\">\n  \u003cdiv class=\"note-card\">\n    \u003cdiv class=\"note-title\">비고\u003c/div>\n    \u003cdiv class=\"note-body\">· 계정 활성화 \u003cstrong>3/3 — 복구 코드 저장·활성화 완료\u003c/strong> · ONB-02 검증 성공 → 이 화면(코드 1회 노출 · 복사) → [확인] → AUTH-01.\u003cbr>· \u003cstrong>[Figma 반영 2026-09-02]\u003c/strong> 시안 'Save Code' 적용 · [확인] 확인 다이얼로그는 시안 없음 → \u003cspan class=\"chk\">[디자인 요청]\u003c/span> · 원본 \u003cspan class=\"mono\">reference/figma/_crops/F4_row1_c4.png\u003c/span>.\u003cbr>· \u003cstrong>확정(구현 단순 우선)\u003c/strong> — 복사 토스트 2초 · \u003cstrong>[다운로드] 버튼 삭제(2026-09-02 편의기능 제거)\u003c/strong> — 파일 생성·파일명·내용 규격·다운로드 감사로그가 함께 빠짐 · 문의는 주소 텍스트.\u003cbr>· 남은 \u003cspan class=\"chk\">[확인필요]\u003c/span> — ADM-03 계정 상태 라벨.\u003cbr>· 토큰 무효 시 처리를 ONB-01 [다음]과 통일 — 화면 잔류 배너가 아니라 ONB-04 이동(2026-09-02).\u003cbr>· \u003cstrong>확정(2026-09-02)\u003c/strong> — 보조 링크 영역 삭제(문의하기 · 이전으로). '이전으로' 유지 시 필요했던 ONB-02 [다음] 추가 이슈도 함께 소멸.\u003cbr>· 이전 = ONB-02 / 다음 = AUTH-01\u003c/div>\n  \u003c/div>\n\u003c/section>\n\n\u003cscript src=\"screen.js\">\u003c/script>\n\u003c/body>\n\u003c/html>\n", "onb-04.html": "\u003c!DOCTYPE html>\n\u003chtml lang=\"ko\">\n\u003chead>\n\u003cmeta charset=\"UTF-8\">\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n\u003ctitle>화면기획 — 초대 링크 오류\u003c/title>\n\u003clink rel=\"stylesheet\" href=\"screen.css\">\n\u003c/head>\n\u003cbody>\n\n\u003cheader class=\"header\">\n  \u003cdiv class=\"crumb\">\u003cspan>인증·온보딩\u003c/span>\u003cspan class=\"s\">›\u003c/span>\u003cspan>계정 활성화\u003c/span>\u003cspan class=\"s\">›\u003c/span>\u003cspan>초대 링크 오류\u003c/span>\u003c/div>\n  \u003ch1 class=\"title\">초대 링크 오류\u003c/h1>\n  \u003cspan class=\"sid\">ONB-04\u003c/span>\n  \u003cspan class=\"defense\">만료·사용됨 통합 · 단일 문구\u003c/span>\n\u003c/header>\n\n\u003cdiv class=\"main\">\n  \u003cdiv class=\"screen-panel\">\n    \u003cdiv style=\"position:relative;display:flex;\">\n      \u003cdiv class=\"labels\" id=\"labels\">\n        \u003cdiv class=\"lbl\">\u003cspan class=\"lbl-text\">전역\u003cbr>브랜드 패널\u003c/span>\u003c/div>\n        \u003cdiv class=\"lbl\">\u003cspan class=\"lbl-text\">오류 안내\u003c/span>\u003c/div>\n      \u003c/div>\n      \u003csvg id=\"bracketSvg\" width=\"24\" style=\"flex-shrink:0;overflow:visible;\">\u003c/svg>\n    \u003c/div>\n\n    \u003cdiv class=\"frame\" id=\"frame\" style=\"background:linear-gradient(135deg,#e3eafc 0%,#f1f4fa 55%,#edf3fb 100%);\">\n      \u003c!-- 전역: 브랜드 패널 (로그인 전 — GNB·기관 배지 없음 · 핀 없음) -->\n      \u003cdiv class=\"zone\" data-idx=\"\">\n        \u003cdiv class=\"zone-highlight\">\u003c/div>\n        \u003cdiv class=\"brand-panel\">\n          \u003cdiv class=\"bp-logo\">DSRV\u003cspan>&reg;\u003c/span>\u003c/div>\n          \u003cdiv class=\"bp-tag\">한 번의 연동으로 완성하는\u003cbr>\u003cstrong>쉽고 강력한 온체인 금융 OS\u003c/strong>\u003c/div>\n          \u003cdiv class=\"bp-sub\">자산의 발행·결제·운용·보관을 위한 엔터프라이즈급 블록체인 인프라.\u003c/div>\n        \u003c/div>\n      \u003c/div>\n\n      \u003c!-- 오류 안내 카드 -->\n      \u003cdiv class=\"zone card\" data-idx=\"0,1\">\n        \u003cdiv class=\"zone-highlight\">\u003c/div>\n        \u003cdiv class=\"zone-title\" style=\"margin-bottom:10px;\">계정 활성화\u003c/div>\n        \u003cdiv class=\"item-area\" data-highlight=\"0\" style=\"position:relative;padding:4px;border-radius:8px;\">\n          \u003cdiv class=\"pin\" data-idx=\"0\" style=\"top:-4px;right:-4px;\">1\u003c/div>\n          \u003cdiv class=\"err-chip\">⚠ 이 초대 링크는 사용할 수 없습니다\u003c/div>\n          \u003cdiv class=\"info-box\" style=\"text-align:center;\">만료되었거나 이미 사용된 링크입니다.\u003cbr>관리자에게 초대 재발송을 요청해 주세요.\u003c/div>\n        \u003c/div>\n        \u003cdiv class=\"item-area\" data-highlight=\"1\" style=\"position:relative;padding:4px;border-radius:8px;margin-top:6px;\">\n          \u003cdiv class=\"pin\" data-idx=\"1\" style=\"top:-6px;right:-6px;\">2\u003c/div>\n          \u003cdiv class=\"aux-link\">계정 관련 문의는 \u003cstrong>portal.kyc@dsrvlabs.com\u003c/strong>\u003c/div>\n        \u003c/div>\n      \u003c/div>\n\n    \u003c/div>\n  \u003c/div>\n\n  \u003csvg id=\"connSvg\" style=\"position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:10;overflow:visible;\">\u003c/svg>\n\n  \u003cdiv class=\"items\" id=\"items\">\n    \u003cdiv class=\"itm\" data-idx=\"0\">\n      \u003cdiv class=\"num\">1\u003c/div>\n      \u003cdiv>\n        \u003cdiv class=\"itm-title\">오류 안내 (표시 전용)\u003c/div>\n        \u003cdiv class=\"itm-desc\">\u003cstrong>노출\u003c/strong> 초대 링크 토큰이 유효하지 않을 때 이 화면으로 보낸다 — 만료(발송 + 72시간 경과)와 이미 사용됨(활성화 완료로 소멸)을 구분하지 않고 같은 문구를 쓴다.\u003cbr>\u003cstrong>문구\u003c/strong> 고정 2단 — 칩 \"⚠ 이 초대 링크는 사용할 수 없습니다\" + 본문 \"만료되었거나 이미 사용된 링크입니다. 관리자에게 초대 재발송을 요청해 주세요.\"\u003cbr>\u003cstrong>노출 금지\u003c/strong> 만료인지 사용된 것인지, 계정이 이미 활성인지 알려주지 않는다.\u003cbr>\u003cspan class=\"basis\">근거 ISMS 2.5(인증정보 관리) · 09 §0 결정(2026-09-02) 오류 케이스 통합\u003c/span>\u003c/div>\n      \u003c/div>\n    \u003c/div>\n\n    \u003cdiv class=\"itm\" data-idx=\"1\">\n      \u003cdiv class=\"num\">2\u003c/div>\n      \u003cdiv>\n        \u003cdiv class=\"itm-title\">문의 안내 (표시 전용)\u003c/div>\n        \u003cdiv class=\"itm-desc\">\u003cstrong>노출\u003c/strong> 항상 보인다.\u003cbr>\u003cstrong>값\u003c/strong> 문의 주소는 ONB-00 발신 주소와 같은 값을 쓴다(단일 출처). 주소는 텍스트로만 두고 mailto 링크를 걸지 않는다.\u003cbr>\u003cspan class=\"basis\">근거 notation 이메일 통지 · ONB-00 항목 1\u003c/span>\u003c/div>\n      \u003c/div>\n    \u003c/div>\n  \u003c/div>\n\n\u003c/div>\n\n\u003csection class=\"footer-note\" style=\"padding-bottom:0;\">\n  \u003cdiv class=\"note-card\">\n    \u003cdiv class=\"note-title\">상세내용\u003c/div>\n    \u003cdiv class=\"detail-grid\" id=\"detailCol\">\n      \u003cdiv class=\"dtl\" data-idx=\"0\">\n        \u003cdiv class=\"detail-label\">\u003cspan class=\"dtl-num\">1\u003c/span>토큰 케이스 통합\u003c/div>\n        \u003cdiv class=\"dtl-body\">\u003cspan class=\"box\">\u003cstrong>통합 대상\u003c/strong> 만료(A)와 이미 사용됨(B) 두 경우를 화면 하나·문구 하나로 처리한다. 종전 ONB-01 배너 2종과 [로그인 화면으로] 조건부 노출은 폐기한다.\u003cbr>\u003cstrong>이 화면에 오지 않는 경우\u003c/strong> 활성화 미완료 상태의 재클릭은 재개로 처리해 ONB-01·02·03 중 진행 중 화면으로 라우팅한다.\u003cbr>\u003cstrong>재발급\u003c/strong> ADM-03 초대 재발송으로만 한다(새 토큰 발급 · 이전 토큰 즉시 무효 · 진행 상태 초기화).\u003cbr>\u003cstrong>조작 요소\u003c/strong> 두지 않는다 — 계정이 이미 활성이어서 로그인하려는 경우도 이용자가 직접 로그인 화면에 접속한다.\u003cbr>\u003cstrong>통합 이유\u003c/strong> 분기 화면·문구를 두지 않아 구현이 단순하고, 토큰이 만료인지 사용된 것인지를 알려주지 않는다.\u003c/span>\u003c/div>\n      \u003c/div>\n    \u003c/div>\n  \u003c/div>\n\u003c/section>\n\n\u003csection class=\"footer-note\">\n  \u003cdiv class=\"note-card\">\n    \u003cdiv class=\"note-title\">비고\u003c/div>\n    \u003cdiv class=\"note-body\">· 초대 링크(ONB-00)를 눌렀을 때 토큰이 유효하지 않으면 진입하는 \u003cstrong>종결 화면\u003c/strong>. 2026-09-02 사용자 결정으로 신설 — 종전에는 ONB-01 항목 1의 배너 2종(만료·사용됨)으로만 정의돼 있었다.\u003cbr>· \u003cstrong>확정(구현 단순 우선)\u003c/strong> — 만료·사용됨 단일 문구 · 재발급 링크 없음(관리자 요청) · [로그인 화면으로] 버튼 없음 · mailto 없음. 조작 요소가 없는 화면이다.\u003cbr>· \u003cspan class=\"chk\">[디자인 요청]\u003c/span> Figma 시안 없음 — ONB-01~03과 같은 로그인 전 레이아웃으로 기획 유지.\u003cbr>· \u003cstrong>종결 화면\u003c/strong> — 이 화면에서 다른 화면으로 가는 버튼·링크를 두지 않는다(2026-09-02 사용자 결정). 재발급은 관리자 요청, 로그인은 이용자가 직접 접속한다.\u003cbr>· 이전 = ONB-00 초대 이메일\u003c/div>\n  \u003c/div>\n\u003c/section>\n\n\u003cscript src=\"screen.js\">\u003c/script>\n\u003c/body>\n\u003c/html>\n", "auth-01.html": "\u003c!DOCTYPE html>\n\u003chtml lang=\"ko\">\n\u003chead>\n\u003cmeta charset=\"UTF-8\">\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n\u003ctitle>화면기획 — 로그인\u003c/title>\n\u003clink rel=\"stylesheet\" href=\"screen.css\">\n\u003c/head>\n\u003cbody>\n\n\u003cheader class=\"header\">\n  \u003cdiv class=\"crumb\">\u003cspan>인증\u003c/span>\u003cspan class=\"s\">›\u003c/span>\u003cspan>로그인\u003c/span>\u003c/div>\n  \u003ch1 class=\"title\">로그인\u003c/h1>\n  \u003cspan class=\"sid\">AUTH-01\u003c/span>\n  \u003cspan class=\"defense\">MFA 의무 · 비정상 로그인 통제 · 로그인 1/2\u003c/span>\n\u003c/header>\n\n\u003cdiv class=\"main\">\n  \u003cdiv class=\"screen-panel\">\n    \u003cdiv style=\"position:relative;display:flex;\">\n      \u003cdiv class=\"labels\" id=\"labels\">\n        \u003cdiv class=\"lbl\">\u003cspan class=\"lbl-text\">전역\u003cbr>브랜드 패널\u003c/span>\u003c/div>\n        \u003cdiv class=\"lbl\">\u003cspan class=\"lbl-text\">1단계\u003cbr>계정 입력\u003c/span>\u003c/div>\n        \u003cdiv class=\"lbl\">\u003cspan class=\"lbl-text\">1단계\u003cbr>로그인\u003c/span>\u003c/div>\n        \u003cdiv class=\"lbl\">\u003cspan class=\"lbl-text\">계정 잠금\u003cbr>안내\u003c/span>\u003c/div>\n        \u003cdiv class=\"lbl\">\u003cspan class=\"lbl-text\">푸터\u003c/span>\u003c/div>\n      \u003c/div>\n      \u003csvg id=\"bracketSvg\" width=\"24\" style=\"flex-shrink:0;overflow:visible;\">\u003c/svg>\n    \u003c/div>\n\n    \u003cdiv class=\"frame\" id=\"frame\" style=\"background:linear-gradient(135deg,#e3eafc 0%,#f1f4fa 55%,#edf3fb 100%);\">\n      \u003c!-- 전역: 브랜드 패널 (Figma 좌측 영역 · 로그인 전 — GNB·기관 배지 없음 · 핀 없음, 링크는 전역 블록) -->\n      \u003cdiv class=\"zone\" data-idx=\"\">\n        \u003cdiv class=\"zone-highlight\">\u003c/div>\n        \u003cdiv class=\"brand-panel\">\n          \u003cdiv class=\"bp-logo\">DSRV\u003cspan>®\u003c/span>\u003c/div>\n          \u003cdiv class=\"bp-tag\">한 번의 연동으로 완성하는\u003cbr>\u003cstrong>쉽고 강력한 온체인 금융 OS\u003c/strong>\u003c/div>\n          \u003cdiv class=\"bp-sub\">자산의 발행·결제·운용·보관을 위한 엔터프라이즈급 블록체인 인프라.\u003c/div>\n        \u003c/div>\n      \u003c/div>\n\n      \u003c!-- 1단계 카드: 계정 입력 — 이메일 / 비밀번호 -->\n      \u003cdiv class=\"zone card\" data-idx=\"0,1\">\n        \u003cdiv class=\"zone-highlight\">\u003c/div>\n        \u003cdiv class=\"step-tag\">Figma 'Login'\u003c/div>\n        \u003cdiv class=\"zone-title\" style=\"margin-bottom:10px;\">로그인\u003c/div>\n        \u003cdiv class=\"item-area\" data-highlight=\"0\" style=\"position:relative;padding:4px;border-radius:8px;margin-bottom:4px;\">\n          \u003cdiv class=\"pin\" data-idx=\"0\" style=\"top:-6px;right:-6px;\">1\u003c/div>\n          \u003cdiv class=\"flabel\">이메일 (담당자 계정)\u003cspan class=\"star\">*\u003c/span>\u003c/div>\n          \u003cdiv class=\"field fg\">\u003cspan class=\"ph\">name@company.co.kr\u003c/span>\u003c/div>\n        \u003c/div>\n        \u003cdiv class=\"item-area\" data-highlight=\"1\" style=\"position:relative;padding:4px;border-radius:8px;\">\n          \u003cdiv class=\"pin\" data-idx=\"1\" style=\"top:-6px;right:-6px;\">2\u003c/div>\n          \u003cdiv class=\"flabel\">비밀번호\u003cspan class=\"star\">*\u003c/span>\u003c/div>\n          \u003cdiv class=\"field fg\">\u003cspan class=\"ph\">비밀번호 입력\u003c/span>\u003c/div>\n        \u003c/div>\n      \u003c/div>\n\n      \u003c!-- 1단계 카드: 오류 칩(조건부) + [로그인] -->\n      \u003cdiv class=\"zone card\" data-idx=\"2\">\n        \u003cdiv class=\"zone-highlight\">\u003c/div>\n        \u003cdiv class=\"item-area\" data-highlight=\"2\" style=\"position:relative;padding:4px;border-radius:8px;\">\n          \u003cdiv class=\"pin\" data-idx=\"2\" style=\"top:-8px;right:-6px;\">3\u003c/div>\n          \u003cdiv style=\"font-size:9px;color:#94a3b8;padding:0 4px 4px;\">▼ 제출 실패 직후에만 노출 (정상 시 칩 없음)\u003c/div>\n          \u003cdiv class=\"err-chip\">이메일 또는 비밀번호를 확인해 주세요. \u003cstrong>2회 남음\u003c/strong>\u003c/div>\n          \u003cdiv class=\"btn primary fg\">로그인\u003c/div>\n        \u003c/div>\n      \u003c/div>\n\n\n      \u003c!-- 계정 잠금 안내 (조건부) + 문의 이메일 링크 — Figma 시안 없음(스토리보드 유지 · 2026-09-02 결정) -->\n      \u003cdiv class=\"zone card\" data-idx=\"3,4\">\n        \u003cdiv class=\"zone-highlight\">\u003c/div>\n        \u003cdiv class=\"item-area\" data-highlight=\"3\" style=\"position:relative;padding:4px;border-radius:8px;\">\n          \u003cdiv class=\"pin\" data-idx=\"3\" style=\"top:-6px;right:-6px;\">4\u003c/div>\n          \u003cdiv style=\"font-size:9px;color:#94a3b8;padding:0 4px 3px;\">▼ 잠금 상태 계정으로 시도한 직후에만 노출 (정상 시 없음)\u003c/div>\n          \u003cdiv style=\"background:#ffeaee;border:1px solid #ffd0d9;border-radius:8px;padding:10px 12px;font-size:11.5px;color:#c2415a;line-height:1.55;\">\n            로그인을 5회 이상 실패해 계정이 잠겼습니다.\u003cbr>\n            잠금 해제는 담당자에게 문의해 주세요 —\n            \u003cdiv class=\"item-area\" data-highlight=\"4\" style=\"position:relative;display:inline-block;padding:2px 6px;border-radius:6px;\">\n              \u003cdiv class=\"pin\" data-idx=\"4\" style=\"top:-8px;right:-8px;\">5\u003c/div>\n              \u003cstrong>portal.kyc@dsrvlabs.com\u003c/strong>\n            \u003c/div>\n          \u003c/div>\n        \u003c/div>\n      \u003c/div>\n\n      \u003c!-- 푸터 (Figma 우하단 · 표시·링크 — 핀 없음, 링크는 전역 블록) -->\n      \u003cdiv class=\"zone\" data-idx=\"\">\n        \u003cdiv class=\"zone-highlight\">\u003c/div>\n        \u003cdiv class=\"pg-footer\">\u003cspan>© dsrv labs Co., Ltd. All Rights Reserved\u003c/span>\u003cspan class=\"lnk\">공지사항\u003c/span>\u003cspan class=\"lnk\">개인정보처리방침\u003c/span>\u003cspan class=\"lnk\">이용약관\u003c/span>\u003c/div>\n      \u003c/div>\n    \u003c/div>\n  \u003c/div>\n\n  \u003csvg id=\"connSvg\" style=\"position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:10;overflow:visible;\">\u003c/svg>\n\n  \u003cdiv class=\"items\" id=\"items\">\n    \u003cdiv class=\"nav-global\">\n      \u003cdiv class=\"nav-global-title\">진입 · 전역 이동\u003c/div>\n      \u003cdiv class=\"nav-note\">· \u003cstrong>전역 이동\u003c/strong> 프레임(브랜드 패널 · 푸터 · 뒤로가기)의 동작은 계정 활성화 1/3 비밀번호 설정(ONB-01)의 표와 같다. 다른 점 없음\u003cspan class=\"chk\">[확인필요]\u003c/span>.\u003cbr>\n      · \u003cstrong>진입\u003c/strong> ① 복구 코드 저장(ONB-03) [확인] 직후(2차 인증 재설정으로 ONB-01~03을 다시 진행한 경우 포함) ② 콘솔 어느 화면에서든 기관 배지 메뉴 '로그아웃' ③ 세션 만료(유휴 {정책값 15분} 또는 최대 {정책값 8시간}) 후 재접속 ④ 로그인 전 화면에서 브라우저 뒤로가기 안내 후 ⑤ 2차 인증(AUTH-02)에서 사전 인증 유효시간 초과 또는 실패 횟수 도달로 되돌아온 경우. 어느 경로로 들어와도 항상 1단계(이메일·비밀번호)부터 시작한다.\u003cbr>\n      · 세션 만료로 들어온 경우 \"세션이 만료되었습니다. 다시 로그인해 주세요\" 안내를 띄울지 \u003cspan class=\"chk\">[확인필요]\u003c/span>(시안에 없음).\u003c/div>\n    \u003c/div>\n\n    \u003cdiv class=\"itm\" data-idx=\"0\">\n      \u003cdiv class=\"num\">1\u003c/div>\n      \u003cdiv>\n        \u003cdiv class=\"itm-title\">이메일(담당자 계정) 입력\u003cspan class=\"req\">필수\u003c/span>\u003c/div>\n        \u003cdiv class=\"itm-desc\">\u003cstrong>입력 가능\u003c/strong> 항상 가능하다.\u003cbr>\u003cstrong>허용 문자\u003c/strong> 이메일 형식 문자만 받고 앞뒤 공백은 제거한다. 비교는 대소문자를 무시한다.\u003cbr>\u003cstrong>검증\u003c/strong> 포커스 아웃 시 형식만 판정한다(키 입력마다 하지 않는다). 계정 존재 여부는 클라이언트에서 판정하지 않고 제출 시 통합 오류로 처리한다.\u003cbr>\u003cstrong>실패 처리\u003c/strong> 형식 오류면 인라인 ⚠를 띄운다. 제출 실패 후에는 이 값을 유지하고 비밀번호만 초기화한다.\u003cbr>\u003cstrong>연동\u003c/strong> 비어 있으면 [로그인]을 비활성으로 둔다.\u003cbr>\u003cspan class=\"basis\">근거 ISMS 2.5.3(사용자 인증)\u003c/span>\u003c/div>\n        \u003cdiv class=\"itm-nav\">\u003cspan class=\"nav-tag\">화면 이동 · 인터랙션\u003c/span>\n          \u003cdiv class=\"nav-row\">\u003cspan class=\"nav-el\">이메일 필드\u003c/span>\u003cspan class=\"nav-act\">포커스 아웃 시 형식 검증\u003c/span>\u003cspan class=\"nav-to stay\">정상 → 경고 제거·[로그인] 활성 조건 ① 해소 / 형식 오류 → ⚠ 노출·[로그인] 비활성\u003c/span>\u003c/div>\n        \u003c/div>\n      \u003c/div>\n    \u003c/div>\n\n    \u003cdiv class=\"itm\" data-idx=\"1\">\n      \u003cdiv class=\"num\">2\u003c/div>\n      \u003cdiv>\n        \u003cdiv class=\"itm-title\">비밀번호 입력\u003cspan class=\"req\">필수\u003c/span>\u003c/div>\n        \u003cdiv class=\"itm-desc\">\u003cstrong>입력 가능\u003c/strong> 항상 가능하다.\u003cbr>\u003cstrong>허용 문자\u003c/strong> 제한을 두지 않는다. 로그인은 일치 여부만 보므로 규칙 검증은 ONB-01·DASH-02에서만 한다.\u003cbr>\u003cstrong>검증\u003c/strong> 제출 시 서버가 판정하고 클라이언트는 빈칸 여부만 본다. Enter 키를 [로그인] 제출로 처리한다.\u003cbr>\u003cstrong>실패 처리\u003c/strong> 필드를 초기화하고 오류는 버튼 위 통합 칩(항목 3)으로만 보여준다. 원인을 구분하지 않으므로 필드별 빨간 테두리는 쓰지 않는다.\u003cbr>\u003cstrong>연동\u003c/strong> 실패하면 통합 카운터가 1 오르고 {정책값 5회} 도달 시 계정 잠금(항목 4)으로 넘어간다. 비어 있으면 [로그인]을 비활성으로 둔다.\u003cbr>\u003cspan class=\"basis\">근거 ISMS 2.5.3 · 2.5.4 · 비정상 로그인 통제\u003c/span>\u003c/div>\n        \u003cdiv class=\"itm-nav\">\u003cspan class=\"nav-tag\">화면 이동 · 인터랙션\u003c/span>\n          \u003cdiv class=\"nav-row\">\u003cspan class=\"nav-el\">비밀번호 필드\u003c/span>\u003cspan class=\"nav-act\">입력 · Enter\u003c/span>\u003cspan class=\"nav-to stay\">빈칸 아님 → [로그인] 활성 조건 ② 해소 · Enter = [로그인] 클릭과 동일(항목 3)\u003c/span>\u003c/div>\n        \u003c/div>\n      \u003c/div>\n    \u003c/div>\n\n    \u003cdiv class=\"itm\" data-idx=\"2\">\n      \u003cdiv class=\"num\">3\u003c/div>\n      \u003cdiv>\n        \u003cdiv class=\"itm-title\">[로그인] 버튼 · 실패 칩\u003cspan class=\"req\">필수\u003c/span>\u003c/div>\n        \u003cdiv class=\"itm-desc\">\u003cstrong>노출\u003c/strong> 항상 보인다.\u003cbr>\u003cstrong>클릭 가능\u003c/strong> 이메일 형식이 맞고 비밀번호가 채워졌을 때만 활성이다. 클릭 후 응답이 오기 전까지 중복 클릭을 막는다.\u003cbr>\u003cstrong>확인 사항\u003c/strong> 서버가 이메일과 비밀번호 일치를 판정한다. 확인 다이얼로그는 없다.\u003cbr>\u003cstrong>액션\u003c/strong> 성공하면 세션을 만들지 않고 사전 인증 상태로 두고 \u003cstrong>2차 인증(AUTH-02)\u003c/strong>으로 이동한다. 실패하면 버튼 위 칩에 {남은 횟수}를 표기하고(원인 미구분) 재입력을 시작하면 칩을 지운다. 잠금 계정은 칩 대신 항목 4 배너를 띄운다.\u003cbr>\u003cspan class=\"basis\">근거 ISMS 2.5(인증) · 2.6(접근통제)\u003c/span>\u003c/div>\n        \u003cdiv class=\"itm-nav\">\u003cspan class=\"nav-tag\">화면 이동 · 인터랙션\u003c/span>\n          \u003cdiv class=\"nav-row\">\u003cspan class=\"nav-el\">[로그인] — 활성 조건\u003c/span>\u003cspan class=\"nav-act\">다음이 모두 아님: ①이메일 빈칸·형식 오류 ②비밀번호 빈칸 ③요청 진행 중\u003c/span>\u003cspan class=\"nav-to stay\">하나라도 해당 → 회색 비활성(공통 UI 규격) · 잠금 상태는 클라이언트가 모르므로 비활성 조건 아님(제출 후 배너로 통지)\u003c/span>\u003c/div>\n          \u003cdiv class=\"nav-row\">\u003cspan class=\"nav-el\">[로그인] — 클릭(활성) · Enter\u003c/span>\u003cspan class=\"nav-act\">확인 없음 → 라벨 \"로그인 중…\"·비활성(중복 클릭 차단) → 서버: 이메일·비밀번호 검증 · 감사로그\u003c/span>\u003cspan class=\"nav-to stay\">성공 → 카드가 \u003cstrong>2단계(항목 4)\u003c/strong>로 전환 · 사전 인증 상태 시작 / 실패(불일치) → 화면 잔류 · 실패 칩 노출 · 비밀번호 초기화(이메일 유지) · 카운터 +1 / {정책값 5회}째 실패 또는 잠금 상태 → 항목 4 배너(칩 대신) / 서버 오류 → 상단 배너 \"일시적인 오류입니다. 잠시 후 다시 시도해 주세요\" · 라벨 복귀\u003c/span>\u003c/div>\n        \u003c/div>\n      \u003c/div>\n    \u003c/div>\n\n    \u003cdiv class=\"itm\" data-idx=\"3\">\n      \u003cdiv class=\"num\">4\u003c/div>\n      \u003cdiv>\n        \u003cdiv class=\"itm-title\">계정 잠금 안내 배너 (조건부 노출 · 시안 없음)\u003c/div>\n        \u003cdiv class=\"itm-desc\">\u003cstrong>노출\u003c/strong> 잠금 상태 계정으로 로그인을 제출한 직후, 또는 통합 카운터가 {정책값 5회}에 도달한 직후에 보인다(AUTH-02에서 도달했으면 이 화면으로 되돌린 뒤). 새로고침하면 사라지지만 잠금 상태는 서버에 남는다.\u003cbr>\u003cstrong>문구\u003c/strong> {정책값 5회}와 {문의 이메일}을 넣는다. 비밀번호·인증 코드·복구 코드 실패를 합산하므로 '로그인을 {정책값 5회} 이상 실패' 표현을 쓴다.\u003cbr>\u003cstrong>동작\u003c/strong> 잠금 중에도 필드와 버튼을 비활성으로 만들지 않는다(다른 계정 로그인 가능). 다른 계정을 입력하면 배너를 지우고 잠긴 계정으로 다시 시도하면 다시 띄운다.\u003cbr>\u003cstrong>통지\u003c/strong> 잠금 발생 즉시 ADM-02 알람함에 알린다. 고객 화면에는 내부 처리 상태를 보여주지 않는다.\u003cbr>\u003cspan class=\"chk\">[디자인 요청]\u003c/span> 시안에 없는 요소다.\u003cbr>\u003cspan class=\"basis\">근거 비정상 로그인 통제 · ISMS 2.5 · 2.6 · 공통 UI 규격 오류 문구 ③\u003c/span>\u003c/div>\n        \u003cdiv class=\"itm-nav\">\u003cspan class=\"nav-tag\">화면 이동 · 인터랙션\u003c/span>\n          \u003cdiv class=\"nav-row\">\u003cspan class=\"nav-el\">배너 본문\u003c/span>\u003cspan class=\"nav-act\">클릭\u003c/span>\u003cspan class=\"nav-to stay\">무반응(표시 전용) · 해제는 어드민 홈(ADM-02) 처리함 '계정 잠금' 알람 처리 → 해제 후 다음 제출부터 정상 · 해제 시 카운터 0\u003c/span>\u003c/div>\n        \u003c/div>\n      \u003c/div>\n    \u003c/div>\n\n    \u003cdiv class=\"itm\" data-idx=\"4\">\n      \u003cdiv class=\"num\">5\u003c/div>\n      \u003cdiv>\n        \u003cdiv class=\"itm-title\">문의 이메일 링크 (배너 내)\u003c/div>\n        \u003cdiv class=\"itm-desc\">\u003cstrong>노출\u003c/strong> 잠금 배너와 함께만 보인다.\u003cbr>\u003cstrong>확인 사항\u003c/strong> 없다. 확인 다이얼로그를 띄우지 않는다.\u003cbr>\u003cstrong>액션\u003c/strong> 문의 이메일 주소를 굵게 표시한다. 주소는 ONB-00 발신 주소와 같은 값을 쓴다(단일 출처).\u003cbr>\u003cspan class=\"basis\">근거 잠금 해제 운영 프로세스(상세 8)\u003c/span>\u003c/div>\n        \u003cdiv class=\"itm-nav\">\u003cspan class=\"nav-tag\">화면 이동 · 인터랙션\u003c/span>\n          \u003cdiv class=\"nav-row\">\u003cspan class=\"nav-el\">이메일 주소\u003c/span>\u003cspan class=\"nav-act\">클릭\u003c/span>\u003cspan class=\"nav-to stay\">mailto 채택 시 → 기본 메일 클라이언트 새 메일(수신 = 주소 · 제목 없음) / 텍스트 채택 시 → 무반응(드래그 복사만)\u003c/span>\u003c/div>\n        \u003c/div>\n      \u003c/div>\n    \u003c/div>\n  \u003c/div>\n\n\u003c/div>\n\n\u003csection class=\"footer-note\" style=\"padding-bottom:0;\">\n  \u003cdiv class=\"note-card\">\n    \u003cdiv class=\"note-title\">상세내용\u003c/div>\n    \u003cdiv class=\"detail-grid\" id=\"detailCol\">\n      \u003cdiv class=\"dtl\" data-idx=\"0\">\n        \u003cdiv class=\"detail-label\">\u003cspan class=\"dtl-num\">1\u003c/span>접근 전제\u003c/div>\n      \u003cdiv class=\"dtl-body\">\u003cspan class=\"box\">\u003cstrong>계정\u003c/strong> 초대받은 ORG 담당자만 계정을 가진다.\u003cbr>\u003cstrong>게이팅\u003c/strong> KYC·계약 완료 전에는 로그인 후에도 기능을 막는다(G-3 배너 — EXC-01·DASH-01).\u003cbr>\u003cstrong>오류 문구\u003c/strong> 통합 문구를 쓴다. 이메일 존재 여부와 틀린 필드는 알리지 않고 남은 횟수만 노출한다.\u003c/span>\u003c/div>\n      \u003c/div>\n      \u003cdiv class=\"dtl\" data-idx=\"3\">\n        \u003cdiv class=\"detail-label\">\u003cspan class=\"dtl-num\">4\u003c/span>실패 카운트 · 잠금 해제\u003c/div>\n      \u003cdiv class=\"dtl-body\">\u003cspan class=\"box\">\u003cstrong>통합 카운터\u003c/strong> 비밀번호·인증 코드·복구 코드 실패를 합산하고 성공 시 0으로 되돌린다. {정책값 5회} 도달 시 잠그고 남은 횟수를 칩에 노출한다.\u003cbr>\u003cstrong>잠금 해제\u003c/strong> 관리자가 본인확인 후 해제하거나 초대를 재발송한다. 처리 창구는 ADM-02 처리함의 계정 잠금 알람이며 복구 코드 분실과 같은 프로세스다.\u003cbr>\u003cstrong>기록\u003c/strong> 잠금·해제·알림 이력을 감사로그에 남긴다.\u003cbr>\u003cstrong>적용하지 않는 통제\u003c/strong> 시간 경과 자동 해제, 허용 IP 화이트리스트, 디바이스·위치 이상 탐지는 넣지 않는다.\u003c/span>\u003c/div>\n      \u003c/div>\n    \u003c/div>\n  \u003c/div>\n\u003c/section>\n\n\u003csection class=\"footer-note\">\n  \u003cdiv class=\"note-card\">\n    \u003cdiv class=\"note-title\">비고\u003c/div>\n    \u003cdiv class=\"note-body\">\n      · 비밀번호 찾기·아이디 찾기 링크 없음 — 분실 시 2차 인증 재설정(DASH-03) 또는 관리자 초대 재발송(ADM-03)으로 처리. 1단계 성공 상태(사전 인증)는 {정책값 120초} 유효, 초과 시 1단계로 복귀.\u003cbr>\n      · 모든 화면의 \u003cstrong>진입점(로그인)\u003c/strong>. 인증 후 콘솔 상단(G-2/G-4)·KYC 배너(G-3)가 전역으로 유지. \u003cstrong>2단계 인증\u003c/strong>(1단계 이메일·비밀번호 → 2단계 6자리 코드 또는 복구 코드).\u003cbr>\n      · \u003cstrong>[비밀번호 규칙]\u003c/strong> ① 영문 대·소문자·숫자·특수문자 중 3종 이상 8~20자 ② 이메일과 동일한 문자 사용 금지 ③ 동일 문자 4번 이상 사용 금지 ④ 특수문자는 !@#$%^&amp;*()만 허용 ⑤ 로그인 연속 5회 실패(비밀번호·인증 코드·복구 코드 합산) 시 계정 잠금 — 2026-09-02 시안 반영으로 개정 ⑥ 단방향 해시+salt 저장(원문 미보관 — 초대·본인설정 방식이라 임시 비밀번호 없음) ⑦ \u003cstrong>변경주기는 강제하지 않고 권고\u003c/strong>(유출 정황 시 즉시 변경 원칙). 규칙 검증은 ONB-01·DASH-02에서 [다음] 클릭 시 클라이언트가 한 번에 하고(입력 중 실시간 검증 없음 · [다음]은 항상 활성), 저장 시 서버가 규칙을 다시 검증하지 않는다 — 근거: 정보보호 관리체계(ISMS) 인증기준 2.5.4(비밀번호 관리).\u003cbr>\n      · \u003cstrong>확정(2026-09-02)\u003c/strong> — 2단계 보조 링크 영역 삭제(문의하기 · 로그인으로 돌아가기). 1단계 복귀 수단은 두지 않고 재접속으로 갈음. 복구 코드 진입은 코드 입력 영역의 '복구 코드로 인증' 링크로 유지.\u003cbr>· \u003cstrong>확정(구현 단순 우선)\u003c/strong> 비밀번호 표시 토글 없음 · OTP 6자리 붙여넣기 칸별 분배 삭제(2026-09-02 편의기능 제거) · 문의는 주소 텍스트.\u003cbr>\n      · \u003cstrong>[최소 구현]\u003c/strong> 잠금 알림은 어드민 알람함 재사용(외부 메신저·webhook 없음) · 복구 코드는 비밀번호와 동일한 해시 방식으로 저장, 사용·실패 감사로그 기록 · 재설정·재발급은 기존 초대 재발송(ONB-00→ONB-01~03) 재사용(신규 화면 없음).\u003cbr>\n      · \u003cstrong>[Figma 반영 2026-09-02]\u003c/strong> 시안 'Login'·'Invalid Credentials' 적용 + 사용자 결정 8건 반영: 2단계 인증 / 남은 횟수 노출 / 2차 인증 실패도 카운트 / 단일 복구 코드 / 잠금 배너는 기획 유지(시안 없음) / 서비스명 DSRV Desk. 잠금 배너는 시안 없음 \u003cspan class=\"chk\">[디자인 요청]\u003c/span>. 2단계 화면의 시안 차용·복구 코드 필드는 AUTH-02 비고 참조. 원본 \u003cspan class=\"mono\">reference/figma/AUTH_login_section.svg\u003c/span> · 렌더 \u003cspan class=\"mono\">_crops/F5·F6\u003c/span>.\u003cbr>\n      · 설명 형식(핀 = 조작 요소 단위) — 입력 2(이메일·비밀번호) · 버튼 1 · 링크 1(배너 내 문의 이메일) · 조건부 배너 1. 6칸 코드·복구 코드 전환은 AUTH-02로 이관.\u003cbr>\n      · \u003cspan class=\"chk\">[확인필요]\u003c/span> 사전 인증 유효시간 · 합산 vs 개별 카운터 · 세션값 정책값화·관리자 별도 정책·동시세션 안내 · 세션 만료·시간 초과 안내 문구 · 비밀번호 표시 토글 · 문의 mailto · 서비스 소개·푸터 링크 URL.\u003cbr>\n      · 다음 화면: 대시보드 DASH-01 (GNB에서 교환하기 EXC-01 / 교환게시판 BRK-01 진입)\n    \u003c/div>\n  \u003c/div>\n\u003c/section>\n\n\u003cscript src=\"screen.js\">\u003c/script>\n\u003c/body>\n\u003c/html>\n", "auth-02.html": "\u003c!DOCTYPE html>\n\u003chtml lang=\"ko\">\n\u003chead>\n\u003cmeta charset=\"UTF-8\">\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n\u003ctitle>화면기획 — 2차 인증\u003c/title>\n\u003clink rel=\"stylesheet\" href=\"screen.css\">\n\u003c/head>\n\u003cbody>\n\n\u003cheader class=\"header\">\n  \u003cdiv class=\"crumb\">\u003cspan>인증\u003c/span>\u003cspan class=\"s\">›\u003c/span>\u003cspan>로그인\u003c/span>\u003cspan class=\"s\">›\u003c/span>\u003cspan>2차 인증\u003c/span>\u003c/div>\n  \u003ch1 class=\"title\">2차 인증\u003c/h1>\n  \u003cspan class=\"sid\">AUTH-02\u003c/span>\n  \u003cspan class=\"defense\">MFA 의무 · 로그인 2/2\u003c/span>\n\u003c/header>\n\n\u003cdiv class=\"main\">\n  \u003cdiv class=\"screen-panel\">\n    \u003cdiv style=\"position:relative;display:flex;\">\n      \u003cdiv class=\"labels\" id=\"labels\">\n        \u003cdiv class=\"lbl\">\u003cspan class=\"lbl-text\">전역\u003cbr>브랜드 패널\u003c/span>\u003c/div>\n        \u003cdiv class=\"lbl\">\u003cspan class=\"lbl-text\">코드 입력\u003c/span>\u003c/div>\n        \u003cdiv class=\"lbl\">\u003cspan class=\"lbl-text\">푸터\u003c/span>\u003c/div>\n      \u003c/div>\n      \u003csvg id=\"bracketSvg\" width=\"24\" style=\"flex-shrink:0;overflow:visible;\">\u003c/svg>\n    \u003c/div>\n\n    \u003cdiv class=\"frame\" id=\"frame\" style=\"background:linear-gradient(135deg,#e3eafc 0%,#f1f4fa 55%,#edf3fb 100%);\">\n      \u003cdiv class=\"zone\" data-idx=\"\">\n        \u003cdiv class=\"zone-highlight\">\u003c/div>\n        \u003cdiv class=\"brand-panel\">\n          \u003cdiv class=\"bp-logo\">DSRV\u003cspan>&reg;\u003c/span>\u003c/div>\n          \u003cdiv class=\"bp-tag\">한 번의 연동으로 완성하는\u003cbr>\u003cstrong>쉽고 강력한 온체인 금융 OS\u003c/strong>\u003c/div>\n          \u003cdiv class=\"bp-sub\">자산의 발행·결제·운용·보관을 위한 엔터프라이즈급 블록체인 인프라.\u003c/div>\n        \u003c/div>\n      \u003c/div>\n\n      \u003cdiv class=\"zone card\" data-idx=\"0,1\">\n        \u003cdiv class=\"zone-highlight\">\u003c/div>\n        \u003cdiv class=\"zone-title\" style=\"margin-bottom:2px;\">2차 인증\u003c/div>\n        \u003cdiv style=\"font-size:10px;color:#788297;margin-bottom:10px;\">인증 앱(Google Authenticator 등)에 표시된 6자리 코드를 입력하세요.\u003c/div>\n        \u003cdiv class=\"item-area\" data-highlight=\"0\" style=\"position:relative;padding:4px;border-radius:8px;\">\n          \u003cdiv class=\"pin\" data-idx=\"0\" style=\"top:-6px;right:-6px;\">1\u003c/div>\n          \u003cdiv class=\"otp\">\u003cspan>1\u003c/span>\u003cspan>1\u003c/span>\u003cspan>1\u003c/span>\u003cspan>1\u003c/span>\u003cspan>1\u003c/span>\u003cspan>1\u003c/span>\u003c/div>\n          \u003cdiv style=\"font-size:9px;color:#94a3b8;padding:6px 4px 3px;\">▼ 검증 실패 직후에만 노출\u003c/div>\n          \u003cdiv class=\"err-chip\" style=\"display:block;width:fit-content;margin:0 auto;\">인증 코드가 올바르지 않습니다 \u003cstrong>2회 남음\u003c/strong>\u003c/div>\n        \u003c/div>\n        \u003cdiv class=\"item-area\" data-highlight=\"1\" style=\"position:relative;padding:4px;border-radius:8px;margin-top:6px;\">\n          \u003cdiv class=\"pin\" data-idx=\"1\" style=\"top:-6px;right:-6px;\">2\u003c/div>\n          \u003cdiv style=\"font-size:10.5px;color:#2f3747;font-weight:700;text-align:center;\">복구 코드로 인증\u003c/div>\n          \u003cdiv style=\"font-size:9px;color:#888;padding:6px 4px 3px;\">▼ 링크 클릭 시 6칸 대신 노출 \u003cspan class=\"chk\">[디자인 요청]\u003c/span>\u003c/div>\n          \u003cdiv class=\"field fg\" style=\"border-style:dashed;\">\u003cspan class=\"ph\">복구 코드 입력 (예: 3G56 - SYN5 - YVT9 - DT68 - 5DDR - 14QD)\u003c/span>\u003c/div>\n        \u003c/div>\n      \u003c/div>\n\n      \u003cdiv class=\"zone\" data-idx=\"\">\n        \u003cdiv class=\"zone-highlight\">\u003c/div>\n        \u003cdiv class=\"pg-footer\">\u003cspan>&copy; dsrv labs Co., Ltd. All Rights Reserved\u003c/span>\u003cspan class=\"lnk\">공지사항\u003c/span>\u003cspan class=\"lnk\">개인정보처리방침\u003c/span>\u003cspan class=\"lnk\">이용약관\u003c/span>\u003c/div>\n      \u003c/div>\n    \u003c/div>\n  \u003c/div>\n\n  \u003csvg id=\"connSvg\" style=\"position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:10;overflow:visible;\">\u003c/svg>\n\n  \u003cdiv class=\"items\" id=\"items\">\n    \u003cdiv class=\"nav-global\">\n      \u003cdiv class=\"nav-global-title\">진입 · 전역 이동\u003c/div>\n      \u003cdiv class=\"nav-note\">· \u003cstrong>전역 이동\u003c/strong> 프레임(브랜드 패널 · 푸터 · 뒤로가기)의 동작은 계정 활성화 1/3 비밀번호 설정(ONB-01)의 표와 같다. 다른 점 없음\u003cspan class=\"chk\">[확인필요]\u003c/span>. 이 화면에서 1단계로 돌아가는 버튼은 없다. 되돌아가려면 다시 접속한다(뒤로가기 안내 후에도 로그인(AUTH-01) 1단계로 간다).\u003cbr>\n      · \u003cstrong>진입\u003c/strong> 로그인(AUTH-01) [로그인] 성공 직후. 1단계 성공 상태(사전 인증)는 {정책값 120초} 이내에만 유효하고, 지나면 로그인(AUTH-01) 1단계로 되돌린다 \u003cspan class=\"chk\">[확인필요: 사전 인증 유효시간]\u003c/span>. 이 화면을 건너뛰고 세션이 생기는 경로는 없다.\u003c/div>\n    \u003c/div>\n\n    \u003cdiv class=\"itm\" data-idx=\"0\">\n      \u003cdiv class=\"num\">1\u003c/div>\n      \u003cdiv>\n        \u003cdiv class=\"itm-title\">2차 인증 코드 입력 (6칸 · 자동 검증)\u003cspan class=\"req\">필수\u003c/span>\u003c/div>\n        \u003cdiv class=\"itm-desc\">\u003cstrong>입력 가능\u003c/strong> 항상 가능하다. 검증 중에는 읽기 전용이다.\u003cbr>\u003cstrong>허용 문자\u003c/strong> 숫자만 받고 한 칸에 1자를 넣는다. 입력하면 다음 칸으로 포커스를 옮긴다.\u003cbr>\u003cstrong>검증\u003c/strong> 6번째 자리를 채우는 즉시 서버에 검증을 요청한다. 확인 버튼은 두지 않는다.\u003cbr>\u003cstrong>실패 처리\u003c/strong> 6칸을 초기화하고 첫 칸에 포커스를 주며 오류 칩에 {남은 횟수}를 표기한다. 통합 카운터가 1 오르고 {정책값 5회} 도달 시 계정을 잠그고 \u003cstrong>로그인(AUTH-01)\u003c/strong>으로 되돌린 뒤 잠금 배너를 띄운다.\u003cbr>\u003cstrong>연동\u003c/strong> 성공하면 세션을 만들고, 계정당 1세션 원칙에 따라 다른 기기의 기존 세션을 즉시 종료한다(기존 기기는 다음 요청 때 AUTH-01로 온다). 복구 코드는 이 칸에 넣지 않고 항목 2 링크로 전환해 받는다.\u003cbr>\u003cspan class=\"chk\">[확인필요: 세션 유휴·최대 시간 값 · 기존 세션 종료 안내 문구]\u003c/span>\u003cbr>\u003cspan class=\"basis\">근거 ISMS 2.5 · F-5 · 전 권한자 MFA 의무\u003c/span>\u003c/div>\n        \u003cdiv class=\"itm-nav\">\u003cspan class=\"nav-tag\">화면 이동 · 인터랙션\u003c/span>\n          \u003cdiv class=\"nav-row\">\u003cspan class=\"nav-el\">6칸 코드 — 6자리 완성\u003c/span>\u003cspan class=\"nav-act\">자동 검증(\"확인 중…\" · 중복 검증 차단)\u003c/span>\u003cspan class=\"nav-to\">성공 → 세션 생성 → \u003cstrong>대시보드(DASH-01)\u003c/strong> / 실패 → 칩 · 6칸 초기화 · 화면 잔류 / {정책값 5회} 도달 → \u003cstrong>로그인(AUTH-01)\u003c/strong> + 잠금 배너\u003c/span>\u003c/div>\n        \u003c/div>\n      \u003c/div>\n    \u003c/div>\n\n    \u003cdiv class=\"itm\" data-idx=\"1\">\n      \u003cdiv class=\"num\">2\u003c/div>\n      \u003cdiv>\n        \u003cdiv class=\"itm-title\">'복구 코드로 인증' 링크 → 복구 코드 입력\u003c/div>\n        \u003cdiv class=\"itm-desc\">\u003cstrong>노출\u003c/strong> 항상 보인다.\u003cbr>\u003cstrong>클릭 가능\u003c/strong> 항상 활성이다.\u003cbr>\u003cstrong>확인 사항\u003c/strong> 없다. 확인 다이얼로그를 띄우지 않는다.\u003cbr>\u003cstrong>액션\u003c/strong> 6칸 대신 복구 코드 텍스트 필드 1개로 바꾸고 링크 문구를 '인증 앱 코드로 인증'으로 토글한다.\u003cbr>\u003cstrong>입력 가능\u003c/strong> 링크로 전환한 뒤에만 가능하다. 6칸과 동시에 쓰이지 않는다.\u003cbr>\u003cstrong>허용 문자\u003c/strong> 전환된 필드는 영숫자 24자를 받는다. 하이픈과 공백은 받아서 무시하고 소문자는 대문자로 바꾼다.\u003cbr>\u003cstrong>검증\u003c/strong> 24자를 채우는 즉시 자동 검증한다.\u003cbr>\u003cstrong>실패 처리\u003c/strong> 오류 칩에 {남은 횟수}를 표기하고 통합 카운터를 1 올린다.\u003cbr>\u003cstrong>연동\u003c/strong> 성공하면 코드를 즉시 폐기한다. 코드가 1개뿐이라 인증 앱을 복구하지 않으면 로그인 수단이 없으므로 DASH-01 상단에 재설정 권고 배너를 띄운다. 재발급은 DASH-03 재설정 완료 시에만 한다.\u003cbr>\u003cstrong>저장\u003c/strong> 비밀번호와 같은 방식으로 해시 저장하고 사용·실패를 감사로그에 남긴다.\u003cbr>\u003cspan class=\"chk\">[디자인 요청]\u003c/span> 복구 코드 필드는 시안에 없다(6칸 컴포넌트에 24자를 넣을 수 없어 기획으로 추가).\u003cbr>\u003cspan class=\"basis\">근거 ISMS 2.5 세션·인증 복구 · ONB-03 항목 1\u003c/span>\u003c/div>\n        \u003cdiv class=\"itm-nav\">\u003cspan class=\"nav-tag\">화면 이동 · 인터랙션\u003c/span>\n          \u003cdiv class=\"nav-row\">\u003cspan class=\"nav-el\">'복구 코드로 인증' 링크\u003c/span>\u003cspan class=\"nav-act\">클릭\u003c/span>\u003cspan class=\"nav-to stay\">6칸 → 복구 코드 필드로 전환(입력값 초기화) · 링크 문구 토글 · 다시 클릭 시 6칸으로 복귀\u003c/span>\u003c/div>\n          \u003cdiv class=\"nav-row\">\u003cspan class=\"nav-el\">복구 코드 필드 — 24자 완성\u003c/span>\u003cspan class=\"nav-act\">자동 검증\u003c/span>\u003cspan class=\"nav-to\">성공 → 코드 폐기 · 세션 생성 → \u003cstrong>대시보드(DASH-01)\u003c/strong>(재설정 권고 배너) / 실패 → 칩 · 화면 잔류\u003c/span>\u003c/div>\n        \u003c/div>\n      \u003c/div>\n    \u003c/div>\n  \u003c/div>\n\n\u003c/div>\n\n\u003csection class=\"footer-note\" style=\"padding-bottom:0;\">\n  \u003cdiv class=\"note-card\">\n    \u003cdiv class=\"note-title\">상세내용\u003c/div>\n    \u003cdiv class=\"detail-grid\" id=\"detailCol\">\n      \u003cdiv class=\"dtl\" data-idx=\"0\">\n        \u003cdiv class=\"detail-label\">\u003cspan class=\"dtl-num\">1\u003c/span>2단계 인증 · 세션\u003c/div>\n        \u003cdiv class=\"dtl-body\">\u003cspan class=\"box\">\u003cstrong>흐름\u003c/strong> AUTH-01 1단계 성공 → 사전 인증 상태({정책값 120초}) → 이 화면에서 TOTP 또는 복구 코드 → 세션 생성. 이 화면을 건너뛰고 세션이 생기는 경로는 없다.\u003cbr>\u003cstrong>MFA 범위\u003c/strong> 로그인 시 1회, 그리고 승인·정책변경 같은 민감행위와 계정정보 변경(DASH-02·03)에서 다시 인증한다.\u003cbr>\u003cstrong>동시세션\u003c/strong> 1개만 둔다. 새 로그인이 기존 세션을 끊고 기존 기기는 다음 요청에서 AUTH-01로 온다.\u003cbr>\u003cstrong>세션 값\u003c/strong> 유휴·최대 시간은 고정 설정이다. \u003cspan class=\"chk\">[확인필요: 값 · 기존 세션 종료 안내 문구]\u003c/span>\u003c/span>\u003c/div>\n      \u003c/div>\n      \u003cdiv class=\"dtl\" data-idx=\"1\">\n        \u003cdiv class=\"detail-label\">\u003cspan class=\"dtl-num\">2\u003c/span>복구 코드 규격\u003c/div>\n        \u003cdiv class=\"dtl-body\">\u003cspan class=\"box\">\u003cstrong>형식\u003c/strong> 단일 코드 1개, 영숫자 24자(4자×6그룹, 표시 시 \" - \" 구분), 1회용, 해시 저장. 사용·실패를 감사로그에 남긴다.\u003cbr>\u003cstrong>사용 후\u003c/strong> 복구 수단이 없어지므로 DASH-01 권고 배너로 DASH-03 재설정을 유도해 새 코드를 발급하고 이전 코드를 폐기한다.\u003cbr>\u003cstrong>전면 분실\u003c/strong> 복구 코드까지 없으면 관리자 본인확인 후 초대 재발송으로 처리한다.\u003cbr>\u003cstrong>입력 UI\u003c/strong> 6칸이 아니라 텍스트 필드를 쓴다(항목 2). \u003cspan class=\"chk\">[디자인 요청]\u003c/span>\u003c/span>\u003c/div>\n      \u003c/div>\n    \u003c/div>\n  \u003c/div>\n\u003c/section>\n\n\u003csection class=\"footer-note\">\n  \u003cdiv class=\"note-card\">\n    \u003cdiv class=\"note-title\">비고\u003c/div>\n    \u003cdiv class=\"note-body\">· 로그인 \u003cstrong>2/2 — 2차 인증\u003c/strong>. 2026-09-02 사용자 결정으로 AUTH-01에서 분리했다(종전 '같은 카드가 2단계로 전환' 폐기 · 계정 활성화 3화면 분리와 같은 방식).\u003cbr>· \u003cstrong>실패 카운트\u003c/strong> 계정 단위 통합 카운터 — 비밀번호·인증 코드·복구 코드 실패를 합산하고 로그인 성공 시 0으로 되돌린다. {정책값 5회} 도달 시 계정 잠금이며 잠금 배너는 AUTH-01에 띄운다. \u003cspan class=\"chk\">[확인필요: 합산 카운터 vs 단계별 개별 카운터]\u003c/span>\u003cbr>· \u003cstrong>확정(2026-09-02)\u003c/strong> — 보조 링크 없음(문의하기·1단계 복귀 삭제) · 확인 버튼·Enter 없음 · 복구 코드 진입은 이 화면 링크로만.\u003cbr>· \u003cspan class=\"chk\">[디자인 요청]\u003c/span> Figma에 로그인용 2단계 프레임이 없어 'Set 2FA Code'의 6칸·오류 칩 컴포넌트를 차용했다.\u003cbr>· 이전 = AUTH-01 로그인 / 다음 = DASH-01 대시보드\u003c/div>\n  \u003c/div>\n\u003c/section>\n\n\u003cscript src=\"screen.js\">\u003c/script>\n\u003c/body>\n\u003c/html>\n", "dash-01.html": "\u003c!DOCTYPE html>\n\u003chtml lang=\"ko\">\n\u003chead>\n\u003cmeta charset=\"UTF-8\">\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n\u003ctitle>화면기획 — 대시보드\u003c/title>\n\u003clink rel=\"stylesheet\" href=\"screen.css\">\n\u003cstyle>\n  .tbl{width:100%;border-collapse:collapse;font-size:11px;}\n  .tbl th{background:#f1f5f9;color:#64748b;font-weight:700;text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);font-size:10px;}\n  .tbl td{padding:7px 8px;border-bottom:1px solid #f1f1ee;color:#334155;vertical-align:middle;}\n  .st{display:inline-block;font-size:9px;font-weight:700;padding:1px 7px;border-radius:8px;}\n  .st.ing{background:#fef9ec;color:#92400e;}\n  .st.done{background:#dcfce7;color:#166534;}\n  .st.wait{background:#e0f2fe;color:#075985;}\n  .actrow{display:flex;gap:8px;flex-wrap:wrap;}\n  .action{flex:1;min-width:120px;border:1px solid var(--line);border-radius:8px;padding:9px 11px;background:#fff;}\n  .action .at{font-size:11px;font-weight:700;color:#334155;}\n  .action .ad{font-size:9.5px;color:#94a3b8;margin-top:3px;}\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\n\u003cheader class=\"header\">\n  \u003cdi  \u003cdiv style=\"font-size:9px;color:#94a3b8;padding:3px 8px 0;\">▼ KYC 예외 상태에서만 노출 (정상 시 배너 없음 · EXC-01과 동일 규격)\u003c/div>\n          \u003cdiv class=\"c-banner warn\" style=\"border-radius:0;\">⚠ 현재 거래가 불가합니다 — 고객확인(KYC)에 확인이 필요한 사항이 있습니다. 이메일로 문의해 주세요.\u003c/div>\n        \u003c/div>\n        \u003cdiv class=\"item-area\" data-highlight=\"1\" style=\"position:relative;\">\n          \u003cdiv class=\"pin\" data-idx=\"1\" style=\"top:-4px;right:-6px;\">2\u003c/div>\n          \u003cdiv style=\"font-size:9px;color:#94a3b8;padding:3px 8px 0;\">▼ 복구 코드로 로그인한 세션에서만 노출\u003c/div>\n          \u003cdiv class=\"c-banner kyc\" style=\"border-radius:0;\">ⓘ 복구 코드로 로그인했습니다. 인증 앱을 다시 등록하려면 아래 '2차 인증 재설정'을 진행해 주세요.\u003c/div>\n        \u003c/div>\n      \u003c/div>\n\n      \u003c!-- 내 거래 현황 -->\n      \u003cdiv class=\"zone\" data-idx=\"2,3\">\n        \u003cdiv class=\"zone-highlight\">\u003c/div>\n        \u003cdiv class=\"zone-title\">내 거래 현황\u003c/div>\n        \u003cdiv style=\"font-size:10px;font-weight:700;color:#64748b;margin:8px 4px 4px;\">전체 거래 목록 (최신순)\u003c/div>\n        \u003cdiv class=\"item-area\" data-highlight=\"2\" style=\"position:relative;padding:4px;border-radius:8px;\">\n          \u003cdiv class=\"pin\" data-idx=\"2\" style=\"top:-6px;right:-6px;\">3\u003c/div>\n          \u003ctable class=\"tbl\">\n            \u003cthead>\u003ctr>\u003cth>구분\u003c/th>\u003cth>요청시점\u003c/th>\u003cth>교환 (보내는 → 받는)\u003c/th>\u003cth>비율\u003c/th>\u003cth>상태\u003c/th>\u003c/tr>\u003c/thead>\n            \u003ctbody>\n              \u003ctr>\u003ctd>교환\u003c/td>\u003ctd class=\"mono\">2026-09-02 14:12\u003c/td>\u003ctd>900 USDC → 899.73 USDT\u003c/td>\u003ctd>0.9997 USDT/USDC\u003c/td>\u003ctd>\u003cdiv class=\"item-area\" data-highlight=\"3\" style=\"position:relative;display:inline-block;padding:2px 4px;border-radius:6px;\">\u003cdiv class=\"pin\" data-idx=\"3\" style=\"top:-10px;right:-10px;\">4\u003c/div>\u003cspan class=\"st ing\">진행 중\u003c/span>\u003c/div>\u003c/td> '\u003c/span>\u003cspan class=\"nav-act\">클릭\u003c/span>\u003cspan class=\"nav-to\">메뉴에 '로그아웃' 1개가 펼쳐진다. '로그아웃' 클릭 → 확인 없이 세션 파기 → \u003cstrong>로그인(AUTH-01)\u003c/strong>\u003c/span>\u003c/div>\n      \u003cdiv class=\"nav-row\">\u003cspan class=\"nav-el\">브라우저 뒤로가기\u003c/span>\u003cspan class=\"nav-act\">전 화면 미지원\u003c/span>\u003cspan class=\"nav-to\">\"접근할 수 없는 화면입니다\" 안내 후 \u003cstrong>대시보드(DASH-01)\u003c/strong>로 이동한다.\u003c/span>\u003c/div>\n      \u003cdiv class=\"nav-note\">· 이 프레임(상단 GNB 3탭 + 기관 배지)은 EXC-01~04 · BRK-01~07이 같이 쓴다. 프레임 동작은 이 화면에만 적고, 나머지 화면에는 이 화면과 다른 점만 적는다.\u003cbr>\n      · \u003cstrong>진입\u003c/strong> 2차 인증(AUTH-02) 성공 직후(복구 코드로 인증했으면 상단에 2차 인증 재설정 권고 배너가 함께 보인다) / 다른 콘솔 화면에서 GNB '대시보드' 또는 로고 클릭 / 승인 진행(EXC-03) · 내역·완료(EXC-04) · 이전·완료(BRK-05) [확인] / 비밀번호 수정(DASH-02) 완료 또는 [취소] / 2차 인증 재설정(DASH-03) '‹ 이전으로' / 브라우저 뒤로가기 안내 후.\u003c/div>\n    \u003c/div>\n\n    \u003cdiv class=\"itm\" data-idx=\"0\">\n      \u003cdiv class=\"num\">1\u003c/div>\n      \u003cdiv>\n        \u003cdiv class=\"itm-title\">KYC 예외 요약 배너 (조건부 노출)\u003c/div>\n        \u003cdiv class=\"itm-desc\">· \u003cstrong>노출\u003c/strong> 기관 KYC 상태가 '활성'이 아닐 때만 보인다(심사중(EDD)·일시제한·동결).\u003cbr>· \u003cspan class=\"chk\">[확인필요: 안내 이메일 주소]\u003c/span>\u003cbr>\u003cspan class=\"basis\">근거 G-3 · 공통 UI 규격 상태 게이팅\u003c/span>\u003c/div>\n        \u003cdiv class=\"itm-nav\">\u003cspan class=\"nav-tag\">화면 이동 · 인터랙션\u003c/span>\n          \u003cdiv class=\"nav-row\">\u003cspan class=\"nav-el\">배너\u003c/span>\u003cspan class=\"nav-act\">클릭\u003c/span>\u003cspan class=\"nav-to stay\">무반응 · 상태 '활성' 전환 시 다음 진입에서 소멸\u003c/span>\u003c/div>\n        \u003c/div>\n      \u003c/div>\n    \u003c/div>\n\n    \u003cdiv class=\"itm\" data-idx=\"1\">\n      \u003cdiv class=\"num\">2\u003c/div>\n      \u003cdiv>\n        \u003cdiv class=\"itm-title\">2차 인증 재설정 권고 배너 (조건부 노출)\u003c/div>\n        \u003cdiv class=\"itm-desc\">· \u003cstrong>노출\u003c/strong> 현재 세션이 복구 코드 로그인일 때만 보인다. 세션이 끝나면 사라지고 복구 코드로 다시 로그
