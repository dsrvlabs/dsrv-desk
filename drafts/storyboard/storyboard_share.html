dding:4px;border-radius:8px;margin-top:4px;\">\n          \u003cdiv class=\"pin\" data-idx=\"2\" style=\"top:-6px;right:-6px;\">3\u003c/div>\n          \u003cdiv style=\"font-size:9px;color:#94a3b8;padding:0 4px 3px;\">▼ 수락·거절이 불가한 상태에서만 노출 (아래는 문구 예시 — 실제로는 해당 1건만)\u003c/div>\n          \u003cdiv style=\"font-size:10px;color:#b91c1c;background:#fef2f2;border:1px solid #fecaca;border-radius:6px;padding:5px 8px;\">⚠ 시세 변동으로 게시가 중지되어 이 신청은 종결되었습니다 — 다시 게시하려면 거래의향 등록에서 새로 게시해 주세요\u003c/div>\n          \u003cdiv style=\"font-size:10px;color:#64748b;background:#f1f5f9;border:1px solid #e2e8f0;border-radius:6px;padding:5px 8px;margin-top:4px;\">신청 유효기한이 지나 자동 만료되었습니다 — 게시는 게재중으로 돌아갔습니다\u003c/div>\n        \u003c/div>\n      \u003c/div>\n\n      \u003c!-- 수락·거절 -->\n      \u003cdiv class=\"zone\" data-idx=\"3,4,5,6,7\">\n        \u003cdiv class=\"zone-highlight\">\u003c/div>\n        \u003cdiv class=\"item-area\" data-highlight=\"3\" style=\"position:relative;padding:4px;border-radius:8px;margin-bottom:6px;\">\n          \u003cdiv class=\"pin\" data-idx=\"3\" style=\"top:-6px;right:-6px;\">4\u003c/div>\n          \u003cdiv class=\"kv\">\u003cspan class=\"k\">내 중개 수수료 (거래액 1%)\u003c/span>\u003cspan class=\"v\">8.00 USDT — 수락(확정) 시 발생\u003c/span>\u003c/div>\n        \u003c/div>\n        \u003cdiv style=\"display:flex;gap:8px;\">\n          \u003cdiv class=\"item-area\" data-highlight=\"4\" style=\"position:relative;flex:1;padding:4px;border-radius:8px;\">\n            \u003cdiv class=\"pin\" data-idx=\"4\" style=\"top:-8px;right:-6px;\">5\u003c/div>\n            \u003cdiv class=\"btn primary\">수락\u003c/div>\n          \u003c/div>\n          \u003cdiv class=\"item-area\" data-highlight=\"5\" style=\"position:relative;flex:1;padding:4px;border-radius:8px;\">\n            \u003cdiv class=\"pin\" data-idx=\"5\" style=\"top:-8px;right:-6px;\">6\u003c/div>\n            \u003cdiv class=\"btn danger\">거절\u003c/div>\n          \u003c/div>\n          \u003cdiv class=\"item-area\" data-highlight=\"6\" style=\"position:relative;flex:.6;padding:4px;border-radius:8px;\">\n            \u003cdiv class=\"pin\" data-idx=\"6\" style=\"top:-8px;right:-6px;\">7\u003c/div>\n            \u003cdiv class=\"btn ghost\">취소\u003c/div>\n          \u003c/div>\n        \u003c/div>\n        \u003cdiv class=\"item-area\" data-highlight=\"7\" style=\"position:relative;padding:4px;border-radius:8px;margin-top:4px;\">\n          \u003cdiv class=\"pin\" data-idx=\"7\" style=\"top:-6px;right:-6px;\">8\u003c/div>\n          \u003cdiv style=\"font-size:10px;color:#64748b;\">수락하면 \u003cstrong>거래가 즉시 확정되어 구속력과 수수료 8.00 USDT가 발생\u003c/strong>하고, 별도 확정 절차 없이 이전(정산)으로 진행됩니다. 거절·무응답(기한 경과) 시 자산 이동·수수료 없이 게시는 게재중으로 돌아갑니다.\u003c/div>\n        \u003c/div>\n      \u003c/div>\n\n      \u003c!-- 비참여 고지 -->\n      \u003cdiv class=\"zone\" data-idx=\"8\">\n        \u003cdiv class=\"zone-highlight\">\u003c/div>\n        \u003cdiv class=\"item-area\" data-highlight=\"8\" style=\"position:relative;padding:4px;border-radius:8px;\">\n          \u003cdiv class=\"pin\" data-idx=\"8\" style=\"top:-6px;right:-6px;\">9\u003c/div>\n          \u003cdiv class=\"note-inline reg\">DSRV는 가격 협의에 참여하지 않으며 신청·수락 기록만 보존합니다. 수락 전까지 구속력이 없으며, 수락 시 즉시 확정됩니다.\u003c/div>\n        \u003c/div>\n      \u003c/div>\n    \u003c/div>\n  \u003c/div>\n\n  \u003csvg id=\"connSvg\" style=\"position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:10;overflow:visible;\">\u003c/svg>\n\n  \u003cdiv class=\"items\" id=\"items\">\n    \u003cdiv class=\"nav-global\">\n      \u003cdiv class=\"nav-global-title\">진입 · 전역 이동\u003c/div>\n      \u003cdiv class=\"nav-note\">· \u003cstrong>전역 이동\u003c/strong> 상단 메뉴(GNB) · 기관 배지 · 뒤로가기의 동작은 대시보드(DASH-01)의 표와 같다. 다른 점 = 현재 탭 '교환게시판'을 다시 클릭하면 교환 게시판(BRK-01) 목록으로 간다. 처리하지 않고 나가도 신청은 수락 대기 상태로 남는다.\u003cbr>\n      · \u003cstrong>진입\u003c/strong> 내 게시 상세(BRK-06)의 받은 신청 행 클릭. 이것이 유일한 진입 경로다. 교환 게시판(BRK-01) · 대시보드(DASH-01) · 메일에서 바로 오는 길은 없다(대시보드의 협의중 행도 BRK-06으로 열린다). 진입 시 게시·신청의 최신 상태를 서버에서 조회하며 \"불러오는 중…\"을 보인다.\u003c/div>\n    \u003c/div>\n\n    \u003cdiv class=\"itm\" data-idx=\"0\">\n      \u003cdiv class=\"num\">1\u003c/div>\n      \u003cdiv>\n        \u003cdiv class=\"itm-title\">내 게시 내역 — 공통 포맷 · 게시자 관점 (표시 전용)\u003c/div>\n        \u003cdiv class=\"itm-desc\">\u003cstrong>구성\u003c/strong> kv 8행. '교환거래 요청 내역' 공통 폼을 쓰고 방향·수량은 게시자 기준으로 적는다. BRK-03과 같은 거래를 상대 역할에서 본 화면이다.\u003cbr>\u003cstrong>값\u003c/strong> 게시 상태 칩과 받은 신청 건수(0/1)를 함께 보여준다. 이 화면은 협의중·1건 상태로 진입한다.\u003cbr>\u003cstrong>유효기한\u003c/strong> 게시 유효기한은 게시 시점 + {정책값 30일}(ADM-03)이고, 게시가 만료되면 미처리 신청도 함께 종결한다.\u003cbr>\u003cspan class=\"basis\">근거 F-1b · 공통 포맷 · 09 §0 마목 게시 상태\u003c/span>\u003c/div>\n      \u003c/div>\n    \u003c/div>\n\n    \u003cdiv class=\"itm\" data-idx=\"1\">\n      \u003cdiv class=\"num\">2\u003c/div>\n      \u003cdiv>\n        \u003cdiv class=\"itm-title\">받은 신청 — 신청자 · 시점 · 유효기한 (표시 전용)\u003c/div>\n        \u003cdiv class=\"itm-desc\">\u003cstrong>구성\u003c/strong> kv 5행.\u003cbr>\u003cstrong>마스킹\u003c/strong> 신청자 상호는 확정 전까지 첫 글자만 노출한다(A***). 신청자 상세 화면과 링크는 두지 않는다. KYC 완료와 거래 안전성 검증은 ✓로 표기한다(신청 시점 BRK-03 검증 통과분).\u003cbr>\u003cstrong>시점\u003c/strong> 신청 시점은 접수 시 서버 시각, 신청 유효기한은 접수 + 영업일 {정책값 2영업일}(ADM-03)이다.\u003cbr>\u003cstrong>신청 조건\u003c/strong> 게시 조건 그대로이므로 조건 비교 UI를 두지 않는다(역제안 없음).\u003cbr>\u003cstrong>신청 상태\u003c/strong> 수락 대기 / 만료 / 종결(중지·회수·게시 만료) / 확정 / 거절. 수락 대기가 아니면 항목 3 안내를 띄우고 버튼을 비활성으로 둔다.\u003cbr>\u003cspan class=\"basis\">근거 F-1b · V2(통신중개 아님)\u003c/span>\u003c/div>\n        \u003cdiv class=\"itm-nav\">\u003cspan class=\"nav-tag\">화면 이동 · 인터랙션\u003c/span>\n          \u003cdiv class=\"nav-row\">\u003cspan class=\"nav-el\">(무응답)\u003c/span>\u003cspan class=\"nav-act\">신청 유효기한 경과\u003c/span>\u003cspan class=\"nav-to stay\">자동 만료 — 거절과 동일 효과(신청 종결 · 게시 게재중 복귀 · 자산이동·수수료 없음) · 이 화면 재진입 시 항목 3 안내 + 버튼 비활성\u003c/span>\u003c/div>\n        \u003c/div>\n      \u003c/div>\n    \u003c/div>\n\n    \u003cdiv class=\"itm\" data-idx=\"2\">\n      \u003cdiv class=\"num\">3\u003c/div>\n      \u003cdiv>\n        \u003cdiv class=\"itm-title\">처리 불가 안내 (조건부 노출)\u003c/div>\n        \u003cdiv class=\"itm-desc\">\u003cstrong>노출\u003c/strong> 신청 상태가 '수락 대기'가 아닐 때 해당 1건만 버튼 위에 인라인으로 보인다. 정상 상태에서는 블록 자체가 없고 닫기(×)도 두지 않는다.\u003cbr>\u003cstrong>문구\u003c/strong> 중지·신청 만료·게시 만료·이미 처리·회수 5종을 각각 고정 문구로 쓴다(중지는 재게시 안내, 신청 만료는 게재중 복귀 안내, 이미 처리는 내 게시 상세 확인 안내).\u003cbr>\u003cstrong>동작\u003c/strong> 노출 중에는 [수락]과 [거절]을 모두 비활성으로 둔다. 중지 상태에서는 수락을 허용하지 않는다(중지 = 대기 신청 자동 종결 · 재개는 재게시만).\u003cbr>\u003cspan class=\"basis\">근거 09 §0 마목 게시 상태 개정\u003c/span>\u003c/div>\n        \u003cdiv class=\"itm-nav\">\u003cspan class=\"nav-tag\">화면 이동 · 인터랙션\u003c/span>\n          \u003cdiv class=\"nav-row\">\u003cspan class=\"nav-el\">안내 블록\u003c/span>\u003cspan class=\"nav-act\">클릭\u003c/span>\u003cspan class=\"nav-to stay\">무반응(표시 전용) · 이동은 [취소](항목 7) → BRK-06\u003c/span>\u003c/div>\n        \u003c/div>\n      \u003c/div>\n    \u003c/div>\n\n    \u003cdiv class=\"itm\" data-idx=\"3\">\n      \u003cdiv class=\"num\">4\u003c/div>\n      \u003cdiv>\n        \u003cdiv class=\"itm-title\">내 중개 수수료 (표시 전용)\u003c/div>\n        \u003cdiv class=\"itm-desc\">\u003cstrong>값\u003c/strong> kv 1행. 내가 보내는 자산 수량 × {정책값 1.00%}(ADM-03)를 보내는 자산 자릿수로 절사한다(800 USDT × 1% = 8.00 USDT).\u003cbr>\u003cstrong>노출 범위\u003c/strong> 자기 측 금액만 표시하고 상대측 금액과 회계 계정명은 노출하지 않는다. \"수락(확정) 시 발생\"을 병기한다.\u003cbr>\u003cspan class=\"basis\">근거 09 §0 마목 수수료 · L6 설명의무 · notation 산정값 절사\u003c/span>\u003c/div>\n      \u003c/div>\n    \u003c/div>\n\n    \u003cdiv class=\"itm\" data-idx=\"4\">\n      \u003cdiv class=\"num\">5\u003c/div>\n      \u003cdiv>\n        \u003cdiv class=\"itm-title\">[수락] 버튼\u003cspan class=\"req\">필수\u003c/span>\u003c/div>\n        \u003cdiv class=\"itm-desc\">\u003cstrong>노출\u003c/strong> 항상 보인다.\u003cbr>\u003cstrong>클릭 가능\u003c/strong> 신청 상태가 '수락 대기'일 때만 활성이다. 항목 3 안내가 뜬 상태에서는 비활성이다.\u003cbr>\u003cstrong>확인 사항\u003c/strong> 확인 다이얼로그를 띄운다. 수락은 즉시 확정·구속력·수수료 발생을 낳는 비가역 행위다. 클릭 시 서버가 게시·신청 상태를 다시 판정한다(다른 세션 처리·중지·만료 경쟁).\u003cbr>\u003cstrong>액션\u003c/strong> 거래를 확정하고 BRK-05로 넘긴다. 별도 확정 화면은 두지 않는다. 수락은 게시자의 능동 선택이며 자동 매칭·체결은 없다.\u003cbr>\u003cspan class=\"basis\">근거 V2(시장개설 아님) · L6 §9 · F-4 · 1기관 1가입자\u003c/span>\u003c/div>\n        \u003cdiv class=\"itm-nav\">\u003cspan class=\"nav-tag\">화면 이동 · 인터랙션\u003c/span>\n          \u003cdiv class=\"nav-row\">\u003cspan class=\"nav-el\">[수락] — 활성 조건\u003c/span>\u003cspan class=\"nav-act\">다음이 모두 아님: ①신청 상태가 수락 대기 아님(만료·이미 처리) ②게시 상태가 협의중 아님(중지·회수·완료(만료)) ③게시·신청 조회 실패 ④처리 진행 중(\"수락 중…\"/\"거절 중…\")\u003c/span>\u003cspan class=\"nav-to stay\">하나라도 해당 → 회색 비활성(공통 UI 규격) · 사유는 항목 3 인라인 안내로 노출(툴팁 없음) · 버튼은 비노출이 아니라 비활성으로 유지\u003c/span>\u003c/div>\n          \u003cdiv class=\"nav-row\">\u003cspan class=\"nav-el\">[수락] — 클릭(활성)\u003c/span>\u003cspan class=\"nav-act\">클릭 → \u003cstrong>다이얼로그: 제목 \"신청 수락\" / 본문 \"수락하면 거래가 즉시 확정되어 구속력이 발생하고, 중개 수수료 8.00 USDT(거래액 1%)가 발생합니다. 확정 후에는 취소할 수 없습니다.\" / [수락] [돌아가기]\u003c/strong> → [수락] 클릭 → 버튼 라벨 \"수락 중…\"·[거절]·[취소] 비활성(중복 클릭 차단) → 신청 유효기한·게시 상태·양측 처분 가능분 서버 재검증 → 상태 확정 · 상호 마스킹 해제 · 양측 이메일 ② · ADM-02 처리함 유입\u003c/span>\u003cspan class=\"nav-to\">\u003cstrong>이전·완료(BRK-05)\u003c/strong> — 스텝 '확정 ✓ → 이전 진행(현재)' · [돌아가기] = 다이얼로그 닫힘·화면 잔류·변경 없음\u003c/span>\u003c/div>\n          \u003cdiv class=\"nav-row\">\u003cspan class=\"nav-el\">[수락] — 실패\u003c/span>\u003cspan class=\"nav-act\">재검증 실패: 클릭 사이 신청 만료 · 게시 중지(price guard) · 게시 만료 / 어느 한쪽 처분 가능분 부족(기획 가정 — 상세 5) / 시스템 오류\u003c/span>\u003cspan class=\"nav-to stay\">화면 잔류 · 상태 변경 → 항목 1·2 상태 갱신 + 항목 3 안내 노출 + 버튼 비활성 / 잔고 부족 → 인라인 ⚠ \"거래 안전성 검증에 실패해 수락할 수 없습니다 — 보유·처분 가능 수량을 확인해 주세요\"(상대측 사유 미노출) / 오류 → 상단 배너 \"일시적인 오류입니다. 잠시 후 다시 시도해 주세요\" · 버튼 라벨 복귀\u003c/span>\u003c/div>\n        \u003c/div>\n      \u003c/div>\n    \u003c/div>\n\n    \u003cdiv class=\"itm\" data-idx=\"5\">\n      \u003cdiv class=\"num\">6\u003c/div>\n      \u003cdiv>\n        \u003cdiv class=\"itm-title\">[거절] 버튼\u003cspan class=\"req\">필수\u003c/span>\u003c/div>\n        \u003cdiv class=\"itm-desc\">\u003cstrong>노출\u003c/strong> 항상 보인다.\u003cbr>\u003cstrong>클릭 가능\u003c/strong> 신청 상태가 '수락 대기'일 때만 활성이다.\u003cbr>\u003cstrong>확인 사항\u003c/strong> 확인 다이얼로그와 사유 입력을 두지 않는다(구속력·비가역 행위가 아니고 협상 채널을 열지 않는다).\u003cbr>\u003cstrong>액션\u003c/strong> 신청을 종결하고 게시를 '게재중'으로 되돌려 게시판에 다시 노출한다. 자산 이동과 수수료는 발생하지 않는다.\u003cbr>\u003cspan class=\"basis\">근거 V2(통신중개 아님) · 09 §0 마목 게시 상태\u003c/span>\u003c/div>\n        \u003cdiv class=\"itm-nav\">\u003cspan class=\"nav-tag\">화면 이동 · 인터랙션\u003c/span>\n          \u003cdiv class=\"nav-row\">\u003cspan class=\"nav-el\">[거절] — 활성 조건\u003c/span>\u003cspan class=\"nav-act\">[수락]과 동일: ①수락 대기 아님 ②게시 협의중 아님 ③조회 실패 ④처리 진행 중\u003c/span>\u003cspan class=\"nav-to stay\">하나라도 해당 → 회색 비활성(공통 UI 규격) · 사유는 항목 3 인라인 안내\u003c/span>\u003c/div>\n          \u003cdiv class=\"nav-row\">\u003cspan class=\"nav-el\">[거절] — 클릭(활성)\u003c/span>\u003cspan class=\"nav-act\">클릭 → 확인 없음 → 버튼 라벨 \"거절 중…\"·[수락]·[취소] 비활성 → 신청 상태 거절(종결) · 게시 상태 게재중 복귀 · 신청자 통지(BRK-07 상태 · DASH-01 — 메일 여부 \u003cspan class=\"chk\">[확인필요: 거절 통지 메일 — 4종에 없음]\u003c/span>)\u003c/span>\u003cspan class=\"nav-to\">\u003cstrong>내 게시 상세·회수(BRK-06)\u003c/strong> — 상태 '게재중 · 받은 신청 0건'(빈 상태) · 별도 토스트 없음(기획 가정)\u003c/span>\u003c/div>\n          \u003cdiv class=\"nav-row\">\u003cspan class=\"nav-el\">[거절] — 실패\u003c/span>\u003cspan class=\"nav-act\">클릭 사이 신청 만료·게시 중지·회수(이미 종결) / 시스템 오류\u003c/span>\u003cspan class=\"nav-to stay\">화면 잔류 · 이미 종결 → 항목 3 안내 + 버튼 비활성(결과는 동일하므로 오류 배너 없음) / 오류 → 상단 배너 \"일시적인 오류입니다. 잠시 후 다시 시도해 주세요\" · 버튼 라벨 복귀\u003c/span>\u003c/div>\n        \u003c/div>\n      \u003c/div>\n    \u003c/div>\n\n    \u003cdiv class=\"itm\" data-idx=\"6\">\n      \u003cdiv class=\"num\">7\u003c/div>\n      \u003cdiv>\n        \u003cdiv class=\"itm-title\">[취소] 버튼\u003c/div>\n        \u003cdiv class=\"itm-desc\">\u003cstrong>노출\u003c/strong> 항상 보인다.\u003cbr>\u003cstrong>클릭 가능\u003c/strong> 항상 활성이다.\u003cbr>\u003cstrong>확인 사항\u003c/strong> 없다.\u003cbr>\u003cstrong>액션\u003c/strong> 처리 없이 내 게시 상세(BRK-06)로 돌아간다. 신청은 수락 대기로 유지되어 유효기한 내 다시 처리할 수 있다. \u003cspan class=\"chk\">[확인필요: notation 종료 동선 표에 BRK-04 [취소] → BRK-06 추가]\u003c/span>\u003cbr>\u003cspan class=\"basis\">근거 notation 종료 동선\u003c/span>\u003c/div>\n        \u003cdiv class=\"itm-nav\">\u003cspan class=\"nav-tag\">화면 이동 · 인터랙션\u003c/span>\n          \u003cdiv class=\"nav-row\">\u003cspan class=\"nav-el\">[취소] — 활성 조건\u003c/span>\u003cspan class=\"nav-act\">항상 활성(\"수락 중…\"/\"거절 중…\" 동안만 비활성) — 처리 불가 상태에서도 활성(유일한 화면 내 이탈 수단)\u003c/span>\u003cspan class=\"nav-to stay\">—\u003c/span>\u003c/div>\n          \u003cdiv class=\"nav-row\">\u003cspan class=\"nav-el\">[취소] — 클릭(활성)\u003c/span>\u003cspan class=\"nav-act\">클릭 → 확인 없음 → 처리 없음\u003c/span>\u003cspan class=\"nav-to\">\u003cstrong>내 게시 상세·회수(BRK-06)\u003c/strong> — 받은 신청 1건 목록 유지\u003c/span>\u003c/div>\n          \u003cdiv class=\"nav-row\">\u003cspan class=\"nav-el\">[취소] — 실패\u003c/span>\u003cspan class=\"nav-act\">해당 없음(서버 호출 없음)\u003c/span>\u003cspan class=\"nav-to stay\">—\u003c/span>\u003c/div>\n        \u003c/div>\n      \u003c/div>\n    \u003c/div>\n\n    \u003cdiv class=\"itm\" data-idx=\"7\">\n      \u003cdiv class=\"num\">8\u003c/div>\n      \u003cdiv>\n        \u003cdiv class=\"itm-title\">단독 실행 결과 고지 (표시 전용)\u003c/div>\n        \u003cdiv class=\"itm-desc\">\u003cstrong>문구\u003c/strong> 버튼 아래에 결과 고지 1문장을 상시 노출한다(즉시 확정·구속력·수수료). 수수료 금액은 항목 4 값을 쓴다.\u003cbr>\u003cstrong>내용\u003c/strong> 거절·무응답 결과(자산 이동·수수료 없음 · 게재중 복귀)를 함께 적는다. 승인자 지정과 2단계 승인 UI는 두지 않는다(1기관 1가입자).\u003cbr>\u003cspan class=\"basis\">근거 notation 단독 실행 표기 · L6 설명의무\u003c/span>\u003c/div>\n      \u003c/div>\n    \u003c/div>\n\n    \u003cdiv class=\"itm\" data-idx=\"8\">\n      \u003cdiv class=\"num\">9\u003c/div>\n      \u003cdiv>\n        \u003cdiv class=\"itm-title\">\"DSRV 비참여·기록만\" 고지 (표시 전용)\u003c/div>\n        \u003cdiv class=\"itm-desc\">\u003cstrong>문구\u003c/strong> 고정. BRK-03·07과 같은 문구로 가격 불관여와 당사자성을 적는다. 신청·수락·거절 기록은 15년 보존한다. 변경은 법무 확인 후에 한다.\u003cbr>\u003cspan class=\"basis\">근거 V2 · L6 §9 · [로펌게이트] 비참여 범위\u003c/span>\u003c/div>\n      \u003c/div>\n    \u003c/div>\n  \u003c/div>\n\n\u003c/div>\n\n\u003csection class=\"footer-note\" style=\"padding-bottom:0;\">\n  \u003cdiv class=\"note-card\">\n    \u003cdiv class=\"note-title\">상세내용\u003c/div>\n    \u003cdiv class=\"detail-grid\" id=\"detailCol\">\n      \u003cdiv class=\"dtl\" data-idx=\"0\">\n        \u003cdiv class=\"detail-label\">\u003cspan class=\"dtl-num\">1\u003c/span>역할별 화면 분리 · 진입 경로\u003c/div>\n      \u003cdiv class=\"dtl-body\">\u003cspan class=\"box\">· 게시자: BRK-02 게시 → BRK-06 내 게시 상세(허브 · 회수) → \u003cstrong>BRK-04 받은 신청·수락\u003c/strong>(신청 1건 처리) → BRK-05 이전·완료 / 신청자: BRK-03 → BRK-07 → BRK-05(양측 공용)\u003cbr>· BRK-04 진입은 BRK-06 신청 행 클릭만 — BRK-01·DASH-01·이메일에서 직행 없음(2026-09-02 · 종전 BRK-01 직행 폐기) · 종전 \"BRK-04 vs BRK-06 복수 신청 목록 위치\" 충돌은 동시 신청 1건 규칙으로 소멸(목록은 BRK-06, 처리는 BRK-04)\u003cbr>· 수락/거절 행위자는 게시자 측 계정(가입자 1인)으로 AUDIT_LOG 기록 — 단독 실행이므로 행위자·시각 기록이 유일 증적\u003c/span>\u003c/div>\n      \u003c/div>\n      \u003cdiv class=\"dtl\" data-idx=\"2\">\n        \u003cdiv class=\"detail-label\">\u003cspan class=\"dtl-num\">3\u003c/span>상태 변형 표 — 진입 시 상태별 화면\u003c/div>\n      \u003cdiv class=\"dtl-body\">\u003cspan class=\"box\">· \u003cstrong>수락 대기\u003c/strong>(정상): 안내 없음 · [수락]·[거절] 활성 · 상태 행 '협의중 · 1건'\u003cbr>· \u003cstrong>신청 만료\u003c/strong>: 안내(만료) · 버튼 비활성 · 게시 상태 게재중 · BRK-06 목록에 '만료'로 잔존(선택 불가)\u003cbr>· \u003cstrong>중지\u003c/strong>(price guard): 안내(중지) · 버튼 비활성 · 게시 상태 중지 · 재개 = BRK-02 재게시 — 중지 중 수락 불가 확정(2026-09-02)\u003cbr>· \u003cstrong>게시 만료\u003c/strong>: 안내(게시 만료) · 버튼 비활성 · 게시 상태 완료(유효기간 만료)\u003cbr>· \u003cstrong>회수\u003c/strong>(BRK-06에서 게시 내리기 — 대기 신청 자동 종결): 안내(회수) · 버튼 비활성\u003cbr>· \u003cstrong>이미 처리\u003c/strong>(다른 세션): 확정이면 안내 + BRK-05 이동은 BRK-06 상태 행 링크로 / 거절이면 안내 · 버튼 비활성\u003cbr>· 어느 상태든 [취소] → BRK-06 활성\u003c/span>\u003c/div>\n      \u003c/div>\n      \u003cdiv class=\"dtl\" data-idx=\"4\">\n        \u003cdiv class=\"detail-label\">\u003cspan class=\"dtl-num\">5\u003c/span>수락 시 재검증 · 이메일 ② 수락·확정 (수신: 양측)\u003c/div>\n      \u003cdiv class=\"dtl-body\">\u003cspan class=\"box\">· 재검증 항목: 신청 유효기한 · 게시 상태(협의중) · 양측 처분 가능분(게시자 800 USDT · 신청자 798.40 USDC) — 신청 시점 검증(BRK-03)의 보완 \u003cspan class=\"chk\">[확인필요: 수락 시 양측 잔고 재검증 채택 여부 — 기획 가정]\u003c/span> · 실패 문구에 상대측 사유 미노출\u003cbr>· 확정 시: 상호 마스킹 해제(양측) · 게시 상태 확정 · DSRV 확인 건 ADM-02 처리함 유입 · 콜드 수동 집행(BRK-05)\u003cbr>· \u003cstrong>[이메일 ② 수락·확정 (수신: 양측)]\u003c/strong> 제목 \"[DSRV] 교환 거래 확정 — BRK-20260830-0027\" · 본문: \"게시자가 신청을 수락하여 거래가 확정되었습니다. 구속력이 발생하며 이전(정산) 절차가 시작됩니다.\" + 확정 조건(공통 포맷: 요청번호·교환쌍·방향·800 USDT ↔ 798.40 USDC·0.9980 USDC/USDT) · 거래 상대방 상호(확정으로 마스킹 해제) · 중개 수수료(거래액 1% · 자기 측 금액만 — 게시자 8.00 USDT / 신청자 7.98 USDC) · 다음 단계(커스터디 콜드 이전 — 정산 배치 1영업일 3회, 완료 시 재안내) — 발신전용·링크 미포함 등 공통 원칙은 BRK-03 상세 4\u003c/span>\u003c/div>\n      \u003c/div>\n      \u003cdiv class=\"dtl\" data-idx=\"5\">\n        \u003cdiv class=\"detail-label\">\u003cspan class=\"dtl-num\">6\u003c/span>거절·만료 처리\u003c/div>\n      \u003cdiv class=\"dtl-body\">\u003cspan class=\"box\">· 거절/만료된 신청 → 신청 종결 · 게시 상태 '게재중' 복귀(게시판 재노출 · 다른 기관 신청 가능) · 자산이동·수수료 없음 · BRK-06 목록에 '거절'/'만료'로 잔존(선택 불가)\u003cbr>· 거절 사유 입력 없음(협상·개입 소지 차단) · 거절 확인 다이얼로그 없음(공통 UI 규격)\u003cbr>· 신청자 통지: BRK-07 상태(거절/만료) · DASH-01 거래 내역 — 이메일 4종(①접수 ②확정 ③완료 ④회수)에 거절·만료 없음 \u003cspan class=\"chk\">[확인필요: 거절·만료 통지 메일 추가 여부]\u003c/span>\u003cbr>· 게시 유효기간 만료 시 게시 자체 종료 → 완료(유효기간 만료) · 미처리 신청도 함께 종결\u003c/span>\u003c/div>\n      \u003c/div>\n    \u003c/div>\n  \u003c/div>\n\u003c/section>\n\n\u003csection class=\"footer-note\">\n  \u003cdiv class=\"note-card\">\n    \u003cdiv class=\"note-title\">비고\u003c/div>\n    \u003cdiv class=\"note-body\">\n      · \u003cstrong>[방어 핵심]\u003c/strong> 수락은 게시자의 \u003cstrong>능동 행위\u003c/strong> — 자동 매칭·자동 체결 없음(시장개설 아님). DSRV는 가격에 관여하지 않고 기록만 보존.\u003cbr>\n      · 수락은 가입자 단독 실행이지만 확정 건의 DSRV 확인(ADM-02 처리함)·콜드 2인 멀티시그 집행 서명은 유지.\u003cbr>\n      · 2026-09-02 변경: 게시당 동시 신청 1건 → 이 화면 = 그 1건 수락/거절(복수 신청 목록·선착순/선택 이슈 소멸) · 중지(price guard) 상태 수락 불가 확정 · [수락] 확인 다이얼로그 문구 확정 · [거절] 확인 없음 명시 · [취소] → BRK-06 추가 · 상태 변형 표(상세 3).\u003cbr>\n      · 2026-09-02 설명 형식 개정 적용(핀 = 조작 요소 단위) — 표시 4·조건부 1·버튼 3·고지 1 9핀 · 예시 800 USDT ↔ 798.40 USDC · 수수료 8.00 USDT.\u003cbr>\n      · \u003cspan class=\"chk\">[확인필요]\u003c/span> 수락 시 양측 잔고 재검증 채택 · 거절·만료 통지 메일.\u003cbr>\n      · 다음: 수락 → 이전·완료 (BRK-05) / 거절·[취소] → 내 게시 상세·회수 (BRK-06)\n    \u003c/div>\n  \u003c/div>\n\u003c/section>\n\n\u003cscript src=\"screen.js\">\u003c/script>\n\u003c/body>\n\u003c/html>\n", "brk-05.html": "\u003c!DOCTYPE html>\n\u003chtml lang=\"ko\">\n\u003chead>\n\u003cmeta charset=\"UTF-8\">\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n\u003ctitle>화면기획 — 이전·완료\u003c/title>\n\u003clink rel=\"stylesheet\" href=\"screen.css\">\n\u003c/head>\n\u003cbody>\n\n\u003cheader class=\"header\">\n  \u003cdiv class=\"crumb\">\u003cspan>마목 중개\u003c/span>\u003cspan class=\"s\">›\u003c/span>\u003cspan>교환게시판\u003c/span>\u003cspan class=\"s\">›\u003c/span>\u003cspan>이전·완료\u003c/span>\u003c/div>\n  \u003ch1 class=\"title\">이전·완료\u003c/h1>\n  \u003cspan class=\"sid\">BRK-05\u003c/span>\n  \u003cspan class=\"defense\">정산 연계 · 완결성 담보\u003c/span>\n\u003c/header>\n\n\u003cdiv class=\"main\">\n  \u003cdiv class=\"screen-panel\">\n    \u003cdiv style=\"position:relative;display:flex;\">\n      \u003cdiv class=\"labels\" id=\"labels\">\n        \u003cdiv class=\"lbl\">\u003cspan class=\"lbl-text\">전역\u003cbr>상단\u003c/span>\u003c/div>\n        \u003cdiv class=\"lbl\">\u003cspan class=\"lbl-text\">거래 내역\u003c/span>\u003c/div>\n        \u003cdiv class=\"lbl\">\u003cspan class=\"lbl-text\">이전 진행\u003c/span>\u003c/div>\n        \u003cdiv class=\"lbl\">\u003cspan class=\"lbl-text\">수수료\u003c/span>\u003c/div>\n        \u003cdiv class=\"lbl\">\u003cspan class=\"lbl-text\">결과 안내\u003c/span>\u003c/div>\n        \u003cdiv class=\"lbl\">\u003cspan class=\"lbl-text\">확인\u003c/span>\ :40\u003c/span>\u003c/div>\n          \u003cdiv class=\"kv\">\u003cspan class=\"k\">나 → 상대(B사) · 798.40 USDC\u003c/span>\u003cspan class=\"v\">이전 대기 · 다음 정산 배치 편입\u003c/span>\u003c/div>\n          \u003cdiv class=\"kv\">\u003cspan class=\"k\">이전 완결성\u003c/span>\u003cspan class=\"v\" style=\"color:#16a34a;\">양건 확인 완료 · 2026-09-02 17:30\u003c/span>\u003c/div>\n          \u003cdiv class=\"kv\">\u003cspan class=\"k\">트래블룰\u003c/span>\u003cspan class=\"v\" style=\"color:#16a34a;\">양측 송·수신인 정보 확인 완료\u003c/span>\u003c/div>\n        \u003c/div>\n      \u003c/div>\n\n      \u003c!-- 수수료 -->\n      \u003cdiv class=\"zone\" data-idx=\"3\">\n        \u003cdiv class=\"zone-highlight\">\u003c/div>\n        \u003cdiv class=\"item-area\" data-highlight=\"3\" style=\"position:relative;padding:4px;border-radius:8px;\">\n          \u003cdiv class=\"pin\" data-idx=\"3\" style=\"top:-6px;right:-6px;\">4\u003c/div>\n          \u003cdiv class=\"kv\">\u003cspan class=\"k\">내 중개 수수료 (거래액 1% 고정)\u003c/span>\u003cspan class=\"v\">7.98 USDC \u003cspan style=\"color:#94a3b8;\">(내가 보내는 798.40 USDC 기준) — 확정으로 발생 · 이전 시 정산\u003c/span>\u003c/span>\u003c/div>\n        \u003c/div>\n      \u003c/div>\n\n      \u003c!-- 결과 안내 (조건부) -->\n      \u003cdiv class=\"zone\" data-idx=\"4\">\n        \u003cdiv class=\"zone-highlight\">\u003c/div>\n        \u003cdiv class=\"item-area\" data-highlight=\"4\" style=\"position:relative;padding:4px;border-radius:8px;\">\n          \u003cdiv class=\"pin\" data-idx=\"4\" style=\"top:-6px;right:-6px;\">5\u003c/div>\n          \u003cdiv style=\"font-size:9px;color:#94a3b8;padding:0 4px 2px;\">▼ 상태 '완료'·'이전 보류'·'이전 중지'에서만 노출 (목업 상태 '이전 진행'에서는 없음 · 아래는 완료 예시)\u003c/div>\n          \u003cdiv class=\"c-banner\" style=\"border-radius:8px;background:#f0fdf4;color:#15803d;border:1px solid #86efac;\">✓ 거래가 완료되었습니다 — 완료 일시 2026-09-03 14:10 · 상세 내역은 대시보드 &gt; 거래 내역에서 확인할 수 있습니다\u003c/div>\n        \u003c/div>\n      \u003c/div>\n\n      \u003c!-- 확인 -->\n      \u003cdiv class=\"zone\" data-idx=\"5\">\n        \u003cdiv class=\"zone-highlight\">\u003c/div>\n        \u003cdiv class=\"item-area\" data-highlight=\"5\" style=\"position:relative;padding:4px;border-radius:8px;\">\n          \u003cdiv class=\"pin\" data-idx=\"5\" style=\"top:-8px;right:-6px;\">6\u003c/div>\n          \u003cdiv class=\"btn primary\">확인\u003c/div>\n        \u003c/div>\n      \u003c/div>\n    \u003c/div>\n  \u003c/div>\n\n  \u003csvg id=\"connSvg\" style=\"position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:10;overflow:visible;\">\u003c/svg>\n\n  \u003cdiv class=\"items\" id=\"items\">\n    \u003cdiv class=\"nav-global\">\n      \u003cdiv class=\"nav-global-title\">진입 · 전역 이동\u003c/div>\n      \u003cdiv class=\"nav-note\">· \u003cstrong>전역 이동\u003c/strong> 상단 메뉴(GNB) · 기관 배지 · 뒤로가기의 동작은 대시보드(DASH-01)의 표와 같다. 다른 점 = 현재 탭 '교환게시판'을 다시 클릭하면 교환 게시판(BRK-01) 목록으로 간다. 조회 화면이라 버릴 입력값이 없다. '대시보드' 탭과 로고는 [확인]과 같은 목적지인 대시보드(DASH-01)로 간다.\u003cbr>\n      · \u003cstrong>진입\u003c/strong> (게시자) 받은 신청·수락(BRK-04) [신청 수락] 확정 직후 / 내 게시 상세(BRK-06) [이전 진행 보기 →] · (신청자) 내 신청 상세(BRK-07) [이전 진행 보기 →] · (양측) 대시보드(DASH-01) 거래 목록의 마목 확정·완료 행 클릭 / 확정·완료 메일을 받은 뒤 콘솔에 직접 접속(메일 본문에 링크 없음). 게시자와 신청자가 각자 콘솔에서 같은 게시번호로 이 화면을 연다. 진입 시 서버에서 최신 상태를 조회하고 머무는 동안 자동 갱신은 없다.\u003c/div>\n    \u003c/div>\n\n    \u003cdiv class=\"itm\" data-idx=\"0\">\n      \u003cdiv class=\"num\">1\u003c/div>\n      \u003cdiv>\n        \u003cdiv class=\"itm-title\">확정 거래 내역 — 공통 포맷 (표시 전용)\u003c/div>\n        \u003cdiv class=\"itm-desc\">\u003cstrong>구성\u003c/strong> '교환거래 요청 내역' 공통 폼(게시번호 · 교환쌍·방향 · 보내는 수량 · 받는 수량 · 비율)에 내 기준 · 거래 상대방 · 확정 일시 3행을 덧붙인다. 앞부분 방향·수량은 게시자 기준 그대로 두고 라벨에 \"(게시 기준)\"·\"(게시자)\"를 부기한다.\u003cbr>\u003cstrong>내 기준\u003c/strong> 1행으로 「내가 보내는 {수량} {자산} → 받는 {수량} {자산}」을 적는다. 게시자 콘솔에서는 게시 방향과 같고 신청자 콘솔에서는 역방향이다. 항목 3 이전 지시와 항목 4 수수료의 기준 수량이 이 값이다.\u003cbr>\u003cstrong>상대방\u003c/strong> 확정으로 마스킹을 해제한 상호 전문과 역할을 적는다. 확정 일시는 게시자 [수락] 시각이다(YYYY-MM-DD HH:MM).\u003cbr>\u003cstrong>자릿수\u003c/strong> ETH 4 / USDC·USDT 2, 비율은 스테이블 페어 4자리와 ETH 페어 {스테이블}/ETH 2자리.\u003cbr>\u003cstrong>상태\u003c/strong> 로딩은 \"불러오는 중…\"이고 3초 초과 시 상단 배너와 값 \"—\"로 넘기되 [확인]은 활성으로 남긴다.\u003cbr>\u003cstrong>수수료\u003c/strong> 별도 정산이다(2026-09-02 결정). 표시 수량은 게시 조건 그대로이고 수수료를 차감하지 않는다 — 라벨에 \"세전/세후\" 부기를 두지 않는다.\u003cbr>\u003cspan class=\"basis\">근거 F-1b · 공통 포맷 · notation 채번·자릿수\u003c/span>\u003c/div>\n      \u003c/div>\n    \u003c/div>\n\n    \u003cdiv class=\"itm\" data-idx=\"1\">\n      \u003cdiv class=\"num\">2\u003c/div>\n      \u003cdiv>\n        \u003cdiv class=\"itm-title\">이전 스텝바 — 확정 → 양건 확인 → 이전 진행 → 완료 (표시 전용)\u003c/div>\n        \u003cdiv class=\"itm-desc\">\u003cstrong>구성\u003c/strong> 4단계 고정(확정 → 양건 확인 → 이전 진행 → 완료). 완료 스텝은 ✓ 초록, 현재 스텝은 파랑 강조, 미도달은 회색으로 두고 스텝 클릭은 동작시키지 않는다. 일시는 스텝바가 아니라 항목 3 행에 적는다.\u003cbr>\u003cstrong>상태 변형\u003c/strong> ① 확정 = 스텝 1 ✓ · 스텝 2 진행 · 항목 3 두 방향 \"이전 대기\" ② 양건 확인 완료 = 스텝 2 ✓ · 스텝 3 진행 · 완결성 행에 일시 ③ 이전 진행 = 스텝 3 진행(한쪽 완료·다른 쪽 대기 가능) ④ 완료 = 스텝 4 ✓ · 항목 5 완료 배너 · 이메일 ③ · 게시·신청 상태 완료 ⑤ 이전 보류 = 진행 스텝에서 정지(회색 테두리) · 항목 5 보류 배너 · 사유 미노출 ⑥ 이전 중지 = 정지 · 중지 배너 · 역이전 시 항목 3 행에 \"역이전 완료 · {일시}\".\u003cbr>\u003cstrong>노출 범위\u003c/strong> 내부 단계는 노출하지 않고 ADM-02 T2 도메인 상태를 고객 라벨로 변환해 보여준다(상세 2).\u003cbr>\u003cspan class=\"basis\">근거 커스터디 콜드 출고 절차 · ISMS 2.7.2 · states.html T2\u003c/span>\u003c/div>\n      \u003c/div>\n    \u003c/div>\n\n    \u003cdiv class=\"itm\" data-idx=\"2\">\n      \u003cdiv class=\"num\">3\u003c/div>\n      \u003cdiv>\n        \u003cdiv class=\"itm-title\">양측 이전 지시 상태 · 완결성 · 트래블룰 (표시 전용)\u003c/div>\n        \u003cdiv class=\"itm-desc\">\u003cstrong>구성\u003c/strong> 4행 고정 — ① 상대 → 나 ② 나 → 상대 ③ 이전 완결성 ④ 트래블룰.\u003cbr>\u003cstrong>①② 값\u003c/strong> 「이전 대기 · 다음 정산 배치 편입」 / 「이전 진행 · {배치 일시}」 / 「이전 완료 · {일시}」(초록) / 「이전 보류」 / 「역이전 완료 · {일시}」 중 하나. tx 해시·지갑 주소·회계 계정명·시세 소스명은 넣지 않는다.\u003cbr>\u003cstrong>③ 완결성\u003c/strong> 「양건 확인 대기」 → 「양건 확인 완료 · {일시}」. 양쪽 조건(잔고·한도·트래블룰)을 함께 확인한 뒤에만 이전을 시작해 한쪽만 이전되는 것을 막는다. 확인이 실패하면 보류 상태로 둔다.\u003cbr>\u003cstrong>④ 트래블룰\u003c/strong> 「양측 송·수신인 정보 확인 중」 → 「확인 완료」. 미완료면 완결성 확인을 대기 상태로 유지하고 사유 문구는 일반화한다.\u003cbr>\u003cstrong>갱신\u003c/strong> 정산 배치(1영업일 3회 · 콜드 2인 서명) 반영 시점에 값이 바뀐다. 화면 체류 중 자동 갱신은 없고 재진입 시 반영한다. \u003cspan class=\"chk\">[확인필요: 배치 시각·마감 기준]\u003c/span>\u003cbr>\u003cspan class=\"basis\">근거 L2 §10의10(트래블룰) · ISMS 2.7.2 · 공통 UI 규격 고객 화면 미노출\u003c/span>\u003c/div>\n      \u003c/div>\n    \u003c/div>\n\n    \u003cdiv class=\"itm\" data-idx=\"3\">\n      \u003cdiv class=\"num\">4\u003c/div>\n      \u003cdiv>\n        \u003cdiv class=\"itm-title\">내 중개 수수료 (표시 전용)\u003c/div>\n        \u003cdiv class=\"itm-desc\">\u003cstrong>값\u003c/strong> 수수료율은 {정책값 1.00%}(ADM-03 · 거래액 기준 고정)이고 양 당사자가 각자 부담한다. 기준은 각자 보내는 자산 수량(항목 1 내 기준 행)이며 각 자산 자릿수로 절사한다 — 신청자 798.40 USDC × 1% = 7.98 USDC, 게시자 800 USDT × 1% = 8.00 USDT.\u003cbr>\u003cstrong>노출 범위\u003c/strong> 자기 측 금액만 보여주고 상대측 금액과 회계 계정명(중개수익)은 넣지 않는다. 구분회계는 ADM-02 CSV에서만 본다. 거래보고서·영수증은 발급하지 않는다.\u003cbr>\u003cstrong>접미\u003c/strong> 확정 시 「확정으로 발생 · 이전 시 정산」, 완료 시 「정산 완료」, 이전 중지 시 「정산 여부 안내 예정」. \u003cspan class=\"chk\">[확인필요: 이전 중지 건 수수료 처리]\u003c/span>\u003cbr>\u003cspan class=\"basis\">근거 L6 §9 · V11 · 09 §0 마목 수수료 · notation 절사\u003c/span>\u003c/div>\n      \u003c/div>\n    \u003c/div>\n\n    \u003cdiv class=\"itm\" data-idx=\"4\">\n      \u003cdiv class=\"num\">5\u003c/div>\n      \u003cdiv>\n        \u003cdiv class=\"itm-title\">결과 안내 배너 (조건부 노출)\u003c/div>\n        \u003cdiv class=\"itm-desc\">\u003cstrong>노출\u003c/strong> 완료·이전 보류·이전 중지 세 상태에서만 보인다. 진행 중에는 띄우지 않고 닫기(×)도 두지 않는다.\u003cbr>\u003cstrong>문구\u003c/strong> 완료는 초록으로 완료 일시와 대시보드 안내를, 이전 보류는 노랑으로 재개 시 이메일 안내를, 이전 중지는 빨강으로 처리 결과 이메일 안내를 쓴다. 내부 사유와 AML 심사 내용은 넣지 않는다.\u003cbr>\u003cspan class=\"chk\">[확인필요: 이전 중지 고객 문구 · 통지 이메일 규격(공통 6종에 미포함)]\u003c/span>\u003cbr>\u003cspan class=\"basis\">근거 공통 UI 규격 오류 문구 · states.html T2\u003c/span>\u003c/div>\n      \u003c/div>\n    \u003c/div>\n\n    \u003cdiv class=\"itm\" data-idx=\"5\">\n      \u003cdiv class=\"num\">6\u003c/div>\n      \u003cdiv>\n        \u003cdiv class=\"itm-title\">[확인] 버튼 — 마목 flow 종료 동선\u003c/div>\n        \u003cdiv class=\"itm-desc\">\u003cstrong>노출\u003c/strong> 항상 보인다.\u003cbr>\u003cstrong>클릭 가능\u003c/strong> 항상 활성이다. 이전이 진행 중이어도 누를 수 있다.\u003cbr>\u003cstrong>확인 사항\u003c/strong> 없다. 서버를 호출하지 않고 이전 상태와도 무관하다.\u003cbr>\u003cstrong>액션\u003c/strong> 대시보드로 이동한다. 재진입은 DASH-01 거래 목록에서 한다.\u003cbr>\u003cspan class=\"basis\">근거 공통 UI 규격 종료 동선\u003c/span>\u003c/div>\n        \u003cdiv class=\"itm-nav\">\u003cspan class=\"nav-tag\">화면 이동 · 인터랙션\u003c/span>\n          \u003cdiv class=\"nav-row\">\u003cspan class=\"nav-el\">[확인] — 활성 조건\u003c/span>\u003cspan class=\"nav-act\">비활성 조건 없음 — 이전 상태(①~⑥)·로딩·조회 실패와 무관하게 상시 활성(조회 화면의 종료 동선)\u003c/span>\u003cspan class=\"nav-to stay\">항상 활성 · 회색 비활성 상태 없음\u003c/span>\u003c/div>\n          \u003cdiv class=\"nav-row\">\u003cspan class=\"nav-el\">[확인] — 클릭(활성)\u003c/span>\u003cspan class=\"nav-act\">클릭 · 확인 없음 · 로딩 없음(서버 호출 없는 화면 이동)\u003c/span>\u003cspan class=\"nav-to\">\u003cstrong>대시보드(DASH-01)\u003c/strong> — 진행 중 건은 거래 목록의 마목 행에서 재진입(BRK-05 직행)\u003c/span>\u003c/div>\n          \u003cdiv class=\"nav-row\">\u003cspan class=\"nav-el\">[확인] — 실패\u003c/span>\u003cspan class=\"nav-act\">실패 케이스 없음(서버 호출 없음)\u003c/span>\u003cspan class=\"nav-to stay\">해당 없음 · 세션 만료 시에만 공통 규격에 따라 로그인(AUTH-01)\u003c/span>\u003c/div>\n        \u003c/div>\n      \u003c/div>\n    \u003c/div>\n  \u003c/div>\n\n\u003c/div>\n\n\u003csection class=\"footer-note\" style=\"padding-bottom:0;\">\n  \u003cdiv class=\"note-card\">\n    \u003cdiv class=\"note-title\">상세내용\u003c/div>\n    \u003cdiv class=\"detail-grid\" id=\"detailCol\">\n      \u003cdiv class=\"dtl\" data-idx=\"1\">\n        \u003cdiv class=\"detail-label\">\u003cspan class=\"dtl-num\">2\u003c/span>고객 표시 상태 ↔ ADM-02 T2 도메인 상태 매핑\u003c/div>\n      \u003cdiv class=\"dtl-body\">\u003cspan class=\"box\">· T2 확인 대기 / 에스컬레이션 → 고객 「확정」(스텝 2 진행) — 내부 심사 단계 미노출 · T2 승인 → 「양건 확인 완료」(스텝 3 진행) · 정산 배치 실행 → 항목 3 방향별 「이전 완료」 · T2 완료 → 「완료」(스텝 4) · T2 보류 → 「이전 보류」(배너, 사유 일반화) · T2 이전 중지 → 「이전 중지」(배너)\u003cbr>· 고객 라벨 enum: CONFIRMED · VERIFIED · TRANSFERRING · COMPLETED · ON_HOLD · STOPPED \u003cspan class=\"chk\">[확인필요: 고객 화면 상태 enum 확정 — states.html 고객 도메인 섹션]\u003c/span>\u003cbr>· 정산 연계 운영절차(4요소③): 양건 조건 동시 확인 → 순차 콜드 출고(2인 서명) · 각 단계 감사로그·해시 기록 · 일방 이전 후 상대방 이전 실패 → \u003cstrong>거래 홀드\u003c/strong> + 역이전(원상 복구) → 완결성 KPI·이상징후로 ADM-02 워닝 — 고객 화면에는 「이전 중지」 + 「역이전 완료」 행으로만 표시\u003c/span>\u003c/div>\n      \u003c/div>\n      \u003cdiv class=\"dtl\" data-idx=\"3\">\n        \u003cdiv class=\"detail-label\">\u003cspan class=\"dtl-num\">4\u003c/span>구분회계 처리 (고객 화면 미노출)\u003c/div>\n      \u003cdiv class=\"dtl-body\">\u003cspan class=\"box\">· 중개 수수료 수익은 나목 스프레드 수익과 분리한 내부 구분회계 계정으로 처리 — 계정명은 고객 화면 어디에도 표시하지 않음(2026-09-02 확정 · 종전 계정명 행 제거)\u003cbr>· 구분회계 CSV·3면 대사 CSV(ADM-02)에 반영 · 수수료는 별도 정산으로 확정(2026-09-02) — 항목 1 수량 라벨과 항목 4 접미에 세전/세후 부기를 두지 않는다\u003c/span>\u003c/div>\n      \u003c/div>\n      \u003cdiv class=\"dtl\" data-idx=\"4\">\n        \u003cdiv class=\"detail-label\">\u003cspan class=\"dtl-num\">5\u003c/span>이메일 알림 ③ 거래 완료 (수신: 양측)\u003c/div>\n      \u003cdiv class=\"dtl-body\">\u003cspan class=\"box\">· 발송 시점: 양측 콜드 이전 완결(완결성 확인) 시 — 상태 ④ 완료 전이와 동시\u003cbr>· 제목: [DSRV] 교환 거래 완료 — BRK-20260902-0001\u003cbr>· 본문: \"교환 거래의 이전(정산)이 완료되었습니다.\" + 완료 일시 · 거래 내역(공통 포맷: 게시번호·교환쌍·방향·수량·비율) · 중개 수수료 정산액(자기 측만 표기) + \"상세 내역은 DSRV Desk &gt; 대시보드 &gt; 거래 내역에서 확인해 주세요.\"\u003cbr>· 공통 원칙(발신전용·링크 미포함·심사 내용 미포함)은 BRK-03 상세 참조 · 보류·중지 통지는 공통 4종에 미포함 \u003cspan class=\"chk\">[확인필요]\u003c/span>\u003c/span>\u003c/div>\n      \u003c/div>\n    \u003c/div>\n  \u003c/div>\n\u003c/section>\n\n\u003csection class=\"footer-note\">\n  \u003cdiv class=\"note-card\">\n    \u003cdiv class=\"note-title\">비고\u003c/div>\n    \u003cdiv class=\"note-body\">\n      · 마목 중개 flow 종료 화면. \u003cstrong>[방어 핵심]\u003c/strong> ③ 정산 연계(커스터디 콜드 이전) + ④ 수수료(거래액 1% 고정·양측 각자)를 실제로 집행해 \"단순 게시판이 아닌 중개\"임을 완결. 완결성 지표로 한쪽만 이전되는 리스크를 차단.\u003cbr>\n      · \u003cstrong>[화이트리스트 미적용]\u003c/strong> 교환·중개는 내부 커스터디 지갑 사이의 이동이라 외부 주소를 다루지 않으므로 화이트리스트를 적용하지 않음.\u003cbr>\n      · 2026-09-02 설명 형식 개정 적용(핀 = 조작 요소 단위) — 표시 4 · 조건부 배너 1 · 버튼 1(활성 조건 / 클릭 / 실패 3행) · 스텝바와 이전 지시 상태 분리 · 회계 계정명 행 제거 · 상태 변형(확정·양건 확인·이전 진행·완료·보류·중지)은 항목 2 상태 목록 + 상세 2 매핑.\u003cbr>\n      · \u003cspan class=\"chk\">[확인필요]\u003c/span> 정산 배치(1영업일 3회) 시각·마감 기준 · 이전 중지 건 수수료 처리·고객 문구·통지 이메일 · 고객 화면 상태 enum.\u003cbr>· \u003cstrong>확정(2026-09-02)\u003c/strong> — 중개 수수료는 \u003cstrong>별도 정산\u003c/strong>. 보내는 수량에서 공제하지 않으므로 화면 수량은 게시 조건 그대로 쓰고 세전/세후 부기를 두지 않는다.\u003cbr>\n      · 마목 진행 순서: 게시판(BRK-01) → 등록(BRK-02) → 내 게시 상세(BRK-06, 회수 가능) / 신청(BRK-03) → 내 신청 상세(BRK-07) → 수락(BRK-04, 즉시 확정) → \u003cstrong>이전·완료(BRK-05, 양측 공용)\u003c/strong>\n    \u003c/div>\n  \u003c/div>\n\u003c/section>\n\n\u003cscript src=\"screen.js\">\u003c/script>\n\u003c/body>\n\u003c/html>\n", "adm-02.html": "\u003c!DOCTYPE html>\n\u003chtml lang=\"ko\">\n\u003chead>\n\u003cmeta charset=\"UTF-8\">\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n\u003ctitle>화면기획 — 어드민 홈\u003c/title>\n\u003clink rel=\"stylesheet\" href=\"screen.css\">\n\u003cstyle>\n  .tbl{width:100%;border-collapse:collapse;font-size:11px;}\n  .tbl th{background:#f1f5f9;color:#64748b;font-weight:700;text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);font-size:10px;}\n  .tbl td{padding:7px 8px;border-bottom:1px solid #f1f1ee;color:#334155;vertical-align:middle;}\n  .act{display:inline-block;font-size:9px;font-weight:700;padding:2px 7px;border-radius:6px;border:1px solid #93c5fd;color:#2563eb;background:#fff;margin:1px 2px 1px 0;white-space:nowrap;}\n  .act.warn{border-color:#fca5a5;color:#b91c1c;}\n  .csvgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}\n  .csvbtn{border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:#fff;}\n  .csvbtn .ct{font-size:11px;font-weight:700;color:#334155;}\n  .csvbtn .cd{font-size:9.5px;color:#94a3b8;margin-top:3px;}\n  .csvbtn .dl{display:inline-block;margin-top:6px;font-size:9px;font-weight:700;padding:2px 8px;border-radius:6px;border:1px solid #93c5fd;color:#2563eb;}\n  .appx-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}\n  .appx{border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:#fff;}\n  .appx .at{font-size:12px;font-weight:800;color:#0f172a;}\n  .appx .as{font-size:10px;color:#94a3b8;margin:2px 0 8px;font-family:ui-monospace,Consolas,monospace;}\n  .appx .tbl td{padding:4px 6px;font-size:10.5px;}\n  .appx .src{font-family:ui-monospace,Consolas,monospace;font-size:9.5px;color:#475569;}\n  .appx .gap{color:#888;font-weight:700;}\n  .appx .drv{color:#7c3aed;font-weight:700;}\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\n\u003cheader class=\"header\">\n  \u003cdiv class=\"crumb\">\u003cspan>관리자\u003c/span>\u003cspan class=\"s\">›\u003c/span>\u003cspan>홈\u003c/span>\u003c/div>\n  \u003ch1 class=\"title\">어드민 홈\u003c/h1>\n  \u003cspan class=\"sid\">ADM-02\u003c/span>\n  \u003cspan class=\"defense\">처리할 일만 알람·워닝 · 조회는 CSV 다운로드\u003c/span>\n\u003c/header>\n\n\u003cdiv class=\"main wide-main\">\n  \u003cdiv class=\"screen-panel\">\n    \u003cdiv style=\"position:relative;display:flex;\">\n      \u003cdiv class=\"labels\" id=\"labels\">\n        \u003cdiv class=\"lbl\">\u003cspan class=\"lbl-text\">전역·\u003cbr>관리 메뉴\u003c/span>\u003c/div>\n        \u003cdiv class=\"lbl\">\u003cspan class=\"lbl-text\">알람·워닝\u003cbr>처리함\u003c/span>\u003c/div>\n        \u003cdiv class=\"lbl\">\u003cspan class=\"lbl-text\">집행 대기\u003c/span>\u003c/div>\n        \u003cdiv class=\"lbl\">\u003cspan class=\"lbl-text\">데이터\u003cbr>다운로드\u003c/span>\u003c/div>\n      \u003c/div>\n      \u003csvg id=\"bracketSvg\" width=\"24\" style=\"flex-shrink:0;overflow:visible;\">\u003c/svg>\n    \u003c/div>\n\n    \u003cdiv class=\"frame wide\" id=\"frame\">\n      \u003c!-- 전역: 관리 메뉴 (핀 없음 — nav-global 행으로 처리) -->\n      \u003cdiv class=\"z 사유)\u003c/div>\u003cspan class=\"dl\">CSV 다운로드\u003c/span>\u003c/div>\n          \u003cdiv class=\"csvbtn\">\u003cdiv class=\"ct\">③ 통합 거래 목록\u003c/div>\u003cdiv class=\"cd\">교환·중개·이전 전 거래 시간순 · txhash 포함\u003c/div>\u003cspan class=\"dl\">CSV 다운로드\u003c/span>\u003c/div>\n          \u003cdiv class=\"csvbtn\">\u003cdiv class=\"ct\">④ 구분회계 집계\u003c/div>\u003cdiv class=\"cd\">수탁/운영 원장 분리 · 스프레드수익(운영손익)/중개수수료 계정 — 어드민 CSV 전용\u003c/div>\u003cspan class=\"dl\">CSV 다운로드\u003c/span>\u003c/div>\n          \u003cdiv class=\"csvbtn\">\u003cdiv class=\"ct\">⑤ 3면 대사\u003c/div>\u003cdiv class=\"cd\">내부 장부 ↔ 온체인 ↔ 커스터디 콜드 잔액 스냅숏\u003c/div>\u003cspan class=\"dl\">CSV 다운로드\u003c/span>\u003c/div>\n          \u003cdiv class=\"csvbtn\">\u003cdiv class=\"ct\">⑥ 열람 기록\u003c/div>\u003cdiv class=\"cd\">누가·무엇을 조회·다운로드했는가 (열람 자체 감사)\u003c/div>\u003cspan class=\"dl\">CSV 다운로드\u003c/span>\u003c/div>\n        \u003c/div>\n      \u003c/div>\n\n    \u003c/div>\n  \u003c/div>\n\n  \u003csvg id=\"connSvg\" style=\"position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:10;overflow:visible;\">\u003c/svg>\n\n  \u003cdiv class=\"items\" id=\"items\">\n    \u003cdiv class=\"nav-global\">\n      \u003cdiv class=\"nav-global-title\">진입 · 전역 이동\u003c/div>\n      \u003cdiv class=\"nav-row\">\u003cspan class=\"nav-el\">관리 메뉴 '설정' 탭\u003c/span>\u003cspan class=\"nav-act\">클릭\u003c/span>\u003cspan class=\"nav-to\">\u003cstrong>설정(ADM-03)\u003c/strong>. 확장 중인 행과 저장하지 않은 txhash 입력은 확인 없이 버린다.\u003c/span>\u003c/div>\n      \u003cdiv class=\"nav-row\">\u003cspan class=\"nav-el\">관리 메뉴 '홈'(현재) · 로고 'DSRV Admin'\u003c/span>\u003cspan class=\"nav-act\">클릭\u003c/span>\u003cspan class=\"nav-to stay\">무반응. 로고는 홈으로 가는 링크라 이 화면에서는 '홈' 탭과 같다. 설정(ADM-03)에서 누르면 이 화면으로 이동한다.\u003c/span>\u003c/div>\n      \u003cdiv class=\"nav-row\">\u003cspan class=\"nav-el\">관리자 배지(상단 우측 · 관리자 ID)\u003c/span>\u003cspan class=\"nav-act\">클릭\u003c/span>\u003cspan class=\"nav-to\">메뉴에 '로그아웃' 1개가 펼쳐진다. '로그아웃' 클릭 → 확인 없이 세션 즉시 파기 → \u003cstrong>어드민 로그인\u003c/strong>. 어드민 로그인은 별도 화면 ID 없이 로그인(AUTH-01)과 같은 규격(이메일·비밀번호 + 인증 앱 코드)을 쓴다.\u003c/span>\u003c/div>\n      \u003cdiv class=\"nav-row\">\u003cspan class=\"nav-el\">브라우저 뒤로가기\u003c/span>\u003cspan class=\"nav-act\">전 화면 미지원\u003c/span>\u003cspan class=\"nav-to\">\"접근할 수 없는 화면입니다\" 안내 후 \u003cstrong>어드민 홈(ADM-02)\u003c/strong>으로 이동한다. \u003cspan class=\"chk\">[확인필요: 목적지 — 고객 콘솔의 '안내 후 대시보드' 규칙을 준용해 홈으로 기재]\u003c/span>\u003c/span>\u003c/div>\n      \u003cdiv class=\"nav-note\">· 이 프레임(관리 메뉴 2탭 + 관리자 배지)은 설정(ADM-03)이 같이 쓴다. 프레임 동작은 이 화면에만 적고, ADM-03에는 이 화면과 다른 점만 적는다.\u003cbr>\n      · \u003cstrong>진입\u003c/strong> 어드민 로그인 성공 후 첫 화면 / 설정(ADM-03)에서 '홈' 탭 또는 로고 클릭. 유휴 {정책값 10분}이 지나면 자동 로그아웃되어 어드민 로그인으로 돌아간다 \u003cspan class=\"chk\">[확인필요: 유휴 시간 값]\u003c/span>.\u003c/div>\n    \u003c/div>\n\n    \u003cdiv class=\"itm\" data-idx=\"0\">\n      \u003cdiv class=\"num\">1\u003c/div>\n      \u003cdiv>\n        \u003cdiv class=\"itm-title\">처리함 목록 · 행 클릭(확장)\u003cspan class=\"req\">필수\u003c/span>\u003c/div>\n        \u003cdiv class=\"itm-desc\">· 열: 유형 · 대상·내용 · 자동검증·등급 · 상태 · 처리 — 유형 9종(T1 나목 교환 승인 · T2 마목 확정 확인 · T3 출금·이전 · T4 입금 격리 · T5 이상거래 워닝 · T6 월렛·키 알람 · T7 KYC 재이행 · T8 계정 잠금 · X3 3면 대사 불일치) · '상태' 열 값 = states 도메인 상태(상세 1 표) · 자동검증·등급 = 1차 필터 표시(정상 / KYT 주의 / High / Mid / 지연발효 중) — 판단은 사람(자동 승인·거절 없음)\u003cbr>· \u003cstrong>목록 규격\u003c/strong>: 미종결 건만 표시(종결 즉시 행 제거) · 최신 생성순 단일 리스트 · 필터·검색 없음(공통 UI 규격) — 에스컬레이션·High 상단 고정 여부 \u003cspan class=\"chk\">[확인필요]\u003c/span> · 전량 표시 · 페이지 스크롤([더 보기]·페이지네이션·무한 스크롤 없음) · 빈 상태 점선 박스 \"처리할 건이 없습니다\" · 로딩 \"불러오는 중…\"(3초 초과 → 오류 배너)\u003cbr>· \u003cstrong>갱신\u003c/strong>: 화면 진입 시와 브라우저 새로고침 시에만 조회한다. 처리 버튼을 누른 결과는 즉시 반영한다. 자동 주기 갱신·푸시 알림·토스트는 없다.\u003cbr>· 다른 관리자가 처리 중인 행은 상태 옆 \"처리 중 · DSRV-OPS-02\" 표시 + 처리 버튼 전부 비활성(행 잠금 · 경쟁 방지)\u003cbr>· 처리 이력(처리자·사유·시각)은 확장 패널 하단에 누적 표시 · 고객 화면으로 이동하는 링크 없음\u003cbr>\u003cspan class=\"basis\">근거 states 처리함 정의 v0.2 · notation 어드민 처리 버튼(별도 상세 화면 없음) · 목록 규격\u003c/span>\u003c/div>\n        \u003cdiv class=\"itm-nav\">\u003cspan class=\"nav-tag\">화면 이동 · 인터랙션\u003c/span>\n          \u003cdiv class=\"nav-row\">\u003cspan class=\"nav-el\">처리함 행(처리 버튼 제외 셀 전체)\u003c/span>\u003cspan class=\"nav-act\">클릭 → 행 아래 확장 패널 열림(동시 1개 · 다른 행 클릭 시 교체 · 같은 행 재클릭 = 접기)\u003c/span>\u003cspan class=\"nav-to stay\">유형별 확장 내용(상세 1) · 확장 중에도 처리 버튼은 행 내 위치 그대로 · 이동 없음(별도 상세 화면 없음)\u003c/span>\u003c/div>\n          \u003cdiv class=\"nav-row\">\u003cspan class=\"nav-el\">대상·내용의 요청번호(EXC-/BRK-)\u003c/span>\u003cspan class=\"nav-act\">클릭\u003c/span>\u003cspan class=\"nav-to stay\">무반응(링크 아님 — 행 클릭과 동일하게 확장)\u003c/span>\u003c/div>\n        \u003c/div>\n      \u003c/div>\n    \u003c/div>\n\n    \u003cdiv class=\"itm\" data-idx=\"1\">\n      \u003cdiv class=\"num\">2\u003c/div>\n      \u003cdiv>\n        \u003cdiv class=\"itm-title\">[승인] — 나목 교환 승인(T1)\u003cspan class=\"req\">필수\u003c/span>\u003c/div>\n        \u003cdiv class=\"itm-desc\">\u003cstrong>노출\u003c/strong> 유형 '나목 교환 승인' 행에만 보인다. 행마다 반복하고 대표 핀은 1개다.\u003cbr>\u003cstrong>클릭 가능\u003c/strong> 행 상태가 승인 대기·에스컬레이션·보류 중 하나이고, 다른 관리자가 그 행을 처리하고 있지 않으며, 교환 재고가 받는 수량 이상이고, 기관 KYC 상태가 '활성'일 때만 활성이다.\u003cbr>\u003cstrong>확인 사항\u003c/strong> 확인 다이얼로그를 띄운다(집행 개시는 구속력 있는 행위다). 판단 재료는 확장 패널에서 본다 — 자동검증(BLF·KYT·건별 한도 1,500,000원 상당 이하) · 확정 비율과 스프레드 · 교환 재고(콜드 최소재고) 잔량 · 기관 KYC 상태.\u003cbr>\u003cstrong>액션\u003c/strong> 도메인 상태를 \u003cstrong>집행 대기\u003c/strong>로 바꾸고 집행 대기 표에 행을 만든다(항목 19). 고객 화면은 승인 대기부터 집행 대기까지 EXC-03 '거래 진행중' 하나로만 보이므로 승인 시점에 고객 통지는 없다.\u003cbr>\u003cspan class=\"basis\">근거 states T1 · 09 §0 승인·통제(DSRV 단일 처리 + 콜드 수동 집행) · ISMS 2.2.2\u003c/span>\u003c/div>\n        \u003cdiv class=\"itm-nav\">\u003cspan class=\"nav-tag\">화면 이동 · 인터랙션\u003c/span>\n          \u003cdiv class=\"nav-row\">\u003cspan class=\"nav-el\">[승인] — 활성 조건\u003c/span>\u003cspan class=\"nav-act\">다음이 모두 아님: ①행 상태가 승인 대기·에스컬레이션·보류 이외(종결·집행 대기) ②다른 관리자가 처리 중(행 잠금) ③교환 재고 &lt; 받는 수량 ④기관 KYC 상태 '활성' 아님(ADM-03)\u003c/span>\u003cspan
