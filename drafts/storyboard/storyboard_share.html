/span>\u003cspan class=\"s\">›\u003c/span>\u003cspan>설정\u003c/span>\u003c/div>\n  \u003ch1 class=\"title\">설정\u003c/h1>\n  \u003cspan class=\"sid\">ADM-03\u003c/span>\n  \u003cspan class=\"defense\">정책 파라미터 단일 출처 · 기관·가입자 관리\u003c/span>\n\u003c/header>\n\n\u003cdiv class=\"main\">\n  \u003cdiv class=\"screen-panel\">\n    \u003cdiv style=\"position:relative;display:flex;\">\n      \u003cdiv class=\"labels\" id=\"labels\">\n        \u003cdiv class=\"lbl\">\u003cspan class=\"lbl-text\">전역·\u003cbr>관리 메뉴\u003c/span>\u003c/div>\n        \u003cdiv class=\"lbl\">\u003cspan class=\"lbl-text\">요율·정책\u003cbr>파라미터\u003c/span>\u003c/div>\n        \u003cdiv class=\"lbl\">\u003cspan class=\"lbl-text\">기관·가입자\u003cbr>관리\u003c/span>\u003c/div>\n        \u003cdiv class=\"lbl\">\u003cspan class=\"lbl-text\">초대 발송\u003c/span>\u003c/div>\n        \u003cdiv class=\"lbl\">\u003cspan class=\"lbl-text\">상태 전이\u003cbr>·재이행\u003c/span>\u003c/div>\n      \u003c/div>\n      \u003csvg id=\"bracketSvg\" width=\"24\" style=\"flex-shrink:0;overflow:visible;\">\u003c/svg>\n    \u003c/div>\n\n    \u003cdiv class=\"frame\" id=\"frame\">\n      \u003c!-- 전역: 관리 메뉴 -->\n      \u003cdiv class=\"zone\" data-idx=\"4\">\n        \u003cdiv class=\"zone-highlight\">\u003c/div>\n        \u003cdiv class=\"item-area\" data-highlight=\"4\" style=\"position:relative;\">\n          \u003cdiv class=\"pin\" data-idx=\"4\" style=\"top:-4px;right:-4px;\">5\u003c/div>\n          \u003cdiv class=\"c-top admin\" style=\"border-radius:8px 8px 0 0;\">\n            \u003cspan class=\"brand\">DSRV Admin Console\u003c/span>\n            \u003cspan class=\"meta\">\u003c/span>\n          \u003c/div>\n          \u003cdiv class=\"c-adminbar\" style=\"margin:0;\">\n            \u003cspan class=\"m\">홈\u003c/span>\u003cspan class=\"m on\">설정\u003c/span>\n          \u003c/div>\n        \u003c/div>\n      \u003c/div>\n\n      \u003c!-- 요율·정책 파라미터 -->\n      \u003cdiv class=\"zone\" data-idx=\"0\">\n        \u003cdiv class=\"zone-highlight\">\u003c/div>\n        \u003cdiv class=\"item-area\" data-highlight=\"0\" style=\"position:relative;padding:6px;border-radius:8px;\">\n          \u003cdiv class=\"pin\" data-idx=\"0\" style=\"top:-4px;right:-4px;\">1\u003c/div>\n          \u003cdiv class=\"zone-title\">요율·정책 파라미터\u003c/div>\n          \u003ctable class=\"tbl\">\n            \u003cthead>\u003ctr>\u003cth>구분\u003c/th>\u003cth>파라미터\u003c/th>\u003cth>현재값 (수정 가능)\u003c/th>\u003c/tr>\u003c/thead>\n            \u003ctbody>\n              \u003ctr>\u003ctd>나목\u003c/td>\u003ctd>고정 스프레드 (페어별 · ETH↔USDC · ETH↔USDT · USDC↔USDT)\u003c/td>\u003ctd>\u003cspan class=\"inp\">0.10\u003cspan class=\"u\">%\u003c/span>\u003c/span> \u003cspan class=\"inp\">120\u003cspan class=\"u\">s 견적유효\u003c/span>\u003c/span> \u003cspan style=\"font-size:9.5px;color:#b45309;\">ETH 페어 요율 [확인필요]\u003c/span>\u003c/td>\u003c/tr>\n              \u003ctr>\u003ctd>마목\u003c/td>\u003ctd>중개 수수료 (거래액 기준 고정 · 양측 각자)\u003c/td>\u003ctd>\u003cspan class=\"inp\">1.0\u003cspan class=\"u\">%\u003c/span>\u003c/span>\u003c/td>\u003c/tr>\n              \u003ctr>\u003ctd>마목\u003c/td>\u003ctd>게시 유효기간 / 신청 유효기간\u003c/td>\u003ctd>\u003cspan class=\"inp\">30\u003cspan class=\"u\">일\u003c/span>\u003c/span> \u003cspan class=\"inp\">2\u003cspan class=\"u\">영업일\u003c/span>\u003c/span>\u003c/td>\u003c/tr>\n              \u003ctr>\u003ctd>마목\u003c/td>\u003ctd>시세변동 자동중지 임계 (게시 시점 대비)\u003c/td>\u003ctd>\u003cspan class=\"inp\">±2.0\u003cspan class=\"u\">%\u003c/span>\u003c/span>\u003c/td>\u003c/tr>\n              \u003ctr>\u003ctd>공통\u003c/td>\u003ctd>건별 한도 (나·마 공통 · USD 환산)\u003c/td>\u003ctd>\u003cspan class=\"inp\">1,000\u003cspan class=\"u\">USD 상당\u003c/span>\u003c/span> \u003cspan style=\"font-size:9.5px;color:#64748b;\">환산 = 시세 소스 USD 시세 · 요청 시점\u003c/span>\u003c/td>\u003c/tr>\n              \u003ctr>\u003ctd>공통\u003c/td>\u003ctd>시세(외부지표) 소스\u003c/td>\u003ctd>\u003cspan class=\"inp\">업비트\u003c/span> \u003cspan class=\"inp\">빗썸\u003c/span> \u003cspan class=\"inp\">바이낸스\u003c/span> \u003cspan style=\"font-size:9.5px;color:#b45309;\">조합 방식 [확인필요]\u003c/span>\u003c/td>\u003c/tr>\n              \u003ctr>\u003ctd>지갑\u003c/td>\u003ctd>핫월렛 비중 임계 (초과 시 스윕 워닝)\u003c/td>\u003ctd>\u003cspan class=\"inp\">20\u003cspan class=\"u\">%\u003c/span>\u003c/span>\u003c/td>\u003c/tr>\n            \u003c/tbody>\n          \u003c/table>\n          \u003cdiv style=\"display:flex;align-items:center;justify-content:flex-end;gap:10px;margin-top:8px;\">\n            \u003cspan style=\"font-size:9.5px;color:#94a3b8;\">저장 시 변경 이력(버전)·변경자 감사로그 기록 · 진행 중 건은 요청 시점 값 유지\u003c/span>\n            \u003cdiv class=\"btn ghost\" style=\"padding:6px 14px;font-size:11px;\">되돌리기\u003c/div>\n            \u003cdiv class=\"btn primary\" style=\"padding:6px 14px;font-size:11px;\">변경 저장\u003c/div>\n          \u003c/div>\n        \u003c/div>\n      \u003c/div>\n\n      \u003c!-- 기관·가입자 관리 -->\n      \u003cdiv class=\"zone\" data-idx=\"1\">\n        \u003cdiv class=\"zone-highlight\">\u003c/div>\n        \u003cdiv class=\"item-area\" data-highlight=\"1\" style=\"position:relative;padding:6px;border-radius:8px;\">\n          \u003cdiv class=\"pin\" data-idx=\"1\" style=\"top:-4px;right:-4px;\">2\u003c/div>\n          \u003cdiv class=\"zone-title\">기관·가입자 관리\u003c/div>\n          \u003ctable class=\"tbl\">\n            \u003cthead>\u003ctr>\u003cth>기관\u003c/th>\u003cth>가입자\u003c/th>\u003cth>KYC 상태\u003c/th>\u003cth>계정 상태\u003c/th>\u003cth>조치\u003c/th>\u003c/tr>\u003c/thead>\n            \u003ctbody>\n              \u003ctr>\u003ctd>A자산운용\u003c/td>\u003ctd>가입자 K\u003c/td>\u003ctd>\u003cspan class=\"chip ok\">활성\u003c/span>\u003c/td>\u003ctd>\u003cspan class=\"chip ok\">활성\u003c/span>\u003c/td>\u003ctd class=\"mono\">—\u003c/td>\u003c/tr>\n              \u003ctr>\u003ctd>B사\u003c/td>\u003ctd>가입자 M\u003c/td>\u003ctd>\u003cspan class=\"chip info\">심사중 (EDD)\u003c/span>\u003c/td>\u003ctd>\u003cspan class=\"chip info\">초대 발송됨\u003c/span>\u003c/td>\u003ctd>\u003cspan class=\"act\">초대 재발송\u003c/span>\u003c/td>\u003c/tr>\n              \u003ctr>\u003ctd>C사\u003c/td>\u003ctd>가입자 N\u003c/td>\u003ctd>\u003cspan class=\"sev mid\">일시제한 (재이행 미응답)\u003c/span>\u003c/td>\u003ctd>\u003cspan class=\"chip ok\">활성\u003c/span>\u003c/td>\u003ctd>\u003cspan class=\"act\">상태 변경\u003c/span>\u003c/td>\u003c/tr>\n            \u003c/tbody>\n          \u003c/table>\n        \u003c/div>\n      \u003c/div>\n\n      \u003c!-- 초대 발송 -->\n      \u003cdiv class=\"zone\" data-idx=\"2\">\n        \u003cdiv class=\"zone-highlight\">\u003c/div>\n        \u003cdiv class=\"item-area\" data-highlight=\"2\" style=\"position:relative;padding:6px;border-radius:8px;\">\n          \u003cdiv class=\"pin\" data-idx=\"2\" style=\"top:-4px;right:-4px;\">3\u003c/div>\n          \u003cdiv class=\"zone-title\">초대 발송\u003c/div>\n          \u003cdiv class=\"row\" style=\"gap:8px;\">\n            \u003cdiv class=\"field\" style=\"flex:1;\">\u003cspan class=\"ph\">기관명\u003c/span>\u003c/div>\n            \u003cdiv class=\"field\" style=\"flex:2;\">\u003cspan class=\"ph\">가입자 이메일\u003c/span>\u003c/div>\n            \u003cdiv class=\"btn primary\" style=\"flex:0 0 auto;\">초대 발송\u003c/div>\n          \u003c/div>\n          \u003cdiv style=\"font-size:10px;color:#64748b;margin-top:6px;\">기관당 가입자 1명 — 이미 가입자가 있는 기관은 기존 계정 해지 후에만 신규 초대 가능\u003c/div>\n        \u003c/div>\n      \u003c/div>\n\n      \u003c!-- 상태 전이·재이행 -->\n      \u003cdiv class=\"zone\" data-idx=\"3\">\n        \u003cdiv class=\"zone-highlight\">\u003c/div>\n        \u003cdiv class=\"item-area\" data-highlight=\"3\" style=\"position:relative;padding:6px;border-radius:8px;\">\n          \u003cdiv class=\"pin\" data-idx=\"3\" style=\"top:-4px;right:-4px;\">4\u003c/div>\n          \u003cdiv class=\"kv\">\u003cspan class=\"k\">계정 상태 전이\u003c/span>\u003cspan class=\"v\">심사중 → 활성 → 일시제한 → 동결 → 해지\u003c/span>\u003c/div>\n          \u003cdiv class=\"kv\">\u003cspan class=\"k\">KYC 재이행 주기\u003c/span>\u003cspan class=\"v\">고1년 · 중2년 · 저3년 + 이벤트 트리거\u003c/span>\u003c/div>\n          \u003cdiv class=\"kv\">\u003cspan class=\"k\">해지 처리\u003c/span>\u003cspan class=\"v\">진행 거래 완결 → 전량 출금 → 비활성화\u003c/span>\u003c/div>\n        \u003c/div>\n      \u003c/div>\n\n    \u003c/div>\n  \u003c/div>\n\n  \u003csvg id=\"connSvg\" style=\"position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:10;overflow:visible;\">\u003c/svg>\n\n  \u003cdiv class=\"items\" id=\"items\">\n    \u003cdiv class=\"nav-global\">\n      \u003cdiv class=\"nav-global-title\">진입 · 전역 이동\u003c/div>\n      \u003cdiv class=\"nav-note\">· \u003cstrong>진입\u003c/strong>: 어드민 홈(ADM-02) '설정' 탭 클릭\u003cbr>\n      · 발생 알람 처리(잠금 해제·재이행 도래·격리 등)는 이 화면이 아니라 홈(ADM-02) 처리함에서\u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"itm\" data-idx=\"0\">\n      \u003cdiv class=\"num\">1\u003c/div>\n      \u003cdiv>\n        \u003cdiv class=\"itm-title\">요율·정책 파라미터 (단일 출처)\u003cspan class=\"req\">필수\u003c/span>\u003c/div>\n        \u003cdiv class=\"itm-desc\">· 나목 스프레드·마목 수수료·유효기간·자동중지 임계·건별 한도(USD 환산)·핫 비중 임계·시세 소스를 한 곳에서 설정\u003cbr>· 시세 소스는 나목 비율 자동 산정 외에 \u003cstrong>건별 한도 USD 환산\u003c/strong>(EXC-01·BRK-02)에도 사용\u003cbr>· \u003cstrong>시세(외부지표) 소스: 업비트·빗썸·바이낸스\u003c/strong> — 나목 비율 산정(EXC-02), 마목 편차 경고·시세변동 자동중지 판단(BRK-02)이 모두 이 시세를 참조. 복수 소스 조합 방식(중앙값·평균·우선순위)과 수신 장애 시 처리 \u003cspan style=\"color:#b45309;\">[확인필요]\u003c/span>\u003cbr>· 값은 행 내 \u003cstrong>인라인 입력\u003c/strong>으로 수정 → \u003cstrong>'변경 저장' 일괄 반영\u003c/strong>(저장 전 '되돌리기'로 원복) — 저장 시 변경 이력(버전)·변경자 감사로그 기록(POLICY_VERSION)\u003cbr>· 새 값은 \u003cstrong>저장 이후 신규 요청부터 적용\u003c/strong> — 진행 중 건(제시된 견적·게재중 게시)은 요청 시점 값 유지\u003cbr>· EXC-01/02·BRK-02/03/04는 이 값을 \u003cstrong>표출만\u003c/strong> — 화면 하드코딩 없음, '가격형성 아님' 소명값의 단일 출처\u003cbr>\u003cspan class=\"basis\">근거 V2 · 09 §0 line 51 · L6 · 정책 변경통제 [스키마 POLICY_VERSION]\u003c/span>\u003c/div>\n        \u003cdiv class=\"itm-nav\">\u003cspan class=\"nav-tag\">화면 이동 · 인터랙션\u003c/span>\n          \u003cdiv class=\"nav-row\">\u003cspan class=\"nav-el\">파라미터 인라인 입력\u003c/span>\u003cspan class=\"nav-act\">행 내 값 수정 — 저장 전까지 미반영\u003c/span>\u003cspan class=\"nav-to stay\">화면 내 (이동 없음)\u003c/span>\u003c/div>\n          \u003cdiv class=\"nav-row\">\u003cspan class=\"nav-el\">[변경 저장] 버튼\u003c/span>\u003cspan class=\"nav-act\">클릭 — 일괄 반영 · 변경 이력(버전)·변경자 감사로그(POLICY_VERSION)\u003c/span>\u003cspan class=\"nav-to stay\">화면 내 — 새 값은 \u003cstrong>신규 요청부터\u003c/strong> 적용(진행 중 건은 요청 시점 값 유지) · EXC-01/02·BRK-02/03/04 표출값 갱신\u003c/span>\u003c/div>\n          \u003cdiv class=\"nav-row\">\u003cspan class=\"nav-el\">[되돌리기] 버튼\u003c/span>\u003cspan class=\"nav-act\">클릭 — 저장 전 입력값 원복\u003c/span>\u003cspan class=\"nav-to stay\">화면 내 (이동 없음)\u003c/span>\u003c/div>\n        \u003c/div>\n      \u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"itm\" data-idx=\"1\">\n      \u003cdiv class=\"num\">2\u003c/div>\n      \u003cdiv>\n        \u003cdiv class=\"itm-title\">기관·가입자 관리\u003cspan class=\"req\">필수\u003c/span>\u003c/div>\n        \u003cdiv class=\"itm-desc\">· \u003cstrong>기관당 가입자 1명\u003c/strong> — 고객사 측 기안·승인 2인 분리 요건 없음\u003cbr>· 목록은 처리용 최소 표시(기관·가입자·KYC 상태·계정 상태·조치) — 조회용 전체 목록은 홈(ADM-02) CSV, 잠금 해제 등 발생 알람 처리는 홈 처리함\u003cbr>· CDD/EDD 탈락 시 가입 거절 + 사유 기록, 거래거절 건 STR 검토 연계(예외 A1) · 재이행 기한 초과·미응답 → 신규 거래 제한(예외 A6)\u003cbr>\u003cspan class=\"basis\">근거: 관리자 콘솔 ORG·KYC 통합 [F-12] · 예외케이스 A1·A2·A6 (28 §A)\u003c/span>\u003c/div>\n        \u003cdiv class=\"itm-nav\">\u003cspan class=\"nav-tag\">화면 이동 · 인터랙션\u003c/span>\n          \u003cdiv class=\"nav-row\">\u003cspan class=\"nav-el\">기관 행 [초대 재발송]\u003c/span>\u003cspan class=\"nav-act\">클릭 — 만료·분실 링크 재발급(백업코드 소진 케이스 동일)\u003c/span>\u003cspan class=\"nav-to stay\">화면 내 — \u003cstrong>초대 이메일(ONB-00)\u003c/strong> 재발송\u003c/span>\u003c/div>\n        \u003c/div>\n      \u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"itm\" data-idx=\"2\">\n      \u003cdiv class=\"num\">3\u003c/div>\n      \u003cdiv>\n        \u003cdiv class=\"itm-title\">초대 발송 (온보딩 진입점)\u003cspan class=\"req\">필수\u003c/span>\u003c/div>\n        \u003cdiv class=\"itm-desc\">· 기관명·가입자 이메일 입력 → 초대 발송 → ONB-00(초대 이메일) → ONB-01(활성화·2FA)\u003cbr>· 링크 72시간·1회 유효 — 만료·분실 시 재발송(백업코드 소진 케이스 동일 버튼)\u003cbr>· 기관당 1계정 — 추가 초대는 기존 계정 해지 후에만\u003cbr>\u003cspan class=\"basis\">근거: 본인 이메일 초대·셀프가입 없음(ONB-00) · ISMS 2.5(계정·인증 관리)\u003c/span>\u003c/div>\n        \u003cdiv class=\"itm-nav\">\u003cspan class=\"nav-tag\">화면 이동 · 인터랙션\u003c/span>\n          \u003cdiv class=\"nav-row\">\u003cspan class=\"nav-el\">[초대 발송] 버튼\u003c/span>\u003cspan class=\"nav-act\">기관명·가입자 이메일 입력 후 클릭 — 기관당 1명(기존 가입자 있으면 해지 후에만)\u003c/span>\u003cspan class=\"nav-to stay\">화면 이동 없음 — \u003cstrong>초대 이메일(ONB-00)\u003c/strong> 발송(온보딩 진입점: ONB-00 → ONB-01 → AUTH-01)\u003c/span>\u003c/div>\n        \u003c/div>\n      \u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"itm\" data-idx=\"3\">\n      \u003cdiv class=\"num\">4\u003c/div>\n      \u003cdiv>\n        \u003cdiv class=\"itm-title\">계정 상태 전이·재이행 트리거\u003cspan class=\"req\">필수\u003c/span>\u003c/div>\n        \u003cdiv class=\"itm-desc\">· 상태 기계: 심사중 → 활성 → 일시제한(재이행·의심) → 동결(제재) → 해지\u003cbr>· 실소유자·지배구조 변경 등 이벤트 트리거 시 수시 CDD 재이행 → 재심사 중 거래 제한(예외 A4)\u003cbr>· 해지 시에도 기록은 법정 기간 보존(거래 15년·AML 5년, 예외 A5)\u003cbr>· 계정 상태는 전 화면 게이팅(G-3)의 단일 출처\u003cbr>\u003cspan class=\"basis\">근거: 고객확인 재이행 [L1 §5의2] · 기록 보존 [L6 §9] · 예외케이스 A4·A5\u003c/span>\u003c/div>\n        \u003cdiv class=\"itm-nav\">\u003cspan class=\"nav-tag\">화면 이동 · 인터랙션\u003c/span>\n          \u003cdiv class=\"nav-row\">\u003cspan class=\"nav-el\">기관 행 [상태 변경]\u003c/span>\u003cspan class=\"nav-act\">클릭 — 계정 상태 전이(심사중→활성→일시제한→동결→해지) 조치\u003c/span>\u003cspan class=\"nav-to stay\">화면 내 상태 전이 · 전 화면 게이팅(G-3)에 반영 · 감사기록\u003c/span>\u003c/div>\n        \u003c/div>\n      \u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"itm\" data-idx=\"4\">\n      \u003cdiv class=\"num\">5\u003c/div>\n      \u003cdiv>\n        \u003cdiv class=\"itm-title\">관리 메뉴 (홈·설정 2탭)\u003cspan class=\"req\">필수\u003c/span>\u003c/div>\n        \u003cdiv class=\"itm-desc\">· 어드민은 홈(ADM-02)·설정(ADM-03) 2화면 — 처리는 홈 처리함, 설정·기관 관리는 이 화면\u003cbr>· 정책값·상태 변경도 PAM 전용세션·감사로그 대상 — 내부 정책으로 운영, 화면에는 미표기\u003cbr>\u003cspan class=\"basis\">근거: ISMS 2.6 · PAM\u003c/span>\u003c/div>\n        \u003cdiv class=\"itm-nav\">\u003cspan class=\"nav-tag\">화면 이동 · 인터랙션\u003c/span>\n          \u003cdiv class=\"nav-row\">\u003cspan class=\"nav-el\">관리 메뉴 '홈' 탭\u003c/span>\u003cspan class=\"nav-act\">클릭\u003c/span>\u003cspan class=\"nav-to\">\u003cstrong>어드민 홈(ADM-02)\u003c/strong>\u003c/span>\u003c/div>\n        \u003c/div>\n      \u003c/div>\n    \u003c/div>\n  \u003c/div>\n\n\u003c/div>\n\n\u003csection class=\"footer-note\" style=\"padding-bottom:0;\">\n  \u003cdiv class=\"note-card\">\n    \u003cdiv class=\"note-title\">상세내용\u003c/div>\n    \u003cdiv class=\"detail-grid\" id=\"detailCol\">\n      \u003cdiv class=\"dtl\" data-idx=\"0\">\n        \u003cdiv class=\"detail-label\">\u003cspan class=\"dtl-num\">1\u003c/span>단일 출처 원칙\u003c/div>\n      \u003cdiv class=\"dtl-body\">\u003cspan class=\"box\">· EXC-02(가격 고시)·EXC-01(풀 한도)·BRK-02(편차 경고·자동중지 임계)가 여기 값을 표출\u003cbr>· 화면에 하드코딩 없음 → 소명 일관성 확보\u003cbr>· 수수료 1% = 거래액 기준 고정·양측 각자(2026-09-02 확정) · 건별 한도 1,000 USD 상당(2026-09-02 확정, 종전 1억 원 상당 폐기)\u003cbr>· \u003cspan class=\"red\">[확인필요]\u003c/span> 스프레드 갱신주기·견적 유효시간 · 1% 요율의 합리성·설명의무 소명 수위(BRK-04 고시 문구 반영, 09 §8) · 한도 환산 시세의 장애 시 처리\u003c/span>\u003c/div>\n      \u003c/div>\n      \u003cdiv class=\"dtl\" data-idx=\"1\">\n        \u003cdiv class=\"detail-label\">\u003cspan class=\"dtl-num\">2\u003c/span>1기관 1가입자 파급\u003c/div>\n      \u003cdiv class=\"dtl-body\">\u003cspan class=\"box\">· 고객사 내부 기안↔승인 분리 전제가 사라짐 — 고객사 승인 단계 없음(DASH-01)과 정합, 구속력 행위(신청·수락)는 실행 전 확인 문구로 고지\u003cbr>· DSRV 측 직무분리(본인 기안 자기승인 차단)는 유지 — 홈(ADM-02) 처리함\u003c/span>\u003c/div>\n      \u003c/div>\n      \u003cdiv class=\"dtl\" data-idx=\"3\">\n        \u003cdiv class=\"detail-label\">\u003cspan class=\"dtl-num\">4\u003c/span>해지(탈퇴) 흐름\u003c/div>\n      \u003cdiv class=\"dtl-body\">\u003cspan class=\"box\">해지 요청 → 진행 중 거래 완결 대기 → 자산 전량 출금 확인 → 비활성화\u003cbr>· 신규 거래는 요청 즉시 차단\u003cbr>· \u003cspan class=\"red\">[확인필요]\u003c/span> 일시제한 중 조회·출금 허용 범위 · KYC 심사 도구와의 연동 범위(심사 자체는 별도 AML 시스템 — 이 화면은 상태 전이·계정 조치만)\u003c/span>\u003c/div>\n      \u003c/div>\n    \u003c/div>\n  \u003c/div>\n\u003c/section>\n\n\u003csection class=\"footer-note\">\n  \u003cdiv class=\"note-card\">\n    \u003cdiv class=\"note-title\">비고\u003c/div>\n    \u003cdiv class=\"note-body\">\n      · DSRV 내부 관리자 화면(고객사 노출 없음). 어드민은 홈(ADM-02)·설정(ADM-03) 2화면.\u003cbr>\n      · \u003cstrong>[긴급대응 전용 플래그 없음]\u003c/strong> 모든 집행이 사람의 승인·서명을 거치는 구조 — 승인을 멈추면 집행도 멈춤. 별도 '거래정지·긴급출금중단' 버튼 없이 승인 중단 + 사고대응 절차서로 대응 — 근거: ISMS 2.11.1(사고 대응·복구).\u003cbr>\n      · \u003cstrong>[화이트리스트 관리 제외]\u003c/strong> 화이트리스트 지연발효는 커스터디 출금(외부 반출) 전용 — 기존 커스터디 정책·시스템 그대로 사용, 이 콘솔에서 중복 관리하지 않음. 나·마 교환·중개(내부 지갑 간 이전)에는 미적용.\u003cbr>\n      · 연결: 초대 발송 → ONB-00 · 정책값 표출 EXC-01/02·BRK-02 · 발생 알람 처리(잠금·재이행 도래·격리 등)는 홈(ADM-02) 처리함 · 계정 상태 = 전 화면 게이팅(G-3) 단일 출처\n    \u003c/div>\n  \u003c/div>\n\u003c/section>\n\n\u003cscript src=\"screen.js\">\u003c/script>\n\u003c/body>\n\u003c/html>\n"};
const CSS="/* DSRV 교환·중개 화면기획 — 데스크톱 콘솔 공통 스타일 (Liberti 3컬럼 구조 유지, 목업만 콘솔형) */\n@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap');\n:root{\n  --bg:#f5f5f0; --surface:#fff; --border:#ddd; --text:#1a1a1a; --text-sub:#888;\n  --accent:#2563eb; --console:#0f172a; --line:#e2e8f0;\n  --font:'Noto Sans KR', sans-serif; --mono:'SFMono-Regular',Consolas,monospace;\n  --req:#991b1b; --reqbg:#fef2f2; --reqbd:#fecaca;\n}\n*{margin:0;padding:0;box-sizing:border-box;}\nbody{font-family:var(--font);background:var(--bg);color:var(--text);}\n\n/* 헤더 */\n.header{background:var(--surface);padding:20px 32px;border-bottom:1px solid var(--border);display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;}\n.crumb{font-size:12px;color:#aaa;font-weight:600;}\n.crumb .s{margin:0 6px;}\n.title{font-size:24px;font-weight:800;}\n.sid{font-size:11px;color:var(--accent);background:#e8eefb;padding:3px 8px;border-radius:4px;font-weight:600;font-family:var(--mono);}\n.defense{font-size:11px;color:#92400e;background:#fef9ec;border:1px solid #fde68a;padding:3px 10px;border-radius:4px;font-weight:600;}\n\n/* 3컬럼 레이아웃 */\n.main{display:flex;padding:20px 32px 0;gap:28px;align-items:flex-start;position:relative;}\n.screen-panel{display:flex;gap:0;flex-shrink:0;}\n.labels{display:flex;flex-direction:column;width:64px;flex-shrink:0;}\n.lbl{flex:none;display:flex;align-items:center;justify-content:flex-end;position:relative;}\n.lbl-text{font-size:11px;font-weight:600;color:#888;text-align:right;padding-right:10px;line-height:1.3;}\n\n/* 콘솔 프레임 */\n.frame{width:540px;background:var(--surface);border:1px solid #ccc;border-radius:10px;overflow:visible;flex-shrink:0;position:relative;}\n/* 콘솔 상단바 (전역 G-2/G-4) */\n.c-top{background:var(--console);color:#fff;border-radius:10px 10px 0 0;padding:8px 14px;display:flex;align-items:center;justify-content:space-between;font-size:11px;}\n.c-top .brand{font-weight:700;letter-spacing:.02em;}\n.c-top .meta{display:flex;gap:10px;align-items:center;color:#cbd5e1;}\n.c-badge{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);border-radius:10px;padding:1px 8px;font-size:10px;font-weight:600;}\n.c-badge.ok{background:rgba(34,197,94,.18);border-color:rgba(34,197,94,.4);color:#bbf7d0;}\n/* 콘솔 탭 */\n.c-tabs{display:flex;gap:2px;background:#f1f5f9;padding:6px 10px 0;border-bottom:1px solid var(--line);}\n.c-tab{font-size:12px;font-weight:600;color:#64748b;padding:8px 14px;border-radius:6px 6px 0 0;}\n.c-tab.on{background:#fff;color:var(--accent);border:1px solid var(--line);border-bottom:1px solid #fff;margin-bottom:-1px;}\n/* 전역 배너 (G-3 KYC / G-7 차단통지) */\n.c-banner{font-size:11px;padding:7px 14px;display:flex;align-items:center;gap:8px;line-height:1.4;}\n.c-banner.kyc{background:#ecfdf5;color:#065f46;border-bottom:1px solid #d1fae5;}\n.c-banner.warn{background:#fffbeb;color:#92400e;border-bottom:1px solid #fde68a;}\n/* 콘솔 본문 */\n.c-body{padding:0;}\n.zone{padding:16px 18px;border-bottom:1px dashed #e6e6e6;position:relative;}\n.zone:last-child{border-bottom:none;}\n.zone-highlight{display:none;position:absolute;inset:4px;border:2px solid var(--accent);border-radius:8px;pointer-events:none;z-index:4;}\n.zone.active .zone-highlight{display:block;}\n.zone-title{font-size:13px;font-weight:800;color:#334155;margin-bottom:12px;}\n\n/* 콘솔 위젯 프리미티브 */\n.field{border:1px solid #d7dbe0;border-radius:8px;padding:10px 12px;font-size:12px;color:#475569;background:#fff;display:flex;align-items:center;justify-content:space-between;gap:8px;}\n.field .ph{color:#9aa3ad;}\n.field.sel::after{content:'▾';color:#9aa3ad;font-size:11px;}\n.row{display:flex;gap:8px;align-items:stretch;}\n.chip{font-size:10px;font-weight:700;padding:2px 8px;border-radius:10px;background:#eef2f7;color:#475569;}\n.chip.asset{background:#e8eefb;color:#1d4ed8;font-family:var(--mono);}\n.chip.ok{background:#dcfce7;color:#166534;}\n.chip.info{background:#e0f2fe;color:#075985;}\n.btn{padding:10px 14px;border-radius:8px;font-size:13px;font-weight:700;text-align:center;}\n.btn.primary{background:var(--accent);color:#fff;}\n.btn.ghost{border:1.5px solid #cbd5e1;color:#94a3b8;background:#fff;}\n.btn.danger{border:1.5px solid #fca5a5;color:#dc2626;background:#fff;}\n.btn.disabled{background:#e2e8f0;color:#94a3b8;cursor:not-allowed;pointer-events:none;} /* 공통 UI 규격(notation) — 비활성 버튼 */\n.note-inline{font-size:11px;color:#64748b;line-height:1.6;background:#f7f7f5;border-radius:6px;padding:8px 10px;border-left:3px solid #cbd5e1;}\n.note-inline.reg{border-left-color:#f59e0b;background:#fffdf5;color:#7c5b12;}\n.kv{display:flex;justify-content:space-between;font-size:12px;padding:5px 0;border-bottom:1px solid #f1f1ee;}\n.kv:last-child{border-bottom:none;}\n.kv .k{color:#94a3b8;}\n.kv .v{color:#334155;font-weight:600;font-family:var(--mono);}\n.pooltag{font-size:11px;font-weight:700;color:#166534;background:#dcfce7;border-radius:6px;padding:2px 8px;}\n.pooltag.zero{color:#991b1b;background:#fee2e2;}\n.steps{display:flex;align-items:center;gap:6px;font-size:11px;}\n.step{display:flex;align-items:center;gap:5px;color:#94a3b8;}\n.step .dot{width:16px;height:16px;border-radius:50%;background:#e2e8f0;color:#94a3b8;font-size:9px;font-weight:700;display:flex;align-items:center;justify-content:center;}\n.step.done .dot{background:#22c55e;color:#fff;}\n.step.now .dot{background:var(--accent);color:#fff;}\n.step.now{color:var(--accent);font-weight:700;}\n.arrow{color:#cbd5e1;}\n\n/* 화면 안 번호 마커 */\n.pin{position:absolute;width:22px;height:22px;border-radius:50%;background:#e0e0e0;color:#888;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:5;transition:all .2s;user-select:none;}\n.pin:hover{background:#ccc;}\n.pin.active{background:var(--accent);color:#fff;box-shadow:0 0 0 3px rgba(37,99,235,.2);}\n#connSvg{position:absolute;top:0;left:0;pointer-events:none;z-index:3;overflow:visible;}\n\n/* 가운데: 항목설명 */\n.items{flex:1;min-width:240px;max-width:340px;}\n.itm{display:flex;gap:12px;padding:14px 8px;border-bottom:1px solid #eee;align-items:flex-start;border-radius:6px;transition:background .2s;margin:0 -8px;}\n.itm:last-child{border-bottom:none;}\n.itm.active{background:#e8eefb;}\n.itm>div:nth-child(2){flex:1;min-width:0;}\n.num{width:24px;height:24px;border-radius:50%;background:#e0e0e0;color:#888;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px;transition:all .2s;}\n.itm.active .num{background:var(--accent);color:#fff;}\n.itm-title{font-size:13px;font-weight:700;margin-bottom:3px;}\n.itm-title .req{font-size:9px;font-weight:700;padding:1px 6px;border-radius:10px;margin-left:6px;background:var(--reqbg);color:var(--req);border:1px solid var(--reqbd);vertical-align:middle;}\n.itm-title .opt{font-size:9px;font-weight:700;padding:1px 6px;border-radius:10px;margin-left:6px;background:#f0fdf4;color:#166534;border:1px solid #86efac;vertical-align:middle;}\n.itm-desc{font-size:12px;color:#777;line-height:1.55;}\n.itm-desc .basis{font-size:10.5px;color:#b45309;font-weight:600;}\n\n/* 오른쪽: 상세내용 */\n.detail-col{flex:1;min-width:260px;max-width:420px;}\n.dtl{padding:14px 0 14px 20px;border-bottom:1px solid #eee;border-left:2px solid #e8eefb;min-height:53px;transition:border-left-color .2s,background .2s;}\n.dtl:last-child{border-bottom:none;}\n.dtl.active{border-left-color:var(--accent);background:#f5f8ff;border-radius:0 6px 6px 0;}\n.detail-label{font-size:10px;font-weight:700;color:#b0b0b0;letter-spacing:.07em;text-transform:uppercase;margin-bottom:6px;}\n.dtl-body{font-size:12px;color:#666;line-height:1.55;}\n.dtl-body .box{display:block;padding:8px 10px;background:#f7f7f5;border-radius:6px;font-size:11.5px;color:#555;line-height:1.7;margin-top:4px;}\n.dtl-body strong{color:#222;}\n.dtl-body .red{color:#dc2626;font-weight:600;}\n.dtl-body .grn{color:#16a34a;font-weight:600;}\n\n/* 하단 비고 */\n.footer-note{padding:20px 32px 24px;}\n.note-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:24px 28px;}\n.note-title{font-size:14px;font-weight:700;margin-bottom:12px;padding-left:12px;border-left:3px solid var(--accent);}\n.note-body{font-size:12px;color:#777;line-height:1.7;}\n.note-body strong{color:#334155;}\n\n/* ── 관리자(Admin) 공통 ── */\n.c-top.admin{background:#111827;}\n.c-badge.adm{background:rgba(168,85,247,.22);border-color:rgba(168,85,247,.45);color:#e9d5ff;}\n.c-badge.pam{background:rgba(239,68,68,.2);border-color:rgba(239,68,68,.45);color:#fecaca;}\n.c-adminbar{display:flex;gap:2px;background:#f1f5f9;padding:6px 10px;border-bottom:1px solid var(--line);flex-wrap:wrap;}\n.c-adminbar .m{font-size:11px;font-weight:600;color:#64748b;padding:5px 10px;border-radius:6px;}\n.c-adminbar .m.on{background:#ede9fe;color:#6d28d9;}\n.tbl{width:100%;border-collapse:collapse;font-size:11px;}\n.tbl th{background:#f1f5f9;color:#64748b;font-weight:700;text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);font-size:10px;}\n.tbl td{padding:7px 8px;border-bottom:1px solid #f1f1ee;color:#334155;vertical-align:middle;}\n.tbl td.mono,.tbl td .mono{font-family:var(--mono);}\n.sev{display:inline-block;font-size:9px;font-weight:700;padding:1px 7px;border-radius:8px;}\n.sev.hi{background:#fee2e2;color:#991b1b;}\n.sev.mid{background:#fef9ec;color:#92400e;}\n.sev.lo{background:#dcfce7;color:#166534;}\n.kpi{display:flex;gap:8px;flex-wrap:wrap;}\n.kpi .card{flex:1;min-width:88px;background:#f8fafc;border:1px solid var(--line);border-radius:8px;padding:8px 10px;}\n.kpi .card .n{font-size:18px;font-weight:800;color:#0f172a;font-family:var(--mono);}\n.kpi .card .t{font-size:10px;color:#94a3b8;font-weight:600;margin-top:2px;}\n.diff{font-size:11px;font-family:var(--mono);border-radius:6px;overflow:hidden;border:1px solid var(--line);}\n.diff .d{padding:4px 10px;}\n.diff .old{background:#fef2f2;color:#991b1b;}\n.diff .new{background:#f0fdf4;color:#166534;}\n\n/* ── 레이아웃 v2: 항목 컬럼 확장 + 항목 내 화면이동·인터랙션 + 상세내용 하단 카드 ── */\n.items{max-width:640px;min-width:300px;}\n.itm-nav{margin-top:9px;padding-top:7px;border-top:1px dashed #e2e8f0;}\n.nav-tag{display:inline-block;font-size:9.5px;font-weight:700;color:#1d4ed8;background:#e8eefb;border-radius:4px;padding:1px 6px;margin-bottom:4px;letter-spacing:.03em;}\n.nav-row{display:grid;grid-template-columns:minmax(84px,26%) 1fr minmax(96px,30%);gap:10px;font-size:11px;line-height:1.5;padding:3px 0;align-items:start;border-bottom:1px solid #f1f5f9;}\n.nav-row:last-child{border-bottom:none;}\n.nav-el{color:#334155;font-weight:600;}\n.nav-act{color:#64748b;}\n.nav-act strong{color:#334155;}\n.nav-to{color:var(--accent);font-weight:700;}\n.nav-to::before{content:'→ ';color:#94a3b8;font-weight:400;}\n.nav-to.stay{color:#94a3b8;font-weight:600;}\n.nav-global{background:#f8fafc;border:1px solid var(--line);border-radius:8px;padding:10px 12px 8px;margin-bottom:4px;}\n.nav-global-title{font-size:10px;font-weight:700;color:#94a3b8;letter-spacing:.07em;text-transform:uppercase;margin-bottom:4px;}\n.detail-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:10px 18px;}\n.detail-grid .dtl{padding:12px 14px;border:1px solid #eee;border-left:3px solid #e8eefb;border-radius:8px;min-height:0;cursor:pointer;}\n.detail-grid .dtl.active{border-left-color:var(--accent);background:#f5f8ff;border-radius:8px;}\n.dtl-num{display:inline-flex;width:18px;height:18px;border-radius:50%;background:#e0e0e0;color:#888;font-size:10px;font-weight:700;align-items:center;justify-content:center;margin-right:7px;vertical-align:-3px;transition:all .2s;}\n.dtl.active .dtl-num{background:var(--accent);color:#fff;}\n.detail-grid .detail-label{margin-bottom:4px;display:flex;align-items:center;}\n.nav-note{font-size:11px;color:#64748b;line-height:1.65;margin-top:6px;padding-top:6px;border-top:1px solid #eef2f7;}\n.nav-note strong{color:#334155;}\n\n::-webkit-scrollbar{display:none !important;} *{scrollbar-width:none !important;}\n";
const JS="// DSRV 교환·중개 화면기획 — 공통 인터랙션 (영역 브래킷 · 핀↔항목↔상세 연결선 · 클릭 하이라이트 · iframe 높이)\nfunction drawBrackets(){\n  const zones=[...document.querySelectorAll('.frame .zone')];\n  const labels=[...document.querySelectorAll('.lbl')];\n  const svg=document.getElementById('bracketSvg');\n  if(!zones.length||!svg) return;\n  let totalH=0;\n  zones.forEach((z,i)=>{ const h=z.offsetHeight; if(labels[i]) labels[i].style.height=h+'px'; totalH+=h; });\n  svg.setAttribute('height',totalH); svg.innerHTML='';\n  const mk=(tag,attrs)=>{const el=document.createElementNS('http://www.w3.org/2000/svg',tag);Object.entries(attrs).forEach(([k,v])=>el.setAttribute(k,v));return el;};\n  let y=0;\n  zones.forEach((z)=>{ const h=z.offsetHeight; const top=y+6,bot=y+h-6,x=4;\n    svg.appendChild(mk('line',{x1:x,y1:top,x2:x,y2:bot,stroke:'#bbb','stroke-width':'1'}));\n    svg.appendChild(mk('line',{x1:x,y1:top,x2:x+8,y2:top,stroke:'#bbb','stroke-width':'1'}));\n    svg.appendChild(mk('line',{x1:x,y1:bot,x2:x+8,y2:bot,stroke:'#bbb','stroke-width':'1'}));\n    y+=h;\n  });\n}\nfunction drawConnectors(){\n  const svg=document.getElementById('connSvg'); const main=document.querySelector('.main');\n  if(!svg||!main) return; svg.innerHTML=''; const mRect=main.getBoundingClientRect();\n  document.querySelectorAll('.pin').forEach(pin=>{\n    const idx=pin.dataset.idx; const itm=document.querySelector(`.itm[data-idx=\"${idx}\"]`); if(!itm) return;\n    const pRect=pin.getBoundingClientRect(); const iRect=itm.querySelector('.num').getBoundingClientRect();\n    const line=document.createElementNS('http://www.w3.org/2000/svg','line');\n    line.setAttribute('x1',pRect.right-mRect.left+4); line.setAttribute('y1',pRect.top+pRect.height/2-mRect.top);\n    line.setAttribute('x2',iRect.left-mRect.left-4); line.setAttribute('y2',iRect.top+iRect.height/2-mRect.top);\n    line.setAttribute('stroke','#ccc'); line.setAttribute('stroke-width','1'); line.setAttribute('stroke-dasharray','4,3'); line.setAttribute('data-idx',idx);\n    svg.appendChild(line);\n  });\n}\nlet activeIdx=null;\nfunction selectItem(idx,fromTop){\n  if(activeIdx===idx){clearSelection();return;} clearSelection(); activeIdx=idx;\n  const pin=document.querySelector(`.pin[data-idx=\"${idx}\"]`); if(pin) pin.classList.add('active');\n  const area=document.querySelector(`.item-area[data-highlight=\"${idx}\"]`); if(area) area.style.outline='2px solid #2563eb';\n  document.querySelectorAll('.zone').forEach(z=>{ const list=(z.dataset.idx||'').split(',').filter(Boolean); if(list.length===1&&list.includes(String(idx))) z.classList.add('active'); });\n  const itm=document.querySelector(`.itm[data-idx=\"${idx}\"]`); if(itm) itm.classList.add('active');\n  const dtl=document.querySelector(`.dtl[data-idx=\"${idx}\"]`); if(dtl){dtl.classList.add('active'); if(fromTop&&dtl.closest('.detail-grid')) dtl.scrollIntoView({block:'nearest',behavior:'smooth'});}\n  const line=document.querySelector(`#connSvg line[data-idx=\"${idx}\"]`); if(line){line.setAttribute('stroke','#2563eb');line.setAttribute('stroke-width','1.5');}\n}\nfunction clearSelection(){\n  activeIdx=null;\n  document.querySelectorAll('.pin.active').forEach(p=>p.classList.remove('active'));\n  document.querySelectorAll('.zone.active').forEach(z=>z.classList.remove('active'));\n  document.querySelectorAll('.itm.active').forEach(i=>i.classList.remove('active'));\n  document.querySelectorAll('.dtl.active').forEach(d=>d.classList.remove('active'));\n  document.querySelectorAll('.item-area').forEach(a=>a.style.outline='none');\n  document.querySelectorAll('#connSvg line').forEach(l=>{l.setAttribute('stroke','#ccc');l.setAttribute('stroke-width','1');});\n}\ndocument.addEventListener('click',(e)=>{\n  const pin=e.target.closest('.pin'); const itm=e.target.closest('.itm'); const dtl=e.target.closest('.dtl');\n  if(pin){selectItem(pin.dataset.idx,true);return;}\n  if(itm&&itm.dataset.idx!==undefined){selectItem(itm.dataset.idx,true);return;}\n  if(dtl&&dtl.dataset.idx!==undefined){selectItem(dtl.dataset.idx);return;}\n  if(!e.target.closest('.zone')&&!e.target.closest('.itm')&&!e.target.closest('.dtl')) clearSelection();\n});\nfunction relayout(){drawBrackets();drawConnectors();reportH();}\nfunction reportH(){var h=Math.max(document.documentElement.scrollHeight,document.body.scrollHeight);window.parent&&window.parent.postMessage({type:\"iframeHeight\",h:h},\"*\");}\nwindow.addEventListener('load',()=>{relayout();setTimeout(relayout,300);setTimeout(relayout,900);});\nwindow.addEventListener('resize',relayout);\n";
const PROC="\u003c!DOCTYPE html>\n\u003chtml lang=\"ko\">\n\u003chead>\n\u003cmeta charset=\"UTF-8\">\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n\u003ctitle>화면 흐름도 — DSRV 교환·중개\u003c/title>\n\u003cstyle>\n  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap');\n  *{margin:0;padding:0;box-sizing:border-box;}\n  body{font-family:'Noto Sans KR',system-ui,sans-serif;background:#fafafa;color:#222;padding:28px 36px 60px;}\n  h1{font-size:20px;font-weight:800;margin-bottom:6px;}\n  .subtitle{font-size:12px;color:#888;margin-bottom:20px;}\n  .legend{display:flex;gap:22px;margin-bottom:24px;padding:12px 18px;background:#fff;border:1px solid #ddd;border-radius:8px;width:fit-content;}\n  .legend-item{display:flex;align-items:center;gap:8px;font-size:12px;color:#555;}\n  .legend-box{width:46px;height:26px;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:9px;}\n  .legend-box.page{border:1.5px solid #2563eb;background:#fff;color:#2563eb;}\n  .legend-box.question{width:26px;height:26px;border:1.5px solid #aaa;background:#fff;transform:rotate(45deg);flex-shrink:0;}\n  .legend-box.internal{background:#64748b;color:#fff;}\n\n  .section{margin-bottom:10px;border-bottom:1px solid #e0e0e0;padding-bottom:12px;overflow:visible;}\n  .section:last-child{border-bottom:none;}\n  .section-header{display:flex;align-items:center;gap:10px;font-size:13px;font-weight:800;color:#1d4ed8;margin-bottom:14px;padding:6px 12px;background:#eff6ff;border-radius:6px;width:fit-content;}\n  .section-header .tag{font-size:9px;font-weight:700;color:#92400e;background:#fef9ec;border:1px solid #fde68a;padding:1px 7px;border-radius:8px;}\n  .flow-scroll{overflow-x:auto;overflow-y:visible;padding-bottom:10px;}\n  .flow-row{display:flex;align-items:center;gap:0;min-width:max-content;padding:4px 0;}\n\n  .box{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;flex-shrink:0;position:relative;}\n  .box .name{font-size:11px;font-weight:600;line-height:1.3;white-space:nowrap;}\n  .box .pid{font-size:8px;color:#94a3b8;margin-top:2px;font-family:monospace;}\n  .box.page .inner{border:1.5px solid #93c5fd;background:#fff;border-radius:6px;padding:7px 12px 5px;min-height:40px;display:flex;flex-direction:column;align-items:center;justify-content:center;}\n  .box.page .inner:hover{border-color:#2563eb;box-shadow:0 2px 8px rgba(37,99,235,.15);}\n  .box.question{width:70px;height:70px;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;position:relative;}\n  .box.question .inner{position:absolute;width:50px;height:50px;background:#fff;border:1.5px solid #aaa;border-radius:3px;transform:rotate(45deg);display:flex;align-items:center;justify-content:center;}\n  .box.question .name{transform:rotate(-45deg);font-size:9px;font-weight:600;line-height:1.2;white-space:normal;width:44px;text-align:center;}\n  .box.internal .inner{background:#64748b;color:#fff;border-radius:6px;padding:7px 12px 5px;min-height:40px;display:flex;flex-direction:column;align-items:center;justify-content:center;}\n  .box.internal .name{color:#fff;}\n  .box.internal .pid{display:none;}\n\n  .arrow{display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:30px;flex-shrink:0;position:relative;height:40px;}\n  .arrow .line{width:18px;height:1.5px;background:#94a3b8;position:relative;}\n  .arrow .line::after{content:'';position:absolute;right:-4px;top:50%;transform:translateY(-50%);width:0;height:0;border:3px solid transparent;border-left:4px solid #94a3b8;}\n  .arrow .label{font-size:9px;color:#334155;white-space:nowrap;margin-bottom:1px;font-weight:600;}\n\n  .fork{display:flex;flex-direction:column;gap:6px;flex-shrink:0;overflow:visible;}\n  .fork-row{display:flex;align-items:center;gap:0;min-width:max-content;overflow:visible;}\n  .fork-line{width:18px;flex-shrink:0;align-self:stretch;position:relative;}\n  .fork-line::before{content:'';position:absolute;left:0;width:1.5px;background:#94a3b8;}\n  .fork-line.fork-top::before{top:50%;bottom:0;}\n  .fork-line.fork-bottom::before{top:0;bottom:50%;}\n  .fork-line.fork-mid::before{top:0;bottom:0;}\n  .fork-line::after{content:'';position:absolute;left:0;top:50%;transform:translateY(-50%);width:18px;height:1.5px;background:#94a3b8;}\n  .fork-line .fork-arrow{position:absolute;right:-4px;top:50%;transform:translateY(-50%);width:0;height:0;border:3px solid transparent;border-left:4px solid #94a3b8;}\n\n  .section-note{font-size:11px;color:#777;margin-top:6px;padding-left:8px;font-style:italic;}\n  .flow-scroll::-webkit-scrollbar{height:6px;}\n  .flow-scroll::-webkit-scrollbar-thumb{background:#ccc;border-radius:3px;}\n\n  .box.page-current .inner{border-color:#f59e0b !important;box-shadow:0 0 0 3px rgba(245,158,11,.25);background:#fffbeb;}\n  .box.page-current .pid{color:#d97706;font-weight:700;}\n  .box.page-current .name{color:#92400e;}\n\n  #floating-thumb{display:none;position:fixed;width:240px;height:150px;border:1px solid #ddd;border-radius:8px;overflow:hidden;background:#fff;box-shadow:0 4px 16px rgba(0,0,0,.2);z-index:9999;pointer-events:none;}\n  #floating-thumb iframe{width:500%;height:500%;transform:scale(0.2);transform-origin:top left;border:none;pointer-events:none;}\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\n\u003ch1>화면 흐름도 — DSRV 교환·중개\u003c/h1>\n\u003cdiv class=\"subtitle\">온보딩·로그인 → 대시보드 → 나목 교환(교환하기 탭) · 마목 중개(교환게시판 탭) → 관리자 · 박스 클릭 시 해당 화면으로 이동\u003c/div>\n\n\u003cdiv class=\"legend\">\n  \u003cdiv class=\"legend-item\">\u003cdiv class=\"legend-box page\">화면\u003c/div>\u003cspan>기획된 화면(클릭 이동)\u003c/span>\u003c/div>\n  \u003cdiv class=\"legend-item\">\u003cdiv class=\"legend-box question\">\u003c/div>\u003cspan>분기\u003c/span>\u003c/div>\n  \u003cdiv class=\"legend-item\">\u003cdiv class=\"legend-box internal\">처리\u003c/div>\u003cspan>내부 처리·상태\u003c/span>\u003c/div>\n\u003c/div>\n\n\u003cdiv id=\"floating-thumb\">\u003ciframe id=\"floating-thumb-iframe\" loading=\"lazy\">\u003c/iframe>\u003c/div>\n\u003cdiv id=\"diagram\">\u003c/div>\n\n\u003cscript>\nfunction page(name,pid){return {type:'page',name,pid};}\nfunction question(name){return {type:'question',name,pid:''};}\nfunction internal(name){return {type:'internal',name,pid:''};}\nfunction arrow(label){return {type:'arrow',label:label||''};}\nfunction fork(paths){return {type:'fork',paths};}\n\nconst sections = [\n  {\n    title:'⓪ 진입 — 온보딩·로그인', tag:'최초 1회 활성화 + 매 로그인',\n    note:'* 가입 완료 후 초대 이메일 링크로 계정 활성화(비밀번호 본인설정 + 2FA QR·백업코드) → 로그인 → 홈. 셀프가입 없음(초대 기반). 초기 비밀번호 생성·전달 없음.',\n    rows:[{ type:'flow', items:[\n      internal('가입 완료\\n(계정 개설)'), arrow('초대 메일'),\n      page('초대 이메일','ONB-00'), arrow('링크 클릭'),\n      page('계정 활성화','ONB-01'), arrow('완료'),\n      page('로그인','AUTH-01'), arrow('성공'),\n      page('대시보드','DASH-01'),\n      fork([\n        { label:'교환하기', items:[ page('교환하기','EXC-01') ] },\n        { label:'교환게시판', items:[ page('교환 게시판','BRK-01') ] },\n        { label:'계정·보안', items:[ page('비밀번호 수정','DASH-02') ] },\n        { label:'', items:[ page('2차 인증 재설정','DASH-03') ] },\n      ])\n    ]}]\n  },\n  {\n    title:'① 나목 교환 (DSRV가 상대방)', tag:'교환하기 탭',\n    note:'* 자동체결 거래소·MM 아님 — 오더북/상시 양방향 호가 없음, 단건 RFQ, 외부지표+고정 스프레드(가격형성 아님), 비율은 시스템 자동 산정(2026-09-02 확정), 체결은 수락 + 건별 수동 승인·집행. 건별 한도 1,000 USD 상당(USD 환산) · 가용 풀 한도 내에서만 교환.',\n    rows:[{ type:'flow', items:[\n      page('대시보드','DASH-01'), arrow('교환하기'),\n      page('교환하기','EXC-01'), arrow('비율 요청'),\n      page('비율 확인·수락','EXC-02'),\n      fork([\n        { label:'수락', items:[ page('승인 진행','EXC-03'), arrow(), page('내역·완료','EXC-04') ] },\n        { label:'거절', items:[ internal('요청으로 회귀\\n(EXC-01)') ] },\n        { label:'만료·이탈·\\n풀 부족', items:[ internal('교환 불가\\n(집행 안 함)') ] },\n      ])\n    ]}]\n  },\n  {\n    title:'② 마목 중개 — 게시(RFQ 등록)', tag:'교환게시판 탭',\n    note:'* 단순 게시판 아님(4요소: 거래 안전성 검증·KYC담보·정산연계·수수료). 게시 시 보유·처분권 게이트 + 편차 경고 + 시세변동 자동중지(내부 정책)·유효기간 30일 · 건별 한도 1,000 USD 상당(공통). 게시 회수는 BRK-06(게시자 능동 행위). 자동 매칭·자동 체결 없음.',\n    rows:[{ type:'flow', items:[\n      page('대시보드','DASH-01'), arrow('교환게시판'),\n      page('교환 게시판','BRK-01'), arrow('+ 거래의향 등록'),\n      page('거래의향 등록','BRK-02'), arrow('게이트 통과\\n게시(단독)'),\n      page('내 게시 상세·회수','BRK-06'),\n      fork([\n        { label:'신청 도착', items:[ page('받은 신청·수락','BRK-04') ] },\n        { label:'게시 내리기', items:[ internal('회수 — 게시판 제외\\n자산이동·수수료 없음') ] },\n        { label:'시세변동·\\n유효기간 30일', items:[ internal('자동중지(내부 정책) /\\n완료(유효기간 만료)') ] },\n      ])\n    ]}]\n  },\n  {\n    title:'③ 마목 중개 — 수락(기존 RFQ 거래)', tag:'교환게시판 탭',\n    note:'* DSRV 비참여·기록만(당사자 간 신청·수락, 역제안 없음). 신청 유효 영업일 2일 — 기한 내 수락(가입자 단독 실행 — 1기관 1가입자, 2026-09-01) 시 즉시 확정·구속력 발생 → 커스터디 콜드 수동 이전(양건 확인 후 순차)·수수료 = 거래액 1% 고정·양측 각자(2026-09-02 확정). 신청·수락·완료·회수 이메일 통지 4종. 신청자 진행 조회 BRK-07 · 게시자 회수 BRK-06(2026-09-02 추가).',\n    rows:[{ type:'flow', items:[\n      page('교환 게시판','BRK-01'), arrow('행 선택·신청'),\n      page('신청하기','BRK-03'), arrow('신청 접수\\n(유효 영업일 2일)'),\n      page('내 신청 상세','BRK-07'), arrow('게시자 측\\nBRK-06 → 신청 선택'),\n      page('받은 신청·수락','BRK-04'),\n      fork([\n        { label:'수락\\n(즉시 확정)', items:[ page('이전·완료','BRK-05') ] },\n        { label:'거절·만료', items:[ internal('자산이동·\\n수수료 없음') ] },\n      ])\n    ]}]\n  },\n  {\n    title:'④ 지갑·자산 — 별도 화면 없음 (입금은 대시보드 · 출금/이전은 서면 절차)', tag:'대시보드 → 지갑 잔고',\n    note:'* 고객 화면은 조회·입금까지만 — 출금/이전 요청은 커스터디 수탁 지갑의 서면 절차로 접수(온라인 화면 없음, 2026-09-01 제거). 화이트리스트는 내부 관리(고객·어드민 화면 없음). WAL-01 삭제(2026-09-01) — 입금 전용 주소는 대시보드 지갑 잔고 하단에 전문 표시(QR·말줄임 없음). 집행은 DSRV 어드민 홈(ADM-02) 처리함 승인 + 콜드 2인 멀티시그(커스터디 운영절차).',\n    rows:[{ type:'flow', items:[\n      page('대시보드','DASH-01'), arrow('출금/이전 필요 시'),\n      internal('서면 요청 접수\\n(커스터디 절차 · 오프라인)'), arrow(),\n      internal('DSRV 승인(ADM-02 처리함)\\n→ 콜드 집행(커스터디 절차)')\n    ]}]\n  },\n  {\n    title:'⑤ 관리자 (DSRV Admin)', tag:'고객사 노출 없음',\n    note:'* 개편 2026-09-01 — 어드민 2화면. 홈(ADM-02)의 알람·워닝 처리함이 EXC-03·BRK-04·출금 건 승인, 격리·동결, 잠금 해제의 처리처이고 조회성 데이터는 CSV 다운로드 6종(기관-가입자·거래 요청·통합 거래·구분회계·3면 대사·열람 기록). 설정(ADM-03)이 EXC-02·BRK-02 등 표출값의 단일 출처 + 기관·가입자 관리(기관당 1명).',\n    rows:[{ type:'flow', items:[\n      page('어드민 홈\\n(알람·워닝 + CSV)','ADM-02'), arrow('정책·기관 관리'),\n      page('설정','ADM-03')\n    ]}]\n  },\n];\n\nconst FILE_MAP = {\n  'ONB-00':'onb-00.html','ONB-01':'onb-01.html','AUTH-01':'auth-01.html','DASH-01':'dash-01.html','DASH-02':'dash-02.html','DASH-03':'dash-03.html',\n  'EXC-01':'exc-01.html','EXC-02':'exc-02.html','EXC-03':'exc-03.html','EXC-04':'exc-04.html',\n  'BRK-01':'brk-01.html','BRK-02':'brk-02.html','BRK-03':'brk-03.html','BRK-04':'brk-04.html','BRK-05':'brk-05.html','BRK-06':'brk-06.html','BRK-07':'brk-07.html',\n  'ADM-02':'adm-02.html','ADM-03':'adm-03.html',\n};\n\nconst diagram = document.getElementById('diagram');\n\nfunction renderItem(item){\n  if(item.type==='arrow'){\n    const el=document.createElement('div'); el.className='arrow';\n    if(item.label){const lbl=document.createElement('div');lbl.className='label';lbl.innerHTML=item.label.replace(/\\n/g,'\u003cbr>');el.appendChild(lbl);}\n    const line=document.createElement('div');line.className='line';el.appendChild(line);\n    return el;\n  }\n  const wrapper=document.createElement('div'); wrapper.className='box '+item.type;\n  const inner=document.createElement('div'); inner.className='inner';\n  const nameEl=document.createElement('div'); nameEl.className='name'; nameEl.innerHTML=item.name.replace(/\\n/g,'\u003cbr>'); inner.appendChild(nameEl);\n  if(item.pid){const pidEl=document.createElement('div');pidEl.className='pid';pidEl.textContent=item.pid;inner.appendChild(pidEl);}\n  if(item.type==='page'&&item.pid){\n    inner.style.cursor='pointer';\n    inner.onclick=()=>{ if(window.parent!==window) window.parent.postMessage({type:'navigate',pageId:item.pid},'*'); };\n  }\n  wrapper.appendChild(inner);\n  if(item.type==='page'&&item.pid&&FILE_MAP[item.pid]){wrapper.dataset.thumbSrc=FILE_MAP[item.pid];wrapper.dataset.thumbPid=item.pid;}\n  return wrapper;\n}\nfunction renderItems(items,container){ items.forEach(item=>{\n  if(item.type==='fork'){renderFork(item,container);return;}\n  const el=renderItem(item); if(el) container.appendChild(el);\n});}\nfunction renderFork(forkData,container){\n  const forkDiv=document.createElement('div'); forkDiv.className='fork';\n  const n=forkData.paths.length;\n  forkData.paths.forEach((path,idx)=>{\n    const rowDiv=document.createElement('div'); rowDiv.className='fork-row';\n    const fl=document.createElement('div'); fl.className='fork-line '+(idx===0?'fork-top':idx===n-1?'fork-bottom':'fork-mid');\n    const fa=document.createElement('div'); fa.className='fork-arrow'; fl.appendChild(fa); rowDiv.appendChild(fl);\n    if(path.label){const lbl=document.createElement('span');lbl.style.cssText='font-size:9px;color:#334155;font-weight:700;padding:0 5px;white-space:pre-line;align-self:center;text-align:center;';lbl.textContent=path.label;rowDiv.appendChild(lbl);}\n    renderItems(path.items,rowDiv);\n    if(path.subfork) renderFork(path.subfork,rowDiv);\n    forkDiv.appendChild(rowDiv);\n  });\n  container.appendChild(forkDiv);\n}\n\nsections.forEach(sec=>{\n  const sectionDiv=document.createElement('div'); sectionDiv.className='section';\n  const header=document.createElement('div'); header.className='section-header';\n  const t=document.createElement('span'); t.textContent=sec.title; header.appendChild(t);\n  if(sec.tag){const tg=document.createElement('span');tg.className='tag';tg.textContent=sec.tag;header.appendChild(tg);}\n  sectionDiv.appendChild(header);\n  const scrollDiv=document.createElement('div'); scrollDiv.className='flow-scroll';\n  const flowContainer=document.createElement('div'); flowContainer.className='flow-row';\n  sec.rows.forEach(row=>{ if(row.type==='flow') renderItems(row.items,flowContainer); });\n  scrollDiv.appendChild(flowContainer); sectionDiv.appendChild(scrollDiv);\n  if(sec.note){const nd=document.createElement('div');nd.className='section-note';nd.textContent=sec.note;sectionDiv.appendChild(nd);}\n  diagram.appendChild(sectionDiv);\n});\n\n// 부모에서 현재 화면 하이라이트\nwindow.addEventListener('message',(e)=>{\n  if(!e.data||e.data.type!=='highlightPage')return;\n  document.querySelectorAll('.box.page-current').forEach(el=>el.classList.remove('page-current'));\n  const pid=e.data.pid; if(!pid)return;\n  document.querySelectorAll(`.box[data-thumb-pid=\"${pid}\"]`).forEach(el=>{\n    el.classList.add('page-current');\n    el.scrollIntoView({behavior:'smooth',block:'center',inline:'center'});\n  });\n});\n\n// floating 섬네일 hover\nconst floatThumb=document.getElementById('floating-thumb');\nconst floatIframe=document.getElementById('floating-thumb-iframe');\nlet currentSrc='';\ndocument.addEventListener('mouseover',(e)=>{\n  const box=e.target.closest('.box[data-thumb-src]'); if(!box)return;\n  const src=box.dataset.thumbSrc; if(src!==currentSrc){floatIframe.removeAttribute('src');floatIframe.srcdoc=(window.SCREEN_DOCS&&window.SCREEN_DOCS[src])||'';currentSrc=src;}\n  const r=box.getBoundingClientRect(); const tw=240,th=150;\n  let top=r.top-th-8; if(top\u003c8) top=r.bottom+8;\n  let left=r.left+r.width/2-tw/2; left=Math.max(8,Math.min(left,window.innerWidth-tw-8));\n  floatThumb.style.top=top+'px'; floatThumb.style.left=left+'px'; floatThumb.style.display='block';\n});\ndocument.addEventListener('mouseout',(e)=>{\n  const box=e.target.closest('.box[data-thumb-src]'); if(!box)return;\n  if(box.contains(e.relatedTarget))return;\n  floatThumb.style.display='none';\n});\n\u003c/script>\n\u003cscript>window.addEventListener('message',function(e){if(e.data&&e.data.type==='screenDocs')window.SCREEN_DOCS=e.data.docs;});\u003c/script>\n\u003c/body>\n\u003c/html>\n";
const IA="\u003c!DOCTYPE html>\n\u003chtml lang=\"ko\">\n\u003chead>\n\u003cmeta charset=\"UTF-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n\u003ctitle>IA — 정보구조 (교환·중개 콘솔)\u003c/title>\n\u003cstyle>\n  @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');\n  * { margin:0; padding:0; box-sizing:border-box; }\n  body { font-family:'Pretendard', system-ui, -apple-system, sans-serif; background:#fafafa; color:#1e293b;\n         font-size:13px; line-height:1.6; padding:28px 32px 60px; }\n  .doc-head { max-width:1060px; margin:0 auto 22px; }\n  .doc-head h1 { font-size:19px; font-weight:800; letter-spacing:-.01em; }\n  .doc-head .sub { font-size:11.5px; color:#64748b; margin-top:3px; }\n  .cols { max-width:1060px; margin:0 auto; display:grid; grid-template-columns:1fr 1fr; gap:20px; align-items:start; }\n  @media (max-width:900px){ .cols { grid-template-columns:1fr; } }\n  .panel { background:#fff; border:1px solid #e2e8f0; border-radius:10px; padding:18px 20px 20px; }\n  .panel-title { font-size:13.5px; font-weight:800; display:flex; align-items:baseline; gap:8px; margin-bottom:4px; }\n  .panel-title .scope { font-size:10px; font-weight:600; color:#64748b; }\n  .panel-note { font-size:10.5px; color:#94a3b8; margin-bottom:12px; }\n\n  ul.tree { list-style:none; }\n  ul.tree ul { list-style:none; margin-left:14px; padding-left:14px; border-left:1.5px solid #e2e8f0; }\n  ul.tree li { margin:7px 0; }\n  .node { font-weight:700; font-size:12.5px; color:#0f172a; }\n  .node .lv { display:inline-block; font-size:9px; font-weight:700; color:#64748b; background:#f1f5f9;\n              border:1px solid #e2e8f0; border-radius:4px; padding:0 6px; margin-right:6px; vertical-align:1px; }\n  .node .lv.gnb { color:#1d4ed8; background:#eff6ff; border-color:#bfdbfe; }\n  .node .lv.tab { color:#7c2d12; background:#fff7ed; border-color:#fed7aa; }\n  .desc { display:block; font-size:10.5px; font-weight:400; 03c/span>\u003cspan class=\"arr\">→\u003c/span>\n          \u003cspan class=\"scr\" data-pid=\"ONB-01\">\u003cspan class=\"sid\">ONB-01\u003c/span>계정 활성화\u003c/span>\u003cspan class=\"arr\">→\u003c/span>\n          \u003cspan class=\"scr\" data-pid=\"AUTH-01\">\u003cspan class=\"sid\">AUTH-01\u003c/span>로그인\u003c/span>\n        \u003c/div>\n      \u003c/li>\n      \u003cli>\n        \u003cspan class=\"node\">\u003cspan class=\"lv gnb\">GNB 1\u003c/span>대시보드\u003c/span>\n        \u003cdiv class=\"flowline\">\u003cspan class=\"scr\" data-pid=\"DASH-01\">\u003cspan class=\"sid\">DASH-01\u003c/span>거래현황·계정·활동로그\u003c/span>\u003c/div>\n        \u003cul>\n          \u003cli>\n            \u003cspan class=\"node\">계정·보안 \u003cspan class=\"desc\">대시보드 내 계정 영역에서 진입\u003c/span>\u003c/span>\n            \u003cdiv class=\"flowline\">\n              \u003cspan class=\"scr\" data-pid=\"DASH-02\">\u003cspan class=\"sid\">DASH-02\u003c/span>비밀번호 수정\u003c/span>\n              \u003cspan class=\"scr\" data-pid=\"DASH-03\">\u003cspan class=\"sid\">DASH-03\u003c/span>2차 인증 재설정\u003c/span>\n            \u003c/div>\n          \u003c/li>\n          \u003cli>\n            \u003cspan class=\"node\">지갑·자산 \u003cspan class=\"desc\">별도 화면 없음 — 입금 주소는 대시보드 지갑 잔고 하단(WAL-01 삭제), 출금/이전은 서면 절차, 화이트리스트는 내부 관리\u003c/span>\u003c/span>\n          \u003c/li>\n        \u003c/ul>\n      \u003c/li>\n      \u003cli>\n        \u003cspan class=\"node\">\u003cspan class=\"lv gnb\">GNB 2\u003c/span>교환하기 \u003cspan class=\"desc\">나목 — DSRV가 상대방 · 단건 RFQ\u003c/span>\u003c/span>\n        \u003cdiv class=\"flowline\">\n          \u003cspan class=\"scr\" data-pid=\"EXC-01\">\u003cspan class=\"sid\">EXC-01\u003c/span>교환하기\u003c/span>\u003cspan class=\"arr\">→\u003c/span>\n          \u003cspan class=\"scr\" data-pid=\"EXC-02\">\u003cspan class=\"sid\">EXC-02\u003c/span>비율 확인·수락\u003c/span>\u003cspan class=\"arr\">→\u003c/span>\n          \u003cspan class=\"scr\" data-pid=\"EXC-03\">\u003cspan class=\"sid\">EXC-03\u003
