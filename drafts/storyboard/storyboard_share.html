ass=\"detail-label\">\u003cspan class=\"dtl-num\">3\u003c/span>만료 처리 · 시각 동기\u003c/div>\n      \u003cdiv class=\"dtl-body\">\u003cspan class=\"box\">· 만료 판정 정본 = 서버(제시 시각 + {유효시간}초) · 클라이언트 타이머는 서버가 준 만료 시각을 표시만 — 클라이언트 시계 오차·탭 절전으로 표시가 어긋나도 서버 판정이 우선\u003cbr>· 표시상 00:00 도달 → 즉시 [수락] 비활성(서버 왕복 없음) · 표시상 잔여가 있어도 서버 기한 경과면 [수락] 실패 ⓐ(\"견적이 만료되었습니다\")\u003cbr>· 만료 건 상태 = '만료' 자동 종결 → 새 비율은 EXC-01에서 재요청(같은 요청번호 재사용 없음)\u003cbr>· 기한은 수락 행위에만 적용 — 수락 후 DSRV 거래 진행(약 {정책값 2영업일})은 기한과 무관(진행 지연 리스크 분리)\u003c/span>\u003c/div>\n      \u003c/div>\n      \u003cdiv class=\"dtl\" data-idx=\"3\">\n        \u003cdiv class=\"detail-label\">\u003cspan class=\"dtl-num\">4\u003c/span>문구 통제 [로펌게이트]\u003c/div>\n      \u003cdiv class=\"dtl-body\">\u003cspan class=\"box\">'시세 제시 = 가격형성'으로 오인되지 않도록 문구 확정 필요. G0 사전면담 소명자료와 정합. 금지 표현('공식 LP'·'마켓메이커'·'플랫폼 보증'·'최저가 보장')은 EXC-01 상세 5와 동일.\u003c/span>\u003c/div>\n      \u003c/div>\n      \u003cdiv class=\"dtl\" data-idx=\"4\">\n        \u003cdiv class=\"detail-label\">\u003cspan class=\"dtl-num\">5\u003c/span>[수락] 확인 다이얼로그 없음 — 결정 근거 · 수락 후 상태\u003c/div>\n      \u003cdiv class=\"dtl-body\">\u003cspan class=\"box\">· 2026-09-02(4) 결정: EXC-01 참고 비율 + EXC-02 확정 비율 2회 고지 + 버튼 아래 결과 고지 1문장으로 구속력 인지 충족 → 모달 확인 생략(수락 기한 내 클릭 수 최소화) · 종전 ADM-03 상세 \"구속력 행위는 확인 문구\"와의 불일치는 notation 공통 UI 규격에 예외로 명기\u003cbr>· 수락 후 상태: 수락(확정) → DSRV 거래 진행중(EXC-03) → 완료 / 거절 / 만료(EXC-04) — 고객 화면 '보류' 없음(2026-09-02 결정) · 고객사 측 통제는 커스터디 콜드월렛 다중승인 이체로 수행(ISMS 2.2.2)\u003cbr>· 수락 후 고객 취소 동선 없음 — 취소·거절은 DSRV 처리(ADM-02)만 — 관리자 보류는 내부 상태로 고객 화면 변화 없음\u003c/span>\u003c/div>\n      \u003c/div>\n      \u003cdiv class=\"dtl\" data-idx=\"6\">\n        \u003cdiv class=\"detail-label\">\u003cspan class=\"dtl-num\">7\u003c/span>교환 불가 3분기 — 인지 시점·화면\u003c/div>\n      \u003cdiv class=\"dtl-body\">\n        \u003cspan class=\"box\">① \u003cstrong>만료\u003c/strong>: 이 화면 — 타이머 \"만료됨\" + [수락] 비활성(항목 3 ②) / 이탈 후 만료도 서버 자동 종결 · \u003cstrong>만료 통지 메일 ⑥ 발송\u003c/strong>(2026-09-02(10)) → EXC-01 재요청\u003cbr>② \u003cstrong>가용 풀 부족\u003c/strong>: [수락] 클릭 시 서버 재검증 실패 ⓑ — 이 화면 인라인 ⚠ → EXC-01 재요청 / 수락 후 집행 시점 부족은 EXC-04 '만료' 사유(가용 풀 부족·비율 변동)\u003cbr>③ \u003cstrong>비율 변동(스프레드 이탈)\u003c/strong>: 수락 후 집행 전 외부지표가 ADM-03 이탈 임계 초과 → 집행 정지 → EXC-04 '만료' 사유(가용 풀 부족·비율 변동) + 이메일 통지 \u003cspan class=\"chk\">[확인필요: 통지 종류 — 공통 4종 외]\u003c/span>\u003c/span>\n      \u003c/div>\n      \u003c/div>\n    \u003c/div>\n  \u003c/div>\n\u003c/section>\n\n\u003csection class=\"footer-note\">\n  \u003cdiv class=\"note-card\">\n    \u003cdiv class=\"note-title\">비고\u003c/div>\n    \u003cdiv class=\"note-body\">\n      · \u003cstrong>[방어 핵심]\u003c/strong> \"DSRV가 가격을 만든다\"가 아니라 \"외부지표 + 사전 고시된 고정 스프레드로 시스템이 \u003cstrong>건별 비율을 자동 계산해 고시\u003c/strong>한다(사람의 재량 없음 = 가격형성 아님)\"를 증빙하는 화면. 스프레드·수락 기한·성격 고지를 화면에 노출.\u003cbr>\n      · 비율·스프레드·수락 기한·이탈 임계값의 \u003cstrong>단일 출처는 ADM-03\u003c/strong> — 이 화면은 그 값을 표출만. 시세 소스명은 고객 화면 미노출.\u003cbr>\n      · \u003cstrong>[수락] = 클릭 즉시 확정 · 확인 다이얼로그 없음\u003c/strong>(2026-09-02 결정) · [거절] 확인 없음 → EXC-01 복귀.\u003cbr>\n      · 2026-09-02 설명 형식 개정 적용(핀 = 조작 요소 단위) — 표시 5 · 버튼 2([수락]·[거절] 분리), 버튼 행 = 활성 조건 / 클릭 후 / 실패 3행 · 프레임에 GNB 추가(EXC-01과 동일) · 만료 상태 태그 추가 · 예시 900 USDC → 899.73 USDT(0.9997)로 교체.\u003cbr>\n      · \u003cspan class=\"chk\">[확인필요]\u003c/span> 수락 기한 {유효시간}·이탈 임계 수치(ADM-03 정책값 미확정) · 만료·거절 건의 DASH-01 목록 노출 여부 · 만료 후 [거절] 라벨· 이탈 후 만료 건 고객 통지 여부.\u003cbr>\n      · 다음 화면: 승인 진행 (EXC-03)\n    \u003c/div>\n  \u003c/div>\n\u003c/section>\n\n\u003cscript src=\"screen.js\">\u003c/script>\n\u003c/body>\n\u003c/html>\n", "exc-03.html": "\u003c!DOCTYPE html>\n\u003chtml lang=\"ko\">\n\u003chead>\n\u003cmeta charset=\"UTF-8\">\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n\u003ctitle>화면기획 — 승인 진행\u003c/title>\n\u003clink rel=\"stylesheet\" href=\"screen.css\">\n\u003c/head>\n\u003cbody>\n\n\u003cheader class=\"header\">\n  \u003cdiv class=\"crumb\">\u003cspan>나목 교환\u003c/span>\u003cspan class=\"s\">›\u003c/span>\u003cspan>교환하기\u003c/span>\u003cspan class=\"s\">›\u003c/span>\u003cspan>승인 진행\u003c/span>\u003c/div>\n  \u003ch1 class=\"title\">승인 진행\u003c/h1>\n  \u003cspan class=\"sid\">EXC-03\u003c/span>\n  \u003cspan class=\"defense\">실질심사 · 자동 승인/거절 아님\u003c/span>\n\u003c/header>\n\n\u003cdiv class=\"main\">\n  \u003cdiv class=\"screen-panel\">\n    \u003cdiv style=\"position:relative;display:flex;\">\n      \u003cdiv class=\"labels\" id=\"labels\">\n        \u003cdiv class=\"lbl\">\u003cspan class=\"lbl-text\">전역\u003cbr>상단\u003c/span>\u003c/div>\n        \u003cdiv class=\"lbl\">\u003cspan class=\"lbl-text\">거래 상태\u003c/span>\u003c/div>\n        \u003cdiv class=\"lbl\">\u003cspan class=\"lbl-text\">소요 안내\u003c/span>\u003c/div>\n        \u003cdiv class=\"lbl\">\u003cspan class=\"lbl-text\">요청 내역\u003c/span>\u003c/div>\n        \u003cdiv class=\"lbl\">\u003cspan class=\"lbl-text\">액션\u003c/span>\u003c/div>\n      \u003c/div>\n      \u003csvg id=\"bracketSvg\" width=\"24\" style=\"flex-shrink:0;overflow:visible;\">\u003c/svg>\n    \u003c/div>\n\n    \u003cdiv class=\"frame\" id=\"frame\">\n      \u003c!-- 전역: 콘솔 상단 + GNB (핀 없음 — nav-global 행으로 처리) -->\n      \u003cdiv class=\"zone\" data-idx=\"\">\n        \u003cdiv class=\"zone-highlight\">\u003c/div>\n        \u003cdiv class=\"c-top\" style=\"border-radius:8px 8px 0 0;\">\n          \u003cspan class=\"brand\" style=\"cursor:pointer;\">DSRV Desk\u003c/span>\n          \u003cspan class=\"meta\">\u003cspan class=\"c-badge\">A자산운용\u003c/span>\u003c/span>\n        \u003c/div>\n        \u003cdiv class=\"c-adminbar\" style=\"margin:0;\">\n          \u003cspan class=\"m\">대시보드\u003c/span>\n          \u003cspan class=\"m on\" style=\"background:#dbeafe;color:#1d4ed8;\">교환하기\u003c/span>\n          \u003cspan class=\"m\">교환게시판\u003c/span>\n        \u003c/div>\n      \u003c/div>\n\n      \u003c!-- 거래 상태 스텝바 (표시 전용) -->\n      \u003cdiv class=\"zone\" data-idx=\"0\">\n        \u003cdiv class=\"zone-highlight\">\u003c/div>\n        \u003cdiv class=\"item-area\" data-highlight=\"0\" style=\"position:relative;padding:6px;border-radius:8px;\">\n          \u003cdiv class=\"pin\" data-idx=\"0\" style=\"top:-4px;right:-4px;\">1\u003c/div>\n          \u003cdiv class=\"zone-title\">거래 상태\u003c/div>\n          \u003cdiv class=\"steps\" style=\"flex-wrap:wrap;gap:8px;\">\n            \u003cspan class=\"step done\">\u003cspan class=\"dot\">✓\u003c/span>비율 수락\u003c/span>\u003cspan class=\"arrow\">→\u003c/span>\n            \u003cspan class=\"step now\">\u003cspan class=\"dot\">2\u003c/span>DSRV 거래 진행중\u003c/span>\u003cspan class=\"arrow\">→\u003c/span>\n            \u003cspan class=\"step\">\u003cspan class=\"dot\">3\u003c/span>완료 / 거절\u003c/span>\n          \u003c/div>\n          \u003cdiv style=\"font-size:9px;color:#94a3b8;padding:4px 0 0;\">▼ 이 화면은 2단계 '진행중' 단일 상태만 표시 — 3단계 도달 건은 내역·완료(EXC-04)로 표시\u003c/div>\n        \u003c/div>\n      \u003c/div>\n\n      \u003c!-- 소요 안내 (표시 전용) -->\n      \u003cdiv class=\"zone\" data-idx=\"1\">\n        \u003cdiv class=\"zone-highlight\">\u003c/div>\n        \u003cdiv class=\"item-area\" data-highlight=\"1\" style=\"position:relative;padding:6px;border-radius:8px;\">\n          \u003cdiv class=\"pin\" data-idx=\"1\" style=\"top:-4px;right:-4px;\">2\u003c/div>\n          \u003cdiv style=\"font-size:12px;color:#334155;background:#f8fafc;border:1px solid #e2e8f0;border-radius:8px;padding:10px 12px;\">\n            거래가 접수되었습니다. \u003cstrong>약 2영업일 소요됩니다.\u003c/strong>\u003cbr>\n            \u003cspan style=\"font-size:10.5px;color:#64748b;\">최종 상태(완료 / 거절)는 대시보드 거래 목록에서 확인할 수 있습니다.\u003c/span>\n          \u003c/div>\n        \u003c/div>\n      \u003c/div>\n\n      \u003c!-- 요청 내역 (표시 전용) -->\n      \u003cdiv class=\"zone\" data-idx=\"2\">\n        \u003cdiv class=\"zone-highlight\">\u003c/div>\n        \u003cdiv class=\"item-area\" data-highlight=\"2\" style=\"position:relative;padding:6px;border-radius:8px;\">\n          \u003cdiv class=\"pin\" data-idx=\"2\" style=\"top:-4px;right:-4px;\">3\u003c/div>\n          \u003cdiv class=\"zone-title\">교환거래 요청 내역\u003c/div>\n          \u003cdiv class=\"kv\">\u003cspan class=\"k\">요청번호\u003c/span>\u003cspan class=\"v\">EXC-20260902-0001\u003c/span>\u003c/div>\n          \u003cdiv class=\"kv\">\u003cspan class=\"k\">교환쌍 · 방향\u003c/span>\u003cspan class=\"v\">USDC → USDT\u003c/span>\u003c/div>\n          \u003cdiv class=\"kv\">\u003cspan class=\"k\">보내는 수량\u003c/span>\u003cspan class=\"v\">900 USDC\u003c/span>\u003c/div>\n          \u003cdiv class=\"kv\">\u003cspan class=\"k\">받는 수량(예정)\u003c/span>\u003cspan class=\"v\">899.73 USDT\u003c/span>\u003c/div>\n          \u003cdiv class=\"kv\">\u003cspan class=\"k\">확정 비율\u003c/span>\u003cspan class=\"v\">0.9997 USDT/USDC\u003c/span>\u003c/div>\n          \u003cdiv class=\"kv\">\u003cspan class=\"k\">스프레드\u003c/span>\u003cspan class=\"v\">0.10%\u003c/span>\u003c/div>\n          \u003cdiv class=\"kv\">\u003cspan class=\"k\">요청 일시\u003c/span>\u003cspan class=\"v\">2026-09-02 14:02\u003c/span>\u003c/div>\n        \u003c/div>\n      \u003c/div>\n\n      \u003c!-- 액션 -->\n      \u003cdiv class=\"zone\" data-idx=\"3\">\n        \u003cdiv class=\"zone-highlight\">\u003c/div>\n        \u003cdiv class=\"item-area\" data-highlight=\"3\" style=\"position:relative;padding:4px;border-radius:8px;\">\n          \u003cdiv class=\"pin\" data-idx=\"3\" style=\"top:-8px;right:-6px;\">4\u003c/div>\n          \u003cdiv class=\"btn primary\">확인\u003c/div>\n        \u003c/div>\n      \u003c/div>\n\n    \u003c/div>\n  \u003c/div>\n\n  \u003csvg id=\"connSvg\" style=\"position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:10;overflow:visible;\">\u003c/svg>\n\n  \u003cdiv class=\"items\" id=\"items\">\n    \u003cdiv class=\"nav-global\">\n      \u003cdiv class=\"nav-global-title\">진입 · 전역 이동\u003c/div>\n      \u003cdiv class=\"nav-note\">· \u003cstrong>전역 이동\u003c/strong> 상단 메뉴(GNB) · 기관 배지 · 뒤로가기의 동작은 대시보드(DASH-01)의 표와 같다. 다른 점 = 현재 탭 '교환하기'를 다시 클릭하면 무반응이 아니라 교환하기(EXC-01)가 초기 상태(새 요청)로 열린다. '대시보드' 탭과 로고는 [확인]과 같은 목적지인 대시보드(DASH-01)로 간다. \u003cspan class=\"chk\">[확인필요: 대시보드 거래 목록 행을 클릭해 들어왔을 때 어느 탭을 강조할지 — 목업은 '교환하기' 강조]\u003c/span>\u003cbr>\n      · \u003cstrong>진입\u003c/strong> ① 비율 확인·수락(EXC-02) [수락] 직후 — 수락 응답과 함께 열리므로 로딩 없음 ② 대시보드(DASH-01) 거래 목록에서 상태 '진행중'인 나목 행 클릭 — 서버에서 조회하며 \"불러오는 중…\"을 보이고, 3초를 넘기면 상단 오류 배너.\u003cbr>\n      · 머무는 동안 자동 갱신은 없다. 건이 종결(완료·거절)된 뒤에는 대시보드 행을 클릭하면 내역·완료(EXC-04)가 열린다.\u003c/div>\n    \u003c/div>\n\n    \u003cdiv class=\"itm\" data-idx=\"0\">\n      \u003cdiv class=\"num\">1\u003c/div>\n      \u003cdiv>\n        \u003cdiv class=\"itm-title\">거래 상태 스텝바 (표시 전용)\u003c/div>\n        \u003cdiv class=\"itm-desc\">\u003cstrong>구성\u003c/strong> 3단계 고정 — 비율 수락(✓ 완료) → DSRV 거래 진행중(현재·강조) → 완료 / 거절(미도달·회색). 스텝 클릭으로 이동하거나 펼치지 않는다.\u003cbr>\u003cstrong>변형\u003c/strong> 이 화면은 2단계 '진행중' 단일 상태다. 3단계 도달 건은 EXC-04에서 같은 스텝바로 완료(✓) 또는 거절(!)로 표시한다.\u003cbr>\u003cstrong>노출 범위\u003c/strong> DSRV 내부 승인·집행·서명 단계를 '진행중' 하나로만 보여주고 내부 심사 상태·담당자·처리 시각은 넣지 않는다. 관리자 보류(ADM-02 T1 HOLD) 중에도 이 화면은 바뀌지 않는다.\u003cbr>\u003cspan class=\"basis\">근거 09 §0 승인·통제 · ISMS 2.2.2 · 2.7.2\u003c/span>\u003c/div>\n      \u003c/div>\n    \u003c/div>\n\n    \u003cdiv class=\"itm\" data-idx=\"1\">\n      \u003cdiv class=\"num\">2\u003c/div>\n      \u003cdiv>\n        \u003cdiv class=\"itm-title\">소요 안내 · 결과 확인 경로 (표시 전용)\u003c/div>\n        \u003cdiv class=\"itm-desc\">\u003cstrong>문구\u003c/strong> 고정 2줄 — 접수 안내와 약 {정책값 2영업일} 소요(ADM-03 값 표시 · 목업 2는 예시), 최종 상태는 대시보드 거래 목록에서 확인.\u003cbr>\u003cstrong>영업일\u003c/strong> KST 기준 평일이고 공휴일은 제외한다. 기산점은 수락 시각이다. \u003cspan class=\"chk\">[확인필요: 영업일 정의·기산점 약관 명시]\u003c/span>\u003cbr>\u003cstrong>노출 범위\u003c/strong> 자동검증(한도·BLF·KYT)과 트래블룰 확인 내용은 넣지 않는다. 승인되지 않은 건은 EXC-04에 거절과 일반화 사유로만 표기하고 AML 심사 내용은 노출하지 않는다.\u003cbr>\u003cspan class=\"basis\">근거 L6 설명의무 · STR 누설금지(특정금융정보법 제4조 [원문대조필요]) · 09 §0\u003c/span>\u003c/div>\n      \u003c/div>\n    \u003c/div>\n\n    \u003cdiv class=\"itm\" data-idx=\"2\">\n      \u003cdiv class=\"num\">3\u003c/div>\n      \u003cdiv>\n        \u003cdiv class=\"itm-title\">교환거래 요청 내역 (표시 전용)\u003c/div>\n        \u003cdiv class=\"itm-desc\">\u003cstrong>구성\u003c/strong> 7행 고정 순서 — 요청번호 · 교환쌍/방향 · 보내는 수량 · 받는 수량(예정) · 확정 비율 · 스프레드 · 요청 일시.\u003cbr>\u003cstrong>값\u003c/strong> EXC-02 수락 시점 확정값을 그대로 쓰고 체류 중 재계산하지 않는다. 수량 자릿수는 ETH 4 / USDC·USDT 2이고 받는 수량은 절사한다. 비율은 notation 규칙, 일시는 YYYY-MM-DD HH:MM(KST · 초 생략).\u003cbr>\u003cstrong>라벨\u003c/strong> 집행 전이므로 '받는 수량(예정)'으로 쓰고, EXC-04에서 완료면 실값, 거절이면 \"—\"로 바꾼다.\u003cbr>\u003cstrong>재사용\u003c/strong> EXC-03과 EXC-04의 공통 하단 블록이다. 같은 포맷과 필드 순서를 BRK-03·04·05와 ADM-02 선택 건에도 쓴다(마목은 수수료 행을 넣고 스프레드를 뺀다).\u003cbr>\u003cspan class=\"basis\">근거 L6 설명의무 · notation 수량·비율·일시 표기\u003c/span>\u003c/div>\n      \u003c/div>\n    \u003c/div>\n\n    \u003cdiv class=\"itm\" data-idx=\"3\">\n      \u003cdiv class=\"num\">4\u003c/div>\n      \u003cdiv>\n        \u003cdiv class=\"itm-title\">[확인] 버튼\u003c/div>\n        \u003cdiv class=\"itm-desc\">\u003cstrong>노출\u003c/strong> 항상 보인다.\u003cbr>\u003cstrong>클릭 가능\u003c/strong> 항상 활성이다.\u003cbr>\u003cstrong>확인 사항\u003c/strong> 없다. 서버를 호출하지 않고 상태도 바꾸지 않는다.\u003cbr>\u003cstrong>액션\u003c/strong> 대시보드로 이동한다(flow 마지막 화면의 종료 동선). 진행 중 건은 DASH-01 거래 목록에서 다시 들어온다.\u003cbr>\u003cspan class=\"basis\">근거 notation '종료 동선'·'뒤로가기'\u003c/span>\u003c/div>\n        \u003cdiv class=\"itm-nav\">\u003cspan class=\"nav-tag\">화면 이동 · 인터랙션\u003c/span>\n          \u003cdiv class=\"nav-row\">\u003cspan class=\"nav-el\">[확인] — 활성 조건\u003c/span>\u003cspan class=\"nav-act\">비활성 조건 없음 — 항상 활성(kv 로딩 중에도 활성)\u003c/span>\u003cspan class=\"nav-to stay\">—\u003c/span>\u003c/div>\n          \u003cdiv class=\"nav-row\">\u003cspan class=\"nav-el\">[확인] — 클릭(활성)\u003c/span>\u003cspan class=\"nav-act\">클릭 → 확인 없음 · 로딩 없음(서버 호출 없는 화면 이동)\u003c/span>\u003cspan class=\"nav-to\">\u003cstrong>대시보드(DASH-01)\u003c/strong> — 거래 목록에 이 건 '진행중' 행 노출 · 토스트 없음\u003c/span>\u003c/div>\n          \u003cdiv class=\"nav-row\">\u003cspan class=\"nav-el\">[확인] — 실패\u003c/span>\u003cspan class=\"nav-act\">해당 없음(서버 호출 없음)\u003c/span>\u003cspan class=\"nav-to stay\">— · DASH-01 로딩 실패는 DASH-01 규격\u003c/span>\u003c/div>\n        \u003c/div>\n      \u003c/div>\n    \u003c/div>\n  \u003c/div>\n\n\u003c/div>\n\n\u003csection class=\"footer-note\" style=\"padding-bottom:0;\">\n  \u003cdiv class=\"note-card\">\n    \u003cdiv class=\"note-title\">상세내용\u003c/div>\n    \u003cdiv class=\"detail-grid\" id=\"detailCol\">\n      \u003cdiv class=\"dtl\" data-idx=\"0\">\n        \u003cdiv class=\"detail-label\">\u003cspan class=\"dtl-num\">1\u003c/span>고객사 승인을 없앤 근거 · 상태 전이\u003c/div>\n      \u003cdiv class=\"dtl-body\">\u003cspan class=\"box\">· 교환 이전은 DSRV 수탁 \u003cstrong>콜드월렛의 기존 다중승인 절차\u003c/strong>를 그대로 거침 — 화면에서 2인 승인을 또 받으면 \u003cstrong>동일 통제의 중복\u003c/strong>\u003cbr>· 직무분리(ISMS 2.2.2)는 커스터디 이체 승인 + DSRV 승인↔집행 서명 분리로 충족 · DSRV 집행: 콜드 \u003cstrong>2인 멀티시그(2키/2인)\u003c/strong> — 승인권과 서명권 분리 유지\u003cbr>· 고객 화면 상태 전이: 수락(확정) → \u003cstrong>진행중\u003c/strong>(이 화면) → 완료 / 거절(EXC-04) — 내부 상태(승인 대기·에스컬레이션·\u003cstrong>보류\u003c/strong>·집행 대기·서명 중)는 ADM-02에서만 · 고객 화면 상태 enum \u003cspan class=\"chk\">[확인필요: states 고객 도메인]\u003c/span>\u003c/span>\u003c/div>\n      \u003c/div>\n      \u003cdiv class=\"dtl\" data-idx=\"1\">\n        \u003cdiv class=\"detail-label\">\u003cspan class=\"dtl-num\">2\u003c/span>거절 표기·사유 카테고리\u003c/div>\n      \u003cdiv class=\"dtl-body\">\u003cspan class=\"box\">· 최종 상태는 \u003cstrong>완료 / 거절\u003c/strong> 2종(2026-09-02 결정 — 고객 화면 '심사 후 보류' 폐지) — 거절 사유 문구 3종(만료 2종은 별도)은 EXC-04 상세 2 기준, 이 화면은 접수 안내까지\u003cbr>· 관리자 보류는 고객 화면에 나타나지 않는다 — 진행중에서 갈 수 있는 곳은 완료·거절 둘뿐\u003cbr>· 종결 시 이메일 통지: 완료 = 공통 ③(거래 완료) · 거절 = 공통 \u003cstrong>⑤(거래 거절)\u003c/strong> · 만료 = 공통 \u003cstrong>⑥(거래 만료)\u003c/strong> — 2026-09-02(10) 사용자 결정으로 신설(notation 이메일 통지 6종) · 본문에는 일반화 사유만, 심사·AML 내용 미포함\u003c/span>\u003c/div>\n      \u003c/div>\n      \u003cdiv class=\"dtl\" data-idx=\"2\">\n        \u003cdiv class=\"detail-label\">\u003cspan class=\"dtl-num\">3\u003c/span>공통 하단 블록 — 화면별 필드 차이\u003c/div>\n      \u003cdiv class=\"dtl-body\">\u003cspan class=\"box\">· EXC-03(진행중): 받는 수량\u003cstrong>(예정)\u003c/strong> · 요청 일시\u003cbr>· EXC-04(종결): 보낸 자산 · 받은 자산(완료 실값 / 거절 \"—\") · 요청 일시 — 집행 정보 블록은 별도\u003cbr>· 예시 계산: 900 USDC × 0.9997 = 899.73 USDT(절사 · 소수 2자리)\u003c/span>\u003c/div>\n      \u003c/div>\n    \u003c/div>\n  \u003c/div>\n\u003c/section>\n\n\u003csection class=\"footer-note\">\n  \u003cdiv class=\"note-card\">\n    \u003cdiv class=\"note-title\">비고\u003c/div>\n    \u003cdiv class=\"note-body\">\n      · 이 화면에 승인·처리·취소 액션 없음 — DSRV 내부 처리(승인·집행)는 어드민 홈(ADM-02) 처리함에서 · 고객 취소 동선 없음(수락 즉시 확정).\u003cbr>\n      · \u003cstrong>[방어 핵심]\u003c/strong> 자동검증(한도·BLF·KYT)은 \u003cstrong>1차 필터일 뿐\u003c/strong>, 최종 판단은 사람이 수행 — \"자동체결·자동심사 아님\" 담보. 주의·불량 건은 어드민 홈(ADM-02) 처리함으로 에스컬레이션.\u003cbr>\n      · \u003cstrong>[승인 ≠ 집행]\u003c/strong> DSRV 승인은 단일이지만, 콜드지갑 출고의 \u003cstrong>집행 서명은 키 2개·서명자 2인(멀티시그)\u003c/strong> — 승인권과 서명권 분리(ISMS 2.7.2).\u003cbr>\n      · 2026-09-02 설명 형식 개정 적용(핀 = 조작 요소 단위) — 표시 3 · 버튼 1, [확인] 3행 · 프레임에 GNB 추가(EXC-01과 동일) · 요청 내역에 '받는 수량(예정)' 행 추가(EXC-04 공통 블록 정합) · 예시 900 USDC → 899.73 USDT(0.9997)로 교체.\u003cbr>\n      · \u003cspan class=\"chk\">[확인필요]\u003c/span> 소요 {영업일} 정책값·영업일 정의·기산점 · DASH-01 행 진입 시 현재 탭 강조· 고객 화면 상태 enum · 거절 이메일 통지 종류.\u003cbr>\n      · 다음 화면: 내역·완료 (EXC-04)\n    \u003c/div>\n  \u003c/div>\n\u003c/section>\n\n\u003cscript src=\"screen.js\">\u003c/script>\n\u003c/body>\n\u003c/html>\n", "exc-04.html": "\u003c!DOCTYPE html>\n\u003chtml lang=\"ko\">\n\u003chead>\n\u003cmeta charset=\"UTF-8\">\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n\u003ctitle>화면기획 — 내역·완료\u003c/title>\n\u003clink rel=\"stylesheet\" href=\"screen.css\">\n\u003c/head>\n\u003cbody>\n\n\u003cheader class=\"header\">\n  \u003cdiv class=\"crumb\">\u003cspan>나목 교환\u003c/span>\u003cspan class=\"s\">›\u003c/span>\u003cspan>교환하기\u003c/span>\u003cspan class=\"s\">›\u003c/span>\u003cspan>내역·완료\u003c/span>\u003c/div>\n  \u003ch1 class=\"title\">내역·완료\u003c/h1>\n  \u003cspan class=\"sid\">EXC-04\u003c/span>\n  \u003cspan class=\"defense\">콜드 수동집행 · 구분회계\u003c/span>\n\u003c/header>\n\n\u003cdiv class=\"main\">\n  \u003cdiv class=\"screen-panel\">\n    \u003cdiv style=\"position:relative;display:flex;\">\n      \u003cdiv class=\"labels\" id=\"labels\">\n        \u003cdiv class=\"lbl\">\u003cspan class=\"lbl-text\">전역\u003cbr>상단\u003c/span>\u003c/div>\n        \u003cdiv class=\"lbl\">\u003cspan class=\"lbl-text\">거래 상태\u003c/span>\u003c/div>\n        \u003cdiv class=\"lbl\">\u003cspan class=\"lbl-text\">집행 정보\u003c/span>\u003c/div>\n        \u003cdiv class=\"lbl\">\u003cspan class=\"lbl-text\">요청 내역\u003c/span>\u003c/div>\n        \u003cdiv class=\"lbl\">\u003cspan class=\"lbl-text\">액션\u003c/span>\u003c/div>\n      \u003c/div>\n      \u003csvg id=\"bracketSvg\" width=\"24\" style=\"flex-shrink:0;overflow:visible;\">\u003c/svg>\n    \u003c/div>\n\n    \u003cdiv class=\"frame\" id=\"frame\">\n      \u003c!-- 전역: 콘솔 상단 + GNB (핀 없음 — nav-global 행으로 처리) -->\n      \u003cdiv class=\"zone\" data-idx=\"\">\n        \u003cdiv class=\"zone-highlight\">\u003c/div>\n        \u003cdiv class=\"c-top\" style=\"border-radius:8px 8px 0 0;\">\n          \u003cspan class=\"brand\" style=\"cursor:pointer;\">DSRV Desk\u003c/span>\n          \u003cspan class=\"meta\">\u003cspan class=\"c-badge\">A자산운용\u003c/span>\u003c/span>\n        \u003c/div>\n        \u003cdiv class=\"c-adminbar\" style=\"margin:0;\">\n          \u003cspan class=\"m\">대시보드\u003c/span>\n          \u003cspan class=\"m on\" style=\"background:#dbeafe;color:#1d4ed8;\">교환하기\u003c/span>\n          \u003cspan class=\"m\">교환게시판\u003c/span>\n        \u003c/div>\n      \u003c/div>\n\n      \u003c!-- 거래 상태: 스텝바(표시 전용) + 거절 사유 배너(조건부 노출) -->\n      \u003cdiv class=\"zone\" data-idx=\"0,1\">\n        \u003cdiv class=\"zone-highlight\">\u003c/div>\n        \u003cdiv class=\"item-area\" data-highlight=\"0\" style=\"position:relative;padding:6px;border-radius:8px;margin-bottom:6px;\">\n          \u003cdiv class=\"pin\" data-idx=\"0\" style=\"top:-4px;right:-4px;\">1\u003c/div>\n          \u003cdiv class=\"zone-title\">거래 상태\u003c/div>\n          \u003cdiv class=\"steps\" style=\"flex-wrap:wrap;gap:8px;\">\n            \u003cspan class=\"step done\">\u003cspan class=\"dot\">✓\u003c/span>비율 수락\u003c/span>\u003cspan class=\"arrow\">→\u003c/span>\n            \u003cspan class=\"step done\">\u003cspan class=\"dot\">✓\u003c/span>DSRV 거래 진행\u003c/span>\u003cspan class=\"arrow\">→\u003c/span>\n            \u003cspan class=\"step\">\u003cspan class=\"dot\">!\u003c/span>거절\u003c/span>\n          \u003c/div>\n          \u003cdiv style=\"font-size:9px;color:#94a3b8;padding:4px 0 0;\">▼ [상태: 완료 시] 3단계 = \"완료\" ✓(초록) · 아래 배너 없음 / [만료 시] 1·2단계도 미도달 · 3단계 \"만료\" — 목업은 '거절' 변형\u003c/div>\n        \u003c/div>\n        \u003cdiv class=\"item-area\" data-highlight=\"1\" style=\"position:relative;padding:4px;border-radius:8px;\">\n          \u003cdiv class=\"pin\" data-idx=\"1\" style=\"top:-6px;right:-6px;\">2\u003c/div>\n          \u003cdiv style=\"font-size:9px;color:#94a3b8;padding:0 0 3px;\">▼ [상태: DSRV 거절·만료 시만 노출] 사유 카테고리별 문구 — 상세 2 · 고객 거절 건은 배너 없음\u003c/div>\n          \u003cdiv style=\"font-size:10.5px;color:#991b1b;background:#fef2f2;border:1px solid #fecaca;border-radius:6px;padding:6px 10px;display:flex;gap:6px;align-items:center;\">\u003cstrong>거절\u003c/strong> — 추가 정보 확인이 필요합니다. 담당자가 별도 안내드립니다. (요청번호 EXC-20260902-0001)\u003c/div>\n        \u003c/div>\n      \u003c/div>\n\n      \u003c!-- 집행 정보 (표시 전용) -->\n      \u003cdiv class=\"zone\" data-idx=\"2\">\n        \u003cdiv class=\"zone-highlight\">\u003c/div>\n        \u003cdiv class=\"item-area\" data-highlight=\"2\" style=\"position:relative;padding:6px;border-radius:8px;\">\n          \u003cdiv class=\"pin\" data-idx=\"2\" style=\"top:-4px;right:-4px;\">3\u003c/div>\n          \u003cdiv class=\"zone-title\">집행 정보\u003c/div>\n          \u003cdiv class=\"kv\">\u003cspan class=\"k\">집행 방식\u003c/span>\u003cspan class=\"v\">100% 콜드 · 수동 · 2인 멀티시그\u003c/span>\u003c/div>\n          \u003cdiv class=\"kv\">\u003cspan class=\"k\">완료 일시\u003c/span>\u003cspan class=\"v\">— (거절)\u003c/span>\u003c/div>\n          \u003cdiv class=\"kv\">\u003cspan class=\"k\">가용 풀 차감\u003c/span>\u003cspan class=\"v\">미차감(집행 없음)\u003c/span>\u003c/div>\n        \u003c/div>\n      \u003c/div>\n\n      \u003c!-- 요청 내역 (표시 전용) -->\n      \u003cdiv class=\"zone\" data-idx=\"3\">\n        \u003cdiv class=\"zone-highlight\">\u003c/div>\n        \u003cdiv class=\"item-area\" data-highlight=\"3\" style=\"position:relative;padding:6px;border-radius:8px;\">\n          \u003cdiv class=\"pin\" data-idx=\"3\" style=\"top:-4px;right:-4px;\">4\u003c/div>\n          \u003cdiv class=\"zone-title\">교환거래 요청 내역\u003c/div>\n          \u003cdiv class=\"kv\">\u003cspan class=\"k\">요청번호\u003c/span>\u003cspan class=\"v\">EXC-20260902-0001\u003c/span>\u003c/div>\n          \u003cdiv class=\"kv\">\u003cspan class=\"k\">교환쌍 · 방향\u003c/span>\u003cspan class=\"v\">USDC → USDT\u003c/span>\u003c/div>\n          \u003cdiv class=\"kv\">\u003cspan class=\"k\">보낸 자산\u003c/span>\u003cspan class=\"v\">900 USDC\u003c/span>\u003c/div>\n          \u003cdiv class=\"kv\">\u003cspan class=\"k\">받은 자산\u003c/span>\u003cspan class=\"v\">—\u003c/span>\u003c/div>\n          \u003cdiv class=\"kv\">\u003cspan class=\"k\">확정 비율\u003c/span>\u003cspan class=\"v\">0.9997 USDT/USDC\u003c/span>\u003c/div>\n          \u003cdiv class=\"kv\">\u003cspan class=\"k\">스프레드\u003c/span>\u003cspan class=\"v\">0.10%\u003c/span>\u003c/div>\n          \u003cdiv class=\"kv\">\u003cspan class=\"k\">요청 일시\u003c/span>\u003cspan class=\"v\">2026-09-02 14:02\u003c/span>\u003c/div>\n        \u003c/div>\n      \u003c/div>\n\n      \u003c!-- 액션 -->\n      \u003cdiv class=\"zone\" data-idx=\"4\">\n        \u003cdiv class=\"zone-highlight\">\u003c/div>\n        \u003cdiv class=\"item-area\" data-highlight=\"4\" style=\"position:relative;padding:4px;border-radius:8px;\">\n          \u003cdiv class=\"pin\" data-idx=\"4\" style=\"top:-8px;right:-6px;\">5\u003c/div>\n          \u003cdiv class=\"btn primary\">확인\u003c/div>\n        \u003c/div>\n      \u003c/div>\n\n    \u003c/div>\n  \u003c/div>\n\n  \u003csvg id=\"connSvg\" style=\"position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:10;overflow:visible;\">\u003c/svg>\n\n  \u003cdiv class=\"items\" id=\"items\">\n    \u003cdiv class=\"nav-global\">\n      \u003cdiv class=\"nav-global-title\">진입 · 전역 이동\u003c/div>\n      \u003cdiv class=\"nav-note\">· \u003cstrong>전역 이동\u003c/strong> 상단 메뉴(GNB) · 기관 배지 · 뒤로가기의 동작은 대시보드(DASH-01)의 표와 같다. 다른 점 = 현재 탭 '교환하기'를 다시 클릭하면 무반응이 아니라 교환하기(EXC-01)가 초기 상태(새 요청)로 열린다. '대시보드' 탭과 로고는 [확인]과 같은 목적지인 대시보드(DASH-01)로 간다. \u003cspan class=\"chk\">[확인필요: 대시보드 거래 목록 행을 클릭해 들어왔을 때 어느 탭을 강조할지 — 목업은 '교환하기' 강조]\u003c/span>\u003cbr>\n      · \u003cstrong>진입\u003c/strong> 대시보드(DASH-01) 거래 목록에서 나목 '완료' · '거절' · '만료' 행 클릭. 이것이 유일한 진입점이다. 진입 시 서버에서 조회하며 \"불러오는 중…\"을 보이고, 3초를 넘기면 상단 배너 \"일시적인 오류입니다. 잠시 후 다시 시도해 주세요\"([확인]은 활성 유지). 관리자 보류 건은 종결이 아니므로 이 화면이 아니라 승인 진행(EXC-03)으로 열린다.\u003cbr>\n      · 종결 상태라 값이 바뀌지 않으며 머무는 동안 자동 갱신도 없다.\u003c/div>\n    \u003c/div>\n\n    \u003cdiv class=\"itm\" data-idx=\"0\">\n      \u003cdiv class=\"num\">1\u003c/div>\n      \u003cdiv>\n        \u003cdiv class=\"itm-title\">거래 상태 스텝바 (표시 전용)\u003c/div>\n        \u003cdiv class=\"itm-desc\">\u003cstrong>구성\u003c/strong> EXC-03과 같은 3단계 구조이고 이 화면은 종결 시점이라 3단계가 채워진다.\u003cbr>\u003cstrong>변형\u003c/strong> ① 완료 = 3단계 라벨 \"완료\" · ✓ 초록 · 배너 없음 ② 거절 = 라벨 \"거절\" · \"!\" 회색 · 배너 노출 ③ 만료 = 수락 전 종결이므로 1·2단계도 회색, 3단계 라벨 \"만료\" · 배너 노출.\u003cbr>\u003cstrong>1·2단계\u003c/strong> 완료·거절 두 변형에서는 ✓로 채운다. 고객 화면에 '심사 후 보류' 변형은 두지 않는다(관리자 보류는 EXC-03 '진행중'으로만 보인다).\u003cbr>\u003cspan class=\"basis\">근거 STR 누설금지(특정금융정보법 제4조 [원문대조필요]) · notation 상태 칩\u003c/span>\u003c/div>\n      \u003c/div>\n    \u003c/div>\n\n    \u003cdiv class=\"itm\" data-idx=\"1\">\n      \u003cdiv class=\"num\">2\u003c/div>\n      \u003cdiv>\n        \u003cdiv class=\"itm-title\">거절·만료 안내 배너 (조건부 노출)\u003c/div>\n        \u003cdiv class=\"itm-desc\">\u003cstrong>노출\u003c/strong> 최종 상태가 거절(DSRV 심사·고객 요청 양쪽)이거나 만료일 때만 보인다. 완료 건에는 띄우지 않고 닫기(×)도 두지 않는다.\u003cbr>\u003cstrong>문구 구조\u003c/strong> \"{상태 표기} — {사유 카테고리 문구}. {다음 행동 1문장} (요청번호 {EXC-YYYYMMDD-NNNN})\".\u003cbr>\u003cstrong>상태 표기\u003c/strong> 거절 주체를 제목에서 구분한다 — 「거절 (DSRV 심사)」 · 「거절 (고객 요청)」 · 「만료」. 목록 칩은 '거절' 공통이고 코드도 REJECTED 단일이다.\u003cbr>\u003cstrong>사유\u003c/strong> 거절 3종(① 한도 초과 ② 추가 정보 확인 필요 ③ 내부 심사 기준 미충족), 만료 2종(④ 수락 기한 경과 ⑤ 가용 풀 부족·비율 변동). 카테고리별 문구는 상세 2.\u003cbr>\u003cstrong>노출 금지\u003c/strong> 내부 사유·KYT 점수·STR 여부·시세 소스명·이탈 임계값은 어떤 형태로도 넣지 않는다.\u003cbr>\u003cspan class=\"basis\">근거 STR 누설금지 · 09 §0 고객 화면 미노출 정보\u003c/span>\u003c/div>\n        \u003cdiv class=\"itm-nav\">\u003cspan class=\"nav-tag\">화면 이동 · 인터랙션\u003c/span>\n          \u003cdiv class=\"nav-row\">\u003cspan class=\"nav-el\">배너\u003c/span>\u003cspan class=\"nav-act\">클릭\u003c/span>\u003cspan class=\"nav-to stay\">무반응(표시 전용) · 종결 상태이므로 문구가 바뀌지 않는다\u003c/span>\u003c/div>\n        \u003c/div>\n      \u003c/div>\n    \u003c/div>\n\n    \u003cdiv class=\"itm\" data-idx=\"2\">\n      \u003cdiv class=\"num\">3\u003c/div>\n      \u003cdiv>\n        \u003cdiv class=\"itm-title\">집행 정보 (표시 전용)\u003c/div>\n        \u003cdiv class=\"itm-desc\">\u003cstrong>구성\u003c/strong> 3행 고정 — 집행 방식 · 완료 일시 · 가용 풀 차감.\u003cbr>\u003cstrong>값\u003c/strong> 집행 방식은 \"100% 콜드 · 수동 · 2인 멀티시그\" 고정. 완료 일시는 온체인 출고 확정 시각 YYYY-MM-DD HH:MM(KST · 초 생략)이고 거절·만료는 \"— (거절)\" · \"— (만료)\". 가용 풀 차감은 완료면 \"{받는 자산} {받은 수량} ▼\", 거절·만료면 \"미차감(집행 없음)\".\u003cbr>\u003cstrong>차감 시점\u003c/strong> 온체인 출고 확정 시점에 차감한다(상세 3).\u003cbr>\u003cstrong>소요 안내\u003c/strong> 예상 소요는 EXC-03에만 두고 이 화면에는 실제 완료 일시만 쓴다.\u003cbr>\u003cspan class=\"basis\">근거 콜드지갑 수동집행 절차 · ISMS 2.7.2\u003c/span>\u003c/div>\n      \u003c/div>\n    \u003c/div>\n\n    \u003cdiv class=\"itm\" data-idx=\"3\">\n      \u003cdiv class=\"num\">4\u003c/div>\n      \u003cdiv>\n        \u003cdiv class=\"itm-title\">교환거래 요청 내역 (표시 전용)\u003c/div>\n        \u003cdiv class=\"itm-desc\">\u003cstrong>구성\u003c/strong> 7행 고정 순서 — 요청번호 · 교환쌍/방향 · 보낸 자산 · 받은 자산 · 확정 비율 · 스프레드 · 요청 일시. EXC-03과 공통 블록이다.\u003cbr>\u003cstrong>받은 자산\u003c/strong> 완료면 실값(예 899.73 USDT = 900 × 0.9997 절사), 거절·만료면 \"—\"로 둔다. '예상'값을 쓰지 않는다.\u003cbr>\u003cstrong>보낸 자산\u003c/strong> 거절·만료 건도 요청 수량 실값을 쓴다(고객 자산은 이동하지 않았다). 자릿수 ETH 4 / USDC·USDT 2, 비율은 notation 규칙, 일시는 YYYY-MM-DD HH:MM.\u003cbr>\u003cstrong>발급 없음\u003c/strong> 거래보고서·영수증은 발급하지 않는다. 회계 계정명과 수익 집계는 어드민 CSV(ADM-02)에서만 본다.\u003cbr>\u003cspan class=\"basis\">근거 L6 설명의무 · notation 표기 · 09 §0 고객 화면 미노출 정보\u003c/span>\u003c/div>\n      \u003c/div>\n    \u003c/div>\n\n    \u003cdiv class=\"itm\" data-idx=\"4\">\n      \u003cdiv class=\"num\">5\u003c/div>\n      \u003cdiv>\n        \u003cdiv class=\"itm-title\">[확인] 버튼\u003c/div>\n        \u003cdiv class=\"itm-desc\">\u003cstrong>노출\u003c/strong> 항상 보인다.\u003cbr>\u003cstrong>클릭 가능\u003c/strong> 항상 활성이다.\u003cbr>\u003cstrong>확인 사항\u003c/strong> 없다. 서버를 호출하지 않고 상태도 바꾸지 않는다.\u003cbr>\u003cstrong>액션\u003c/strong> 대시보드로 이동한다. 재확인은 DASH-01 거래 목록 행 클릭으로 다시 들어온다.\u003cbr>\u003cspan class=\"basis\">근거 notation '종료 동선'·'뒤로가기'\u003c/span>\u003c/div>\n        \u003cdiv class=\"itm-nav\">\u003cspan class=\"nav-tag\">화면 이동 · 인터랙션\u003c/span>\n          \u003cdiv class=\"nav-row\">\u003cspan class=\"nav-el\">[확인] — 활성 조건\u003c/span>\u003cspan class=\"nav-act\">비활성 조건 없음 — 항상 활성(조회 로딩·실패 중에도 활성)\u003c/span>\u003cspan class=\"nav-to stay\">—\u003c/span>\u003c/div>\n          \u003cdiv class=\"nav-row\">\u003cspan class=\"nav-el\">[확인] — 클릭(활성)\u003c/span>\u003cspan class=\"nav-act\">클릭 → 확인 없음 · 로딩 없음(서버 호출 없는 화면 이동)\u003c/span>\u003cspan class=\"nav-to\">\u003cstrong>대시보드(DASH-01)\u003c/strong> — 거래 목록에 이 건 '완료'·'거절'·'만료' 행 유지 · 토스트 없음\u003c/span>\u003c/div>\n          \u003cdiv class=\"nav-row\">\u003cspan class=\"nav-el\">[확인] — 실패\u003c/span>\u003cspan class=\"nav-act\">해당 없음(서버 호출 없음)\u003c/span>\u003cspan class=\"nav-to stay\">— · DASH-01 로딩 실패는 DASH-01 규격\u003c/span>\u003c/div>\n        \u003c/div>\n      \u003c/div>\n    \u003c/div>\n  \u003c/div>\n\n\u003c/div>\n\n\u003csection class=\"footer-note\" style=\"padding-bottom:0;\">\n  \u003cdiv class=\"note-card\">\n    \u003cdiv class=\"note-title\">상세내용\u003c/div>\n    \u003cdiv class=\"detail-grid\" id=\"detailCol\">\n      \u003cdiv class=\"dtl\" data-idx=\"0\">\n        \u003cdiv class=\"detail-label\">\u003cspan class=\"dtl-num\">1\u003c/span>상태 변형 표 — 완료 / 거절 / 만료\u003c/div>\n      \u003cdiv class=\"dtl-body\">\u003cspan class=\"box\">· \u003cstrong>스텝 3단계\u003c/strong>: 완료 = \"완료\" ✓ 초록 / 거절 = \"거절\" ! 회색(주체 구분은 배너 제목에서 — 스텝 라벨은 공통) / 만료 = \"만료\" 회색(1·2단계도 미도달)\u003cbr>· \u003cstrong>배너(항목 2)\u003c/strong>: 완료 = 없음 / 거절(DSRV 심사)·만료 = 사유 카테고리 문구 / 거절(고객 요청) = 고정 문구 — 배너 제목이 주체를 구분(「거절 (DSRV 심사)」 / 「거절 (고객 요청)」)\u003cbr>· \u003cstrong>완료 일시\u003c/strong>: 완료 = 출고 확정 시각 / 거절·만료 = \"— (거절)\" · \"— (만료)\"\u003cbr>· \u003cstrong>가용 풀 차감\u003c/strong>: 완료 = \"USDT 899.73 ▼\" / 거절·만료 = \"미차감(집행 없음)\"\u003cbr>· \u003cstrong>받은 자산\u003c/strong>: 완료 = 899.73 USDT / 거절·만료 = \"—\" · 보낸 자산은 세 변형 모두 900 USDC\u003cbr>· 고객 화면 상태 enum(states A 표): 요청됨 · 비율 제시 · 진행 중 · 완료 · 거절 · 만료 — \u003cstrong>'보류' 없음\u003c/strong>(2026-09-02 결정) · 거절은 \u003cstrong>단일 enum\u003c/strong>이고 주체 구분은 이 화면의 표기로만(DASH-01 목록 칩은 '거절' 공통 · 2026-09-02(10)) · DASH-01 목록 칩: 완료(초록) / 거절·만료(회색 — 종결 계열)\u003c/span>\u003c/div>\n      \u003c/div>\n      \u003cdiv class=\"dtl\" data-idx=\"1\">\n        \u003cdiv class=\"detail-label\">\u003cspan class=\"dtl-num\">2\u003c/span>거절·만료 사유 카테고리 — 고객 표시 문구(초안 · [로펌게이트])\u003c/div>\n      \u003cdiv class=\"dtl-body\">\u003cspan class=\"box\">\u003cstrong>거절(DSRV)\u003c/strong> ① \u003cstrong>한도 초과\u003c/strong>: \"1회 교환 한도(1,500,000원 상당)를 초과해 진행할 수 없습니다. 담당자가 별도 안내드립니다.\"(한도 {정책값 1,500,000원 상당})\u003cbr>② \u003cstrong>추가 정보 확인 필요\u003c/strong>: \"추가 정보 확인이 필요합니다. 담당자가 별도 안내드립니다.\" — 목업 문구\u003cbr>③ \u003cstrong>내부 심사 기준 미충족\u003c/strong>: \"내부 심사 기준에 따라 진행할 수 없습니다. 담당자가 별도 안내드립니다.\"\u003cbr>\u003cstrong>만료\u003c/strong> ④ \u003cstrong>수락 기한 경과\u003c/strong>: \"수락 기한이 지나 제시된 비율이 무효가 되었습니다. 교환하기에서 다시 요청해 주세요.\"\u003cbr>⑤ \u003cstrong>가용 풀 부족·비율 변동\u003c/strong>(수락 재검증 실패 · states A10): \"가용 풀 부족 또는 비율 변동으로 진행할 수 없습니다. 교환하기에서 다시 요청해 주세요.\"(임계값·소스명 미기재)\u003cbr>\u003cstrong>거절 (고객 요청)\u003c/strong>(EXC-02 [거절]) ⑥ \"고객님이 제시된 비율을 거절하셨습니다. 교환하기에서 다시 요청해 주세요.\" — 심사 사유가 아니므로 카테고리 없이 이 문구 고정\u003cbr>· \u003cstrong>의심거래(STR) 관련 여부는 어떤 형태로도 표기 금지\u003c/strong> — ②로 일반화 · ADM-02 거절 사유(내부 4종+자유입력)와 고객 문구의 매핑은 ADM-02 기준\u003cbr>· 문구 4종 확정 \u003cspan class=\"chk\">[로펌게이트]\u003c/span>\u003c/span>\u003c/div>\n      \u003c/div>\n      \u003cdiv class=\"dtl\" data-idx=\"2\">\n        \u003cdiv class=\"detail-label\">\u003cspan class=\"dtl-num\">3\u003c/span>가용 풀 차감 반영\u003c/div>\n      \u003cdiv class=\"dtl-body\">\u003cspan class=\"box\">· 집행 완료분(받는 자산 수량 · 예 899.73 USDT)만큼 운영자산 가용 풀 감소 · 거절·만료 건은 미차감(예약·선차감 없음)\u003cbr>· 커스터디 운영자산 잔고·EXC-01(풀 표시)·3면 대사 CSV(ADM-02)에 동시 반영\u003cbr>· 차감은 온체인 출고 확정 시점 기준 = 이 화면 '완료 일시'와 동일 시각\u003c/span>\u003c/div>\n      \u003c/div>\n      \u003cdiv class=\"dtl\" data-idx=\"3\">\n        \u003cdiv class=\"detail-label\">\u003cspan class=\"dtl-num\">4\u003c/span>구분회계 처리 (고객 화면 미노출)\u003c/div>\n      \u003cdiv class=\"dtl-body\">\u003cspan class=\"box\">· 고객 수탁자산 ↔ 운영자산 원장 분리\u003cbr>· 스프레드 수익 = 운영손익 계정 — 내부 구분회계 · \u003cstrong>계정명·수익 금액은 고객 화면 어디에도 표시하지 않음\u003c/strong>(2026-09-02 확정 · 종전 '스프레드 수익 운영손익 계정' 행 제거)\u003cbr>· 수탁/운영·스프레드/수수료 집계는 구분회계 CSV(ADM-02)로 내보내기 · 고객사 회계·감사 제출용 증빙 제공 방식 \u003cspan class=\"chk\">[확인필요]\u003c/span>\u003c/span>\u003c/div>\n      \u003c/div>\n    \u003c/div>\n  \u003c/div>\n\u003c/section>\n\n\u003csection class=\"footer-note\">\n  \u003cdiv class=\"note-card\">\n    \u003cdiv class=\"note-title\">비고\u003c/div>\n    \u003cdiv class=\"note-body\">\n      · 나목 교환 flow 종료 화면. 집행은 \u003cstrong>콜드·수동·2인 멀티시그\u003c/strong>이며 즉시성이 낮다는 점(약 {정책값 2영업일} · EXC-03 고지)을 명시해 \"자동체결 거래소 아님\"과 정합.\u003cbr>\n      · \u003cstrong>[화이트리스트 미적용]\u003c/strong> 교환은 내부 커스터디 지갑 간 이전, 외부 주소 미취급. 외부 반출은 기존 커스터디 출금 절차(화이트리스트)로만.\u003cbr>\n      · 2026-09-02 설명 형식 개정 적용(핀 = 조작 요소 단위) — 표시 3 · 조건부 배너 1 · 버튼 1, [확인] 3행 · 프레임에 GNB 추가(EXC-01과 동일) · 스텝바/배너 핀 분리 + 상태 태그 · 거절 건 '받은 자산' \"—\"로 프레임-텍스트 불일치 해소 · '예상 완료' → '완료 일시' · 요청 일시 행 추가(EXC-03 공통 블록 정합) · 예시 900 USDC → 899.73 USDT(0.9997)로 교체.\u003cbr>\n      · \u003cstrong>2026-09-02(10) 결정 반영\u003c/strong>: 거절 주체를 화면에 구분 표기(「거절 (DSRV 심사)」 / 「거절 (고객 요청)」 · 상태 enum은 단일) · 거절·만료 시 \u003cstrong>고객 이메일 통지 발송\u003c/strong>(공통 ⑤ 거래 거절 / ⑥ 거래 만료 — notation 이메일 통지 6종).\u003cbr>\n      · \u003cstrong>2026-09-02 결정 반영\u003c/strong>: 고객 화면 '심사 후 보류' 변형 폐지 — 최종 상태는 완료 / 거절 / 만료. 관리자 보류는 어드민 내부(T1 HOLD)로만 존재하고 고객에게는 EXC-03 '거래 진행중'으로 보인다(states.html v0.4). 고객 거절·만료 건도 이 화면을 재사용한다(무반응 분기 없음).\u003cbr>\n      · \u003cspan class=\"chk\">[확인필요]\u003c/span> 집행 소요 {영업일} 정책값 · 거절·만료 사유 문구([로펌게이트]) · 문의 링크 여부 · 고객사 회계·감사 제출용 증빙 제공 방식\u003cbr>\n      · 나목 flow: EXC-01 요청 → EXC-02 비율 → EXC-03 승인 → \u003cstrong>EXC-04 완료\u003c/strong>\n    \u003c/div>\n  \u003c/div>\n\u003c/section>\n\n\u003cscript src=\"screen.js\">\u003c/script>\n\u003c/body>\n\u003c/html>\n", "brk-01.html": "\u003c!DOCTYPE html>\n\u003chtml lang=\"ko\">\n\u003chead>\n\u003cmeta charset=\"UTF-8\">\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n\u003ctitle>화면기획 — 교환 게시판\u003c/title>\n\u003clink rel=\"stylesheet\" href=\"screen.css\">\n\u003cstyle>\n  .tbl{width:100%;border-collapse:collapse;font-size:11px;}\n  .tbl th{background:#f1f5f9;color:#64748b;font-weight:700;text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);font-size:10px;}\n  .tbl td{padding:8px;border-bottom:1px solid #f1f1ee;color:#334155;vertical-align:middle;}\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\n\u003cheader class=\"header\">\n  \u003cdiv class=\"crumb\">\u003cspan>마목 중개\u003c/span>\u003cspan class=\"s\">›\u003c/span>\u003cspan>교환게시판\u003c/span>\u003c/div>\n  \u003ch1 class=\"title\">교환 게시판\u003c/h1>\n  \u003cspan class=\"sid\">BRK-01\u003c/span>\n  \u003cspan class=\"defense\">방어: 단순 게시판 아님(4요소)\u003c/span>\n\u003c/header>\n\n\u003cdiv class=\"main\">\n  \u003cdiv class=\"screen-panel\">\n    \u003cdiv style=\"position:relative;display:flex;\">\n      \u003cdiv class=\"labels\" id=\"labels\">\n        \u003cdiv class=\"lbl\">\u003cspan class=\"lbl-text\">전역\u003c/span>\u003c/div>\n        \u003cdiv class=\"lbl\">\u003cspan class=\"lbl-text\">거래의향 리스트\u003c/span>\u003c/div>\n        \u003cdiv class=\"lbl\">\u003cspan class=\"lbl-text\">안내\u003c/span>\u003c/div>\n        \u003cdiv class=\"lbl\">\u003cspan class=\"lbl-text\">등록\u003c/span>\u003c/div>\n      \u003c/div>\n      \u003csvg id=\"bracketSvg\" width=\"24\" style=\"flex-shrink:0;overflow:visible;\">\u003c/svg>\n    \u003c/div>\n\n    \u003cdiv class=\"frame\" id=\"frame\">\n      \u003c!-- 전역: 콘솔 상단 + GNB (핀 없음 — nav-global 행으로 처리) -->\n      \u003cdiv class=\"zone\" data-idx=\"\">\n        \u003cdiv class=\"zone-highlight\">\u003c/div>\n        \u003cdiv class=\"c-top\" style=\"border-radius:8px 8px 0 0;\">\n          \u003cspan class=\"brand\" style=\"cursor:pointer;\">DSRV Desk\u003c/span>\n          \u003cspan class=\"meta\">\u003cspan class=\"c-badge\">A자산운용\u003c/span>\u003c/span>\n        \u003c/div>\n        \u003cdiv class=\"c-adminbar\" style=\"margin:0;\">\n          \u003cspan class=\"m\">대시보드\u003c/span>\n          \u003cspan class=\"m\">교환하기\u003c/span>\n          \u003cspan class=\"m on\" style=\"background:#dbeafe;color:#1d4ed8;\">교환게시판\u003c/span>\n        \u003c/div>\n      \u003c/div>\n\n      \u003c!-- 거래의향 리스트: 헤더(목록 규격) + 행 4종 -->\n      \u003cdiv class=\"zone\" data-idx=\"0,1,2,3,4\">\n        \u003cdiv class=\"zone-highlight\">\u003c/div>\n        \u003cdiv style=\"font-size:10px;color:#94a3b8;margin-bottom:4px;\">목업 예시: 열람자 = A자산운용 · 게시자 상호는 목록에 표시하지 않음(상세에서 첫 글자만)\u003c/div>\n\n        \u003cdiv class=\"item-area\" data-highlight=\"0\" style=\"position:relative;padding:4px;border-radius:8px;\">\n          \u003cdiv class=\"pin\" data-idx=\"0\" style=\"top:-6px;right:-6px;\">1\u003c/div>\n          \u003cdiv style=\"display:grid;grid-template-columns:1.25fr .9fr .95fr 1.35fr 1.15fr 1.1fr;gap:4px;background:#f1f5f9;color:#64748b;font-weight:700;font-size:10px;padding:7px 8px;border-bottom:1px solid var(--line);border-radius:6px 6px 0 0;\">\n            \u003cspan>교환코인\u003c/span>\u003cspan>보내는 수량\u003c/span>\u003cspan>받는 수량\u003c/span>\u003cspan>비율\u003c/span>\u003cspan>게시 일시 ▼\u003c/span>\u003cspan>상태\u003c/span>\n          \u003c/div>\n        \u003c/div>\n\n        \u003cdiv class=\"item-area\" data-highlight=\"1\" style=\"position:relative;padding:4px;border-radius:8px;\">\n          \u003cdiv class=\"pin\" data-idx=\"1\" style=\"top:-6px;right:-6px;\">2\u003c/div>\n          \u003cdiv style=\"display:grid;grid-template-columns:1.25fr .9fr .95fr 1.35fr 1.15fr 1.1fr;gap:4px;align-items:center;font-size:10.5px;color:#334155;padding:8px;border-bottom:1px solid #f1f1ee;cursor:pointer;\">\n            \u003cspan>USDT → USDC\u003c/span>\u003cspan style=\"font-family:var(--mono);\">800\u003c/span>\u003cspan style=\"font-family:var(--mono);\">798.40\u003c/span>\u003cspan style=\"font-family:var(--mono);\">0.9980 USDC/USDT\u003c/span>\u003cspan style=\"font-family:var(--mono);color:#64748b;\">08-30 14:20\u003c/span>\u003cspan>\u003cspan class=\"chip info\">게재중\u003c/span>\u003c/span>\n          \u003c/div>\n        \u003c/div>\n\n        \u003cdiv class=\"item-area\" data-highlight=\"2\" style=\"position:relative;padding:4px;border-radius:8px;\">\n          \u003cdiv class=\"pin\" data-idx=\"2\" style=\"top:-6px;right:-6px;\">3\u003c/div>\n          \u003cdiv style=\"display:grid;grid-template-columns:1.25fr .9fr .95fr 1.35fr 1.15fr 1.1fr;gap:4px;align-items:center;font-size:10.5px;color:#334155;padding:8px;border-bottom:1px solid #f1f1ee;cursor:pointer;\">\n            \u003cspan>ETH → USDC\u003c/span>\u003cspan style=\"font-family:var(--mono);\">0.3\u003c/span>\u003cspan style=\"font-family:var(--mono);\">955.20\u003c/span>\u003cspan style=\"font-family:var(--mono);\">3,184.00 USDC/ETH\u003c/span>\u003cspan style=\"font-family:var(--mono);color:#64748b;\">08-30 10:05\u003c/span>\u003cspan>\u003cspan class=\"chip\" style=\"background:#fef3c7;color:#92400e;\">협의중\u003c/span>\u003c/span>\n          \u003c/div>\n        \u003c/div>\n\n        \u003cdiv class=\"item-area\" data-highlight=\"3\" style=\"position:relative;padding:4px;border-radius:8px;\">\n          \u003cdiv class=\"pin\" data-idx=\"3\" style=\"top:-6px;right:-6px;\">4\u003c/div>\n          \u003cdiv style=\"display:grid;grid-template-columns:1.25fr .9fr .95fr 1.35fr 1.15fr 1.1fr;gap:4px;align-items:center;font-size:10.5px;color:#334155;padding:8px;border-bottom:1px solid #f1f1ee;cursor:pointer;background:#fbfbf9;\">\n            \u003cspan>USDC → USDT\u003c/span>\u003cspan style=\"font-family:var(--mono);\">650\u003c/span>\u003cspan style=\"font-family:var(--mono);\">649.87\u003c/span>\u003cspan style=\"font-family:var(--mono);\">0.9998 USDT/USDC\u003c/span>\u003cspan style=\"font-family:var(--mono);color:#64748b;\">08-29 16:30\u003c/span>\u003cspan style=\"display:flex;gap:3px;flex-wrap:wrap;\">\u003cspan class=\"chip info\">게재중\u003c/span>\u003cspan class=\"chip\">내 게시\u003c/span>\u003c/span>\n          \u003c/div>\n        \u003c/div>\n\n        \u003cdiv class=\"item-area\" data-highlight=\"4\" style=\"position:relative;padding:4px;border-radius:8px;\">\n          \u003cdiv class=\"pin\" data-idx=\"4\" style=\"top:-6px;right:-6px;\">5\u003c/div>\n          \u003cdiv style=\"display:grid;grid-template-columns:1.25fr .9fr .95fr 1.35fr 1.15fr 1.1fr;gap:4px;align-items:center;font-size:10.5px;color:#334155;padding:8px;border-bottom:1px solid #f1f1ee;cursor:pointer;background:#fbfbf9;\">\n            \u003cspan>ETH → USDT\u003c/span>\u003cspan style=\"font-family:var(--mono);\">0.25\u003c/span>\u003cspan style=\"font-family:var(--mono);\">796.00\u003c/span>\u003cspan style=\"font-family:var(--mono);\">3,184.00 USDT/ETH\u003c/span>\u003cspan style=\"font-family:var(--mono);color:#64748b;\">08-28 11:12\u003c/span>\u003cspan style=\"display:flex;gap:3px;flex-wrap:wrap;\">\u003cspan class=\"chip\" style=\"background:#fef3c7;color:#92400e;\">협의중\u003c/span>\u003cspan class=\"chip\">내 신청\u003c/span>\u003c/span>\n          \u003c/div>\n        \u003c/div>\n\n        \u003cdiv style=\"margin-top:10px;\">\n          \u003cdiv style=\"font-size:9px;color:#94a3b8;padding:0 4px 3px;\">▼ 게시 0건일 때 표 대신 노출 (핀 1 목록 규격 — 빈 상태)\u003c/div>\n          \u003cdiv style=\"text-align:center;padding:12px 8px;border:1px dashed #d7dbe0;border-radius:8px;font-size:11px;color:#94a3b8;\">게시된 거래의향이 없습니다\u003cbr>\u003cspan style=\"font-size:10px;\">[+ 거래의향 등록]으로 첫 거래의향을 올릴 수 있습니다\u003c/span>\u003c/div>\n        \u003c/div>\n      \u003c/div>\n\n      \u003c!-- 안내 (표시 전용) -->\n      \u003cdiv class=\"zone\" data-idx=\"5\">\n        \u003cdiv class=\"zone-highlight\">\u003c/div>\n        \u003cdiv class=\"item-area\" data-highlight=\"5\" style=\"position:relative;padding:4px;border-radius:8px;\">\n          \u003cdiv class=\"pin\" data-idx=\"5\" style=\"top:-6px;right:-6px;\">6\u003c/div>\n          \u003cdiv style=\"padding:6px 8px;background:#f8fafc;border-radius:6px;font-size:10px;color:#64748b;\">✓ 이 보드의 모든 거래의향은 \u003cstrong>거래 안전성 검증(보유·처분권 확인)\u003c/strong> 및 \u003cstrong>KYC 완료 법인\u003c/strong>만 게시됩니다\u003c/div>\n        \u003c/div>\n      \u003c/div>\n\n      \u003c!-- 등록 -->\n      \u003cdiv class=\"zone\" data-idx=\"6\">\n        \u003cdiv class=\"zone-highlight\">\u003c/div>\n        \u003cdiv class=\"item-area\" data-highlight=\"6\" style=\"position:relative;padding:4px;border-radius:8px;\">\n          \u003cdiv class=\"pin\" data-idx=\"6\" style=\"top:-8px;right:-6px;\">7\u003c/div>\n          \u003cdiv class=\"btn primary\">+ 거래의향 등록\u003c/div>\n        \u003c/div>\n      \u003c/div>\n    \u003c/div>\n  \u003c/div>\n\n  \u003csvg id=\"connSvg\" style=\"position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:10;overflow:visible;\">\u003c/svg>\n\n  \u003cdiv class=\"items\" id=\"items\">\n    \u003cdiv class=\"nav-global\">\n      \u003cdiv class=\"nav-global-title\">진입 · 전역 이동\u003c/div>\n      \u003cdiv class=\"nav-note\">· \u003cstrong>전역 이동\u003c/strong> 상단 메뉴(GNB) · 기관 배지 · 뒤로가기의 동작은 대시보드(DASH-01)의 표와 같다. 다른 점 = 현재 탭이 '교환게시판'이고 이 화면이 목록이라 다시 클릭해도 무반응.\u003cbr>\n      · \u003cstrong>진입\u003c/strong> 어느 화면에서든 GNB '교환게시판' 클릭 / 거래의향 등록(BRK-02) [취소] / 신청하기(BRK-03) [취소] / 내 게시 상세(BRK-06) [게시 내리기] 실행 후 / BRK-02~07에서 '교환게시판' 탭 재클릭. 들어올 때마다 목록을 다시 조회하고 머무는 동안 자동 갱신은 없다.\u003c/div>\n    \u003c/div>\n\n    \u003cdiv class=\"itm\" data-idx=\"0\">\n      \u003cdiv class=\"num\">1\u003c/div>\n      \u003cdiv>\n        \u003cdiv class=\"itm-title\">거래의향 목록 — 컬럼 헤더 · 상태 칩 · 목록 규격 (표시 전용)\u003c/div>\n        \u003cdiv class=\"itm-desc\">\u003cstrong>컬럼\u003c/strong> 6개 — 교환코인({보내는} → {받는} · 게시자 기준) · 보내는 수량 · 받는 수량 · 비율 · 게시 일시 · 상태. DASH-01 거래 목록과 표기를 통일한다.\u003cbr>\u003cstrong>자릿수\u003c/strong> 수량은 자산 자릿수(ETH 4 / USDC·USDT 2 · 뒤 0 생략), 비율은 스테이블 페어 {받는}/{주는} 4자리와 ETH 페어 {스테이블}/ETH 2자리. 사자·팔자 구분 없이 수량 쌍으로만 적는다.\u003cbr>\u003cstrong>상태 칩\u003c/strong> 목록에는 게재중(대기·파랑)과 협의중(진행·노랑) 2종만 나온다. 협의중은 신청 1건이 접수되어 추가 신청이 막힌 상태다. 열람자 기관이 게시자·신청자인 행에는 보조 칩 '내 게시' / '내 신청'을 상태 칩 옆에 붙인다.\u003cbr>\u003cstrong>목록 제외\u003c/strong> 확정·완료·회수·중지 게시는 타사·내 게시 모두 목록에서 뺀다. 내 종결 건은 DASH-01에서 BRK-06·07로 들어가 본다.\u003cbr>\u003cstrong>정렬\u003c/strong> 게시 일시 내림차순 단일. 필터·정렬 변경·페이징을 두지 않는다.\u003cbr>\u003cstrong>상태별 문구\u003c/strong> 빈 목록은 점선 박스 \"게시된 거래의향이 없습니다\" + \"[+ 거래의향 등록]으로 첫 거래의향을 올릴 수 있습니다\". 로딩은 \"불러오는 중…\"이고 3초 초과 시 오류로 넘긴다. 오류는 상단 배너와 빈 표.\u003cbr>\u003cstrong>조회\u003c/strong> 진입 시 전체 행을 한 번에 불러와 표시하고 페이지 스크롤로 본다([더 보기]·무한 스크롤 없음). 체류 중 자동 갱신하지 않으므로 상태 칩은 조회 시점 값이고 최신 판정은 BRK-03에서 한다.\u003cbr>\u003cspan class=\"chk\">[확인필요: 행 hover 규격 — notation 미정의]\u003c/span>\u003cbr>\u003cspan class=\"basis\">근거 F-1b · 09 §0 마목 게시 상태 · notation 목록 규격(100행 분할 폐기 — 2026-09-02 결정)\u003c/span>\u003c/div>\n      \u003c/div>\n    \u003c/div>\n\n    \u003cdiv class=\"itm\" data-idx=\"1\">\n      \u003cdiv class=\"num\">2\u003c/div>\n      \u003cdiv>\n        \u003cdiv class=\"itm-title\">거래의향 행 — 타사 게시 · 게재중\u003cspan class=\"req\">필수\u003c/span>\u003c/div>\n        \u003cdiv class=\"itm-desc\">\u003cstrong>클릭 영역\u003c/strong> 행 전체.\u003cbr>\u003cstrong>식별\u003c/strong> 상태 칩 게재중이고 보조 칩이 없으면 타사 게시다.\u003cbr>\u003cstrong>목업\u003c/strong> 주 예시 800 USDT ↔ 798.40 USDC(게시자 B사 · 게시 2026-08-30 14:20)로 BRK-03·04·05·06·07와 같은 건을 쓴다.\u003cbr>\u003cspan class=\"basis\">근거 F-1b · V2(역제안 없음)\u003c/span>\u003c/div>\n        \u003cdiv class=\"itm-nav\">\u003cspan class=\"nav-tag\">화면 이동 · 인터랙션\u003c/span>\n          \u003cdiv class=\"nav-row\">\u003cspan class=\"nav-el\">행(게재중 · 타사)\u003c/span>\u003cspan class=\"nav-act\">클릭 → 게시 최신 상태 조회\u003c/span>\u003cspan class=\"nav-to\">\u003cstrong>신청하기(BRK-03)\u003c/strong> — 게시 조건 그대로 신청(역제안 없음) · 상태 게재중이면 [이 조건으로 신청] 활성\u003c/span>\u003c/div>\n          \u003cdiv class=\"nav-row\">\u003cspan class=\"nav-el\">행(게재중 · 타사) — 클릭 직전 상태 변경\u003c/span>\u003cspan class=\"nav-act\">조회 후 클릭 사이 협의중·회수·완료(만료)·중지로 바뀐 경우\u003c/span>\u003cspan class=\"nav-to\">\u003cstrong>신청하기(BRK-03)\u003c/strong>은 열림 · [이 조건으로 신청] 비활성 + 상태별 인라인 안내(BRK-03 항목 3) · 목록 칩은 재진입 시 갱신\u003c/span>\u003c/div>\n        \u003c/div>\n      \u003c/div>\n    \u003c/div>\n\n    \u003cdiv class=\"itm\" data-idx=\"2\">\n      \u003cdiv class=\"num\">3\u003c/div>\n      \u003cdiv>\n        \u003cdiv class=\"itm-title\">거래의향 행 — 타사 게시 · 협의중\u003cspan class=\"req\">필수\u003c/span>\u003c/div>\n        \u003cdiv class=\"itm-desc\">\u003cstrong>식별\u003c/strong> 타사 게시에 다른 기관 신청 1건이 접수된 상태다.\u003cbr>\u003cstrong>동작\u003c/strong> 행을 회색 처리하지 않고 클릭해 상세를 열 수 있게 하되 신청만 비활성으로 둔다. \u003cspan class=\"chk\">[확인필요: notation 행 클릭 규격 개정 — 현재 규격은 회색·클릭 무반응]\u003c/span>\u003cbr>\u003cspan class=\"basis\">근거 09 §0 마목 게시 상태 개정 — 협의중 = 추가 신청 차단\u003c/span>\u003c/div>\n        \u003cdiv class=\"itm-nav\">\u003cspan class=\"nav-tag\">화면 이동 · 인터랙션\u003c/span>\n          \u003cdiv class=\"nav-row\">\u003cspan class=\"nav-el\">행(협의중 · 타사)\u003c/span>\u003cspan class=\"nav-act\">클릭\u003c/span>\u003cspan class=\"nav-to\">\u003cstrong>신청하기(BRK-03)\u003c/strong> — 상세는 열리되 [이 조건으로 신청] 비활성 + 인라인 안내 \"협의 중인 게시입니다 — 다른 신청이 처리되면 다시 신청할 수 있습니다\"\u003c/span>\u003c/div>\n          \u003cdiv class=\"nav-row\">\u003cspan class=\"nav-el\">행(협의중 · 타사) — 거절·만료로 게재중 복귀 후\u003c/span>\u003cspan class=\"nav-act\">재진입·재조회\u003c/span>\u003cspan class=\"nav-to stay\">칩 게재중으로 갱신 → 항목 2 동선\u003c/span>\u003c/div>\n        \u003c/div>\n      \u003c/div>\n    \u003c/div>\n\n    \u003cdiv class=\"itm\" data-idx=\"3\">\n      \u003cdiv class=\"num\">4\u003c/div>\n      \u003cdiv>\n        \u003cdiv class=\"itm-title\">거래의향 행 — 내 게시\u003cspan class=\"req\">필수\u003c/span>\u003c/div>\n        \u003cdiv class=\"itm-desc\">\u003cstrong>식별\u003c/strong> 열람자 기관이 게시자인 행이다. 상태 칩(게재중 / 협의중)에 보조 칩 '내 게시'를 붙이고 행 배경을 연회색으로 둔다. \u003cspan class=\"chk\">[확인필요: 내 게시·내 신청 구분 표기 디자인 규격]\u003c/span>\u003cbr>\u003cstrong>제약\u003c/strong> 내 게시에 스스로 신청하는 경로는 없다. 행이 BRK-06으로 가므로 구조적으로 막힌다.\u003cbr>\u003cspan class=\"basis\">근거 F-1b · BRK-06\u003c/span>\u003c/div>\n        \u003cdiv class=\"itm-nav\">\u003cspan class=\"nav-tag\">화면 이동 · 인터랙션\u003c/span>\n          \u003cdiv class=\"nav-row\">\u003cspan class=\"nav-el\">행(내 게시 · 게재중)\u003c/span>\u003cspan class=\"nav-act\">클릭\u003c/span>\u003cspan class=\"nav-to\">\u003cstrong>내 게시 상세·회수(BRK-06)\u003c/strong> — 받은 신청 0건 빈 상태 · [게시 내리기] 노출\u003c/span>\u003c/div>\n          \u003cdiv class=\"nav-row\">\u003cspan class=\"nav-el\">행(내 게시 · 협의중)\u003c/span>\u003cspan class=\"nav-act\">클릭\u003c/span>\u003cspan class=\"nav-to\">\u003cstrong>내 게시 상세·회수(BRK-06)\u003c/strong> — 받은 신청 1건 표시 → 신청 행 클릭 시 받은 신청·수락(BRK-04)\u003c/span>\u003c/div>\n        \u003c/div>\n      \u003c/div>\n    \u003c/div>\n\n    \u003cdiv class=\"itm\" data-idx=\"4\">\n      \u003cdiv class=\"num\">5\u003c/div>\n      \u003cdiv>\n        \u003cdiv class=\"itm-title\">거래의향 행 — 내 신청 중인 게시\u003cspan class=\"req\">필수\u003c/span>\u003c/div>\n        \u003cdiv class=\"itm-desc\">\u003cstrong>식별\u003c/strong> 열람자 기관이 신청자인 타사 게시이고 항상 협의중이다. 보조 칩 '내 신청'을 붙이고 행 배경을 연회색으로 둔다.\u003cbr>\u003cstrong>제약\u003c/strong> 수락 대기 상태이며 재신청·취소 버튼은 두지 않는다(BRK-07은 조회 전용).\u003cbr>\u003cspan class=\"basis\">근거 BRK-07 · V2(신청 후 협의 채널 없음)\u003c/span>\u003c/div>\n        \u003cdiv class=\"itm-nav\">\u003cspan class=\"nav-tag\">화면 이동 · 인터랙션\u003c/span>\n          \u003cdiv class=\"nav-row\">\u003cspan class=\"nav-el\">행(협의중 · 내 신청)\u003c/span>\u003cspan class=\"nav-act\">클릭\u003c/span>\u003cspan class=\"nav-to\">\u003cstrong>내 신청 상세(BRK-07)\u003c/strong> — 진행 상태(수락 대기)·유효기한·내 수수료 조회\u003c/span>\u003c/div>\n          \u003cdiv class=\"nav-row\">\u003cspan class=\"nav-el\">행(협의중 · 내 신청) — 클릭 직전 확정·거절·만료·회수·중지\u003c/span>\u003cspan class=\"nav-act\">클릭\u003c/span>\u003cspan class=\"nav-to\">\u003cstrong>내 신청 상세(BRK-07)\u003c/strong>에 최신 상태 표시(확정이면 BRK-05 이동 링크) · 이 목록에서는 재진입 시 행 제거(종결) 또는 칩 갱신\u003c/span>\u003c/div>\n        \u003c/div>\n      \u003c/div>\n    \u003c/div>\n\n    \u003cdiv class=\"itm\" data-idx=\"5\">\n      \u003cdiv class=\"num\">6\u003c/div>\n      \u003cdiv>\n        \u003cdiv class=\"itm-title\">거래 안전성 검증·KYC 담보 안내 (표시 전용)\u003c/div>\n        \u003cdiv class=\"itm-desc\">\u003cstrong>문구\u003c/strong> 고정 1줄. 전 게시물 공통 전제이므로 행별 배지 없이 보드 하단에 둔다.\u003cbr>\u003cstrong>내용 범위\u003c/strong> 거래 안전성 검증은 게시자 보유·처분 가능분 검증(BRK-02 게이트)과 신청자 보유·처분 가능분 검증(BRK-03 게이트)을 뜻하고, KYC는 양측 KYC 완료 법인만 게시·신청한다는 뜻이다.\u003cbr>\u003cspan class=\"basis\">근거 V2 — 단순 게시판 아님(4요소 ①②) · 상세 7\u003c/span>\u003c/div>\n      \u003c/div>\n    \u003c/div>\n\n    \u003cdiv class=\"itm\" data-idx=\"6\">\n      \u003cdiv class=\"num\">7\u003c/div>\n      \u003cdiv>\n        \u003cdiv class=\"itm-title\">[+ 거래의향 등록] 버튼\u003cspan class=\"req\">필수\u003c/span>\u003c/div>\n        \u003cdiv class=\"itm-desc\">\u003cstrong>노출\u003c/strong> 항상 보인다.\u003cbr>\u003cstrong>클릭 가능\u003c/strong> 항상 활성이다.\u003cbr>\u003cstrong>확인 사항\u003c/strong> 없다. 게시 가능 여부(KYC·잔고)는 BRK-02에서 판정한다.\u003cbr>\u003cstrong>액션\u003c/strong> 거래의향 등록 화면(BRK-02)으로 이동한다.\u003cbr>\u003cspan class=\"basis\">근거 F-1b\u003c/span>\u003c/div>\n        \u003cdiv class=\"itm-nav\">\u003cspan class=\"nav-tag\">화면 이동 · 인터랙션\u003c/span>\n          \u003cdiv class=\"nav-row\">\u003cspan class=\"nav-el\">[+ 거래의향 등록] — 활성 조건\u003c/span>\u003cspan class=\"nav-act\">항상 활성(비활성 조건 없음 — 게이팅은 BRK-02 KYC 배너·[게시] 활성 조건에서)\u003c/span>\u003cspan class=\"nav-to stay\">—\u003c/span>\u003c/div>\n          \u003cdiv class=\"nav-row\">\u003cspan class=\"nav-el\">[+ 거래의향 등록] — 클릭(활성)\u003c/span>\u003cspan class=\"nav-act\">클릭 → 확인 없음 → 즉시 이동\u003c/span>\u003cspan class=\"nav-to\">\u003cstrong>거래의향 등록(BRK-02)\u003c/strong> — 초기 상태(자산 미선택·수량 빈칸)\u003c/span>\u003c/div>\n          \u003cdiv class=\"nav-row\">\u003cspan class=\"nav-el\">[+ 거래의향 등록] — 실패\u003c/span>\u003cspan class=\"nav-act\">해당 없음(화면 이동만 — 서버 호출 없음)\u003c/span>\u003cspan class=\"nav-to stay\">—\u003c/span>\u003c/div>\n        \u003c/div>\n      \u003c/div>\n    \u003c/div>\n  \u003c/div>\n\n\u003c/div>\n\n\u003csection class=\"footer-note\" style=\"padding-bottom:0;\">\n  \u003cdiv class=\"note-card\">\n    \u003cdiv class=\"note-title\">상세내용\u003c/div>\n    \u003cdiv class=\"detail-grid\" id=\"detailCol\">\n      \u003cdiv class=\"dtl\" data-idx=\"0\">\n        \u003cdiv class=\"detail-label\">\u003cspan class=\"dtl-num\">1\u003c/span>마목 게시 상태 6종 · 목록 노출 · 동선\u003c/div>\n      \u003cdiv class=\"dtl-body\">\u003cspan class=\"box\">· \u003cstrong>게재중\u003c/strong>(대기·파랑) 목록 노출 · 타사 → BRK-03 신청 가능 / 내 게시 → BRK-06\u003cbr>· \u003cstrong>협의중\u003c/strong>(진행·노랑) 목록 노출 · 신청 1건 접수 = 추가 신청 차단 · 타사 → BRK-03(신청 비활성) / 내 게시 → BRK-06 → BRK-04 / 내 신청 → BRK-07\u003cbr>· \u003cstrong>확정\u003c/strong>(진행) 목록 제외 · 수락 즉시 — 양측 DASH-01 → BRK-05\u003cbr>· \u003cstrong>완료\u003c/strong>(완료·초록) 목록 제외 · 이전 완료 또는 유효기간 만료 — DASH-01 거래 내역\u003cbr>· \u003cstrong>회수\u003c/strong>(종결·회색) 목록 제외 · 게시자 [게시 내리기](BRK-06) — 대기 신청 자동 종결 + 이메일 ④\u003cbr>· \u003cstrong>중지\u003c/strong>(종결·회색) 목록 제외 · price guard 자동중지(게시 시점 대비 ±{정책값 2.0%} 초과 · ADM-03 값) — 대기 신청 전부 자동 종결·양측 이메일 · 재개 = BRK-02 재게시(새 요청번호)\u003cbr>· 색 3계열·라벨은 notation 상태 칩 규격 \u003cspan class=\"chk\">[확인필요: 고객 화면 상태 enum 확정 — states 고객 도메인]\u003c/span> · 종전 명칭·복수 신청(선착순/선택) 이슈는 2026-09-02 개정(게시당 동시 신청 1건)으로 소멸\u003c/span>\u003c/div>\n      \u003c/div>\n      \u003cdiv class=\"dtl\" data-idx=\"1\">\n        \u003cdiv class=\"detail-label\">\u003cspan class=\"dtl-num\">2\u003c/span>상태 판정 위치 — 목록이 아니라 상세\u003c/div>\n      \u003cdiv class=\"dtl-body\">\u003cspan class=\"box\">· 목록은 조회 시점 스냅숏(자동 갱신 없음) — 클릭 시점의 최신 상태는 BRK-03 진입 시 서버가 판정해 [이 조건으로 신청] 활성/비활성 + 인라인 안내로 표시\u003cbr>· 따라서 \"클릭 직전 회수·만료·중지\" 경쟁 상태에 별도 오류 배너를 두지 않음 — 상세가 열리고 신청만 막힘(오류 상태 1종 감소)\u003cbr>· 종결(회수·완료·중지)된 타사 게시를 상세에서 열어도 조건은 열람 가능 — 신청 버튼만 비활성(BRK-03 항목 3·4)\u003c/span>\u003c/div>\n      \u003c/div>\n      \u003cdiv class=\"dtl\" data-idx=\"2\">\n        \u003cdiv class=\"detail-label\">\u003cspan class=\"dtl-num\">3\u003c/span>협의중 타사 게시 — 열람 허용·신청 차단 (notation 상이)\u003c/div>\n      \u003cdiv class=\"dtl-body\">\u003cspan class=\"box\">· notation 공통 UI 규격 '행 클릭': \"선택 불가 행(만료 · 타사 게시 '협의중' 등)은 회색 처리·클릭 무반응\"\u003cbr>· 이 화면 정의: 협의중 타사 게시도 클릭 → BRK-03 열림, [이 조건으로 신청] 비활성 + \"협의 중인 게시입니다 — 다른 신청이 처리되면 다시 신청할 수 있습니다\"\u003cbr>· 이유: 거절·만료로 게재중 복귀가 잦아 조건 열람 수요가 있고, 상태 판정을 상세 1곳으로 모으기 위함(상세 2) · 자동 매칭·대기열(웨이팅) 기능은 두지 않음 — 복귀 후 재클릭·재신청만\u003cbr>· \u003cspan class=\"chk\">[확인필요]\u003c/span> notation 행 클릭 규격을 이 정의로 개정할지, 아니면 이 화면을 회색·무반응으로 되돌릴지 — 결정 전까지 이 화면 정의를 단일 출처로 유지(2026-09-02)\u003c/span>\u003c/div>\n      \u003c/div>\n      \u003cdiv class=\"dtl\" data-idx=\"3\">\n        \u003cdiv class=\"detail-label\">\u003cspan class=\"dtl-num\">4\u003c/span>내 게시·내 신청 행 구분 표기\u003c/div>\n      \u003cdiv class=\"dtl-body\">\u003cspan class=\"box\">· 보조 칩 '내 게시' / '내 신청'(회색 chip) + 행 배경 연회색 — 기획 가정 \u003cspan class=\"chk\">[확인필요: 디자인 규격 — 칩 vs 좌측 색 바 vs 배경만]\u003c/span>\u003cbr>· 상호는 게시판에 표시하지 않으므로(마스킹 규칙과 무관) 열람자 자신의 건은 보조 칩으로만 식별\u003cbr>· 내 게시·내 신청 건도 종결(확정·완료·회수·중지)되면 목록에서 빠짐 — 이후 진입은 DASH-01 거래 내역 → BRK-06/07/05\u003c/span>\u003c/div>\n      \u003c/div>\n      \u003cdiv class=\"dtl\" data-idx=\"5\">\n        \u003cdiv class=\"detail-label\">\u003cspan class=\"dtl-num\">6\u003c/span>4요소 방어 (단순 게시판 아님)\u003c/div>\n      \u003cdiv class=\"dtl-body\">\u003cspan class=\"box\">① 거래 안전성 검증(보유·처분권 — 게시자 BRK-02 · 신청자 BRK-03, 2026-09-02 신청자 검증 추가)\u003cbr>② KYC 담보(양측 완료 법인 · KYC 예외 시 BRK-02/03 배너 + 버튼 비활성)\u003cbr>③ 정산 연계(BRK-05 커스터디 이전)\u003cbr>④ 수수료(거래액 1% 고정·양측 각자 보내는 자산 기준 — BRK-03/04/07 수락 전 고시)\u003cbr>· 필터·정렬·페이징이 없는 단순 나열 구조 자체가 자동 매칭·조건 검색 부재의 담보\u003c/span>\u003c/div>\n      \u003c/div>\n    \u003c/div>\n  \u003c/div>\n\u003c/section>\n\n\u003csection class=\"footer-note\">\n  \u003cdiv class=\"note-card\">\n    \u003cdiv class=\"note-title\">비고\u003c/div>\n    \u003cdiv class=\"note-body\">\n      · 마목(당사자 간 중개) 진입점. \u003cstrong>[방어 핵심]\u003c/strong> 거래 안전성 검증·KYC담보·정산연계·수수료 \u003cstrong>4요소\u003c/strong>를 갖춰 \"단순 게시판\"이 아님을 소명 — 자동 매칭·자동 체결·시장가 형성은 하지 않음. 필터·정렬·페이징이 없는 단순 나열 구조 자체가 자동 매칭·조건 검색 부재의 담보.\u003cbr>\n      · 분기: 내 RFQ 올리기 → BRK-02 / 타사 게시(게재중)에 신청 → BRK-03 / 타사 게시(협의중) 열람 → BRK-03(신청 비활성) / 내 게시 열기 → BRK-06(회수는 여기서) / 내 신청 중인 게시 → BRK-07\u003cbr>\n      · 2026-09-02 설명 형식 개정 적용(핀 = 조작 요소 단위) — 헤더·행 4종·안내·등록 버튼 7핀 · 컬럼에 게시 일시(정렬 기준)·상태 칩 추가 · 예시 수량 재조정.\u003cbr>\n      · \u003cspan class=\"chk\">[확인필요]\u003c/span> 내 게시·내 신청 구분 표기 디자인 · 행 hover 규격 · 고객 화면 상태 enum.\n    \u003c/div>\n  \u003c/div>\n\u003c/section>\n\n\u003cscript src=\"screen.js\">\u003c/script>\n\u003c/body>\n\u003c/html>\n", "brk-02.html": "\u003c!DOCTYPE html>\n\u003chtml lang=\"ko\">\n\u003chead>\n\u003cmeta charset=\"UTF-8\">\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n\u003ctitle>화면기획 — 거래의향 등록\u003c/title>\n\u003clink rel=\"stylesheet\" href=\"screen.css\">\n\u003c/head>\n\u003cbody>\n\n\u003cheader class=\"header\">\n  \u003cdiv class=\"crumb\">\u003cspan>마목 중개\u003c/span>\u003cspan class=\"s\">›\u003c/span>\u003cspan>교환게시판\u003c/span>\u003cspan class=\"s\">›\u003c/span>\u003cspan>거래의향 등록\u003c/span>\u003c/div>\n  \u003ch1 class=\"title\">거래의향 등록\u003c/h1>\n  \u003cspan class=\"sid\">BRK-02\u003c/span>\n  \u003cspan class=\"defense\">거래 안전성 검증 · 시세변동 자동 중지\u003c/span>\n\u003c/header>\n\n\u003cdiv class=\"main\">\n  \u003cdiv class=\"screen-panel\">\n    \u003cdiv style=\"position:relative;display:flex;\">\n      \u003cdiv class=\"labels\" id=\"labels\">\n        \u003cdiv class=\"lbl\">\u003cspan class=\"lbl-text\">전역\u003cbr>상단·배너\u003c/span>\u003c/div>\n        \u003cdiv class=\"lbl\">\u003cspan class=\"lbl-text\">거래의향 입력\u003c/span>\u003c/div>\n        \u003cdiv class=\"lbl\">\u003cspan class=\"lbl-text\">유효기간·\u003cbr>중지 안내\u003c/span>\u003c/div>\n        \u003cdiv class=\"lbl\">\u003cspan class=\"lbl-text\">게시 액션\u003c/span>\u003c/div>\n      \u003c/div>\n      \u003csvg id=\"bracketSvg\" width=\"24\" style=\"flex-shrink:0;overflow:visible;\">\u003c/svg>\n    \u003c/div>\n\n    \u003cdiv class=\"frame\" id=\"frame\">\n      \u003c!-- 전역: 콘솔 상단 + GNB + KYC 배너(조건부) -->\n      \u003cdiv class=\"zone\" data-idx=\"11\">\n        \u003cdiv class=\"zone-highlight\">\u003c/div>\n        \u003cdiv class=\"c-top\" style=\"border-radius:8px 8px 0 0;\">\n          \u003cspan class=\"brand\" style=\"cursor:pointer;\">DSRV Desk\u003c/span>\n          \u003cspan class=\"meta\">\u003cspan class=\"c-badge\">A자산운용\u003c/span>\u003c/span>\n        \u003c/div>\n        \u003cdiv class=\"c-adminbar\" style=\"margin:0;\">\n          \u003cspan class=\"m\">대시보드\u003c/span>\n          \u003cspan class=\"m\">교환하기\u003c/span>\n          \u003cspan class=\"m on\" style=\"background:#dbeafe;color:#1d4ed8;\">교환게시판\u003c/span>\n        \u003c/div>\n        \u003cdiv class=\"item-area\" data-highlight=\"11\" style=\"position:relative;\">\n          \u003cdiv class=\"pin\" data-idx=\"11\" style=\"top:-4px;right:-6px;\">12\u003c/div>\n          \u003cdiv style=\"font-size:9px;color:#94a3b8;padding:3px 8px 0;\">▼ KYC 예외 상태에서만 노출 (정상 시 배너 없음)\u003c/div>\n          \u003cdiv class=\"c-banner warn\" style=\"border-radius:0;\">⚠ 현재 거래가 불가합니다 — 고객확인(KYC)에 확인이 필요한 사항이 있습니다. 이메일로 문의해 주세요.\u003c/div>\n        \u003c/div>\n      \u003c/div>\n\n      \u003c!-- 거래의향 입력 -->\n      \u003cdiv class=\"zone\" data-idx=\"0,1,2,3,4,5,6\">\n        \u003cdiv class=\"zone-highlight\">\u003c/div>\n        \u003cdiv class=\"zone-title\" style=\"margin-bottom:8px;\">거래의향 등록\u003c/div>\n\n        \u003cdiv style=\"font-size:11px;color:#94a3b8;font-weight:600;margin-bottom:6px;\">교환쌍 · 방향\u003c/div>\n        \u003cdiv class=\"row\" style=\"margin-bottom:12px;\">\n          \u003cdiv class=\"item-area\" data-highlight=\"0\" style=\"position:relative;flex:1;padding:4px;border-radius:8px;\">\n            \u003cdiv class=\"pin\" data-idx=\"0\" style=\"top:-6px;right:-6px;\">1\u003c/div>\n            \u003cdiv class=\"field sel\">보내는 자산 \u003cspan class=\"chip asset\">USDT\u003c/span>\u003c/div>\n          \u003c/div>\n          \u003cdiv style=\"display:flex;align-items:center;color:#94a3b8;font-weight:700;\">→\u003c/div>\n          \u003cdiv class=\"item-area\" data-highlight=\"1\" style=\"position:relative;flex:1;padding:4px;border-radius:8px;\">\n            \u003cdiv class=\"pin\" data-idx=\"1\" style=\"top:-6px;right:-6px;\">2\u003c/div>\n            \u003cdiv class=\"field sel\">받는 자산 \u003cspan class=\"chip asset\">USDC\u003c/span>\u003c/div>\n          \u003c/div>\n        \u
