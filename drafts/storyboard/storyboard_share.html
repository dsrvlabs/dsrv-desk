c/span>\u003c/div>\n    \u003cdiv class=\"panel-note\">관리 메뉴 탭 2개 — 처리할 일만 홈 알람·워닝, 조회는 CSV 다운로드 6종, 설정·기관 관리는 설정 (개편 2026-09-01).\u003c/div>\n    \u003cul class=\"tree\">\n      \u003cli>\n        \u003cspan class=\"node\">\u003cspan class=\"lv tab\">탭 1\u003c/span>홈\u003c/span>\n        \u003cdiv class=\"flowline\">\u003cspan class=\"scr\" data-pid=\"ADM-02\">\u003cspan class=\"sid\">ADM-02\u003c/span>어드민 홈\u003c/span>\u003c/div>\n      \u003c/li>\n      \u003cli>\n        \u003cspan class=\"node\">\u003cspan class=\"lv tab\">탭 2\u003c/span>설정\u003c/span>\n        \u003cdiv class=\"flowline\">\u003cspan class=\"scr\" data-pid=\"ADM-03\">\u003cspan class=\"sid\">ADM-03\u003c/span>설정\u003c/span>\u003c/div>\n      \u003c/li>\n    \u003c/ul>\n  \u003c/div>\n\n\u003c/div>\n\n\u003cdiv class=\"foot\">\n  \u003cb>기준·비고\u003c/b> — GNB 메뉴명 확정 2026-09-01 (대시보드 · 교환하기 · 교환게시판) · 화면 ID·명칭은 index.html 목록과 동일 ·\n  ADM 탭 구성은 홈·설정 2탭(개편 2026-09-01 — 구 ADM-04~08 삭제, 조회는 CSV 다운로드).\n  ADM-01은 존재하지 않음(결번). 흐름(화살표)은 대표 경로만 표기 — 상세 분기는 화면 흐름도(process) 참조.\n\u003c/div>\n\n\u003cscript>\ndocument.querySelectorAll('.scr[data-pid]').forEach(el => {\n  el.addEventListener('click', () => {\n    window.parent.postMessage({ type: 'navigate', pageId: el.dataset.pid }, '*');\n  });\n});\n\u003c/script>\n\u003c/body>\n\u003c/html>\n";
const GLOSS="\u003c!DOCTYPE html>\n\u003chtml lang=\"ko\">\n\u003chead>\n\u003cmeta charset=\"UTF-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n\u003ctitle>표기 규칙 (교환·중개 콘솔)\u003c/title>\n\u003cstyle>\n  @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');\n  * { margin:0; padding:0; box-sizing:border-box; }\n  body { font-family:'Pretendard', system-ui, -apple-system, sans-serif; background:#fafafa; color:#1e293b;\n         font-size:13px; line-height:1.6; padding:28px 32px 60px; }\n  .doc-head { max-width:1060px; margin:0 auto 18px; }\n  .doc-head h1 { font-size:19px; font-weight:800; letter-spacing:-.01em; }\n  .doc-head .sub { font-size:11.5px; color:#64748b; margin-top:3px; }\n\n  .tbl-wrap { max-width:1060px; margin:0 auto; background:#fff; border:1px solid #e2e8f0; border-radius:10px;\n              overflow-x:auto; }\n  table { width:100%; border-collapse:collapse; min-width:860px; }\n  th { text-align:left; font-size:10.5px; font-weight:700; color:#64748b; background:#f8fafc;\n       padding:9px 14px; border-bottom:1.5px solid #e2e8f0; white-space:nowrap; }\n  td { padding:10px 14px; border-bottom:1px solid #f1f5f9; vertical-align:top; font-size:12.5px; }\n  tr:last-child td { border-bottom:none; }\n  td.grp-cell { font-weight:800; color:#0f172a; white-space:nowrap; background:#fcfcfb; }\n  td.item { font-weight:700; color:#0f172a; white-space:nowrap; }\n  .ex { font-family:ui-monospace, 'SF Mono', Consolas, monospace; font-size:11px; background:#f1f5f9;\n        border:1px solid #e2e8f0; border-radius:4px; padding:0 5px; white-space:nowrap; }\n  b.key { color:#1d4ed8; }\n  .need { display:inline-block; font-size:9.5px; font-weight:700; color:#b45309; background:#fef3c7;\n          border-radius:5px; padding:0 6px; margin-left:4px; vertical-align:1px; }\n\n  .foot { max-width:1060px; margin:16px auto 0; background:#fbfbf9; border:1px solid #e7e5e0; border-radius:10px;\n          padding:12px 16px; font-size:11px; color:#64748b; }\n  .foot b { color:#334155; }\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\n\u003cdiv class=\"doc-head\">\n  \u003ch1>표기 규칙\u003c/h1>\n  \u003cdiv class=\"sub\">화면·문서·CSV 공통 표기 기준 · 현재 화면 19개에서 실제 사용 중인 표기를 집계해 정리 (2026-09-01 · 09-02 개정 — 한도 USD 표기·공통 UI 규격 추가) · 규칙을 바꾸면 이 표를 먼저 고치고 화면을 일괄 수정\u003c/div>\n\u003c/div>\n\n\u003cdiv class=\"tbl-wrap\">\n\u003ctable>\n  \u003cthead>\n    \u003ctr>\u003cth>구분\u003c/th>\u003cth>항목\u003c/th>\u003cth>규칙\u003c/th>\u003cth>예시\u003c/th>\u003c/tr>\n  \u003c/thead>\n  \u003ctbody>\n    \u003ctr>\n      \u003ctd class=\"grp-cell\" rowspan=\"4\">날짜·시간\u003c/td>\n      \u003ctd class=\"item\">날짜 (화면)\u003c/td>\n      \u003ctd>\u003cb class=\"key\">YYYY-MM-DD\u003c/b> — 하이픈 구분, 연도 4자리\u003c/td>\n      \u003ctd>\u003cspan class=\"ex\">2026-09-01\u003c/span>\u003c/td>\n    \u003c/tr>\n    \u003ctr>\n      \u003ctd class=\"item\">일시 (화면)\u003c/td>\n      \u003ctd>YYYY-MM-DD HH:MM — \u003cb class=\"key\">24시간제\u003c/b>, 분 단위(초 생략)\u003c/td>\n      \u003ctd>\u003cspan class=\"ex\">2026-08-31 14:22\u003c/span>\u003c/td>\n    \u003c/tr>\n    \u003ctr>\n      \u003ctd class=\"item\">일시 (CSV·보고서)\u003c/td>\n      \u003ctd>ISO 8601 \u003cb class=\"key\">YYYY-MM-DDTHH:MM:SS+09:00\u003c/b> — 초 단위, 오프셋 명기\u003c/td>\n      \u003ctd>\u003cspan class=\"ex\">2026-08-31T14:22:05+09:00\u003c/span>\u003c/td>\n    \u003c/tr>\n    \u003ctr>\n      \u003ctd class=\"item\">타임존\u003c/td>\n      \u003ctd>\u003cb class=\"key\">KST(UTC+9) 고정\u003c/b> — 화면에는 별도 표기 없음, CSV는 +09:00으로 명기\u003c/td>\n      \u003ctd>—\u003c/td>\n    \u003c/tr>\n    \u003ctr>\n      \u003ctd class=\"grp-cell\" rowspan=\"5\">수량·자산\u003c/td>\n      \u003ctd class=\"item\">수량 (화면)\u003c/td>\n      \u003ctd>천 단위 쉼표 · 소수점 아래 \u003cb class=\"key\">자산별 최대 자릿수 — ETH 6자리 · USDC·USDT 2자리\u003c/b>(2026-09-02 확정 · 종전 \"최대 6자리\" 폐기) · 불필요한 뒤 0 생략(입력 중에는 입력값 그대로) · 숫자와 티커 사이 공백 1칸 · 통화기호(₩·$) 사용 안 함 · 온체인 decimals(ETH 18 · USDC/USDT 6)와 별개의 UI 규칙\u003c/td>\n      \u003ctd>\u003cspan class=\"ex\">900 USDC\u003c/span> \u003cspan class=\"ex\">899.82 USDT\u003c/span> \u003cspan class=\"ex\">0.3141 ETH\u003c/span>\u003c/td>\n    \u003c/tr>\n    \u003ctr>\n      \u003ctd class=\"item\">수량 (CSV)\u003c/td>\n      \u003ctd>쉼표·통화기호 없음 — 단위는 자산 열이 정함\u003c/td>\n      \u003ctd>\u003cspan class=\"ex\">100000.000000\u003c/span>\u003c/td>\n    \u003c/tr>\n    \u003ctr>\n      \u003ctd class=\"item\">입력 자릿수·절사\u003c/td>\n      \u003ctd>입력: 숫자·소수점만 허용, 자산별 최대 자릿수 \u003cb class=\"key\">초과 입력은 무시(차단)\u003c/b> · 천 단위 쉼표 자동 삽입 · 산정값(받는 수량·수수료·USD 환산액)은 \u003cb class=\"key\">해당 자산 자릿수로 절사(내림)\u003c/b> — 반올림 아님 · USD 환산 표시는 소수 2자리 (2026-09-02 확정)\u003c/td>\n      \u003ctd>\u003cspan class=\"ex\">333.33 USDC × 0.9998 = 333.26 USDT\u003c/span> (333.263334 절사) · \u003cspan class=\"ex\">0.3141 ETH × 1% = 0.003141 ETH\u003c/span>\u003c/td>\n    \u003c/tr>\n    \u003ctr>\n      \u003ctd class=\"item\">자산명\u003c/td>\n      \u003ctd>티커 \u003cb class=\"key\">대문자\u003c/b> · 복수 나열은 가운뎃점(·)\u003c/td>\n      \u003ctd>\u003cspan class=\"ex\">ETH · USDC · USDT\u003c/span>\u003c/td>\n    \u003c/tr>\n    \u003ctr>\n      \u003ctd class=\"item\">한도 (USD 환산)\u003c/td>\n      \u003ctd>「\u003cb class=\"key\">{금액} USD 상당\u003c/b>」 — 건별 한도는 USD 환산액으로 표기(2026-09-02 확정) · 환산 시세 = ADM-03 시세 소스 · 요청 시점 · 종전 원화 환산(억 원 상당)·코인 수량 한도 표기 폐기\u003c/td>\n      \u003ctd>\u003cspan class=\"ex\">1,000 USD 상당\u003c/span>\u003c/td>\n    \u003c/tr>\n    \u003ctr>\n      \u003ctd class=\"grp-cell\" rowspan=\"2\">비율\u003c/td>\n      \u003ctd class=\"item\">교환비율 (화면)\u003c/td>\n      \u003ctd>스테이블 페어(USDC↔USDT): 「\u003cb class=\"key\">{비율} {받는코인}/{주는코인}\u003c/b>」 소수 4자리 · ETH 페어(ETH↔USDC·ETH↔USDT): \u003cb class=\"key\">방향 무관 「{비율} {스테이블}/ETH」\u003c/b>(1 ETH당 스테이블 수량) 소수 2자리 (2026-09-02 개정 — USDC→ETH를 받는/주는으로 쓰면 0.0003…이 되어 4자리 표현 불가) · 스프레드와 항상 별도 항목\u003c/td>\n      \u003ctd>\u003cspan class=\"ex\">0.9989 USDT/USDC\u003c/span> (USDC → USDT) · \u003cspan class=\"ex\">1.0000 USDC/USDT\u003c/span> (USDT → USDC) · \u003cspan class=\"ex\">3,184.00 USDC/ETH\u003c/span> (ETH → USDC와 USDC → ETH 공통)\u003c/td>\n    \u003c/tr>\n    \u003ctr>\n      \u003ctd class=\"item\">교환비율 (CSV)\u003c/td>\n      \u003ctd>단위 없이 숫자만 · 자릿수는 화면 규칙과 동일(스테이블 페어 4 · ETH 페어 2) · 받는 수량 = 스테이블 페어: 보내는 × 비율 / ETH 페어: ETH→스테이블은 ETH × 비율, 스테이블→ETH는 스테이블 ÷ 비율 — 결과는 받는 자산 자릿수로 절사\u003c/td>\n      \u003ctd>\u003cspan class=\"ex\">0.9989\u003c/span> · \u003cspan class=\"ex\">3184.00\u003c/span>\u003c/td>\n    \u003c/tr>\n    \u003ctr>\n      \u003ctd class=\"grp-cell\" rowspan=\"2\">스프레드\u003c/td>\n      \u003ctd class=\"item\">스프레드 (화면)\u003c/td>\n      \u003ctd>퍼센트 \u003cb class=\"key\">소수 2자리\u003c/b> — 비율과 합쳐 쓰지 않고 별도 항목\u003c/td>\n      \u003ctd>\u003cspan class=\"ex\">0.10%\u003c/span>\u003c/td>\n    \u003c/tr>\n    \u003ctr>\n      \u003ctd class=\"item\">스프레드 (CSV)\u003c/td>\n      \u003ctd>퍼센트가 아닌 \u003cb class=\"key\">소수 4자리 소수\u003c/b>로 기재\u003c/td>\n      \u003ctd>\u003cspan class=\"ex\">0.0010\u003c/span> (= 0.10%)\u003c/td>\n    \u003c/tr>\n    \u003ctr>\n      \u003ctd class=\"grp-cell\" rowspan=\"5\">식별자 (채번)\u003c/td>\n      \u003ctd class=\"item\">교환 거래\u003c/td>\n      \u003ctd>\u003cb class=\"key\">EXC-YYYYMMDD-NNNN\u003c/b> — 요청일 + 당일 일련번호 4자리 · 화면 표기 채번 (2026-09-01 통일, 종전 CSV 정의 EXC-YYYY-NNNNNN 폐기)\u003c/td>\n      \u003ctd>\u003cspan class=\"ex\">EXC-20260831-0142\u003c/span>\u003c/td>\n    \u003c/tr>\n    \u003ctr>\n      \u003ctd class=\"item\">중개 거래(마목)\u003c/td>\n      \u003ctd>\u003cb class=\"key\">BRK-YYYYMMDD-NNNN\u003c/b> — 게시일 + 당일 일련번호 4자리 · 게시(RFQ)·신청·이전이 같은 번호를 공유 (2026-09-02 추가 — 화면 BRK-03~05·DASH-01 기존 사용 표기를 규칙화)\u003c/td>\n      \u003ctd>\u003cspan class=\"ex\">BRK-20260830-0027\u003c/span>\u003c/td>\n    \u003c/tr>\n    \u003ctr>\n      \u003ctd class=\"item\">법인(고객사)\u003c/td>\n      \u003ctd>ORG-\u003cb class=\"key\">NNNN\u003c/b> — 예시 서술에서만 ORG-A·B·C 가명 사용\u003c/td>\n      \u003ctd>\u003cspan class=\"ex\">ORG-0001\u003c/span>\u003c/td>\n    \u003c/tr>\n    \u003ctr>\n      \u003ctd class=\"item\">승인자(내부)\u003c/td>\n      \u003ctd>DSRV-OPS-\u003cb class=\"key\">NN\u003c/b> · 복수는 세미콜론(;) 연결(CSV)\u003c/td>\n      \u003ctd>\u003cspan class=\"ex\">DSRV-OPS-01;DSRV-OPS-02\u003c/span>\u003c/td>\n    \u003c/tr>\n    \u003ctr>\n      \u003ctd class=\"item\">화면 ID\u003c/td>\n      \u003ctd>{영역}-NN — ONB·AUTH·DASH·EXC·BRK·ADM · \u003cb class=\"key\">ADM-01은 결번\u003c/b> · WAL 영역은 2026-09-01 삭제(결번) · BRK-06·07은 2026-09-02 추가(번호는 추가 순 — 흐름 순서 아님)\u003c/td>\n      \u003ctd>\u003cspan class=\"ex\">EXC-01\u003c/span>\u003c/td>\n    \u003c/tr>\n    \u003ctr>\n      \u003ctd class=\"grp-cell\" rowspan=\"2\">주소·해시\u003c/td>\n      \u003ctd class=\"item\">지갑주소·tx 해시 (화면)\u003c/td>\n      \u003ctd>앞 \u003cb class=\"key\">0x + 4자 … 뒤 4자\u003c/b> 마스킹 — 말줄임 문자는 U+2026(…) · 예외: 입금 전용 자체 지갑 주소(DASH-01 지갑 잔고)는 \u003cb class=\"key\">전문 표기\u003c/b>(2026-09-01)\u003c/td>\n      \u003ctd>\u003cspan class=\"ex\">0x9f3a…d81c\u003c/span>\u003c/td>\n    \u003c/tr>\n    \u003ctr>\n      \u003ctd class=\"item\">지갑주소·tx 해시 (CSV·감사기록)\u003c/td>\n      \u003ctd>\u003cb class=\"key\">전체 표기\u003c/b>(마스킹 없음) — 16진수 소문자\u003c/td>\n      \u003ctd>\u003cspan class=\"ex\">0x9f3a…(전체)\u003c/span>\u003c/td>\n    \u003c/tr>\n    \u003ctr>\n      \u003ctd class=\"grp-cell\" rowspan=\"2\">상태값\u003c/td>\n      \u003ctd class=\"item\">화면\u003c/td>\n      \u003ctd>\u003cb class=\"key\">한글 라벨\u003c/b> 배지\u003c/td>\n      \u003ctd>\u003cspan class=\"ex\">완료\u003c/span> \u003cspan class=\"ex\">승인 대기\u003c/span>\u003c/td>\n    \u003c/tr>\n    \u003ctr>\n      \u003ctd class=\"item\">CSV·시스템 코드\u003c/td>\n      \u003ctd>영문 \u003cb class=\"key\">대문자\u003c/b> 코드\u003c/td>\n      \u003ctd>\u003cspan class=\"ex\">COMPLETED\u003c/span> \u003cspan class=\"ex\">CANCELED\u003c/span>\u003c/td>\n    \u003c/tr>\n  \u003c/tbody>\n\u003c/table>\n\u003c/div>\n\n\u003cdiv class=\"doc-head\" style=\"margin-top:26px;\">\n  \u003ch1 style=\"font-size:16px;\">공통 UI 규격\u003c/h1>\n  \u003cdiv class=\"sub\">전 화면 공통 동작·문구 기준 (2026-09-02 확정 — \"규격은 공통으로\") · 화면별 기획서에는 예외만 적고, 여기 없는 동작은 디자이너·개발자가 이 표를 따른다\u003c/div>\n\u003c/div>\n\u003cdiv class=\"tbl-wrap\">\n\u003ctable>\n  \u003cthead>\n    \u003ctr>\u003cth>구분\u003c/th>\u003cth>항목\u003c/th>\u003cth>규칙\u003c/th>\u003cth>적용·예시\u003c/th>\u003c/tr>\n  \u003c/thead>\n  \u003ctbody>\n    \u003ctr>\n      \u003ctd class=\"grp-cell\" rowspan=\"3\">전역 내비게이션\u003c/td>\n      \u003ctd class=\"item\">로그아웃\u003c/td>\n      \u003ctd>상단바 우측 \u003cb class=\"key\">기관 배지 클릭 → 메뉴(로그아웃)\u003c/b> — 전 화면 동일 위치, 확인 문구 없음 · 세션 즉시 파기\u003c/td>\n      \u003ctd>→ AUTH-01 · 어드민 콘솔도 동일(→ 어드민 로그인)\u003c/td>\n    \u003c/tr>\n    \u003ctr>\n      \u003ctd class=\"item\">뒤로가기\u003c/td>\n      \u003ctd>브라우저 뒤로가기 \u003cb class=\"key\">전 화면 미지원\u003c/b> — \"접근할 수 없는 화면입니다\" 안내 후 대시보드 이동 · 화면 이동은 GNB·화면 내 버튼으로만 (DASH-01 항목 5 규칙)\u003c/td>\n      \u003ctd>→ DASH-01\u003c/td>\n    \u003c/tr>\n    \u003ctr>\n      \u003ctd class=\"item\">종료 동선\u003c/td>\n      \u003ctd>flow 마지막 화면의 \u003cb class=\"key\">[확인]\u003c/b> = 대시보드 이동 · 입력·행위 화면의 \u003cb class=\"key\">[취소]\u003c/b>(ghost) = 입력값 파기 후 직전 목록 화면 복귀, 확인 문구 없음\u003c/td>\n      \u003ctd>EXC-03·04·BRK-05 [확인] → DASH-01 · BRK-02·03 [취소] → BRK-01 · DASH-02·03 [취소] → DASH-01 (2026-09-02 추가 — 뒤로가기 미지원 규칙은 유지)\u003c/td>\n    \u003c/tr>\n    \u003ctr>\n      \u003ctd class=\"grp-cell\" rowspan=\"4\">버튼·확인\u003c/td>\n      \u003ctd class=\"item\">비활성(disabled)\u003c/td>\n      \u003ctd>회색 배경·회색 글자·\u003cb class=\"key\">cursor not-allowed\u003c/b>, 클릭 무반응 · 비활성 \u003cb>사유는 툴팁이 아니라 인라인 경고\u003c/b>로 버튼 위에 표시(EXC-01 패턴) · 툴팁·hover 설명 사용 안 함\u003c/td>\n      \u003ctd>\u003cspan class=\"ex\">.btn.disabled\u003c/span> · EXC-01 [거래 요청] — 자산 미선택·수량 미입력·한도·풀 초과·KYC 배너 노출 중 · EXC-01 받는 자산 ▾ — 보내는 자산 선택 전\u003c/td>\n    \u003c/tr>\n    \u003ctr>\n      \u003ctd class=\"item\">드롭다운(선택 목록)\u003c/td>\n      \u003ctd>클릭 → 목록 펼침(현재 선택 강조) · 항목 클릭 시 선택·닫힘 · 바깥 클릭/ESC 닫힘 · 미선택 상태는 회색 안내 문구(\"자산 선택\") · \u003cb class=\"key\">자산 쌍은 보내는 자산 먼저\u003c/b> — 받는 자산 ▾는 보내는 자산 선택 전 비활성, 목록에서 보내는 자산 제외(동일 자산 구조적 불가) · 보내는 자산 변경 시 받는 자산·수량 초기화 (2026-09-02 확정)\u003c/td>\n      \u003ctd>EXC-01 · BRK-02 자산 선택 · ADM-03 시세 소스·상태 변경\u003c/td>\n    \u003c/tr>\n    \u003ctr>\n      \u003ctd class=\"item\">확인 다이얼로그\u003c/td>\n      \u003ctd>\u003cb class=\"key\">구속력·비가역 행위 직전에만\u003c/b> 모달 확인 — 제목(행위명) + 결과 1~2문장 + [실행]/[돌아가기] · 그 외(취소·거절·저장)는 확인 없음\u003c/td>\n      \u003ctd>BRK-03 신청 · BRK-04 수락 · BRK-06 게시 내리기 · EXC-02 수락 · ADM-02 승인/거절/이전 중지\u003c/td>\n    \u003c/tr>\n    \u003ctr>\n      \u003ctd class=\"item\">단독 실행 표기\u003c/td>\n      \u003ctd>가입자 1인 단독 실행 화면은 버튼 아래 \u003cb class=\"key\">결과 고지 1문장\u003c/b>(즉시 확정·구속력·수수료) 상시 노출 — 승인자 지정·2단계 승인 UI 없음(1기관 1가입자)\u003c/td>\n      \u003ctd>BRK-03·04 하단 문구\u003c/td>\n    \u003c/tr>\n    \u003ctr>\n      \u003ctd class=\"grp-cell\" rowspan=\"4\">상태 표시\u003c/td>\n      \u003ctd class=\"item\">빈 상태\u003c/td>\n      \u003ctd>목록·표 대신 점선 박스 + \u003cb class=\"key\">\"…이(가) 없습니다\"\u003c/b> 문구 1줄 + 다음 행동 안내 1줄 · 일러스트·아이콘 없음\u003c/td>\n      \u003ctd>BRK-01 \"게시된 거래의향이 없습니다\" · BRK-06 \"받은 신청이 없습니다\" · DASH-01 \"거래 내역이 없습니다\"\u003c/td>\n    \u003c/tr>\n    \u003ctr>\n      \u003ctd class=\"item\">로딩\u003c/td>\n      \u003ctd>영역 단위 \u003cb class=\"key\">\"불러오는 중…\"\u003c/b> 텍스트(스피너 없음, 스켈레톤 없음) · 3초 초과 시 오류 규격으로 전환\u003c/td>\n      \u003ctd>목록·잔고·시세 영역\u003c/td>\n    \u003c/tr>\n    \u003ctr>\n      \u003ctd class=\"item\">오류 문구\u003c/td>\n      \u003ctd>① 입력 오류 = 필드 아래 \u003cb class=\"key\">빨간 인라인 박스\u003c/b>(⚠ + 원인 + 해결 행동) ② 시스템 오류 = 상단 배너 \"일시적인 오류입니다. 잠시 후 다시 시도해 주세요\" ③ 권한·상태 게이팅 = 상단 배너(G-3 KYC 패턴) · \u003cb>내부 사유·AML 심사 내용 미노출\u003c/b>\u003c/td>\n      \u003ctd>EXC-01 한도·풀 초과 · EXC-01 KYC 배너 · EXC-04 '심사 후 보류' 일반화 사유\u003c/td>\n    \u003c/tr>\n    \u003ctr>\n      \u003ctd class=\"item\">상태 칩\u003c/td>\n      \u003ctd>한글 라벨 배지(표기 규칙) · 색 3계열만 — 진행(노랑)·대기(파랑)·완료(초록), 종결·거절은 회색 \u003cspan class=\"need\">[확인필요: 고객 화면 상태 enum 확정 — states 고객 도메인 섹션]\u003c/span>\u003c/td>\n      \u003ctd>DASH-01 진행중 / 승인 대기 / 완료 · 마목 게시 상태: 게재중 / \u003cb>협의중\u003c/b>(신청 1건 접수·추가 신청 차단) / 확정 / 완료 / 회수 / \u003cb>중지\u003c/b>(price guard — 대기 신청 전부 종결) (2026-09-02 확정)\u003c/td>\n    \u003c/tr>\n    \u003ctr>\n      \u003ctd class=\"grp-cell\" rowspan=\"2\">목록\u003c/td>\n      \u003ctd class=\"item\">정렬·필터·페이징\u003c/td>\n      \u003ctd>\u003cb class=\"key\">없음\u003c/b> — 최신순 단일 리스트, 전체 나열(자동 매칭·조건 검색 부재 담보, BRK-01 결정) · 100행 초과 시 \"더 보기\" 버튼으로 이어 붙임\u003c/td>\n      \u003ctd>BRK-01 · DASH-01 · BRK-06 받은 신청\u003c/td>\n    \u003c/tr>\n    \u003ctr>\n      \u003ctd class=\"item\">행 클릭\u003c/td>\n      \u003ctd>행 전체가 클릭 영역 · 이동 목적지는 각 화면 「화면 이동·인터랙션」 표에 명시 · 선택 불가 행(만료 · 타사 게시 '협의중' 등)은 회색 처리·클릭 무반응\u003c/td>\n      \u003ctd>BRK-01 → BRK-03/06 · DASH-01 → EXC-03/04·BRK-05/06/07\u003c/td>\n    \u003c/tr>\n    \u003ctr>\n      \u003ctd class=\"grp-cell\" rowspan=\"3\">어드민\u003c/td>\n      \u003ctd class=\"item\">로그인\u003c/td>\n      \u003ctd>별도 화면 \u003cb class=\"key\">없음(ADM-01 결번 유지)\u003c/b> — AUTH-01과 동일 규격(ID/PW + Google Authenticator) + PAM 전용세션에서만 접속 · 유휴 10분(관리자) \u003cspan class=\"need\">[확인필요]\u003c/span>\u003c/td>\n      \u003ctd>AUTH-01 규격 공용\u003c/td>\n    \u003c/tr>\n    \u003ctr>\n      \u003ctd class=\"item\">역할·노출\u003c/td>\n      \u003ctd>어드민 역할 \u003cb class=\"key\">1종(운영 관리자)\u003c/b> — 화면·버튼 노출 차이 없음 · 통제는 본인 기안 자기승인 차단(행 단위) + 감사로그 + PAM · 콜드 2인 서명자는 콘솔 밖 커스터디 절차\u003c/td>\n      \u003ctd>ADM-02·03 전 기능 동일 노출\u003c/td>\n    \u003c/tr>\n    \u003ctr>\n      \u003ctd class=\"item\">처리 버튼\u003c/td>\n      \u003ctd>처리함 행 내 인라인 버튼(승인·보류·거절·이전 중지 등)만 — 별도 상세 화면 없음 · 보류·거절은 사유 입력 필수(모달) · 상태명·버튼명은 states.html 도메인 상태와 동일\u003c/td>\n      \u003ctd>ADM-02 처리함\u003c/td>\n    \u003c/tr>\n    \u003ctr>\n      \u003ctd class=\"grp-cell\" rowspan=\"1\">정보 노출\u003c/td>\n      \u003ctd class=\"item\">고객 화면 미노출\u003c/td>\n      \u003ctd>내부 회계 계정명(운영손익·중개수익) · 내부 사유·AML 심사 내용 · 시세 소스명 — 고객 콘솔 어디에도 표시하지 않음, 구분회계는 어드민 CSV(ADM-02)에서만 (2026-09-02 확정)\u003c/td>\n      \u003ctd>EXC-04·BRK-05 결과 화면에서 계정명 행 제거\u003c/td>\n    \u003c/tr>\n    \u003ctr>\n      \u003ctd class=\"grp-cell\" rowspan=\"1\">이메일 통지\u003c/td>\n      \u003ctd class=\"item\">공통 원칙\u003c/td>\n      \u003ctd>발신전용(no-reply) · 본문에 링크·버튼 없음(콘솔 직접 접속 안내) · 상호 마스킹은 화면과 동일 · 심사·AML 내용 미포함 · 4종(신청 접수 ① / 수락·확정 ② / 거래 완료 ③ / 게시 회수 ④)\u003c/td>\n      \u003ctd>BRK-03 상세(①·공통 원칙) · BRK-04(②) · BRK-05(③) · BRK-06(④)\u003c/td>\n    \u003c/tr>\n  \u003c/tbody>\n\u003c/table>\n\u003c/div>\n\n\u003cdiv class=\"foot\">\n  \u003cb>기준·비고\u003c/b> — 화면 19개에서 실제 사용 중인 표기를 집계(2026-09-01 · 09-02 BRK-06·07 추가)해 다수 표기를 표준으로 채택.\n  비율 표기({비율} 받는코인/주는코인 · 스프레드 분리)와 거래 채번(EXC-YYYYMMDD-NNNN)은 2026-09-01 확정 규칙.\n  날짜는 현재 전 화면이 YYYY-MM-DD로 통일돼 있어 그대로 표준화 — 다른 형식(예: YY.MM.DD)으로 바꾸려면 이 표 개정 후 화면 일괄 수정.\n\u003c/div>\n\u003c/body>\n\u003c/html>\n";
const STATES="\u003c!DOCTYPE html>\n\u003chtml lang=\"ko\">\n\u003chead>\n\u003cmeta charset=\"UTF-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n\u003ctitle>상태 전이 — 알람·워닝 처리함 (교환·중개 콘솔)\u003c/title>\n\u003cstyle>\n  @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');\n  * { margin:0; padding:0; box-sizing:border-box; }\n  body { font-family:'Pretendard', system-ui, -apple-system, sans-serif; background:#fafafa; color:#1e293b;\n         font-size:13px; line-height:1.6; padding:28px 32px 60px; }\n  .doc-head { max-width:1060px; margin:0 auto 22px; }\n  .doc-head h1 { font-size:19px; font-weight:800; letter-spacing:-.01em; }\n  .doc-head .sub { font-size:11.5px; color:#64748b; margin-top:3px; }\n  .cols { max-width:1060px; margin:0 auto 20px; display:grid; grid-template-columns:1fr 1fr; gap:20px; align-items:start; }\n  @media (max-width:900px){ .cols { grid-template-columns:1fr; } }\n  .wide { max-width:1060px; margin:0 auto 20px; }\n  .panel { background:#fff; border:1px solid #e2e8f0; border-radius:10px; padding:16px 18px 18px; }\n  .panel + .panel { margin-top:20px; }\n  .panel-title { font-size:13px; font-weight:800; display:flex; align-items:baseline; gap:8px; margin-bottom:2px; }\n  .panel-title .tno { font-family:ui-monospace, Consolas, monospace; font-size:10px; font-weight:700; color:#3b82f6;\n                      background:#eff6ff; border:1px solid #bfdbfe; border-radius:4px; padding:0 6px; vertical-align:1px; }\n  .panel-title .scope { font-size:10px; font-weight:600; color:#64748b; }\n  .panel-note { font-size:10.5px; color:#94a3b8; margin-bottom:10px; }\n\n  .intro { font-size:11.5px; color:#334155; margin-top:6px; }\n  .intro b { color:#0f172a; }\n  .intro p + p { margin-top:6px; }\n\n  .gloss { display:grid; grid-template-columns:110px 1fr; gap:4px 12px; font-size:11px; margin-top:8px; }\n  .gloss dt { font-weight:700; color:#0f172a; white-space:nowrap; }\n  .gloss dd { color:#475569; }\n  @media (max-width:700px){ .gloss { grid-template-columns:90px 1fr; } }\n\n  .desc { font-size:11px; color:#334155; background:#f8fafc; border:1px solid #e2e8f0; border-radius:7px;\n          padding:7px 10px; margin-bottom:10px; }\n  .desc b { color:#0f172a; }\n  .desc .trg { display:block; margin-top:4px; color:#64748b; }\n  .desc .trg b { color:#334155; }\n\n  /* 상태 pill flow */\n  .flow { display:flex; flex-wrap:wrap; align-items:center; row-gap:6px; margin:8px 0 4px; }\n  .st { display:inline-block; font-size:10.5px; font-weight:700; padding:2px 9px; border-radius:12px;\n        border:1px solid #cbd5e1; color:#334155; background:#fff; white-space:nowrap; }\n  .st.start { border-color:#93c5fd; color:#1d4ed8; background:#eff6ff; }\n  .st.esc   { border-color:#c4b5fd; color:#6d28d9; background:#f5f3ff; }\n  .st.mid   { border-color:#fcd34d; color:#b45309; background:#fffbeb; }\n  .st.end   { border-color:#86efac; color:#15803d; background:#f0fdf4; }\n  .st.bad   { border-color:#fca5a5; color:#b91c1c; background:#fef2f2; }\n  .fa { color:#94a3b8; font-size:11px; padding:0 5px; }\n  .fa .by { display:block; font-size:8.5px; line-height:1.1; text-align:center; color:#b45309; font-weight:700; }\n  .fa .by.sys { color:#0369a1; }\n\n  .tbl { width:100%; border-collapse:collapse; font-size:11px; margin-top:8px; }\n  .tbl th { background:#f1f5f9; color:#64748b; font-weight:700; text-align:left; padding:5px 8px;\n            border-bottom:1px solid #e2e8f0; font-size:10px; }\n  .tbl td { padding:6px 8px; border-bottom:1px solid #f1f1ee; color:#334155; vertical-align:top; }\n  .tbl td .st { font-size:9.5px; padding:1px 7px; }\n  .mono { font-family:ui-monospace, Consolas, monospace; font-size:10px; }\n\n  .scr { display:inline-flex; align-items:baseline; gap:4px; background:#fff; border:1px solid #cbd5e1;\n         border-radius:6px; padding:1px 7px; margin:0 2px; cursor:pointer; font-size:10.5px; color:#334155;\n         transition:all .12s; text-decoration:none; vertical-align:1px; }\n  .scr:hover { border-color:#3b82f6; background:#eff6ff; color:#1d4ed8; }\n  .scr .sid { font-family:ui-monospace, Consolas, monospace; font-size:9px; font-weight:700; color:#94a3b8; }\n  .scr:hover .sid { color:#3b82f6; }\n\n  .need { display:inline-block; font-size:9.5px; font-weight:700; color:#b45309; background:#fef3c7;\n          border-radius:5px; padding:0 6px; margin-left:4px; vertical-align:1px; }\n  .red { color:#991b1b; font-weight:700; }\n\n  .foot { max-width:1060px; margin:20px auto 0; background:#fbfbf9; border:1px solid #e7e5e0; border-radius:10px;\n          padding:12px 16px; font-size:11px; color:#64748b; }\n  .foot b { color:#334155; }\n  .foot ol { margin:6px 0 0 18px; }\n  .foot li + li { margin-top:3px; }\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\n\u003cdiv class=\"doc-head\">\n  \u003ch1>상태 전이 — 알람·워닝 처리함\u003c/h1>\n  \u003cdiv class=\"sub\">ADM-02 처리함에 쌓이는 아이템의 유형별 생성 조건 · 상태값 · 상태 전이 정의 (개발 이관용) · v0.2 2026-09-01\u003c/div>\n\u003c/div>\n\n\u003c!-- 처리함이란 -->\n\u003cdiv class=\"wide\">\n  \u003cdiv class=\"panel\">\n    \u003cdiv class=\"panel-title\">처리함이란\u003c/div>\n    \u003cdiv class=\"intro\">\n      \u003cp>처리함은 관리자 홈(\u003cspan class=\"scr\" data-pid=\"ADM-02\">\u003cspan class=\"sid\">ADM-02\u003c/span>홈\u003c/span>)의 작업 목록이다.\n      시스템이 \u003cb>승인·확인·조사가 필요한 일\u003c/b>을 감지하면 '아이템'을 자동으로 만들어 이 목록에 쌓고,\n      관리자가 내용을 확인한 뒤 승인·거절·해제 등으로 \u003cb>종결\u003c/b>한다. 아이템 유형은 8종 + 1종(T1~T8, X3)이다.\u003c/p>\n      \u003cp>\u003cb>핵심 원칙 — 생성은 시스템, 종결은 사람.\u003c/b> 자동 체결·자동 승인·자동 거절이 없다\n      (유일한 예외는 T7의 재이행 완료 자동 종결). 본인이 올린 건은 본인이 승인할 수 없고,\n      보류·거절에는 사유 입력이 필수이며, 모든 상태 변경은 감사로그에 남는다.\u003c/p>\n    \u003c/div>\n  \u003c/div>\n\n  \u003cdiv class=\"panel\">\n    \u003cdiv class=\"panel-title\">용어\u003c/div>\n    \u003cdl class=\"gloss\">\n      \u003cdt>나목 교환\u003c/dt>\u003cdd>고객이 DSRV를 상대방으로 하는 ETH·USDC·USDT 교환 (예: ETH↔USDC, USDC↔USDT · 2026-09-02 ETH 편입). 가상자산사업자 신고 업종 구분에서 온 이름으로, 이 문서에서는 \"DSRV와의 직접 교환\"으로 읽으면 된다.\u003c/dd>\n      \u003cdt>마목 중개\u003c/dt>\u003cdd>고객 간 교환을 DSRV가 게시판 방식으로 중개하는 것. 게시자가 신청을 수락하는 순간 거래가 확정되고 법적 구속력이 생긴다. 확정 전까지 게시자는 게시를 회수할 수 있다(BRK-06 · 2026-09-02). 중개 수수료는 거래액의 1% 고정, 양측 각자 부담.\u003c/dd>\n      \u003cdt>KYT\u003c/dt>\u003cdd>트랜잭션의 자금 출처·경로 위험도를 자동 분석하는 검사 (Know Your Transaction).\u003c/dd>\n      \u003cdt>BLF\u003c/dt>\u003cdd>제재 대상·블랙리스트에 오른 지갑 주소인지 대조하는 필터.\u003c/dd>\n      \u003cdt>STR\u003c/dt>\u003cdd>의심거래보고. 자금세탁이 의심되는 거래를 금융당국(FIU)에 보고하는 절차. 보고 대상 고객이 보고 사실을 알게 해서는 안 된다(누설 금지).\u003c/dd>\n      \u003cdt>에스컬레이션\u003c/dt>\u003cdd>자동검증에서 위험등급 '주의' 이상이 잡힌 건. 일반 대기 건과 구분해 우선 검토한다.\u003c/dd>\n      \u003cdt>지연발효\u003c/dt>\u003cdd>새 출금 주소를 등록해도 일정 시간이 지나야 실제 출금이 가능해지는 보호장치. 계정 탈취 시 즉시 출금 피해를 막는다.\u003c/dd>\n      \u003cdt>격리 지갑\u003c/dt>\u003cdd>위험 신호가 있는 입금을 고객 잔고에 반영하지 않고 따로 보관하는 지갑.\u003c/dd>\n      \u003cdt>3면 대사\u003c/dt>\u003cdd>내부 장부 · 블록체인 실제 잔고 · 콜드월렛 기록, 세 곳의 수치가 서로 일치하는지 맞춰보는 정기 점검.\u003c/dd>\n      \u003cdt>트래블룰\u003c/dt>\u003cdd>가상자산을 이전할 때 송신인·수신인 정보를 함께 전달해야 하는 규제 요건.\u003c/dd>\n    \u003c/dl>\n  \u003c/div>\n\u003c/div>\n\n\u003c!-- 상태 모델 -->\n\u003cdiv class=\"wide\">\n  \u003cdiv class=\"panel\">\n    \u003cdiv class=\"panel-title\">상태 모델 — 2계층 분리 \u003cspan class=\"scope\">아이템 공통 상태 + 대상 도메인 상태\u003c/span>\u003c/div>\n    \u003cdiv class=\"intro\" style=\"margin-bottom:8px;\">\n      \u003cp>8가지 유형은 대상 업무가 서로 달라(교환 승인, 입금 격리, 계정 잠금…) 상태 이름을 하나로 통일하면 실제 업무가 안 보인다. 그래서 두 층으로 나눈다.\u003c/p>\n      \u003cp>① \u003cb>아이템 공통 상태 (5종)\u003c/b> — 유형과 무관하게 \"아직 안 봤나 / 처리 중인가 / 끝났나\"를 집계하는 공통 축. 화면 상단 KPI(처리 대기 N건 등)가 이 축을 센다.\u003cbr>\n      ② \u003cb>도메인 상태\u003c/b> — 유형별 실제 업무 상태(승인 대기, 격리 중, 잠금 등). 목록의 '상태' 컬럼에 표시되는 값. 아래 유형별 패널과 맨 아래 총목록이 이 축이다.\u003c/p>\n    \u003c/div>\n    \u003cdiv class=\"flow\">\n      \u003cspan style=\"font-size:10px;font-weight:700;color:#64748b;margin-right:6px;\">아이템 공통 (5종)\u003c/span>\n      \u003cspan class=\"st start\">OPEN 미처리\u003c/span>\u003cspan class=\"fa\">→\u003c/span>\n      \u003cspan class=\"st esc\">ESCALATED 에스컬레이션\u003c/span>\u003cspan class=\"fa\">→\u003c/span>\n      \u003cspan class=\"st mid\">IN_PROGRESS 처리중\u003c/span>\u003cspan class=\"fa\">→\u003c/span>\n      \u003cspan class=\"st mid\">HOLD 보류\u003c/span>\u003cspan class=\"fa\">→\u003c/span>\n      \u003cspan class=\"st end\">RESOLVED 종결 + 결과코드\u003c/span>\n    \u003c/div>\n    \u003cdiv style=\"font-size:10.5px;color:#64748b;margin-top:4px;\">\n      · 자동검증 등급이 '주의' 이상이면 처음부터 ESCALATED로 생성된다 · RESOLVED에는 결과코드가 붙는다: 승인 / 거절 / 소명 인정 / 동결 / STR 이관 / 무혐의 / 조치완료 / 해제 / 제한 적용 / 자동 종결(T7)\u003cbr>\n      · \u003cb style=\"color:#334155;\">누가 상태를 바꾸는가\u003c/b> — \u003cb style=\"color:#0369a1;\">시스템(자동)\u003c/b>: 아이템 생성 전부 · 지연발효 타이머 만료(T3) · 온체인 확정 반영(T1·T3) · 재이행 완료 자동 종결(T7) · 격리/동결/잠금의 개시 / \u003cb style=\"color:#b45309;\">사람(관리자)\u003c/b>: 종결로 가는 판단 전부 — 자동 체결·자동 승인·자동 거절 없음 · 본인 기안 자기승인 차단 · 보류/거절 사유 필수 · 모든 전이 감사로그 기록\n    \u003c/div>\n  \u003c/div>\n\u003c/div>\n\n\u003cdiv class=\"cols\">\n\n  \u003c!-- T1 -->\n  \u003cdiv class=\"panel\">\n    \u003cdiv class=\"panel-title\">\u003cspan class=\"tno\">T1\u003c/span>나목 교환 승인 \u003cspan class=\"scope\">대상: 교환 요청\u003c/span>\u003c/div>\n    \u003cdiv class=\"desc\">\n      고객이 DSRV와의 교환 비율을 수락하면 요청이 확정되고, 실제 집행 전에 \u003cb>관리자 승인\u003c/b>을 거친다. 그 승인 건이 여기 쌓인다. 모든 요청이 예외 없이 유입되며(자동 통과 없음), 시스템이 건별 한도·잔고·BLF·KYT 자동검증 결과를 붙여서 생성한다.\n      \u003cspan class=\"trg\">\u003cb>생성 시점\u003c/b> — \u003cspan class=\"scr\" data-pid=\"EXC-02\">\u003cspan class=\"sid\">EXC-02\u003c/span>비율 수락\u003c/span> 즉시\u003c/span>\n    \u003c/div>\n    \u003cdiv class=\"flow\">\n      \u003cspan class=\"st start\">승인 대기\u003c/span>\n      \u003cspan class=\"fa\">\u003cspan class=\"by\">승인(사람)\u003c/span>→\u003c/span>\n      \u003cspan class=\"st mid\">집행 대기\u003c/span>\n      \u003cspan class=\"fa\">\u003cspan class=\"by sys\">서명·집행(오프라인)\u003c/span>→\u003c/span>\n      \u003cspan class=\"st end\">완료\u003c/span>\n    \u003c/div>\n    \u003cdiv class=\"flow\">\n      \u003cspan class=\"st start\">승인 대기\u003c/span>\n      \u003cspan class=\"fa\">\u003cspan class=\"by\">보류(사유)\u003c/span>→\u003c/span>\n      \u003cspan class=\"st mid\">보류\u003c/span>\n      \u003cspan class=\"fa\">\u003cspan class=\"by\">재검토\u003c/span>→\u003c/span>\n      \u003cspan class=\"st start\">복귀\u003c/span>\n      \u003cspan class=\"fa\">/\u003c/span>\n      \u003cspan class=\"fa\">\u003cspan class=\"by\">거절(사유)\u003c/span>→\u003c/span>\n      \u003cspan class=\"st bad\">거절\u003c/span>\n    \u003c/div>\n    \u003cdiv style=\"font-size:10.5px;color:#64748b;margin-top:4px;\">· 위험등급 '주의' 이상이면 \u003cspan class=\"st esc\" style=\"font-size:9.5px;padding:1px 7px;\">에스컬레이션\u003c/span> 상태로 생성 · 고객 화면에는 승인 대기~집행 대기를 'DSRV 거래 진행중' 하나로만 표시해 내부 단계를 노출하지 않고(\u003cspan class=\"scr\" data-pid=\"EXC-03\">\u003cspan class=\"sid\">EXC-03\u003c/span>\u003c/span>), 보류는 '심사 후 보류' + 일반화된 사유만 표시(\u003cspan class=\"scr\" data-pid=\"EXC-04\">\u003cspan class=\"sid\">EXC-04\u003c/span>\u003c/span>) · AML 사유로 거절한 건은 STR 검토로 연계\u003c/div>\n  \u003c/div>\n\n  \u003c!-- T2 -->\n  \u003cdiv class=\"panel\">\n    \u003cdiv class=\"panel-title\">\u003cspan class=\"tno\">T2\u003c/span>마목 확정 확인 \u003cspan class=\"scope\">대상: 확정 거래\u003c/span>\u003c/div>\n    \u003cdiv class=\"desc\">\n      중개 거래는 게시자가 신청을 수락하는 순간 \u003cb>이미 확정\u003c/b>되어 법적 구속력이 생긴다. 그래서 이 아이템은 거래 성립을 승인하는 것이 아니라, \u003cb>확정된 거래의 자산 이전(정산)을 진행해도 되는지 확인\u003c/b>하는 절차다.\n      \u003cspan class=\"trg\">\u003cb>생성 시점\u003c/b> — \u003cspan class=\"scr\" data-pid=\"BRK-04\">\u003cspan class=\"sid\">BRK-04\u003c/span>게시자 수락\u003c/span>(=확정) 즉시\u003c/span>\n    \u003c/div>\n    \u003cdiv class=\"flow\">\n      \u003cspan class=\"st start\">확인 대기\u003c/span>\n      \u003cspan class=\"fa\">\u003cspan class=\"by\">승인(사람)\u003c/span>→\u003c/span>\n      \u003cspan class=\"st mid\">이전 진행\u003c/span>\n      \u003cspan class=\"fa\">\u003cspan class=\"by sys\">정산 배치\u003c/span>→\u003c/span>\n      \u003cspan class=\"st end\">완료\u003c/span>\n    \u003c/div>\n    \u003cdiv class=\"flow\">\n      \u003cspan class=\"st start\">확인 대기\u003c/span>\n      \u003cspan class=\"fa\">\u003cspan class=\"by\">보류(사유)\u003c/span>→\u003c/span>\n      \u003cspan class=\"st mid\">보류\u003c/span>\n      \u003cspan class=\"fa\">/\u003c/span>\n      \u003cspan class=\"fa\">\u003cspan class=\"by\">거절·차단\u003c/span>→\u003c/span>\n      \u003cspan class=\"st bad\">이전 중지\u003c/span>\n    \u003c/div>\n    \u003cdiv style=\"font-size:10.5px;color:#64748b;margin-top:4px;\">· 거절은 거래 취소가 아니라 \u003cb>이전 중지\u003c/b> — 이미 확정된 거래를 중지했을 때의 계약상 처리(무산·위약 여부)는 약관·법무 확인 필요\u003cspan class=\"need\">결정필요 ①\u003c/span> · 트래블룰 정보가 갖춰지지 않은 건은 보류했다가 보완되면 재진행 · 실제 이전은 \u003cspan class=\"scr\" data-pid=\"BRK-05\">\u003cspan class=\"sid\">BRK-05\u003c/span>\u003c/span> 정산 배치(1영업일 3회)로 실행\u003c/div>\n  \u003c/div>\n\n  \u003c!-- T3 -->\n  \u003cdiv class=\"panel\">\n    \u003cdiv class=\"panel-title\">\u003cspan class=\"tno\">T3\u003c/span>출금·이전 (서면 접수) \u003cspan class=\"scope\">대상: 출금·이전 요청\u003c/span>\u003c/div>\n    \u003cdiv class=\"desc\">\n      고객의 출금·이전은 서면으로 신청받아 관리자가 시스템에 등록한다. 처음 쓰는 출금 주소라면 화이트리스트 \u003cb>지연발효 타이머가 자동으로 시작\u003c/b>되고, 타이머가 끝나기 전에는 승인할 수 없다.\n      \u003cspan class=\"trg\">\u003cb>생성 시점\u003c/b> — 서면 신청 접수(관리자 등록) 즉시\u003c/span>\n    \u003c/div>\n    \u003cdiv class=\"flow\">\n      \u003cspan class=\"st start\">대기 (지연발효 중)\u003c/span>\n      \u003cspan class=\"fa\">\u003cspan class=\"by sys\">타이머 만료\u003c/span>→\u003c/span>\n      \u003cspan class=\"st start\">대기 (승인 가능)\u003c/span>\n      \u003cspan class=\"fa\">\u003cspan class=\"by\">승인(사람)\u003c/span>→\u003c/span>\n      \u003cspan class=\"st mid\">집행 대기\u003c/span>\n      \u003cspan class=\"fa\">\u003cspan class=\"by sys\">서명·집행\u003c/span>→\u003c/span>\n      \u003cspan class=\"st end\">완료\u003c/span>\n    \u003c/div>\n    \u003cdiv class=\"flow\">\n      \u003cspan class=\"fa\">\u003cspan class=\"by\">거절(사유)\u003c/span>→\u003c/span>\n      \u003cspan class=\"st bad\">거절\u003c/span>\n      \u003cspan class=\"fa\">/\u003c/span>\n      \u003cspan class=\"fa\">\u003cspan class=\"by sys\">출금 시점 BLF 적중\u003c/span>→\u003c/span>\n      \u003cspan class=\"st bad\">차단\u003c/span>\n    \u003c/div>\n    \u003cdiv style=\"font-size:10.5px;color:#64748b;margin-top:4px;\">· 타이머 만료는 \u003cb>승인 버튼이 활성화되는 것뿐\u003c/b> — 자동 승인이 아니다 · 출금 실행 시점에 주소를 다시 검사해 제재 리스트에 적중하면 차단하고, STR 검토 아이템(T5 성격)을 새로 생성\u003c/div>\n  \u003c/div>\n\n  \u003c!-- T4 -->\n  \u003cdiv class=\"panel\">\n    \u003cdiv class=\"panel-title\">\u003cspan class=\"tno\">T4\u003c/span>입금 격리 \u003cspan class=\"scope\">대상: 입금 트랜잭션\u003c/span>\u003c/div>\n    \u003cdiv class=\"desc\">\n      입금을 상시 감시하다가 \u003cb>KYT 고위험\u003c/b> 또는 \u003cb>제재·블랙리스트 적중\u003c/b>이 감지되면, 해당 입금을 격리 지갑으로 자동 분리하고 \u003cb>고객 잔고에 반영하지 않은 채\u003c/b> 아이템을 생성한다. 제재 적중 건은 생성과 동시에 동결 상태로 들어온다.\n      \u003cspan class=\"trg\">\u003cb>생성 시점\u003c/b> — 입금 감시 룰 적중 즉시 (격리·잔고 미반영과 동시)\u003c/span>\n    \u003c/div>\n    \u003cdiv class=\"flow\">\n      \u003cspan class=\"st bad\">격리 중\u003c/span>\n      \u003cspan class=\"fa\">\u003cspan class=\"by\">소명 요청\u003c/span>→\u003c/span>\n      \u003cspan class=\"st mid\">소명 대기 (HOLD)\u003c/span>\n      \u003cspan class=\"fa\">\u003cspan class=\"by\">소명 인정\u003c/span>→\u003c/span>\n      \u003cspan class=\"st end\">해제 · 잔고 반영\u003c/span>\n    \u003c/div>\n    \u003cdiv class=\"flow\">\n      \u003cspan class=\"st mid\">소명 대기\u003c/span>\n      \u003cspan class=\"fa\">\u003cspan class=\"by\">불인정\u003c/span>→\u003c/span>\n      \u003cspan class=\"st bad\">동결 + STR 검토\u003c/span>\n    \u003c/div>\n    \u003cdiv style=\"font-size:10.5px;color:#64748b;margin-top:4px;\">· STR 검토 자체는 별도 AML 시스템에서 진행(작성자·보고자 분리) · 제재 적중 건의 법정 통지·보고 절차는 \u003cspan class=\"red\">[원문대조필요]\u003c/span> · 소명 시한과 시한 초과 시 기본 처리 미정\u003cspan class=\"need\">결정필요 ②\u003c/span>\u003c/div>\n  \u003c/div>\n\n  \u003c!-- T5 -->\n  \u003cdiv class=\"panel\">\n    \u003cdiv class=\"panel-title\">\u003cspan class=\"tno\">T5\u003c/span>이상거래 워닝 \u003cspan class=\"scope\">대상: 거래·게시 패턴\u003c/span>\u003c/div>\n    \u003cdiv class=\"desc\">\n      건 하나는 정상처럼 보여도 \u003cb>패턴이 수상한 경우\u003c/b>다. 연관 당사자끼리의 거래 매칭, 게시·취소의 반복, 사후 분석에서 발견된 이상 패턴 등이 룰에 걸리면 아이템이 생성된다. \u003cb>룰 적중은 자동이지만, 의심거래인지 판단은 사람이 한다.\u003c/b>\n      \u003cspan class=\"trg\">\u003cb>생성 시점\u003c/b> — 이상행위 룰 적중 즉시\u003c/span>\n    \u003c/div>\n    \u003cdiv class=\"flow\">\n      \u003cspan class=\"st start\">미처리\u003c/span>\n      \u003cspan class=\"fa\">\u003cspan class=\"by\">검토\u003c/span>→\u003c/span>\n      \u003cspan class=\"st mid\">검토중\u003c/span>\n      \u003cspan class=\"fa\">\u003cspan class=\"by\">STR 검토\u003c/span>→\u003c/span>\n      \u003cspan class=\"st bad\">STR 이관\u003c/span>\n      \u003cspan class=\"fa\">/\u003c/span>\n      \u003cspan class=\"fa\">\u003cspan class=\"by\">무혐의\u003c/span>→\u003c/span>\n      \u003cspan class=\"st end\">무혐의 종결\u003c/span>\n    \u003c/div>\n    \u003cdiv style=\"font-size:10.5px;color:#64748b;margin-top:4px;\">· STR 이관 시 필요하면 해당 기관 계정에 신규 거래 일시제한을 함께 적용(T7 경로) · 고객 화면에는 어떤 표시도 하지 않는다(\u003cb>STR 누설 금지\u003c/b>) — 처리 결과는 개별 거래의 상태로만 간접 반영\u003c/div>\n  \u003c/div>\n\n  \u003c!-- T6 -->\n  \u003cdiv class=\"panel\">\n    \u003cdiv class=\"panel-title\">\u003cspan class=\"tno\">T6\u003c/span>월렛·키 알람 \u003cspan class=\"scope\">대상: 지갑·키 이벤트\u003c/span>\u003c/div>\n    \u003cdiv class=\"desc\">\n      지갑·키 운영의 \u003cb>보안 이벤트\u003c/b>다. 콜드월렛에서 인가되지 않은 이체 시도가 감지되거나(High), 핫월렛 보유 비중이 임계값 20%를 넘거나(콜드로 옮기라는 스윕 워닝 — 임계값은 \u003cspan class=\"scr\" data-pid=\"ADM-03\">\u003cspan class=\"sid\">ADM-03\u003c/span>정책값\u003c/span>), 서명 시스템에 장애가 생기면 아이템이 생성된다.\n      \u003cspan class=\"trg\">\u003cb>생성 시점\u003c/b> — 감시 시스템 이벤트 감지 즉시\u003c/span>\n    \u003c/div>\n    \u003cdiv class=\"flow\">\n      \u003cspan class=\"st start\">미확인\u003c/span>\n      \u003cspan class=\"fa\">\u003cspan class=\"by\">확인(사람)\u003c/span>→\u003c/span>\n      \u003cspan class=\"st mid\">확인\u003c/span>\n      \u003cspan class=\"fa\">\u003cspan class=\"by\">조치완료\u003c/span>→\u003c/span>\n      \u003cspan class=\"st end\">조치완료\u003c/span>\n    \u003c/div>\n    \u003cdiv style=\"font-size:10.5px;color:#64748b;margin-top:4px;\">· 실제 조치(키 교체·콜드 이관 스윕·비상 대응)는 화면 밖 운영 절차로 수행 — 처리함에는 확인과 조치 결과만 기록\u003c/div>\n  \u003c/div>\n\n  \u003c!-- T7 -->\n  \u003cdiv class=\"panel\">\n    \u003cdiv class=\"panel-title\">\u003cspan class=\"tno\">T7\u003c/span>KYC 재이행 \u003cspan class=\"scope\">대상: 기관·가입자 계정\u003c/span>\u003c/div>\n    \u003cdiv class=\"desc\">\n      고객확인(KYC)은 위험등급별 주기(고위험 1년·중위험 2년·저위험 3년)로 \u003cb>다시 이행\u003c/b>해야 한다. 기한이 지나도록 고객이 응하지 않거나, 실소유자 변경 같은 이벤트로 수시 재이행이 필요해지면 아이템이 생성된다.\n      \u003cspan class=\"trg\">\u003cb>생성 시점\u003c/b> — 재이행 기한 초과·미응답 또는 이벤트 트리거 발생 시\u003c/span>\n    \u003c/div>\n    \u003cdiv class=\"flow\">\n      \u003cspan class=\"st start\">일시제한 예정\u003c/span>\n      \u003cspan class=\"fa\">\u003cspan class=\"by\">신규 거래 제한(사람)\u003c/span>→\u003c/span>\n      \u003cspan class=\"st bad\">제한 적용\u003c/span>\n      \u003cspan class=\"fa\">/\u003c/span>\n      \u003cspan class=\"fa\">\u003cspan class=\"by sys\">재이행 완료\u003c/span>→\u003c/span>\n      \u003cspan class=\"st end\">자동 종결\u003c/span>\n    \u003c/div>\n    \u003cdiv style=\"font-size:10.5px;color:#64748b;margin-top:4px;\">· '제한 적용' = 계정 상태를 활성→일시제한으로 변경(\u003cspan class=\"scr\" data-pid=\"ADM-03\">\u003cspan class=\"sid\">ADM-03\u003c/span>상태 기계\u003c/span> — 전 화면 접근 게이팅 G-3의 단일 출처) · 고객이 재이행을 완료하면 자동 종결 — \"종결은 사람\" 원칙의 \u003cb>유일한 예외로 둔 기획 가정\u003c/b>\u003cspan class=\"need\">결정필요 ③\u003c/span> · 일시제한→활성 복귀는 사람이 ADM-03에서 수행\u003c/div>\n  \u003c/div>\n\n  \u003c!-- T8 -->\n  \u003cdiv class=\"panel\">\n    \u003cdiv class=\"panel-title\">\u003cspan class=\"tno\">T8\u003c/span>계정 잠금 \u003cspan class=\"scope\">대상: 가입자 계정\u003c/span>\u003c/div>\n    \u003cdiv class=\"desc\">\n      \u003cb>로그인 5회 실패\u003c/b>로 계정이 자동 잠기거나(\u003cspan class=\"scr\" data-pid=\"AUTH-01\">\u003cspan class=\"sid\">AUTH-01\u003c/span>로그인\u003c/span>), 계정 탈취가 의심되는 정황이 감지되면 아이템이 생성된다. 탈취 의심 건은 High 등급으로 들어오고 세션 차단이 병행된다.\n      \u003cspan class=\"trg\">\u003cb>생성 시점\u003c/b> — 자동 잠금·탈취 의심 감지 즉시\u003c/span>\n    \u003c/div>\n    \u003cdiv class=\"flow\">\n      \u003cspan class=\"st bad\">잠금\u003c/span>\n      \u003cspan class=\"fa\">\u003cspan class=\"by\">본인확인 후 해제\u003c/span>→\u003c/span>\n      \u003cspan class=\"st end\">해제 · 활성 복귀\u003c/span>\n      \u003cspan class=\"fa\">/\u003c/span>\n      \u003cspan class=\"fa\">\u003cspan class=\"by\">탈취 의심 판단\u003c/span>→\u003c/span>\n      \u003cspan class=\"st bad\">동결 전환\u003c/span>\n    \u003c/div>\n    \u003cdiv style=\"font-size:10.5px;color:#64748b;margin-top:4px;\">· 동결로 전환하면 STR 검토 아이템(T5 성격)을 새로 생성 · 계정 상태 전이는 ADM-03 상태 기계를 따름\u003c/div>\n  \u003c/div>\n\n  \u003c!-- X3 + 귀속 -->\n  \u003cdiv class=\"panel\">\n    \u003cdiv class=\"panel-title\">\u003cspan class=\"tno\">＋\u003c/span>3면 대사 불일치 (X3) \u003cspan class=\"scope\">추가 유형 — 현 ADM-02 표에 예시 행 없음\u003c/span>\u003c/div>\n    \u003cdiv class=\"desc\">\n      내부 장부·온체인 잔고·콜드월렛 기록을 맞춰보는 대사 배치에서 \u003cb>세 값이 일치하지 않으면\u003c/b> 아이템이 생성되고, 동시에 해당 지갑의 \u003cb>출금이 자동 동결\u003c/b>된다. 원인이 규명되어 일치가 확인되기 전에는 재개할 수 없다.\n      \u003cspan class=\"trg\">\u003cb>생성 시점\u003c/b> — 대사 배치 불일치 감지 즉시 (출금 동결과 동시)\u003c/span>\n    \u003c/div>\n    \u003cdiv class=\"flow\">\n      \u003cspan class=\"st start\">미처리\u003c/span>\n      \u003cspan class=\"fa\">\u003cspan class=\"by\">규명 착수\u003c/span>→\u003c/span>\n      \u003cspan class=\"st mid\">원인 규명 중\u003c/span>\n      \u003cspan class=\"fa\">\u003cspan class=\"by\">일치 확인\u003c/span>→\u003c/span>\n      \u003cspan class=\"st end\">동결 해제 · 종결\u003c/span>\n    \u003c/div>\n    \u003cdiv style=\"font-size:10.5px;color:#64748b;margin-top:4px;\">· \u003cspan class=\"red\">ADM-02 처리함 행 유형 목록에 이 유형 추가 필요\u003c/span>\u003c/div>\n    \u003cdiv style=\"font-size:10.5px;color:#64748b;margin-top:6px;\">· \u003cb>제재·다크코인 적중\u003c/b>은 독립 유형으로 두지 않는다 — 입금에서 적중하면 T4(입금 격리), 출금에서 적중하면 T3(차단)로 각각 귀속 (기획 가정)\u003c/div>\n  \u003c/div>\n\n\u003c/div>\n\n\u003c!-- 상태값 총목록 -->\n\u003cdiv class=\"wide\">\n  \u003cdiv class=\"panel\">\n    \u003cdiv class=\"panel-title\">도메인 상태값 총목록 \u003cspan class=\"scope\">화면 '상태' 컬럼 표출값 · enum 후보\u003c/span>\u003c/div>\n    \u003ctable class=\"tbl\">\n      \u003cthead>\u003ctr>\u003cth style=\"width:120px;\">유형\u003c/th>\u003cth>생성 시\u003c/th>\u003cth>중간\u003c/th>\u003cth>종결\u003c/th>\u003c/tr>\u003c/thead>\n      \u003ctbody>\n        \u003ctr>\u003ctd>\u003cspan class=\"mono\">T1\u003c/span> 나목 승인\u003c/td>\u003ctd>\u003cspan class=\"st start\">승인 대기\u003c/span> \u003cspan class=\"st esc\">에스컬레이션\u003c/span>\u003c/td>\u003ctd>\u003cspan class=\"st mid\">보류\u003c/span> \u003cspan class=\"st mid\">집행 대기\u003c/span>\u003c/td>\u003ctd>\u003cspan class=\"st end\">완료\u003c/span> \u003cspan class=\"st bad\">거절\u003c/span>\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>\u003cspan class=\"mono\">T2\u003c/span> 마목 확인\u003c/td>\u003ctd>\u003cspan class=\"st start\">확인 대기\u003c/span> \u003cspan class=\"st esc\">에스컬레이션\u003c/span>\u003c/td>\u003ctd>\u003cspan class=\"st mid\">보류\u003c/span> \u003cspan class=\"st mid\">이전 진행\u003c/span>\u003c/td>\u003ctd>\u003cspan class=\"st end\">완료\u003c/span> \u003cspan class=\"st bad\">이전 중지\u003c/span>\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>\u003cspan class=\"mono\">T3\u003c/span> 출금·이전\u003c/td>\u003ctd>\u003cspan class=\"st start\">대기(지연발효 중)\u003c/span>\u003c/td>\u003ctd>\u003cspan class=\"st start\">대기(승인 가능)\u003c/span> \u003cspan class=\"st mid\">집행 대기\u003c/span>\u003c/td>\u003ctd>\u003cspan class=\"st end\">완료\u003c/span> \u003cspan class=\"st bad\">거절\u003c/span> \u003cspan class=\"st bad\">차단\u003c/span>\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>\u003cspan class=\"mono\">T4\u003c/span> 입금 격리\u003c/td>\u003ctd>\u003cspan class=\"st bad\">격리 중\u003c/span>\u003c/td>\u003ctd>\u003cspan class=\"st mid\">소명 대기\u003c/span>\u003c/td>\u003ctd>\u003cspan class=\"st end\">해제\u003c/span> \u003cspan class=\"st bad\">동결\u003c/span>\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>\u003cspan class=\"mono\">T5\u003c/span> 이상거래\u003c/td>\u003ctd>\u003cspan class=\"st start\">미처리\u003c/span>\u003c/td>\u003ctd>\u003cspan class=\"st mid\">검토중\u003c/span>\u003c/td>\u003ctd>\u003cspan class=\"st bad\">STR 이관\u003c/span> \u003cspan class=\"st end\">무혐의\u003c/span>\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>\u003cspan class=\"mono\">T6\u003c/span> 월렛·키\u003c/td>\u003ctd>\u003cspan class=\"st start\">미확인\u003c/span>\u003c/td>\u003ctd>\u003cspan class=\"st mid\">확인\u003c/span>\u003c/td>\u003ctd>\u003cspan class=\"st end\">조치완료\u003c/span>\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>\u003cspan class=\"mono\">T7\u003c/span> KYC 재이행\u003c/td>\u003ctd>\u003cspan class=\"st start\">일시제한 예정\u003c/span>\u003c/td>\u003ctd>—\u003c/td>\u003ctd>\u003cspan class=\"st bad\">제한 적용\u003c/span> \u003cspan class=\"st end\">자동 종결\u003c/span>\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>\u003cspan class=\"mono\">T8\u003c/span> 계정 잠금\u003c/td>\u003ctd>\u003cspan class=\"st bad\">잠금\u003c/span>\u003c/td>\u003ctd>—\u003c/td>\u003ctd>\u003cspan class=\"st end\">해제\u003c/span> \u003cspan class=\"st bad\">동결 전환\u003c/span>\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>\u003cspan class=\"mono\">X3\u003c/span> 3면 대사\u003c/td>\u003ctd>\u003cspan class=\"st start\">미처리\u003c/span>\u003c/td>\u003ctd>\u003cspan class=\"st mid\">원인 규명 중\u003c/span>\u003c/td>\u003ctd>\u003cspan class=\"st end\">해제·종결\u003c/span>\u003c/td>\u003c/tr>\n      \u003c/tbody>\n    \u003c/table>\n  \u003c/div>\n\u003c/div>\n\n\u003cdiv class=\"foot\">\n  \u003cb>[결정필요]\u003c/b> 아직 확정하지 않은 사항 — 확정 전까지 본 문서의 해당 부분은 기획 가정이다.\n  \u003col>\n    \u003cli>T2 거절(이전 중지) 건의 계약상 귀결 — 수락 시점에 구속력이 이미 발생한 거래를 DSRV가 중지했을 때 무산 처리·위약 여부 (약관·법무 확인)\u003c/li>\n    \u003cli>T4 입금 격리의 소명 시한과, 시한 초과 시 기본 처리 방향\u003c/li>\n    \u003cli>T7 재이행 완료 시 자동 종결 허용 여부 — 불허로 결정되면 관리자 '확인 후 종결' 버튼으로 변경\u003c/li>\n    \u003cli>High 등급 워닝이 방치될 때 상위 보고 룰 — N시간 미처리 시 통지 (야간·주말 확인 주체 \u003cspan class=\"red\">[확인필요]\u003c/span>와 연동)\u003c/li>\n    \u003cli>DB 스키마 개정 — 알람·워닝이 여러 테이블에 분산된 구 구조를 처리함 중심으로 통합(공통 아이템 테이블 + 유형별 상세 연결), 상태값(enum)은 본 문서 기준으로 갱신\u003c/li>\n    \u003cli>고객 화면 도메인 상태(고객 콘솔) 섹션 미작성 — 나목(요청됨·제시·진행중·완료·보류·거절·만료)·마목 게시(게재중·신청접수·확정·완료(유효기간 만료)·회수)·마목 신청(신청 접수·수락 대기·확정·이전 진행·완료·거절·만료·게시 회수)을 DASH-01 상태 칩과 함께 확정 필요 (BRK-07 상세에 초안)\u003c/li>\n  \u003c/ol>\n  \u003cdiv style=\"margin-top:8px;\">화면 박스(\u003cspan class=\"mono\">EXC-02\u003c/span> 등)를 클릭하면 해당 화면기획으로 이동한다.\u003c/div>\n\u003c/div>\n\n\u003cscript>\ndocument.querySelectorAll('.scr[data-pid]').forEach(el => {\n  el.addEventListener('click', () => {\n    window.parent.postMessage({ type: 'navigate', pageId: el.dataset.pid }, '*');\n  });\n});\n\u003c/script>\n\u003c/body>\n\u003c/html>\n";
function inlineDoc(name){
  let d=FILES[name];if(!d)return '';
  d=d.replace('\u003clink rel="stylesheet" href="screen.css">','\u003cstyle>'+CSS+'\u003c/style>');
  d=d.replace('\u003cscript src="screen.js">\u003c/script>','\u003cscript>'+JS+'\u003c/script>');
  return d;
}
const DOCS={};for(const k in FILES)DOCS[k]=inlineDoc(k);
const frame=document.getElementById('frame');
const main=document.getElementById('main');
const list=document.getElementById('sbList');
let currentPid=null,procMode=false;
NAV.forEach(it=>{
  if(it.group){const g=document.createElement('div');g.className='grp';g.textContent=it.group;list.appendChild(g);}
  const b=document.createElement('button');b.className='nav';b.dataset.pid=it.id;
  const nid=document.createElement('span');nid.className='nid';nid.textContent=it.id;
  const nm=document.createElement('span');nm.textContent=it.name;
  b.append(nid,nm);
  b.onclick=()=>showScreen(it.id);
  list.appendChild(b);
});
function setActive(sel){
  list.querySelectorAll('.nav').forEach(n=>n.classList.remove('active'));
  if(sel)sel.classList.add('active');
}
function showScreen(pid){
  const it=NAV.find(x=>x.id===pid);if(!it)return;
  currentPid=pid;procMode=false;
  main.classList.remove('proc-mode');frame.style.height='200px';
  frame.srcdoc=DOCS[it.file];
  setActive(list.querySelector('.nav[data-pid="'+pid+'"]'));
  main.scrollTop=0;
}
function showDoc(doc,btn){
  procMode=true;main.classList.add('proc-mode');frame.style.height='';
  frame.srcdoc=doc;
  setActive(btn);
}
const procBtn=list.querySelector('.nav[data-proc]');
const iaBtn=list.querySelector('.nav[data-ia]');
const glossBtn=list.querySelector('.nav[data-gloss]');
const statesBtn=list.querySelector('.nav[data-states]');
procBtn.onclick=()=>showDoc(PROC,procBtn);
iaBtn.onclick=()=>showDoc(IA,iaBtn);
glossBtn.onclick=()=>showDoc(GLOSS,glossBtn);
statesBtn.onclick=()=>showDoc(STATES,statesBtn);
frame.addEventListener('load',()=>{
  if(procMode&&frame.contentWindow){
    frame.contentWindow.postMessage({type:'screenDocs',docs:DOCS},'*');
    if(currentPid)frame.contentWindow.postMessage({type:'highlightPage',pid:currentPid},'*');
  }
});
window.addEventListener('message',e=>{
  if(!e.data)return;
  if(e.data.type==='iframeHeight'&&!procMode&&e.data.h>50){frame.style.height=e.data.h+'px';}
  if(e.data.type==='navigate'&&e.data.pageId){showScreen(e.data.pageId);}
});
showScreen('ONB-00');
</script>
