-idx=\"1\">\n        \u003cdiv class=\"zone-highlight\">\u003c/div>\n        \u003cdiv class=\"item-area\" data-highlight=\"1\" style=\"position:relative;padding:6px;border-radius:8px;\">\n          \u003cdiv class=\"pin\" data-idx=\"1\" style=\"top:-4px;right:-4px;\">2\u003c/div>\n          \u003cdiv class=\"zone-title\">게시 조건으로 신청\u003c/div>\n          \u003cdiv class=\"kv\">\u003cspan class=\"k\">신청 시점\u003c/span>\u003cspan class=\"v\">2026-09-01 09:12\u003c/span>\u003c/div>\n          \u003cdiv class=\"kv\">\u003cspan class=\"k\">내 중개 수수료 (거래액 1% 고정)\u003c/span>\u003cspan class=\"v\">4,990 USDC — 수락(확정) 시 발생\u003c/span>\u003c/div>\n          \u003cdiv style=\"display:flex;gap:8px;margin-top:8px;\">\u003cdiv class=\"btn primary\" style=\"flex:1;\">이 조건으로 신청\u003c/div>\u003cdiv class=\"btn ghost\" style=\"flex:.5;\">취소\u003c/div>\u003c/div>\n          \u003cdiv style=\"font-size:10px;color:#64748b;margin-top:6px;\">신청은 \u003cstrong>영업일 기준 2일간 유지\u003c/strong>됩니다 — 게시자가 기한 내 수락하면 \u003cstrong>즉시 확정되어 바로 이전(정산)으로 진행\u003c/strong>되고, 무응답 시 자동 만료됩니다. 신청 접수는 게시자에게 이메일로 통지되며, 수락·거절 결과도 이메일·거래 내역으로 통지됩니다\u003c/div>\n        \u003c/div>\n      \u003c/div>\n\n      \u003cdiv class=\"zone\" data-idx=\"2,3\">\n        \u003cdiv class=\"zone-highlight\">\u003c/div>\n        \u003cdiv class=\"item-area\" data-highlight=\"2\" style=\"position:relative;padding:6px;border-radius:8px;\">\n          \u003cdiv class=\"pin\" data-idx=\"2\" style=\"top:-4px;right:-4px;\">3\u003c/div>\n          \u003cdiv class=\"pin\" data-idx=\"3\" style=\"top:-4px;right:22px;\">4\u003c/div>\n          \u003cdiv class=\"note-inline reg\">DSRV는 가격 협의에 참여하지 않으며 신청·수락 기록만 보존합니다. 게시자 수락 전까지 구속력이 없으며, 수락 시 즉시 확정됩니다.\u003c/div>\n        \u003c/div>\n      \u003c/div>\n\n    \u003c/div>\n  \u003c/div>\n\n  \u003csvg id=\"connSvg\" style=\"position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:10;overflow:visible;\">\u003c/svg>\n\n  \u003cdiv class=\"items\" id=\"items\">\n    \u003cdiv class=\"nav-global\">\n      \u003cdiv class=\"nav-global-title\">진입 · 전역 이동\u003c/div>\n      \u003cdiv class=\"nav-row\">\u003cspan class=\"nav-el\">상단 GNB(전 화면 공통)\u003c/span>\u003cspan class=\"nav-act\">대시보드/교환하기/교환게시판 메뉴 · 로고 클릭 — 목업에는 상단 요약만 표시\u003c/span>\u003cspan class=\"nav-to\">\u003cstrong>DASH-01 / EXC-01 / BRK-01\u003c/strong> (규칙: DASH-01 항목 5) · 신청 전 이탈 시 아무 효력 없음\u003c/span>\u003c/div>\n      \u003cdiv class=\"nav-note\">· \u003cstrong>진입\u003c/strong>: 교환 게시판(BRK-01)의 거래의향 행(타사 게시) 클릭\u003cbr>\n      · 이 화면은 신청자 측 전용 — 수락·거절 버튼 없음(게시자의 BRK-04에서 수행) · 조건 수정 입력란 없음(역제안 없음, 게시 조건 그대로만)\u003cbr>\n      · 신청 후 진행 상태 확인 동선: 내 신청 상세(BRK-07, 2026-09-02 신설) — 대시보드(DASH-01) 마목 신청 행에서도 진입\u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"itm\" data-idx=\"0\">\n      \u003cdiv class=\"num\">1\u003c/div>\n      \u003cdiv>\n        \u003cdiv class=\"itm-title\">교환거래 요청 내역 — 공통 포맷\u003cspan class=\"req\">필수\u003c/span>\u003c/div>\n        \u003cdiv class=\"itm-desc\">· '상대방 요청'과 '신청 조건'은 동일 내용(게시 조건 그대로 신청)이므로 \u003cstrong>하나의 폼\u003c/strong>으로 표시\u003cbr>· 포맷·필드 순서 = EXC-03·04 '교환거래 요청 내역'과 동일(공통 포맷 — 적용 범위는 상세 참조)\u003cbr>· 방향·수량은 게시자 기준, 게시 시점 = 요청 일시로 폼에 포함\u003cbr>· 상대 상호는 수락(확정) 전 첫 글자만 노출(나머지 마스킹)\u003cbr>\u003cspan class=\"basis\">근거 F-1b · L6 설명의무 · 공통 포맷\u003c/span>\u003c/div>\n      \u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"itm\" data-idx=\"1\">\n      \u003cdiv class=\"num\">2\u003c/div>\n      \u003cdiv>\n        \u003cdiv class=\"itm-title\">게시 조건 그대로 신청 (역제안 없음)\u003cspan class=\"req\">필수\u003c/span>\u003c/div>\n        \u003cdiv class=\"itm-desc\">· 게시된 조건을 변경 없이 신청 — 흥정·역제안 없음\u003cbr>· \u003cstrong>요청 일시(게시)·신청 시점 병기\u003c/strong> — 두 시점 사이 시세 변동 판단은 당사자 몫(DSRV 가격 불관여 유지)\u003cbr>· 신청 유효기간 \u003cstrong>영업일 기준 2일\u003c/strong>: 게시자가 기한 내 수락(BRK-04)하면 \u003cstrong>즉시 확정 → 이전·완료(BRK-05)\u003c/strong>, 무응답 시 자동 만료\u003cbr>· 신청 = \u003cstrong>가입자 단독 실행\u003c/strong>(기관당 가입자 1명, ADM-03) — 수락 시 즉시 구속력이 발생하는 청약임을 신청 전 확인 문구로 고지\u003cbr>· 이 화면은 \u003cstrong>신청자 측 전용\u003c/strong> — 게시자의 수락·거절은 BRK-04(게시자 화면)에서 수행 · 신청 후 진행은 BRK-07(내 신청 상세)\u003cbr>· \u003cstrong>내 중개 수수료(거래액 1% 고정 · 내가 보내는 499,000 USDC의 1% = 4,990 USDC)\u003c/strong>를 신청 전 고지 — 구속력 발생 전 설명의무(4요소④), 상대측 금액 미노출\u003cbr>\u003cspan class=\"basis\">근거 F-1b · V2(통신중개 아님) · F-4 · 1기관 1가입자(ADM-03)\u003c/span>\u003c/div>\n        \u003cdiv class=\"itm-nav\">\u003cspan class=\"nav-tag\">화면 이동 · 인터랙션\u003c/span>\n          \u003cdiv class=\"nav-row\">\u003cspan class=\"nav-el\">[이 조건으로 신청] 버튼\u003c/span>\u003cspan class=\"nav-act\">클릭 — 확인 문구(수락 시 즉시 구속력 발생하는 청약임) 고지 후 접수 · 가입자 단독 실행 · 유효 영업일 2일\u003c/span>\u003cspan class=\"nav-to\">신청 접수 → \u003cstrong>내 신청 상세(BRK-07)\u003c/strong> 진입(2026-09-02 변경 — 종전 BRK-01 복귀 폐기) · 게시자에게 이메일 알림 ① 발송 · 이후 수락/거절/만료/회수 결과는 이메일·BRK-07·거래 내역으로 통지\u003c/span>\u003c/div>\n          \u003cdiv class=\"nav-row\">\u003cspan class=\"nav-el\">[취소] 버튼\u003c/span>\u003cspan class=\"nav-act\">클릭 — 아무 효력 없음(확인 문구 없음 · 공통 UI 규격)\u003c/span>\u003cspan class=\"nav-to\">\u003cstrong>교환 게시판(BRK-01)\u003c/strong> 복귀\u003c/span>\u003c/div>\n        \u003c/div>\n      \u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"itm\" data-idx=\"2\">\n      \u003cdiv class=\"num\">3\u003c/div>\n      \u003cdiv>\n        \u003cdiv class=\"itm-title\">\"DSRV 비참여·기록만\" 고지\u003cspan class=\"req\">필수\u003c/span>\u003c/div>\n        \u003cdiv class=\"itm-desc\">· 가격 불관여·당사자성 방어 문구 상시 노출\u003cbr>\u003cspan class=\"basis\">근거 V2 · PRD 하지않는행위 · [로펌게이트] 비참여 범위\u003c/span>\u003c/div>\n      \u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"itm\" data-idx=\"3\">\n      \u003cdiv class=\"num\">4\u003c/div>\n      \u003cdiv>\n        \u003cdiv class=\"itm-title\">신청·수락 기록 보존·자동체결 부재\u003cspan class=\"req\">필수\u003c/span>\u003c/div>\n        \u003cdiv class=\"itm-desc\">· 수락 전 구속력 없음 표시(수락 = 확정)\u003cbr>· 신청·수락 기록 15년 보존, 자동 매칭·체결 없음(수락은 게시자의 능동 행위)\u003cbr>· 신청 접수 시 게시자 등록 이메일로 알림 발송 — 내용·공통 원칙은 상세 참조\u003cbr>\u003cspan class=\"basis\">근거 L6 §9 · V2(시장개설 아님)\u003c/span>\u003c/div>\n      \u003c/div>\n    \u003c/div>\n  \u003c/div>\n\n\u003c/div>\n\n\u003csection class=\"footer-note\" style=\"padding-bottom:0;\">\n  \u003cdiv class=\"note-card\">\n    \u003cdiv class=\"note-title\">상세내용\u003c/div>\n    \u003cdiv class=\"detail-grid\" id=\"detailCol\">\n      \u003cdiv class=\"dtl\" data-idx=\"0\">\n        \u003cdiv class=\"detail-label\">\u003cspan class=\"dtl-num\">1\u003c/span>공통 포맷 적용 범위\u003c/div>\n      \u003cdiv class=\"dtl-body\">\u003cspan class=\"box\">· 상세형(kv 폼): EXC-03·EXC-04(나목) · BRK-03·04·05(마목) · ADM-02 처리함 선택 건(관리자) — 모두 같은 필드 순서\u003cbr>· 목록형(표): DASH-01·BRK-01 — 교환코인(방향)·보내는 수량·받는 수량·비율 동일 순서\u003cbr>· 비율 표기는 \u003cstrong>{받는코인}/{주는코인}\u003c/strong>(notation 규칙)\u003c/span>\u003c/div>\n      \u003c/div>\n      \u003cdiv class=\"dtl\" data-idx=\"1\">\n        \u003cdiv class=\"detail-label\">\u003cspan class=\"dtl-num\">2\u003c/span>신청·수락 흐름\u003c/div>\n      \u003cdiv class=\"dtl-body\">\u003cspan class=\"box\">· 이메일 통지 4종: 신청 접수(게시자) / 수락·확정(양측) / 거래 완료(양측) / 게시 회수(대기 중 신청자 — BRK-06 상세)\u003cbr>· 게시 자체 유효기간은 기본 30일(BRK-02) — 게시 만료 시 미처리 신청도 함께 종결(기획 가정)\u003cbr>· 복수 신청 처리 방식은 BRK-04 참조 [확인필요: 선착순 vs 게시자 선택]\u003cbr>· 상대 상호 마스킹(B***)은 수락(확정) 시 해제 — 트래블룰·정산에 상대 확인 필요\u003c/span>\u003c/div>\n      \u003c/div>\n      \u003cdiv class=\"dtl\" data-idx=\"2\">\n        \u003cdiv class=\"detail-label\">\u003cspan class=\"dtl-num\">3\u003c/span>비참여 범위 [로펌게이트]\u003c/div>\n      \u003cdiv class=\"dtl-body\">\u003cspan class=\"box\">· '기록만' vs '관찰' 범위의 UI 반영 한계 확정 필요(09 §8)\u003cbr>· DSRV는 가격 제시·중재·호가 제공 안 함\u003cbr>· 채널 내 DSRV 개입 로그는 감사 대상\u003c/span>\u003c/div>\n      \u003c/div>\n      \u003cdiv class=\"dtl\" data-idx=\"3\">\n        \u003cdiv class=\"detail-label\">\u003cspan class=\"dtl-num\">4\u003c/span>이메일 알림 ① 신청 접수 (수신: 게시자) · 공통 원칙\u003c/div>\n      \u003cdiv class=\"dtl-body\">\u003cspan class=\"box\">· \u003cstrong>공통 원칙(4종 메일)\u003c/strong>: 발신전용(no-reply) · 본문에 로그인 링크·버튼 미포함(피싱 방지 — 콘솔 직접 접속 안내) · 상호 마스킹은 화면과 동일(수락 전 A***/B***) · 심사·AML 관련 내용 미포함(STR 누설 금지) · 수신 = 법인 담당자 등록 이메일 \u003cspan class=\"red\">[확인필요: 수신 범위(담당자 단일/복수)]\u003c/span>\u003cbr>· \u003cstrong>제목\u003c/strong>: [DSRV] 교환 게시에 새 신청 도착 — BRK-20260830-0027\u003cbr>· \u003cstrong>본문\u003c/strong>: \"회원님의 교환 게시에 새로운 신청이 접수되었습니다.\" + 요청번호 · 교환쌍·방향(USDT → USDC) · 보내는/받는 수량(게시 조건 그대로) · 신청자 A***(KYC 완료·거래 안전성 검증 ✓) · 신청 일시 · \u003cstrong>수락 기한 2026-09-03 09:12 (영업일 2일, 경과 시 자동 만료)\u003c/strong> + \"수락·거절은 DSRV Desk > 교환게시판 > 내 게시 > 받은 신청에서 처리해 주세요.\"\u003cbr>· 수락·확정 메일(②)은 BRK-04, 거래 완료 메일(③)은 BRK-05 상세 참조\u003c/span>\u003c/div>\n      \u003c/div>\n    \u003c/div>\n  \u003c/div>\n\u003c/section>\n\n\u003csection class=\"footer-note\">\n  \u003cdiv class=\"note-card\">\n    \u003cdiv class=\"note-title\">비고\u003c/div>\n    \u003cdiv class=\"note-body\">\n      · 기존 RFQ에 거래를 거는 단계. \u003cstrong>[방어 핵심]\u003c/strong> DSRV는 \u003cstrong>가격에 관여하지 않고 기록만\u003c/strong> 보존(당사자성 방어) — 자유 메시지 채널·역제안 없음(통신중개·개입 논란 차단). \"가격 결정 = 당사자, 외부지표 = 중지 판단 기준\"을 화면 문구로 일관 유지.\u003cbr>\n      · 시세변동 중지 상태 표시 없음 — 중지된 RFQ는 게시판(BRK-01)에서 즉시 제외되어 이 화면 진입 자체가 불가.\u003cbr>\n      · 신청은 수락 전까지 구속력 없음 — 구속력·수수료(거래액 1% 고정, 각자 보내는 자산 기준)는 게시자 수락(BRK-04) 완료 시 발생.\u003cbr>\n      · 다음: (신청자) 내 신청 상세 (BRK-07) / (게시자) 받은 신청·수락 (BRK-04)\n    \u003c/div>\n  \u003c/div>\n\u003c/section>\n\n\u003cscript src=\"screen.js\">\u003c/script>\n\u003c/body>\n\u003c/html>\n", "brk-07.html": "\u003c!DOCTYPE html>\n\u003chtml lang=\"ko\">\n\u003chead>\n\u003cmeta charset=\"UTF-8\">\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n\u003ctitle>화면기획 — 내 신청 상세\u003c/title>\n\u003clink rel=\"stylesheet\" href=\"screen.css\">\n\u003c/head>\n\u003cbody>\n\n\u003cheader class=\"header\">\n  \u003cdiv class=\"crumb\">\u003cspan>마목 중개\u003c/span>\u003cspan class=\"s\">›\u003c/span>\u003cspan>교환게시판\u003c/span>\u003cspan class=\"s\">›\u003c/span>\u003cspan>내 신청\u003c/span>\u003c/div>\n  \u003ch1 class=\"title\">내 신청 상세\u003c/h1>\n  \u003cspan class=\"sid\">BRK-07\u003c/span>\n  \u003cspan class=\"defense\">신청자 측 진행 조회 · DSRV 비참여\u003c/span>\n\u003c/header>\n\n\u003cdiv class=\"main\">\n  \u003cdiv class=\"screen-panel\">\n    \u003cdiv style=\"position:relative;display:flex;\">\n      \u003cdiv class=\"labels\" id=\"labels\">\n        \u003cdiv class=\"lbl\">\u003cspan class=\"lbl-text\">전역\u003c/span>\u003c/div>\n        \u003cdiv class=\"lbl\">\u003cspan class=\"lbl-text\">요청 내역\u003c/span>\u003c/div>\n        \u003cdiv class=\"lbl\">\u003cspan class=\"lbl-text\">진행 상태\u003c/span>\u003c/div>\n        \u003cdiv class=\"lbl\">\u003cspan class=\"lbl-text\">안내\u003c/span>\u003c/div>\n        \u003cdiv class=\"lbl\">\u003cspan class=\"lbl-text\">비참여 고지\u003c/span>\u003c/div>\n      \u003c/div>\n      \u003csvg id=\"bracketSvg\" width=\"24\" style=\"flex-shrink:0;overflow:visible;\">\u003c/svg>\n    \u003c/div>\n\n    \u003cdiv class=\"frame\" id=\"frame\">\n      \u003cdiv class=\"zone\" data-idx=\"\">\n        \u003cdiv class=\"zone-highlight\">\u003c/div>\n        \u003cdiv class=\"c-top\" style=\"border-radius:8px;\">\n          \u003cspan class=\"brand\">DSRV Desk\u003c/span>\n          \u003cspan class=\"meta\">\u003cspan class=\"c-badge\">A자산운용 (신청자)\u003c/span>\u003c/span>\n        \u003c/div>\n      \u003c/div>\n\n      \u003cdiv class=\"zone\" data-idx=\"0\">\n        \u003cdiv class=\"zone-highlight\">\u003c/div>\n        \u003cdiv class=\"item-area\" data-highlight=\"0\" style=\"position:relative;padding:6px;border-radius:8px;\">\n          \u003cdiv class=\"pin\" data-idx=\"0\" style=\"top:-4px;right:-4px;\">1\u003c/div>\n          \u003cdiv class=\"zone-title\">교환거래 요청 내역\u003c/div>\n          \u003cdiv class=\"kv\">\u003cspan class=\"k\">요청번호\u003c/span>\u003cspan class=\"v\">BRK-20260830-0027\u003c/span>\u003c/div>\n          \u003cdiv class=\"kv\">\u003cspan class=\"k\">교환쌍 · 방향\u003c/span>\u003cspan class=\"v\">USDT → USDC\u003c/span>\u003c/div>\n          \u003cdiv c class=\"nav-act\">조회 전용 — 상태는 게시자 행위(수락·거절·회수)·기한 경과로만 갱신\u003c/span>\u003cspan class=\"nav-to stay\">화면 내 상태 갱신\u003c/span>\u003c/div>\n          \u003cdiv class=\"nav-row\">\u003cspan class=\"nav-el\">상태 '확정' 이후 진입\u003c/span>\u003cspan class=\"nav-act\">게시자 수락(확정) 뒤 이 화면을 열면 — 상태 행에 '확정' + 이동 링크\u003c/span>\u003cspan class=\"nav-to\">\u003cstrong>이전·완료(BRK-05)\u003c/strong> 이동 링크 표시 (대시보드 확정·완료 행은 BRK-05로 직행)\u003c/span>\u003c/div>\n        \u003c/div>\n      \u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"itm\" data-idx=\"2\">\n      \u003cdiv class=\"num\">3\u003c/div>\n      \u003cdiv>\n        \u003cdiv class=\"itm-title\">조회 전용 — 취소 없음 · 결과 통지 안내\u003cspan class=\"req\">필수\u003c/span>\u003c/div>\n        \u003cdiv class=\"itm-desc\">· 이 화면에는 \u003cstrong>액션 버튼 없음\u003c/strong> — 신청은 수락 시 즉시 구속력이 생기는 청약이므로 신청 후 취소 기능을 두지 않음(기획 가정 · 상세 참조)\u003cbr>· 결과(수락·거절·만료·회수)는 이메일 ②/④·이 화면 상태·대시보드 거래 내역으로 통지\u003cbr>\u003cspan class=\"basis\">근거 V2(통신중개 아님 — 신청 후 협의 채널 없음) · [확인필요] 신청 취소 허용 여부\u003c/span>\u003c/div>\n        \u003cdiv class=\"itm-nav\">\u003cspan class=\"nav-tag\">화면 이동 · 인터랙션\u003c/span>\n          \u003cdiv class=\"nav-row\">\u003cspan class=\"nav-el\">(취소 버튼 없음)\u003c/span>\u003cspan class=\"nav-act\">신청 후 취소 기능 미제공(기획 가정 · 상세 3 참조) — 종결은 거절·만료·게시 회수로만\u003c/span>\u003cspan class=\"nav-to stay\">화면 내 (이동 없음)\u003c/span>\u003c/div>\n        \u003c/div>\n      \u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"itm\" data-idx=\"3\">\n      \u003cdiv class=\"num\">4\u003c/div>\n      \u003cdiv>\n        \u003cdiv class=\"itm-title\">\"DSRV 비참여·기록만\" 고지\u003cspan class=\"req\">필수\u003c/span>\u003c/div>\n        \u003cdiv class=\"itm-desc\">· 가격 불관여·당사자성 방어 문구 상시 노출(BRK-03과 동일 문구)\u003cbr>· 신청·수락 기록 15년 보존\u003cbr>\u003cspan class=\"basis\">근거 V2 · PRD 하지않는행위 · [로펌게이트] 비참여 범위\u003c/span>\u003c/div>\n      \u003c/div>\n    \u003c/div>\n  \u003c/div>\n\n\u003c/div>\n\n\u003csection class=\"footer-note\" style=\"padding-bottom:0;\">\n  \u003cdiv class=\"note-card\">\n    \u003cdiv class=\"note-title\">상세내용\u003c/div>\n    \u003cdiv class=\"detail-grid\" id=\"detailCol\">\n      \u003cdiv class=\"dtl\" data-idx=\"0\">\n        \u003cdiv class=\"detail-label\">\u003cspan class=\"dtl-num\">1\u003c/span>신청자 화면 3종의 역할\u003c/div>\n      \u003cdiv class=\"dtl-body\">\u003cspan class=\"box\">· BRK-03 신청하기(행위) → \u003cstrong>BRK-07 내 신청 상세\u003c/strong>(진행 조회) → BRK-05 이전·완료(확정 후, 양측 공용)\u003cbr>· 게시자 측 대칭 화면: BRK-06 내 게시 상세 ↔ BRK-04 받은 신청·수락\u003cbr>· 신청 접수 직후 BRK-01 복귀가 아니라 이 화면으로 진입(2026-09-02 변경) — 접수 확인·기한 안내를 한 번에\u003c/span>\u003c/div>\n      \u003c/div>\n      \u003cdiv class=\"dtl\" data-idx=\"1\">\n        \u003cdiv class=\"detail-label\">\u003cspan class=\"dtl-num\">2\u003c/span>신청 상태값(신청자 도메인) · 대시보드 매핑\u003c/div>\n      \u003cdiv class=\"dtl-body\">\u003cspan class=\"box\">· 신청 접수(APPLIED) → 수락 대기(PENDING_ACCEPT) → 확정(CONFIRMED) → 이전 진행(TRANSFERRING) → 완료(COMPLETED) / 종결: 거절(REJECTED) · 만료(EXPIRED) · 게시 회수(WITHDRAWN_BY_POSTER)\u003cbr>· DASH-01 거래 목록 상태 칩 매핑: 수락 대기 → '승인 대기' 계열, 확정·이전 진행 → '진행중', 완료 → '완료', 종결 3종 → '종결' \u003cspan class=\"red\">[확인필요: 고객 화면 상태 enum 확정 — states.html 고객 도메인 섹션 미작성]\u003c/span>\u003cbr>· 상태 전이는 전부 게시자 행위(수락·거절·회수) 또는 기한 경과 — DSRV·시스템이 신청을 매칭·정리하지 않음\u003c/span>\u003c/div>\n      \u003c/div>\n      \u003cdiv class=\"dtl\" data-idx=\"2\">\n        \u003cdiv class=\"detail-label\">\u003cspan class=\"dtl-num\">3\u003c/span>신청 취소 미제공 근거 (기획 가정)\u003c/div>\n      \u003cdiv class=\"dtl-body\">\u003cspan class=\"box\">· 유효기간이 영업일 2일로 짧아 취소 없이 만료로 정리 가능\u003cbr>· 취소를 허용하면 신청·취소 반복(게시자 탐색·가격 신호)이 협의 채널처럼 작동할 소지 — 통신중개 오인 차단\u003cbr>· 허용으로 결정되면: [신청 취소] 버튼(수락 대기 상태에서만) + 게시자 이메일 통지 + 이상거래 룰(반복 취소) 추가\u003c/span>\u003c/div>\n      \u003c/div>\n    \u003c/div>\n  \u003c/div>\n\u003c/section>\n\n\u003csection class=\"footer-note\">\n  \u003cdiv class=\"note-card\">\n    \u003cdiv class=\"note-title\">비고\u003c/div>\n    \u003cdiv class=\"note-body\">\n      · 2026-09-02 신설 — 종전에는 신청 후 신청자가 자기 건을 볼 화면이 없어 대시보드 목록 [확인필요]로만 남아 있었음.\u003cbr>\n      · \u003cstrong>[방어 핵심]\u003c/strong> 조회 전용 + 협의·역제안·취소 채널 없음 — 신청 후에는 게시자의 수락/거절과 기한 경과만 존재(통신중개 아님). 수수료는 확정 전 자기 측 금액으로 사전 고지(설명의무).\u003cbr>\n      · \u003cspan style=\"color:#991b1b;\">[확인필요]\u003c/span> 신청 취소 허용 여부 · 고객 화면 상태 enum(states.html 고객 도메인 섹션).\u003cbr>\n      · 다음: 확정 시 이전·완료 (BRK-05, 양측 공용) / 거절·만료·회수 시 종결(대시보드 거래 내역에 잔존)\n    \u003c/div>\n  \u003c/div>\n\u003c/section>\n\n\u003cscript src=\"screen.js\">\u003c/script>\n\u003c/body>\n\u003c/html>\n", "brk-04.html": "\u003c!DOCTYPE html>\n\u003chtml lang=\"ko\">\n\u003chead>\n\u003cmeta charset=\"UTF-8\">\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n\u003ctitle>화면기획 — 받은 신청·수락\u003c/title>\n\u003clink rel=\"stylesheet\" href=\"screen.css\">\n\u003c/head>\n\u003cbody>\n\n\u003cheader class=\"header\">\n  \u003cdiv class=\"crumb\">\u003cspan>마목 중개\u003c/span>\u003cspan class=\"s\">›\u003c/span>\u003cspan>교환게시판\u003c/span>\u003cspan class=\"s\">›\u003c/span>\u003cspan>내 게시\u003c/span>\u003cspan class=\"s\">›\u003c/span>\u003cspan>받은 신청·수락\u003c/span>\u003c/div>\n  \u003ch1 class=\"title\">받은 신청·수락\u003c/h1>\n  \u003cspan class=\"sid\">BRK-04\u003c/span>\n  \u003cspan class=\"defense\">수락 = 즉시 확정 · 게시자 능동 행위 · 자동 매칭 없음\u003c/span>\n\u003c/header>\n\n\u003cdiv class=\"main\">\n  \u003cdiv class=\"screen-panel\">\n    \u003cdiv style=\"position:relative;display:flex;\">\n      \u003cdiv class=\"labels\" id=\"labels\">\n        \u003cdiv class=\"lbl\">\u003cspan class=\"lbl-text\">전역\u003c/span>\u003c/div>\n        \u003cdiv class=\"lbl\">\u003cspan class=\"lbl-text\">내 게시 내역\u003c/span>\u003c/div>\n        \u003cdiv class=\"lbl\">\u003cspan class=\"lbl-text\">받은 신청\u003c/span>\u003c/div>\n        \u003cdiv class=\"lbl\">\u003cspan class=\"lbl-text\">수락·거절\u003c/span>\u003c/div>\n        \u003cdiv class=\"lbl\">\u003cspan class=\"lbl-text\">비참여 고지\u003c/span>\u003c/div>\n      \u003c/div>\n      \u003csvg id=\"bracketSvg\" width=\"24\" style=\"flex-shrink:0;overflow:visible;\">\u003c/svg>\n    \u003c/div>\n\n    \u003cdiv class=\"frame\" id=\"frame\">\n      \u003cdiv class=\"zone\" data-idx=\"\">\n        \u003cdiv class=\"zone-highlight\">\u003c/div>\n        \u003cdiv class=\"c-top\" style=\"border-radius:8px;\">\n          \u003cspan class=\"brand\">DSRV Desk\u003c/span>\n          \u003cspan class=\"meta\">\u003cspan class=\"c-badge\">B사 (게시자)\u003c/span>\u003c/span>\n        \u003c/div>\n      \u003c/div>\n\n      \u003cdiv class=\"zone\" data-idx=\"0\">\n        \u003cdiv class=\"zone-highlight\">\u003c/div>\n        \u003cdiv class=\"item-area\" data-highlight=\"0\" style=\"position:relative;padding:6px;border-radius:8px;\">\n          \u003cdiv class=\"pin\" data-idx=\"0\" style=\"top:-4px;right:-4px;\">1\u003c/div>\n          \u003cdiv class=\"zone-title\">내 게시 — 교환거래 요청 내역\u003c/div>\n          \u003cdiv class=\"kv\">\u003cspan class=\"k\">요청번호\u003c/span>\u003cspan class=\"v\">BRK-20260830-0027\u003c/span>\u003c/div>\n          \u003cdiv class=\"kv\">\u003cspan class=\"k\">교환쌍 · 방향\u003c/span>\u003cspan class=\"v\">USDT → USDC\u003c/span>\u003c/div>\n          \u003cdiv class=\"kv\">\u003cspan class=\"k\">보내는 수량\u003c/span>\u003cspan class=\"v\">500,000 USDT\u003c/span>\u003c/div>\n          \u003cdiv class=\"kv\">\u003cspan class=\"k\">받는 수량\u003c/span>\u003cspan class=\"v\">499,000 USDC\u003c/span>\u003c/div>\n          \u003cdiv class=\"kv\">\u003cspan class=\"k\">비율\u003c/span>\u003cspan class=\"v\">0.9980 USDC/USDT\u003c/span>\u003c/div>\n          \u003cdiv class=\"kv\">\u003cspan class=\"k\">요청 일시 (게시)\u003c/span>\u003cspan class=\"v\">2026-08-30 14:20\u003c/span>\u003c/div>\n          \u003cdiv class=\"kv\">\u003cspan class=\"k\">게시 유효기한\u003c/span>\u003cspan class=\"v\">2026-09-29 14:20까지 (30일)\u003c/span>\u003c/div>\n          \u003cdiv class=\"kv\">\u003cspan class=\"k\">상태\u003c/span>\u003cspan class=\"v\">게재중 · 받은 신청 1건\u003c/span>\u003c/div>\n        \u003c/div>\n      \u003c/div>\n\n      \u003cdiv class=\"zone\" data-idx=\"1\">\n        \u003cdiv class=\"zone-highlight\">\u003c/div>\n        \u003cdiv class=\"item-area\" data-highlight=\"1\" style=\"position:relative;padding:6px;border-radius:8px;\">\n          \u003cdiv class=\"pin\" data-idx=\"1\" style=\"top:-4px;right:-4px;\">2\u003c/div>\n          \u003cdiv class=\"zone-title\">받은 신청\u003c/div>\n          \u003cdiv class=\"kv\">\u003cspan class=\"k\">신청자\u003c/span>\u003cspan class=\"v\">A*** (KYC 완료 · 거래 안전성 검증 ✓)\u003c/span>\u003c/div>\n          \u003cdiv class=\"kv\">\u003cspan class=\"k\">신청 시점\u003c/span>\u003cspan class=\"v\">2026-09-01 09:12\u003c/span>\u003c/div>\n          \u003cdiv class=\"kv\">\u003cspan class=\"k\">신청 유효기한\u003c/span>\u003cspan class=\"v\">2026-09-03 09:12까지 (영업일 2일)\u003c/span>\u003c/div>\n          \u003cdiv class=\"kv\">\u003cspan class=\"k\">신청 조건\u003c/span>\u003cspan class=\"v\">게시 조건 그대로\u003c/span>\u003c/div>\n        \u003c/div>\n      \u003c/div>\n\n      \u003cdiv class=\"zone\" data-idx=\"2\">\n        \u003cdiv class=\"zone-highlight\">\u003c/div>\n        \u003cdiv class=\"item-area\" data-highlight=\"2\" style=\"position:relative;padding:6px;border-radius:8px;\">\n          \u003cdiv class=\"pin\" data-idx=\"2\" style=\"top:-4px;right:-4px;\">3\u003c/div>\n          \u003cdiv class=\"kv\" style=\"margin-bottom:6px;\">\u003cspan class=\"k\">내 중개 수수료 (거래액 1% 고정)\u003c/span>\u003cspan class=\"v\">5,000 USDT (보내는 500,000 USDT 기준)\u003c/span>\u003c/div>\n          \u003cdiv style=\"display:flex;gap:8px;\">\n            \u003cdiv class=\"btn primary\">신청 수락\u003c/div>\n            \u003cdiv class=\"btn danger\">거절\u003c/div>\n          \u003c/div>\n          \u003cdiv style=\"font-size:10px;color:#64748b;margin-top:6px;\">수락 시 \u003cstrong>거래가 즉시 확정되어 구속력·수수료가 발생\u003c/strong>하고, 별도 확정 절차 없이 \u003cstrong>이전(정산)\u003c/strong>으로 진행됩니다. 수락·거절 결과는 양측에 이메일로 통지됩니다\u003c/div>\n        \u003c/div>\n      \u003c/div>\n\n      \u003cdiv class=\"zone\" data-idx=\"3\">\n        \u003cdiv class=\"zone-highlight\">\u003c/div>\n        \u003cdiv class=\"item-area\" data-highlight=\"3\" style=\"position:relative;padding:6px;border-radius:8px;\">\n          \u003cdiv class=\"pin\" data-idx=\"3\" style=\"top:-4px;right:-4px;\">4\u003c/div>\n          \u003cdiv class=\"note-inline reg\">DSRV는 가격 협의에 참여하지 않으며 신청·수락 기록만 보존합니다. 수락 전까지 구속력이 없으며, 수락 시 즉시 확정됩니다.\u003c/div>\n        \u003c/div>\n      \u003c/div>\n\n    \u003c/div>\n  \u003c/div>\n\n  \u003csvg id=\"connSvg\" style=\"position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:10;overflow:visible;\">\u003c/svg>\n\n  \u003cdiv class=\"items\" id=\"items\">\n    \u003cdiv class=\"nav-global\">\n      \u003cdiv class=\"nav-global-title\">진입 · 전역 이동\u003c/div>\n      \u003cdiv class=\"nav-row\">\u003cspan class=\"nav-el\">상단 GNB(전 화면 공통)\u003c/span>\u003cspan class=\"nav-act\">대시보드/교환하기/교환게시판 메뉴 · 로고 클릭 — 목업에는 상단 요약만 표시\u003c/span>\u003cspan class=\"nav-to\">\u003cstrong>DASH-01 / EXC-01 / BRK-01\u003c/strong> (규칙: DASH-01 항목 5)\u003c/span>\u003c/div>\n      \u003cdiv class=\"nav-note\">· \u003cstrong>진입\u003c/strong>: 내 게시 상세(BRK-06)의 받은 신청 행 클릭 / 신청 접수 이메일 ① 수신 후 콘솔 직접 접속(메일 본문에 링크 없음 — 피싱 방지) → BRK-06 경유 / 대시보드(DASH-01) 거래 목록의 마목 신청접수 행 → BRK-06 경유\u003cbr>\n      · 복수 신청 시 목록에서 1건 선택 후 동일 버튼으로 처리 \u003cspan style=\"color:#991b1b;\">[확인필요: 선착순 vs 게시자 선택]\u003c/span>\u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"itm\" data-idx=\"0\">\n      \u003cdiv class=\"num\">1\u003c/div>\n      \u003cdiv>\n        \u003cdiv class=\"itm-title\">내 게시 내역 — 공통 포맷 · 게시자 관점\u003cspan class=\"req\">필수\u003c/span>\u003c/div>\n        \u003cdiv class=\"itm-desc\">· 이 화면은 \u003cstrong>게시자 측(B사) 콘솔\u003c/strong> — BRK-03(신청자 화면)과 동일 거래를 상대 역할에서 본 화면\u003cbr>· 포맷·필드 순서 = '교환거래 요청 내역' 공통 폼, 방향·수량은 게시자 기준 그대로\u003cbr>· 상태 행에 \u003cstrong>받은 신청 건수\u003c/strong> 표기 — 게재중 / 신청접수 / 확정 / 완료(유효기간 만료)\u003cbr>· \u003cstrong>게시 유효기간 기본 30일\u003c/strong> — 게시 유효기한을 폼에 표기\u003cbr>· 진입 경로: 내 게시 상세(BRK-06)의 받은 신청 행 선택(2026-09-02 변경 — BRK-01 직행 폐기) · 신청 접수 즉시 \u003cstrong>이메일 알림\u003c/strong> 발송(BRK-03 상세 참조)\u003cbr>\u003cspan class=\"basis\">근거 F-1b · 공통 포맷\u003c/span>\u003c/div>\n      \u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"itm\" data-idx=\"1\">\n      \u003cdiv class=\"num\">2\u003c/div>\n      \u003cdiv>\n        \u003cdiv class=\"itm-title\">받은 신청 — 신청자 정보·유효기한\u003cspan class=\"req\">필수\u003c/span>\u003c/div>\n        \u003cdiv class=\"itm-desc\">· 신청자 상호는 수락 전 첫 글자만 노출(A***) — BRK-03의 상대 마스킹과 \u003cstrong>대칭\u003c/strong>, KYC 완료·거래 안전성 검증 여부는 표기\u003cbr>· 신청 시점·유효기한(\u003cstrong>영업일 기준 2일\u003c/strong>) 표기 — 게시 시점과의 시세 변동 판단은 게시자 몫(DSRV 가격 불관여)\u003cbr>· 신청 조건 = 게시 조건 그대로(역제안 없음)이므로 조건 비교 UI 불요\u003cbr>· 복수 신청 접수 시: 목록으로 표시, 처리 방식 [확인필요 — 상세 참조]\u003cbr>\u003cspan class=\"basis\">근거 F-1b · V2(통신중개 아님)\u003c/span>\u003c/div>\n        \u003cdiv class=\"itm-nav\">\u003cspan class=\"nav-tag\">화면 이동 · 인터랙션\u003c/span>\n          \u003cdiv class=\"nav-row\">\u003cspan class=\"nav-el\">(무응답)\u003c/span>\u003cspan class=\"nav-act\">신청 유효기한(영업일 2일) 경과\u003c/span>\u003cspan class=\"nav-to stay\">자동 만료 — 거절과 동일 효과(게재중 복귀 · 자산이동·수수료 없음)\u003c/span>\u003c/div>\n        \u003c/div>\n      \u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"itm\" data-idx=\"2\">\n      \u003cdiv class=\"num\">3\u003c/div>\n      \u003cdiv>\n        \u003cdiv class=\"itm-title\">수락·거절 — 게시자 능동 행위 · 확정 성립 지점\u003cspan class=\"req\">필수\u003c/span>\u003c/div>\n        \u003cdiv class=\"itm-desc\">· \u003cstrong>수락은 게시자의 능동 선택\u003c/strong> — 자동 매칭·자동 체결 없음(시장개설 아님 방어의 핵심 지점)\u003cbr>· 수락 = \u003cstrong>게시자(가입자) 단독 실행\u003c/strong>(기관당 가입자 1명, ADM-03) — 수락 시 \u003cstrong>즉시 확정·구속력·수수료 발생\u003c/strong>(별도 확정 화면 없음), 바로 이전·완료(BRK-05)로 진행 · 수락 전 확인 문구로 구속력 고지\u003cbr>· \u003cstrong>수수료 사전 고시\u003c/strong> — 거래액의 1% 고정(2026-09-02 확정), 기준 = 자기 측이 보내는 자산 수량(게시자 500,000 USDT → 5,000 USDT), 자기 측 금액만 표시 · ADM-03 정책값 — 구속력 발생 전 고지로 설명의무 이행(4요소④)\u003cbr>· 거절 → 신청 종결(사유 입력 없음) · 무응답 영업일 2일 경과 시 자동 만료 — 어느 쪽도 자산이동·수수료 없음\u003cbr>· 수락(확정) 시 \u003cstrong>양측에 이메일 통지\u003c/strong> — 내용은 상세 참조\u003cbr>\u003cspan class=\"basis\">근거 V2(시장개설 아님) · L6 §9·이용자보호 · F-4 · 1기관 1가입자(ADM-03)\u003c/span>\u003c/div>\n        \u003cdiv class=\"itm-nav\">\u003cspan class=\"nav-tag\">화면 이동 · 인터랙션\u003c/span>\n          \u003cdiv class=\"nav-row\">\u003cspan class=\"nav-el\">[신청 수락] 버튼\u003c/span>\u003cspan class=\"nav-act\">클릭 — 수락 전 확인 문구(즉시 확정·구속력·수수료 1% 발생) 고지(공통 확인 다이얼로그 규격) · 게시자(가입자) 단독 실행 · 신청 유효기한 내에만 가능\u003c/span>\u003cspan class=\"nav-to\">\u003cstrong>즉시 확정\u003c/strong>(별도 확정 화면 없음) → \u003cstrong>이전·완료(BRK-05)\u003c/strong>로 진행 · 양측에 이메일 ②(수락·확정) 발송 · 상호 마스킹 해제 · DSRV 확인 건은 ADM-02 처리함에 유입\u003c/span>\u003c/div>\n          \u003cdiv class=\"nav-row\">\u003cspan class=\"nav-el\">[거절] 버튼\u003c/span>\u003cspan class=\"nav-act\">클릭 — 신청 종결(사유 입력 없음)\u003c/span>\u003cspan class=\"nav-to\">게시 상태 '게재중' 복귀(게시판 재노출) · 자산이동·수수료 없음 · 결과 이메일 통지 — \u003cstrong>내 게시 상세(BRK-06)\u003c/strong>로 복귀 (기획 가정)\u003c/span>\u003c/div>\n        \u003c/div>\n      \u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"itm\" data-idx=\"3\">\n      \u003cdiv class=\"num\">4\u003c/div>\n      \u003cdiv>\n        \u003cdiv class=\"itm-title\">\"DSRV 비참여·기록만\" 고지\u003cspan class=\"req\">필수\u003c/span>\u003c/div>\n        \u003cdiv class=\"itm-desc\">· 가격 불관여·당사자성 방어 문구 상시 노출(BRK-03과 동일 문구)\u003cbr>· 신청·수락·거절 기록 15년 보존\u003cbr>\u003cspan class=\"basis\">근거 V2 · PRD 하지않는행위 · [로펌게이트] 비참여 범위\u003c/span>\u003c/div>\n      \u003c/div>\n    \u003c/div>\n  \u003c/div>\n\n\u003c/div>\n\n\u003csection class=\"footer-note\" style=\"padding-bottom:0;\">\n  \u003cdiv class=\"note-card\">\n    \u003cdiv class=\"note-title\">상세내용\u003c/div>\n    \u003cdiv class=\"detail-grid\" id=\"detailCol\">\n      \u003cdiv class=\"dtl\" data-idx=\"0\">\n        \u003cdiv class=\"detail-label\">\u003cspan class=\"dtl-num\">1\u003c/span>역할별 화면 분리\u003c/div>\n      \u003cdiv class=\"dtl-body\">\u003cspan class=\"box\">· 게시자: 내 게시 상세(BRK-06) → \u003cstrong>받은 신청·수락(BRK-04)\u003c/strong> / 신청자: 신청(BRK-03) → 내 신청 상세(BRK-07) / 양측 공용: 이전·완료(BRK-05) — 확정 별도 화면 없음(수락 = 확정)\u003cbr>· 같은 거래를 역할별 별도 화면으로 — 한 화면에 두 역할의 액션을 섞지 않음(권한·감사 추적 명확화)\u003cbr>· 수락/거절 행위자는 게시자 측 계정(가입자 1인)으로 기록(AUDIT_LOG) — 단독 실행이므로 행위자·시각 기록이 유일 증적\u003c/span>\u003c/div>\n      \u003c/div>\n      \u003cdiv class=\"dtl\" data-idx=\"1\">\n        \u003cdiv class=\"detail-label\">\u003cspan class=\"dtl-num\">2\u003c/span>복수 신청 처리 [확인필요]\u003c/div>\n      \u003cdiv class=\"dtl-body\">\u003cspan class=\"box\">· 옵션 A: 선착순(최초 신청 수락 시 자동 마감)\u003cbr>· 옵션 B: 게시자 선택(복수 신청 중 1건 선택 수락, 나머지 자동 거절) — 현 기획 가정\u003cbr>· 어느 쪽이든 \u003cstrong>자동 매칭 아님\u003c/strong>(수락 클릭 = 게시자 능동 행위) 유지가 전제\u003c/span>\u003c/div>\n      \u003c/div>\n      \u003cdiv class=\"dtl\" data-idx=\"2\">\n        \u003cdiv class=\"detail-label\">\u003cspan class=\"dtl-num\">3\u003c/span>거절·만료 처리 · 이메일 ② 수락·확정\u003c/div>\n      \u003cdiv class=\"dtl-body\">\u003cspan class=\"box\">· 거절/만료된 신청은 게시 상태를 '게재중'으로 되돌림(게시판 재노출)\u003cbr>· \u003cstrong>게시 유효기간(기본 30일)\u003c/strong> 경과 시 게시 자체가 자동 종료 → \u003cstrong>완료(유효기간 만료)\u003c/strong> 처리, 미처리 신청도 함께 종결(기획 가정)\u003cbr>· 게시 자체의 회수(내리기)는 내 게시 상세(BRK-06) [게시 내리기]에서 — 이 화면은 신청 처리만\u003cbr>· 거절 사유는 입력받지 않음(협상·개입 소지 차단)\u003cbr>· \u003cstrong>[이메일 ② 수락·확정 (수신: 양측)]\u003c/strong> 제목 \"[DSRV] 교환 거래 확정 — BRK-20260830-0027\" · 본문: \"게시자가 신청을 수락하여 거래가 확정되었습니다. 구속력이 발생하며 이전(정산) 절차가 시작됩니다.\" + 확정 조건(공통 포맷: 요청번호·교환쌍·방향·수량·비율) · 거래 상대방 상호(확정으로 마스킹 해제) · 중개 수수료(거래액 1% 고정 · 자기 측 금액만 표기 — 상대측 금액 미노출) · 다음 단계(커스터디 콜드 이전 — 정산 배치 1영업일 3회, 완료 시 재안내) — 발신전용·링크 미포함 등 공통 원칙은 BRK-03 상세 참조\u003c/span>\u003c/div>\n      \u003c/div>\n    \u003c/div>\n  \u003c/div>\n\u003c/section>\n\n\u003csection class=\"footer-note\">\n  \u003cdiv class=\"note-card\">\n    \u003cdiv class=\"note-title\">비고\u003c/div>\n    \u003cdiv class=\"note-body\">\n      · \u003cstrong>[방어 핵심]\u003c/strong> 수락은 게시자의 \u003cstrong>능동 행위\u003c/strong> — 자동 매칭·자동 체결 없음(시장개설 아님). DSRV는 가격에 관여하지 않고 기록만 보존.\u003cbr>\n      · 수락은 가입자 단독 실행이지만 확정 건의 DSRV 확인(ADM-02 처리함)·콜드 2인 멀티시그 집행 서명은 유지.\u003cbr>\n      · \u003cspan style=\"color:#991b1b;\">[확인필요]\u003c/span> 복수 신청 처리(선착순 vs 게시자 선택).\u003cbr>\n      · 다음: 이전·완료 (BRK-05)\n    \u003c/div>\n  \u003c/div>\n\u003c/section>\n\n\u003cscript src=\"screen.js\">\u003c/script>\n\u003c/body>\n\u003c/html>\n", "brk-05.html": "\u003c!DOCTYPE html>\n\u003chtml lang=\"ko\">\n\u003chead>\n\u003cmeta charset=\"UTF-8\">\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n\u003ctitle>화면기획 — 이전·완료\u003c/title>\n\u003clink rel=\"stylesheet\" href=\"screen.css\">\n\u003c/head>\n\u003cbody>\n\n\u003cheader class=\"header\">\n  \u003cdiv class=\"crumb\">\u003cspan>마목 중개\u003c/span>\u003cspan class=\"s\">›\u003c/span>\u003cspan>교환게시판\u003c/span>\u003cspan class=\"s\">›\u003c/span>\u003cspan>이전·완료\u003c/span>\u003c/div>\n  \u003ch1 class=\"title\">이전·완료\u003c/h1>\n  \u003cspan class=\"sid\">BRK-05\u003c/span>\n  \u003cspan class=\"defense\">정산 연계 · 완결성 담보\u003c/span>\n\u003c/header>\n\n\u003cdiv class=\"main\">\n  \u003cdiv class=\"screen-panel\">\n    \u003cdiv style=\"position:relative;display:flex;\">\n      \u003cdiv class=\"labels\" id=\"labels\">\n        \u003cdiv class=\"lbl\">\u003cspan class=\"lbl-text\">전역\u003c/span>\u003c/div>\n        \u003cdiv class=\"lbl\">\u003cspan class=\"lbl-text\">이전\u003c/span>\u003c/div>\n        \u003cdiv class=\"lbl\">\u003cspan class=\"lbl-text\">수수료 정산\u003c/span>\u003c/div>\n        \u003cdiv class=\"lbl\">\u003cspan class=\"lbl-text\">확인\u003c/span>\u003c/div>\n      \u003c/div>\n      \u003csvg id=\"bracketSvg\" width=\"24\" style=\"flex-shrink:0;overflow:visible;\">\u003c/svg>\n    \u003c/div>\n\n    \u003cdiv class=\"frame\" id=\"frame\">\n      \u003cdiv class=\"zone\" data-idx=\"\">\n        \u003cdiv class=\"zone-highlight\">\u003c/div>\n        \u003cdiv class=\"c-top\" style=\"border-radius:8px;\">\n          \u003cspan class=\"brand\">DSRV Desk\u003c/span>\n          \u003cspan class=\"meta\">\u003cspan class=\"c-badge\">A자산운용 (신청자 · 양측 공용 화면)\u003c/span>\u003c/span>\n        \u003c/div>\n      \u003c/div>\n\n      \u003cdiv class=\"zone\" data-idx=\"0\">\n        \u003cdiv class=\"zone-highlight\">\u003c/div>\n        \u003cdiv class=\"item-area\" data-highlight=\"0\" style=\"position:relative;padding:6px;border-radius:8px;\">\n          \u003cdiv class=\"pin\" data-idx=\"0\" style=\"top:-4px;right:-4px;\">1\u003c/div>\n          \u003cdiv class=\"zone-title\">커스터디 콜드 수동 이전\u003c/div>\n          \u003cdiv class=\"steps\" style=\"flex-wrap:wrap;gap:8px;margin-bottom:8px;\">\n            \u003cspan class=\"step done\">\u003cspan class=\"dot\">✓\u003c/span>양건 확인\u003c/span>\u003cspan class=\"arrow\">→\u003c/span>\n            \u003cspan class=\"step now\">\u003cspan class=\"dot\">2\u003c/span>B→A 이전\u003c/span>\u003cspan class=\"arrow\">→\u003c/span>\n            \u003cspan class=\"step\">\u003cspan class=\"dot\">3\u003c/span>A→B 이전\u003c/span>\u003cspan class=\"arrow\">→\u003c/span>\n            \u003cspan class=\"step\">\u003cspan class=\"dot\">4\u003c/span>완료\u003c/span>\n          \u003c/div>\n          \u003cdiv class=\"kv\">\u003cspan class=\"k\">이전 완결성\u003c/span>\u003cspan class=\"v\" style=\"color:#16a34a;\">양건 확인 완료\u003c/span>\u003c/div>\n          \u003cdiv class=\"kv\">\u003cspan class=\"k\">트래블룰\u003c/span>\u003cspan class=\"v\" style=\"color:#16a34a;\">양측 송·수신인 정보 확인 완료\u003c/span>\u003c/div>\n        \u003c/div>\n      \u003c/div>\n\n      \u003cdiv class=\"zone\" data-idx=\"1\">\n        \u003cdiv class=\"zone-highlight\">\u003c/div>\n        \u003cdiv class=\"item-area\" data-highlight=\"1\" style=\"position:relative;padding:6px;border-radius:8px;\">\n          \u003cdiv class=\"pin\" data-idx=\"1\" style=\"top:-4px;right:-4px;\">2\u003c/div>\n          \u003cdiv class=\"zone-title\">수수료 정산\u003c/div>\n          \u003cdiv class=\"kv\">\u003cspan class=\"k\">요청번호\u003c/span>\u003cspan class=\"v\">BRK-20260830-0027\u003c/span>\u003c/div>\n          \u003cdiv class=\"kv\">\u003cspan class=\"k\">교환쌍 · 방향\u003c/span>\u003cspan class=\"v\">USDT → USDC\u003c/span>\u003c/div>\n          \u003cdiv class=\"kv\">\u003cspan class=\"k\">보내는 수량\u003c/span>\u003cspan class=\"v\">500,000 USDT\u003c/span>\u003c/div>\n          \u003cdiv class=\"kv\">\u003cspan class=\"k\">받는 수량\u003c/span>\u003cspan class=\"v\">499,000 USDC\u003c/span>\u003c/div>\n          \u003cdiv class=\"kv\">\u003cspan class=\"k\">비율\u003c/span>\u003cspan class=\"v\">0.9980 USDC/USDT\u003c/span>\u003c/div>\n          \u003cdiv class=\"kv\">\u003cspan class=\"k\">내 중개 수수료 (거래액 1% 고정)\u003c/span>\u003cspan class=\"v\">4,990 USDC (보내는 499,000 USDC 기준)\u003c/span>\u003c/div>\n        \u003c/div>\n      \u003c/div>\n\n      \u003cdiv class=\"zone\" data-idx=\"2\">\n        \u003cdiv class=\"zone-highlight\">\u003c/div>\n        \u003cdiv class=\"item-area\" data-highlight=\"2\" style=\"position:relative;padding:6px;border-radius:8px;\">\n          \u003cdiv class=\"pin\" data-idx=\"2\" style=\"top:-8px;right:-4px;\">3\u003c/div>\n          \u003cdiv class=\"btn primary\">확인\u003c/div>\n        \u003c/div>\n      \u003c/div>\n    \u003c/div>\n  \u003c/div>\n\n  \u003csvg id=\"connSvg\" style=\"position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:10;overflow:visible;\">\u003c/svg>\n\n  \u003cdiv class=\"items\" id=\"items\">\n    \u003cdiv class=\"nav-global\">\n      \u003cdiv class=\"nav-global-title\">진입 · 전역 이동\u003c/div>\n      \u003cdiv class=\"nav-row\">\u003cspan class=\"nav-el\">상단 GNB(전 화면 공통)\u003c/span>\u003cspan class=\"nav-act\">대시보드/교환하기/교환게시판 메뉴 · 로고 클릭 — 목업에는 상단 요약만 표시\u003c/span>\u003cspan class=\"nav-to\">\u003cstrong>DASH-01 / EXC-01 / BRK-01\u003c/strong> (규칙: DASH-01 항목 5)\u003c/span>\u003c/div>\n      \u003cdiv class=\"nav-note\">· \u003cstrong>진입\u003c/strong>: (게시자) 받은 신청·수락(BRK-04) 수락(확정) 직후 / (신청자) 내 신청 상세(BRK-07) 확정 링크 / 양측: 대시보드(DASH-01) 거래 목록의 마목 확정·완료 행 클릭 / 완료 이메일 ③ 수신 후 콘솔 직접 접속 · \u003cstrong>양측 공용 화면\u003c/strong> — 수수료 항목만 자기 측 금액으로 다르게 표시\u003cbr>\n      · 이전 단계(양건 확인 → B→A → A→B → 완료)는 조회 전용 — 화면 내 집행 액션 없음(콜드 이전은 커스터디 운영절차 · ADM-02 처리함 승인)\u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"itm\" data-idx=\"0\">\n      \u003cdiv class=\"num\">1\u003c/div>\n      \u003cdiv>\n        \u003cdiv class=\"itm-title\">커스터디 콜드 수동 이전\u003cspan class=\"req\">필수\u003c/span>\u003c/div>\n        \u003cdiv class=\"itm-desc\">· 양쪽 조건을 함께 확인한 뒤 순서대로 이전(정산과 연계)\u003cbr>· 100% 콜드지갑·수동 · \u003cstrong>콜드 출고는 2인 서명(멀티시그, 키 2개·서명자 2인)\u003c/strong> · 정산 배치 = 1영업일 3회 콜드 이체 운영, 확정 건은 다음 배치에 편입\u003cbr>· 완결성(한쪽만 이전 방지)·트래블룰(양측 송·수신인 정보 확인·교환)은 별도 섹션 없이 \u003cstrong>이전 상태에 한 줄씩 포함 표시\u003c/strong>\u003cbr>\u003cspan class=\"basis\">근거: 커스터디 콜드 출고 절차 · 정보보호 관리체계(ISMS) 인증기준 2.7.2(암호키·서명 관리) · L2 §10의10(트래블룰) · KPI·QA(완결성)\u003c/span>\u003c/div>\n      \u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"itm\" data-idx=\"1\">\n      \u003cdiv class=\"num\">2\u003c/div>\n      \u003cdiv>\n        \u003cdiv class=\"itm-title\">수수료 정산\u003cspan class=\"req\">필수\u003c/span>\u003c/div>\n        \u003cdiv class=\"itm-desc\">· 수수료 = 거래액의 1% 고정, 양측 각자 부담(2026-09-02 확정) — 기준은 각자 \u003cstrong>보내는 자산 수량\u003c/strong>(신청자 A 499,000 USDC → 4,990 USDC · 게시자 B 500,000 USDT → 5,000 USDT), 화면에는 자기 측 금액만\u003cbr>· 차감 방식 \u003cspan style=\"color:#b45309;\">[확인필요: 보내는 수량에서 공제 vs 별도 정산]\u003c/span> · 수익 구분회계\u003cbr>· 거래자 대상 거래보고서 발급 없음 — 완료 건 확인은 이 화면·대시보드 거래 내역으로\u003cbr>· 거래 내역은 '교환거래 요청 내역' 공통 폼과 동일 필드·순서 + 수수료 항목\u003cbr>\u003cspan class=\"basis\">근거 L6 §9 · V11 · 공통 포맷\u003c/span>\u003c/div>\n      \u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"itm\" data-idx=\"2\">\n      \u003cdiv class=\"num\">3\u003c/div>\n      \u003cdiv>\n        \u003cdiv class=\"itm-title\">확인 버튼 — 프로세스 종료 이동\u003cspan class=\"req\">필수\u003c/span>\u003c/div>\n        \u003cdiv class=\"itm-desc\">· 마목 flow 종료 화면 — \u003cstrong>'확인' 클릭 시 홈(DASH-01)으로 이동\u003c/strong>(EXC-03과 동일 패턴)\u003cbr>· 뒤로가기 미지원(전역 규칙 — DASH-01)\u003cbr>· 완료 건 재확인은 대시보드 거래 현황·거래 내역에서\u003cbr>· 거래 완료(양측 이전 완결) 시 양측 등록 이메일로 완료 알림 발송 — 내용은 상세 참조\u003cbr>\u003cspan class=\"basis\">근거: 종료 화면 이탈 동선\u003c/span>\u003c/div>\n        \u003cdiv class=\"itm-nav\">\u003cspan class=\"nav-tag\">화면 이동 · 인터랙션\u003c/span>\n          \u003cdiv class=\"nav-row\">\u003cspan class=\"nav-el\">[확인] 버튼\u003c/span>\u003cspan class=\"nav-act\">클릭 — 마목 flow 종료 동선(EXC-03·04와 동일 패턴)\u003c/span>\u003cspan class=\"nav-to\">\u003cstrong>대시보드(DASH-01)\u003c/strong> 이동\u003c/span>\u003c/div>\n        \u003c/div>\n      \u003c/div>\n    \u003c/div>\n  \u003c/div>\n\n\u003c/div>\n\n\u003csection class=\"footer-note\" style=\"padding-bottom:0;\">\n  \u003cdiv class=\"note-card\">\n    \u003cdiv class=\"note-title\">상세내용\u003c/div>\n    \u003cdiv class=\"detail-grid\" id=\"detailCol\">\n      \u003cdiv class=\"dtl\" data-idx=\"0\">\n        \u003cdiv class=\"detail-label\">\u003cspan class=\"dtl-num\">1\u003c/span>정산 연계 운영절차 (4요소③) · 완결성 실패 처리\u003c/div>\n      \u003cdiv class=\"dtl-body\">\u003cspan class=\"box\">· 게시판이 커스터디 이전과 연계 = 단순 게시판과의 결정적 차이\u003cbr>· 양건 조건 동시 확인 → 순차 콜드 출고 · 각 단계 감사로그·해시 기록\u003cbr>· 일방 이전 후 상대방 이전 실패 → \u003cspan class=\"red\">거래 홀드\u003c/span> + 역이전(원상 복구) → 완결성 KPI·이상징후로 ADM-02 워닝\u003c/span>\u003c/div>\n      \u003c/div>\n      \u003cdiv class=\"dtl\" data-idx=\"1\">\n        \u003cdiv class=\"detail-label\">\u003cspan class=\"dtl-num\">2\u003c/span>구분회계 처리\u003c/div>\n      \u003cdiv class=\"dtl-body\">\u003cspan class=\"box\">· 중개 수수료 수익 = 중개수익 계정(나목 스프레드 수익과 분리 — 내부 구분회계, 고객 화면 미노출 2026-09-02 확정)\u003cbr>· 구분회계 CSV·3면 대사 CSV(ADM-02)에 반영\u003c/span>\u003c/div>\n      \u003c/div>\n      \u003cdiv class=\"dtl\" data-idx=\"2\">\n        \u003cdiv class=\"detail-label\">\u003cspan class=\"dtl-num\">3\u003c/span>이메일 알림 ③ 거래 완료 (수신: 양측)\u003c/div>\n      \u003cdiv class=\"dtl-body\">\u003cspan class=\"box\">· 발송 시점: 양측 콜드 이전 완결(완결성 확인) 시\u003cbr>· 제목: [DSRV] 교환 거래 완료 — BRK-20260830-0027\u003cbr>· 본문: \"교환 거래의 이전(정산)이 완료되었습니다.\" + 완료 일시 · 거래 내역(공통 포맷: 요청번호·교환쌍·방향·수량·비율) · 중개 수수료 정산액(자기 측만 표기) + \"상세 내역은 DSRV Desk > 대시보드 > 거래 내역에서 확인해 주세요.\"\u003cbr>· 공통 원칙(발신전용·링크 미포함·STR 미포함)은 BRK-03 상세 참조\u003c/span>\u003c/div>\n      \u003c/div>\n    \u003c/div>\n  \u003c/div>\n\u003c/section>\n\n\u003csection class=\"footer-note\">\n  \u003cdiv class=\"note-card\">\n    \u003cdiv class=\"note-title\">비고\u003c/div>\n    \u003cdiv class=\"note-body\">\n      · 마목 중개 flow 종료 화면. \u003cstrong>[방어 핵심]\u003c/strong> ③ 정산 연계(커스터디 콜드 이전) + ④ 수수료(거래액 1% 고정·양측 각자)를 실제로 집행해 \"단순 게시판이 아닌 중개\"임을 완결. 완결성 지표로 한쪽만 이전되는 리스크를 차단.\u003cbr>\n      · \u003cstrong>[화이트리스트 미적용]\u003c/strong> 교환·중개는 내부 커스터디 지갑 사이의 이동이라 외부 주소를 다루지 않으므로 화이트리스트를 적용하지 않음.\u003cbr>\n      · \u003cspan style=\"color:#991b1b;\">[확인필요]\u003c/span> 정산 배치(1영업일 3회) 시각·마감 기준.\u003cbr>\n      · 마목 진행 순서: 게시판(BRK-01) → 등록(BRK-02) → 내 게시 상세(BRK-06, 회수 가능) / 신청(BRK-03, 유효 영업일 2일) → 내 신청 상세(BRK-07) → 수락(BRK-04, 즉시 확정) → \u003cstrong>완료(BRK-05, 양측 공용)\u003c/strong>\n    \u003c/div>\n  \u003c/div>\n\u003c/section>\n\n\u003cscript src=\"screen.js\">\u003c/script>\n\u003c/body>\n\u003c/html>\n", "adm-02.html": "\u003c!DOCTYPE html>\n\u003chtml lang=\"ko\">\n\u003chead>\n\u003cmeta charset=\"UTF-8\">\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n\u003ctitle>화면기획 — 어드민 홈\u003c/title>\n\u003clink rel=\"stylesheet\" href=\"screen.css\">\n\u003cstyle>\n  .tbl{width:100%;border-collapse:collapse;font-size:11px;}\n  .tbl th{background:#f1f5f9;color:#64748b;font-weight:700;text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);font-size:10px;}\n  .tbl td{padding:7px 8px;border-bottom:1px solid #f1f1ee;color:#334155;vertical-align:middle;}\n  .act{display:inline-block;font-size:9px;font-weight:700;padding:2px 7px;border-radius:6px;border:1px solid #93c5fd;color:#2563eb;background:#fff;margin:1px 2px 1px 0;white-space:nowrap;}\n  .act.warn{border-color:#fca5a5;color:#b91c1c;}\n  .csvgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}\n  .csvbtn{border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:#fff;}\n  .csvbtn .ct{font-size:11px;font-weight:700;color:#334155;}\n  .csvbtn .cd{font-size:9.5px;color:#94a3b8;margin-top:3px;}\n  .csvbtn .dl{display:inline-block;margin-top:6px;font-size:9px;font-weight:700;padding:2px 8px;border-radius:6px;border:1px solid #93c5fd;color:#2563eb;}\n  .appx-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}\n  .appx{border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:#fff;}\n  .appx .at{font-size:12px;font-weight:800;color:#0f172a;}\n  .appx .as{font-size:10px;color:#94a3b8;margin:2px 0 8px;font-family:ui-monospace,Consolas,monospace;}\n  .appx .tbl td{padding:4px 6px;font-size:10.5px;}\n  .appx .src{font-family:ui-monospace,Consolas,monospace;font-size:9.5px;color:#475569;}\n  .appx .gap{color:#b45309;font-weight:700;}\n  .appx .drv{color:#7c3aed;font-weight:700;}\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\n\u003cheader class=\"header\">\n  \u003cdiv class=\"crumb\">\u003cspan>관리자\u003c/span>\u003cspan class=\"s\">›\u003c/span>\u003cspan>홈\u003c/span>\u003c/div>\n  \u003ch1 class=\"title\">어드민 홈\u003c/h1>\n  \u003cspan class=\"sid\">ADM-02\u003c/span>\n  \u003cspan class=\"defense\">처리할 일만 알람·워닝 · 조회는 CSV 다운로드\u003c/span>\n\u003c/header>\n\n\u003cdiv class=\"main\">\n  \u003cdiv class=\"screen-panel\">\n    \u003cdiv style=\"position:relative;display:flex;\">\n      \u003cdiv class=\"labels\" id=\"labels\">\n        \u003cdiv class=\"lbl\">\u003cspan class=\"lbl-text\">전역·\u003cbr>관리 메뉴\u003c/span>\u003c/div>\n        \u003cdiv class=\"lbl\">\u003cspan class=\"lbl-text\">처리 현황\u003c/span>\u003c/div>\n        \u003cdiv class=\"lbl\">\u003cspan class=\"lbl-text\">알람·워닝\u003cbr>처리함\u003c/span>\u003c/div>\n        \u003cdiv class=\"lbl\">\u003cspan class=\"lbl-text\">집행 대기\u003c/span>\u003c/div>\n        \u003cdiv class=\"lbl\">\u003cspan class=\"lbl-text\">데이터\u003cbr>다운로드\u003c/span>\u003c/div>\n      \u003c/div>\n      \u003csvg id=\"bracketSvg\" width=\"24\" style=\"flex-shrink:0;overflow:visible;\">\u003c/svg>\n    \u003c/div>\n\n    \u003cdiv class=\"frame\" id=\"frame\">\n      \u003c!-- 전역: 관리 메뉴 -->\n      \u003cdiv class=\"zone\" data-idx=\"3\">\n        \u003cdiv class=\"zone-highlight\">\u003c/div>\n        \u003cdiv class=\"item-area\" data-highlight=\"3\" style=\"position:relative;\">\n          \u003cdiv class=\"pin\" data-idx=\"3\" style=\"top:-4px;right:-4px;\">4\u003c/div>\n          \u003cdiv class=\"c-top admin\" style=\"border-radius:8px 8px 0 0;\">\n            \u003cspan class=\"brand\">DSRV Admin Console\u003c/span>\n            \u003cspan class=\"meta\">\u003c/span>\n          \u003c/div>\n          \u003cdiv class=\"c-adminbar\" style=\"margin:0;\">\n            \u003cspan class=\"m on\">홈\u003c/span>\u003cspan class=\"m\">설정\u003c/span>\n          \u003c/div>\n        \u003c/div>\n      \u003c/div>\n\n      \u003c!-- 처리 현황 -->\n      \u003cdiv class=\"zone\" data-idx=\"\">\n        \u003cdiv class=\"zone-highlight\">\u003c/div>\n        \u003cdiv class=\"kpi\">\n          \u003cdiv class=\"card\">\u003cdiv class=\"n\">6\u003c/div>\u003cdiv class=\"t\">처리 대기\u003c/div>\u003c/div>\n          \u003cdiv class=\"card\">\u003cdiv class=\"n\">3\u003c/div>\u003cdiv class=\"t\">High 워닝\u003c/div>\u003c/div>\n          \u003cdiv class=\"card\">\u003cdiv class=\"n\">1\u003c/div>\u003cdiv class=\"t\">집행 대기(멀티시그)\u003c/div>\u003c/div>\n          \u003cdiv class=\"card\">\u003cdiv class=\"n\">12\u003c/div>\u003cdiv class=\"t\">오늘 처리\u003c/div>\u003c/div>\n        \u003c/div>\n      \u003c/div>\n\n      \u003c!-- 알람·워닝 처리함 -->\n      \u003cdiv class=\"zone\" data-idx=\"0\">\n        \u003cdiv class=\"zone-highlight\">\u003c/div>\n        \u003cdiv class=\"item-area\" data-highlight=\"0\" style=\"position:relative;padding:6px;border-radius:8px;\">\n          \u003cdiv class=\"pin\" data-idx=\"0\" style=\"top:-4px;right:-4px;\">1\u003c/div>\n          \u003cdiv class=\"zone-title\">알람·워닝 처리함\u003c/div>\n          \u003ctable class=\"tbl\">\n            \u003cthead>\u003ctr>\u003cth>유형\u003c/th>\u003cth>대상·내용\u003c/th>\u003cth>자동검증·등급\u003c/th>\u003cth>상태\u003c/th>\u003cth>처리\u003c/th>\u003c/tr>\u003c/thead>\n            \u003ctbody>\n              \u003ctr>\u003ctd>나목 교환 승인\u003c/td>\u003ctd class=\"mono\">ORG-A · USDC→USDT 100,000 · EXC-20260831-0142\u003c/td>\u003ctd>\u003cspan class=\"chip ok\">정상\u003c/span>\u003c/td>\u003ctd>승인 대기\u003c/td>\u003ctd>\u003cspan class=\"act\">승인\u003c/span>\u003cspan class=\"act\">보류\u003c/span>\u003cspan class=\"act warn\">거절\u003c/span>\u003c/td>\u003c/tr>\n              \u003ctr>\u003ctd>마목 확정 확인\u003c/td>\u003ctd class=\"mono\">ORG-A↔ORG-B · USDT 500,000→USDC 499,000\u003c/td>\u003ctd>\u003cspan class=\"sev mid\">KYT 주의\u003c/span>\u003c/td>\u003ctd>확인 대기 · \u003cspan class=\"sev mid\">에스컬레이션\u003c/span>\u003c/td>\u003ctd>\u003cspan class=\"act\">승인\u003c/span>\u003cspan class=\"act\">보류\u003c/span>\u003cspan class=\"act warn\">이전 중지\u003c/span>\u003c/td>\u003c/tr>\n              \u003ctr>\u003ctd>출금·이전(서면 접수)\u003c/td>\u003ctd class=\"mono\">ORG-A · 신규 주소 · USDC 80,000\u003c/td>\u003ctd>\u003cspan class=\"chip info\">지연발효 중\u003c/span>\u003c/td>\u003ctd>대기(지연발효 중)\u003c/td>\u003ctd>\u003cspan class=\"act\">승인 → 집행 대기\u003c/span>\u003cspan class=\"act warn\">거절\u003c/span>\u003c/td>\u003c/tr>\n              \u003ctr>\u003ctd>입금 격리(KYT 고위험)\u003c/td>\u003ctd class=\"mono\">ORG-B 입금 0x3f9a…c41d\u003c/td>\u003ctd>\u003cspan class=\"sev hi\">High\u003c/span>\u003c/td>\u003ctd>격리 중\u003c/td>\u003ctd>\u003cspan class=\"act\">소명 요청\u003c/span>\u003cspan class=\"act warn\">STR·동결\u003c/span>\u003c/td>\u003c/tr>\n              \u003ctr>\u003ctd>이상거래 워닝(자전 의심)\u003c/td>\u003ctd class=\"mono\">ORG-A / EXC-20260831-0142\u003c/td>\u003ctd>\u003cspan class=\"sev hi\">High\u003c/span>\u003c/td>\u003ctd>미처리\u003c/td>\u003ctd>\u003cspan class=\"act\">검토\u003c/span>\u003cspan class=\"act warn\">STR 검토\u003c/span>\u003cspan class=\"act\">무혐의 종결\u003c/span>\u003c/td>\u003c/tr>\n              \u003ctr>\u003ctd>월렛·키 알람(비인가 이체 시도)\u003c/td>\u003ctd class=\"mono\">콜드watch\u003c/td>\u003ctd>\u003cspan class=\"sev hi\">High\u003c/span>\u003c/td>\u003ctd>미확인\u003c/td>\u003ctd>\u003cspan class=\"act\">확인\u003c/span>\u003cspan class=\"act\">조치완료\u003c/span>\u003c/td>\u003c/tr>\n              \u003ctr>\u003ctd>KYC 재이행 기한 초과\u003c/td>\u003ctd class=\"mono\">ORG-C · 미응답\u003c/td>\u003ctd>\u003cspan class=\"sev mid\">Mid\u003c/span>\u003c/td>\u003ctd>일시제한 예정\u003c/td>\u003ctd>\u003cspan class=\"act warn\">신규 거래 제한\u003c/span>\u003c/td>\u003c/tr>\n              \u003ctr>\u003ctd>계정 잠금(5회 오류)\u003c/td>\u003ctd class=\"mono\">ORG-A · 가입자\u003c/td>\u003ctd class=\"mono\">—\u003c/td>\u003ctd>잠금\u003c/td>\u003ctd>\u003cspan class=\"act\">본인확인 후 해제\u003c/span>\u003c/td>\u003c/tr>\n              \u003ctr>\u003ctd>3면 대사 불일치\u003c/td>\u003ctd class=\"mono\">ORG-B 수탁 지갑 · 내부장부 ≠ 온체인 (USDC 1,200 차이) · 출금 자동 동결\u003c/td>\u003ctd>\u003cspan class=\"sev hi\">High\u003c/span>\u003c/td>\u003ctd>미처리\u003c/td>\u003ctd>\u003cspan class=\"act\">원인 규명\u003c/span>\u003cspan class=\"act\">해제·종결\u003c/span>\u003c/td>\u003c/tr>\n            \u003c/tbody>\n          \u003c/table>\n        \u003c/div>\n      \u003c/div>\n\n      \u003c!-- 집행 대기 -->\n      \u003cdiv class=\"zone\" data-idx=\"1\">\n        \u003cdiv class=\"zone-highlight\">\u003c/div>\n        \u003cdiv class=\"item-area\" data-highlight=\"1\" style=\"position:relative;padding:6px;border-radius:8px;\">\n          \u003cdiv class=\"pin\" data-idx=\"1\" style=\"top:-4px;right:-4px;\">2\u003c/div>\n          \u003cdiv class=\"zone-title\">집행 대기\u003c/div>\n          \u003ctable class=\"tbl\">\n            \u003cthead>\u003ctr>\u003cth>건\u003c/th>\u003cth>상태\u003c/th>\u003cth>집행 명세\u003c/th>\u003cth>콜드 집행 결과\u003c/th>\u003cth>처리\u003c/th>\u003c/tr>\u003c/thead>\n            \u003ctbody>\n              \u003ctr>\n                \u003ctd class=\"mono\">출금·이전 · ORG-A · USDC 80,000\u003c/td>\n                \u003ctd style=\"color:#b45309;font-weight:700;\">집행 대기\u003c/td>\n                \u003ctd>\u003cspan class=\"act\">집행 명세 다운로드 (Excel)\u003c/span>\u003c/td>\n                \u003ctd style=\"min-width:160px;\">\u003cdiv class=\"field\" style=\"padding:5px 8px;font-size:10px;\">\u003cspan class=\"ph\">txhash 입력 (0x…)\u003c/span>\u003c/div>\u003c/td>\n                \u003ctd>\u003cspan class=\"act\">완료 처리\u003c/span>\u003c/td>\n              \u003c/tr>\n            \u003c/tbody>\n          \u003c/table>\n        \u003c/div>\n      \u003c/div>\n\n      \u003c!-- 데이터 다운로드 -->\n      \u003cdiv class=\"zone\" data-idx=\"2\">\n        \u003cdiv class=\"zone-highlight\">\u003c/div>\n        \u003cdiv class=\"item-area\" data-highlight=\"2\" style=\"position:relative;padding:6px;border-radius:8px;\">\n          \u003cdiv class=\"pin\" data-idx=\"2\" style=\"top:-4px;right:-4px;\">3\u003c/div>\n          \u003cdiv class=\"zone-title\">데이터 다운로드\u003c/div>\n          \u003cdiv class=\"csvgrid\">\n            \u003cdiv class=\"csvbtn\">\u003cdiv class=\"ct\">기관-가입자 목록\u003c/div>\u003cdiv class=\"cd\">기관·가입자(기관당 1명)·KYC 상태·재이행 도래·계정 상태\u003c/div>\u003cspan class=\"dl\">CSV 다운로드\u003c/span>\u003c/div>\n            \u003cdiv class=\"csvbtn\">\u003cdiv class=\"ct\">거래 요청 목록\u003c/div>\u003cdiv class=\"cd\">나목·마목·출금/이전 요청 + 자동검증 결과·처리 이력(처리자·사유)\u003c/div>\u003cspan class=\"dl\">CSV 다운로드\u003c/span>\u003c/div>\n            \u003cdiv class=\"csvbtn\">\u003cdiv class=\"ct\">통합 거래 목록\u003c/div>\u003cdiv class=\"cd\">교환·중개·이전 전 거래 시간순 (구 통합 로그)\u003c/div>\u003cspan class=\"dl\">CSV 다운로드\u003c/span>\u003c/div>\n            \u003cdiv class=\"csvbtn\">\u003cdiv class=\"ct\">구분회계 집계\u003c/div>\u003cdiv class=\"cd\">수탁/운영 원장 분리 · 스프레드 수익/중개 수수료 계정 분리\u003c/div>\u003cspan class=\"dl\">CSV 다운로드\u003c/span>\u003c/div>\n            \u003cdiv class=\"csvbtn\">\u003cdiv class=\"ct\">3면 대사\u003c/div>\u003cdiv class=\"cd\">내부 장부 ↔ 온체인 ↔ 커스터디 콜드 잔액 스냅숏\u003c/div>\u003cspan class=\"dl\">CSV 다운로드\u003c/span>\u003c/div>\n            \u003cdiv class=\"csvbtn\">\u003cdiv class=\"ct\">열람 기록\u003c/div>\u003cdiv class=\"cd\">누가·무엇을 조회·다운로드했는가 (열람 자체 감사)\u003c/div>\u003cspan class=\"dl\">CSV 다운로드\u003c/span>\u003c/div>\n          \u003c/div>\n        \u003c/div>\n      \u003c/div>\n\n    \u003c/div>\n  \u003c/div>\n\n  \u003csvg id=\"connSvg\" style=\"position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:10;overflow:visible;\">\u003c/svg>\n\n  \u003cdiv class=\"items\" id=\"items\">\n    \u003cdiv class=\"nav-global\">\n      \u003cdiv class=\"nav-global-title\">진입 · 전역 이동\u003c/div>\n      \u003cdiv class=\"nav-note\">· \u003cstrong>진입\u003c/strong>: 관리자 콘솔 기본(첫) 탭 — 내부 전용 · PAM 전용세션 \u003cspan style=\"color:#991b1b;\">[확인필요: 어드민 로그인·인증 화면 별도 기획 여부]\u003c/span>\u003cbr>\n      · 처리함 유입 경로: 나목 승인(EXC-03) · 마목 확정 확인(BRK-04) · 계정 잠금(AUTH-01) · 출금/이전 서면 접수 · 입금 감시·이상거래·월렛/키·KYC 재이행·3면 대사 불일치\u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"itm\" data-idx=\"0\">\n      \u003cdiv class=\"num\">1\u003c/div>\n      \u003cdiv>\n        \u003cdiv class=\"itm-title\">알람·워닝 처리함\u003cspan class=\"req\">필수\u003c/span>\u003c/div>\n        \u003cdiv class=\"itm-desc\">· 사람이 처리해야 할 일만 한 처리함에 통합 — 조회성 화면 없음\u003cbr>· 유입: 나목 교환 승인(EXC-03) · 마목 확정 확인(BRK-04) · 출금/이전 서면 접수 · 입금 예외 B1~B5(격리·동결) · 이상거래(자전·통정·위장게시) · 월렛/키 접근 알람 · 제재·다크코인 적중 · KYC 재이행 도래·미응답 · 계정 잠금(AUTH-01) · 3면 대사 불일치(X3)\u003cbr>· 유형별 행에서 \u003cstrong>인라인 처리\u003c/strong> — 별도 상세 화면 없음, 선택 건 상세는 행 확장으로 '교환거래 요청 내역' 공통 폼 표시\u003cbr>· 자동검증은 1차 필터 — \u003cstrong>자동 체결·자동 승인·자동 거절 없음\u003c/strong>, 최종 판단은 사람 · 본인 기안 자기승인 차단 · 고액·신규주소 건 지연발효 · 보류·거절 사유 필수(고객 통지는 일반화된 사유만)\u003cbr>· toast(순간) + 처리함(누적·상태관리) 두 축 — 외부 메신저 연동 없음\u003cbr>\u003cspan class=\"basis\">근거: 승인 대기함 [32 §6 APR-01] · 자동검증 1차 필터 [09 §0 line 70·F-4] · ISMS 2.11.3(이상행위 모니터링)·2.2.2(직무분리) · 예외 B1·B2·E3·E4·E7·H3·X3\u003c/span>\u003c/div>\n        \u003cdiv class=\"itm-nav\">\u003cspan class=\"nav-tag\">화면 이동 · 인터랙션\u003c/span>\n          \u003cdiv class=\"nav-row\">\u003cspan class=\"nav-el\">처리함 행\u003c/span>\u003cspan class=\"nav-act\">클릭 — 행 확장(별도 상세 화면 없음)\u003c/span>\u003cspan class=\"nav-to stay\">화면 내 — '교환거래 요청 내역' 공통 폼으로 선택 건 상세 표시\u003c/span>\u003c/div>\n          \u003cdiv class=\"nav-row\">\u003cspan class=\"nav-el\">행 내 처리 버튼\u003cbr>(승인 / 보류 / 거절 / 소명 인정 / STR·동결 / 무혐의 종결 / 해제 등)\u003c/span>\u003cspan class=\"nav-act\">클릭 — 인라인 처리 · 보류·거절 사유 입력 필수 · 본인 기안 자기승인 차단 · 고액·신규주소 건 지연발효\u003c/span>\u003cspan class=\"nav-to stay\">화면 내 상태 전이(상태 전이 문서 참조) · 출금 건 승인 → \u003cstrong>집행 대기\u003c/strong> 행으로 이동 · 처리 결과는 고객 화면에 상태로만 반영(STR 누설 금지) · 전 처리 감사기록\u003c/span>\u003c/div>\n        \u003c/div>\n      \u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"itm\" data-idx=\"1\">\n      \u003cdiv class=\"num\">2\u003c/div>\n      \u003cdiv>\n        \u003cdiv class=\"itm-title\">승인 → 집행 분리 (멀티시그 화면 없음)\u003cspan class=\"req\">필수\u003c/span>\u003c/div>\n        \u003cdiv class=\"itm-desc\">· 콜드월렛 2인 멀티시그 서명·집행은 \u003cstrong>화면 밖 커스터디 운영절차\u003c/strong>로 분리 — 지갑 운영 화면 없음\u003cbr>· 집행 대기 건은 \u003cstrong>집행 명세(Excel) 다운로드\u003c/strong> 제공 — 출금 지갑·수신 주소·자산·수량 등 콜드에서 수행할 작업을 명세서 형태로 전달\u003cbr>· 콜드 집행 후 담당자가 \u003cstrong>txhash 입력 → 온체인 조회로 명세와 대사(주소·자산·수량 일치)\u003c/strong> — 일치 시에만 완료 확정, 불일치 시 처리함 워닝\u003cbr>· 명세 다운로드·txhash 입력·완료 처리 모두 감사 기록(누가·언제)\u003cbr>· 콜드→핫 보충·스윕 등 지갑 이동도 동일 경로 — 온라인 집행 버튼 없음\u003cbr>\u003cspan class=\"basis\">근거: 콜드월렛 중심 보관 [L4 §26] · 멀티시그 [ISMS 2.7.2] · 예외 B6·F6·H4\u003c/span>\u003c/div>\n        \u003cdiv class=\"itm-nav\">\u003cspan class=\"nav-tag\">화면 이동 · 인터랙션\u003c/span>\n          \u003cdiv class=\"nav-row\">\u003cspan class=\"nav-el\">[집행 명세 다운로드 (Excel)]\u003c/span>\u003cspan class=\"nav-act\">클릭 — 콜드에서 수행할 작업 명세 전달\u003c/span>\u003cspan class=\"nav-to stay\">파일 다운로드 · 화면 이동 없음 · 감사기록\u003c/span>\u003c/div>\n          \u003cdiv class=\"nav-row\">\u003cspan class=\"nav-el\">txhash 입력 → [완료 처리]\u003c/span>\u003cspan class=\"nav-act\">온체인 조회로 명세와 대사(주소·자산·수량 일치)\u003c/span>\u003cspan class=\"nav-to stay\">일치 → 완료 확정·잔고 반영 / 불일치·미확인 → 완료 불가, \u003cstrong>처리함 워닝 회송\u003c/strong>\u003c/span>\u003c/div>\n        \u003c/div>\n      \u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"itm\" data-idx=\"2\">\n      \u003cdiv class=\"num\">3\u003c/div>\n      \u003cdiv>\n        \u003cdiv class=\"itm-title\">데이터 다운로드 (CSV 6종)\u003cspan class=\"req\">필수\u003c/span>\u003c/div>\n        \u003cdiv class=\"itm-desc\">· 조회성 데이터는 화면 표 없이 \u003cstrong>CSV 다운로드 버튼만\u003c/strong> 6종: 기관-가입자 목록 · 거래 요청 목록 · 통합 거래 목록 · 구분회계 집계 · 3면 대사 · 열람 기록 — 분석은 CSV로 오프라인 수행\u003cbr>· 실명·연락처 등 개인식별정보는 CSV에서도 마스킹 · 개인키·passphrase·시드는 어디에도 기록하지 않음\u003cbr>· 모든 다운로드는 열람 기록에 감사 기록(누가·무엇·언제) — 그 열람 기록도 CSV로 다운로드\u003cbr>· 3면 대사 불일치 발생 시 처리함 워닝 + 해당 지갑 출금 자동 동결\u003cbr>· CSV 6종의 \u003cstrong>컬럼 정의·DB 스키마 매핑은 하단 부록 표\u003c/strong> 참조\u003cbr>\u003cspan class=\"basis\">근거: 구분회계 [V11] · 기록 보존 [L6 §9] · ISMS 2.9.4(로그·접속기록)·2.6.3(표시 최소화)\u003c/span>\u003c/div>\n        \u003cdiv class=\"itm-nav\">\u003cspan class=\"nav-tag\">화면 이동 · 인터랙션\u003c/span>\n          \u003cdiv class=\"nav-row\">\u003cspan class=\"nav-el\">CSV 다운로드 6종\u003c/span>\u003cspan class=\"nav-act\">클릭\u003c/span>\u003cspan class=\"nav-to stay\">파일 다운로드 · 화면 이동 없음 · 열람 기록(⑥)에 감사기록\u003c/span>\u003c/div>\n        \u003c/div>\n      \u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"itm\" data-idx=\"3\">\n      \u003cdiv class=\"num\">4\u003c/div>\n      \u003cdiv>\n        \u003cdiv class=\"itm-title\">관리 메뉴 (홈·설정 2탭)\u003cspan class=\"req\">필수\u003c/span>\u003c/div>\n        \u003cdiv class=\"itm-desc\">· 관리자 메뉴는 \u003cstrong>홈·설정 2탭\u003c/strong>\u003cbr>· 관리자 행위는 PAM 전용세션·녹화 대상 — 내부 정책으로 운영, 화면에는 미표기 · 권한 분기별 재검토\u003cbr>\u003cspan class=\"basis\">근거: ISMS 2.6 · PAM\u003c/span>\u003c/div>\n        \u003cdiv class=\"itm-nav\">\u003cspan class=\"nav-tag\">화면 이동 · 인터랙션\u003c/span>\n          \u003cdiv class=\"nav-row\">\u003cspan class=\"nav-el\">관리 메뉴 '설정' 탭\u003c/span>\u003cspan class=\"nav-act\">클릭\u003c/span>\u003cspan class=\"nav-to\">\u003cstrong>설정(ADM-03)\u003c/strong>\u003c/span>\u003c/div>\n        \u003c/div>\n      \u003c/div>\n    \u003c/div>\n  \u003c/div>\n\n\u003c/div>\n\n\u003csection class=\"footer-note\" style=\"padding-bottom:0;\">\n  \u003cdiv class=\"note-card\">\n    \u003cdiv class=\"note-title\">상세내용\u003c/div>\n    \u003cdiv class=\"detail-grid\" id=\"detailCol\">\n      \u003cdiv class=\"dtl\" data-idx=\"0\">\n        \u003cdiv class=\"detail-label\">\u003cspan class=\"dtl-num\">1\u003c/span>구 화면 귀속 이관\u003c/div>\n      \u003cdiv class=\"dtl-body\">\u003cspan class=\"box\">· 심사 큐(구 ADM-07) → 처리함의 승인 행\u003cbr>· 시장감시·알람함(구 ADM-02) → 이상거래·월렛/키 워닝 행\u003cbr>· 격리·동결(구 ADM-08) → 입금 예외 행\u003cbr>· 계정 잠금·재이행(구 ADM-06) → 잠금·KYC 행 (초대·상태 전이는 설정 ADM-03)\u003cbr>· STR 검토 처리 후 작성·보고는 별도 AML 시스템 — 작성자↔보고책임자 분리(자기검증 방지), FIU 보고·5년 보존\u003cbr>· \u003cspan class=\"red\">[확인필요]\u003c/span> 24×365 상시 확인 주체·당직 운영 방식 — toast+처리함은 상시 확인 주체 전제에서 성립\u003c/span>\u003c/div>\n      \u003c/div>\n      \u003cdiv class=\"dtl\" data-idx=\"1\">\n        \u003cdiv class=\"detail-label\">\u003cspan class=\"dtl-num\">2\u003c/span>집행 대기 상태 흐름\u003c/div>\n      \u003cdiv class=\"dtl-body\">\u003cspan class=\"box\">승인(처리함) → 집행 대기 → 집행 명세(Excel) 다운로드 → 콜드 2인 서명·집행(커스터디 절차) → txhash 입력 → 온체인 대사 일치 → 완료 반영\u003cbr>· txhash 불일치·미확인 시 완료 처리 불가 — 처리함 워닝으로 회송\u003cbr>· 서명 시스템 장애 시 BCP/DR — 정산 일시 중지 공지(예외 F6)\u003cbr>· 긴급 시 승인을 멈추면 집행도 멈춤 — 별도 긴급정지 버튼 없음(ISMS 2.11.1)\u003c/span>\u003c/div>\n      \u003c/div>\n      \u003cdiv class=\"dtl\" data-idx=\"2\">\n        \u003cdiv class=\"detail-label\">\u003cspan class=\"dtl-num\">3\u003c/span>CSV 6종 원천\u003c/div>\n      \u003cdiv class=\"dtl-body\">\u003cspan class=\"box\">· 기관-가입자: 구 ADM-06 ORG 목록\u003cbr>· 거래 요청: 구 ADM-07 큐·처리 이력\u003cbr>· 통합 거래: 구 ADM-04 통합 로그\u003cbr>· 구분회계·3면 대사: 구 ADM-04 집계 (EXC-04·BRK-05 발생분과 정합)\u003cbr>· 열람 기록: 구 ADM-05\u003cbr>· 원본은 WORM·해시무결성·NTP 보존 — 거래 15년·AML 5년, 화면·CSV는 조회 전용(원장 직접 변경 기능 없음)\u003cbr>· 컬럼 정의는 하단 부록 표 — DB 스키마 v0.7(DB스키마_한글판_20260902) 매핑\u003c/span>\u003c/div>\n      \u003c/div>\n    \u003c/div>\n  \u003c/div>\n\u003c/section>\n\n\u003csection class=\"footer-note\">\n  \u003cdiv class=\"note-card\">\n    \u003cdiv class=\"note-title\">비고\u003c/div>\n    \u003cdiv class=\"note-body\">\n      · DSRV 내부 관리자 화면(고객사 노출 없음). 어드민은 \u003cstrong>2화면(ADM-02 홈 · ADM-03 설정)\u003c/strong> — 처리할 일만 알람·워닝 처리함, 조회성 데이터는 CSV 다운로드 6종.\u003cbr>\n      · \u003cstrong>[방어 핵심]\u003c/strong> 자동검증은 1차 필터일 뿐, 승인·보류·거절은 전부 사람의 판단 — \"자동체결·자동심사 아님\" 소명. 본인 기안 자기승인 차단(DSRV 내부 직무분리)으로 담보.\u003cbr>\n      · 예외케이스 귀속: B1·B2(입금 격리·동결) · B6(스윕) · E3·E4·E7(심사) · F6(서명 장애) · H3·H4(출금) · X3(대사 불일치) → 이 화면 처리함 / A1~A6(온보딩·계정)은 ADM-03과 분담.\u003cbr>\n      · 연결: 유입 EXC-03·BRK-04·AUTH-01(잠금)·입금 감시 / 정책값·기관 관리는 설정(ADM-03) / 처리 결과는 고객 화면에 상태로만 반영(STR 누설 금지)\n    \u003c/div>\n  \u003c/div>\n\u003c/section>\n\n\u003csection class=\"footer-note\" style=\"padding-top:0;\">\n  \u003cdiv class=\"note-card\">\n    \u003cdiv class=\"note-title\">부록 — 데이터 다운로드 CSV 6종 컬럼 정의 (DB 스키마 매핑)\u003c/div>\n    \u003cdiv class=\"note-body\" style=\"margin-bottom:14px;\">\n      · 원천: \u003cstrong>DB스키마_한글판_20260902 (v0.7 · 2026-09-02)\u003c/strong> — 기획 참고용 초안 기준, 실제 컬럼·타입은 개발 설계 시 확정\u003cbr>\n      · 표기: \u003cspan style=\"color:#7c3aed;font-weight:700;\">파생\u003c/span> = 저장 필드가 아닌 계산값 · \u003cspan style=\"color:#b45309;font-weight:700;\">[스키마 보완]\u003c/span> = 현행 스키마에 원천 필드 없음 → 스키마 개정 시 반영 필요 (v0.7 기준 잔여 없음 — 종전 6건은 v0.6에서 보완 완료)\u003cbr>\n      · 공통: 실명·연락처·이메일 등 개인식별정보는 CSV에서도 마스킹 · 모든 다운로드는 열람 기록(⑥)에 감사 기록\n    \u003c/div>\n    \u003cdiv class=\"appx-grid\">\n\n      \u003cdiv class=\"appx\">\n        \u003cdiv class=\"at\">① 기관-가입자 목록\u003c/div>\n        \u003cdiv class=\"as\">ORG · USER · KYC_RECORD\u003c/div>\n        \u003ctable class=\"tbl\">\n          \u003cthead>\u003ctr>\u003cth>컬럼\u003c/th>\u003cth>원천 (테이블.필드)\u003c/th>\u003cth>비고\u003c/th>\u003c/tr>\u003c/thead>\n          \u003ctbody>\n            \u003ctr>\u003ctd>고객사 ID\u003c/td>\u003ctd class=\"src\">ORG.org_id\u003c/td>\u003ctd>ORG-NNNN\u003c/td>\u003c/tr>\n            \u003ctr>\u003ctd>상호\u003c/td>\u003ctd class=\"src\">ORG.name\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\n            \u003ctr>\u003ctd>계약 상태\u003c/td>\u003ctd class=\"src\">ORG.contract_status\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\n            \u003ctr>\u003ctd>한도등급\u003c/td>\u003ctd class=\"src\">ORG.grade\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\n            \u003ctr>\u003ctd>KYC 상태\u003c/td>\u003ctd class=\"src\">ORG.kyc_status\u003c/td>\u003ctd>승인/심사중/거절\u003c/td>\u003c/tr>\n            \u003ctr>\u003ctd>확인 수준\u003c/td>\u003ctd class=\"src\">KYC_RECORD.level\u003c/td>\u003ctd>CDD/EDD\u003c/td>\u003c/tr>\n            \u003ctr>\u003ctd>위험등급\u003c/td>\u003ctd class=\"src\">KYC_RECORD.risk_rating\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\n            \u003ctr>\u003ctd>PEP 여부\u003c/td>\u003ctd class=\"src\">KYC_RECORD.pep_flag\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\n            \u003ctr>\u003ctd>실제소유자 확인\u003c/td>\u003ctd class=\"src\">ORG.rbo_verified\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\n            \u003ctr>\u003ctd>KYC 확인일\u003c/td>\u003ctd class=\"src\">KYC_RECORD.verified_at\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\n            \u003ctr>\u003ctd>재이행 도래일\u003c/td>\u003ctd class=\"src\">KYC_RECORD.next_review_at\u003c/td>\u003ctd>위험등급별 고1·중2·저3년 + 이벤트 트리거\u003c/td>\u003c/tr>\n            \u003ctr>\u003ctd>가입자 계정·역할\u003c/td>\u003ctd class=\"src\">USER.user_id · role\u003c/td>\u003ctd>기관당 1명\u003c/td>\u003c/tr>\n            \u003ctr>\u003ctd>이메일\u003c/td>\u003ctd class=\"src\">USER.email\u003c/td>\u003ctd>마스킹\u003c/td>\u003c/tr>\n            \u003ctr>\u003ctd>MFA 사용\u003c/td>\u003ctd class=\"src\">USER.mfa_enabled\u003c/td>\u003ctd>\u003c/td>\u003c/
