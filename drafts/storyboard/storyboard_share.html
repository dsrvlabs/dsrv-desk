량 필드\u003c/span>\u003cspan class=\"nav-act\">키 입력마다 검증(포커스 아웃 대기 없음)\u003c/span>\u003cspan class=\"nav-to stay\">정상 → 경고 제거·[거래 요청] 활성 / 초과 → 인라인 경고 ③ 또는 ④ 노출·[거래 요청] 비활성\u003c/span>\u003c/div>\n          \u003cdiv class=\"nav-row\">\u003cspan class=\"nav-el\">수량 필드 (자산 미선택)\u003c/span>\u003cspan class=\"nav-act\">보내는·받는 자산 중 하나라도 미선택\u003c/span>\u003cspan class=\"nav-to stay\">필드 비활성 · 클릭 시 인라인 안내 \"자산을 먼저 선택해 주세요\"\u003c/span>\u003c/div>\n        \u003c/div>\n      \u003c/div>\n    \u003c/div>\n\n    \u003cdiv class=\"itm\" data-idx=\"3\">\n      \u003cdiv class=\"num\">4\u003c/div>\n      \u003cdiv>\n        \u003cdiv class=\"itm-title\">교환 가능 풀 · 참고 비율 · 예상 받는 수량 · 스프레드 (표시 전용)\u003c/div>\n        \u003cdiv class=\"itm-desc\">· 클릭 요소 없음 · 4개 값은 받는 자산 선택 시 조회, 이후 화면 체류 중 \u003cstrong>주기 갱신\u003c/strong> — 주기 \u003cspan style=\"color:#b45309;\">[확인필요: ADM-03 반영주기]\u003c/span>\u003cbr>· 교환 가능 풀: 「{수량} {받는자산}」 · 0이면 항목 3 ⑤ 상태\u003cbr>· 교환비율(참고): notation 비율 규칙 — 스테이블 페어 {받는}/{주는} 4자리 · ETH 페어 {스테이블}/ETH 2자리 · 확정 비율은 EXC-02 제시 시점 값(이 값과 다를 수 있음 — 안내 문구 상시)\u003cbr>· 예상 받는 수량 = 보내는 수량 × 참고 비율(ETH 페어 방향에 따라 ÷) → 받는 자산 자릿수로 절사 · 수량 빈칸이면 \"—\"\u003cbr>· 스프레드: ADM-03 고정값 % 소수 2자리 — 별도 수수료 없음(비용 구조 사전 고지, 상세 3)\u003cbr>· 로딩 \"불러오는 중…\"(3초 초과 → 오류) · 조회 실패 시 값 \"—\" + 상단 배너 \"일시적인 오류입니다…\" + [거래 요청] 비활성\u003cbr>\u003cspan class=\"basis\">근거 L6 이용자보호(설명의무) · [확인필요] 풀 정의 — 09 §8\u003c/span>\u003c/div>\n      \u003c/div>\n    \u003c/div>\n\n    \u003cdiv class=\"itm\" data-idx=\"4\">\n      \u003cdiv class=\"num\">5\u003c/div>\n      \u003cdiv>\n        \u003cdiv class=\"itm-title\">성격 고지 (표시 전용)\u003c/div>\n        \u003cdiv class=\"itm-desc\">· 고정 문구 · 클릭 없음 · 문구 변경은 법무 확인 후(상세 4 금지 표현)\u003cbr>\u003cspan class=\"basis\">근거 09 §0 line 51 ②⑤ · V2\u003c/span>\u003c/div>\n      \u003c/div>\n    \u003c/div>\n\n    \u003cdiv class=\"itm\" data-idx=\"5\">\n      \u003cdiv class=\"num\">6\u003c/div>\n      \u003cdiv>\n        \u003cdiv class=\"itm-title\">[거래 요청] 버튼\u003cspan class=\"req\">필수\u003c/span>\u003c/div>\n        \u003cdiv class=\"itm-desc\">· primary · 기안자(가입자) 단독 실행 — 구속력 없음(요청 접수 단계), 별도 승인 없음, \u003cstrong>확인 다이얼로그 없음\u003c/strong>\u003cbr>· 클릭 즉시 시스템이 비율을 자동 산정(요청 시점 외부지표 + ADM-03 고정 스프레드 · 2026-09-02 확정)해 EXC-02 진입 · 자동인 것은 산정까지, 체결은 수락·승인·수동 집행으로 분리\u003cbr>\u003cspan class=\"basis\">근거 F-4 · 09 §0 나목 견적 산정(2026-09-02)\u003c/span>\u003c/div>\n        \u003cdiv class=\"itm-nav\">\u003cspan class=\"nav-tag\">화면 이동 · 인터랙션\u003c/span>\n          \u003cdiv class=\"nav-row\">\u003cspan class=\"nav-el\">[거래 요청] — 활성 조건\u003c/span>\u003cspan class=\"nav-act\">다음이 모두 아님: ①보내는·받는 자산 미선택 ②수량 빈칸·0 ③한도 초과 경고 노출 중 ④풀 초과 경고 노출 중 ⑤풀 0 ⑥KYC 예외 배너 노출 중 ⑦풀·비율 조회 실패\u003c/span>\u003cspan class=\"nav-to stay\">하나라도 해당 → 회색 비활성(공통 UI 규격) · 사유는 툴팁이 아니라 해당 위치 인라인 경고로 이미 노출\u003c/span>\u003c/div>\n          \u003cdiv class=\"nav-row\">\u003cspan class=\"nav-el\">[거래 요청] — 클릭(활성)\u003c/span>\u003cspan class=\"nav-act\">클릭 → 버튼 라벨 \"산정 중…\"·비활성(중복 클릭 차단) → 요청번호 EXC-YYYYMMDD-NNNN 채번\u003c/span>\u003cspan class=\"nav-to\">\u003cstrong>비율 확인·수락(EXC-02)\u003c/strong> — 자동 산정 즉시 진입(대기·담당자 개입 없음)\u003c/span>\u003c/div>\n          \u003cdiv class=\"nav-row\">\u003cspan class=\"nav-el\">[거래 요청] — 실패\u003c/span>\u003cspan class=\"nav-act\">산정 실패(시세 소스 장애) / 요청 시점 풀 재검증 실패\u003c/span>\u003cspan class=\"nav-to stay\">화면 잔류 · 장애 → 상단 배너 \"일시적인 오류입니다. 잠시 후 다시 시도해 주세요\" / 풀 부족 → 항목 3 ④ 경고 재노출 · 버튼 라벨 복귀\u003c/span>\u003c/div>\n        \u003c/div>\n      \u003c/div>\n    \u003c/div>\n\n    \u003cdiv class=\"itm\" data-idx=\"6\">\n      \u003cdiv class=\"num\">7\u003c/div>\n      \u003cdiv>\n        \u003cdiv class=\"itm-title\">KYC 예외 배너 (조건부 노출)\u003c/div>\n        \u003cdiv class=\"itm-desc\">· 노출 조건: 기관 KYC 상태가 '활성'이 아닐 때(ADM-03 KYC 상태 — 심사중(EDD)·일시제한·동결) · 정상 시 배너 없음\u003cbr>· 노출 중: [거래 요청] 비활성(항목 6 ⑥) · 자산·수량 입력은 가능(조회만) · 내부 사유·AML 심사 내용 미노출(공통 UI 규격 오류 문구 ③)\u003cbr>· 문구 고정 · 닫기(×) 없음 · '이메일로 문의' — 링크(mailto) 여부·주소 \u003cspan style=\"color:#b45309;\">[확인필요]\u003c/span>\u003cbr>\u003cspan class=\"basis\">근거 G-3 · 공통 UI 규격 권한·상태 게이팅\u003c/span>\u003c/div>\n        \u003cdiv class=\"itm-nav\">\u003cspan class=\"nav-tag\">화면 이동 · 인터랙션\u003c/span>\n          \u003cdiv class=\"nav-row\">\u003cspan class=\"nav-el\">배너\u003c/span>\u003cspan class=\"nav-act\">클릭\u003c/span>\u003cspan class=\"nav-to stay\">무반응(표시 전용) · 상태가 '활성'으로 바뀌면 다음 진입 시 배너 제거·버튼 활성\u003c/span>\u003c/div>\n        \u003c/div>\n      \u003c/div>\n    \u003c/div>\n  \u003c/div>\n\n\u003c/div>\n\n\u003csection class=\"footer-note\" style=\"padding-bottom:0;\">\n  \u003cdiv class=\"note-card\">\n    \u003cdiv class=\"note-title\">상세내용\u003c/div>\n    \u003cdiv class=\"detail-grid\" id=\"detailCol\">\n      \u003cdiv class=\"dtl\" data-idx=\"0\">\n        \u003cdiv class=\"detail-label\">\u003cspan class=\"dtl-num\">1\u003c/span>페어 성격\u003c/div>\n      \u003cdiv class=\"dtl-body\">\u003cspan class=\"box\">· USDC ↔ USDT : \u003cstrong>동일통화(USD연동)\u003c/strong> = 디페그/1:1 기준, 가격 거의 동일\u003cbr>· ETH ↔ USDC / ETH ↔ USDT : \u003cstrong>코인↔스테이블\u003c/strong> = 외부지표 시세 기준(변동성) — 견적 유효시간·이탈 임계 민감 \u003cspan class=\"red\">[확인필요]\u003c/span>\u003cbr>· \u003cspan class=\"red\">[전제 변경 2026-09-02]\u003c/span> ETH 재편입 — '전부 스테이블코인' 소명 논거 소멸, 구조 통제(자기재고·수동집행·외부지표 스프레드·비MM)로 소명 · JPYSC 미취급 유지\u003c/span>\u003c/div>\n      \u003c/div>\n      \u003cdiv class=\"dtl\" data-idx=\"1\">\n        \u003cdiv class=\"detail-label\">\u003cspan class=\"dtl-num\">2\u003c/span>자산 선택 순서 강제 이유\u003c/div>\n      \u003cdiv class=\"dtl-body\">\u003cspan class=\"box\">· 동일 자산 쌍을 검증·오류 문구로 막는 대신 \u003cstrong>목록에서 제외\u003c/strong> — 오류 상태 1종 감소, 개발·디자인 단순화(2026-09-02 결정)\u003cbr>· 보내는 자산이 수량 단위·자릿수·한도 환산의 기준이므로 먼저 확정\u003cbr>· 같은 규칙을 BRK-02(거래의향 등록)에 적용\u003c/span>\u003c/div>\n      \u003c/div>\n      \u003cdiv class=\"dtl\" data-idx=\"2\">\n        \u003cdiv class=\"detail-label\">\u003cspan class=\"dtl-num\">3\u003c/span>한도·풀 초과 처리\u003c/div>\n      \u003cdiv class=\"dtl-body\">\u003cspan class=\"box\">· 유효 상한 = min(1회 한도 1,000 USD 상당의 해당 자산 환산 수량, 가용 풀) — 두 조건 모두 충족해야 요청 가능 · 환산 시세·시점 = ADM-03 시세 소스 · 요청 시점(입력 중 실시간 재계산)\u003cbr>· 풀 = 0 : 수량 입력 비활성, \u003cspan class=\"red\">\"현재 교환 불가\"\u003c/span> 표기\u003cbr>· 풀 값 출처 = 커스터디 운영자산 잔고(기존 시스템) + ADM-03 정책 한도 — 별도 지갑 화면 신규 개발 없음\u003cbr>· 일간·월간 누적 한도 미정 \u003cspan class=\"red\">[확인필요]\u003c/span>\u003c/span>\u003c/div>\n      \u003c/div>\n      \u003cdiv class=\"dtl\" data-idx=\"3\">\n        \u003cdiv class=\"detail-label\">\u003cspan class=\"dtl-num\">4\u003c/span>비용 구조 고지 · 계산 규칙\u003c/div>\n      \u003cdiv class=\"dtl-body\">\u003cspan class=\"box\">· 나목 교환은 \u003cstrong>별도 수수료 없음\u003c/strong> — 비용은 스프레드(% 고정)로 비율에 내재, 적용 비율은 EXC-02에서 고시 후 수락\u003cbr>· 예상 받는 수량은 참고값 — 900 USDC × 0.9998 = 899.82 USDT(절사) · ETH 페어 예: 0.3 ETH × 3,184.00 = 955.20 USDC / 955.20 USDC ÷ 3,184.00 = 0.3 ETH\u003cbr>· 마목 중개 수수료(거래액 1% 고정 · BRK-03/04/07 사전 고시)와 혼동 방지 문구\u003c/span>\u003c/div>\n      \u003c/div>\n      \u003cdiv class=\"dtl\" data-idx=\"4\">\n        \u003cdiv class=\"detail-label\">\u003cspan class=\"dtl-num\">5\u003c/span>라벨 금지 · UI 문구 통제\u003c/div>\n      \u003cdiv class=\"dtl-body\">\u003cspan class=\"box\">금지 표현: '공식 LP', '마켓메이커', '플랫폼 보증', '최저가 보장' 등\u003cbr>허용: 'DSRV가 상대방인 교환', '외부지표 기준 스프레드'\u003cbr>\u003cspan class=\"red\">평판 뱃지 미사용(2026-08-31 결정)\u003c/span>\u003c/span>\u003c/div>\n      \u003c/div>\n      \u003cdiv class=\"dtl\" data-idx=\"5\">\n        \u003cdiv class=\"detail-label\">\u003cspan class=\"dtl-num\">6\u003c/span>요청 이후 상태\u003c/div>\n      \u003cdiv class=\"dtl-body\">\u003cspan class=\"box\">· 상태: 요청됨 → 비율 제시(EXC-02, 시스템 자동 산정) → 수락 시 \u003cstrong>DSRV 거래 진행(EXC-03, 약 2영업일)\u003c/strong>\u003cbr>· 진행 중 건은 홈(DASH-01) 거래현황에서 진입 — 별도 승인 큐 화면 없음\u003cbr>· 수락(EXC-02) 이후 별도 고객사 승인 단계 없음 — 고객사 측 통제는 DSRV 수탁 콜드월렛의 기존 다중승인 이체로 수행(ISMS 2.2.2)\u003c/span>\u003c/div>\n      \u003c/div>\n      \u003cdiv class=\"dtl\" data-idx=\"6\">\n        \u003cdiv class=\"detail-label\">\u003cspan class=\"dtl-num\">7\u003c/span>KYC 상태 → 배너 매핑\u003c/div>\n      \u003cdiv class=\"dtl-body\">\u003cspan class=\"box\">· ADM-03 기관 KYC 상태: 활성(배너 없음) / 심사중(EDD)·일시제한·동결(배너 노출·요청 차단) — 상태 라벨은 states.html 도메인 상태와 동일 \u003cspan class=\"red\">[확인필요: 상태별 문구 차등 여부]\u003c/span>\u003cbr>· 배너는 EXC-01·BRK-02·BRK-03(행위 화면)에 동일 규격으로 노출, DASH-01에는 요약 배너 \u003cspan class=\"red\">[확인필요]\u003c/span>\u003c/span>\u003c/div>\n      \u003c/div>\n    \u003c/div>\n  \u003c/div>\n\u003c/section>\n\n\u003csection class=\"footer-note\">\n  \u003cdiv class=\"note-card\">\n    \u003cdiv class=\"note-title\">비고\u003c/div>\n    \u003cdiv class=\"note-body\">\n      · \u003cstrong>나목(DSRV가 상대방인 교환)\u003c/strong> 진입점. 가격은 여기서 확정되지 않고, 시스템이 EXC-02에서 외부지표+고정 스프레드로 \u003cstrong>건별 비율을 자동 산정해 고시\u003c/strong>(2026-09-02 확정).\u003cbr>\n      · \u003cstrong>[방어 핵심]\u003c/strong> 이 화면은 \"요청서 접수\"까지만 수행 — 자동체결·오더북·상시 양방향 호가·API 자동집행 없음. 직무분리는 커스터디 이체 승인으로 충족.\u003cbr>\n      · 2026-09-02 설명 형식 개정 표본: 핀 = 조작 요소 단위(드롭다운 2·입력 1·버튼 1·표시 2·배너 1), 버튼 행 = 활성 조건 / 클릭 후 / 실패 3행.\u003cbr>\n      · \u003cspan style=\"color:#991b1b;\">[확인필요]\u003c/span> 풀 정의·반영주기(09 §8) · 일간·월간 누적 한도 · KYC 예외 배너 문의 주소·mailto 여부 · 상태별 배너 문구 차등.\u003cbr>\n      · 다음 화면: 비율 확인·수락 (EXC-02)\n    \u003c/div>\n  \u003c/div>\n\u003c/section>\n\n\u003cscript src=\"screen.js\">\u003c/script>\n\u003c/body>\n\u003c/html>\n", "exc-02.html": "\u003c!DOCTYPE html>\n\u003chtml lang=\"ko\">\n\u003chead>\n\u003cmeta charset=\"UTF-8\">\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n\u003ctitle>화면기획 — 비율 확인·수락\u003c/title>\n\u003clink rel=\"stylesheet\" href=\"screen.css\">\n\u003c/head>\n\u003cbody>\n\n\u003cheader class=\"header\">\n  \u003cdiv class=\"crumb\">\u003cspan>나목 교환\u003c/span>\u003cspan class=\"s\">›\u003c/span>\u003cspan>교환하기\u003c/span>\u003cspan class=\"s\">›\u003c/span>\u003cspan>비율 확인·수락\u003c/span>\u003c/div>\n  \u003ch1 class=\"title\">비율 확인·수락\u003c/h1>\n  \u003cspan class=\"sid\">EXC-02\u003c/span>\n  \u003cspan class=\"defense\">⚠ 가격 고시 화면 · 가격형성 아님 소명\u003c/span>\n\u003c/header>\n\n\u003cdiv class=\"main\">\n  \u003cdiv class=\"screen-panel\">\n    \u003cdiv style=\"position:relative;display:flex;\">\n      \u003cdiv class=\"labels\" id=\"labels\">\n        \u003cdiv class=\"lbl\">\u003cspan class=\"lbl-text\">전역\u003c/span>\u003c/div>\n        \u003cdiv class=\"lbl\">\u003cspan class=\"lbl-text\">견적 요약\u003c/span>\u003c/div>\n        \u003cdiv class=\"lbl\">\u003cspan class=\"lbl-text\">비율·근거\u003cbr>고시\u003c/span>\u003c/div>\n        \u003cdiv class=\"lbl\">\u003cspan class=\"lbl-text\">수락 기한\u003c/span>\u003c/div>\n        \u003cdiv class=\"lbl\">\u003cspan class=\"lbl-text\">성격 고지\u003c/span>\u003c/div>\n        \u003cdiv class=\"lbl\">\u003cspan class=\"lbl-text\">액션·분기\u003c/span>\u003c/div>\n      \u003c/div>\n      \u003csvg id=\"bracketSvg\" width=\"24\" style=\"flex-shrink:0;overflow:visible;\">\u003c/svg>\n    \u003c/div>\n\n    \u003cdiv class=\"frame\" id=\"frame\">\n      \u003cdiv class=\"zone\" data-idx=\"\">\n        \u003cdiv class=\"zone-highlight\">\u003c/div>\n        \u003cdiv class=\"c-top\" style=\"border-radius:8px;\">\n          \u003cspan class=\"brand\">DSRV Desk\u003c/span>\n          \u003cspan class=\"meta\">\u003cspan class=\"c-badge\">A자산운용\u003c/span>\u003c/span>\n        \u003c/div>\n      \u003c/div>\n\n      \u003cdiv class=\"zone\" data-idx=\"\">\n        \u003cdiv class=\"zone-highlight\">\u003c/div>\n        \u003cdiv class=\"kv\">\u003cspan class=\"k\">요청 건\u003c/span>\u003cspan class=\"v\">EXC-20260831-0142\u003c/span>\u003c/div>\n        \u003cdiv class=\"kv\">\u003cspan class=\"k\">교환쌍 · 방향\u003c/span>\u003cspan class=\"v\">USDC → USDT\u003c/span>\u003c/div>\n        \u003cdiv class=\"kv\">\u003cspan class=\"k\">보내는 수량\u003c/span>\u003cspan class=\"v\">100,000 USDC\u003c/span>\u003c/div>\n      \u003c/div>\n\n      \u003cdiv class=\"zone\" data-idx=\"0\">\n        \u003cdiv class=\"zone-highlight\">\u003c/div>\n        \u003cdiv class=\"item-area\" data-highlight=\"0\" style=\"position:relative;padding:6px;border-radius:8px;\">\n          \u003cdiv class=\"pin\" data-idx=\"0\" style=\"top:-4px;right:-4px;\">1\u003c/div>\n          \u003cdiv class=\"zone-title\">DSRV 제시 비율\u003c/div>\n          \u003cdiv style=\"font-size:22px;font-weight:800;color:#0f172a;font-family:var(--mono);\">0.9989 USDT/USDC\u003c/div>\n          \u003cdiv style=\"font-size:13px;color:#334155;margin:6px 0 10px;\">받는 수량(예상) \u003cstrong>≈ 99,890 USDT\u003c/strong>\u003c/div>\n          \u003cdiv class=\"kv\">\u003cspan class=\"k\">스프레드\u003c/span>\u003cspan class=\"v\">0.10%\u003c/span>\u003c/div>\n        \u003c/div>\n      \u003c/div>\n\n      \u003cdiv class=\"zone\" data-idx=\"1\">\n        \u003cdiv class=\"zone-highlight\">\u003c/div>\n        \u003cdiv class=\"item-area\" data-highlight=\"1\" style=\"position:relative;padding:6px;border-radius:8px;\">\n          \u003cdiv class=\"pin\" data-idx=\"1\" style=\"top:-4px;right:-4px;\">2\u003c/div>\n          \u003cdiv style=\"display:flex;align-items:center;justify-content:space-between;\">\n            \u003cspan style=\"font-size:12px;color:#334155;font-weight:600;\">수락 기한 (만료 시 비율 무효 → 재요청)\u003c/span>\n            \u003cspan style=\"font-size:15px;font-weight:800;color:#dc2626;font-family:var(--mono);\">02:00\u003c/span>\n          \u003c/div>\n        \u003c/div>\n      \u003c/div>\n\n      \u003cdiv class=\"zone\" data-idx=\"2\">\n        \u003cdiv class=\"zone-highlight\">\u003c/div>\n        \u003cdiv class=\"item-area\" data-highlight=\"2\" style=\"position:relative;padding:6px;border-radius:8px;\">\n          \u003cdiv class=\"pin\" data-idx=\"2\" style=\"top:-4px;right:-4px;\">3\u003c/div>\n          \u003cdiv class=\"note-inline reg\">이 비율은 DSRV가 형성한 시세가 아니라, 외부지표에 사전 고시된 고정 스프레드를 가산해 건별로 계산한 값입니다. 교환 상대방은 DSRV입니다.\u003c/div>\n        \u003c/div>\n      \u003c/div>\n\n      \u003cdiv class=\"zone\" data-idx=\"3,4\">\n        \u003cdiv class=\"zone-highlight\">\u003c/div>\n        \u003cdiv class=\"item-area\" data-highlight=\"3\" style=\"position:relative;padding:6px;border-radius:8px;margin-bottom:10px;\">\n          \u003cdiv class=\"pin\" data-idx=\"3\" style=\"top:-4px;right:-4px;\">4\u003c/div>\n          \u003cdiv class=\"row\">\n            \u003cdiv class=\"btn primary\" style=\"flex:1;\">수락\u003c/div>\n            \u003cdiv class=\"btn ghost\" style=\"flex:.6;\">거절\u003c/div>\n          \u003c/div>\n        \u003c/div>\n        \u003cdiv class=\"item-area\" data-highlight=\"4\" style=\"position:relative;padding:6px;border-radius:8px;\">\n          \u003cdiv class=\"pin\" data-idx=\"4\" style=\"top:-4px;right:-4px;\">5\u003c/div>\n          \u003cdiv class=\"note-inline\">만료·스프레드 이탈·가용 풀 부족 시 이 건은 집행되지 않습니다 (재요청 필요).\u003c/div>\n        \u003c/div>\n      \u003c/div>\n    \u003c/div>\n  \u003c/div>\n\n  \u003csvg id=\"connSvg\" style=\"position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:10;overflow:visible;\">\u003c/svg>\n\n  \u003cdiv class=\"items\" id=\"items\">\n    \u003cdiv class=\"nav-global\">\n      \u003cdiv class=\"nav-global-title\">진입 · 전역 이동\u003c/div>\n      \u003cdiv class=\"nav-row\">\u003cspan class=\"nav-el\">상단 GNB(전 화면 공통)\u003c/span>\u003cspan class=\"nav-act\">대시보드/교환하기/교환게시판 메뉴 · 로고 클릭 — 목업에는 상단 요약만 표시\u003c/span>\u003cspan class=\"nav-to\">\u003cstrong>DASH-01 / EXC-01 / BRK-01\u003c/strong> (규칙: DASH-01 항목 5) · 미수락 이탈 시 기한 경과로 자동 만료\u003c/span>\u003c/div>\n      \u003cdiv class=\"nav-note\">· \u003cstrong>진입\u003c/strong>: 교환하기(EXC-01) [거래 요청] → 시스템 자동 산정 즉시 진입 (이 화면 진입 시점 기준으로 확정 비율 결정 · 대기·담당자 개입 없음)\u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"itm\" data-idx=\"0\">\n      \u003cdiv class=\"num\">1\u003c/div>\n      \u003cdiv>\n        \u003cdiv class=\"itm-title\">제시 비율·스프레드 고시\u003cspan class=\"req\">필수\u003c/span>\u003c/div>\n        \u003cdiv class=\"itm-desc\">· DSRV 제시 비율 + 스프레드율 고시 — 외부지표 소스 항목은 화면 미노출\u003cbr>· 비율은 \u003cstrong>시스템 자동 산정\u003c/strong>(2026-09-02 확정): 요청 시점 외부지표에 ADM-03 고정 스프레드 가산 — 담당자 수동 입력·재량 없음\u003cbr>· \u003cstrong>확정 비율은 이 화면 진입(제시) 시점 기준으로 결정\u003c/strong> — 그 시점의 외부지표에 고정 스프레드를 가산해 산정, EXC-01의 '교환비율'은 참고 표시일 뿐\u003cbr>· 산정 방식은 성격 고지 문구(항목 3)로 설명 · 소스 관리는 ADM-03(내부)\u003cbr>\u003cspan class=\"basis\">근거 V2 · 용어4 · 09 line 51 ①\u003c/span>\u003c/div>\n      \u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"itm\" data-idx=\"1\">\n      \u003cdiv class=\"num\">2\u003c/div>\n      \u003cdiv>\n        \u003cdiv class=\"itm-title\">수락 기한(견적 만료)\u003cspan class=\"req\">필수\u003c/span>\u003c/div>\n        \u003cdiv class=\"itm-desc\">· 유효시간 = \u003cstrong>수락까지의 기한\u003c/strong> — 기한 내 수락 시 비율 고정, 이후 DSRV 거래 진행·집행은 별도 진행(기한과 무관)\u003cbr>· 건별 요청에만 산정·제시(상시 자동호가·스트리밍 호가 아님)를 담보 · 만료 시 자동 무효 → 재요청\u003cbr>\u003cspan class=\"basis\">근거 V2 · 유효시간 수치 [확인필요]\u003c/span>\u003c/div>\n      \u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"itm\" data-idx=\"2\">\n      \u003cdiv class=\"num\">3\u003c/div>\n      \u003cdiv>\n        \u003cdiv class=\"itm-title\">\"자체 시세 아님 · DSRV 상대방\" 고지\u003cspan class=\"req\">필수\u003c/span>\u003c/div>\n        \u003cdiv class=\"itm-desc\">· 딜러/거래소 오인 방어 문구 상시 노출\u003cbr>\u003cspan class=\"basis\">근거 V2 · [로펌게이트] 문구 확정\u003c/span>\u003c/div>\n      \u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"itm\" data-idx=\"3\">\n      \u003cdiv class=\"num\">4\u003c/div>\n      \u003cdiv>\n        \u003cdiv class=\"itm-title\">수락 / 거절\u003cspan class=\"req\">필수\u003c/span>\u003c/div>\n        \u003cdiv class=\"itm-desc\">· 수락 = \u003cstrong>비율 고정 + DSRV 거래 진행\u003c/strong>(EXC-03) — 별도 고객사 승인 단계 없음\u003cbr>· 고정 후에도 집행 전 스프레드 이탈 시 집행 정지(항목 5) · 자동 확정 없음\u003cbr>· 재요청 버튼 없음 — 만료·거절 후 새 비율은 교환 요청(EXC-01)부터 다시\u003cbr>\u003cspan class=\"basis\">근거 F-1a\u003c/span>\u003c/div>\n        \u003cdiv class=\"itm-nav\">\u003cspan class=\"nav-tag\">화면 이동 · 인터랙션\u003c/span>\n          \u003cdiv class=\"nav-row\">\u003cspan class=\"nav-el\">[수락] 버튼\u003c/span>\u003cspan class=\"nav-act\">수락 기한 내 클릭 — 비율 고정, 별도 고객사 승인 없음\u003c/span>\u003cspan class=\"nav-to\">\u003cstrong>승인 진행(EXC-03)\u003c/strong> — DSRV 거래 진행 시작\u003c/span>\u003c/div>\n          \u003cdiv class=\"nav-row\">\u003cspan class=\"nav-el\">[거절] 버튼\u003c/span>\u003cspan class=\"nav-act\">클릭 — 이 건 종결(재요청 버튼 없음)\u003c/span>\u003cspan class=\"nav-to\">\u003cstrong>교환하기(EXC-01)\u003c/strong>로 회귀 — 새 요청부터 다시\u003c/span>\u003c/div>\n        \u003c/div>\n      \u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"itm\" data-idx=\"4\">\n      \u003cdiv class=\"num\">5\u003c/div>\n      \u003cdiv>\n        \u003cdiv class=\"itm-title\">이탈·만료·풀 부족 시 교환 불가\u003cspan class=\"req\">필수\u003c/span>\u003c/div>\n        \u003cdiv class=\"itm-desc\">· 스프레드 이탈 또는 가용 풀 부족 시 집행하지 않음\u003cbr>\u003cspan class=\"basis\">근거 09 line 51 ① · F-1a\u003c/span>\u003c/div>\n        \u003cdiv class=\"itm-nav\">\u003cspan class=\"nav-tag\">화면 이동 · 인터랙션\u003c/span>\n          \u003cdiv class=\"nav-row\">\u003cspan class=\"nav-el\">[수락] — 기한 만료 후\u003c/span>\u003cspan class=\"nav-act\">클릭 시 \"견적이 만료되었습니다\" — 비율 자동 무효\u003c/span>\u003cspan class=\"nav-to stay\">화면 잔류 · 새 비율은 \u003cstrong>교환하기(EXC-01)\u003c/strong>에서 재요청\u003c/span>\u003c/div>\n        \u003c/div>\n      \u003c/div>\n    \u003c/div>\n  \u003c/div>\n\n\u003c/div>\n\n\u003csection class=\"footer-note\" style=\"padding-bottom:0;\">\n  \u003cdiv class=\"note-card\">\n    \u003cdiv class=\"note-title\">상세내용\u003c/div>\n    \u003cdiv class=\"detail-grid\" id=\"detailCol\">\n      \u003cdiv class=\"dtl\" data-idx=\"0\">\n        \u003cdiv class=\"detail-label\">\u003cspan class=\"dtl-num\">1\u003c/span>외부지표 소스 — 내부 관리 (화면 미노출)\u003c/div>\n      \u003cdiv class=\"dtl-body\">\n        \u003cspan class=\"box\">· 소스: \u003cstrong>업비트·빗썸·바이낸스\u003c/strong> 시세 — 조합 방식(중앙값·평균·우선순위) [확인필요]\u003cbr>· USDC↔USDT: 디페그/1:1 기준(동일통화) — 가격 거의 동일, 지표 1 근접\u003cbr>· ETH↔USDC · ETH↔USDT: 거래소 ETH 시세 기준 — 변동성 있음, 견적 유효시간 내 이탈 임계 적용\u003cbr>· JPYSC 미취급 — 환율지표 페어 없음\u003cbr>· 소스·스프레드율·갱신주기·이탈 임계는 \u003cstrong>ADM-03\u003c/strong> 단일 출처에서 관리\u003c/span>\n        \u003cspan style=\"display:block;margin-top:6px;\" class=\"red\">가격형성(시장가) 아님 — 외부지표에 스프레드만 가산\u003c/span>\n      \u003c/div>\n      \u003c/div>\n      \u003cdiv class=\"dtl\" data-idx=\"1\">\n        \u003cdiv class=\"detail-label\">\u003cspan class=\"dtl-num\">2\u003c/span>만료 처리\u003c/div>\n      \u003cdiv class=\"dtl-body\">\u003cspan class=\"box\">· 카운트다운 0 → 비율 자동 무효\u003cbr>· 만료 후 수락 시도: \u003cspan class=\"red\">\"견적이 만료되었습니다\"\u003c/span> → 새 비율은 EXC-01에서 재요청\u003cbr>· 수락 기한은 수락 행위에만 적용 — 이후 DSRV 거래 진행(약 2영업일)은 기한과 무관(진행 지연 리스크 분리)\u003c/span>\u003c/div>\n      \u003c/div>\n      \u003cdiv class=\"dtl\" data-idx=\"2\">\n        \u003cdiv class=\"detail-label\">\u003cspan class=\"dtl-num\">3\u003c/span>문구 통제 [로펌게이트]\u003c/div>\n      \u003cdiv class=\"dtl-body\">\u003cspan class=\"box\">'시세 제시 = 가격형성'으로 오인되지 않도록 문구 확정 필요. G0 사전면담 소명자료와 정합(09 §8).\u003c/span>\u003c/div>\n      \u003c/div>\n      \u003cdiv class=\"dtl\" data-idx=\"4\">\n        \u003cdiv class=\"detail-label\">\u003cspan class=\"dtl-num\">5\u003c/span>교환 불가 3분기\u003c/div>\n      \u003cdiv class=\"dtl-body\">\n        \u003cspan class=\"box\">① \u003cstrong>만료\u003c/strong>: 재요청\u003cbr>② \u003cstrong>스프레드 이탈\u003c/strong>: 지표 급변으로 임계 초과 → 집행 정지\u003cbr>③ \u003cstrong>풀 부족\u003c/strong>: 확정 시점 가용 풀 미달 → 집행 불가\u003c/span>\n      \u003c/div>\n      \u003c/div>\n    \u003c/div>\n  \u003c/div>\n\u003c/section>\n\n\u003csection class=\"footer-note\">\n  \u003cdiv class=\"note-card\">\n    \u003cdiv class=\"note-title\">비고\u003c/div>\n    \u003cdiv class=\"note-body\">\n      · \u003cstrong>[방어 핵심]\u003c/strong> \"DSRV가 가격을 만든다\"가 아니라 \"외부지표 + 사전 고시된 고정 스프레드로 시스템이 \u003cstrong>건별 비율을 자동 계산해 고시\u003c/strong>한다(사람의 재량 없음 = 가격형성 아님)\"를 증빙하는 화면. 스프레드·수락 기한·성격 고지를 화면에 노출.\u003cbr>\n      · 비율·스프레드·수락 기한·이탈 임계값의 \u003cstrong>단일 출처는 ADM-03\u003c/strong> — 이 화면은 그 값을 표출만.\u003cbr>\n      · \u003cspan style=\"color:#991b1b;\">[확인필요]\u003c/span> 수락 기한·스프레드 갱신주기·이탈 임계 수치 미확정(ADM-03의 120s 등은 예시값, 27 서비스flow).\u003cbr>\n      · 다음 화면: 승인 진행 (EXC-03)\n    \u003c/div>\n  \u003c/div>\n\u003c/section>\n\n\u003cscript src=\"screen.js\">\u003c/script>\n\u003c/body>\n\u003c/html>\n", "exc-03.html": "\u003c!DOCTYPE html>\n\u003chtml lang=\"ko\">\n\u003chead>\n\u003cmeta charset=\"UTF-8\">\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n\u003ctitle>화면기획 — 승인 진행\u003c/title>\n\u003clink rel=\"stylesheet\" href=\"screen.css\">\n\u003c/head>\n\u003cbody>\n\n\u003cheader class=\"header\">\n  \u003cdiv class=\"crumb\">\u003cspan>나목 교환\u003c/span>\u003cspan class=\"s\">›\u003c/span>\u003cspan>교환하기\u003c/span>\u003cspan class=\"s\">›\u003c/span>\u003cspan>승인 진행\u003c/span>\u003c/div>\n  \u003ch1 class=\"title\">승인 진행\u003c/h1>\n  \u003cspan class=\"sid\">EXC-03\u003c/span>\n  \u003cspan class=\"defense\">실질심사 · 자동 승인/거절 아님\u003c/span>\n\u003c/header>\n\n\u003cdiv class=\"main\">\n  \u003cdiv class=\"screen-panel\">\n    \u003cdiv style=\"position:relative;display:flex;\">\n      \u003cdiv class=\"labels\" id=\"labels\">\n        \u003cdiv class=\"lbl\">\u003cspan class=\"lbl-text\">전역\u003c/span>\u003c/div>\n        \u003cdiv class=\"lbl\">\u003cspan class=\"lbl-text\">거래 상태\u003c/span>\u003c/div>\n        \u003cdiv class=\"lbl\">\u003cspan class=\"lbl-text\">소요 안내\u003c/span>\u003c/div>\n        \u003cdiv class=\"lbl\">\u003cspan class=\"lbl-text\">요청 내역\u003c/span>\u003c/div>\n        \u003cdiv class=\"lbl\">\u003cspan class=\"lbl-text\">액션\u003c/span>\u003c/div>\n      \u003c/div>\n      \u003csvg id=\"bracketSvg\" width=\"24\" style=\"flex-shrink:0;overflow:visible;\">\u003c/svg>\n    \u003c/div>\n\n    \u003cdiv class=\"frame\" id=\"frame\">\n      \u003cdiv class=\"zone\" data-idx=\"\">\n        \u003cdiv class=\"zone-highlight\">\u003c/div>\n        \u003cdiv class=\"c-top\" style=\"border-radius:8px;\">\n          \u003cspan class=\"brand\">DSRV Desk\u003c/span>\n          \u003cspan class=\"meta\">\u003cspan class=\"c-badge\">A자산운용\u003c/span>\u003c/span>\n        \u003c/div>\n      \u003c/div>\n\n      \u003cdiv class=\"zone\" data-idx=\"0\">\n        \u003cdiv class=\"zone-highlight\">\u003c/div>\n        \u003cdiv class=\"item-area\" data-highlight=\"0\" style=\"position:relative;padding:6px;border-radius:8px;\">\n          \u003cdiv class=\"pin\" data-idx=\"0\" style=\"top:-4px;right:-4px;\">1\u003c/div>\n          \u003cdiv class=\"zone-title\">거래 상태\u003c/div>\n          \u003cdiv class=\"steps\" style=\"flex-wrap:wrap;gap:8px;\">\n            \u003cspan class=\"step done\">\u003cspan class=\"dot\">✓\u003c/span>비율 수락(기안)\u003c/span>\u003cspan class=\"arrow\">→\u003c/span>\n            \u003cspan class=\"step now\">\u003cspan class=\"dot\">2\u003c/span>DSRV 거래 진행중\u003c/span>\u003cspan class=\"arrow\">→\u003c/span>\n            \u003cspan class=\"step\">\u003cspan class=\"dot\">3\u003c/span>완료 / 보류\u003c/span>\n          \u003c/div>\n        \u003c/div>\n      \u003c/div>\n\n      \u003cdiv class=\"zone\" data-idx=\"1\">\n        \u003cdiv class=\"zone-highlight\">\u003c/div>\n        \u003cdiv class=\"item-area\" data-highlight=\"1\" style=\"position:relative;padding:6px;border-radius:8px;\">\n          \u003cdiv class=\"pin\" data-idx=\"1\" style=\"top:-4px;right:-4px;\">2\u003c/div>\n          \u003cdiv style=\"font-size:12px;color:#334155;background:#f8fafc;border:1px solid #e2e8f0;border-radius:8px;padding:10px 12px;\">\n            거래가 접수되었습니다. \u003cstrong>약 2영업일 소요됩니다.\u003c/strong>\u003cbr>\n            \u003cspan style=\"font-size:10.5px;color:#64748b;\">최종 상태(완료 / 심사 후 보류)는 이 화면과 거래 내역에서 확인할 수 있습니다.\u003c/span>\n          \u003c/div>\n        \u003c/div>\n      \u003c/div>\n\n      \u003cdiv class=\"zone\" data-idx=\"2\">\n        \u003cdiv class=\"zone-highlight\">\u003c/div>\n        \u003cdiv class=\"item-area\" data-highlight=\"2\" style=\"position:relative;padding:6px;border-radius:8px;\">\n          \u003cdiv class=\"pin\" data-idx=\"2\" style=\"top:-4px;right:-4px;\">3\u003c/div>\n          \u003cdiv class=\"zone-title\">교환거래 요청 내역\u003c/div>\n          \u003cdiv class=\"kv\">\u003cspan class=\"k\">요청번호\u003c/span>\u003cspan class=\"v\">EXC-20260831-0142\u003c/span>\u003c/div>\n          \u003cdiv class=\"kv\">\u003cspan class=\"k\">교환쌍 · 방향\u003c/span>\u003cspan class=\"v\">USDC → USDT\u003c/span>\u003c/div>\n          \u003cdiv class=\"kv\">\u003cspan class=\"k\">보내는 수량\u003c/span>\u003cspan class=\"v\">100,000 USDC\u003c/span>\u003c/div>\n          \u003cdiv class=\"kv\">\u003cspan class=\"k\">확정 비율\u003c/span>\u003cspan class=\"v\">0.9989 USDT/USDC\u003c/span>\u003c/div>\n          \u003cdiv class=\"kv\">\u003cspan class=\"k\">스프레드\u003c/span>\u003cspan class=\"v\">0.10%\u003c/span>\u003c/div>\n          \u003cdiv class=\"kv\">\u003cspan class=\"k\">요청 일시\u003c/span>\u003cspan class=\"v\">2026-08-31 14:02\u003c/span>\u003c/div>\n        \u003c/div>\n      \u003c/div>\n\n      \u003cdiv class=\"zone\" data-idx=\"3\">\n        \u003cdiv class=\"zone-highlight\">\u003c/div>\n        \u003cdiv class=\"item-area\" data-highlight=\"3\" style=\"position:relative;padding:6px;border-radius:8px;\">\n          \u003cdiv class=\"pin\" data-idx=\"3\" style=\"top:-8px;right:-4px;\">4\u003c/div>\n          \u003cdiv class=\"btn primary\">확인\u003c/div>\n        \u003c/div>\n      \u003c/div>\n\n    \u003c/div>\n  \u003c/div>\n\n  \u003csvg id=\"connSvg\" style=\"position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:10;overflow:visible;\">\u003c/svg>\n\n  \u003cdiv class=\"items\" id=\"items\">\n    \u003cdiv class=\"nav-global\">\n      \u003cdiv class=\"nav-global-title\">진입 · 전역 이동\u003c/div>\n      \u003cdiv class=\"nav-row\">\u003cspan class=\"nav-el\">상단 GNB(전 화면 공통)\u003c/span>\u003cspan class=\"nav-act\">대시보드/교환하기/교환게시판 메뉴 · 로고 클릭 — 목업에는 상단 요약만 표시\u003c/span>\u003cspan class=\"nav-to\">\u003cstrong>DASH-01 / EXC-01 / BRK-01\u003c/strong> (규칙: DASH-01 항목 5)\u003c/span>\u003c/div>\n      \u003cdiv class=\"nav-note\">· \u003cstrong>진입\u003c/strong>: 비율 확인·수락(EXC-02) [수락] 직후 / 진행 중 건은 대시보드(DASH-01) 거래 목록 행 클릭으로 재진입\u003cbr>\n      · 이 화면 내 승인·처리 액션 없음 — DSRV 내부 처리(승인·집행)는 어드민 홈(ADM-02) 처리함에서, 최종 상태는 내역·완료(EXC-04)에서 확인\u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"itm\" data-idx=\"0\">\n      \u003cdiv class=\"num\">1\u003c/div>\n      \u003cdiv>\n        \u003cdiv class=\"itm-title\">거래 상태 — 고객사 승인 단계 없음\u003cspan class=\"req\">필수\u003c/span>\u003c/div>\n        \u003cdiv class=\"itm-desc\">· 단계: 비율 수락(기안) → \u003cstrong>DSRV 거래 진행중\u003c/strong> → 최종 \u003cstrong>완료 / 심사 후 보류\u003c/strong>\u003cbr>· 고객사 승인 단계 없음 — 고객사 측 통제는 DSRV 수탁 \u003cstrong>콜드월렛 이체 승인(기존 커스터디 다중승인)\u003c/strong>으로 수행\u003cbr>· DSRV 내부 승인·집행은 \"DSRV 거래 진행중\" 단일 상태로만 노출 — 내부 심사·서명 단계 미표시\u003cbr>· EXC-04(거래 내역)와 동일한 '거래 상태' 구조 — 이 화면은 진행중 시점의 스냅숏\u003cbr>\u003cspan class=\"basis\">근거: 커스터디 콜드 다중승인 재사용 · ISMS 2.7.2(암호키·서명 관리)\u003c/span>\u003c/div>\n      \u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"itm\" data-idx=\"1\">\n      \u003cdiv class=\"num\">2\u003c/div>\n      \u003cdiv>\n        \u003cdiv class=\"itm-title\">소요 안내 · 결과 확인 경로\u003cspan class=\"req\">필수\u003c/span>\u003c/div>\n        \u003cdiv class=\"itm-desc\">· \u003cstrong>\"약 2영업일 소요됩니다\"\u003c/strong> 고지 — 즉시 체결이 아님을 담보(자동체결 거래소 아님)\u003cbr>· 자동검증(한도·BLF·KYT)·트래블룰 확인 상세는 \u003cstrong>어드민 홈(ADM-02) 처리함\u003c/strong> — 고객 화면 미표시\u003cbr>· 승인되지 않은 건은 \u003cstrong>거래 내역(EXC-04)에 '심사 후 보류' 상태 + 일반화된 사유로 표기\u003c/strong> — AML 심사 내용 미노출\u003cbr>\u003cspan class=\"basis\">근거: L6 설명의무 · STR 누설금지(특정금융정보법 제4조 [원문대조필요]) · 소요 수치 [확인필요]\u003c/span>\u003c/div>\n      \u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"itm\" data-idx=\"2\">\n      \u003cdiv class=\"num\">3\u003c/div>\n      \u003cdiv>\n        \u003cdiv class=\"itm-title\">교환거래 요청 내역\u003cspan class=\"req\">필수\u003c/span>\u003c/div>\n        \u003cdiv class=\"itm-desc\">· 요청번호·교환쌍/방향·수량·확정 비율/스프레드·요청 일시 표기 — 비율은 {받는코인}/{주는코인}(notation 규칙)\u003cbr>· EXC-03·EXC-04 \u003cstrong>공통 하단 블록\u003c/strong> — 같은 포맷·필드 순서를 마목(BRK-03·04·05)·관리자(ADM-02 처리함 선택 건)에도 적용(마목은 받는 수량 포함·스프레드 없음)\u003cbr>\u003cspan class=\"basis\">근거: L6 설명의무 · 공통 포맷\u003c/span>\u003c/div>\n      \u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"itm\" data-idx=\"3\">\n      \u003cdiv class=\"num\">4\u003c/div>\n      \u003cdiv>\n        \u003cdiv class=\"itm-title\">확인 버튼 — 프로세스 종료 이동\u003cspan class=\"req\">필수\u003c/span>\u003c/div>\n        \u003cdiv class=\"itm-desc\">· 프로세스가 끝나는 화면이므로 \u003cstrong>'확인' 클릭 시 홈(DASH-01)으로 이동\u003c/strong>\u003cbr>· 뒤로가기 미지원(전역 규칙 — DASH-01)\u003cbr>· 진행 중 건은 홈 거래현황·거래 내역(EXC-04)에서 재진입\u003cbr>\u003cspan class=\"basis\">근거: 종료 화면 이탈 동선\u003c/span>\u003c/div>\n        \u003cdiv class=\"itm-nav\">\u003cspan class=\"nav-tag\">화면 이동 · 인터랙션\u003c/span>\n          \u003cdiv class=\"nav-row\">\u003cspan class=\"nav-el\">[확인] 버튼\u003c/span>\u003cspan class=\"nav-act\">클릭 — 프로세스 종료 동선(접수 안내 확인)\u003c/span>\u003cspan class=\"nav-to\">\u003cstrong>대시보드(DASH-01)\u003c/strong> 이동\u003c/span>\u003c/div>\n        \u003c/div>\n      \u003c/div>\n    \u003c/div>\n  \u003c/div>\n\n\u003c/div>\n\n\u003csection class=\"footer-note\" style=\"padding-bottom:0;\">\n  \u003cdiv class=\"note-card\">\n    \u003cdiv class=\"note-title\">상세내용\u003c/div>\n    \u003cdiv class=\"detail-grid\" id=\"detailCol\">\n      \u003cdiv class=\"dtl\" data-idx=\"0\">\n        \u003cdiv class=\"detail-label\">\u003cspan class=\"dtl-num\">1\u003c/span>고객사 승인을 없앤 근거\u003c/div>\n      \u003cdiv class=\"dtl-body\">\u003cspan class=\"box\">· 교환 이전은 DSRV 수탁 \u003cstrong>콜드월렛의 기존 다중승인 절차\u003c/strong>를 그대로 거침 — 화면에서 2인 승인을 또 받으면 \u003cstrong>동일 통제의 중복\u003c/strong>\u003cbr>· 직무분리(ISMS 2.2.2)는 커스터디 이체 승인 + DSRV 승인↔집행 서명 분리로 충족\u003cbr>· DSRV 집행: 콜드 \u003cstrong>2인 멀티시그(2키/2인)\u003c/strong> — 승인권과 서명권 분리 유지\u003c/span>\u003c/div>\n      \u003c/div>\n      \u003cdiv class=\"dtl\" data-idx=\"1\">\n        \u003cdiv class=\"detail-label\">\u003cspan class=\"dtl-num\">2\u003c/span>보류 표기·사유 카테고리\u003c/div>\n      \u003cdiv class=\"dtl-body\">\u003cspan class=\"box\">· 최종 상태는 \u003cstrong>완료 / 심사 후 보류\u003c/strong> 2종 — 보류 표기는 거래 내역(EXC-04) 기준, 이 화면은 접수 안내까지\u003cbr>· 보류 사유 카테고리·STR 표기 금지 규칙은 EXC-04 상세 참조\u003c/span>\u003c/div>\n      \u003c/div>\n    \u003c/div>\n  \u003c/div>\n\u003c/section>\n\n\u003csection class=\"footer-note\">\n  \u003cdiv class=\"note-card\">\n    \u003cdiv class=\"note-title\">비고\u003c/div>\n    \u003cdiv class=\"note-body\">\n      · \u003cstrong>[방어 핵심]\u003c/strong> 자동검증(한도·BLF·KYT)은 \u003cstrong>1차 필터일 뿐\u003c/strong>, 최종 판단은 사람이 수행 — \"자동체결·자동심사 아님\" 담보. 주의·불량 건은 어드민 홈(ADM-02) 처리함으로 에스컬레이션.\u003cbr>\n      · \u003cstrong>[승인 ≠ 집행]\u003c/strong> DSRV 승인은 단일이지만, 콜드지갑 출고의 \u003cstrong>집행 서명은 키 2개·서명자 2인(멀티시그)\u003c/strong> — 승인권과 서명권 분리(ISMS 2.7.2).\u003cbr>\n      · 다음 화면: 내역·완료 (EXC-04)\n    \u003c/div>\n  \u003c/div>\n\u003c/section>\n\n\u003cscript src=\"screen.js\">\u003c/script>\n\u003c/body>\n\u003c/html>\n", "exc-04.html": "\u003c!DOCTYPE html>\n\u003chtml lang=\"ko\">\n\u003chead>\n\u003cmeta charset=\"UTF-8\">\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n\u003ctitle>화면기획 — 내역·완료\u003c/title>\n\u003clink rel=\"stylesheet\" href=\"screen.css\">\n\u003c/head>\n\u003cbody>\n\n\u003cheader class=\"header\">\n  \u003cdiv class=\"crumb\">\u003cspan>나목 교환\u003c/span>\u003cspan class=\"s\">›\u003c/span>\u003cspan>교환하기\u003c/span>\u003cspan class=\"s\">›\u003c/span>\u003cspan>내역·완료\u003c/span>\u003c/div>\n  \u003ch1 class=\"title\">내역·완료\u003c/h1>\n  \u003cspan class=\"sid\">EXC-04\u003c/span>\n  \u003cspan class=\"defense\">콜드 수동집행 · 구분회계\u003c/span>\n\u003c/header>\n\n\u003cdiv class=\"main\">\n  \u003cdiv class=\"screen-panel\">\n    \u003cdiv style=\"position:relative;display:flex;\">\n      \u003cdiv class=\"labels\" id=\"labels\">\n        \u003cdiv class=\"lbl\">\u003cspan class=\"lbl-text\">전역\u003c/span>\u003c/div>\n        \u pan>\u003c/div>\n          \u003cdiv class=\"kv\">\u003cspan class=\"k\">스프레드\u003c/span>\u003cspan class=\"v\">0.10%\u003c/span>\u003c/div>\n        \u003c/div>\n      \u003c/div>\n\n      \u003cdiv class=\"zone\" data-idx=\"3\">\n        \u003cdiv class=\"zone-highlight\">\u003c/div>\n        \u003cdiv class=\"item-area\" data-highlight=\"3\" style=\"position:relative;padding:6px;border-radius:8px;\">\n          \u003cdiv class=\"pin\" data-idx=\"3\" style=\"top:-8px;right:-4px;\">4\u003c/div>\n          \u003cdiv class=\"btn primary\">확인\u003c/div>\n        \u003c/div>\n      \u003c/div>\n\n    \u003c/div>\n  \u003c/div>\n\n  \u003csvg id=\"connSvg\" style=\"position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:10;overflow:visible;\">\u003c/svg>\n\n  \u003cdiv class=\"items\" id=\"items\">\n    \u003cdiv class=\"nav-global\">\n      \u003cdiv class=\"nav-global-title\">진입 · 전역 이동\u003c/div>\n      \u003cdiv class=\"nav-row\">\u003cspan class=\"nav-el\">상단 GNB(전 화면 공통)\u003c/span>\u003cspan class=\"nav-act\">대시보드/교환하기/교환게시판 메뉴 · 로고 클릭 — 목업에는 상단 요약만 표시\u003c/span>\u003cspan class=\"nav-to\">\u003cstrong>DASH-01 / EXC-01 / BRK-01\u003c/strong> (규칙: DASH-01 항목 5)\u003c/span>\u003c/div>\n      \u003cdiv class=\"nav-note\">· \u003cstrong>진입\u003c/strong>: 대시보드(DASH-01) 거래 목록의 나목 완료/보류 행 클릭 (EXC-03 진행 건이 종결되면 이 화면으로 상태 갱신)\u003cbr>\n      · 조회 전용 — 확인 외 클릭 액션 없음 · 보류 건 이의·문의 동선은 화면 밖(담당자 별도 안내)\u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"itm\" data-idx=\"0\">\n      \u003cdiv class=\"num\">1\u003c/div>\n      \u003cdiv>\n        \u003cdiv class=\"itm-title\">거래 상태 — 완료 / 심사 후 보류\u003cspan class=\"req\">필수\u003c/span>\u003c/div>\n        \u003cdiv class=\"itm-desc\">· \u003cstrong>EXC-03과 동일한 '거래 상태' 단계 구조\u003c/strong> — 이 화면은 종결 시점, 승인되지 않은 건은 마지막 단계가 '완료' 대신 '보류'로 표기\u003cbr>· 최종 상태 2종: \u003cstrong>완료\u003c/strong> 또는 \u003cstrong>심사 후 보류\u003c/strong>\u003cbr>· 보류 시 \u003cstrong>일반화된 사유\u003c/strong>만 표기 — 구체적 AML 심사 내용(KYT 점수·의심거래 여부 등) 미노출\u003cbr>\u003cspan class=\"basis\">근거: STR 누설금지(특정금융정보법 제4조 [원문대조필요])\u003c/span>\u003c/div>\n      \u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"itm\" data-idx=\"1\">\n      \u003cdiv class=\"num\">2\u003c/div>\n      \u003cdiv>\n        \u003cdiv class=\"itm-title\">콜드 수동집행 정보\u003cspan class=\"req\">필수\u003c/span>\u003c/div>\n        \u003cdiv class=\"itm-desc\">· 100% 콜드지갑·수동, 완료까지 약 2영업일 고지\u003cbr>· 콜드 출고 = \u003cstrong>2인 서명(멀티시그, 키 2개·서명자 2인)\u003c/strong>\u003cbr>· 완료 시 가용 풀 차감 기록\u003cbr>\u003cspan class=\"basis\">근거: 콜드지갑 수동집행 절차 · 정보보호 관리체계(ISMS) 인증기준 2.7.2(암호키·서명 관리)\u003c/span>\u003c/div>\n      \u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"itm\" data-idx=\"2\">\n      \u003cdiv class=\"num\">3\u003c/div>\n      \u003cdiv>\n        \u003cdiv class=\"itm-title\">교환거래 요청 내역\u003cspan class=\"req\">필수\u003c/span>\u003c/div>\n        \u003cdiv class=\"itm-desc\">· 요청번호·교환쌍/방향·보낸/받은 자산·확정 비율/스프레드 표기 — EXC-03과 \u003cstrong>공통 하단 블록\u003c/strong>(공통 포맷)\u003cbr>· 스프레드 수익을 구분회계로 반영\u003cbr>· 거래자 대상 거래보고서 발급 없음 — 회계 집계는 관리자 CSV 다운로드(ADM-02)로만\u003cbr>\u003cspan class=\"basis\">근거: 구분회계(고객 수탁자산과 운영자산을 분리해 집계) 요건\u003c/span>\u003c/div>\n      \u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"itm\" data-idx=\"3\">\n      \u003cdiv class=\"num\">4\u003c/div>\n      \u003cdiv>\n        \u003cdiv class=\"itm-title\">확인 버튼 — 프로세스 종료 이동\u003cspan class=\"req\">필수\u003c/span>\u003c/div>\n        \u003cdiv class=\"itm-desc\">· 나목 flow 종료 화면이므로 \u003cstrong>'확인' 클릭 시 대시보드(DASH-01)로 이동\u003c/strong> — EXC-03과 동일한 종료 동선\u003cbr>· 재확인은 이 거래 내역·홈 거래현황에서 재진입\u003cbr>\u003cspan class=\"basis\">근거: 종료 화면 이탈 동선\u003c/span>\u003c/div>\n        \u003cdiv class=\"itm-nav\">\u003cspan class=\"nav-tag\">화면 이동 · 인터랙션\u003c/span>\n          \u003cdiv class=\"nav-row\">\u003cspan class=\"nav-el\">[확인] 버튼\u003c/span>\u003cspan class=\"nav-act\">클릭 — 나목 flow 종료 동선(EXC-03과 동일 패턴)\u003c/span>\u003cspan class=\"nav-to\">\u003cstrong>대시보드(DASH-01)\u003c/strong> 이동\u003c/span>\u003c/div>\n        \u003c/div>\n      \u003c/div>\n    \u003c/div>\n  \u003c/div>\n\n\u003c/div>\n\n\u003csection class=\"footer-note\" style=\"padding-bottom:0;\">\n  \u003cdiv class=\"note-card\">\n    \u003cdiv class=\"note-title\">상세내용\u003c/div>\n    \u003cdiv class=\"detail-grid\" id=\"detailCol\">\n      \u003cdiv class=\"dtl\" data-idx=\"0\">\n        \u003cdiv class=\"detail-label\">\u003cspan class=\"dtl-num\">1\u003c/span>보류 사유 카테고리 (고객 표시용)\u003c/div>\n      \u003cdiv class=\"dtl-body\">\u003cspan class=\"box\">① 한도 초과 ② 추가 정보 확인 필요 ③ 내부 심사 기준 미충족 ④ 가용 풀 부족·시세 이탈(집행 불가)\u003cbr>· \u003cspan class=\"red\">의심거래(STR) 관련 여부는 어떤 형태로도 표기 금지\u003c/span> — \"추가 정보 확인 필요\"로 일반화\u003cbr>· 사유 문구 확정 [로펌게이트]\u003c/span>\u003c/div>\n      \u003c/div>\n      \u003cdiv class=\"dtl\" data-idx=\"1\">\n        \u003cdiv class=\"detail-label\">\u003cspan class=\"dtl-num\">2\u003c/span>가용 풀 차감 반영\u003c/div>\n      \u003cdiv class=\"dtl-body\">\u003cspan class=\"box\">· 집행 완료분만큼 운영자산 가용 풀 감소\u003cbr>· 커스터디 운영자산 잔고·EXC-01(풀 표시)·3면 대사 CSV(ADM-02)에 동시 반영\u003cbr>· 차감은 온체인 출고 확정 시점 기준\u003c/span>\u003c/div>\n      \u003c/div>\n      \u003cdiv class=\"dtl\" data-idx=\"2\">\n        \u003cdiv class=\"detail-label\">\u003cspan class=\"dtl-num\">3\u003c/span>구분회계 처리\u003c/div>\n      \u003cdiv class=\"dtl-body\">\u003cspan class=\"box\">· 고객 수탁자산 ↔ 운영자산 원장 분리\u003cbr>· 스프레드 수익 = 운영손익 계정(내부 구분회계 — 고객 화면 미노출, 2026-09-02 확정)\u003cbr>· 수탁/운영·스프레드/수수료 집계는 구분회계 CSV(ADM-02)로 내보내기\u003c/span>\u003c/div>\n      \u003c/div>\n    \u003c/div>\n  \u003c/div>\n\u003c/section>\n\n\u003csection class=\"footer-note\">\n  \u003cdiv class=\"note-card\">\n    \u003cdiv class=\"note-title\">비고\u003c/div>\n    \u003cdiv class=\"note-body\">\n      · 나목 교환 flow 종료 화면. 집행은 \u003cstrong>콜드·수동·2인 멀티시그\u003c/strong>이며 즉시성이 낮다는 점(약 2영업일)을 명시해 \"자동체결 거래소 아님\"과 정합.\u003cbr>\n      · \u003cstrong>[화이트리스트 미적용]\u003c/strong> 교환은 내부 커스터디 지갑 간 이전, 외부 주소 미취급. 외부 반출은 기존 커스터디 출금 절차(화이트리스트)로만.\u003cbr>\n      · \u003cspan style=\"color:#991b1b;\">[확인필요]\u003c/span> 집행 소요 수치(나목 약 2영업일 / 마목 정산 배치 주기 — ADM-03 정책값으로 확정 예정, 현재 표기는 예시) · 고객사 회계·감사 제출용 증빙 제공 방식(요청 시 별도 제공 여부).\u003cbr>\n      · 나목 flow: EXC-01 요청 → EXC-02 비율 → EXC-03 승인 → \u003cstrong>EXC-04 완료\u003c/strong>\n    \u003c/div>\n  \u003c/div>\n\u003c/section>\n\n\u003cscript src=\"screen.js\">\u003c/script>\n\u003c/body>\n\u003c/html>\n", "brk-01.html": "\u003c!DOCTYPE html>\n\u003chtml lang=\"ko\">\n\u003chead>\n\u003cmeta charset=\"UTF-8\">\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n\u003ctitle>화면기획 — 교환 게시판\u003c/title>\n\u003clink rel=\"stylesheet\" href=\"screen.css\">\n\u003cstyle>\n  .tbl{width:100%;border-collapse:collapse;font-size:11px;}\n  .tbl th{background:#f1f5f9;color:#64748b;font-weight:700;text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);font-size:10px;}\n  .tbl td{padding:8px;border-bottom:1px solid #f1f1ee;color:#334155;vertical-align:middle;}\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\n\u003cheader class=\"header\">\n  \u003cdiv class=\"crumb\">\u003cspan>마목 중개\u003c/span>\u003cspan class=\"s\">›\u003c/span>\u003cspan>교환게시판\u003c/span>\u003c/div>\n  \u003ch1 class=\"title\">교환 게시판\u003c/h1>\n  \u003cspan class=\"sid\">BRK-01\u003c/span>\n  \u003cspan class=\"defense\">방어: 단순 게시판 아님(4요소)\u003c/span>\n\u003c/header>\n\n\u003cdiv class=\"main\">\n  \u003cdiv class=\"screen-panel\">\n    \u003cdiv style=\"position:relative;display:flex;\">\n      \u003cdiv class=\"labels\" id=\"labels\">\n        \u003cdiv class=\"lbl\">\u003cspan class=\"lbl-text\">전역\u003c/span>\u003c/div>\n        \u003cdiv class=\"lbl\">\u003cspan class=\"lbl-text\">거래의향 리스트\u003c/span>\u003c/div>\n        \u003cdiv class=\"lbl\">\u003cspan class=\"lbl-text\">등록\u003c/span>\u003c/div>\n      \u003c/div>\n      \u003csvg id=\"bracketSvg\" width=\"24\" style=\"flex-shrink:0;overflow:visible;\">\u003c/svg>\n    \u003c/div>\n\n    \u003cdiv class=\"frame\" id=\"frame\">\n      \ iv style=\"position:relative;margin-top:6px;padding:6px 8px;background:#f8fafc;border-top:1px solid #f1f1ee;font-size:10px;color:#64748b;\">\n            \u003cdiv class=\"pin\" data-idx=\"1\" style=\"top:-6px;right:-4px;\">2\u003c/div>\n            ✓ 이 보드의 모든 거래의향은 \u003cstrong>거래 안전성 검증(보유·처분권 확인)\u003c/strong> 및 \u003cstrong>KYC 완료 법인\u003c/strong>만 게시됩니다\n          \u003c/div>\n        \u003c/div>\n      \u003c/div>\n\n      \u003cdiv class=\"zone\" data-idx=\"2\">\n        \u003cdiv class=\"zone-highlight\">\u003c/div>\n        \u003cdiv class=\"item-area\" data-highlight=\"2\" style=\"position:relative;padding:6px;border-radius:8px;\">\n          \u003cdiv class=\"pin\" data-idx=\"2\" style=\"top:-8px;right:-4px;\">3\u003c/div>\n          \u003cdiv class=\"btn primary\">+ 거래의향 등록\u003c/div>\n        \u003c/div>\n      \u003c/div>\n    \u003c/div>\n  \u003c/div>\n\n  \u003csvg id=\"connSvg\" style=\"position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:10;overflow:visible;\">\u003c/svg>\n\n  \u003cdiv class=\"items\" id=\"items\">\n    \u003cdiv class=\"nav-global\">\n      \u003cdiv class=\"nav-global-title\">진입 · 전역 이동\u003c/div>\n      \u003cdiv class=\"nav-row\">\u003cspan class=\"nav-el\">GNB '대시보드' · 로고\u003c/span>\u003cspan class=\"nav-act\">클릭\u003c/span>\u003cspan class=\"nav-to\">\u003cstrong>대시보드(DASH-01)\u003c/strong>\u003c/span>\u003c/div>\n      \u003cdiv class=\"nav-row\">\u003cspan class=\"nav-el\">GNB '교환하기'\u003c/span>\u003cspan class=\"nav-act\">클릭\u003c/span>\u003cspan class=\"nav-to\">\u003cstrong>교환하기(EXC-01)\u003c/strong>\u003c/span>\u003c/div>\n      \u003cdiv class=\"nav-note\">· \u003cstrong>진입\u003c/strong>: GNB '교환게시판' 클릭(대시보드 등 전 화면에서)\u003cbr>\n      · 시세변동 중지·유효기간 만료 게시는 리스트에서 제외 — 행이 없으므로 신청(BRK-03) 진입 자체가 불가 \u003cspan style=\"color:#991b1b;\">[확인필요: 내 게시 행 구분 표기(내 게시 배지 등) 방식]\u003c/span>\u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"itm\" data-idx=\"0\">\n      \u003cdiv class=\"num\">1\u003c/div>\n      \u003cdiv>\n        \u003cdiv class=\"itm-title\">거래의향 리스트\u003cspan class=\"req\">필수\u003c/span>\u003c/div>\n        \u003cdiv class=\"itm-desc\">· 목록 컬럼: \u003cstrong>교환코인 · 보내는 수량 · 받는 수량 · 비율\u003c/strong> — DASH-01 거래 목록과 표기 통일, 비율은 {받는코인}/{주는코인}(notation 규칙)\u003cbr>· 사자/팔자 구분 없음 — 거래의향은 교환 수량 쌍(\"A코인 X개 ↔ B코인 Y개\")으로 표기\u003cbr>· 필터·정렬·페이징 없음 — 전체를 최신순 단일 리스트로 나열\u003cbr>· 타사 게시 행 선택 시 신청하기(BRK-03), 내 게시 행 선택 시 내 게시 상세(BRK-06) 진입\u003cbr>· \u003cstrong>시세변동 중지 RFQ · 유효기간(기본 30일) 만료 게시는 리스트에서 제외\u003c/strong> — 중지 상태 배지·표시 없음\u003cbr>· 자동 매칭/자동 체결 없음\u003cbr>\u003cspan class=\"basis\">근거 F-1b · 09 §0 line 57(시세변동 중지) · V2 — 시장개설 아님\u003c/span>\u003c/div>\n        \u003cdiv class=\"itm-nav\">\u003cspan class=\"nav-tag\">화면 이동 · 인터랙션\u003c/span>\n          \u003cdiv class=\"nav-row\">\u003cspan class=\"nav-el\">거래의향 행 (타사 게시)\u003c/span>\u003cspan class=\"nav-act\">클릭 — 게시 조건 그대로 신청하는 화면으로 (역제안 없음)\u003c/span>\u003cspan class=\"nav-to\">\u003cstrong>신청하기(BRK-03)\u003c/strong>\u003c/span>\u003c/div>\n          \u003cdiv class=\"nav-row\">\u003cspan class=\"nav-el\">거래의향 행 (내 게시)\u003c/span>\u003cspan class=\"nav-act\">클릭 — 내 게시 상세(조회·회수·받은 신청 목록)\u003c/span>\u003cspan class=\"nav-to\">\u003cstrong>내 게시 상세·회수(BRK-06)\u003c/strong> → 신청 행 선택 시 BRK-04\u003c/span>\u003c/div>\n        \u003c/div>\n      \u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"itm\" data-idx=\"1\">\n      \u003cdiv class=\"num\">2\u003c/div>\n      \u003cdiv>\n        \u003cdiv class=\"itm-title\">거래 안전성 검증·KYC 담보 안내\u003cspan class=\"req\">필수\u003c/span>\u003c/div>\n        \u003cdiv class=\"itm-desc\">· 거래 안전성 검증 = DSRV 보유·처분권 확인(4요소①)\u003cbr>· KYC = 양측 KYC 완료 법인만 게시·거래(4요소②)\u003cbr>· 전 게시물 공통 전제이므로 행별 배지 없이 보드 하단 한 줄 안내로 표시\u003cbr>\u003cspan class=\"basis\">근거 V2 — 단순 게시판 아님\u003c/span>\u003c/div>\n      \u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"itm\" data-idx=\"2\">\n      \u003cdiv class=\"num\">3\u003c/div>\n      \u003cdiv>\n        \u003cdiv class=\"itm-title\">거래의향 등록 진입\u003cspan class=\"req\">필수\u003c/span>\u003c/div>\n        \u003cdiv class=\"itm-desc\">· 내 RFQ를 새로 게시(BRK-02)\u003cbr>\u003cspan class=\"basis\">근거 F-1b\u003c/span>\u003c/div>\n        \u003cdiv class=\"itm-nav\">\u003cspan class=\"nav-tag\">화면 이동 · 인터랙션\u003c/span>\n          \u003cdiv class=\"nav-row\">\u003cspan class=\"nav-el\">[+ 거래의향 등록] 버튼\u003c/span>\u003cspan class=\"nav-act\">클릭 — 내 RFQ 신규 게시\u003c/span>\u003cspan class=\"nav-to\">\u003cstrong>거래의향 등록(BRK-02)\u003c/strong>\u003c/span>\u003c/div>\n        \u003c/div>\n      \u003c/div>\n    \u003c/div>\n  \u003c/div>\n\n\u003c/div>\n\n\u003csection class=\"footer-note\" style=\"padding-bottom:0;\">\n  \u003cdiv class=\"note-card\">\n    \u003cdiv class=\"note-title\">상세내용\u003c/div>\n    \u003cdiv class=\"detail-grid\" id=\"detailCol\">\n      \u003cdiv class=\"dtl\" data-idx=\"0\">\n        \u003cdiv class=\"detail-label\">\u003cspan class=\"dtl-num\">1\u003c/span>시세변동 중지 = 보드 제외\u003c/div>\n      \u003cdiv class=\"dtl-body\">\u003cspan class=\"box\">· 게시 시점 대비 시세 변동이 중지 기준을 넘으면 RFQ 자동중지 → \u003cstrong>보드 리스트에서 즉시 제외\u003c/strong> + 게시자 알림\u003cbr>· 중지 기준·판정은 \u003cstrong>내부 정책으로 운영\u003c/strong> — 화면에 중지 상태·기준 미표시\u003cbr>· 리스트에서 빠지면 신청(BRK-03) 진입 자체가 차단되므로 이후 화면에 중지 상태 표시 불요\u003cbr>· 재개는 게시자 재게시(게시 시점 스냅숏 재산정) · 게시자가 직접 내리는 회수는 BRK-06 [게시 내리기](자동중지와 별도 경로)\u003c/span>\u003c/div>\n      \u003c/div>\n      \u003cdiv class=\"dtl\" data-idx=\"1\">\n        \u003cdiv class=\"detail-label\">\u003cspan class=\"dtl-num\">2\u003c/span>4요소 방어 (단순 게시판 아님)\u003c/div>\n      \u003cdiv class=\"dtl-body\">\u003cspan class=\"box\">① 거래 안전성 검증(보유·처분권)\u003cbr>② KYC 담보(양측 완료 법인)\u003cbr>③ 정산 연계(BRK-05 커스터디 이전)\u003cbr>④ 수수료(거래액 1% 고정·양측 각자 — BRK-03/04/07 수락 전 고시)\u003c/span>\u003c/div>\n      \u003c/div>\n      \u003cdiv class=\"dtl\" data-idx=\"2\">\n        \u003cdiv class=\"detail-label\">\u003cspan class=\"dtl-num\">3\u003c/span>빈 상태 (공통 UI 규격)\u003c/div>\n      \u003cdiv class=\"dtl-body\">\u003cspan class=\"box\">· 게시가 0건이면 표 대신 빈 상태 문구: \u003cspan class=\"red\">\"게시된 거래의향이 없습니다\"\u003c/span> + 다음 행동 1줄 \"[+ 거래의향 등록]으로 첫 거래의향을 올릴 수 있습니다\"\u003cbr>· 내 게시가 리스트에 있으면 행 우측 '내 게시' 배지 \u003cspan class=\"red\">[확인필요: 배지 표기 방식]\u003c/span>\u003c/span>\u003c/div>\n      \u003c/div>\n    \u003c/div>\n  \u003c/div>\n\u003c/section>\n\n\u003csection class=\"footer-note\">\n  \u003cdiv class=\"note-card\">\n    \u003cdiv class=\"note-title\">비고\u003c/div>\n    \u003cdiv class=\"note-body\">\n      · 마목(당사자 간 중개) 진입점. \u003cstrong>[방어 핵심]\u003c/strong> 거래 안전성 검증·KYC담보·정산연계·수수료 \u003cstrong>4요소\u003c/strong>를 갖춰 \"단순 게시판\"이 아님을 소명 — 자동 매칭·자동 체결·시장가 형성은 하지 않음. 필터·정렬·페이징이 없는 단순 나열 구조 자체가 자동 매칭·조건 검색 부재의 담보.\u003cbr>\n      · 분기: 내 RFQ 올리기 → BRK-02 / 기존 거래의향에 신청 → BRK-03 / 내 게시 열기 → BRK-06(회수는 여기서)\n    \u003c/div>\n  \u003c/div>\n\u003c/section>\n\n\u003cscript src=\"screen.js\">\u003c/script>\n\u003c/body>\n\u003c/html>\n", "brk-02.html": "\u003c!DOCTYPE html>\n\u003chtml lang=\"ko\">\n\u003chead>\n\u003cmeta charset=\"UTF-8\">\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n\u003ctitle>화면기획 — 거래의향 등록\u003c/title>\n\u003clink rel=\"stylesheet\" href=\"screen.css\">\n\u003c/head>\n\u003cbody>\n\n\u003cheader class=\"header\">\n  \u003cdiv class=\"crumb\">\u003cspan>마목 중개\u003c/span>\u003cspan class=\"s\">›\u003c/span>\u003cspan>교환게시판\u003c/span>\u003cspan class=\"s\">›\u003c/span>\u003cspan>거래의향 등록\u003c/span>\u003c/div>\n  \u003ch1 class=\"title\">거래의향 등록\u003c/h1>\n  \u003cspan class=\"sid\">BRK-02\u003c/span>\n  \u003cspan class=\"defense\">거래 안전성 검증 · 시세변동 자동 중지\u003c/span>\n\u003c/header>\n\n\u003cdiv class=\"main\">\n  \u003cdiv class=\"screen-panel\">\n    \u003cdiv style=\"position:relative;display:flex;\">\n      \u003cdiv class=\"labels\" id=\"labels\">\n        \u003cdiv class=\"lbl\">\u003cspan class=\"lbl-text\">전역\u003c/span>\u003c/div>\n        \u003cdiv class=\"lbl\">\u003cspan class=\"lbl-text\">거래의향 입력\u003c/span>\u003c/div>\n        \u003cdiv class=\"lbl\">\u003cspan class=\"lbl-text\">중지·유효기간\u003cbr>안내\u003c/span>\u003c/div>\n        \u003cdiv class=\"lbl\">\u003cspan class=\"lbl-text\">게시 액션\u003c/span>\u003c/div>\n      \u003c/div>\n      \u003csvg id=\"bracketSvg\" width=\"24\" style=\"flex-shrink:0;overflow:visible;\">\u003c/svg>\n    \u003c/div>\n\n    \u003cdiv class=\"frame\" id=\"frame\">\n      \u003cdiv class=\"zone\" data-idx=\"\">\n        \u003cdiv class=\"zone-highlight\">\u003c/div>\n        \u003cdiv class=\"c-top\" style=\"border-radius:8px;\">\n          \u003cspan class=\"brand\">DSRV Desk\u003c/span>\n          \u003cspan class=\"meta\">\u003cspan class=\"c-badge\">A자산운용\u003c/span>\u003c/span>\n        \u003c/div>\n      \u003c/div>\n\n      \u003cdiv class=\"zone\" data-idx=\"0,1\">\n        \u003cdiv class=\"zone-highlight\">\u003c/div>\n        \u003cdiv class=\"item-area\" data-highlight=\"0\" style=\"position:relative;padding:6px;border-radius:8px;\">\n          \u003cdiv class=\"pin\" data-idx=\"0\" style=\"top:-4px;right:-4px;\">1\u003c/div>\n          \u003cdiv style=\"display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;\">\n            \u003cdiv class=\"zone-title\" style=\"margin:0;\">거래의향 입력\u003c/div>\n            \u003cspan style=\"font-size:10px;color:#64748b;\">현 시세 \u003cstrong>1.0000 USDC/USDT\u003c/strong>\u003c/span>\n          \u003c/div>\n          \u003cdiv class=\"field\" style=\"margin-bottom:2px;\">\u003cspan>보내는 수량\u003c/span>\u003cspan style=\"font-weight:700;\">500,000 \u003cspan class=\"chip asset\">USDT ▾\u003c/span>\u003c/span>\u003c/div>\n          \u003cdiv style=\"position:relative;font-size:10px;color:#16a34a;margin:0 2px 8px;\">보유 잔고 620,000 USDT — 처분 가능\u003cdiv class=\"pin\" data-idx=\"1\" style=\"top:-4px;right:-4px;\">2\u003c/div>\u003c/div>\n          \u003cdiv class=\"field\" style=\"margin-bottom:6px;\">\u003cspan>받는 수량\u003c/span>\u003cspan style=\"font-weight:700;\">485,000 \u003cspan class=\"chip asset\">USDC ▾\u003c/span>\u003c/span>\u003c/div>\n          \u003cdiv class=\"kv\" style=\"margin-bottom:6px;\">\u003cspan class=\"k\">환산 비율 (자동 계산)\u003c/span>\u003cspan class=\"v\" style=\"color:#dc2626;\">0.9700 USDC/USDT (현 시세 대비 -3.0%)\u003c/span>\u003c/div>\n          \u003cdiv style=\"font-size:10px;color:#b45309;background:#fef3c7;border:1px solid #fde68a;border-radius:6px;padding:5px 8px;\">⚠ 현 시세 대비 편차 \u003cstrong>-3.0%\u003c/strong> — 이상거래로 오인될 수 있습니다. \u003cstrong>±2.0% 이내\u003c/strong>로 수량을 조정해 주세요 (초과 시 게시 불가)\u003c/div>\n        \u003c/div>\n      \u003c/div>\n\n      \u003cdiv class=\"zone\" data-idx=\"2\">\n        \u003cdiv class=\"zone-highlight\">\u003c/div>\n        \u003cdiv class=\"item-area\" data-highlight=\"2\" style=\"position:relative;padding:6px;border-radius:8px;\">\n          \u003cdiv class=\"pin\" data-idx=\"2\" style=\"top:-4px;right:-4px;\">3\u003c/div>\n          \u003cdiv class=\"note-inline\">게시 후 시세가 게시 시점 대비 ±2.0% 이상 변동하면 이 거래의향은 자동으로 중지됩니다.\u003c/div>\n          \u003cdiv class=\"note-inline\" style=\"margin-top:6px;\">게시된 거래의향은 \u003cstrong>게시일로부터 30일간 유효\u003c/strong>합니다. 유효기간이 지나면 자동 종료되어 \u003cstrong>완료(유효기간 만료)\u003c/strong> 건으로 거래 내역에 표시됩니다.\u003c/div>\n        \u003c/div>\n      \u003c/div>\n\n      \u003cdiv class=\"zone\" data-idx=\"3\">\n        \u003cdiv class=\"zone-highlight\">\u003c/div>\n        \u003cdiv class=\"item-area\" data-highlight=\"3\" style=\"position:relative;padding:6px;border-radius:8px;\">\n          \u003cdiv class=\"pin\" data-idx=\"3\" style=\"top:-8px;right:-4px;\">4\u003c/div>\n          \u003cdiv style=\"display:flex;gap:8px;\">\u003cdiv class=\"btn primary\" style=\"flex:1;\">게시하기\u003c/div>\u003cdiv class=\"btn ghost\" style=\"flex:.5;\">취소\u003c/div>\u003c/div>\n        \u003c/div>\n      \u003c/div>\n    \u003c/div>\n  \u003c/div>\n\n  \u003csvg id=\"connSvg\" style=\"position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:10;overflow:visible;\">\u003c/svg>\n\n  \u003cdiv class=\"items\" id=\"items\">\n    \u003cdiv class=\"nav-global\">\n      \u003cdiv class=\"nav-global-title\">진입 · 전역 이동\u003c/div>\n      \u003cdiv class=\"nav-row\">\u003cspan class=\"nav-el\">상단 GNB(전 화면 공통)\u003c/span>\u003cspan class=\"nav-act\">대시보드/교환하기/교환게시판 메뉴 · 로고 클릭 — 목업에는 상단 요약만 표시\u003c/span>\u003cspan class=\"nav-to\">\u003cstrong>DASH-01 / EXC-01 / BRK-01\u003c/strong> (규칙: DASH-01 항목 5) · 게시 전 이탈 시 입력값 파기\u003c/span>\u003c/div>\n      \u003cdiv class=\"nav-note\">· \u003cstrong>진입\u003c/strong>: 교환 게시판(BRK-01) [+ 거래의향 등록] 클릭\u003cbr>\n      · 게시 이후: 내 게시 상세(BRK-06)에서 조회·회수 · 상대 신청 → 이메일 알림 ① 수신 → BRK-06 신청 행 → 받은 신청·수락(BRK-04)에서 처리 · 게시 회수(내리기) = BRK-06 [게시 내리기](2026-09-02 확정)\u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"itm\" data-idx=\"0\">\n      \u003cdiv class=\"num\">1\u003c/div>\n      \u003cdiv>\n        \u003cdiv class=\"itm-title\">교환 수량 쌍 입력 + 편차 경고\u003cspan class=\"req\">필수\u003c/span>\u003c/div>\n        \u003cdiv class=\"itm-desc\">· 입력 방식: \"내가 가진 A코인 X개를 B코인 Y개와 바꾸고 싶다\" — \u003cstrong>보내는 자산·수량 + 받는 자산·수량\u003c/strong> 입력(사자/팔자 구분 없음), 두 수량에서 \u003cstrong>환산 비율 자동 계산·표시\u003c/strong>\u003cbr>· 자산 선택은 수량 입력 필드 안의 통화 선택(▾)으로 — 별도 자산 선택 행 없음, 기본값 USDT→USDC\u003cbr>· \u003cstrong>'현 시세'(외부지표)\u003c/strong>는 입력 영역 우측 상단에 고지 — 소스는 \u003cstrong>업비트·빗썸·바이낸스\u003c/strong> 시세(소스 관리 ADM-03)\u003cbr>· 편차 경고는 \u003cstrong>환산 비율이 현 시세와 ±2.0% 초과로 차이날 때만 노출\u003c/strong> — 노출 중 게시 차단(이상거래 오인 방지)\u003cbr>\u003cspan class=\"basis\">근거 F-1b · ADM-02 이상거래 워닝 연계\u003c/span>\u003cbr>· \u003cspan style=\"color:#b45309;\">[확인필요]\u003c/span> ETH 페어(변동성 자산)는 편차 임계·게시 유효기간을 별도 설정할지 미정 (2026-09-02 ETH 편입)\u003c/div>\n        \u003cdiv class=\"itm-nav\">\u003cspan class=\"nav-tag\">화면 이동 · 인터랙션\u003c/span>\n          \u003cdiv class=\"nav-row\">\u003cspan class=\"nav-el\">보내는/받는 수량 필드의 통화 선택(▾)\u003c/span>\u003cspan class=\"nav-act\">클릭 — 자산 선택(기본 USDT→USDC)\u003c/span>\u003cspan class=\"nav-to stay\">화면 내 (이동 없음)\u003c/span>\u003c/div>\n          \u003cdiv class=\"nav-row\">\u003cspan class=\"nav-el\">보내는·받는 수량 입력\u003c/span>\u003cspan class=\"nav-act\">환산 비율 자동 계산 · \u003cstrong>게이트 3종\u003c/strong>: ①보유·처분 가능분 초과 → 게시 거부 ②현 시세 대비 편차 ±2.0% 초과 → 경고 노출·게시 차단 ③건별 한도 1,000 USD 상당 초과 → 게시 차단(ADM-03 공통 한도)\u003c/span>\u003cspan class=\"nav-to stay\">화면 내 (이동 없음)\u003c/span>\u003c/div>\n        \u003c/div>\n      \u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"itm\" data-idx=\"1\">\n      \u003cdiv class=\"num\">2\u003c/div>\n      \u003cdiv>\n        \u003cdiv class=\"itm-title\">보유·처분권 확인 게이트\u003cspan class=\"req\">필수\u003c/span>\u003c/div>\n        \u003cdiv class=\"itm-desc\">· \u003cstrong>보내는 자산\u003c/strong>의 실제 보유·처분 가능분만 게시 허용 — 보유 잔고는 보내는 수량 입력 바로 아래 한 줄로 표시\u003cbr>· 허위 게시 차단 = 거래 안전성 검증(4요소①)\u003cbr>\u003cspan class=\"basis\">근거 V2\u003c/span>\u003c/div>\n      \u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"itm\" data-idx=\"2\">\n      \u003cdiv class=\"num\">3\u003c/div>\n      \u003cdiv>\n        \u003cdiv class=\"itm-title\">시세변동 자동 중지·유효기간 안내\u003cspan class=\"req\">필수\u003c/span>\u003c/div>\n        \u003cdiv class=\"itm-desc\">· 게시 시점 대비 시세가 \u003cstrong>±2.0% 이상 변동하면 시스템이 자동 중지\u003c/strong>(내부 정책 — 게시자 개별 설정 없음), 화면에는 한 줄 안내만\u003cbr>· \u003cstrong>게시 유효기간 기본 30일\u003c/strong> — 경과 시 자동 종료되어 \u003cstrong>완료(유효기간 만료)\u003c/strong> 건으로 처리·표시\u003cbr>· 중지 임계는 ADM-03 정책값 [확인필요]\u003cbr>· 외부지표 = 가격결정 아닌 중지 판단 기준\u003cbr>\u003cspan class=\"basis\">근거 09 §0 line 57\u003c/span>\u003c/div>\n      \u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"itm\" data-idx=\"3\">\n      \u003cdiv class=\"num\">4\u003c/div>\n      \u003cdiv>\n        \u003cdiv class=\"itm-title\">게시 (단독)\u003cspan class=\"req\">필수\u003c/span>\u003c/div>\n        \u003cdiv class=\"itm-desc\">· 게시는 기안자 단독 — 구속력 없는 거래의향 표시이므로 별도 승인 없음(거래 안전성 검증·편차 경고 게이트만 통과)\u003cbr>· 신청(BRK-03)·수락(BRK-04)도 \u003cstrong>가입자 단독 실행\u003c/strong> — 기관당 가입자 1명(ADM-03)\u003cbr>· 상태 관리(게재/신청접수/확정/완료(유효기간 만료)/회수)\u003cbr>· 입력 화면 공통: [취소] 버튼(ghost) = 입력값 파기 후 BRK-01 복귀 — 공통 UI 규격(notation)\u003cbr>\u003cspan class=\"basis\">근거 F-4 · 1기관 1가입자(ADM-03)\u003c/span>\u003c/div>\n        \u003cdiv class=\"itm-nav\">\u003cspan class=\"nav-tag\">화면 이동 · 인터랙션\u003c/span>\n          \u003cdiv class=\"nav-row\">\u003cspan class=\"nav-el\">[게시하기] 버튼\u003c/span>\u003cspan class=\"nav-act\">클릭 — 게이트 통과 시 게시(기안자 단독 · 구속력 없음 · 별도 승인 없음)\u003c/span>\u003cspan class=\"nav-to\">게시 완료 → \u003cstrong>내 게시 상세·회수(BRK-06)\u003c/strong> 진입(2026-09-02 변경 — 종전 BRK-01 복귀 폐기) · 게시판 리스트 동시 게재\u003c/span>\u003c/div>\n          \u003cdiv class=\"nav-row\">\u003cspan class=\"nav-el\">[취소] 버튼\u003c/span>\u003cspan class=\"nav-act\">클릭 — 입력값 파기(확인 문구 없음 · 공통 UI 규격)\u003c/span>\u003cspan class=\"nav-to\">\u003cstrong>교환 게시판(BRK-01)\u003c/strong> 복귀\u003c/span>\u003c/div>\n        \u003c/div>\n      \u003c/div>\n    \u003c/div>\n  \u003c/div>\n\n\u003c/div>\n\n\u003csection class=\"footer-note\" style=\"padding-bottom:0;\">\n  \u003cdiv class=\"note-card\">\n    \u003cdiv class=\"note-title\">상세내용\u003c/div>\n    \u003cdiv class=\"detail-grid\" id=\"detailCol\">\n      \u003cdiv class=\"dtl\" data-idx=\"0\">\n        \u003cdiv class=\"detail-label\">\u003cspan class=\"dtl-num\">1\u003c/span>편차 경고 로직\u003c/div>\n      \u003cdiv class=\"dtl-body\">\u003cspan class=\"box\">· 비교 대상 = 두 수량에서 도출한 \u003cstrong>환산 비율\u003c/strong>(받는 수량 ÷ 보내는 수량) vs 게시 시점 외부지표\u003cbr>· 임계 초과 시 \u003cspan class=\"red\">\"지표 대비 편차가 큽니다 — 수량을 조정해 주세요\"\u003c/span> → 게시 차단\u003cbr>· 경고·차단 임계값(예: ±2.0%)은 ADM-03 정책값 [확인필요]\u003cbr>· 목적: 자전·이상거래 오인 방지 (ADM-02 이상거래 워닝 룰과 동일 기준)\u003c/span>\u003c/div>\n      \u003c/div>\n      \u003cdiv class=\"dtl\" data-idx=\"1\">\n        \u003cdiv class=\"detail-label\">\u003cspan class=\"dtl-num\">2\u003c/span>거래 안전성 검증 로직\u003c/div>\n      \u003cdiv class=\"dtl-body\">\u003cspan class=\"box\">· 건별 한도 1,000 USD 상당(나·마 공통, USD 환산 — ADM-03) 초과 시 게시 불가 \u003cspan class=\"red\">[확인필요: 마목 대량 거래(블록딜)와의 정합 — 분할 게시 여부]\u003c/span>\u003cbr>· 커스터디 실보유 잔고 대조\u003cbr>· 기게시 중복분 차감\u003cbr>· 미충족 시 \u003cspan class=\"red\">\"보유·처분 가능 수량을 초과했습니다\"\u003c/span> → 게시 거부\u003c/span>\u003c/div>\n      \u003c/div>\n      \u003cdiv class=\"dtl\" data-idx=\"2\">\n        \u003cdiv class=\"detail-label\">\u003cspan class=\"dtl-num\">3\u003c/span>시세변동 자동 중지 동작\u003c/div>\n      \u003cdiv class=\"dtl-body\">\u003cspan class=\"box\">· 기준 = 게시 시점 외부지표 스냅숏 — 소스는 업비트·빗썸·바이낸스 시세, 소스·조합 방식은 ADM-03 정책값(단일 출처)\u003cbr>· 시세가 ±2.0% 초과 변동 → RFQ 자동중지 + 보드 리스트 제외 + 게시자 알림\u003cbr>\u003cspan class=\"red\">가격은 당사자 합의 — 외부지표는 가격 결정이 아닌 중지 판단에만 사용\u003c/span>\u003c/span>\u003c/div>\n      \u003c/div>\n    \u003c/div>\n  \u003c/div>\n\u003c/section>\n\n\u003csection class=\"footer-note\">\n  \u003cdiv class=\"note-card\">\n    \u003cdiv class=\"note-title\">비고\u003c/div>\n    \u003cdiv class=\"note-body\">\n      · 내 RFQ를 게시판에 올리는 화면.\u003cbr>\n      · \u003cstrong>[방어 핵심]\u003c/strong> ① 보유·처분권 게이트(거래 안전성 검증)로 허위 게시 차단 ② 편차 경고로 현 시세 대비 과도한 수량 쌍 차단 ③ 시세변동 자동 중지 — 외부지표는 가격 결정이 아닌 중지 판단에만 사용.\u003cbr>\n      · \u003cspan style=\"color:#991b1b;\">[확인필요]\u003c/span> 편차 경고 임계·중지 기준의 ADM-03 정책 연동.\u003cbr>\n      · 상대가 이 RFQ에 신청(BRK-03, 유효 영업일 2일)하면 받은 신청·수락(BRK-04)에서 처리 — 수락 시 즉시 확정되어 이전·완료(BRK-05)로 진행.\u003cbr>\n      · 다음: (게시자) 내 게시 상세·회수 (BRK-06) / (상대측) 신청하기 (BRK-03) → (게시자) 받은 신청·수락 (BRK-04)\n    \u003c/div>\n  \u003c/div>\n\u003c/section>\n\n\u003cscript src=\"screen.js\">\u003c/script>\n\u003c/body>\n\u003c/html>\n", "brk-06.html": "\u003c!DOCTYPE html>\n\u003chtml lang=\"ko\">\n\u003chead>\n\u003cmeta charset=\"UTF-8\">\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n\u003ctitle>화면기획 — 내 게시 상세·회수\u003c/title>\n\u003clink rel=\"stylesheet\" href=\"screen.css\">\n\u003c/head>\n\u003cbody>\n\n\u003cheader class=\"header\">\n  \u003cdiv class=\"crumb\">\u003cspan>마목 중개\u003c/span>\u003cspan class=\"s\">›\u003c/span>\u003cspan>교환게시판\u003c/span>\u003cspan class=\"s\">›\u003c/span>\u003cspan>내 게시\u003c/sp style=\"font-size:10px;color:#64748b;margin-top:6px;\">게시를 내리면 게시판에서 즉시 제외되며 \u003cstrong>되돌릴 수 없습니다\u003c/strong>. 자산 이동·수수료는 발생하지 않습니다. 다시 게시하려면 거래의향 등록에서 새로 게시해 주세요\u003c/div>\n        \u003c/div>\n      \u003c/div>\n\n      \u003cdiv class=\"zone\" data-idx=\"3\">\n        \u003cdiv class=\"zone-highlight\">\u003c/div>\n        \u003cdiv class=\"item-area\" data-highlight=\"3\" style=\"position:relative;padding:6px;border-radius:8px;\">\n          \u003cdiv class=\"pin\" data-idx=\"3\" style=\"top:-4px;right:-4px;\">4\u003c/div>\n          \u003cdiv class=\"note-inline reg\">DSRV는 가격 협의에 참여하지 않으며 게시·신청·수락 기록만 보존합니다. 게시는 구속력이 없는 거래의향 표시이며, 신청 수락 시 즉시 확정됩니다.\u003c/div>\n        \u003c/div>\n      \u003c/div>\n\n    \u003c/div>\n  \u003c/div>\n\n  \u003csvg id=\"connSvg\" style=\"position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:10;overflow:visible;\">\u003c/svg>\n\n  \u003cdiv class=\"items\" id=\"items\">\n    \u003cdiv class=\"nav-global\">\n      \u003cdiv class=\"nav-global-title\">진입 · 전역 이동\u003c/div>\n      \u003cdiv class=\"nav-row\">\u003cspan class=\"nav-el\">상단 GNB(전 화면 공통)\u003c/span>\u003cspan class=\"nav-act\">대시보드/교환하기/교환게시판 메뉴 · 로고 클릭 — 목업에는 상단 요약만 표시\u003c/span>\u003cspan class=\"nav-to\">\u003cstrong>DASH-01 / EXC-01 / BRK-01\u003c/strong> (규칙: DASH-01 항목 5)\u003c/span>\u003c/div>\n      \u003cdiv class=\"nav-note\">· \u003cstrong>진입\u003c/strong>: 교환 게시판(BRK-01)의 내 게시 행 클릭 / 거래의향 등록(BRK-02) 게시 완료 직후 / 대시보드(DASH-01) 거래 목록의 마목 내 게시 행 / 신청 접수 이메일 ① 수신 후 콘솔 직접 접속(메일 본문에 링크 없음)\u003cbr>\n      · 조회 전용 + 회수 1개 버튼 — 게시 조건 수정 기능 없음(수정 = 회수 후 재게시, 역제안·조건 변경 소지 차단)\u003cbr>\n      · 게시자 화면 3종: \u003cstrong>BRK-06(허브)\u003c/strong> → 신청 행 선택 시 BRK-04 → 확정 후 BRK-05 (2026-09-02 신설)\u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"itm\" data-idx=\"0\">\n      \u003cdiv class=\"num\">1\u003c/div>\n      \u003cdiv>\n        \u003cdiv class=\"itm-title\">내 게시 내역 — 공통 포맷 · 게시자 관점\u003cspan class=\"req\">필수\u003c/span>\u003c/div>\ ass=\"nav-act\">신청 0건 — 점선 박스 문구 \"받은 신청이 없습니다\" + 다음 행동 1줄\u003c/span>\u003cspan class=\"nav-to stay\">화면 내 (이동 없음) · 신청 접수 시 이메일 ① 후 목록 갱신\u003c/span>\u003c/div>\n        \u003c/div>\n      \u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"itm\" data-idx=\"2\">\n      \u003cdiv class=\"num\">3\u003c/div>\n      \u003cdiv>\n        \u003cdiv class=\"itm-title\">게시 내리기(회수) — 게시자 능동 행위\u003cspan class=\"req\">필수\u003c/span>\u003c/div>\n        \u003cdiv class=\"itm-desc\">· \u003cstrong>[게시 내리기]\u003c/strong> = 게시자(가입자) 단독 실행 — 클릭 시 확인 문구(되돌릴 수 없음 · 대기 중 신청 자동 종결) 고지 후 실행\u003cbr>· 가능 조건: 상태가 \u003cstrong>게재중 또는 신청접수\u003c/strong>일 때만 — 확정(수락) 이후에는 버튼 미노출(확정 건은 BRK-05 이전 단계, 중지는 DSRV 처리함 T2 '이전 중지'만)\u003cbr>· 회수 시 게시판(BRK-01)에서 즉시 제외 · 상태 '회수' · 자산이동·수수료 없음 · 재게시는 BRK-02에서 새 요청번호로\u003cbr>· 대기 중 신청이 있으면 \u003cstrong>전부 자동 종결(거절과 동일 효과)\u003c/strong> + 신청자에게 이메일 ④ 통지 (기획 가정)\u003cbr>\u003cspan class=\"basis\">근거 V2(자동 매칭 없음 — 게시·회수 모두 게시자 행위) · [확인필요] 대기 신청 종결 규칙\u003c/span>\u003c/div>\n        \u003cdiv class=\"itm-nav\">\u003cspan class=\"nav-tag\">화면 이동 · 인터랙션\u003c/span>\n          \u003cdiv class=\"nav-row\">\u003cspan class=\"nav-el\">[게시 내리기] 버튼\u003c/span>\u003cspan class=\"nav-act\">클릭 — 확인 다이얼로그(되돌릴 수 없음 · 대기 중 신청 자동 종결) 후 실행 · 게시자(가입자) 단독 실행 · 상태 게재중/신청접수일 때만 노출\u003c/span>\u003cspan class=\"nav-to\">상태 '회수' → \u003cstrong>교환 게시판(BRK-01)\u003c/strong> 복귀(리스트에서 제외) · 대기 중 신청자에게 이메일 ④ 발송 · 자산이동·수수료 없음\u003c/span>\u003c/div>\n        \u003c/div>\n      \u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"itm\" data-idx=\"3\">\n      \u003cdiv class=\"num\">4\u003c/div>\n      \u003cdiv>\n        \u003cdiv class=\"itm-title\">\"DSRV 비참여·기록만\" 고지\u003cspan class=\"req\">필수\u003c/span>\u003c/div>\n        \u003cdiv class=\"itm-desc\">· 가격 불관여·당사자성 방어 문구 상시 노출(BRK-03·04와 동일 계열 문구)\u003cbr>· 게시·회수·신청·수락 기록 15년 보존\u003cbr>\u003cspan class=\"basis\">근거 V2 · PRD 하지않는행위 · [로펌게이트] 비참여 범위\u003c/span>\u003c/div>\n      \u003c/div>\n    \u003c/div>\n  \u003c/div>\n\n\u003c/div>\n\n\u003csection class=\"footer-note\" style=\"padding-bottom:0;\">\n  \u003cdiv class=\"note-card\">\n    \u003cdiv class=\"note-title\">상세내용\u003c/div>\n    \u003cdiv class=\"detail-grid\" id=\"detailCol\">\n      \u003cdiv class=\"dtl\" data-idx=\"0\">\n        \u003cdiv class=\"detail-label\">\u003cspan class=\"dtl-num\">1\u003c/span>게시자 화면 3종의 역할\u003c/div>\n      \u003cdiv class=\"dtl-body\">\u003cspan class=\"box\">· \u003cstrong>BRK-06 내 게시 상세\u003c/strong>(게시 단건의 허브 — 조회·회수·신청 목록) / BRK-04 받은 신청·수락(선택한 신청 1건의 처리) / BRK-05 이전·완료(확정 후, 양측 공용)\u003cbr>· BRK-01 내 게시 행 → 항상 BRK-06으로 진입(2026-09-02 변경 — 종전 BRK-04 직행 폐기) → 신청 행 선택 시 BRK-04\u003cbr>· 행위 화면 분리: 회수는 여기, 수락·거절은 BRK-04 — 한 화면에 성격이 다른 구속력 행위를 섞지 않음(감사 추적)\u003c/span>\u003c/div>\n      \u003c/div>\n      \u003cdiv class=\"dtl\" data-idx=\"1\">\n        \u003cdiv class=\"detail-label\">\u003cspan class=\"dtl-num\">2\u003c/span>빈 상태 · 목록 규격\u003c/div>\n      \u003cdiv class=\"dtl-body\">\u003cspan class=\"box\">· 빈 상태 문구 = \"받은 신청이 없습니다 — 신청이 접수되면 등록 이메일로 알려드립니다\" (공통 UI 규격: 문구 + 다음 행동 안내 1줄)\u003cbr>· 목록 컬럼: 신청자(마스킹) · 신청 시점 · 신청 유효기한 · 상태(수락 대기/만료) — 필터·정렬·페이징 없음(최신순)\u003cbr>· 만료된 신청은 목록에 '만료'로 남기고 선택 불가\u003c/span>\u003c/div>\n      \u003c/div>\n      \u003cdiv class=\"dtl\" data-idx=\"2\">\n        \u003cdiv class=\"detail-label\">\u003cspan class=\"dtl-num\">3\u003c/span>회수 상태 전이 · 이메일 ④ 게시 회수 (수신: 대기 중 신청자)\u003c/div>\n      \u003cdiv class=\"dtl-body\">\u003cspan class=\"box\">· 게시 상태: 게재중/신청접수 → \u003cspan class=\"red\">회수\u003c/span>(종결 상태 — 완료(유효기간 만료)와 구분) · 시세변동 자동중지(내부 정책)와 별개로 게시자가 직접 내리는 경로\u003cbr>· 회수 시 대기 중 신청: 상태 '게시 회수로 종결' — 신청자 화면(BRK-07)에 표시, 자산이동·수수료 없음\u003cbr>· \u003cstrong>[이메일 ④ 게시 회수 (수신: 대기 중 신청자, 있을 때만)]\u003c/strong> 제목 \"[DSRV] 신청한 교환 게시가 회수되었습니다 — BRK-20260830-0027\" · 본문: \"게시자가 게시를 회수하여 회원님의 신청이 종결되었습니다. 자산 이동·수수료는 발생하지 않습니다.\" + 요청 내역(공통 포맷) — 발신전용·링크 미포함 등 공통 원칙은 BRK-03 상세 참조\u003cbr>· 회수 이력(행위자·시각)은 AUDIT_LOG — 게시·회수 반복은 ADM-02 이상거래(T5) 룰 대상\u003c/span>\u003c/div>\n      \u003c/div>\n    \u003c/div>\n  \u003c/div>\n\u003c/section>\n\n\u003csection class=\"footer-note\">\n  \u003cdiv class=\"note-card\">\n    \u003cdiv class=\"note-title\">비고\u003c/div>\n    \u003cdiv class=\"note-body\">\n      · 2026-09-02 신설 — 종전에는 신청이 들어온 뒤의 화면(BRK-04)만 있고 신청 없는 내 게시를 열어 볼 화면과 회수 동선이 없었음.\u003cbr>\n      · \u003cstrong>[방어 핵심]\u003c/strong> 게시·회수 모두 게시자의 능동 행위 — 시스템이 게시를 매칭·체결·정리하지 않음(시장개설 아님). 회수는 구속력 발생 전(확정 전)에만 가능하므로 계약 무산 논점 없음.\u003cbr>\n      · \u003cspan style=\"color:#991b1b;\">[확인필요]\u003c/span> 대기 중 신청 자동 종결 규칙(선착순 정책과 연동) · 회수 반복 임계(이상거래 룰).\u003cbr>\n      · 다음: 신청 도착 시 받은 신청·수락 (BRK-04) / 회수 시 교환 게시판 (BRK-01)\n    \u003c/div>\n  \u003c/div>\n\u003c/section>\n\n\u003cscript src=\"screen.js\">\u003c/script>\n\u003c/body>\n\u003c/html>\n", "brk-03.html": "\u003c!DOCTYPE html>\n\u003chtml lang=\"ko\">\n\u003chead>\n\u003cmeta charset=\"UTF-8\">\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n\u003ctitle>화면기획 — 신청하기\u003c/title>\n\u003clink rel=\"stylesheet\" href=\"screen.css\">\n\u003c/head>\n\u003cbody>\n\n\u003cheader class=\"header\">\n  \u003cdiv class=\"crumb\">\u003cspan>마목 중개\u003c/span>\u003cspan class=\"s\">›\u003c/span>\u003cspan>교환게시판\u003c/span>\u003cspan class=\"s\">›\u003c/span>\u003cspan>신청하기\u003c/span>\u003c/div>\n  \u003ch1 class=\"title\">신청하기\u003c/h1>\n  \u003cspan class=\"sid\">BRK-03\u003c/span>\n  \u003cspan class=\"defense\">DSRV 비참여 · 가격 불관여\u003c/span>\n\u003c/header>\n\n\u003cdiv class=\"main\">\n  \u003cdiv class=\"screen-panel\">\n    \u003cdiv style=\"position:relative;display:flex;\">\n      \u003cdiv class=\"labels\" id=\"labels\">\n        \u003cdiv class=\"lbl\">\u003cspan class=\"lbl-text\">전역\u003c/span>\u003c/div>\n        \u003cdiv class=\"lbl\">\u003cspan class=\"lbl-text\">요청 내역\u003c/span>\u003c/div>\n        \u003cdiv class=\"lbl\">\u003cspan class=\"lbl-text\">신청\u003c/span>\u003c/div>\n        \u003cdiv class=\"lbl\">\u003cspan class=\"lbl-text\">비
