인하면 재노출한다.\u003cbr>· KYC 배너와 동시 노출 시 KYC 배너를 위에 놓는다.\u003cbr>\u003cspan class=\"basis\">근거 AUTH-01 항목 4\u003c/span>\u003c/div>\n        \u003cdiv class=\"itm-nav\">\u003cspan class=\"nav-tag\">화면 이동 · 인터랙션\u003c/span>\n          \u003cdiv class=\"nav-row\">\u003cspan class=\"nav-el\">배너\u003c/span>\u003cspan class=\"nav-act\">클릭\u003c/span>\u003cspan class=\"nav-to stay\">무반응 · 재설정 진입은 항목 9 카드\u003c/span>\u003c/div>\n        \u003c/div>\n      \u003c/div>\n    \u003c/div>\n\n\n    \u003cdiv class=\"itm\" data-idx=\"2\">\n      \u003cdiv class=\"num\">3\u003c/div>\n      \u003cdiv>\n        \u003cdiv class=\"itm-title\">거래 목록 행 (클릭)\u003cspan class=\"req\">필수\u003c/span>\u003c/div>\n        \u003cdiv class=\"itm-desc\">· \u003cstrong>컬럼\u003c/strong> 구분 · 요청시점 · 교환(보내는 → 받는) · 비율 · 상태.\u003cbr>· \u003cstrong>구분\u003c/strong> 교환 · 교환게시판. 게시자든 신청자든 '교환게시판'으로 같이 표기한다. 행 클릭 시 이동 화면은 구분 + 내 역할(게시자 / 신청자 · 화면에 표기하지 않는 내부 속성)로 분기한다.\u003cbr>· \u003cstrong>요청시점\u003c/strong> 교환은 요청, 게시는 게시, 신청은 신청 시각. 형식 YYYY-MM-DD HH:MM.\u003cbr>· \u003cstrong>비율\u003c/strong> 스테이블 페어 소수 4자리, ETH 페어 {스테이블}/ETH 소수 2자리. 대기 건도 채운다.\u003cbr>· \u003cstrong>정렬\u003c/strong> 요청시점 내림차순 고정.\u003cbr>· \u003cstrong>조회\u003c/strong> 진입 시 전체 행을 한 번에 불러와 표시한다. 페이지네이션·[더 보기]·무한 스크롤을 두지 않고 페이지 스크롤로 본다.\u003cbr>· \u003cstrong>상태별 문구\u003c/strong> 빈 목록 \"거래 내역이 없습니다\" · 로딩 \"불러오는 중…\" · 실패 시 상단 배너.\u003cbr>· 종결 행은 회색 처리하되 클릭은 막지 않는다.\u003cbr>\u003cspan class=\"basis\">근거 32 §3 DASH-01 · 공통 UI 규격 '목록'(전량 표시 · 2026-09-02 개정)\u003c/span>\u003c/div>\n        \u003cdiv class=\"itm-nav\">\u003cspan class=\"nav-tag\">화면 이동 · 인터랙션\u003c/span>\n          \u003cdiv class=\"nav-row\">\u003cspan class=\"nav-el\">행 전체 — 교환 '요청됨'·'비율 제시'\u003c/span>\u003cspan class=\"nav-act\">클릭\u003c/span>\u003cspan class=\"nav-to\">\u003cstrong>비율 확인·수락(EXC-02)\u003c/strong>\u003c/span>\u003c/div>\n          \u003cdiv class=\"nav-row\">\u003cspan class=\"nav-el\">행 전체 — 교환 '진행 중'\u003c/span>\u003cspan class=\"nav-act\">클릭\u003c/span>\u003cspan class=\"nav-to\">\u003cstrong>승인 진행(EXC-03)\u003c/strong>\u003c/span>\u003c/div>\n          \u003cdiv class=\"nav-row\">\u003cspan class=\"nav-el\">행 전체 — 교환 '완료'·'거절'·'만료'\u003c/span>\u003cspan class=\"nav-act\">클릭\u003c/span>\u003cspan class=\"nav-to\">\u003cstrong>내역·완료(EXC-04)\u003c/strong> — 거절·만료도 동일 화면 재사용 · 분기 없음\u003c/span>\u003c/div>\n          \u003cdiv class=\"nav-row\">\u003cspan class=\"nav-el\">행 전체 — 교환게시판(내 게시) '게재중'·'협의중'·'회수'·'중지'\u003c/span>\u003cspan class=\"nav-act\">클릭\u003c/span>\u003cspan class=\"nav-to\">\u003cstrong>내 게시 상세·회수(BRK-06)\u003c/strong> — '협의중'도 BRK-06 · BRK-04 직행 없음 · 수락은 BRK-06 내 받은 신청\u003c/span>\u003c/div>\n          \u003cdiv class=\"nav-row\">\u003cspan class=\"nav-el\">행 전체 — 교환게시판(내 신청) '협의중'·'거절됨'·'만료'·'종결(게시 회수·중지·게시 만료)'\u003c/span>\u003cspan class=\"nav-act\">클릭\u003c/span>\u003cspan class=\"nav-to\">\u003cstrong>내 신청 상세(BRK-07)\u003c/strong>\u003c/span>\u003c/div>\n          \u003cdiv class=\"nav-row\">\u003cspan class=\"nav-el\">행 전체 — 교환게시판(내 게시·내 신청) '확정'·'완료'\u003c/span>\u003cspan class=\"nav-act\">클릭(양측 공용)\u003c/span>\u003cspan class=\"nav-to\">\u003cstrong>이전·완료(BRK-05)\u003c/strong>\u003c/span>\u003c/div>\n          \u003cdiv class=\"nav-row\">\u003cspan class=\"nav-el\">표 헤더\u003c/span>\u003cspan class=\"nav-act\">클릭\u003c/span>\u003cspan class=\"nav-to stay\">무반응(정렬 변경 없음)\u003c/span>\u003c/div>\n        \u003c/div>\n      \u003c/div>\n    \u003c/div>\n\n    \u003cdiv class=\"itm\" data-idx=\"3\">\n      \u003cdiv class=\"num\">4\u003c/div>\n      \u003cdiv>\n        \u003cdiv class=\"itm-title\">상태 칩 (표시 전용)\u003c/div>\n        \u003cdiv class=\"itm-desc\">· \u003cstrong>교환\u003c/strong> 요청됨 · 비율 제시 · 진행 중 · 완료 · 거절 · 만료.\u003cbr>· \u003cstrong>게시\u003c/strong> 게재중 · 협의중 · 확정 · 완료 · 회수 · 중지. \u003cspan class=\"chk\">[확인필요: '이전 중지' 칩 신설(states ⑧) · 게시 유효기간 만료 라벨(states ⑥)]\u003c/span>\u003cbr>· \u003cstrong>신청\u003c/strong> 협의중 · 확정 · 완료 · 거절됨 · 만료 · 종결(게시 회수·중지·게시 만료).\u003cbr>· '거절'은 코드 REJECTED 단일이다. DSRV 심사와 고객 요청을 칩에서 나누지 않는다.\u003cbr>· \u003cstrong>색\u003c/strong> 대기 파랑 · 진행 노랑 · 완료 초록 · 종결 회색(매핑은 상세 4).\u003cbr>\u003cspan class=\"basis\">근거 notation 상태 칩 · 09 §0\u003c/span>\u003c/div>\n      \u003c/div>\n    \u003c/div>\n\n    \u003cdiv class=\"itm\" data-idx=\"4\">\n      \u003cdiv class=\"num\">5\u003c/div>\n      \u003cdiv>\n        \u003cdiv class=\"itm-title\">지갑 잔고 표 (표시 전용)\u003c/div>\n        \u003cdiv class=\"itm-desc\">· \u003cstrong>값\u003c/strong> 온체인 컨펌 완료분만 반영하고 격리 입금은 제외한다.\u003cbr>· \u003cstrong>자릿수\u003c/strong> ETH 4 · USDC·USDT 2. 뒤 0은 생략하고 티커를 병기한다.\u003cbr>· 보관 칩은 \"콜드 100%\" 고정. 조회 실패 시 \"—\"와 상단 배너.\u003cbr>\u003cspan class=\"basis\">근거 L7 §11 · L6 구분회계 · 32 §3 WAL-01\u003c/span>\u003c/div>\n      \u003c/div>\n    \u003c/div>\n\n    \u003cdiv class=\"itm\" data-idx=\"5\">\n      \u003cdiv class=\"num\">6\u003c/div>\n      \u003cdiv>\n        \u003cdiv class=\"itm-title\">지갑 주소 (표시 전용)\u003c/div>\n        \u003cdiv class=\"itm-desc\">· 마스킹 없이 전문을 표시한다.\u003cbr>· Ethereum 단일 체인 · 3자산 공통 주소 1개.\u003cbr>\u003cspan class=\"basis\">근거 32 §3 WAL-01 · notation 주소 표기\u003c/span>\u003c/div>\n      \u003c/div>\n    \u003c/div>\n\n    \u003cdiv class=\"itm\" data-idx=\"6\">\n      \u003cdiv class=\"num\">7\u003c/div>\n      \u003cdiv>\n        \u003cdiv class=\"itm-title\">'비밀번호 수정' 카드 (클릭)\u003c/div>\n        \u003cdiv class=\"itm-desc\">· KYC 예외 상태에서도 활성이다(게이팅 예외).\u003cbr>\u003cspan class=\"basis\">근거 ISMS 2.5 · 2.10.4\u003c/span>\u003c/div>\n        \u003cdiv class=\"itm-nav\">\u003cspan class=\"nav-tag\">화면 이동 · 인터랙션\u003c/span>\n          \u003cdiv class=\"nav-row\">\u003cspan class=\"nav-el\">카드 전체\u003c/span>\u003cspan class=\"nav-act\">클릭 · 확인 없음\u003c/span>\u003cspan class=\"nav-to\">\u003cstrong>비밀번호 수정(DASH-02)\u003c/strong>\u003c/span>\u003c/div>\n        \u003c/div>\n      \u003c/div>\n    \u003c/div>\n\n    \u003cdiv class=\"itm\" data-idx=\"7\">\n      \u003cdiv class=\"num\">8\u003c/div>\n      \u003cdiv>\n        \u003cdiv class=\"itm-title\">'2차 인증 재설정' 카드 (클릭)\u003c/div>\n        \u003cdiv class=\"itm-desc\">\u003cspan class=\"basis\">근거 ISMS 2.5 · DASH-03\u003c/span>\u003c/div>\n        \u003cdiv class=\"itm-nav\">\u003cspan class=\"nav-tag\">화면 이동 · 인터랙션\u003c/span>\n          \u003cdiv class=\"nav-row\">\u003cspan class=\"nav-el\">카드 전체\u003c/span>\u003cspan class=\"nav-act\">클릭 · 확인 없음\u003c/span>\u003cspan class=\"nav-to\">\u003cstrong>2차 인증 재설정(DASH-03)\u003c/strong>\u003c/span>\u003c/div>\n        \u003c/div>\n      \u003c/div>\n    \u003c/div>\n\n    \u003cdiv class=\"itm\" data-idx=\"8\">\n      \u003cdiv class=\"num\">9\u003c/div>\n      \u003cdiv>\n        \u003cdiv class=\"itm-title\">[활동 로그 다운로드 (CSV)] 버튼\u003c/div>\n        \u003cdiv class=\"itm-desc\">· \u003cstrong>생성\u003c/strong> 기간 선택 없이 전체 기간 1파일을 동기 생성한다.\u003cbr>· \u003cstrong>진행 중\u003c/strong> 버튼 비활성 · 라벨 \"생성 중…\" · 중복 클릭 차단. 실패 시 상단 배너.\u003cbr>· \u003cstrong>파일\u003c/strong> UTF-8(BOM) · 일시 ISO 8601 +09:00 · 수량 쉼표 없음 · 주소 전문 · 0건이면 헤더만.\u003cbr>· 다운로드 행위를 감사기록에 남긴다.\u003cbr>· \u003cspan class=\"chk\">[확인필요: 파일명·컬럼 정의]\u003c/span>\u003cbr>\u003cspan class=\"basis\">근거 L6 §9 · ISMS 감사로그 · notation CSV 표기\u003c/span>\u003c/div>\n        \u003cdiv class=\"itm-nav\">\u003cspan class=\"nav-tag\">화면 이동 · 인터랙션\u003c/span>\n          \u003cdiv class=\"nav-row\">\u003cspan class=\"nav-el\">[활동 로그 다운로드 (CSV)] — 활성 조건\u003c/span>\u003cspan class=\"nav-act\">생성 중 아님\u003c/span>\u003cspan class=\"nav-to stay\">생성 중 → 회색 비활성 · 라벨 \"생성 중…\"\u003c/span>\u003c/div>\n          \u003cdiv class=\"nav-row\">\u003cspan class=\"nav-el\">[활동 로그 다운로드 (CSV)] — 클릭(활성)\u003c/span>\u003cspan class=\"nav-act\">비활성 · \"생성 중…\" → 파일 생성 → 브라우저 다운로드 · 감사기록\u003c/span>\u003cspan class=\"nav-to stay\">화면 잔류 · 라벨 복귀 · 토스트 없음\u003c/span>\u003c/div>\n          \u003cdiv class=\"nav-row\">\u003cspan class=\"nav-el\">[활동 로그 다운로드 (CSV)] — 실패\u003c/span>\u003cspan class=\"nav-act\">생성 오류\u003c/span>\u003cspan class=\"nav-to stay\">화면 잔류 · 상단 배너 · 라벨 복귀\u003c/span>\u003c/div>\n        \u003c/div>\n      \u003c/div>\n    \u003c/div>\n  \u003c/div>\n\n\u003c/div>\n\n\u003csection class=\"footer-note\" style=\"padding-bottom:0;\">\n  \u003cdiv class=\"note-card\">\n    \u003cdiv class=\"note-title\">상세내용\u003c/div>\n    \u003cdiv class=\"detail-grid\" id=\"detailCol\">\n      \u003cdiv class=\"dtl\" data-idx=\"0\">\n        \u003cdiv class=\"detail-label\">\u003cspan class=\"dtl-num\">1\u003c/span>KYC 상태 → 배너 매핑\u003c/div>\n      \u003cdiv class=\"dtl-body\">\u003cspan class=\"box\">· 배너 노출 상태 = 심사중(EDD) · 일시제한 · 동결 / 활성은 미노출 · 문구는 상태 무관 동일\u003cbr>· EXC-01·BRK-02·BRK-03과 동일 문구·규격 · 별도 요약 문구 없음\u003c/span>\u003c/div>\n      \u003c/div>\n      \u003cdiv class=\"dtl\" data-idx=\"2\">\n        \u003cdiv class=\"detail-label\">\u003cspan class=\"dtl-num\">3\u003c/span>행 클릭 분기 — 판별 키\u003c/div>\n      \u003cdiv class=\"dtl-body\">\u003cspan class=\"box\">· 분기 = \u003cb>구분 × 상태\u003c/b> 2열로 목적지 1개 결정(매핑 상세 4)\u003cbr>· 동일 라벨 '협의중' = 게시 행 → BRK-06 / 신청 행 → BRK-07 · 구분 열로 판별\u003cbr>· '중지'(price guard 자동중지) 동일 규칙 · 재개는 재게시\u003c/span>\u003c/div>\n      \u003c/div>\n      \u003cdiv class=\"dtl\" data-idx=\"3\">\n        \u003cdiv class=\"detail-label\">\u003cspan class=\"dtl-num\">4\u003c/span>상태 칩 매핑 표\u003c/div>\n      \u003cdiv class=\"dtl-body\">\u003cspan class=\"box\">· 교환 — 요청됨·비율 제시 → EXC-02 / 진행 중 → EXC-03 / 완료·거절·만료 → EXC-04\u003cbr>· 게시 — 게재중·협의중·회수·중지 → BRK-06 / 확정·완료 → BRK-05\u003cbr>· 신청 — 협의중·거절됨·만료·종결(게시 회수·중지·게시 만료) → BRK-07 / 확정·완료 → BRK-05\u003cbr>· 색 대기(요청됨·비율 제시·게재중·협의중) 파랑 / 진행(진행 중·확정) 노랑 / 완료 초록 / 종결(거절·거절됨·만료·회수·중지·종결 계열) 회색\u003cbr>· CSV 코드 = 영문 대문자 \u003cspan class=\"chk\">[확인필요: 전체 코드 표 — states]\u003c/span>\u003cbr>· 내부 승인 단계는 고객에게 노출하지 않는다(교환·게시판 합산 단일 목록)\u003c/span>\u003c/div>\n      \u003c/div>\n      \u003cdiv class=\"dtl\" data-idx=\"4\">\n        \u003cdiv class=\"detail-label\">\u003cspan class=\"dtl-num\">5\u003c/span>조회 전용 · 집행 분리\u003c/div>\n      \u003cdiv class=\"dtl-body\">\u003cspan class=\"box\">· 출금·이전 집행 = ADM-02 처리함 승인 + 콜드 2인 멀티시그 · 고객 화면 기능 없음\u003cbr>· 입금 예외 — 오입금·컨펌 중·스팸 = 잔고 미반영 / KYT 고위험·제재 적중 = 격리·동결·STR · 판정은 ADM-02 · 고객 화면은 상태만 \u003cspan class=\"chk\">[확인필요: 오입금 반환 가스비 부담]\u003c/span>\u003c/span>\u003c/div>\n      \u003c/div>\n      \u003cdiv class=\"dtl\" data-idx=\"7\">\n        \u003cdiv class=\"detail-label\">\u003cspan class=\"dtl-num\">8\u003c/span>2FA 재설정 흐름\u003c/div>\n      \u003cdiv class=\"dtl-body\">\u003cspan class=\"box\">· 재설정 절차 = DASH-03 · 완료(ONB-01~03 재수행 → 재로그인) 후 권고 배너 소멸\u003c/span>\u003c/div>\n      \u003c/div>\n      \u003cdiv class=\"dtl\" data-idx=\"8\">\n        \u003cdiv class=\"detail-label\">\u003cspan class=\"dtl-num\">9\u003c/span>활동 로그 성격\u003c/div>\n      \u003cdiv class=\"dtl-body\">\u003cspan class=\"box\">· 원본 로그 서버 보관(거래 15년 / AML 5년) · 제공 경로는 CSV 단일\u003cbr>· 기록 대상 = 로그인 · 거래 요청·수락 · 게시·회수 · 비밀번호 변경 · 2FA 재설정 · CSV 다운로드\u003c/span>\u003c/div>\n      \u003c/div>\n    \u003c/div>\n  \u003c/div>\n\u003c/section>\n\n\u003csection class=\"footer-note\">\n  \u003cdiv class=\"note-card\">\n    \u003cdiv class=\"note-title\">비고\u003c/div>\n    \u003cdiv class=\"note-body\">· \u003cstrong>구분 라벨 '교환게시판 신청' 폐지(2026-09-02 사용자 결정)\u003c/strong> — 게시·신청 모두 '교환게시판'으로 표기하고 행 클릭 분기는 내 역할(게시자 / 신청자)로 한다.\u003cbr>· 거래 요약 카드 제거(2026-09-02 사용자 결정) — 대시보드는 목록·잔고·계정 카드만 두고 집계 표시를 하지 않는다.\u003cbr>· 로그인 후 첫 화면 · 지갑 별도 화면 없음(구 WAL-01~03 삭제) — 잔고·주소는 이 화면, 출금·이전은 서면 요청, 화이트리스트는 내부 관리.\u003cbr>· \u003cstrong>규제 구분\u003c/strong> — 목록 '교환' = 나목(교환) / '교환게시판'(내 게시·내 신청 공통 표기) = 마목(교환의 중개) · 화면 라벨에 규제 용어 미노출.\u003cbr>· \u003cstrong>2026-09-02 설명 개정\u003c/strong> — 항목설명을 구현 지시문(명사형 종결)으로 재작성 · 화면에 보이는 요소(컬럼·라벨·문구)는 재기술하지 않음 · 편의기능 미도입(카드 필터·주기 갱신·정렬·기간 선택·주소 복사·QR·배너 닫기 없음) · 미결은 구현 단순한 쪽으로 확정(기관 배지 = 로그아웃 메뉴 / 거절·만료도 EXC-04 재사용 / 협의중 행은 BRK-06 / 신청 행은 신청 상태 표시).\u003cbr>· \u003cstrong>화면 변경\u003c/strong> — 계정·보안 카드 부제 삭제 · 잔고 하단 고지 문구 삭제 · 지갑주소 1행(이더리움 공통 주소) · 구분 라벨 교환/교환게시판/교환게시판 신청 · 목록 '번호' 열 → '요청시점'.\u003cbr>· 고객 화면 '보류' 라벨 폐지 반영(2026-09-02 결정 · states.html v0.4) — 진행 중 이후는 완료 또는 거절뿐.\u003cbr>· \u003cstrong>상태 라벨 정본 = states.html v0.4\u003c/strong> — 신청 상태는 C표 기준(협의중부터 · 종결(사유) 형태) · 임시로 썼던 '신청됨'·'게시 회수' 단독 라벨 폐기.\u003cbr>· \u003cstrong>확정(2026-09-02)\u003c/strong> — 거래 목록은 [더 보기] 없이 전량 표시하고 페이지 스크롤로 본다. notation 목록 규격도 같은 날 전량 표시로 개정돼 전 목록 공통 규칙이다(화면 예외 아님).\u003cbr>· 남은 \u003cspan class=\"chk\">[확인필요]\u003c/span> — KYC 배너 안내 이메일 주소 · CSV 파일명·컬럼 정의 · 상태 코드 표 확정(states 결정필요 ⑨) · '이전 중지' 칩 신설(⑧) · 게시 유효기간 만료 라벨(⑥) · 오입금 반환 가스비 부담.\u003cbr>· ISMS 2.10.4는 현재 비밀번호 확인으로 충족한다는 전제 · 심사 시 해석 \u003cspan class=\"chk\">[확인필요]\u003c/span>.\u003cbr>· 이전 = AUTH-01 / 다음 = EXC-01 · BRK-01\u003c/div>\n  \u003c/div>\n\u003c/section>\n\n\u003cscript src=\"screen.js\">\u003c/script>\n\u003c/body>\n\u003c/html>\n", "dash-02.html": "\u003c!DOCTYPE html>\n\u003chtml lang=\"ko\">\n\u003chead>\n\u003cmeta charset=\"UTF-8\">\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n\u003ctitle>화면기획 — 비밀번호 수정\u003c/title>\n\u003clink rel=\"stylesheet\" href=\"screen.css\">\n\u003c/head>\n\u003cbody>\n\n\u003cheader class=\"header\">\n  \u003cdiv class=\"crumb\">\u003cspan>홈\u003c/span>\u003cspan class=\"s\">›\u003c/span>\u003cspan>계정·보안\u003c/span>\u003cspan class=\"s\">›\u003c/span>\u003cspan>비밀번호 수정\u003c/span>\u003c/div>\n  \u003ch1 class=\"title\">비밀번호 수정\u003c/h1>\n  \u003cspan class=\"sid\">DASH-02\u003c/span>\n  \u003cspan class=\"defense\">현재 비밀번호 확인 · 비밀번호 규칙 · 독립 페이지\u003c/span>\n\u003c/header>\n\n\u003cdiv class=\"main\">\n  \u003cdiv class=\"screen-panel\">\n    \u003cdiv style=\"position:relative;display:flex;\">\n      \u003cdiv class=\"labels\" id=\"labels\">\n        \u003cdiv class=\"lbl\">\u003cspan class=\"lbl-text\">전역\u003cbr>브랜드 패널\u003c/span>\u003c/div>\n        \u003cdiv class=\"lbl\">\u003cspan class=\"lbl-text\">비밀번호\u003cbr>변경\u003c/span>\u003c/div>\n        \u003cdiv class=\"lbl\">\u003cspan class=\"lbl-text\">액션\u003c/span>\u003c/div>\n        \u003cdiv class=\"lbl\">\u003cspan class=\"lbl-text\">푸터\u003c/span>\u003c/div>\n      \u003c/div>\n      \u003csvg id=\"bracketSvg\" width=\"24\" style=\"flex-shrink:0;overflow:visible;\">\u003c/svg>\n    \u003c/div>\n\n    \u003cdiv class=\"frame\" id=\"frame\" style=\"background:linear-gradient(135deg,#e3eafc 0%,#f1f4fa 55%,#edf3fb 100%);\">\n      \u003c!-- 전역: 브랜드 패널 — 독립 페이지(콘솔 GNB 없음 · 2026-09-02 확정) · 핀 없음 -->\n      \u003cdiv class=\"zone\" data-idx=\"\">\n        \u003cdiv class=\"zone-highlight\">\u003c/div>\n        \u003cdiv class=\"brand-panel\">\n          \u003cdiv class=\"bp-logo\">DSRV\u003cspan>®\u003c/span>\u003c/div>\n          \u003cdiv class=\"bp-tag\">한 번의 연동으로 완성하는\u003cbr>\u003cstrong>쉽고 강력한 온체인 금융 OS\u003c/strong>\u003c/div>\n          \u003cdiv class=\"bp-sub\">자산의 발행·결제·운용·보관을 위한 엔터프라이즈급 블록체인 인프라.\u003c/div>\n        \u003c/div>\n      \u003c/div>\n\n      \u003c!-- 카드: 비밀번호 변경 입력 -->\n      \u003cdiv class=\"zone card\" data-idx=\"0,1,2\">\n        \u003cdiv class=\"zone-highlight\">\u003c/div>\n        \u003cdiv class=\"zone-title\" style=\"margin-bottom:10px;\">비밀번호 변경\u003c/div>\n        \u003cdiv class=\"item-area\" data-highlight=\"0\" style=\"position:relative;padding:4px;border-radius:8px;margin-bottom:4px;\">\n          \u003cdiv class=\"pin\" data-idx=\"0\" style=\"top:-6px;right:-6px;\">1\u003c/div>\n          \u003cdiv class=\"flabel\">기존 비밀번호\u003cspan class=\"star\">*\u003c/span>\u003c/div>\n          \u003cdiv class=\"field fg\">\u003cspan class=\"ph\">비밀번호 입력\u003c/span>\u003c/div>\n        \u003c/div>\n        \u003cdiv class=\"item-area\" data-highlight=\"1\" style=\"position:relative;padding:4px;border-radius:8px;margin-bottom:4px;\">\n          \u003cdiv class=\"pin\" data-idx=\"1\" style=\"top:-6px;right:-6px;\">2\u003c/div>\n          \u003cdiv class=\"flabel\">새 비밀번호\u003cspan class=\"star\">*\u003c/span>\u003c/div>\n          \u003cdiv class=\"field fg\">\u003cspan class=\"ph\">비밀번호 입력\u003c/span>\u003c/div>\n        \u003c/div>\n        \u003cdiv class=\"item-area\" data-highlight=\"2\" style=\"position:relative;padding:4px;border-radius:8px;margin-bottom:4px;\">\n          \u003cdiv class=\"pin\" data-idx=\"2\" style=\"top:-6px;right:-6px;\">3\u003c/div>\n          \u003cdiv class=\"flabel\">새 비밀번호 확인\u003cspan class=\"star\">*\u003c/span>\u003c/div>\n          \u003cdiv class=\"field\">\u003cspan class=\"ph\">비밀번호 재입력\u003c/span>\u003c/div>\n        \u003c/div>\n      \u003c/div>\n\n      \u003c!-- 액션: 취소(시안 없음 · 기획 유지) / 다음 -->\n      \u003cdiv class=\"zone card\" data-idx=\"3,4\">\n        \u003cdiv class=\"zone-highlight\">\u003c/div>\n        \u003cdiv style=\"font-size:9px;color:#b45309;padding:0 4px 4px;\">▼ 시안은 [다음] 1개 — [취소]는 종료 동선 규칙(뒤로가기 미지원)으로 기획 유지 \u003cstrong>[디자인 요청]\u003c/strong>\u003c/div>\n        \u003cdiv class=\"row\" style=\"gap:8px;\">\n          \u003cdiv class=\"item-area\" data-highlight=\"3\" style=\"position:relative;flex:1;padding:4px;border-radius:8px;\">\n            \u003cdiv class=\"pin\" data-idx=\"3\" style=\"top:-8px;right:-6px;\">4\u003c/div>\n            \u003cdiv class=\"btn ghost\" style=\"border-radius:12px;\">취소\u003c/div>\n          \u003c/div>\n          \u003cdiv class=\"item-area\" data-highlight=\"4\" style=\"position:relative;flex:2;padding:4px;border-radius:8px;\">\n            \u003cdiv class=\"pin\" data-idx=\"4\" style=\"top:-8px;right:-6px;\">5\u003c/div>\n            \u003cdiv class=\"btn primary fg\">다음\u003c/div>\n          \u003c/div>\n        \u003c/div>\n      \u003c/div>\n\n      \u003c!-- 푸터 -->\n      \u003cdiv class=\"zone\" data-idx=\"\">\n        \u003cdiv class=\"zone-highlight\">\u003c/div>\n        \u003cdiv class=\"pg-footer\">\u003cspan>© dsrv labs Co., Ltd. All Rights Reserved\u003c/span>\u003cspan class=\"lnk\">공지사항\u003c/span>\u003cspan class=\"lnk\">개인정보처리방침\u003c/span>\u003cspan class=\"lnk\">이용약관\u003c/span>\u003c/div>\n      \u003c/div>\n    \u003c/div>\n  \u003c/div>\n\n  \u003csvg id=\"connSvg\" style=\"position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:10;overflow:visible;\">\u003c/svg>\n\n  \u003cdiv class=\"items\" id=\"items\">\n    \u003cdiv class=\"nav-global\">\n      \u003cdiv class=\"nav-global-title\">진입 · 전역 이동\u003c/div>\n      \u003cdiv class=\"nav-note\">· \u003cstrong>전역 이동\u003c/strong> 프레임(브랜드 패널 · 푸터 · 뒤로가기)의 동작은 계정 활성화 1/3 비밀번호 설정(ONB-01)의 표와 같다. 다른 점 없음(브랜드 패널에 'DSRV 서비스 소개 보기 →' 링크가 없는 것도 ONB-01과 같다). 로그인 상태 화면이지만 콘솔 상단 메뉴(GNB)와 기관 배지가 없어 다른 콘솔 화면으로 바로 갈 수 없고 로그아웃 메뉴도 없다.\u003cbr>\n      · \u003cstrong>진입\u003c/strong> 대시보드(DASH-01) 계정·보안 영역의 '비밀번호 수정' 카드 클릭.\u003cbr>\n      · \u003cstrong>나가기\u003c/strong> [취소] 또는 변경 완료 → 대시보드(DASH-01). 그 외 이동 경로 없음.\u003c/div>\n    \u003c/div>\n\n    \u003cdiv class=\"itm\" data-idx=\"0\">\n      \u003cdiv class=\"num\">1\u003c/div>\n      \u003cdiv>\n        \u003cdiv class=\"itm-title\">기존 비밀번호 입력\u003cspan class=\"req\">필수\u003c/span>\u003c/div>\n        \u003cdiv class=\"itm-desc\">\u003cstrong>입력 가능\u003c/strong> 항상 가능하다.\u003cbr>\u003cstrong>허용 문자\u003c/strong> 제한을 두지 않는다. 일치 여부만 보므로 문자 필터가 필요 없다.\u003cbr>\u003cstrong>검증\u003c/strong> [다음] 클릭 시 클라이언트가 빈칸 여부를 보고, 통과하면 서버가 일치를 확인한다.\u003cbr>\u003cstrong>실패\u003c/strong> 이 필드만 초기화하고(새 비밀번호·확인 값은 유지) 필드 아래 인라인 ⚠를 띄운다. 연속 불일치는 AUTH-01 통합 실패 카운터에 합산하고 {정책값 5회} 도달 시 로그아웃 + 계정 잠금.\u003cbr>\u003cstrong>연동\u003c/strong> 없음. 빈칸 여부도 [다음] 클릭 시 본다.\u003cbr>\u003cspan class=\"basis\">근거 ISMS 2.5.4 · 2.10.4\u003c/span>\u003c/div>\n        \u003cdiv class=\"itm-nav\">\u003cspan class=\"nav-tag\">화면 이동 · 인터랙션\u003c/span>\n          \u003cdiv class=\"nav-row\">\u003cspan class=\"nav-el\">기존 비밀번호 필드\u003c/span>\u003cspan class=\"nav-act\">[다음] 클릭 시 빈칸 판정 → 통과 시 서버 일치 확인\u003c/span>\u003cspan class=\"nav-to stay\">빈칸 → 인라인 ⚠ \"값을 입력해 주세요\" / 불일치 → 인라인 ⚠ · 이 필드 초기화\u003c/span>\u003c/div>\n        \u003c/div>\n      \u003c/div>\n    \u003c/div>\n\n    \u003cdiv class=\"itm\" data-idx=\"1\">\n      \u003cdiv class=\"num\">2\u003c/div>\n      \u003cdiv>\n        \u003cdiv class=\"itm-title\">새 비밀번호 입력\u003cspan class=\"req\">필수\u003c/span>\u003c/div>\n        \u003cdiv class=\"itm-desc\">\u003cstrong>입력 가능\u003c/strong> 항상 가능하다.\u003cbr>\u003cstrong>허용 문자\u003c/strong> 영문 대·소문자 · 숫자 · 특수문자 !@#$%^&amp;*()만 받고 그 외 문자는 입력 시점에 무시한다. 길이는 8~20자로, 20자를 넘는 입력은 받지 않는다.\u003cbr>\u003cstrong>검증\u003c/strong> 입력 중에는 판정하지 않는다. [다음] 클릭 시 입력된 값 전체를 대상으로 규칙 ①~④(조합 3종 이상 · 8~20자 · 이메일 @ 앞부분과 동일 금지 · 동일 문자 반복 금지)를 클라이언트가 한 번에 판정한다. 규칙 ② 비교 대상은 로그인 계정 이메일이다. 서버는 규칙을 다시 검증하지 않는다.\u003cbr>\u003cstrong>실패\u003c/strong> 빈칸이면 인라인 ⚠ \"값을 입력해 주세요\", 규칙 미충족이면 인라인 ⚠에 위반한 규칙을 문구로 보인다. 입력값은 유지하고 화면에 머문다. 서버 응답에서 기존 비밀번호와 같으면 인라인 ⚠를 띄운다(비교 범위는 직전 1회 · 해시 1개 보관).\u003cbr>\u003cstrong>연동\u003c/strong> 없음. 판정은 모두 [다음] 클릭 시 한다.\u003cbr>\u003cstrong>저장\u003c/strong> 단방향 해시와 salt로만 저장한다.\u003cbr>\u003cspan class=\"basis\">근거 ISMS 2.5.4 · ONB-01 항목 1\u003c/span>\u003c/div>\n        \u003cdiv class=\"itm-nav\">\u003cspan class=\"nav-tag\">화면 이동 · 인터랙션\u003c/span>\n          \u003cdiv class=\"nav-row\">\u003cspan class=\"nav-el\">새 비밀번호 필드\u003c/span>\u003cspan class=\"nav-act\">[다음] 클릭 시 빈칸·규칙 ①~④ 판정\u003c/span>\u003cspan class=\"nav-to stay\">위반 → 인라인 ⚠(위반 규칙 문구) · 값 유지 · 화면 잔류\u003c/span>\u003c/div>\n        \u003c/div>\n      \u003c/div>\n    \u003c/div>\n\n    \u003cdiv class=\"itm\" data-idx=\"2\">\n      \u003cdiv class=\"num\">3\u003c/div>\n      \u003cdiv>\n        \u003cdiv class=\"itm-title\">새 비밀번호 확인 입력\u003cspan class=\"req\">필수\u003c/span>\u003c/div>\n        \u003cdiv class=\"itm-desc\">\u003cstrong>입력 가능\u003c/strong> 항상 가능하다.\u003cbr>\u003cstrong>허용 문자\u003c/strong> 항목 2와 같다.\u003cbr>\u003cstrong>검증\u003c/strong> [다음] 제출 시에만 항목 2 값과 비교한다. 키 입력마다·포커스 아웃 시에는 판정하지 않는다.\u003cbr>\u003cstrong>실패 처리\u003c/strong> 불일치하면 인라인 ⚠ \"비밀번호가 일치하지 않습니다\"를 띄우고 이 필드를 초기화한다(항목 2 값은 유지). 일치 표시(✓)는 두지 않는다.\u003cbr>\u003cstrong>연동\u003c/strong> 없음. 항목 2를 고쳐도 다시 비교하지 않는다(제출 시 판정).\u003cbr>\u003cspan class=\"basis\">근거 ISMS 2.5.4 · 공통 UI 규격 오류 문구 ①\u003c/span>\u003c/div>\n        \u003cdiv class=\"itm-nav\">\u003cspan class=\"nav-tag\">화면 이동 · 인터랙션\u003c/span>\n          \u003cdiv class=\"nav-row\">\u003cspan class=\"nav-el\">새 비밀번호 확인 필드\u003c/span>\u003cspan class=\"nav-act\">[다음] 제출 시 비교\u003c/span>\u003cspan class=\"nav-to stay\">불일치 → 인라인 ⚠ · 이 필드 초기화 · 화면 잔류\u003c/span>\u003c/div>\n        \u003c/div>\n      \u003c/div>\n    \u003c/div>\n\n    \u003cdiv class=\"itm\" data-idx=\"3\">\n      \u003cdiv class=\"num\">4\u003c/div>\n      \u003cdiv>\n        \u003cdiv class=\"itm-title\">[취소] 버튼 (시안 없음 · 기획 유지)\u003c/div>\n        \u003cdiv class=\"itm-desc\">\u003cstrong>노출\u003c/strong> 항상 보인다.\u003cbr>\u003cstrong>클릭 가능\u003c/strong> 항상 활성이다.\u003cbr>\u003cstrong>확인 사항\u003c/strong> 없다. 확인 다이얼로그를 띄우지 않는다.\u003cbr>\u003cstrong>액션\u003c/strong> 입력값을 파기하고 DASH-01로 이동한다.\u003cbr>\u003cspan class=\"chk\">[디자인 요청]\u003c/span> 시안에 없는 버튼이다.\u003cbr>\u003cspan class=\"basis\">근거 notation 공통 UI 규격 '종료 동선'\u003c/span>\u003c/div>\n        \u003cdiv class=\"itm-nav\">\u003cspan class=\"nav-tag\">화면 이동 · 인터랙션\u003c/span>\n          \u003cdiv class=\"nav-row\">\u003cspan class=\"nav-el\">[취소] — 활성 조건\u003c/span>\u003cspan class=\"nav-act\">항상 활성\u003c/span>\u003cspan class=\"nav-to stay\">처리 중 → 회색 비활성\u003c/span>\u003c/div>\n          \u003cdiv class=\"nav-row\">\u003cspan class=\"nav-el\">[취소] — 클릭(활성)\u003c/span>\u003cspan class=\"nav-act\">확인 없음 · 3필드 입력값 파기\u003c/span>\u003cspan class=\"nav-to\">\u003cstrong>대시보드(DASH-01)\u003c/strong> · 토스트 없음\u003c/span>\u003c/div>\n        \u003c/div>\n      \u003c/div>\n    \u003c/div>\n\n    \u003cdiv class=\"itm\" data-idx=\"4\">\n      \u003cdiv class=\"num\">5\u003c/div>\n      \u003cdiv>\n        \u003cdiv class=\"itm-title\">[다음] 버튼 (= 비밀번호 변경 저장)\u003cspan class=\"req\">필수\u003c/span>\u003c/div>\n        \u003cdiv class=\"itm-desc\">\u003cstrong>노출\u003c/strong> 항상 보인다.\u003cbr>\u003cstrong>클릭 가능\u003c/strong> 항상 활성이다. 처리 중에만 비활성으로 두어 중복 클릭을 막는다.\u003cbr>\u003cstrong>확인 사항\u003c/strong> 클릭 시 클라이언트가 세 필드를 한 번에 검사한다 — ① 빈칸 ② 새 비밀번호 규칙 ①~④ ③ 확인 값 일치. 문제가 있는 필드마다 인라인 ⚠를 동시에 보이고 서버 요청을 보내지 않는다. 모두 통과하면 요청하고, 서버는 기존 비밀번호 일치와 새 비밀번호가 기존과 다른지만 확인한다. 비밀번호 규칙은 다시 검증하지 않고, 확인 다이얼로그와 2차 인증 재입력은 없다.\u003cbr>\u003cstrong>액션\u003c/strong> 비밀번호를 단방향 해시와 salt로 저장하고, 타 기기 세션을 전체 로그아웃하며(현재 세션 유지) 변경 이력을 감사기록에 남기고 통합 실패 카운터를 초기화한 뒤 DASH-01로 복귀해 토스트를 띄운다.\u003cbr>\u003cspan class=\"chk\">[디자인 요청]\u003c/span> 시안 라벨 '다음'을 '변경' 등으로 조정한다.\u003cbr>\u003cspan class=\"basis\">근거 ISMS 2.5.4 · 2.9.4\u003c/span>\u003c/div>\n        \u003cdiv class=\"itm-nav\">\u003cspan class=\"nav-tag\">화면 이동 · 인터랙션\u003c/span>\n          \u003cdiv class=\"nav-row\">\u003cspan class=\"nav-el\">[다음] — 활성 조건\u003c/span>\u003cspan class=\"nav-act\">항상 활성 · 처리 중에만 비활성(중복 클릭 차단)\u003c/span>\u003cspan class=\"nav-to stay\">입력 상태와 무관하게 클릭 가능 · 검사는 클릭 시\u003c/span>\u003c/div>\n          \u003cdiv class=\"nav-row\">\u003cspan class=\"nav-el\">[다음] — 클릭 · 클라이언트 검사 실패\u003c/span>\u003cspan class=\"nav-act\">빈칸 / 새 비밀번호 규칙 ①~④ 미충족 / 확인 불일치 중 하나 이상\u003c/span>\u003cspan class=\"nav-to stay\">화면 잔류 · 문제 있는 필드마다 인라인 ⚠ 동시 표시(빈칸 \"값을 입력해 주세요\" · 규칙은 위반 문구 · 불일치 \"비밀번호가 일치하지 않습니다\"+확인 필드 초기화) · 서버 요청 없음\u003c/span>\u003c/div>\n          \u003cdiv class=\"nav-row\">\u003cspan class=\"nav-el\">[다음] — 클릭 · 클라이언트 검사 통과 · Enter\u003c/span>\u003cspan class=\"nav-act\">확인 없음 → 라벨 \"저장 중…\"·비활성(중복 클릭 차단) → 서버: 기존 비밀번호 일치 확인 → 저장 · 타 기기 세션 종료 · 감사로그\u003c/span>\u003cspan class=\"nav-to\">\u003cstrong>대시보드(DASH-01)\u003c/strong> · 상단 토스트 \"비밀번호가 변경되었습니다\"(3초 자동 닫힘) \u003cspan class=\"chk\">[확인필요: 토스트 문구·시간]\u003c/span>\u003c/span>\u003c/div>\n          \u003cdiv class=\"nav-row\">\u003cspan class=\"nav-el\">[다음] — 서버 응답 실패\u003c/span>\u003cspan class=\"nav-act\">기존 비밀번호 불일치 / 새 비밀번호 = 기존 비밀번호 / 서버 오류\u003c/span>\u003cspan class=\"nav-to stay\">화면 잔류 · 불일치 → 항목 1 아래 ⚠ · 항목 1 초기화 / 동일 → 항목 2 아래 ⚠ / 서버 오류 → 상단 배너 \"일시적인 오류입니다. 잠시 후 다시 시도해 주세요\" · 버튼 라벨 복귀 · 해당 필드 외 값 유지\u003c/span>\u003c/div>\n        \u003c/div>\n      \u003c/div>\n    \u003c/div>\n  \u003c/div>\n\n\u003c/div>\n\n\u003csection class=\"footer-note\" style=\"padding-bottom:0;\">\n  \u003cdiv class=\"note-card\">\n    \u003cdiv class=\"note-title\">상세내용\u003c/div>\n    \u003cdiv class=\"detail-grid\" id=\"detailCol\">\n      \u003cdiv class=\"dtl\" data-idx=\"0\">\n        \u003cdiv class=\"detail-label\">\u003cspan class=\"dtl-num\">1\u003c/span>본인 확인 방식\u003c/div>\n      \u003cdiv class=\"dtl-body\">\u003cspan class=\"box\">\u003cstrong>본인 확인\u003c/strong> 기존 비밀번호 확인을 ISMS 2.10.4(중요정보 변경 시 재인증)의 충족 수단으로 해석한다.\u003cbr>\u003cstrong>오류 노출\u003c/strong> 이미 인증된 세션이므로 어느 필드가 틀렸는지 노출해도 된다.\u003cbr>\u003cstrong>잠금\u003c/strong> AUTH-01 통합 실패 카운터에 합산하고 이 화면 전용 카운터는 두지 않는다.\u003c/span>\u003c/div>\n      \u003c/div>\n      \u003cdiv class=\"dtl\" data-idx=\"3\">\n        \u003cdiv class=\"detail-label\">\u003cspan class=\"dtl-num\">4\u003c/span>안내문구 정합\u003c/div>\n      \u003cdiv class=\"dtl-body\">\u003cspan class=\"box\">\u003cstrong>규칙 동일\u003c/strong> 규칙 판정(조합·길이 8~20자·이메일 동일 문자·동일 문자 반복·허용 특수문자)은 계정 활성화(ONB-01)의 새 비밀번호 입력과 같다.\u003cbr>\u003cstrong>검증 위치\u003c/strong> 규칙 판정은 [다음] 클릭 시 클라이언트가 한 번에 하고 서버는 기존 비밀번호 일치 확인과 저장만 한다. 입력 중 실시간 검증은 없다.\u003c/span>\u003c/div>\n      \u003c/div>\n      \u003cdiv class=\"dtl\" data-idx=\"4\">\n        \u003cdiv class=\"detail-label\">\u003cspan class=\"dtl-num\">5\u003c/span>변경 후 처리(백엔드)\u003c/div>\n      \u003cdiv class=\"dtl-body\">\u003cspan class=\"box\">\u003cstrong>세션\u003c/strong> 타 기기 세션을 전체 로그아웃하고 현재 세션은 유지한다. 계정당 1세션이라 타 세션이 없는 것이 정상이며 방어적 처리다.\u003cbr>\u003cstrong>기록\u003c/strong> 변경 이력을 감사기록에 남기고 비밀번호는 단방향 해시와 salt로만 저장한다.\u003cbr>\u003cstrong>통지\u003c/strong> 이메일 통지 6종에 없으므로 변경 알림 메일은 보내지 않는다.\u003c/span>\u003c/div>\n      \u003c/div>\n    \u003c/div>\n  \u003c/div>\n\u003c/section>\n\n\u003csection class=\"footer-note\">\n  \u003cdiv class=\"note-card\">\n    \u003cdiv class=\"note-title\">비고\u003c/div>\n    \u003cdiv class=\"note-body\">· DASH-01 계정·보안 '비밀번호 수정' 진입 화면 — 기존 비밀번호 확인 → 변경의 최소 화면 · 독립 페이지(콘솔 GNB 없음).\u003cbr>· \u003cstrong>[백엔드 통제]\u003c/strong> 타 기기 세션 전체 로그아웃 · 변경 이력 감사기록 · 단방향 해시+salt 저장(원문 미보관) — 근거 ISMS 2.5.4·2.9.4.\u003cbr>· \u003cstrong>[Figma 반영 2026-09-02]\u003c/strong> 시안 'Change Password' 적용 · [취소]·권고 1줄·○/✓ 표시는 시안 없음 → 기획 유지 \u003cspan class=\"chk\">[디자인 요청]\u003c/span> · 원본 \u003cspan class=\"mono\">reference/figma/_crops/F7_row2_c3.png\u003c/span>.\u003cbr>· \u003cstrong>확정(구현 단순 우선)\u003c/strong> — 표시 토글 없음 · 강제 변경주기 없음(권고만) · 잠금 카운터는 AUTH-01 통합 카운터 합산 · 이전 비밀번호 재사용 제한은 직전 1회만 · 변경 알림 이메일 없음.\u003cbr>· \u003cstrong>확정(2026-09-02)\u003c/strong> — 비밀번호 규칙 안내 블록 삭제(ONB-01과 동일). 규칙 원문은 AUTH-01 비고에만 두고 화면에는 위반 시 오류 문구로만 알린다.\u003cbr>· 남은 \u003cspan class=\"chk\">[확인필요]\u003c/span> — ISMS 2.10.4 충족 해석 · 완료 토스트 문구 · 버튼 라벨 '다음' 조정 · 로고 클릭 동작.\u003cbr>· 이전 = DASH-01 / 관련 = DASH-03\u003c/div>\n  \u003c/div>\n\u003c/section>\n\n\u003cscript src=\"screen.js\">\u003c/script>\n\u003c/body>\n\u003c/html>\n", "dash-03.html": "\u003c!DOCTYPE html>\n\u003chtml lang=\"ko\">\n\u003chead>\n\u003cmeta charset=\"UTF-8\">\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n\u003ctitle>화면기획 — 2차 인증 재설정\u003c/title>\n\u003clink rel=\"stylesheet\" href=\"screen.css\">\n\u003c/head>\n\u003cbody>\n\n\u003cheader class=\"header\">\n  \u003cdiv class=\"crumb\">\u003cspan>홈\u003c/span>\u003cspan class=\"s\">›\u003c/span>\u003cspan>계정·보안\u003c/span>\u003cspan class=\"s\">›\u003c/span>\u003cspan>2차 인증 재설정\u003c/span>\u003c/div>\n  \u003ch1 class=\"title\">2차 인증 재설정\u003c/h1>\n  \u003cspan class=\"sid\">DASH-03\u003c/span>\n  \u003cspan class=\"defense\">비밀번호·2FA 재설정 · 복구 코드 재발급 · 독립 페이지\u003c/span>\n\u003c/header>\n\n\u003cdiv class=\"main\">\n  \u003cdiv class=\"screen-panel\">\n    \u003cdiv style=\"position:relative;display:flex;\">\n      \u003cdiv class=\"labels\" id=\"labels\">\n        \u003cdiv class=\"lbl\">\u003cspan class=\"lbl-text\">전역\u003cbr>브랜드 패널\u003c/span>\u003c/div>\n        \u003cdiv class=\"lbl\">\u003cspan class=\"lbl-text\">재설정\u003cbr>안내\u003c/span>\u003c/div>\n        \u003cdiv class=\"lbl\">\u003cspan class=\"lbl-text\">액션\u003c/span>\u003c/div>\n        \u003cdiv class=\"lbl\">\u003cspan class=\"lbl-text\">발송 결과\u003c/span>\u003c/div>\n        \u003cdiv class=\"lbl\">\u003cspan class=\"lbl-text\">이전으로\u003c/span>\u003c/div>\n        \u003cdiv class=\"lbl\">\u003cspan class=\"lbl-text\">푸터\u003c/span>\u003c/div>\n      \u003c/div>\n      \u003csvg id=\"bracketSvg\" width=\"24\" style=\"flex-shrink:0;overflow:visible;\">\u003c/svg>\n    \u003c/div>\n\n    \u003cdiv class=\"frame\" id=\"frame\" style=\"background:linear-gradient(135deg,#e3eafc 0%,#f1f4fa 55%,#edf3fb 100%);\">\n      \u003c!-- 전역: 브랜드 패널 — 독립 페이지(콘솔 GNB 없음) · 핀 없음 -->\n      \u003cdiv class=\"zone\" data-idx=\"\">\n        \u003cdiv class=\"zone-highlight\">\u003c/div>\n        \u003cdiv class=\"brand-panel\">\n          \u003cdiv class=\"bp-logo\">DSRV\u003cspan>®\u003c/span>\u003c/div>\n          \u003cdiv class=\"bp-tag\">한 번의 연동으로 완성하는\u003cbr>\u003cstrong>쉽고 강력한 온체인 금융 OS\u003c/strong>\u003c/div>\n          \u003cdiv class=\"bp-sub\">자산의 발행·결제·운용·보관을 위한 엔터프라이즈급 블록체인 인프라.\u003c/div>\n        \u003c/div>\n      \u003c/div>\n\n      \u003c!-- 카드: 재설정 안내 (표시 전용) -->\n      \u003cdiv class=\"zone card\" data-idx=\"0\">\n        \u003cdiv class=\"zone-highlight\">\u003c/div>\n        \u003cdiv class=\"zone-title\" style=\"margin-bottom:10px;\">비밀번호 및 2차 인증 재설정\u003c/div>\n        \u003cdiv class=\"item-area\" data-highlight=\"0\" style=\"position:relative;padding:4px;border-radius:8px;\">\n          \u003cdiv class=\"pin\" data-idx=\"0\" style=\"top:-6px;right:-6px;\">1\u003c/div>\n          \u003cdiv class=\"info-box\" style=\"line-height:1.75;\">\n            인증 앱을 새 기기로 옮기거나 복구 코드를 다시 받으려면 재설정하세요. 본인 이메일 \u003cstrong style=\"color:#2f3747;\">{담당자 이메일(마스킹)}\u003c/strong>로 재설정 링크가 발송되며, 링크에서 비밀번호 재설정과 2차 인증 재등록을 진행합니다.\u003cbr>\u003cbr>\n            ※ 재등록이 끝나면 새 복구 코드가 발급되고 이전 코드는 모두 폐기됩니다\u003cspan style=\"color:#b9c2d2;\">. 재등록 완료 전까지 현재 인증 앱·복구 코드는 그대로 사용할 수 있습니다.\u003c/span>\n          \u003c/div>\n        \u003c/div>\n      \u003c/div>\n\n      \u003c!-- 액션: 재설정 메일 발송 -->\n      \u003cdiv class=\"zone card\" data-idx=\"1\">\n        \u003cdiv class=\"zone-highlight\">\u003c/div>\n        \u003cdiv class=\"item-area\" data-highlight=\"1\" style=\"position:relative;padding:4px;border-radius:8px;\">\n          \u003cdiv class=\"pin\" data-idx=\"1\" style=\"top:-8px;right:-6px;\">2\u003c/div>\n          \u003cdiv class=\"btn primary fg\">재설정 메일 발송\u003c/div>\n        \u003c/div>\n      \u003c/div>\n\n      \u003c!-- 발송 결과 (조건부 · 시안 없음 · 기획 유지) -->\n      \u003cdiv class=\"zone card\" data-idx=\"3\">\n        \u003cdiv class=\"zone-highlight\">\u003c/div>\n        \u003cdiv class=\"item-area\" data-highlight=\"3\" style=\"position:relative;padding:4px;border-radius:8px;\">\n          \u003cdiv class=\"pin\" data-idx=\"3\" style=\"top:-6px;right:-6px;\">4\u003c/div>\n          \u003cdiv style=\"font-size:9px;color:#94a3b8;padding:0 4px 3px;\">▼ 발송 성공 후에만 노출 (기본 상태에서는 없음)\u003c/div>\n          \u003cdiv class=\"c-banner kyc\" style=\"border-radius:8px;\">✓ 재설정 링크를 {담당자 이메일(마스킹)}로 보냈습니다. 메일의 링크에서 재등록을 진행해 주세요. 메일이 오지 않으면 잠시 후 다시 발송할 수 있습니다.\u003c/div>\n        \u003c/div>\n      \u003c/div>\n\n      \u003c!-- 이전으로 -->\n      \u003cdiv class=\"zone card\" data-idx=\"2\">\n        \u003cdiv class=\"zone-highlight\">\u003c/div>\n        \u003cdiv class=\"hr-line\" style=\"margin-top:0;\">\u003c/div>\n        \u003cdiv class=\"item-area\" data-highlight=\"2\" style=\"position:relative;padding:4px;border-radius:8px;\">\n          \u003cdiv class=\"pin\" data-idx=\"2\" style=\"top:-6px;right:-6px;\">3\u003c/div>\n          \u003cdiv class=\"aux-back\">‹ &nbsp;이전으로\u003c/div>\n        \u003c/div>\n      \u003c/div>\n\n      \u003c!-- 푸터 -->\n      \u003cdiv class=\"zone\" data-idx=\"\">\n        \u003cdiv class=\"zone-highlight\">\u003c/div>\n        \u003cdiv class=\"pg-footer\">\u003cspan>© dsrv labs Co., Ltd. All Rights Reserved\u003c/span>\u003cspan class=\"lnk\">공지사항\u003c/span>\u003cspan class=\"lnk\">개인정보처리방침\u003c/span>\u003cspan class=\"lnk\">이용약관\u003c/span>\u003c/div>\n      \u003c/div>\n    \u003c/div>\n  \u003c/div>\n\n  \u003csvg id=\"connSvg\" style=\"position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:10;overflow:visible;\">\u003c/svg>\n\n  \u003cdiv class=\"items\" id=\"items\">\n    \u003cdiv class=\"nav-global\">\n      \u003cdiv class=\"nav-global-title\">진입 · 전역 이동\u003c/div>\n      \u003cdiv class=\"nav-note\">· \u003cstrong>전역 이동\u003c/strong> 프레임(브랜드 패널 · 푸터 · 뒤로가기)의 동작은 계정 활성화 1/3 비밀번호 설정(ONB-01)의 표와 같다. 다른 점 없음(브랜드 패널에 'DSRV 서비스 소개 보기 →' 링크가 없는 것도 ONB-01과 같다). 로그인 상태 화면이지만 콘솔 상단 메뉴(GNB)와 기관 배지가 없어 다른 콘솔 화면으로 바로 갈 수 없고 로그아웃 메뉴도 없다.\u003cbr>\n      · \u003cstrong>진입\u003c/strong> 대시보드(DASH-01) 계정·보안 영역의 '2차 인증 재설정' 카드 클릭.\u003cbr>\n      · \u003cstrong>나가기\u003c/strong> '‹ 이전으로' → 대시보드(DASH-01). 재설정 메일을 보낸 뒤에도 이 화면에 머문다. 재설정 자체는 메일의 링크에서 계정 활성화(ONB-01~03)를 다시 진행하며, 끝나면 로그인(AUTH-01)으로 이어진다.\u003c/div>\n    \u003c/div>\n\n    \u003cdiv class=\"itm\" data-idx=\"0\">\n      \u003cdiv class=\"num\">1\u003c/div>\n      \u003cdiv>\n        \u003cdiv class=\"itm-title\">재설정 안내문 (표시 전용)\u003c/div>\n        \u003cdiv class=\"itm-desc\">\u003cstrong>값\u003c/strong> 발송 대상으로 {담당자 이메일(마스킹)}을 표시한다. 이메일 변경 화면은 만들지 않는다.\u003cbr>\u003cstrong>무효화\u003c/strong> 기존 OTP와 복구 코드는 재등록 완료 시 무효화한다(발송 시점 아님).\u003cbr>\u003cspan class=\"chk\">[디자인 요청]\u003c/span> 시안 '백업코드'를 '복구 코드'로 통일한다.\u003cbr>\u003cspan class=\"basis\">근거 ISMS 2.5 · ONB-03 상세 1\u003c/span>\u003c/div>\n      \u003c/div>\n    \u003c/div>\n\n    \u003cdiv class=\"itm\" data-idx=\"1\">\n      \u003cdiv class=\"num\">2\u003c/div>\n      \u003cdiv>\n        \u003cdiv class=\"itm-title\">[재설정 메일 발송] 버튼\u003cspan class=\"req\">필수\u003c/span>\u003c/div>\n        \u003cdiv class=\"itm-desc\">\u003cstrong>노출\u003c/strong> 항상 보인다.\u003cbr>\u003cstrong>클릭 가능\u003c/strong> 쿨다운 이내이거나 발송 처리 중이면 비활성이다.\u003cbr>\u003cstrong>확인 사항\u003c/strong> 없다. 기존 인증수단이 재등록 완료까지 유효하므로 확인 다이얼로그를 띄우지 않는다.\u003cbr>\u003cstrong>액션\u003c/strong> ONB-00 초대 재발송 양식으로 1회용 링크를 보낸다(유효기간은 초대 링크와 같다). 이전 미사용 링크를 즉시 무효화해 최신 1개만 유효하게 두고, 발송 이력을 감사기록에 남긴다. 세션은 유지하고 로그아웃은 재등록 완료 시점(ONB-03 [확인])이다.\u003cbr>\u003cspan class=\"chk\">[확인필요: 쿨다운 값]\u003c/span>\u003cbr>\u003cspan class=\"basis\">근거 ISMS 2.5 · 2.9.4 · ONB-00 재사용\u003c/span>\u003c/div>\n        \u003cdiv class=\"itm-nav\">\u003cspan class=\"nav-tag\">화면 이동 · 인터랙션\u003c/span>\n          \u003cdiv class=\"nav-row\">\u003cspan class=\"nav-el\">[재설정 메일 발송] — 활성 조건\u003c/span>\u003cspan class=\"nav-act\">다음이 모두 아님: ①발송 처리 중 ②쿨다운 중(직전 발송 후 쿨다운 시간 이내)\u003c/span>\u003cspan class=\"nav-to stay\">처리 중 → 회색 비활성 · 라벨 \"발송 중…\" / 쿨다운 → 회색 비활성 · 라벨 \"재발송 ({남은 초}초 후)\" 카운트다운 → 0이면 \"재설정 메일 재발송\"으로 활성 복귀\u003c/span>\u003c/div>\n          \u003cdiv class=\"nav-row\">\u003cspan class=\"nav-el\">[재설정 메일 발송] — 클릭(활성)\u003c/span>\u003cspan class=\"nav-act\">확인 없음 → 라벨 \"발송 중…\"·비활성(중복 클릭 차단) → 토큰 생성 · 이메일 발송(ONB-00 양식) · 감사로그\u003c/span>\u003cspan class=\"nav-to stay\">화면 잔류 · 항목 4 발송 결과 배너 노출 · 버튼 → 쿨다운 상태 · 이후 흐름: 이메일 링크 → \u003cstrong>계정 활성화(ONB-01 → 02 → 03)\u003c/strong> 재수행(비밀번호 재설정 → 2FA 재등록 → 새 복구 코드) → [확인] 시 이전 코드 폐기 · 기존 세션 전체 로그아웃 → \u003cstrong>로그인(AUTH-01)\u003c/strong>\u003c/span>\u003c/div>\n          \u003cdiv class=\"nav-row\">\u003cspan class=\"nav-el\">[재설정 메일 발송] — 실패\u003c/span>\u003cspan class=\"nav-act\">발송 오류(메일 서버·서버 오류)\u003c/span>\u003cspan class=\"nav-to stay\">화면 잔류 · 상단 배너 \"일시적인 오류입니다. 잠시 후 다시 시도해 주세요\" · 버튼 라벨 복귀(쿨다운 없음) · 결과 배너 미노출\u003c/span>\u003c/div>\n        \u003c/div>\n      \u003c/div>\n    \u003c/div>\n\n    \u003cdiv class=\"itm\" data-idx=\"2\">\n      \u003cdiv class=\"num\">3\u003c/div>\n      \u003cdiv>\n        \u003cdiv class=\"itm-title\">'‹ 이전으로' 링크\u003c/div>\n        \u003cdiv class=\"itm-desc\">\u003cspan class=\"basis\">근거 notation 공통 UI 규격 '종료 동선'\u003c/span>\u003c/div>\n        \u003cdiv class=\"itm-nav\">\u003cspan class=\"nav-tag\">화면 이동 · 인터랙션\u003c/span>\n          \u003cdiv class=\"nav-row\">\u003cspan class=\"nav-el\">'이전으로' — 활성 조건\u003c/span>\u003cspan class=\"nav-act\">다음이 아님: ①발송 처리 중\u003c/span>\u003cspan class=\"nav-to stay\">처리 중 → 비활성(회색)\u003c/span>\u003c/div>\n          \u003cdiv class=\"nav-row\">\u003cspan class=\"nav-el\">'이전으로' — 클릭(활성)\u003c/span>\u003cspan class=\"nav-act\">확인 없음\u003c/span>\u003cspan class=\"nav-to\">\u003cstrong>대시보드(DASH-01)\u003c/strong> · 토스트 없음 · 이미 발송된 링크는 유효 유지\u003c/span>\u003c/div>\n        \u003c/div>\n      \u003c/div>\n    \u003c/div>\n\n    \u003cdiv class=\"itm\" data-idx=\"3\">\n      \u003cdiv class=\"num\">4\u003c/div>\n      \u003cdiv>\n        \u003cdiv class=\"itm-title\">발송 결과 배너 (조건부 노출 · 시안 없음)\u003c/div>\n        \u003cdiv class=\"itm-desc\">\u003cstrong>노출\u003c/strong> 발송 성공 응답 직후에만 띄운다. 실패 시와 재진입 시에는 띄우지 않고 쿨다운은 버튼 라벨로만 알린다.\u003cbr>\u003cspan class=\"chk\">[디자인 요청]\u003c/span> 시안에 없는 요소다.\u003cbr>\u003cspan class=\"basis\">근거 공통 UI 규격 상태 표시 · ONB-00\u003c/span>\u003c/div>\n        \u003cdiv class=\"itm-nav\">\u003cspan class=\"nav-tag\">화면 이동 · 인터랙션\u003c/span>\n          \u003cdiv class=\"nav-row\">\u003cspan class=\"nav-el\">배너\u003c/span>\u003cspan class=\"nav-act\">클릭\u003c/span>\u003cspan class=\"nav-to stay\">무반응(표시 전용) · 이후 행동은 이메일 링크(콘솔 밖) → ONB-01\u003c/span>\u003c/div>\n        \u003c/div>\n      \u003c/div>\n    \u003c/div>\n  \u003c/div>\n\n\u003c/div>\n\n\u003csection class=\"footer-note\" style=\"padding-bottom:0;\">\n  \u003cdiv class=\"note-card\">\n    \u003cdiv class=\"note-title\">상세내용\u003c/div>\n    \u003cdiv class=\"detail-grid\" id=\"detailCol\">\n      \u003cdiv class=\"dtl\" data-idx=\"0\">\n        \u003cdiv class=\"detail-label\">\u003cspan class=\"dtl-num\">1\u003c/span>진입 경로 · 재설정 흐름\u003c/div>\n      \u003cdiv class=\"dtl-body\">\u003cspan class=\"box\">\u003cstrong>흐름\u003c/strong> 발송 → 이메일 링크(ONB-00 방식) → ONB-01~03 재수행 → [확인] 시 새 복구 코드 발급 · 이전 코드 폐기 · 기존 세션 전체 로그아웃 → AUTH-01 재로그인.\u003cbr>\u003cstrong>앱 분실\u003c/strong> 복구 코드로 로그인(AUTH-02)한 뒤 이 화면에서 재설정한다.\u003c/span>\u003c/div>\n      \u003c/div>\n      \u003cdiv class=\"dtl\" data-idx=\"1\">\n        \u003cdiv class=\"detail-label\">\u003cspan class=\"dtl-num\">2\u003c/span>무효화 시점 · 운영 예외\u003c/div>\n      \u003cdiv class=\"dtl-body\">\u003cspan class=\"box\">\u003cstrong>무효화 시점\u003c/strong> 기존 OTP·복구 코드는 재등록 완료 시 무효화한다. 이메일 미수신이나 중도 이탈에도 로그인 수단이 끊기지 않는다.\u003cbr>\u003cstrong>링크\u003c/strong> 만료·미사용 링크는 아무 변화를 만들지 않는다. 재발송 시 이전 링크를 즉시 무효화한다.\u003cbr>\u003cstrong>전면 분실\u003c/strong> 복구 코드까지 없으면 관리자 본인확인 후 초대 재발송으로 처리한다(AUTH-01 상세 8과 동일 프로세스).\u003cbr>\u003cspan class=\"chk\">[확인필요: 쿨다운 값 · 이메일 마스킹 규칙]\u003c/span>\u003c/span>\u003c/div>\n      \u003c/div>\n    \u003c/div>\n  \u003c/div>\n\u003c/section>\n\n\u003csection class=\"footer-note\">\n  \u003cdiv class=\"note-card\">\n    \u003cdiv class=\"note-title\">비고\u003c/div>\n    \u003cdiv class=\"note-body\">· DASH-01 계정·보안 '2차 인증 재설정' 진입 화면 — 안내문 + 발송 버튼 + 발송 결과 배너 + 이전으로 · 독립 페이지(콘솔 GNB 없음).\u003cbr>· \u003cstrong>[백엔드 통제]\u003c/strong> 발송·재등록·폐기 이력은 화면 표시 없이 감사기록 보존 — 근거 ISMS 2.9.4.\u003cbr>· \u003cstrong>[Figma 반영 2026-09-02]\u003c/strong> 시안 'Reset Credentials' 적용 · 발송 결과 배너·마스킹 이메일 명시·'복구 코드' 용어는 기획 유지 \u003cspan class=\"chk\">[디자인 요청]\u003c/span> · [취소] 버튼은 '이전으로'로 대체 · 원본 \u003cspan class=\"mono\">reference/figma/_crops/F8_row2_c4.png\u003c/span>.\u003cbr>· \u003cstrong>확정(구현 단순 우선)\u003c/strong> — 링크 유효기간은 초대 링크와 동일 규격 재사용 · 재발송 시 이전 링크 즉시 무효화(최신 1개만 유효) · 확인 다이얼로그 없음.\u003cbr>· 남은 \u003cspan class=\"chk\">[확인필요]\u003c/span> — 재발송 쿨다운 값 · 이메일 마스킹 규칙 · 로고 클릭 동작.\u003cbr>· 이전 = DASH-01 / 관련 = DASH-02 / 재등록 절차 = ONB-01~03\u003c/div>\n  \u003c/div>\n\u003c/section>\n\n\u003cscript src=\"screen.js\">\u003c/script>\n\u003c/body>\n\u003c/html>\n", "exc-01.html": "\u003c!DOCTYPE html>\n\u003chtml lang=\"ko\">\n\u003chead>\n\u003cmeta charset=\"UTF-8\">\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n\u003ctitle>화면기획 — 교환하기\u003c/title>\n\u003clink rel=\"stylesheet\" href=\"screen.css\">\n\u003c/head>\n\u003cbody>\n\n\u003cheader class=\"header\">\n  \u003cdiv class=\"crumb\">\u003cspan>나목 교환\u003c/span>\u003cspan class=\"s\">›\u003c/span>\u003cspan>교환하기\u003c/span>\u003c/div>\n  \u003ch1 class=\"title\">교환하기\u003c/h1>\n  \u003cspan class=\"sid\">EXC-01\u003c/span>\n  \u003cspan class=\"defense\">방어: 자동체결 거래소·MM 아님\u003c/span>\n\u003c/header>\n\n\u003cdiv class=\"main\">\n  \u003cdiv class=\"screen-panel\">\n    \u003cdiv style=\"position:relative;display:flex;\">\n      \u003cdiv class=\"labels\" id=\"labels\">\n        \u003cdiv class=\"lbl\">\u003cspan class=\"lbl-text\">전역\u003cbr>상단·배너\u003c/span>\u003c/div>\n        \u003cdiv class=\"lbl\">\u003cspan class=\"lbl-text\">타이틀\u003c/span>\u003c/div>\n        \u003cdiv class=\"lbl\">\u003cspan class=\"lbl-text\">교환 입력\u003c/span>\u003c/div>\n        \u003cdiv class=\"lbl\">\u003cspan class=\"lbl-text\">성격 고지\u003c/span>\u003c/div>\n        \u003cdiv class=\"lbl\">\u003cspan class=\"lbl-text\">액션\u003c/span>\u003c/div>\n      \u003c/div>\n      \u003csvg id=\"bracketSvg\" width=\"24\" style=\"flex-shrink:0;overflow:visible;\">\u003c/svg>\n    \u003c/div>\n\n    \u003cdiv class=\"frame\" id=\"frame\">\n      \u003c!-- 전역: 콘솔 상단 + KYC 배너(조건부) -->\n      \u003cdiv class=\"zone\" data-idx=\"6\">\n        \u003cdiv class=\"zone-highlight\">\u003c/div>\n        \u003cdiv class=\"c-top\" style=\"border-radius:8px 8px 0 0;\">\n          \u003cspan class=\"brand\" style=\"cursor:pointer;\">DSRV Desk\u003c/span>\n          \u003cspan class=\"meta\">\u003cspan class=\"c-badge\">A자산운용\u003c/span>\u003c/span>\n        \u003c/div>\n        \u003cdiv class=\"c-adminbar\" style=\"margin:0;\">\n          \u003cspan class=\"m\">대시보드\u003c/span>\n          \u003cspan class=\"m on\" style=\"background:#dbeafe;color:#1d4ed8;\">교환하기\u003c/span>\n          \u003cspan class=\"m\">교환게시판\u003c/span>\n        \u003c/div>\n        \u003cdiv class=\"item-area\" data-highlight=\"6\" style=\"position:relative;\">\n          \u003cdiv class=\"pin\" data-idx=\"6\" style=\"top:-4px;right:-6px;\">7\u003c/div>\n          \u003cdiv style=\"font-size:9px;color:#94a3b8;padding:3px 8px 0;\">▼ KYC 예외 상태에서만 노출 (정상 시 배너 없음)\u003c/div>\n          \u003cdiv class=\"c-banner warn\" style=\"border-radius:0;\">⚠ 현재 거래가 불가합니다 — 고객확인(KYC)에 확인이 필요한 사항이 있습니다. 이메일로 문의해 주세요.\u003c/div>\n        \u003c/div>\n      \u003c/div>\n\n      \u003c!-- 타이틀 -->\n      \u003cdiv class=\"zone\" data-idx=\"\">\n        \u003cdiv class=\"zone-highlight\">\u003c/div>\n        \u003cdiv class=\"zone-title\" style=\"margin-bottom:0;\">교환하기\u003c/div>\n      \u003c/div>\n\n      \u003c!-- 교환 입력 -->\n      \u003cdiv class=\"zone\" data-idx=\"0,1,2,3\">\n        \u003cdiv class=\"zone-highlight\">\u003c/div>\n\n        \u003cdiv style=\"font-size:11px;color:#94a3b8;font-weight:600;margin-bottom:6px;\">교환쌍 · 방향\u003c/div>\n        \u003cdiv class=\"row\" style=\"margin-bottom:14px;\">\n          \u003cdiv class=\"item-area\" data-highlight=\"0\" style=\"position:relative;flex:1;padding:4px;border-radius:8px;\">\n            \u003cdiv class=\"pin\" data-idx=\"0\" style=\"top:-6px;right:-6px;\">1\u003c/div>\n            \u003cdiv class=\"field sel\">보내는 자산 \u003cspan class=\"chip asset\">USDC\u003c/span>\u003c/div>\n          \u003c/div>\n          \u003cdiv style=\"display:flex;align-items:center;color:#94a3b8;font-weight:700;\">→\u003c/div>\n          \u003cdiv class=\"item-area\" data-highlight=\"1\" style=\"position:relative;flex:1;padding:4px;border-radius:8px;\">\n            \u003cdiv class=\"pin\" data-idx=\"1\" style=\"top:-6px;right:-6px;\">2\u003c/div>\n            \u003cdiv class=\"field sel\">받는 자산 \u003cspan class=\"chip asset\">USDT\u003c/span>\u003c/div>\n          \u003c/div>\n        \u003c/div>\n\n        \u003cdiv class=\"item-area\" data-highlight=\"2\" style=\"position:relative;padding:4px;border-radius:8px;margin-bottom:6px;\">\n          \u003cdiv class=\"pin\" data-idx=\"2\" style=\"top:-6px;right:-6px;\">3\u003c/div>\n          \u003cdiv style=\"font-size:11px;color:#94a3b8;font-weight:600;margin-bottom:6px;\">보내는 수량 \u003cspan style=\"float:right;color:#64748b;\">1회 최대 1,500,000원 상당\u003c/span>\u003c/div>\n          \u003cdiv class=\"field\">\u003cspan>900\u003c/span>\u003cspan class=\"chip asset\">USDC\u003c/span>\u003c/div>\n          \u003cdiv style=\"font-size:10px;color:#64748b;margin-top:4px;\">≈ 1,215,000원\u003c/div>\n        \u003c/div>\n\n        \u003cdiv class=\"item-area\" data-highlight=\"3\" style=\"position:relative;padding:4px;border-radius:8px;\">\n          \u003cdiv class=\"pin\" data-idx=\"3\" style=\"top:-6px;right:-6px;\">4\u003c/div>\n          \u003cdiv style=\"display:flex;justify-content:flex-end;margin-bottom:6px;\">\n            \u003cspan class=\"pooltag\">현재 교환 가능 풀 &nbsp;USDT 1,820,000\u003c/span>\n          \u003c/div>\n          \u003cdiv class=\"kv\">\u003cspan class=\"k\">교환비율 (참고)\u003c/span>\u003cspan class=\"v\">0.9998 USDT/USDC\u003c/span>\u003c/div>\n          \u003cdiv class=\"kv\">\u003cspan class=\"k\">예상 받는 수량\u003c/span>\u003cspan class=\"v\">899.82 USDT\u003c/span>\u003c/div>\n          \u003cdiv class=\"kv\">\u003cspan class=\"k\">스프레드\u003c/span>\u003cspan class=\"v\">0.10% 고정\u003c/span>\u003c/div>\n          \u003cdiv style=\"font-size:10px;color:#94a3b8;margin:2px 0 4px;\">확정 비율은 요청 후 제시됩니다\u003c/div>\n        \u003c/div>\n      \u003c/div>\n\n      \u003c!-- 성격 고지 -->\n      \u003cdiv class=\"zone\" data-idx=\"4\">\n        \u003cdiv class=\"zone-highlight\">\u003c/div>\n        \u003cdiv class=\"item-area\" data-highlight=\"4\" style=\"position:relative;padding:4px;border-radius:8px;\">\n          \u003cdiv class=\"pin\" data-idx=\"4\" style=\"top:-6px;right:-6px;\">5\u003c/div>\n          \u003cdiv class=\"note-inline reg\">이 교환의 상대방은 DSRV입니다. 건별 비율 제시·수동 집행으로 처리됩니다.\u003c/div>\n        \u003c/div>\n      \u003c/div>\n\n      \u003c!-- 액션 -->\n      \u003cdiv class=\"zone\" data-idx=\"5\">\n        \u003cdiv class=\"zone-highlight\">\u003c/div>\n        \u003cdiv class=\"item-area\" data-highlight=\"5\" style=\"position:relative;padding:4px;border-radius:8px;\">\n          \u003cdiv class=\"pin\" data-idx=\"5\" style=\"top:-8px;right:-6px;\">6\u003c/div>\n          \u003cdiv class=\"btn primary\">거래 요청\u003c/div>\n        \u003c/div>\n      \u003c/div>\n    \u003c/div>\n  \u003c/div>\n\n  \u003csvg id=\"connSvg\" style=\"position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:10;overflow:visible;\">\u003c/svg>\n\n  \u003cdiv class=\"items\" id=\"items\">\n    \u003cdiv class=\"nav-global\">\n      \u003cdiv class=\"nav-global-title\">진입 · 전역 이동\u003c/div>\n      \u003cdiv class=\"nav-note\">· \u003cstrong>전역 이동\u003c/strong> 상단 메뉴(GNB) · 기관 배지 · 뒤로가기의 동작은 대시보드(DASH-01)의 표와 같다. 다른 점 = 현재 탭이 '교환하기'라서 다시 클릭해도 무반응. GNB로 다른 화면에 가면 입력 중인 값은 확인 없이 버린다.\u003cbr>\n      · \u003cstrong>진입\u003c/strong> 어느 화면에서든 GNB '교환하기' 클릭. 비율 확인·수락(EXC-02) · 승인 진행(EXC-03) · 내역·완료(EXC-04)에서 '교환하기' 탭을 다시 클릭하면 이 화면이 초기 상태(새 요청)로 열린다.\u003c/div>\n    \u003c/div>\n\n    \u003cdiv class=\"itm\" data-idx=\"0\">\n      \u003cdiv class=\"num\">1\u003c/div>\n      \u003cdiv>\n        \u003cdiv class=\"itm-title\">보내는 자산 ▾\u003cspan class=\"req\">필수\u003c/span>\u003c/div>\n        \u003cdiv class=\"itm-desc\">\u003cstrong>노출\u003c/strong> 항상 보인다.\u003cbr>\u003cstrong>클릭 가능\u003c/strong> 항상 활성이다.\u003cbr>\u003cstrong>확인 사항\u003c/strong> 없다. 확인 다이얼로그를 띄우지 않는다.\u003cbr>\u003cstrong>옵션\u003c/strong> ETH · USDC · USDT 3종(ADM-03 취급자산). 기본값은 두지 않고 미선택 시 \"자산 선택\"을 보여준다.\u003cbr>\u003cstrong>액션\u003c/strong> 칩에 티커를 표시하고 목록을 닫는다. 받는 자산 목록에서 이 자산을 빼고, 수량 필드의 단위 칩과 허용 소수 자릿수(ETH 4 / USDC·USDT 2)를 갱신한다. 비어 있는 동안 받는 자산과 수량 입력은 비활성이다.\u003cbr>\u003cspan class=\"basis\">근거 F-1a · 09 §0 취급자산·자산 선택 UX\u003c/span>\u003c/div>\n        \u003cdiv class=\"itm-nav\">\u003cspan class=\"nav-tag\">화면 이동 · 인터랙션\u003c/span>\n          \u003cdiv class=\"nav-row\">\u003cspan class=\"nav-el\">보내는 자산 ▾\u003c/span>\u003cspan class=\"nav-act\">클릭 → 목록 펼침(ETH / USDC / USDT · 현재 선택 강조) → 항목 클릭\u003c/span>\u003cspan class=\"nav-to stay\">칩 갱신·목록 닫힘 · 받는 자산 ▾ 활성화 · 바깥 클릭/ESC = 변경 없이 닫힘\u003c/span>\u003c/div>\n          \u003cdiv class=\"nav-row\">\u003cspan class=\"nav-el\">보내는 자산 ▾ (재선택)\u003c/span>\u003cspan class=\"nav-act\">이미 선택된 상태에서 다른 자산 선택\u003c/span>\u003cspan class=\"nav-to stay\">받는 자산 초기화(미선택) · 수량 초기화(빈칸) · 풀·비율 표시 \"—\" · [거래 요청] 비활성\u003c/span>\u003c/div>\n        \u003c/div>\n      \u003c/div>\n    \u003c/div>\n\n    \u003cdiv class=\"itm\" data-idx=\"1\">\n      \u003cdiv class=\"num\">2\u003c/div>\n      \u003cdiv>\n        \u003cdiv class=\"itm-title\">받는 자산 ▾\u003cspan class=\"req\">필수\u003c/span>\u003c/div>\n        \u003cdiv class=\"itm-desc\">\u003cstrong>노출\u003c/strong> 항상 보인다.\u003cbr>\u003cstrong>클릭 가능\u003c/strong> 보내는 자산을 고른 뒤에만 활성이다. 그 전에는 회색 비활성이다.\u003cbr>\u003cstrong>확인 사항\u003c/strong> 없다. 확인 다이얼로그를 띄우지 않는다.\u003cbr>\u003cstrong>옵션\u003c/strong> 3종에서 보내는 자산을 뺀 2종. 같은 자산 쌍이 목록에 없으므로 동일 자산 오류 검증은 두지 않는다. 미선택 시 \"자산 선택\".\u003cbr>\u003cstrong>액션\u003c/strong> 칩을 갱신하고 목록을 닫는다. 교환 가능 풀·참고 비율·스프레드를 1회 조회해 항목 4를 채우고 예상 받는 수량을 계산한다.\u003cbr>\u003cspan class=\"basis\">근거 09 §0 자산 선택 UX · 페어 3종\u003c/span>\u003c/div>\n        \u003cdiv class=\"itm-nav\">\u003cspan class=\"nav-tag\">화면 이동 · 인터랙션\u003c/span>\n          \u003cdiv class=\"nav-row\">\u003cspan class=\"nav-el\">받는 자산 ▾\u003c/span>\u003cspan class=\"nav-act\">클릭(보내는 자산 선택 후에만) → 목록 2종 펼침 → 항목 클릭\u003c/span>\u003cspan class=\"nav-to stay\">칩 갱신·목록 닫힘 · 풀·비율·스프레드 조회(\"불러오는 중…\" → 값) · 수량이 있으면 예상 받는 수량·한도·풀 재검증\u003c/span>\u003c/div>\n          \u003cdiv class=\"nav-row\">\u003cspan class=\"nav-el\">받는 자산 ▾ (비활성 상태)\u003c/span>\u003cspan class=\"nav-act\">보내는 자산 미선택 상태에서 클릭\u003c/span>\u003cspan class=\"nav-to stay\">무반응 · 필드 위 인라인 안내 \"보내는 자산을 먼저 선택해 주세요\"\u003c/span>\u003c/div>\n        \u003c/div>\n      \u003c/div>\n    \u003c/div>\n\n    \u003cdiv class=\"itm\" data-idx=\"2\">\n      \u003cdiv class=\"num\">3\u003c/div>\n      \u003cdiv>\n        \u003cdiv class=\"itm-title\">보내는 수량 입력\u003cspan class=\"req\">필수\u003c/span>\u003c/div>\n        \u003cdiv class=\"itm-desc\">\u003cstrong>입력 가능\u003c/strong> 보내는 자산을 고른 뒤에만 가능하다. 교환 가능 풀이 0이면 비활성으로 두고 \"현재 교환 불가\"를 표시한다.\u003cbr>\u003cstrong>허용 문자\u003c/strong> 숫자와 소수점만 받는다. 소수 자릿수 상한은 보내는 자산 기준(ETH 4 / USDC·USDT 2)이고 초과 입력은 무시한다. 천 단위 쉼표는 자동으로 넣는다.\u003cbr>\u003cstrong>검증\u003c/strong> 입력 중 한도와 풀을 함께 판정한다. 유효 상한은 1회 한도 {정책값 1,500,000원 상당}의 환산 수량과 현재 교환 가능 풀 중 작은 값이다.\u003cbr>\u003cstrong>실패 처리\u003c/strong> 한도 초과와 풀 초과에 각각 인라인 ⚠를 띄우고 [거래 요청]을 비활성으로 둔다. 둘 다 해당하면 한도 초과만 보여준다.\u003cbr>\u003cstrong>연동\u003c/strong> 입력 중 필드 아래 KRW 환산액(소수 2자리 · ADM-03 시세 소스 · 스테이블코인도 KRW 시세로 환산)과 항목 4의 예상 받는 수량을 갱신한다. 라벨 우측에 \"1회 최대 1,500,000원 상당\"을 상시 표기한다.\u003cbr>\u003cspan class=\"basis\">근거 09 §0 건별 한도·표기 자릿수 · notation 입력 자릿수\u003c/span>\u003c/div>\n        \u003cdiv class=\"itm-nav\">\u003cspan class=\"nav-tag\">화면 이동 · 인터랙션\u003c/span>\n          \u003cdiv class=\"nav-row\">\u003cspan class=\"nav-el\">수량 필드\u003c/span>\u003cspan class=\"nav-act\">키 입력마다 검증(포커스 아웃 대기 없음)\u003c/span>\u003cspan class=\"nav-to stay\">정상 → 경고 제거·[거래 요청] 활성 / 초과 → 인라인 경고 ③ 또는 ④ 노출·[거래 요청] 비활성\u003c/span>\u003c/div>\n          \u003cdiv class=\"nav-row\">\u003cspan class=\"nav-el\">수량 필드 (자산 미선택)\u003c/span>\u003cspan class=\"nav-act\">보내는·받는 자산 중 하나라도 미선택\u003c/span>\u003cspan class=\"nav-to stay\">필드 비활성 · 클릭 시 인라인 안내 \"자산을 먼저 선택해 주세요\"\u003c/span>\u003c/div>\n        \u003c/div>\n      \u003c/div>\n    \u003c/div>\n\n    \u003cdiv class=\"itm\" data-idx=\"3\">\n      \u003cdiv class=\"num\">4\u003c/div>\n      \u003cdiv>\n        \u003cdiv class=\"itm-title\">교환 가능 풀 · 참고 비율 · 예상 받는 수량 · 스프레드 (표시 전용)\u003c/div>\n        \u003cdiv class=\"itm-desc\">\u003cstrong>조회\u003c/strong> 받는 자산을 고를 때 1회 조회한다. 화면에 머무는 동안 자동으로 다시 조회하지 않는다.\u003cbr>\u003cstrong>값\u003c/strong> 교환 가능 풀은 「{수량} {받는자산}」. 비율은 스테이블 페어 {받는}/{주는} 4자리, ETH 페어 {스테이블}/ETH 2자리. 예상 받는 수량은 보내는 수량 × 참고 비율(ETH 페어는 방향에 따라 ÷)을 받는 자산 자릿수로 절사하고, 수량이 비면 \"—\". 스프레드는 ADM-03 고정값 {정책값 0.10%} 소수 2자리.\u003cbr>\u003cstrong>상태\u003c/strong> 로딩 \"불러오는 중…\"이고 3초를 넘기면 오류로 넘긴다. 조회 실패면 값을 \"—\"로 두고 상단 배너를 띄우며 [거래 요청]을 비활성으로 둔다.\u003cbr>\u003cstrong>안내\u003c/strong> 확정 비율은 EXC-02 제시 시점 값이라 이 값과 다를 수 있다는 문구를 상시 노출한다.\u003cbr>\u003cspan class=\"basis\">근거 L6 이용자보호(설명의무) · \u003cspan class=\"chk\">[확인필요: 풀 정의]\u003c/span>\u003c/span>\u003c/div>\n      \u003c/div>\n    \u003c/div>\n\n    \u003cdiv class=\"itm\" data-idx=\"4\">\n      \u003cdiv class=\"num\">5\u003c/div>\n      \u003cdiv>\n        \u003cdiv class=\"itm-title\">성격 고지 (표시 전용)\u003c/div>\n        \u003cdiv class=\"itm-desc\">\u003cstrong>문구\u003c/strong> 고정이며 변경은 법무 확인 후에 한다(금지 표현은 상세 4).\u003cbr>\u003cspan class=\"basis\">근거 09 §0 line 51 ②⑤ · V2\u003c/span>\u003c/div>\n      \u003c/div>\n    \u003c/div>\n\n    \u003cdiv class=\"itm\" data-idx=\"5\">\n      \u003cdiv class=\"num\">6\u003c/div>\n      \u003cdiv>\n        \u003cdiv class=\"itm-title\">[거래 요청] 버튼\u003cspan class=\"req\">필수\u003c/span>\u003c/div>\n        \u003cdiv class=\"itm-desc\">\u003cstrong>노출\u003c/strong> 항상 보인다.\u003cbr>\u003cstrong>클릭 가능\u003c/strong> 자산 2종과 수량이 채워지고 한도·풀 검증을 통과했을 때만 활성이다. KYC 예외 상태이거나 조회가 실패한 상태면 비활성이다.\u003cbr>\u003cstrong>확인 사항\u003c/strong> 확인 다이얼로그는 없다. 클릭 시점에 서버가 한도와 풀을 다시 판정한다.\u003cbr>\u003cstrong>액션\u003c/strong> 요청 시점 외부지표와 ADM-03 고정 스프레드 {정책값 0.10%}로 시스템이 비율을 자동 산정해 EXC-02로 넘긴다. 자동인 것은 산정까지이고 체결은 수락·승인·수동 집행으로 분리한다.\u003cbr>\u003cspan class=\"basis\">근거 F-4 · 09 §0 나목 견적 산정\u003c/span>\u003c/div>\n        \u003cdiv class=\"itm-nav\">\u003cspan class=\"nav-tag\">화면 이동 · 인터랙션\u003c/span>\n          \u003cdiv class=\"nav-row\">\u003cspan class=\"nav-el\">[거래 요청] — 활성 조건\u003c/span>\u003cspan class=\"nav-act\">다음이 모두 아님: ①보내는·받는 자산 미선택 ②수량 빈칸·0 ③한도 초과 경고 노출 중 ④풀 초과 경고 노출 중 ⑤풀 0 ⑥KYC 예외 배너 노출 중 ⑦풀·비율 조회 실패\u003c/span>\u003cspan class=\"nav-to stay\">하나라도 해당 → 회색 비활성(공통 UI 규격) · 사유는 툴팁이 아니라 해당 위치 인라인 경고로 이미 노출\u003c/span>\u003c/div>\n          \u003cdiv class=\"nav-row\">\u003cspan class=\"nav-el\">[거래 요청] — 클릭(활성)\u003c/span>\u003cspan class=\"nav-act\">클릭 → 버튼 라벨 \"산정 중…\"·비활성(중복 클릭 차단) → 요청번호 EXC-YYYYMMDD-NNNN 채번\u003c/span>\u003cspan class=\"nav-to\">\u003cstrong>비율 확인·수락(EXC-02)\u003c/strong> — 자동 산정 즉시 진입(대기·담당자 개입 없음)\u003c/span>\u003c/div>\n          \u003cdiv class=\"nav-row\">\u003cspan class=\"nav-el\">[거래 요청] — 실패\u003c/span>\u003cspan class=\"nav-act\">산정 실패(시세 소스 장애) / 요청 시점 풀 재검증 실패\u003c/span>\u003cspan class=\"nav-to stay\">화면 잔류 · 장애 → 상단 배너 \"일시적인 오류입니다. 잠시 후 다시 시도해 주세요\" / 풀 부족 → 항목 3 ④ 경고 재노출 · 버튼 라벨 복귀\u003c/span>\u003c/div>\n        \u003c/div>\n      \u003c/div>\n    \u003c/div>\n\n    \u003cdiv class=\"itm\" data-idx=\"6\">\n      \u003cdiv class=\"num\">7\u003c/div>\n      \u003cdiv>\n        \u003cdiv class=\"itm-title\">KYC 예외 배너 (조건부 노출)\u003c/div>\n        \u003cdiv class=\"itm-desc\">\u003cstrong>노출\u003c/strong> 기관 KYC 상태가 '활성'이 아닐 때만 보인다(심사중(EDD)·일시제한·동결).\u003cbr>\u003cstrong>동작\u003c/strong> 노출 중에는 [거래 요청]만 비활성으로 두고 자산·수량 입력과 조회는 그대로 둔다. 내부 사유와 심사 내용은 노출하지 않는다.\u003cbr>\u003cstrong>문구\u003c/strong> 고정. \u003cspan class=\"chk\">[확인필요: 안내 이메일 주소]\u003c/span>\u003cbr>\u003cspan class=\"basis\">근거 G-3 · 공통 UI 규격 권한·상태 게이팅\u003c/span>\u003c/div>\n        \u003cdiv class=\"itm-nav\">\u003cspan class=\"nav-tag\">화면 이동 · 인터랙션\u003c/span>\n          \u003cdiv class=\"nav-row\">\u003cspan class=\"nav-el\">배너\u003c/span>\u003cspan class=\"nav-act\">클릭\u003c/span>\u003cspan class=\"nav-to stay\">무반응(표시 전용) · 상태가 '활성'으로 바뀌면 다음 진입 시 배너 제거·버튼 활성\u003c/span>\u003c/div>\n        \u003c/div>\n      \u003c/div>\n    \u003c/div>\n  \u003c/div>\n\n\u003c/div>\n\n\u003csection class=\"footer-note\" style=\"padding-bottom:0;\">\n  \u003cdiv class=\"note-card\">\n    \u003cdiv class=\"note-title\">상세내용\u003c/div>\n    \u003cdiv class=\"detail-grid\" id=\"detailCol\">\n      \u003cdiv class=\"dtl\" data-idx=\"0\">\n        \u003cdiv class=\"detail-label\">\u003cspan class=\"dtl-num\">1\u003c/span>페어 성격\u003c/div>\n      \u003cdiv class=\"dtl-body\">\u003cspan class=\"box\">· USDC ↔ USDT : \u003cstrong>동일통화(USD연동)\u003c/strong> = 디페그/1:1 기준, 가격 거의 동일\u003cbr>· ETH ↔ USDC / ETH ↔ USDT : \u003cstrong>코인↔스테이블\u003c/strong> = 외부지표 시세 기준(변동성) — 견적 유효시간·이탈 임계 민감 \u003cspan class=\"chk\">[확인필요]\u003c/span>\u003cbr>· \u003cstrong>[전제 변경 2026-09-02]\u003c/strong> ETH 재편입 — '전부 스테이블코인' 소명 논거 소멸, 구조 통제(자기재고·수동집행·외부지표 스프레드·비MM)로 소명 · JPYSC 미취급 유지\u003c/span>\u003c/div>\n      \u003c/div>\n      \u003cdiv class=\"dtl\" data-idx=\"1\">\n        \u003cdiv class=\"detail-label\">\u003cspan class=\"dtl-num\">2\u003c/span>자산 선택 순서 강제 이유\u003c/div>\n      \u003cdiv class=\"dtl-body\">\u003cspan class=\"box\">· 동일 자산 쌍을 검증·오류 문구로 막는 대신 \u003cstrong>목록에서 제외\u003c/strong> — 오류 상태 1종 감소, 개발·디자인 단순화(2026-09-02 결정)\u003cbr>· 보내는 자산이 수량 단위·자릿수·한도 환산의 기준이므로 먼저 확정\u003cbr>· 같은 규칙을 BRK-02(거래의향 등록)에 적용\u003c/span>\u003c/div>\n      \u003c/div>\n      \u003cdiv class=\"dtl\" data-idx=\"2\">\n        \u003cdiv class=\"detail-label\">\u003cspan class=\"dtl-num\">3\u003c/span>한도·풀 초과 처리\u003c/div>\n      \u003cdiv class=\"dtl-body\">\u003cspan class=\"box\">· 유효 상한 = min(1회 한도 {정책값 1,500,000원 상당}의 해당 자산 환산 수량, 가용 풀) — 두 조건 모두 충족해야 요청 가능 · 환산 시세·시점 = ADM-03 시세 소스 · 요청 시점(입력 중 실시간 재계산)\u003cbr>· 풀 = 0 : 수량 입력 비활성, \u003cstrong>\"현재 교환 불가\"\u003c/strong> 표기\u003cbr>· 풀 값 출처 = 커스터디 운영자산 잔고(기존 시스템) + ADM-03 정책 한도 — 별도 지갑 화면 신규 개발 없음\u003cbr>· 일간·월간 누적 한도 미정 \u003cspan class=\"chk\">[확인필요]\u003c/span>\u003c/span>\u003c/div>\n      \u003c/div>\n      \u003cdiv class=\"dtl\" data-idx=\"3\">\n        \u003cdiv class=\"detail-label\">\u003cspan class=\"dtl-num\">4\u003c/span>비용 구조 고지 · 계산 규칙\u003c/div>\n      \u003cdiv class=\"dtl-body\">\u003cspan class=\"box\">· 나목 교환은 \u003cstrong>별도 수수료 없음\u003c/strong> — 비용은 스프레드(% 고정)로 비율에 내재, 적용 비율은 EXC-02에서 고시 후 수락\u003cbr>· 예상 받는 수량은 참고값 — 900 USDC × 0.9998 = 899.82 USDT(절사) · ETH 페어 예: 0.3 ETH × 3,184.00 = 955.20 USDC / 955.20 USDC ÷ 3,184.00 = 0.3 ETH · 한도 1,500,000원 ÷ 4,298,400원(= 3,184.00 USDC × 1,350원 가정) = 0.3489 ETH(0.348970… 절사)\u003cbr>· 마목 중개 수수료(거래액 1% 고정 · BRK-03/04/07 사전 고시)와 혼동 방지 문구\u003c/span>\u003c/div>\n      \u003c/div>\n      \u003cdiv class=\"dtl\" data-idx=\"4\">\n        \u003cdiv class=\"detail-label\">\u003cspan class=\"dtl-num\">5\u003c/span>라벨 금지 · UI 문구 통제\u003c/div>\n      \u003cdiv class=\"dtl-body\">\u003cspan class=\"box\">금지 표현: '공식 LP', '마켓메이커', '플랫폼 보증', '최저가 보장' 등\u003cbr>허용: 'DSRV가 상대방인 교환', '외부지표 기준 스프레드'\u003cbr>\u003cstrong>평판 뱃지 미사용(2026-08-31 결정)\u003c/strong>\u003c/span>\u003c/div>\n      \u003c/div>\n      \u003cdiv class=\"dtl\" data-idx=\"5\">\n        \u003cdiv class=\"detail-label\">\u003cspan class=\"dtl-num\">6\u003c/span>요청 이후 상태\u003c/div>\n      \u003cdiv class=\"dtl-body\">\u003cspan class=\"box\">· 상태: 요청됨 → 비율 제시(EXC-02, 시스템 자동 산정) → 수락 시 \u003cstrong>DSRV 거래 진행(EXC-03, 약 2영업일)\u003c/strong>\u003cbr>· 진행 중 건은 홈(DASH-01) 거래현황에서 진입 — 별도 승인 큐 화면 없음\u003cbr>· 수락(EXC-02) 이후 별도 고객사 승인 단계 없음 — 고객사 측 통제는 DSRV 수탁 콜드월렛의 기존 다중승인 이체로 수행(ISMS 2.2.2)\u003c/span>\u003c/div>\n      \u003c/div>\n      \u003cdiv class=\"dtl\" data-idx=\"6\">\n        \u003cdiv class=\"detail-label\">\u003cspan class=\"dtl-num\">7\u003c/span>KYC 상태 → 배너 매핑\u003c/div>\n      \u003cdiv class=\"dtl-body\">\u003cspan class=\"box\">· ADM-03 기관 KYC 상태: 활성(배너 없음) / 심사중(EDD)·일시제한·동결(배너 노출·요청 차단) — 상태 라벨은 states.html 도메인 상태와 동일 \u003cspan class=\"chk\">[확인필요: 상태별 문구 차등 여부]\u003c/span>\u003cbr>· 배너는 EXC-01·BRK-02·BRK-03(행위 화면)에 동일 규격으로 노출, DASH-01에는 요약 배너 \u003cspan class=\"chk\">[확인필요]\u003c/span>\u003c/span>\u003c/div>\n      \u003c/div>\n    \u003c/div>\n  \u003c/div>\n\u003c/section>\n\n\u003csection class=\"footer-note\">\n  \u003cdiv class=\"note-card\">\n    \u003cdiv class=\"note-title\">비고\u003c/div>\n    \u003cdiv class=\"note-body\">\n      · \u003cstrong>나목(DSRV가 상대방인 교환)\u003c/strong> 진입점. 가격은 여기서 확정되지 않고, 시스템이 EXC-02에서 외부지표+고정 스프레드로 \u003cstrong>건별 비율을 자동 산정해 고시\u003c/strong>(2026-09-02 확정).\u003cbr>\n      · \u003cstrong>[방어 핵심]\u003c/strong> 이 화면은 \"요청서 접수\"까지만 수행 — 자동체결·오더북·상시 양방향 호가·API 자동집행 없음. 직무분리는 커스터디 이체 승인으로 충족.\u003cbr>\n      · 2026-09-02 설명 형식 개정 표본: 핀 = 조작 요소 단위(드롭다운 2·입력 1·버튼 1·표시 2·배너 1), 버튼 행 = 활성 조건 / 클릭 후 / 실패 3행.\u003cbr>\n      · \u003cspan class=\"chk\">[확인필요]\u003c/span> 풀 정의 · 일간·월간 누적 한도 · KYC 예외 배너 문의 주소·mailto 여부 · 상태별 배너 문구 차등.\u003cbr>\n      · 다음 화면: 비율 확인·수락 (EXC-02)\n    \u003c/div>\n  \u003c/div>\n\u003c/section>\n\n\u003cscript src=\"screen.js\">\u003c/script>\n\u003c/body>\n\u003c/html>\n", "exc-02.html": "\u003c!DOCTYPE html>\n\u003chtml lang=\"ko\">\n\u003chead>\n\u003cmeta charset=\"UTF-8\">\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n\u003ctitle>화면기획 — 비율 확인·수락\u003c/title>\n\u003clink rel=\"stylesheet\" href=\"screen.css\">\n\u003c/head>\n\u003cbody>\n\n\u003cheader class=\"header\">\n  \u003cdiv class=\"crumb\">\u003cspan>나목 교환\u003c/span>\u003cspan class=\"s\">›\u003c/span>\u003cspan>교환하기\u003c/span>\u003cspan class=\"s\">›\u003c/span>\u003cspan>비율 확인·수락\u003c/span>\u003c/div>\n  \u003ch1 class=\"title\">비율 확인·수락\u003c/h1>\n  \u003cspan class=\"sid\">EXC-02\u003c/span>\n  \u003cspan class=\"defense\">⚠ 가격 고시 화면 · 가격형성 아님 소명\u003c/span>\n\u003c/header>\n\n\u003cdiv class=\"main\">\n  \u003cdiv class=\"screen-panel\">\n    \u003cdiv style=\"position:relative;display:flex;\">\n      \u003cdiv class=\"labels\" id=\"labels\">\n        \u003cdiv class=\"lbl\">\u003cspan class=\"lbl-text\">전역\u003cbr>상단\u003c/span>\u003c/div>\n        \u003cdiv class=\"lbl\">\u003cspan class=\"lbl-text\">요청 요약\u003c/span>\u003c/div>\n        \u003cdiv class=\"lbl\">\u003cspan class=\"lbl-text\">확정 비율\u003cbr>고시\u003c/span>\u003c/div>\n        \u003cdiv class=\"lbl\">\u003cspan class=\"lbl-text\">수락 기한\u003c/span>\u003c/div>\n        \u003cdiv class=\"lbl\">\u003cspan class=\"lbl-text\">성격 고지\u003c/span>\u003c/div>\n        \u003cdiv class=\"lbl\">\u003cspan class=\"lbl-text\">액션·분기\u003c/span>\u003c/div>\n      \u003c/div>\n      \u003csvg id=\"bracketSvg\" width=\"24\" style=\"flex-shrink:0;overflow:visible;\">\u003c/svg>\n    \u003c/div>\n\n    \u003cdiv class=\"frame\" id=\"frame\">\n      \u003c!-- 전역: 콘솔 상단 + GNB (핀 없음 — nav-global 행으로 처리) -->\n      \u003cdiv class=\"zone\" data-idx=\"\">\n        \u003cdiv class=\"zone-highlight\">\u003c/div>\n        \u003cdiv class=\"c-top\" style=\"border-radius:8px 8px 0 0;\">\n          \u003cspan class=\"brand\" style=\"cursor:pointer;\">DSRV Desk\u003c/span>\n          \u003cspan class=\"meta\">\u003cspan class=\"c-badge\">A자산운용\u003c/span>\u003c/span>\n        \u003c/div>\n        \u003cdiv class=\"c-adminbar\" style=\"margin:0;\">\n          \u003cspan class=\"m\">대시보드\u003c/span>\n          \u003cspan class=\"m on\" style=\"background:#dbeafe;color:#1d4ed8;\">교환하기\u003c/span>\n          \u003cspan class=\"m\">교환게시판\u003c/span>\n        \u003c/div>\n      \u003c/div>\n\n      \u003c!-- 요청 요약 (표시 전용) -->\n      \u003cdiv class=\"zone\" data-idx=\"0\">\n        \u003cdiv class=\"zone-highlight\">\u003c/div>\n        \u003cdiv class=\"item-area\" data-highlight=\"0\" style=\"position:relative;padding:4px;border-radius:8px;\">\n          \u003cdiv class=\"pin\" data-idx=\"0\" style=\"top:-6px;right:-6px;\">1\u003c/div>\n          \u003cdiv class=\"kv\">\u003cspan class=\"k\">요청번호\u003c/span>\u003cspan class=\"v\">EXC-20260902-0001\u003c/span>\u003c/div>\n          \u003cdiv class=\"kv\">\u003cspan class=\"k\">교환쌍 · 방향\u003c/span>\u003cspan class=\"v\">USDC → USDT\u003c/span>\u003c/div>\n          \u003cdiv class=\"kv\">\u003cspan class=\"k\">보내는 수량\u003c/span>\u003cspan class=\"v\">900 USDC \u003cspan style=\"color:#64748b;font-weight:400;\">(≈ 1,215,000원)\u003c/span>\u003c/span>\u003c/div>\n        \u003c/div>\n      \u003c/div>\n\n      \u003c!-- 확정 비율 고시 (표시 전용) -->\n      \u003cdiv class=\"zone\" data-idx=\"1\">\n        \u003cdiv class=\"zone-highlight\">\u003c/div>\n        \u003cdiv class=\"item-area\" data-highlight=\"1\" style=\"position:relative;padding:6px;border-radius:8px;\">\n          \u003cdiv class=\"pin\" data-idx=\"1\" style=\"top:-4px;right:-4px;\">2\u003c/div>\n          \u003cdiv class=\"zone-title\">DSRV 제시 비율 (확정)\u003c/div>\n          \u003cdiv style=\"font-size:22px;font-weight:800;color:#0f172a;font-family:var(--mono);\">0.9997 USDT/USDC\u003c/div>\n          \u003cdiv style=\"font-size:13px;color:#334155;margin:6px 0 10px;\">받는 수량 \u003cstrong>899.73 USDT\u003c/strong>\u003c/div>\n          \u003cdiv class=\"kv\">\u003cspan class=\"k\">스프레드\u003c/span>\u003cspan class=\"v\">0.10% 고정\u003c/span>\u003c/div>\n          \u003cdiv style=\"font-size:10px;color:#94a3b8;margin:2px 0 0;\">교환하기의 참고 비율과 다를 수 있습니다 · 이 비율로 수락 시 확정됩니다\u003c/div>\n        \u003c/div>\n      \u003c/div>\n\n      \u003c!-- 수락 기한 카운트다운 (표시 전용) -->\n      \u003cdiv class=\"zone\" data-idx=\"2\">\n        \u003cdiv class=\"zone-highlight\">\u003c/div>\n        \u003cdiv class=\"item-area\" data-highlight=\"2\" style=\"position:relative;padding:6px;border-radius:8px;\">\n          \u003cdiv class=\"pin\" data-idx=\"2\" style=\"top:-4px;right:-4px;\">3\u003c/div>\n          \u003cdiv style=\"display:flex;align-items:center;justify-content:space-between;\">\n            \u003cspan style=\"font-size:12px;color:#334155;font-weight:600;\">수락 기한 (만료 시 비율 무효 → 재요청)\u003c/span>\n            \u003cspan style=\"font-size:15px;font-weight:800;color:#dc2626;font-family:var(--mono);\">02:00\u003c/span>\n          \u003c/div>\n          \u003cdiv style=\"font-size:9px;color:#94a3b8;padding:4px 0 0;\">▼ [상태: 만료(00:00) 시] 타이머 자리에 \"만료됨 — 비율 무효\" · [수락] 회색 비활성 · 아래 안내(핀 7) 유지\u003c/div>\n        \u003c/div>\n      \u003c/div>\n\n      \u003c!-- 성격 고지 (표시 전용) -->\n      \u003cdiv class=\"zone\" data-idx=\"3\">\n        \u003cdiv class=\"zone-highlight\">\u003c/div>\n        \u003cdiv class=\"item-area\" data-highlight=\"3\" style=\"position:relative;padding:6px;border-radius:8px;\">\n          \u003cdiv class=\"pin\" data-idx=\"3\" style=\"top:-4px;right:-4px;\">4\u003c/div>\n          \u003cdiv class=\"note-inline reg\">이 비율은 DSRV가 형성한 시세가 아니라, 외부지표에 사전 고시된 고정 스프레드를 가산해 건별로 계산한 값입니다. 교환 상대방은 DSRV입니다.\u003c/div>\n        \u003c/div>\n      \u003c/div>\n\n      \u003c!-- 액션·분기: [수락] · [거절] 각각 핀 + 집행 불가 안내 -->\n      \u003cdiv class=\"zone\" data-idx=\"4,5,6\">\n        \u003cdiv class=\"zone-highlight\">\u003c/div>\n        \u003cdiv class=\"row\" style=\"margin-bottom:10px;\">\n          \u003cdiv class=\"item-area\" data-highlight=\"4\" style=\"position:relative;flex:1;padding:4px;border-radius:8px;\">\n            \u003cdiv class=\"pin\" data-idx=\"4\" style=\"top:-6px;right:-6px;\">5\u003c/div>\n            \u003cdiv class=\"btn primary\" style=\"width:100%;\">수락\u003c/div>\n          \u003c/div>\n          \u003cdiv class=\"item-area\" data-highlight=\"5\" style=\"position:relative;flex:.6;padding:4px;border-radius:8px;\">\n            \u003cdiv class=\"pin\" data-idx=\"5\" style=\"top:-6px;right:-6px;\">6\u003c/div>\n            \u003cdiv class=\"btn ghost\" style=\"width:100%;\">거절\u003c/div>\n          \u003c/div>\n        \u003c/div>\n        \u003cdiv class=\"item-area\" data-highlight=\"6\" style=\"position:relative;padding:4px;border-radius:8px;\">\n          \u003cdiv class=\"pin\" data-idx=\"6\" style=\"top:-6px;right:-6px;\">7\u003c/div>\n          \u003cdiv class=\"note-inline\">수락은 클릭 즉시 확정됩니다. 만료·비율 변동·가용 풀 부족 시 이 건은 집행되지 않습니다 (재요청 필요).\u003c/div>\n        \u003c/div>\n      \u003c/div>\n    \u003c/div>\n  \u003c/div>\n\n  \u003csvg id=\"connSvg\" style=\"position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:10;overflow:visible;\">\u003c/svg>\n\n  \u003cdiv class=\"items\" id=\"items\">\n    \u003cdiv class=\"nav-global\">\n      \u003cdiv class=\"nav-global-title\">진입 · 전역 이동\u003c/div>\n      \u003cdiv class=\"nav-note\">· \u003cstrong>전역 이동\u003c/strong> 상단 메뉴(GNB) · 기관 배지 · 뒤로가기의 동작은 대시보드(DASH-01)의 표와 같다. 다른 점 = 현재 탭 '교환하기'를 다시 클릭하면 무반응이 아니라 교환하기(EXC-01)가 초기 상태(새 요청)로 열린다.\u003cbr>\n      · \u003cstrong>진입\u003c/strong> 교환하기(EXC-01) [거래 요청] 클릭 → 서버 산정이 끝나는 즉시 이 화면. 값은 진입 시 모두 확정되어 있어 이 화면 자체의 로딩은 없다.\u003cbr>\n      · \u003cstrong>재진입 없음\u003c/strong> GNB 이동이나 브라우저 닫기로 벗어나면 돌아올 경로가 없다. 수락하지 않은 건은 기한이 지나면 서버가 '만료'로 종결한다. \u003cspan class=\"chk\">[확인필요: 만료·거절 건이 대시보드(DASH-01) 거래 목록에 보이는지]\u003c/span>\u003c/div>\n    \u003c/div>\n\n    \u003cdiv class=\"itm\" data-idx=\"0\">\n      \u003cdiv class=\"num\">1\u003c/div>\n      \u003cdiv>\n        \u003cdiv class=\"itm-title\">요청 요약 (표시 전용)\u003c/div>\n        \u003cdiv class=\"itm-desc\">\u003cstrong>값\u003c/strong> EXC-01 입력값을 그대로 표시하고 이 화면에서 수정하지 않는다(수정은 [거절] 후 EXC-01 재요청).\u003cbr>\u003cstrong>요청번호\u003c/strong> EXC-YYYYMMDD-NNNN — 요청일과 당일 일련번호 4자리. 진입 시점에 이미 채번되어 있다.\u003cbr>\u003cstrong>자릿수\u003c/strong> 보내는 수량은 보내는 자산 기준(ETH 4 / USDC·USDT 2)이고 괄호 안에 KRW 환산액(소수 2자리 · 요청 시점 ADM-03 시세 · 스테이블코인도 KRW 시세)을 함께 적는다.\u003cbr>\u003cspan class=\"basis\">근거 notation 채번·수량 표기 · 09 §0 건별 한도\u003c/span>\u003c/div>\n      \u003c/div>\n    \u003c/div>\n\n    \u003cdiv class=\"itm\" data-idx=\"1\">\n      \u003cdiv class=\"num\">2\u003c/div>\n      \u003cdiv>\n        \u003cdiv class=\"itm-title\">확정 비율 · 받는 수량 · 스프레드 고시 (표시 전용)\u003c/div>\n        \u003cdiv class=\"itm-desc\">\u003cstrong>값\u003c/strong> 세 값은 진입 시점에 확정된 고정값이다. 화면에 머무는 동안 갱신·재계산하지 않고, 기한 내 수락하면 이 값 그대로 확정한다.\u003cbr>\u003cstrong>산정\u003c/strong> 확정 비율은 요청 시점 외부지표에 ADM-03 고정 스프레드 {정책값 0.10%}를 가산해 시스템이 자동 산정한다. 담당자 수동 입력과 재량은 없다.\u003cbr>\u003cstrong>자릿수\u003c/strong> 스테이블 페어는 「{비율} {받는}/{주는}」 소수 4자리, ETH 페어는 방향과 무관하게 「{비율} {스테이블}/ETH」 소수 2자리. 스프레드는 {정책값 0.10%} 소수 2자리로 비율과 별도 항목에 둔다.\u003cbr>\u003cstrong>받는 수량\u003c/strong> 보내는 수량 × 확정 비율(스테이블→ETH는 ÷)을 받는 자산 자릿수로 절사한다. 확정 수량이므로 라벨에 ≈를 붙이지 않는다.\u003cbr>\u003cstrong>안내\u003c/strong> 하단에 \"교환하기의 참고 비율과 다를 수 있습니다 · 이 비율로 수락 시 확정됩니다\"를 고정 노출한다. 시세 소스명은 화면에 넣지 않는다.\u003cbr>\u003cspan class=\"basis\">근거 V2 · 09 §0 나목 견적 산정·표기 자릿수 · L6 설명의무\u003c/span>\u003c/div>\n      \u003c/div>\n    \u003c/div>\n\n    \u003cdiv class=\"itm\" data-idx=\"2\">\n      \u003cdiv class=\"num\">3\u003c/div>\n      \u003cdiv>\n        \u003cdiv class=\"itm-title\">수락 기한 카운트다운 (표시 전용)\u003c/div>\n        \u003cdiv class=\"itm-desc\">\u003cstrong>값\u003c/strong> MM:SS 형식으로 1초 단위 감소하고 시작값은 ADM-03 {정책값 120초}다(목업 02:00은 예시). 잔여 시간에 따른 색 변경과 점멸은 두지 않는다.\u003cbr>\u003cstrong>기준\u003c/strong> 진입 시 서버가 준 만료 시각을 기준으로 클라이언트가 표시한다. 표시는 안내용이고 만료 판정의 정본은 [수락] 클릭 시 서버 재검증이다.\u003cbr>\u003cstrong>상태\u003c/strong> ① 진행(00:01 이상)은 [수락] 활성 ② 만료(00:00)는 타이머 자리를 \"만료됨 — 비율 무효\"로 바꾸고 [수락]을 서버 응답 없이 즉시 비활성으로 두며 [거절]은 활성으로 남긴다(토스트·모달 없음) ③ 탭 절전 후 복귀 시 서버 만료 시각으로 잔여를 다시 계산한다.\u003cbr>\u003cstrong>적용 범위\u003c/strong> 기한은 수락 행위에만 적용한다. 수락 후 EXC-03 진행({정책값 2영업일})은 기한과 무관하다.\u003cbr>\u003cspan class=\"chk\">[확인필요: 유효시간 ADM-03 정책값]\u003c/span>\u003cbr>\u003cspan class=\"basis\">근거 V2(건별 요청 산정 · 상시 호가 아님)\u003c/span>\u003c/div>\n      \u003c/div>\n    \u003c/div>\n\n    \u003cdiv class=\"itm\" data-idx=\"3\">\n      \u003cdiv class=\"num\">4\u003c/div>\n      \u003cdiv>\n        \u003cdiv class=\"itm-title\">\"자체 시세 아님 · DSRV 상대방\" 성격 고지 (표시 전용)\u003c/div>\n        \u003cdiv class=\"itm-desc\">\u003cstrong>문구\u003c/strong> 고정이며 만료 상태에서도 유지한다. 변경은 법무 확인 후에 한다.\u003cbr>\u003cstrong>범위\u003c/strong> 소스명과 조합 방식은 적지 않고 \"외부지표 + 사전 고시 고정 스프레드\"까지만 쓴다.\u003cbr>\u003cspan class=\"basis\">근거 V2 · 09 §0 line 51 ①⑤ · [로펌게이트] 문구 확정\u003c/span>\u003c/div>\n      \u003c/div>\n    \u003c/div>\n\n    \u003cdiv class=\"itm\" data-idx=\"4\">\n      \u003cdiv class=\"num\">5\u003c/div>\n      \u003cdiv>\n        \u003cdiv class=\"itm-title\">[수락] 버튼\u003cspan class=\"req\">필수\u003c/span>\u003c/div>\n        \u003cdiv class=\"itm-desc\">\u003cstrong>노출\u003c/strong> 항상 보인다.\u003cbr>\u003cstrong>클릭 가능\u003c/strong> 수락 기한이 남아 있을 때만 활성이다. 만료되면 즉시 비활성으로 둔다.\u003cbr>\u003cstrong>확인 사항\u003c/strong> 확인 다이얼로그를 띄우지 않는다. EXC-01 참고 비율과 EXC-02 확정 비율 2회 고지가 이를 대체하고, 클릭 시 서버가 만료 여부를 다시 판정한다.\u003cbr>\u003cstrong>액션\u003c/strong> 확정 비율과 받는 수량을 고정하고 건 상태를 '수락(확정)'으로 바꿔 DSRV 승인과 콜드 수동 집행(EXC-03)으로 넘긴다. 고객사 승인 단계는 두지 않는다.\u003cbr>\u003cstrong>재요청\u003c/strong> 재요청 버튼은 두지 않는다. 만료·거절 후 새 비율은 EXC-01부터 다시 받는다.\u003cbr>\u003cspan class=\"basis\">근거 F-1a · 09 §0 나목 견적 산정 · notation '확인 다이얼로그'\u003c/span>\u003c/div>\n        \u003cdiv class=\"itm-nav\">\u003cspan class=\"nav-tag\">화면 이동 · 인터랙션\u003c/span>\n          \u003cdiv class=\"nav-row\">\u003cspan class=\"nav-el\">[수락] — 활성 조건\u003c/span>\u003cspan class=\"nav-act\">다음이 모두 아님: ①카운트다운 만료(00:00 도달) ②처리 중(클릭 후 응답 대기) ③수락 실패 후 안내 노출 중(만료·풀 부족)\u003c/span>\u003cspan class=\"nav-to stay\">하나라도 해당 → 회색 비활성(공통 UI 규격) · 사유는 타이머 자리·버튼 위 인라인 안내로 노출(툴팁 없음)\u003c/span>\u003c/div>\n          \u003cdiv class=\"nav-row\">\u003cspan class=\"nav-el\">[수락] — 클릭(활성)\u003c/span>\u003cspan class=\"nav-act\">클릭 → \u003cstrong>확인 없음\u003c/strong> → 라벨 \"처리 중…\"·비활성(중복 클릭 차단 · [거절]도 함께 비활성) → 서버 재검증(기한·가용 풀) 통과 → 건 상태 '수락(확정)' · 카운트다운 정지\u003c/span>\u003cspan class=\"nav-to\">\u003cstrong>승인 진행(EXC-03)\u003c/strong> — 즉시 이동(토스트 없음 · EXC-03 스텝 '비율 수락 ✓'로 결과 인지)\u003c/span>\u003c/div>\n          \u003cdiv class=\"nav-row\">\u003cspan class=\"nav-el\">[수락] — 실패\u003c/span>\u003cspan class=\"nav-act\">ⓐ 서버 기준 기한 경과 / ⓑ 수락 시점 가용 풀 부족 / ⓒ 시스템 오류\u003c/span>\u003cspan class=\"nav-to stay\">화면 잔류 · ⓐ 타이머 \"만료됨 — 비율 무효\" + 버튼 위 인라인 ⚠ \"견적이 만료되었습니다 — 교환하기에서 다시 요청해 주세요\" · [수락] 비활성 유지 / ⓑ 인라인 ⚠ \"현재 교환 가능 풀이 부족해 이 건을 진행할 수 없습니다 — 교환하기에서 다시 요청해 주세요\" · 건 '종결(풀 부족)' · [수락] 비활성 유지 / ⓒ 상단 배너 \"일시적인 오류입니다. 잠시 후 다시 시도해 주세요\" · 라벨 복귀·재클릭 가능(기한 내) · 모두 [거절] 활성 복귀\u003c/span>\u003c/div>\n        \u003c/div>\n      \u003c/div>\n    \u003c/div>\n\n    \u003cdiv class=\"itm\" data-idx=\"5\">\n      \u003cdiv class=\"num\">6\u003c/div>\n      \u003cdiv>\n        \u003cdiv class=\"itm-title\">[거절] 버튼\u003c/div>\n        \u003cdiv class=\"itm-desc\">\u003cstrong>노출\u003c/strong> 항상 보인다.\u003cbr>\u003cstrong>클릭 가능\u003c/strong> 만료 상태에서도 활성으로 남긴다.\u003cbr>\u003cstrong>확인 사항\u003c/strong> 확인 다이얼로그와 사유 입력을 두지 않는다.\u003cbr>\u003cstrong>액션\u003c/strong> 기한 내에 누르면 이 건을 '거절'로 종결한다(채번된 요청번호는 재사용하지 않는다). 만료 후에 누르면 상태를 바꾸지 않고 화면 이탈로만 동작한다. \u003cspan class=\"chk\">[확인필요: 만료 후 라벨을 '돌아가기'로 바꿀지]\u003c/span>\u003cbr>\u003cspan class=\"basis\">근거 notation '확인 다이얼로그'·'종료 동선'\u003c/span>\u003c/div>\n        \u003cdiv class=\"itm-nav\">\u003cspan class=\"nav-tag\">화면 이동 · 인터랙션\u003c/span>\n          \u003cdiv class=\"nav-row\">\u003cspan class=\"nav-el\">[거절] — 활성 조건\u003c/span>\u003cspan class=\"nav-act\">다음이 아님: ①[수락] 처리 중(응답 대기)\u003c/span>\u003cspan class=\"nav-to stay\">처리 중에만 회색 비활성 · 만료·실패 상태에서는 활성\u003c/span>\u003c/div>\n          \u003cdiv class=\"nav-row\">\u003cspan class=\"nav-el\">[거절] — 클릭(활성)\u003c/span>\u003cspan class=\"nav-act\">클릭 → 확인 없음 → 라벨 \"처리 중…\"·비활성 → 건 상태 '거절' 종결(만료·풀 부족으로 이미 종결된 건이면 상태 변경 없음)\u003c/span>\u003cspan class=\"nav-to\">\u003cstrong>교환하기(EXC-01)\u003c/strong> 초기 상태(자산 미선택·수량 빈칸) — 새 요청부터 다시 · 토스트 없음\u003c/span>\u003c/div>\n          \u003cdiv class=\"nav-row\">\u003cspan class=\"nav-el\">[거절] — 실패\u003c/span>\u003cspan class=\"nav-act\">시스템 오류(상태 저장 실패)\u003c/span>\u003cspan class=\"nav-to stay\">화면 잔류 · 상단 배너 \"일시적인 오류입니다. 잠시 후 다시 시도해 주세요\" · 라벨 복귀 · 기한 경과 시 서버가 '만료'로 종결하므로 재시도 불필요\u003c/span>\u003c/div>\n        \u003c/div>\n      \u003c/div>\n    \u003c/div>\n\n    \u003cdiv class=\"itm\" data-idx=\"6\">\n      \u003cdiv class=\"num\">7\u003c/div>\n      \u003cdiv>\n        \u003cdiv class=\"itm-title\">즉시 확정 · 집행 불가 3분기 안내 (표시 전용)\u003c/div>\n        \u003cdiv class=\"itm-desc\">\u003cstrong>문구\u003c/strong> 고정. \"수락은 클릭 즉시 확정됩니다. 만료·비율 변동·가용 풀 부족 시 이 건은 집행되지 않습니다 (재요청 필요).\"\u003cbr>\u003cstrong>역할\u003c/strong> [수락] 단독 실행 결과 고지로 확인 다이얼로그를 대체하고, 교환 불가 3분기를 사전 고지한다(분기별 인지 시점은 상세 7).\u003cbr>\u003cstrong>'비율 변동' 정의\u003c/strong> 수락 후 집행 전에 외부지표가 ADM-03 이탈 임계를 벗어난 경우다. 집행을 정지하고 EXC-04에서 '만료' 사유로 표기하며 임계값과 소스명은 노출하지 않는다.\u003cbr>\u003cspan class=\"basis\">근거 09 §0 line 51 ① · F-1a · notation 단독 실행 표기\u003c/span>\u003c/div>\n      \u003c/div>\n    \u003c/div>\n  \u003c/div>\n\n\u003c/div>\n\n\u003csection class=\"footer-note\" style=\"padding-bottom:0;\">\n  \u003cdiv class=\"note-card\">\n    \u003cdiv class=\"note-title\">상세내용\u003c/div>\n    \u003cdiv class=\"detail-grid\" id=\"detailCol\">\n      \u003cdiv class=\"dtl\" data-idx=\"0\">\n        \u003cdiv class=\"detail-label\">\u003cspan class=\"dtl-num\">1\u003c/span>요청 요약 — 표시 규칙\u003c/div>\n      \u003cdiv class=\"dtl-body\">\u003cspan class=\"box\">· 요청번호는 EXC-01 [거래 요청] 클릭 시 채번 → EXC-02·03·04·DASH-01·ADM-02가 같은 번호 사용\u003cbr>· 보내는 수량의 KRW 환산은 요청 시점 값으로 고정(체류 중 재환산 없음) — 한도 검증은 EXC-01에서 완료, 이 화면은 재검증하지 않음\u003cbr>· 예시 900 USDC ≈ 1,215,000원 · ETH 예: 0.3 ETH ≈ 1,289,520원(3,184.00 USDC/ETH · 1 USDC ≈ 1,350원 가정 — 실제 환산은 요청 시점 KRW 시세)\u003c/span>\u003c/div>\n      \u003c/div>\n      \u003cdiv class=\"dtl\" data-idx=\"1\">\n        \u003cdiv class=\"detail-label\">\u003cspan class=\"dtl-num\">2\u003c/span>외부지표 소스 — 내부 관리 (화면 미노출)\u003c/div>\n      \u003cdiv class=\"dtl-body\">\n        \u003cspan class=\"box\">· 소스: \u003cstrong>업비트·빗썸·바이낸스\u003c/strong> 시세 — 조합 방식(중앙값·평균·우선순위) \u003cspan class=\"chk\">[확인필요]\u003c/span> · 소스명·조합 방식은 고객 화면 어디에도 표시하지 않음\u003cbr>· USDC↔USDT: 디페그/1:1 기준(동일통화) — 가격 거의 동일, 지표 1 근접\u003cbr>· ETH↔USDC · ETH↔USDT: 거래소 ETH 시세 기준 — 변동성 있음, 확정 후 집행 전 이탈 임계 적용 · ETH 페어 스프레드 요율 \u003cspan class=\"chk\">[확인필요]\u003c/span>\u003cbr>· JPYSC 미취급 — 환율지표 페어 없음\u003cbr>· 소스·스프레드율·유효시간·이탈 임계는 \u003cstrong>ADM-03\u003c/strong> 단일 출처에서 관리 — 이 화면은 값을 표출만\u003c/span>\n        \u003cspan style=\"display:block;margin-top:6px;\" class=\"red\">가격형성(시장가) 아님 — 외부지표에 스프레드만 가산\u003c/span>\n      \u003c/div>\n      \u003c/div>\n      \u003cdiv class=\"dtl\" data-idx=\"2\">\n        \u003cdiv cl
