03c/span>\u003cspan class=\"nav-to stay\">칩 갱신·목록 닫힘 · 현 시세 조회(\"불러오는 중…\" → 값) · 두 수량이 있으면 환산 비율·편차 재계산 · 바깥 클릭/ESC = 변경 없이 닫힘\u003c/span>\u003c/div>\n          \u003cdiv class=\"nav-row\">\u003cspan class=\"nav-el\">받는 자산 ▾ (비활성 상태)\u003c/span>\u003cspan class=\"nav-act\">보내는 자산 미선택 상태에서 클릭\u003c/span>\u003cspan class=\"nav-to stay\">무반응 · 필드 위 인라인 안내 \"보내는 자산을 먼저 선택해 주세요\"\u003c/span>\u003c/div>\n          \u003cdiv class=\"nav-row\">\u003cspan class=\"nav-el\">받는 자산 ▾ (재선택)\u003c/span>\u003cspan class=\"nav-act\">다른 자산 선택\u003c/span>\u003cspan class=\"nav-to stay\">받는 수량 초기화(빈칸) · 보내는 수량 유지 · 현 시세 재조회 · 비율·편차 \"—\"\u003c/span>\u003c/div>\n        \u003c/div>\n      \u003c/div>\n    \u003c/div>\n\n    \u003cdiv class=\"itm\" data-idx=\"2\">\n      \u003cdiv class=\"num\">3\u003c/div>\n      \u003cdiv>\n        \u003cdiv class=\"itm-title\">보내는 수량 입력\u003cspan class=\"req\">필수\u003c/span>\u003c/div>\n        \u003cdiv class=\"itm-desc\">\u003cstrong>입력 가능\u003c/strong> 보내는 자산을 고른 뒤에만 가능하다. 처분 가능 잔고가 0이거나 잔고 조회가 실패하면 비활성으로 둔다.\u003cbr>\u003cstrong>허용 문자\u003c/strong> 숫자와 소수점만 받는다. 소수 자릿수 상한은 보내는 자산 기준(ETH 4 / USDC·USDT 2)이고 초과 입력은 무시한다. 천 단위 쉼표는 자동으로 넣는다.\u003cbr>\u003cstrong>검증\u003c/strong> 입력 중 건별 한도 {정책값 1,500,000원 상당}와 처분 가능분을 함께 판정한다.\u003cbr>\u003cstrong>실패 처리\u003c/strong> 한도 초과와 처분 가능분 초과에 각각 인라인 ⚠를 띄우고 [게시]를 비활성으로 둔다. 둘 다 해당하면 한도 초과만 보여준다.\u003cbr>\u003cstrong>연동\u003c/strong> 입력 중 필드 아래 KRW 환산액(소수 2자리 · ADM-03 시세 · 요청 시점)과 환산 비율·편차(항목 6)를 갱신한다. 라벨 우측에 \"1회 최대 1,500,000원 상당\"을 상시 표기한다.\u003cbr>\u003cspan class=\"basis\">근거 09 §0 건별 한도·표기 자릿수 · V2 거래 안전성 검증(4요소①)\u003c/span>\u003c/div>\n        \u003cdiv class=\"itm-nav\">\u003cspan class=\"nav-tag\">화면 이동 · 인터랙션\u003c/span>\n          \u003cdiv class=\"nav-row\">\u003cspan class=\"nav-el\">보내는 수량 필드\u003c/span>\u003cspan class=\"nav-act\">키 입력마다 검증(포커스 아웃 대기 없음)\u003c/span>\u003cspan class=\"nav-to stay\">정상 → 경고 제거 / 초과 → 인라인 경고 ③ 또는 ④ 노출·[게시] 비활성 · 받는 수량이 있으면 환산 비율·편차 재계산\u003c/span>\u003c/div>\n          \u003cdiv class=\"nav-row\">\u003cspan class=\"nav-el\">보내는 수량 필드 (자산 미선택)\u003c/span>\u003cspan class=\"nav-act\">보내는·받는 자산 중 하나라도 미선택\u003c/span>\u003cspan class=\"nav-to stay\">필드 비활성 · 클릭 시 인라인 안내 \"자산을 먼저 선택해 주세요\"\u003c/span>\u003c/div>\n        \u003c/div>\n      \u003c/div>\n    \u003c/div>\n\n    \u003cdiv class=\"itm\" data-idx=\"3\">\n      \u003cdiv class=\"num\">4\u003c/div>\n      \u003cdiv>\n        \u003cdiv class=\"itm-title\">보유 · 처분 가능 잔고 (표시 전용)\u003c/div>\n        \u003cdiv class=\"itm-desc\">\u003cstrong>조회\u003c/strong> 보내는 자산을 고를 때 조회해 수량 필드 바로 아래 1줄로 보여준다.\u003cbr>\u003cstrong>정의\u003c/strong> 처분 가능 = 커스터디 실보유 잔고 − 기게시(게재중·협의중) 중복분. \u003cspan class=\"chk\">[확인필요: 확정 후 이전 대기분 차감 여부]\u003c/span>\u003cbr>\u003cstrong>색\u003c/strong> 입력 수량이 처분 가능 이하면 초록 ✓, 초과하면 빨강으로 두고 항목 3의 경고와 함께 보여준다. 처분 가능이 0이면 \"처분 가능 0 — 게시할 수 없습니다\"로 바꾸고 수량 입력을 비활성으로 둔다.\u003cbr>\u003cstrong>상태\u003c/strong> 로딩은 \"불러오는 중…\"이고 3초 초과 시 오류로 넘긴다. 조회 실패면 \"—\"와 상단 배너를 띄우고 [게시]를 비활성으로 둔다.\u003cbr>\u003cspan class=\"basis\">근거 V2 거래 안전성 검증(4요소①) · 허위 게시 차단\u003c/span>\u003c/div>\n      \u003c/div>\n    \u003c/div>\n\n    \u003cdiv class=\"itm\" data-idx=\"4\">\n      \u003cdiv class=\"num\">5\u003c/div>\n      \u003cdiv>\n        \u003cdiv class=\"itm-title\">받는 수량 입력\u003cspan class=\"req\">필수\u003c/span>\u003c/div>\n        \u003cdiv class=\"itm-desc\">\u003cstrong>입력 가능\u003c/strong> 받는 자산을 고른 뒤에만 가능하다.\u003cbr>\u003cstrong>허용 문자\u003c/strong> 숫자와 소수점만 받는다. 소수 자릿수 상한은 받는 자산 기준이고 초과 입력은 무시한다. 천 단위 쉼표는 자동으로 넣는다.\u003cbr>\u003cstrong>검증\u003c/strong> 이 값의 잔고·한도는 판정하지 않는다. 받는 쪽은 상대가 보내는 자산이므로 검증은 BRK-03에서 한다.\u003cbr>\u003cstrong>실패 처리\u003c/strong> 편차가 허용 범위를 넘으면 빨간 테두리로 표시하고 문구는 항목 7에 한 번만 띄운다.\u003cbr>\u003cstrong>연동\u003c/strong> 보내는 수량과 이 값으로 환산 비율을 자동 계산한다(항목 6). 비율을 직접 입력하는 필드는 두지 않는다.\u003cbr>\u003cspan class=\"basis\">근거 F-1b · notation 입력 자릿수\u003c/span>\u003c/div>\n        \u003cdiv class=\"itm-nav\">\u003cspan class=\"nav-tag\">화면 이동 · 인터랙션\u003c/span>\n          \u003cdiv class=\"nav-row\">\u003cspan class=\"nav-el\">받는 수량 필드\u003c/span>\u003cspan class=\"nav-act\">키 입력마다 환산 비율·편차 재계산\u003c/span>\u003cspan class=\"nav-to stay\">허용 이내 → 경고 제거·[게시] 활성 조건 충족 / 초과 → 항목 7 경고 노출·[게시] 비활성\u003c/span>\u003c/div>\n          \u003cdiv class=\"nav-row\">\u003cspan class=\"nav-el\">받는 수량 필드 (자산 미선택)\u003c/span>\u003cspan class=\"nav-act\">보내는·받는 자산 중 하나라도 미선택\u003c/span>\u003cspan class=\"nav-to stay\">필드 비활성 · 클릭 시 인라인 안내 \"자산을 먼저 선택해 주세요\"\u003c/span>\u003c/div>\n        \u003c/div>\n      \u003c/div>\n    \u003c/div>\n\n    \u003cdiv class=\"itm\" data-idx=\"5\">\n      \u003cdiv class=\"num\">6\u003c/div>\n      \u003cdiv>\n        \u003cdiv class=\"itm-title\">환산 비율 · 현 시세 · 편차 (표시 전용)\u003c/div>\n        \u003cdiv class=\"itm-desc\">\u003cstrong>구성\u003c/strong> 3행 kv. 어느 한 수량이 비면 환산 비율과 편차를 \"—\"로 둔다.\u003cbr>\u003cstrong>환산 비율\u003c/strong> 스테이블 페어는 받는 ÷ 보내는을 소수 4자리로, ETH 페어는 스테이블 ÷ ETH를 소수 2자리로 쓴다(방향 무관). 자릿수 초과분은 절사한다.\u003cbr>\u003cstrong>현 시세\u003c/strong> 받는 자산을 고를 때 1회 조회하고 자동으로 다시 조회하지 않는다. 외부지표 기준이며 소스명은 노출하지 않는다. 조회 실패면 \"—\"와 상단 배너를 띄우고 [게시]를 비활성으로 둔다.\u003cbr>\u003cstrong>편차\u003c/strong> (환산 비율 − 현 시세) ÷ 현 시세 × 100을 소수 2자리 부호와 함께 쓰고 옆에 \"(허용 ±{정책값 2.0%} 이내)\"를 붙인다. 허용 이내는 초록, 초과는 빨강으로 두고 항목 7 경고를 띄운다.\u003cbr>\u003cstrong>용도\u003c/strong> 현 시세는 가격 결정이 아니라 편차 판정과 중지 판단 기준이다. 가격은 당사자 합의로 정한다.\u003cbr>\u003cspan class=\"basis\">근거 09 §0 비율 표기 · notation 교환비율 · L6 설명의무\u003c/span>\u003c/div>\n      \u003c/div>\n    \u003c/div>\n\n    \u003cdiv class=\"itm\" data-idx=\"6\">\n      \u003cdiv class=\"num\">7\u003c/div>\n      \u003cdiv>\n        \u003cdiv class=\"itm-title\">편차 경고 (조건부 노출)\u003c/div>\n        \u003cdiv class=\"itm-desc\">\u003cstrong>노출\u003c/strong> |편차|가 ±{정책값 2.0%}(ADM-03)를 넘을 때만 환산 비율 kv 바로 아래에 보인다.\u003cbr>\u003cstrong>문구\u003c/strong> 단일 문구를 쓴다 — \"⚠ 현 시세 대비 편차 {편차}% — 허용 범위 ±{정책값 2.0%}를 초과해 게시할 수 없습니다. 수량을 조정해 주세요\".\u003cbr>\u003cstrong>동작\u003c/strong> 노출 중에는 [게시]를 비활성으로 둔다. 수량을 고쳐 허용 이내가 되면 즉시 제거하고 닫기(×)는 두지 않는다.\u003cbr>\u003cstrong>목적\u003c/strong> 자전·이상거래 오인을 막고 ADM-02 이상거래 워닝 룰과 기준을 맞춘다. \u003cspan class=\"chk\">[확인필요: ETH 페어 별도 임계 여부]\u003c/span>\u003cbr>\u003cspan class=\"basis\">근거 F-1b · ADM-02 이상거래 워닝 연계\u003c/span>\u003c/div>\n        \u003cdiv class=\"itm-nav\">\u003cspan class=\"nav-tag\">화면 이동 · 인터랙션\u003c/span>\n          \u003cdiv class=\"nav-row\">\u003cspan class=\"nav-el\">경고 블록\u003c/span>\u003cspan class=\"nav-act\">클릭\u003c/span>\u003cspan class=\"nav-to stay\">무반응(표시 전용) · 편차 재계산으로만 제거\u003c/span>\u003c/div>\n        \u003c/div>\n      \u003c/div>\n    \u003c/div>\n\n    \u003cdiv class=\"itm\" data-idx=\"7\">\n      \u003cdiv class=\"num\">8\u003c/div>\n      \u003cdiv>\n        \u003cdiv class=\"itm-title\">게시 유효기간 (표시 전용)\u003c/div>\n        \u003cdiv class=\"itm-desc\">\u003cstrong>값\u003c/strong> kv 1행 「{정책값 30일} · 만료 예정 YYYY-MM-DD HH:MM」. 일수는 {정책값 30일}(ADM-03)이고 만료 예정은 게시 시점 서버 시각에 이 일수를 더해 확정한다.\u003cbr>\u003cstrong>입력 아님\u003c/strong> 게시자가 고르는 필드를 두지 않는다. \u003cspan class=\"chk\">[확인필요: 게시자 유효기간 선택 허용 여부]\u003c/span>\u003cbr>\u003cstrong>만료 시\u003c/strong> 게시를 자동 종료해 상태를 '완료(유효기간 만료)'로 바꾸고 대기 중 신청도 함께 종결한다.\u003cbr>\u003cspan class=\"basis\">근거 09 §0 마목 게시 상태\u003c/span>\u003c/div>\n      \u003c/div>\n    \u003c/div>\n\n    \u003cdiv class=\"itm\" data-idx=\"8\">\n      \u003cdiv class=\"num\">9\u003c/div>\n      \u003cdiv>\n        \u003cdiv class=\"itm-title\">시세변동 자동중지 · 구속력 안내 (표시 전용)\u003c/div>\n        \u003cdiv class=\"itm-desc\">\u003cstrong>문구\u003c/strong> 고정이며 임계 ±{정책값 2.0%}는 ADM-03 값으로 표시한다(게시자 개별 설정은 두지 않는다).\u003cbr>\u003cstrong>중지 규칙\u003c/strong> 게시 시점 외부지표 스냅숏 대비 변동이 임계를 넘으면 시스템이 자동중지해 상태를 '중지'로 바꾸고 게시판에서 빼며, 대기 중 신청을 전부 자동 종결하고 양측에 이메일을 보낸다. 재개는 이 화면에서 재게시(새 요청번호)로만 한다.\u003cbr>\u003cstrong>성격\u003c/strong> 외부지표는 가격 결정이 아닌 중지 판단 기준이고, 게시는 구속력 없는 의향 표시다(수락 시 확정). 문구 변경은 법무 확인 후에 한다.\u003cbr>\u003cspan class=\"basis\">근거 09 §0 line 57 · 마목 게시 상태 개정\u003c/span>\u003c/div>\n      \u003c/div>\n    \u003c/div>\n\n    \u003cdiv class=\"itm\" data-idx=\"9\">\n      \u003cdiv class=\"num\">10\u003c/div>\n      \u003cdiv>\n        \u003cdiv class=\"itm-title\">[게시] 버튼\u003cspan class=\"req\">필수\u003c/span>\u003c/div>\n        \u003cdiv class=\"itm-desc\">\u003cstrong>노출\u003c/strong> 항상 보인다.\u003cbr>\u003cstrong>클릭 가능\u003c/strong> 자산 2종과 두 수량이 채워지고, 처분 가능분·건별 한도·편차 검증을 모두 통과하고, KYC 예외가 아니고 잔고·시세 조회가 성공했을 때만 활성이다. 게이트는 클릭 후 오류가 아니라 사전 비활성으로 처리한다.\u003cbr>\u003cstrong>확인 사항\u003c/strong> 확인 다이얼로그를 두지 않는다(구속력·비가역 행위가 아니다). 클릭 시 서버가 처분 가능분과 한도를 다시 판정한다.\u003cbr>\u003cstrong>액션\u003c/strong> 게시를 등록해 상태를 '게재중'으로 두고 만료 예정 시각을 서버 시각으로 확정한 뒤 BRK-01 목록에 노출한다.\u003cbr>\u003cspan class=\"basis\">근거 F-4 · V2(4요소①) · 1기관 1가입자\u003c/span>\u003c/div>\n        \u003cdiv class=\"itm-nav\">\u003cspan class=\"nav-tag\">화면 이동 · 인터랙션\u003c/span>\n          \u003cdiv class=\"nav-row\">\u003cspan class=\"nav-el\">[게시] — 활성 조건\u003c/span>\u003cspan class=\"nav-act\">다음이 모두 아님: ①보내는·받는 자산 미선택 ②보내는·받는 수량 빈칸·0 ③보내는 수량 &gt; 처분 가능분 ④건별 한도 {정책값 1,500,000원 상당} 초과 ⑤편차 경고 노출 중 ⑥KYC 예외 배너 노출 중 ⑦잔고·현 시세 조회 실패\u003c/span>\u003cspan class=\"nav-to stay\">하나라도 해당 → 회색 비활성(공통 UI 규격) · 사유는 해당 위치 인라인 경고로 이미 노출(툴팁 없음)\u003c/span>\u003c/div>\n          \u003cdiv class=\"nav-row\">\u003cspan class=\"nav-el\">[게시] — 클릭(활성)\u003c/span>\u003cspan class=\"nav-act\">클릭 → 확인 없음 → 버튼 라벨 \"게시 중…\"·비활성(중복 클릭 차단) → 처분 가능분·한도·편차 서버 재검증 → 요청번호 BRK-YYYYMMDD-NNNN 채번 · 상태 게재중 · 게시 시점 시세 스냅숏 저장 · 게시판 게재\u003c/span>\u003cspan class=\"nav-to\">\u003cstrong>내 게시 상세·회수(BRK-06)\u003c/strong> — 상태 행 '게재중 · 받은 신청 0건'(2026-09-02 변경 — 종전 BRK-01 복귀 폐기) · 별도 토스트 없음\u003c/span>\u003c/div>\n          \u003cdiv class=\"nav-row\">\u003cspan class=\"nav-el\">[게시] — 실패\u003c/span>\u003cspan class=\"nav-act\">재검증 실패(클릭 사이 잔고 변동·시세 이동으로 편차 초과) / 시세 소스 장애 / 시스템 오류\u003c/span>\u003cspan class=\"nav-to stay\">화면 잔류 · 잔고 → 항목 3 ④ 경고 재노출 / 편차 → 항목 7 경고 노출(현 시세 갱신) / 장애·오류 → 상단 배너 \"일시적인 오류입니다. 잠시 후 다시 시도해 주세요\" · 입력값 유지 · 버튼 라벨 복귀\u003c/span>\u003c/div>\n        \u003c/div>\n      \u003c/div>\n    \u003c/div>\n\n    \u003cdiv class=\"itm\" data-idx=\"10\">\n      \u003cdiv class=\"num\">11\u003c/div>\n      \u003cdiv>\n        \u003cdiv class=\"itm-title\">[취소] 버튼\u003c/div>\n        \u003cdiv class=\"itm-desc\">\u003cstrong>노출\u003c/strong> 항상 보인다.\u003cbr>\u003cstrong>클릭 가능\u003c/strong> 항상 활성이다.\u003cbr>\u003cstrong>확인 사항\u003c/strong> 없다.\u003cbr>\u003cstrong>액션\u003c/strong> 입력값을 파기하고 BRK-01로 돌아간다.\u003cbr>\u003cspan class=\"basis\">근거 notation 종료 동선\u003c/span>\u003c/div>\n        \u003cdiv class=\"itm-nav\">\u003cspan class=\"nav-tag\">화면 이동 · 인터랙션\u003c/span>\n          \u003cdiv class=\"nav-row\">\u003cspan class=\"nav-el\">[취소] — 활성 조건\u003c/span>\u003cspan class=\"nav-act\">항상 활성(게시 진행 중 \"게시 중…\" 동안만 비활성)\u003c/span>\u003cspan class=\"nav-to stay\">—\u003c/span>\u003c/div>\n          \u003cdiv class=\"nav-row\">\u003cspan class=\"nav-el\">[취소] — 클릭(활성)\u003c/span>\u003cspan class=\"nav-act\">클릭 → 확인 없음 → 입력값 파기(저장·임시보관 없음)\u003c/span>\u003cspan class=\"nav-to\">\u003cstrong>교환 게시판(BRK-01)\u003c/strong> 복귀 · 목록 재조회\u003c/span>\u003c/div>\n          \u003cdiv class=\"nav-row\">\u003cspan class=\"nav-el\">[취소] — 실패\u003c/span>\u003cspan class=\"nav-act\">해당 없음(서버 호출 없음)\u003c/span>\u003cspan class=\"nav-to stay\">—\u003c/span>\u003c/div>\n        \u003c/div>\n      \u003c/div>\n    \u003c/div>\n\n    \u003cdiv class=\"itm\" data-idx=\"11\">\n      \u003cdiv class=\"num\">12\u003c/div>\n      \u003cdiv>\n        \u003cdiv class=\"itm-title\">KYC 예외 배너 (조건부 노출)\u003c/div>\n        \u003cdiv class=\"itm-desc\">\u003cstrong>노출\u003c/strong> 기관 KYC 상태가 '활성'이 아닐 때만 보인다. EXC-01과 같은 규격·문구를 쓴다.\u003cbr>\u003cstrong>동작\u003c/strong> 노출 중에는 [게시]만 비활성으로 두고 자산·수량 입력과 조회는 그대로 둔다. 내부 사유와 심사 내용은 노출하지 않는다.\u003cbr>\u003cstrong>문구\u003c/strong> 고정. \u003cspan class=\"chk\">[확인필요: 안내 이메일 주소]\u003c/span>\u003cbr>\u003cspan class=\"basis\">근거 G-3 · V2 KYC 담보(4요소②)\u003c/span>\u003c/div>\n        \u003cdiv class=\"itm-nav\">\u003cspan class=\"nav-tag\">화면 이동 · 인터랙션\u003c/span>\n          \u003cdiv class=\"nav-row\">\u003cspan class=\"nav-el\">배너\u003c/span>\u003cspan class=\"nav-act\">클릭\u003c/span>\u003cspan class=\"nav-to stay\">무반응(표시 전용) · 상태가 '활성'으로 바뀌면 다음 진입 시 배너 제거·버튼 활성\u003c/span>\u003c/div>\n        \u003c/div>\n      \u003c/div>\n    \u003c/div>\n  \u003c/div>\n\n\u003c/div>\n\n\u003csection class=\"footer-note\" style=\"padding-bottom:0;\">\n  \u003cdiv class=\"note-card\">\n    \u003cdiv class=\"note-title\">상세내용\u003c/div>\n    \u003cdiv class=\"detail-grid\" id=\"detailCol\">\n      \u003cdiv class=\"dtl\" data-idx=\"0\">\n        \u003cdiv class=\"detail-label\">\u003cspan class=\"dtl-num\">1\u003c/span>자산 선택 순서 강제 이유 (EXC-01과 동일)\u003c/div>\n      \u003cdiv class=\"dtl-body\">\u003cspan class=\"box\">· 동일 자산 쌍을 검증·오류 문구로 막는 대신 \u003cstrong>목록에서 제외\u003c/strong> — 오류 상태 1종 감소(2026-09-02 결정)\u003cbr>· 보내는 자산이 수량 단위·자릿수·한도 환산·잔고 조회의 기준이므로 먼저 확정\u003cbr>· 종전 \"수량 필드 안의 통화 선택(▾) · 기본값 USDT→USDC\" 폐기 — EXC-01과 같은 별도 자산 선택 행으로 통일\u003c/span>\u003c/div>\n      \u003c/div>\n      \u003cdiv class=\"dtl\" data-idx=\"2\">\n        \u003cdiv class=\"detail-label\">\u003cspan class=\"dtl-num\">3\u003c/span>한도 · 처분 가능분 판정 (게시자 거래 안전성 검증)\u003c/div>\n      \u003cdiv class=\"dtl-body\">\u003cspan class=\"box\">· 유효 상한 = min(1회 한도 {정책값 1,500,000원 상당}의 보내는 자산 환산 수량, 처분 가능분) — 두 조건 모두 충족해야 게시 가능 · 환산 시세·시점 = ADM-03 · 요청 시점(입력 중 실시간, 클릭 시 서버 재검증)\u003cbr>· 한도 예: 1,500,000원 ÷ 4,298,400원(= 3,184.00 USDC × 1,350원 가정) = 0.3489 ETH(절사) · 스테이블도 KRW 시세로 환산(USD 1:1 아님) → 1,500,000원 ÷ 1,350원 ≈ 1,111.11 USDC/USDT\u003cbr>· 판정 시점: 입력 중(활성 조건) + [게시] 클릭 시 재검증(실패 시 인라인 경고 재노출) — 게시 후 잔고 변동은 BRK-04 수락 시점 재검증으로 보완(BRK-04 상세)\u003cbr>· \u003cspan class=\"chk\">[확인필요]\u003c/span> 마목 대량 거래(블록딜)와의 정합 — 분할 게시 여부 · 일간·월간 누적 한도\u003c/span>\u003c/div>\n      \u003c/div>\n      \u003cdiv class=\"dtl\" data-idx=\"3\">\n        \u003cdiv class=\"detail-label\">\u003cspan class=\"dtl-num\">4\u003c/span>처분 가능분 정의\u003c/div>\n      \u003cdiv class=\"dtl-body\">\u003cspan class=\"box\">· 처분 가능 = 커스터디 실보유 잔고(기존 시스템 대조) − 기게시 중복분(같은 자산으로 게재중·협의중인 내 게시의 보내는 수량 합계)\u003cbr>· 확정 후 이전 대기(BRK-05 진행 중) 수량 차감 여부 \u003cspan class=\"chk\">[확인필요]\u003c/span> — 차감하지 않으면 이중 처분 소지\u003cbr>· 별도 지갑 화면 신규 개발 없음 — 잔고 출처는 DASH-01 지갑 잔고와 동일\u003c/span>\u003c/div>\n      \u003c/div>\n      \u003cdiv class=\"dtl\" data-idx=\"5\">\n        \u003cdiv class=\"detail-label\">\u003cspan class=\"dtl-num\">6\u003c/span>비율 · 편차 계산 예\u003c/div>\n      \u003cdiv class=\"dtl-body\">\u003cspan class=\"box\">· 스테이블 페어: 800 USDT → 798.40 USDC ⇒ 798.40 ÷ 800 = 0.9980 USDC/USDT · 현 시세 1.0000 ⇒ 편차 (0.9980 − 1.0000) ÷ 1.0000 = -0.20%\u003cbr>· ETH 페어: 0.3 ETH → 955.20 USDC ⇒ 955.20 ÷ 0.3 = 3,184.00 USDC/ETH · 955.20 USDC → 0.3 ETH도 같은 3,184.00 USDC/ETH(방향 무관)\u003cbr>· 경고 예: 800 USDT → 776.00 USDC ⇒ 0.9700 ⇒ -3.00% → 허용 ±2.0% 초과 → 게시 불가\u003cbr>· 비율 자릿수 초과분은 절사(notation 산정값 규칙 준용) \u003cspan class=\"chk\">[확인필요: 비율 반올림 규칙 명시 — notation]\u003c/span>\u003c/span>\u003c/div>\n      \u003c/div>\n      \u003cdiv class=\"dtl\" data-idx=\"6\">\n        \u003cdiv class=\"detail-label\">\u003cspan class=\"dtl-num\">7\u003c/span>편차 경고 로직 · 목적\u003c/div>\n      \u003cdiv class=\"dtl-body\">\u003cspan class=\"box\">· 비교 대상 = 두 수량에서 도출한 환산 비율 vs 현 시세(외부지표 · 조회 시점) · 임계 ±{정책값 2.0%}(ADM-03 · 단일 출처)\u003cbr>· 초과 → 경고 노출 + [게시] 비활성 — 클릭 후 거부가 아닌 사전 차단(공통 UI 규격 비활성 사유 = 인라인 경고)\u003cbr>· 목적: 자전·이상거래 오인 방지 — ADM-02 이상거래 워닝 룰과 동일 기준 · 가격은 당사자 합의, 외부지표는 판정 기준일 뿐\u003c/span>\u003c/div>\n      \u003c/div>\n      \u003cdiv class=\"dtl\" data-idx=\"8\">\n        \u003cdiv class=\"detail-label\">\u003cspan class=\"dtl-num\">9\u003c/span>시세변동 자동중지(price guard) 동작\u003c/div>\n      \u003cdiv class=\"dtl-body\">\u003cspan class=\"box\">· 기준 = 게시 시점 외부지표 스냅숏(소스·조합은 ADM-03 정책값 · 소스명 고객 화면 미노출)\u003cbr>· 변동 ±{정책값 2.0%} 초과 → 상태 \u003cstrong>중지\u003c/strong> · 게시판 즉시 제외 · 대기 중 신청 전부 자동 종결(자산이동·수수료 없음) · 게시자·신청자 이메일\u003cbr>· 협의중(신청 접수) 상태에서 중지되면 BRK-04 [수락] 비활성 · 재개는 재게시만(중지 게시 되살리기 없음) — 게시자가 직접 내리는 회수(BRK-06)와 별도 경로\u003cbr>· \u003cstrong>가격은 당사자 합의 — 외부지표는 가격 결정이 아닌 중지 판단에만 사용\u003c/strong>\u003c/span>\u003c/div>\n      \u003c/div>\n      \u003cdiv class=\"dtl\" data-idx=\"9\">\n        \u003cdiv class=\"detail-label\">\u003cspan class=\"dtl-num\">10\u003c/span>게시 이후 상태 · 게시자 동선\u003c/div>\n      \u003cdiv class=\"dtl-body\">\u003cspan class=\"box\">· 게재중(BRK-06 · [게시 내리기] 가능) → 협의중(신청 1건 · 이메일 ① · BRK-06 신청 행 → BRK-04) → 확정(수락 · BRK-05) → 완료 / 종결: 회수 · 완료(유효기간 만료) · 중지\u003cbr>· 게시 = 구속력 없음 → 확인 다이얼로그 없음 · 구속력 발생 지점은 BRK-04 [수락](확인 다이얼로그 있음)\u003cbr>· 게시자 중개 수수료 = 보내는 800 USDT × 1% = 8.00 USDT — BRK-04 수락 전 고시(4요소④) · 이 화면에는 수수료 표시 없음 \u003cspan class=\"chk\">[확인필요: 게시 시점 수수료 예고 표시 여부]\u003c/span>\u003c/span>\u003c/div>\n      \u003c/div>\n    \u003c/div>\n  \u003c/div>\n\u003c/section>\n\n\u003csection class=\"footer-note\">\n  \u003cdiv class=\"note-card\">\n    \u003cdiv class=\"note-title\">비고\u003c/div>\n    \u003cdiv class=\"note-body\">\n      · 내 RFQ를 게시판에 올리는 화면.\u003cbr>\n      · \u003cstrong>[방어 핵심]\u003c/strong> ① 보유·처분권 게이트(거래 안전성 검증)로 허위 게시 차단 ② 편차 경고로 현 시세 대비 과도한 수량 쌍 차단 ③ 시세변동 자동 중지 — 외부지표는 가격 결정이 아닌 중지 판단에만 사용.\u003cbr>\n      · 2026-09-02 설명 형식 개정 적용(핀 = 조작 요소 단위) — 드롭다운 2·입력 2·버튼 2·표시 4·조건부 2(편차 경고·KYC 배너) 12핀 · 자산 선택 UX EXC-01과 통일 · 편차 경고 문구 단일화 · 예시 800 USDT ↔ 798.40 USDC.\u003cbr>\n      · \u003cspan class=\"chk\">[확인필요]\u003c/span> ETH 페어 별도 임계 · 게시자 유효기간 선택 허용 여부 · 이전 대기분 차감 · 비율 반올림 규칙 · 게시 시점 수수료 예고 · KYC 배너 문의 주소.\u003cbr>\n      · 다음: (게시자) 내 게시 상세·회수 (BRK-06) / (상대측) 신청하기 (BRK-03) → (게시자) 받은 신청·수락 (BRK-04)\n    \u003c/div>\n  \u003c/div>\n\u003c/section>\n\n\u003cscript src=\"screen.js\">\u003c/script>\n\u003c/body>\n\u003c/html>\n", "brk-06.html": "\u003c!DOCTYPE html>\n\u003chtml lang=\"ko\">\n\u003chead>\n\u003cmeta charset=\"UTF-8\">\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n\u003ctitle>화면기획 — 내 게시 상세·회수\u003c/title>\n\u003clink rel=\"stylesheet\" href=\"screen.css\">\n\u003c/head>\n\u003cbody>\n\n\u003cheader class=\"header\">\n  \u003cdiv class=\"crumb\">\u003cspan>마목 중개\u003c/span>\u003cspan class=\"s\">›\u003c/span>\u003cspan>교환게시판\u003c/span>\u003cspan class=\"s\">›\u003c/span>\u003cspan>내 게시\u003c/span>\u003c/div>\n  \u003ch1 class=\"title\">내 게시 상세·회수\u003c/h1>\n  \u003cspan class=\"sid\">BRK-06\u003c/span>\n  \u003cspan class=\"defense\">게시 = 구속력 없는 의향 · 회수는 게시자 능동 행위\u003c/span>\n\u003c/header>\n\n\u003cdiv class=\"main\">\n  \u003cdiv class=\"screen-panel\">\n    \u003cdiv style=\"position:relative;display:flex;\">\n      \u003cdiv class=\"labels\" id=\"labels\">\n        \u003cdiv class=\"lbl\">\u003cspan class=\"lbl-text\">전역\u003cbr>상단\u003c/span>\u003c/div>\n        \u003cdiv class=\"lbl\">\u003cspan class=\"lbl-text\">내 게시 내역\u003c/span>\u003c/div>\n        \u003cdiv class=\"lbl\">\u003cspan class=\"lbl-text\">받은 신청\u003c/span>\u003c/div>\n        \u003cdiv class=\"lbl\">\u003cspan class=\"lbl-text\">게시 관리\u003c/span>\u003c/div>\n        \u003cdiv class=\"lbl\">\u003cspan class=\"lbl-text\">비참여 고지\u003c/span>\u003c/div>\n      \u003c/div>\n      \u003csvg id=\"bracketSvg\" width=\"24\" style=\"flex-shrink:0;overflow:visible;\">\u003c/svg>\n    \u003c/div>\n\n    \u003cdiv class=\"frame\" id=\"frame\">\n      \u003c!-- 전역: 콘솔 상단 + GNB -->\n      \u003cdiv class=\"zone\" data-idx=\"\">\n        \u003cdiv class=\"zone-highlight\">\u003c/div>\n        \u003cdiv class=\"c-top\" style=\"border-radius:8px 8px 0 0;\">\n          \u003cspan class=\"brand\" style=\"cursor:pointer;\">DSRV Desk\u003c/span>\n          \u003cspan class=\"meta\">\u003cspan class=\"c-badge\">B사 (게시자)\u003c/span>\u003c/span>\n        \u003c/div>\n        \u003cdiv class=\"c-adminbar\" style=\"margin:0;border-radius:0 0 8px 8px;\">\n          \u003cspan class=\"m\">대시보드\u003c/span>\n          \u003cspan class=\"m\">교환하기\u003c/span>\n          \u003cspan class=\"m on\" style=\"background:#dbeafe;color:#1d4ed8;\">교환게시판\u003c/span>\n        \u003c/div>\n      \u003c/div>\n\n      \u003c!-- 내 게시 내역 -->\n      \u003cdiv class=\"zone\" data-idx=\"0,1,2\">\n        \u003cdiv class=\"zone-highlight\">\u003c/div>\n        \u003cdiv class=\"zone-title\" style=\"margin-bottom:4px;\">내 게시 — 교환거래 요청 내역\u003c/div>\n        \u003cdiv class=\"item-area\" data-highlight=\"0\" style=\"position:relative;padding:4px;border-radius:8px;\">\n          \u003cdiv class=\"pin\" data-idx=\"0\" style=\"top:-6px;right:-6px;\">1\u003c/div>\n          \u003cdiv class=\"kv\">\u003cspan class=\"k\">게시번호\u003c/span>\u003cspan class=\"v\">BRK-20260902-0001\u003c/span>\u003c/div>\n          \u003cdiv class=\"kv\">\u003cspan class=\"k\">교환쌍 · 방향\u003c/span>\u003cspan class=\"v\">USDT → USDC\u003c/span>\u003c/div>\n          \u003cdiv class=\"kv\">\u003cspan class=\"k\">보내는 수량\u003c/span>\u003cspan class=\"v\">800 USDT \u003cspan style=\"color:#94a3b8;\">(≈ 1,080,000원 상당)\u003c/span>\u003c/span>\u003c/div>\n          \u003cdiv class=\"kv\">\u003cspan class=\"k\">받는 수량\u003c/span>\u003cspan class=\"v\">798.40 USDC\u003c/span>\u003c/div>\n          \u003cdiv class=\"kv\">\u003cspan class=\"k\">비율\u003c/span>\u003cspan class=\"v\">0.9980 USDC/USDT\u003c/span>\u003c/div>\n          \u003cdiv class=\"kv\">\u003cspan class=\"k\">게시 일시\u003c/span>\u003cspan class=\"v\">2026-09-02 10:00\u003c/span>\u003c/div>\n          \u003cdiv class=\"kv\">\u003cspan class=\"k\">게시 유효기한\u003c/span>\u003cspan class=\"v\">2026-10-02 10:00까지 (30일)\u003c/span>\u003c/div>\n        \u003c/div>\n        \u003cdiv class=\"item-area\" data-highlight=\"1\" style=\"position:relative;padding:4px;border-radius:8px;\">\n          \u003cdiv class=\"pin\" data-idx=\"1\" style=\"top:-6px;right:-6px;\">2\u003c/div>\n          \u003cdiv class=\"kv\">\u003cspan class=\"k\">상태\u003c/span>\u003cspan class=\"v\">\u003cspan class=\"chip info\">게재중\u003c/span> &nbsp;받은 신청 0건\u003c/span>\u003c/div>\n        \u003c/div>\n        \u003cdiv class=\"item-area\" data-highlight=\"2\" style=\"position:relative;padding:4px;border-radius:8px;\">\n          \u003cdiv class=\"pin\" data-idx=\"2\" style=\"top:-6px;right:-6px;\">3\u003c/div>\n          \u003cdiv style=\"font-size:9px;color:#94a3b8;padding:0 8px 2px;\">▼ 상태 '확정'·'완료(거래 완료)'에서만 노출 (목업 상태 '게재중'에서는 없음)\u003c/div>\n          \u003cdiv style=\"padding:0 8px 4px;font-size:11px;\">\u003cspan style=\"color:#1d4ed8;font-weight:700;text-decoration:underline;cursor:pointer;\">이전 진행 보기 →\u003c/span>\u003c/div>\n        \u003c/div>\n      \u003c/div>\n\n      \u003c!-- 받은 신청 -->\n      \u003cdiv class=\"zone\" data-idx=\"3,4,5\">\n        \u003cdiv class=\"zone-highlight\">\u003c/div>\n        \u003cdiv class=\"zone-title\" style=\"margin-bottom:4px;\">받은 신청\u003c/div>\n        \u003cdiv class=\"item-area\" data-highlight=\"3\" style=\"position:relative;padding:4px;border-radius:8px;\">\n          \u003cdiv class=\"pin\" data-idx=\"3\" style=\"top:-6px;right:-6px;\">4\u003c/div>\n          \u003cdiv style=\"text-align:center;padding:14px 8px;border:1px dashed #d7dbe0;border-radius:8px;font-size:11px;color:#94a3b8;\">받은 신청이 없습니다 — 신청이 접수되면 등록 이메일로 알려드립니다\u003c/div>\n        \u003c/div>\n        \u003cdiv class=\"item-area\" data-highlight=\"4\" style=\"position:relative;padding:4px;border-radius:8px;margin-top:4px;\">\n          \u003cdiv class=\"pin\" data-idx=\"4\" style=\"top:-6px;right:-6px;\">5\u003c/div>\n          \u003cdiv style=\"font-size:9px;color:#94a3b8;padding:0 4px 2px;\">▼ 상태 '협의중'(신청 1건) 이후에만 노출 — 위 빈 상태 박스를 대체\u003c/div>\n          \u003cdiv style=\"border:1px solid #e2e8f0;border-radius:8px;padding:6px 8px;\">\n            \u003cdiv class=\"kv\">\u003cspan class=\"k\">신청자\u003c/span>\u003cspan class=\"v\">A*** (KYC 완료 · 거래 안전성 검증 ✓)\u003c/span>\u003c/div>\n            \u003cdiv class=\"kv\">\u003cspan class=\"k\">신청 시점\u003c/span>\u003cspan class=\"v\">2026-09-02 11:30\u003c/span>\u003c/div>\n            \u003cdiv class=\"kv\">\u003cspan class=\"k\">신청 유효기한\u003c/span>\u003cspan class=\"v\">2026-09-04 11:30까지 (영업일 2일)\u003c/span>\u003c/div>\n            \u003cdiv class=\"kv\">\u003cspan class=\"k\">신청 상태\u003c/span>\u003cspan class=\"v\">수락 대기\u003c/span>\u003c/div>\n          \u003c/div>\n        \u003c/div>\n        \u003cdiv class=\"item-area\" data-highlight=\"5\" style=\"position:relative;padding:4px;border-radius:8px;\">\n          \u003cdiv class=\"pin\" data-idx=\"5\" style=\"top:-6px;right:-6px;\">6\u003c/div>\n          \u003cdiv class=\"btn ghost\" style=\"color:#1d4ed8;border-color:#93c5fd;\">신청 보기\u003c/div>\n        \u003c/div>\n      \u003c/div>\n\n      \u003c!-- 게시 관리 -->\n      \u003cdiv class=\"zone\" data-idx=\"6\">\n        \u003cdiv class=\"zone-highlight\">\u003c/div>\n        \u003cdiv class=\"item-area\" data-highlight=\"6\" style=\"position:relative;padding:4px;border-radius:8px;\">\n          \u003cdiv class=\"pin\" data-idx=\"6\" style=\"top:-8px;right:-6px;\">7\u003c/div>\n          \u003cdiv class=\"btn danger\">게시 내리기\u003c/div>\n          \u003cdiv style=\"font-size:10px;color:#64748b;margin-top:6px;\">게시를 내리면 게시판에서 즉시 제외되며 \u003cstrong>되돌릴 수 없습니다\u003c/strong>. 자산 이동·수수료는 발생하지 않습니다. 다시 게시하려면 거래의향 등록에서 새로 게시해 주세요\u003c/div>\n        \u003c/div>\n      \u003c/div>\n\n      \u003c!-- 비참여 고지 -->\n      \u003cdiv class=\"zone\" data-idx=\"7\">\n        \u003cdiv class=\"zone-highlight\">\u003c/div>\n        \u003cdiv class=\"item-area\" data-highlight=\"7\" style=\"position:relative;padding:4px;border-radius:8px;\">\n          \u003cdiv class=\"pin\" data-idx=\"7\" style=\"top:-6px;right:-6px;\">8\u003c/div>\n          \u003cdiv class=\"note-inline reg\">DSRV는 가격 협의에 참여하지 않으며 게시·신청·수락 기록만 보존합니다. 게시는 구속력이 없는 거래의향 표시이며, 신청 수락 시 즉시 확정됩니다.\u003c/div>\n        \u003c/div>\n      \u003c/div>\n    \u003c/div>\n  \u003c/div>\n\n  \u003csvg id=\"connSvg\" style=\"position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:10;overflow:visible;\">\u003c/svg>\n\n  \u003cdiv class=\"items\" id=\"items\">\n    \u003cdiv class=\"nav-global\">\n      \u003cdiv class=\"nav-global-title\">진입 · 전역 이동\u003c/div>\n      \u003cdiv class=\"nav-note\">· \u003cstrong>전역 이동\u003c/strong> 상단 메뉴(GNB) · 기관 배지 · 뒤로가기의 동작은 대시보드(DASH-01)의 표와 같다. 다른 점 = 현재 탭 '교환게시판'을 다시 클릭하면 교환 게시판(BRK-01) 목록으로 간다. 조회 화면이라 버릴 입력값이 없다.\u003cbr>\n      · \u003cstrong>진입\u003c/strong> 교환 게시판(BRK-01)의 내 게시 행 클릭 / 거래의향 등록(BRK-02) 게시 완료 직후 / 받은 신청·수락(BRK-04) [거절] 후 / 대시보드(DASH-01) 거래 목록의 마목 내 게시 행 클릭 / 신청 접수 메일을 받은 뒤 콘솔에 직접 접속(메일 본문에 링크 없음). 진입 시 서버에서 최신 상태를 조회하고 머무는 동안 자동 갱신은 없다.\u003c/div>\n    \u003c/div>\n\n    \u003cdiv class=\"itm\" data-idx=\"0\">\n      \u003cdiv class=\"num\">1\u003c/div>\n      \u003cdiv>\n        \u003cdiv class=\"itm-title\">내 게시 내역 — 공통 포맷 (표시 전용)\u003c/div>\n        \u003cdiv class=\"itm-desc\">\u003cstrong>구성\u003c/strong> '교환거래 요청 내역' 공통 폼 — 게시번호(BRK-YYYYMMDD-NNNN) · 교환쌍·방향 · 보내는 수량 · 받는 수량 · 비율 · 게시 일시 · 게시 유효기한.\u003cbr>\u003cstrong>기준\u003c/strong> 방향·수량은 게시자 기준으로 적고 보내는 수량 우측에 KRW 환산 「≈ {금액}원 상당」을 붙인다(ADM-03 시세 · 게시 시점 값 고정).\u003cbr>\u003cstrong>자릿수\u003c/strong> ETH 4 / USDC·USDT 2, 뒤 0 생략. 비율은 스테이블 페어 4자리와 ETH 페어 {스테이블}/ETH 2자리.\u003cbr>\u003cstrong>유효기한\u003c/strong> 게시 일시 + {정책값 30일}(ADM-03)을 「YYYY-MM-DD HH:MM까지 (N일)」로 쓴다.\u003cbr>\u003cstrong>상태\u003c/strong> 로딩은 \"불러오는 중…\"이고 3초 초과 시 상단 배너와 값 \"—\"로 넘기며 [게시 내리기]를 비활성으로 둔다.\u003cbr>\u003cspan class=\"basis\">근거 F-1b · 공통 포맷 · notation 채번·자릿수\u003c/span>\u003c/div>\n      \u003c/div>\n    \u003c/div>\n\n    \u003cdiv class=\"itm\" data-idx=\"1\">\n      \u003cdiv class=\"num\">2\u003c/div>\n      \u003cdiv>\n        \u003cdiv class=\"itm-title\">상태 행 — 게시 상태 칩 + 받은 신청 건수 (표시 전용)\u003c/div>\n        \u003cdiv class=\"itm-desc\">\u003cstrong>구성\u003c/strong> 「{상태 칩} · 받은 신청 {0|1}건」. 건수는 0 또는 1만 나온다(게시당 동시 신청 1건). 칩 색은 대기 파랑 · 진행 노랑 · 완료 초록 · 종결 회색.\u003cbr>\u003cstrong>① 게재중\u003c/strong> 신청 0건 · 게시판 노출 · 항목 4 빈 상태 · [게시 내리기] 활성.\u003cbr>\u003cstrong>② 협의중\u003c/strong> 신청 1건 접수 · 게시판에서 추가 신청 차단 · 항목 5 신청 카드와 항목 6 [신청 보기] 노출 · [게시 내리기] 활성(다이얼로그에 대기 신청 자동 종결 문장 추가). 거절이나 신청 유효기한 만료 시 게재중으로 되돌린다.\u003cbr>\u003cstrong>③ 확정\u003c/strong> 신청 카드 상호 마스킹을 해제하고 항목 3 [이전 진행 보기 →]를 노출한다. [게시 내리기]는 비노출로 두고 \"확정된 거래는 회수할 수 없습니다\" 안내로 대체한다. 이후 중지는 DSRV 처리함 T2 이전 중지로만 발생한다.\u003cbr>\u003cstrong>④ 완료\u003c/strong> (a) 거래 완료는 항목 3 링크를 유지하고 (b) 유효기간 만료는 「완료 · 유효기간 만료」를 부기하며 링크를 두지 않고 협의중이던 신청도 함께 종결한다. \u003cspan class=\"chk\">[확인필요: 유효기간 만료를 '만료' 별개 라벨로 분리할지 — 고객 상태 enum]\u003c/span>\u003cbr>\u003cstrong>⑤ 회수\u003c/strong> 「회수 · {회수 일시}」로 표시하고 버튼을 비노출로 두며 재게시 안내를 띄운다.\u003cbr>\u003cstrong>⑥ 중지\u003c/strong> price guard 자동중지(게시 시점 대비 시세 ±{정책값 2.0%} 이탈). 대기 신청을 자동 종결하고 양측에 이메일을 보내며 버튼을 비노출로 둔다. 자산 이동·수수료가 없다는 안내와 재게시 안내를 띄우고 시세 소스명은 노출하지 않는다.\u003cbr>\u003cstrong>종결 처리\u003c/strong> ⑤⑥과 ④(b)는 게시판에서 빼고 대시보드 거래 내역에만 남긴다.\u003cbr>\u003cspan class=\"basis\">근거 09 §0 마목 게시 상태 개정 · 공통 UI 규격 상태 칩 · states.html\u003c/span>\u003c/div>\n      \u003c/div>\n    \u003c/div>\n\n    \u003cdiv class=\"itm\" data-idx=\"2\">\n      \u003cdiv class=\"num\">3\u003c/div>\n      \u003cdiv>\n        \u003cdiv class=\"itm-title\">[이전 진행 보기 →] 링크 (조건부 노출)\u003c/div>\n        \u003cdiv class=\"itm-desc\">\u003cstrong>노출\u003c/strong> 상태 ③ 확정과 ④(a) 완료에서만 보인다. 다른 상태에서는 비활성 링크를 두지 않고 아예 숨긴다.\u003cbr>\u003cstrong>클릭 가능\u003c/strong> 노출되면 항상 활성이다.\u003cbr>\u003cstrong>확인 사항\u003c/strong> 없다. 확인 다이얼로그를 띄우지 않는다.\u003cbr>\u003cstrong>액션\u003c/strong> BRK-05로 이동한다. 라벨은 완료 상태에서도 \"이전 진행 보기 →\"로 고정한다(도착 화면이 완료 표시를 담당).\u003cbr>\u003cspan class=\"basis\">근거 공통 UI 규격 행 클릭\u003c/span>\u003c/div>\n        \u003cdiv class=\"itm-nav\">\u003cspan class=\"nav-tag\">화면 이동 · 인터랙션\u003c/span>\n          \u003cdiv class=\"nav-row\">\u003cspan class=\"nav-el\">[이전 진행 보기 →]\u003c/span>\u003cspan class=\"nav-act\">클릭 · 확인 없음\u003c/span>\u003cspan class=\"nav-to\">\u003cstrong>이전·완료(BRK-05)\u003c/strong> — 같은 게시번호의 이전 상태(게시자 관점 수수료 8.00 USDT)\u003c/span>\u003c/div>\n        \u003c/div>\n      \u003c/div>\n    \u003c/div>\n\n    \u003cdiv class=\"itm\" data-idx=\"3\">\n      \u003cdiv class=\"num\">4\u003c/div>\n      \u003cdiv>\n        \u003cdiv class=\"itm-title\">받은 신청 — 빈 상태 (표시 전용)\u003c/div>\n        \u003cdiv class=\"itm-desc\">\u003cstrong>노출\u003c/strong> 상태 ① 게재중(신청 0건)에서만 보인다. 신청이 접수되면 다음 진입부터 항목 5 카드로 대체하고, 거절·만료로 게재중에 복귀하면 다시 이 빈 상태를 쓴다.\u003cbr>\u003cstrong>문구\u003c/strong> 점선 박스에 \"받은 신청이 없습니다\"와 다음 행동 1줄(\"신청이 접수되면 등록 이메일로 알려드립니다\")을 쓰고 아이콘은 두지 않는다.\u003cbr>\u003cstrong>목록 규격\u003c/strong> 동시 신청이 1건이라 목록이 아니라 카드 1장이므로 정렬·[더 보기]·100행 규격은 적용하지 않는다.\u003cbr>\u003cspan class=\"basis\">근거 공통 UI 규격 빈 상태 · 09 §0 동시 신청 1건\u003c/span>\u003c/div>\n      \u003c/div>\n    \u003c/div>\n\n    \u003cdiv class=\"itm\" data-idx=\"4\">\n      \u003cdiv class=\"num\">5\u003c/div>\n      \u003cdiv>\n        \u003cdiv class=\"itm-title\">받은 신청 카드 — 신청 1건 (조건부 노출 · 표시 전용)\u003c/div>\n        \u003cdiv class=\"itm-desc\">\u003cstrong>노출\u003c/strong> 상태 ② 협의중 이후(③ 확정 · ④ 완료 포함)에 보인다. 카드 클릭은 동작시키지 않고 이동은 항목 6 버튼으로만 한다.\u003cbr>\u003cstrong>구성\u003c/strong> 신청자 · 신청 시점 · 신청 유효기한 · 신청 상태 4행.\u003cbr>\u003cstrong>마스킹\u003c/strong> 신청자 상호는 확정 전까지 첫 글자만 노출하고(A***) \"KYC 완료 · 거래 안전성 검증 ✓\"를 붙인다. 확정 시 해제한다.\u003cbr>\u003cstrong>유효기한\u003c/strong> 신청 시점 + 영업일 {정책값 2영업일}(ADM-03)을 「YYYY-MM-DD HH:MM까지 (영업일 N일)」로 쓴다.\u003cbr>\u003cstrong>신청 상태\u003c/strong> 수락 대기 / 확정 / 완료 / 만료(게시는 게재중 복귀 · 카드는 다음 진입 시 제거) / 종결(회수·중지·게시 만료 — 카드 회색 처리).\u003cbr>\u003cspan class=\"basis\">근거 F-1b · V2(통신중개 아님)\u003c/span>\u003c/div>\n      \u003c/div>\n    \u003c/div>\n\n    \u003cdiv class=\"itm\" data-idx=\"5\">\n      \u003cdiv class=\"num\">6\u003c/div>\n      \u003cdiv>\n        \u003cdiv class=\"itm-title\">[신청 보기] 버튼 (조건부 노출)\u003c/div>\n        \u003cdiv class=\"itm-desc\">\u003cstrong>노출\u003c/strong> 항목 5와 같은 조건(상태 ② 이후)에서 보인다.\u003cbr>\u003cstrong>클릭 가능\u003c/strong> 노출되면 항상 활성이다.\u003cbr>\u003cstrong>확인 사항\u003c/strong> 없다. 확인 다이얼로그를 띄우지 않는다.\u003cbr>\u003cstrong>액션\u003c/strong> BRK-04로 이동한다. 수락·거절은 이 화면에 두지 않고 행위 화면으로 분리해 감사 추적을 남긴다.\u003cbr>\u003cspan class=\"basis\">근거 공통 UI 규격 확인 다이얼로그(구속력 행위 분리)\u003c/span>\u003c/div>\n        \u003cdiv class=\"itm-nav\">\u003cspan class=\"nav-tag\">화면 이동 · 인터랙션\u003c/span>\n          \u003cdiv class=\"nav-row\">\u003cspan class=\"nav-el\">[신청 보기] — 활성 조건\u003c/span>\u003cspan class=\"nav-act\">다음이 모두 아님: ①신청 상태가 '수락 대기'가 아님(확정·완료·만료·종결) ②신청 정보 로딩 중·조회 실패\u003c/span>\u003cspan class=\"nav-to stay\">하나라도 해당 → 회색 비활성(공통 UI 규격) · ①은 카드의 신청 상태 값으로 사유 노출(툴팁 없음)\u003c/span>\u003c/div>\n          \u003cdiv class=\"nav-row\">\u003cspan class=\"nav-el\">[신청 보기] — 클릭(활성)\u003c/span>\u003cspan class=\"nav-act\">클릭 · 확인 없음 · 로딩 없음(화면 이동)\u003c/span>\u003cspan class=\"nav-to\">\u003cstrong>받은 신청·수락(BRK-04)\u003c/strong> — 이 신청 1건의 수락·거절\u003c/span>\u003c/div>\n          \u003cdiv class=\"nav-row\">\u003cspan class=\"nav-el\">[신청 보기] — 실패\u003c/span>\u003cspan class=\"nav-act\">이동 시점 재조회에서 신청 상태가 바뀐 경우(신청 만료 · price guard 중지)\u003c/span>\u003cspan class=\"nav-to stay\">화면 잔류 · 상태 행·카드 갱신 + 상단 배너 \"신청 상태가 변경되었습니다. 최신 상태를 확인해 주세요\" · 버튼 비활성 전환\u003c/span>\u003c/div>\n        \u003c/div>\n      \u003c/div>\n    \u003c/div>\n\n    \u003cdiv class=\"itm\" data-idx=\"6\">\n      \u003cdiv class=\"num\">7\u003c/div>\n      \u003cdiv>\n        \u003cdiv class=\"itm-title\">[게시 내리기] 버튼 — 회수(게시자 능동 행위)\u003c/div>\n        \u003cdiv class=\"itm-desc\">\u003cstrong>노출\u003c/strong> 상태 ① 게재중과 ② 협의중에서만 보인다. ③ 확정 이후와 ④⑤⑥ 종결에서는 비활성이 아니라 비노출로 두고 항목 2 상태별 안내로 대체한다.\u003cbr>\u003cstrong>클릭 가능\u003c/strong> 노출되면 항상 활성이다. 게시자(가입자) 단독 실행이고 승인자 지정은 두지 않는다.\u003cbr>\u003cstrong>확인 사항\u003c/strong> 확인 다이얼로그를 띄운다(비가역). 협의중이면 대기 신청이 자동 종결된다는 문장을 다이얼로그에 넣는다. 클릭 시 서버가 게시 상태를 다시 판정한다.\u003cbr>\u003cstrong>액션\u003c/strong> 게시를 회수해 상태를 '회수'로 바꾸고 게시판에서 뺀다. 자산 이동과 수수료는 발생하지 않는다. 재게시는 BRK-02에서 새 게시번호로 한다. 버튼 아래에는 결과 고지 1문장을 상시 노출한다.\u003cbr>\u003cspan class=\"basis\">근거 V2 · 공통 UI 규격 확인 다이얼로그\u003c/span>\u003c/div>\n        \u003cdiv class=\"itm-nav\">\u003cspan class=\"nav-tag\">화면 이동 · 인터랙션\u003c/span>\n          \u003cdiv class=\"nav-row\">\u003cspan class=\"nav-el\">[게시 내리기] — 활성 조건\u003c/span>\u003cspan class=\"nav-act\">(노출 상태 ①②에서) 다음이 모두 아님: ①게시 정보 로딩 중·조회 실패(항목 1) ②회수 처리 중(\"처리 중…\")\u003c/span>\u003cspan class=\"nav-to stay\">하나라도 해당 → 회색 비활성(공통 UI 규격) · ①은 상단 오류 배너가 사유\u003c/span>\u003c/div>\n          \u003cdiv class=\"nav-row\">\u003cspan class=\"nav-el\">[게시 내리기] — 클릭(활성)\u003c/span>\u003cspan class=\"nav-act\">클릭 → 다이얼로그: 제목 \"게시 내리기\" / 본문 \"게시를 내리면 게시판에서 즉시 제외되며 되돌릴 수 없습니다. 자산 이동·수수료는 발생하지 않습니다.\" + (상태 ② 협의중일 때만 추가) \"대기 중인 신청 1건은 자동 종결되며 신청자에게 이메일로 통지됩니다.\" / [게시 내리기] [돌아가기] → [게시 내리기] 클릭 → 버튼 라벨 \"처리 중…\"·비활성(중복 클릭 차단) → 상태 '회수'(회수 일시 기록 · AUDIT_LOG 행위자·시각) · 협의중이면 대기 신청 종결 + 이메일 ④\u003c/span>\u003cspan class=\"nav-to\">\u003cstrong>교환 게시판(BRK-01)\u003c/strong> 복귀 — 목록에서 해당 게시 제외 · 복귀 화면 상단 배너 \"게시가 회수되었습니다 — BRK-20260902-0001\" — 닫기 버튼도 자동 닫힘도 없는 고정 배너다(다른 화면 배너와 같다) · [돌아가기] = 변경 없이 닫힘\u003c/span>\u003c/div>\n          \u003cdiv class=\"nav-row\">\u003cspan class=\"nav-el\">[게시 내리기] — 실패\u003c/span>\u003cspan class=\"nav-act\">① 경쟁 상태: 다이얼로그 확인 시점에 이미 종결(price guard 중지 · 유효기간 만료) / ② 시스템 오류\u003c/span>\u003cspan class=\"nav-to stay\">화면 잔류 · ① 상태 행 갱신(중지·완료) + 버튼 비노출 전환 + 상단 배너 \"이미 종결된 게시입니다\" / ② 상단 배너 \"일시적인 오류입니다. 잠시 후 다시 시도해 주세요\" · 버튼 라벨 복귀 · 다이얼로그 열린 사이 신청이 접수된 경우는 실패 아님 — 회수 처리하며 그 신청을 자동 종결(협의중 규칙과 동일)\u003c/span>\u003c/div>\n        \u003c/div>\n      \u003c/div>\n    \u003c/div>\n\n    \u003cdiv class=\"itm\" data-idx=\"7\">\n      \u003cdiv class=\"num\">8\u003c/div>\n      \u003cdiv>\n        \u003cdiv class=\"itm-title\">\"DSRV 비참여·기록만\" 고지 (표시 전용)\u003c/div>\n        \u003cdiv class=\"itm-desc\">\u003cstrong>문구\u003c/strong> 고정이며 상태와 무관하게 상시 노출한다. BRK-03·04·07과 같은 계열 문구를 쓰고 변경은 법무 확인 후에 한다. 게시·회수·신청·수락 기록은 15년 보존한다.\u003cbr>\u003cspan class=\"basis\">근거 V2 · [로펌게이트] 비참여 범위\u003c/span>\u003c/div>\n      \u003c/div>\n    \u003c/div>\n  \u003c/div>\n\n\u003c/div>\n\n\u003csection class=\"footer-note\" style=\"padding-bottom:0;\">\n  \u003cdiv class=\"note-card\">\n    \u003cdiv class=\"note-title\">상세내용\u003c/div>\n    \u003cdiv class=\"detail-grid\" id=\"detailCol\">\n      \u003cdiv class=\"dtl\" data-idx=\"0\">\n        \u003cdiv class=\"detail-label\">\u003cspan class=\"dtl-num\">1\u003c/span>게시자 화면 3종의 역할\u003c/div>\n      \u003cdiv class=\"dtl-body\">\u003cspan class=\"box\">· \u003cstrong>BRK-06 내 게시 상세\u003c/strong>(게시 1건의 허브 — 조회·회수·받은 신청 1건 진입) / BRK-04 받은 신청·수락(그 1건의 수락·거절) / BRK-05 이전·완료(확정 후, 양측 공용)\u003cbr>· BRK-01 내 게시 행 → 항상 BRK-06으로 진입(2026-09-02 변경 — 종전 BRK-04 직행 폐기) → [신청 보기]로 BRK-04 · BRK-04 [거절] → BRK-06 복귀(게재중)\u003cbr>· 행위 화면 분리: 회수는 여기, 수락·거절은 BRK-04 — 한 화면에 성격이 다른 구속력 행위를 섞지 않음(감사 추적)\u003c/span>\u003c/div>\n      \u003c/div>\n      \u003cdiv class=\"dtl\" data-idx=\"1\">\n        \u003cdiv class=\"detail-label\">\u003cspan class=\"dtl-num\">2\u003c/span>게시 상태 전이 · 이 화면의 요소 노출 표\u003c/div>\n      \u003cdiv class=\"dtl-body\">\u003cspan class=\"box\">· 전이: 게재중 →(신청 1건 접수)→ 협의중 →(수락)→ 확정 →(양측 이전 완결)→ 완료 · 협의중 →(거절 · 신청 만료)→ 게재중 · 게재중/협의중 →(회수)→ 회수 · 게재중/협의중 →(price guard)→ 중지 · 게재중/협의중 →(게시 유효기간 만료)→ 완료(유효기간 만료)\u003cbr>· 요소 노출: 게재중 = 빈 상태 · [게시 내리기] / 협의중 = 신청 카드 · [신청 보기] · [게시 내리기] / 확정 = 신청 카드(마스킹 해제) · [이전 진행 보기] / 완료(거래) = 카드 · 링크 / 완료(만료)·회수·중지 = 카드(있었다면 회색) · 버튼·링크 없음 · 상태별 안내 문구\u003cbr>· 시스템이 하는 것은 상태 표시·기한 만료·price guard 중지만 — 매칭·체결·정리 없음(V2)\u003c/span>\u003c/div>\n      \u003c/div>\n      \u003cdiv class=\"dtl\" data-idx=\"4\">\n        \u003cdiv class=\"detail-label\">\u003cspan class=\"dtl-num\">5\u003c/span>동시 신청 1건 규칙 → 목록 규격 소멸\u003c/div>\n      \u003cdiv class=\"dtl-body\">\u003cspan class=\"box\">· 게시당 신청은 동시에 1건만 접수(협의중 = 게시판에서 추가 신청 차단) — 선착순/게시자 선택 이슈·복수 신청 목록·[더 보기]·정렬 규격이 이 화면에서 소멸(2026-09-02 확정)\u003cbr>· 신청이 거절·만료되면 게재중으로 복귀해 다른 신청을 받을 수 있음 — 이전 신청은 카드에서 제거(대시보드 거래 내역에는 잔존)\u003cbr>· 신청 시점의 거래 안전성 검증(보유·처분 가능분 + 건별 한도)은 BRK-03에서 수행, 이 카드에는 결과 ✓만 표기\u003c/span>\u003c/div>\n      \u003c/div>\n      \u003cdiv class=\"dtl\" data-idx=\"6\">\n        \u003cdiv class=\"detail-label\">\u003cspan class=\"dtl-num\">7\u003c/span>회수 상태 전이 · 이메일 ④ 게시 회수 (수신: 대기 중 신청자)\u003c/div>\n      \u003cdiv class=\"dtl-body\">\u003cspan class=\"box\">· 게시 상태: 게재중/협의중 → \u003cstrong>회수\u003c/strong>(종결 — 완료·중지와 구분) · price guard 중지(시스템)와 별개로 게시자가 직접 내리는 경로\u003cbr>· 협의중 회수 시 대기 신청: 상태 '종결(게시 회수)' — 신청자 화면(BRK-07)에 표시, 자산 이동·수수료 없음\u003cbr>· \u003cstrong>[이메일 ④ 게시 회수 (수신: 대기 중 신청자, 있을 때만)]\u003c/strong> 제목 \"[DSRV] 신청한 교환 게시가 회수되었습니다 — BRK-20260902-0001\" · 본문: \"게시자가 게시를 회수하여 회원님의 신청이 종결되었습니다. 자산 이동·수수료는 발생하지 않습니다.\" + 요청 내역(공통 포맷) — 발신전용·링크 미포함 등 공통 원칙은 BRK-03 상세 참조\u003cbr>· 회수 이력(행위자·시각)은 AUDIT_LOG — 게시·회수 반복은 ADM-02 이상거래(T5) 룰 대상 · 반복 임계 \u003cspan class=\"chk\">[확인필요]\u003c/span>\u003cbr>· \u003cstrong>중지(price guard) 통지\u003c/strong>: 양측(게시자 + 대기 신청자) 이메일 — 공통 원칙 4종(①~④)에 미포함 \u003cspan class=\"chk\">[확인필요: 이메일 ⑤ 자동중지 통지 제목·본문 규격]\u003c/span>\u003c/span>\u003c/div>\n      \u003c/div>\n    \u003c/div>\n  \u003c/div>\n\u003c/section>\n\n\u003csection class=\"footer-note\">\n  \u003cdiv class=\"note-card\">\n    \u003cdiv class=\"note-title\">비고\u003c/div>\n    \u003cdiv class=\"note-body\">\n      · 게시 조건 수정 기능 없음 — 수정은 회수 후 재게시(역제안·조건 변경 소지 차단).\u003cbr>\n      · 2026-09-02 신설 — 종전에는 신청이 들어온 뒤의 화면(BRK-04)만 있고 신청 없는 내 게시를 열어 볼 화면과 회수 동선이 없었음.\u003cbr>\n      · \u003cstrong>[방어 핵심]\u003c/strong> 게시·회수 모두 게시자의 능동 행위 — 시스템이 게시를 매칭·체결·정리하지 않음(시장개설 아님). 회수는 구속력 발생 전(확정 전)에만 가능하므로 계약 무산 논점 없음.\u003cbr>\n      · 2026-09-02 설명 형식 개정 적용(핀 = 조작 요소 단위) — 표시 5 · 링크 1 · 버튼 2(각 활성 조건 / 클릭 / 실패 3행) · 상태 변형은 프레임 추가 대신 항목 2 상태 목록 + 상세 2 노출 표.\u003cbr>\n      · \u003cspan class=\"chk\">[확인필요]\u003c/span> 유효기간 만료 라벨('완료' vs '만료') · price guard 중지 이메일 ⑤ 규격 · 회수 반복 임계(이상거래 룰).\u003cbr>\n      · 다음: 신청 1건 도착 시 [신청 보기] → 받은 신청·수락 (BRK-04) / 확정 후 [이전 진행 보기] → 이전·완료 (BRK-05) / 회수 시 교환 게시판 (BRK-01)\n    \u003c/div>\n  \u003c/div>\n\u003c/section>\n\n\u003cscript src=\"screen.js\">\u003c/script>\n\u003c/body>\n\u003c/html>\n", "brk-03.html": "\u003c!DOCTYPE html>\n\u003chtml lang=\"ko\">\n\u003chead>\n\u003cmeta charset=\"UTF-8\">\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n\u003ctitle>화면기획 — 신청하기\u003c/title>\n\u003clink rel=\"stylesheet\" href=\"screen.css\">\n\u003c/head>\n\u003cbody>\n\n\u003cheader class=\"header\">\n  \u003cdiv class=\"crumb\">\u003cspan>마목 중개\u003c/span>\u003cspan class=\"s\">›\u003c/span>\u003cspan>교환게시판\u003c/span>\u003cspan class=\"s\">›\u003c/span>\u003cspan>신청하기\u003c/span>\u003c/div>\n  \u003ch1 class=\"title\">신청하기\u003c/h1>\n  \u003cspan class=\"sid\">BRK-03\u003c/span>\n  \u003cspan class=\"defense\">DSRV 비참여 · 가격 불관여\u003c/span>\n\u003c/header>\n\n\u003cdiv class=\"main\">\n  \u003cdiv class=\"screen-panel\">\n    \u003cdiv style=\"position:relative;display:flex;\">\n      \u003cdiv class=\"labels\" id=\"labels\">\n        \u003cdiv class=\"lbl\">\u003cspan class=\"lbl-text\">전역\u003cbr>상단·배너\u003c/span>\u003c/div>\n        \u003cdiv class=\"lbl\">\u003cspan class=\"lbl-text\">요청 내역\u003c/span>\u003c/div>\n        \u003cdiv class=\"lbl\">\u003cspan class=\"lbl-text\">신청\u003c/span>\u003c/div>\n        \u003cdiv class=\"lbl\">\u003cspan class=\"lbl-text\">비참여 고지\u003c/span>\u003c/div>\n      \u003c/div>\n      \u003csvg id=\"bracketSvg\" width=\"24\" style=\"flex-shrink:0;overflow:visible;\">\u003c/svg>\n    \u003c/div>\n\n    \u003cdiv class=\"frame\" id=\"frame\">\n      \u003c!-- 전역: 콘솔 상단 + GNB + KYC 배너(조건부) -->\n      \u003cdiv class=\"zone\" data-idx=\"7\">\n        \u003cdiv class=\"zone-highlight\">\u003c/div>\n        \u003cdiv class=\"c-top\" style=\"border-radius:8px 8px 0 0;\">\n          \u003cspan class=\"brand\" style=\"cursor:pointer;\">DSRV Desk\u003c/span>\n          \u003cspan class=\"meta\">\u003cspan class=\"c-badge\">A자산운용\u003c/span>\u003c/span>\n        \u003c/div>\n        \u003cdiv class=\"c-adminbar\" style=\"margin:0;\">\n          \u003cspan class=\"m\">대시보드\u003c/span>\n          \u003cspan class=\"m\">교환하기\u003c/span>\n          \u003cspan class=\"m on\" style=\"background:#dbeafe;color:#1d4ed8;\">교환게시판\u003c/span>\n        \u003c/div>\n        \u003cdiv class=\"item-area\" data-highlight=\"7\" style=\"position:relative;\">\n          \u003cdiv class=\"pin\" data-idx=\"7\" style=\"top:-4px;right:-6px;\">8\u003c/div>\n          \u003cdiv style=\"font-size:9px;color:#94a3b8;padding:3px 8px 0;\">▼ KYC 예외 상태에서만 노출 (정상 시 배너 없음)\u003c/div>\n          \u003cdiv class=\"c-banner warn\" style=\"border-radius:0;\">⚠ 현재 거래가 불가합니다 — 고객확인(KYC)에 확인이 필요한 사항이 있습니다. 이메일로 문의해 주세요.\u003c/div>\n        \u003c/div>\n      \u003c/div>\n\n      \u003c!-- 요청 내역 (표시 전용) -->\n      \u003cdiv class=\"zone\" data-idx=\"0\">\n        \u003cdiv class=\"zone-highlight\">\u003c/div>\n        \u003cdiv class=\"item-area\" data-highlight=\"0\" style=\"position:relative;padding:4px;border-radius:8px;\">\n          \u003cdiv class=\"pin\" data-idx=\"0\" style=\"top:-6px;right:-6px;\">1\u003c/div>\n          \u003cdiv class=\"zone-title\">교환거래 요청 내역 (게시 조건)\u003c/div>\n          \u003cdiv class=\"kv\">\u003cspan class=\"k\">요청번호\u003c/span>\u003cspan class=\"v\">BRK-20260830-0027\u003c/span>\u003c/div>\n          \u003cdiv class=\"kv\">\u003cspan class=\"k\">교환쌍 · 방향 (게시자 기준)\u003c/span>\u003cspan class=\"v\">USDT → USDC\u003c/span>\u003c/div>\n          \u003cdiv class=\"kv\">\u003cspan class=\"k\">게시자가 보내는 수량\u003c/span>\u003cspan class=\"v\">800 USDT\u003c/span>\u003c/div>\n          \u003cdiv class=\"kv\">\u003cspan class=\"k\">게시자가 받는 수량\u003c/span>\u003cspan class=\"v\">798.40 USDC\u003c/span>\u003c/div>\n          \u003cdiv class=\"kv\">\u003cspan class=\"k\">비율\u003c/span>\u003cspan class=\"v\">0.9980 USDC/USDT\u003c/span>\u003c/div>\n          \u003cdiv class=\"kv\">\u003cspan class=\"k\">게시 일시\u003c/span>\u003cspan class=\"v\">2026-08-30 14:20\u003c/span>\u003c/div>\n          \u003cdiv class=\"kv\">\u003cspan class=\"k\">게시 유효기한\u003c/span>\u003cspan class=\"v\">2026-09-29 14:20까지\u003c/span>\u003c/div>\n          \u003cdiv class=\"kv\">\u003cspan class=\"k\">게시 상태\u003c/span>\u003cspan class=\"v\">\u003cspan class=\"chip info\">게재중\u003c/span>\u003c/span>\u003c/div>\n          \u003cdiv class=\"kv\">\u003cspan class=\"k\">게시자\u003c/span>\u003cspan class=\"v\">B*** (KYC 완료 · 거래 안전성 검증 ✓)\u003c/span>\u003c/div>\n        \u003c/div>\n      \u003c/div>\n\n      \u003c!-- 신청 -->\n      \u003cdiv class=\"zone\" data-idx=\"1,2,3,4,5\">\n        \u003cdiv class=\"zone-highlight\">\u003c/div>\n        \u003cdiv class=\"zone-title\">게시 조건으로 신청\u003c/div>\n\n        \u003cdiv class=\"item-area\" data-highlight=\"1\" style=\"position:relative;padding:4px;border-radius:8px;\">\n          \u003cdiv class=\"pin\" data-idx=\"1\" style=\"top:-6px;right:-6px;\">2\u003c/div>\n          \u003cdiv class=\"kv\">\u003cspan class=\"k\">내가 보내는 수량\u003c/span>\u003cspan class=\"v\">798.40 USDC\u003c/span>\u003c/div>\n          \u003cdiv class=\"kv\">\u003cspan class=\"k\">내가 받는 수량\u003c/span>\u003cspan class=\"v\">800 USDT\u003c/span>\u003c/div>\n          \u003cdiv class=\"kv\">\u003cspan class=\"k\">신청 유효기간\u003c/span>\u003cspan class=\"v\">접수 시점부터 영업일 2일\u003c/span>\u003c/div>\n          \u003cdiv class=\"kv\">\u003cspan class=\"k\">내 중개 수수료 (거래액 1%)\u003c/span>\u003cspan class=\"v\">7.98 USDC — 확정 시 발생\u003c/span>\u003c/div>\n        \u003c/div>\n\n        \u003cdiv class=\"item-area\" data-highlight=\"2\" style=\"position:relative;padding:4px;border-radius:8px;margin-top:6px;\">\n          \u003cdiv class=\"pin\" data-idx=\"2\" style=\"top:-6px;right:-6px;\">3\u003c/div>\n          \u003cdiv style=\"font-size:10px;color:#16a34a;padding:0 2px;\">보유 9,300.00 USDC · 처분 가능 \u003cstrong>9,300.00 USDC\u003c/strong> ✓ (필요 798.40 USDC · ≈ 1,077,840원 상당, 1회 한도 {정책값 1,500,000원 상당} 이내)\u003c/div>\n          \u003cdiv style=\"font-size:9px;color:#94a3b8;padding:6px 4px 3px;\">▼ 게시 상태가 게재중이 아니거나 게이트 미충족 시에만 노출 (아래는 문구 예시 — 실제로는 해당 1건만)\u003c/div>\n          \u003cdiv style=\"font-size:10px;color:#b45309;background:#fef3c7;border:1px solid #fde68a;border-radius:6px;padding:5px 8px;\">⚠ 협의 중인 게시입니다 — 다른 신청이 처리되면 다시 신청할 수 있습니다\u003c/div>\n          \u003cdiv style=\"font-size:10px;color:#b91c1c;background:#fef2f2;border:1px solid #fecaca;border-radius:6px;padding:5px 8px;margin-top:4px;\">⚠ 보유·처분 가능 수량이 부족합니다 — 798.40 USDC가 필요합니다 (처분 가능 {수량} USDC)\u003c/div>\n        \u003c/div>\n\n        \u003cdiv style=\"display:flex;gap:8px;margin-top:8px;\">\n          \u003cdiv class=\"item-area\" data-highlight=\"3\" style=\"position:relative;flex:1;padding:4px;border-radius:8px;\">\n            \u003cdiv class=\"pin\" data-idx=\"3\" style=\"top:-8px;right:-6px;\">4\u003c/div>\n            \u003cdiv class=\"btn primary\">이 조건으로 신청\u003c/div>\n          \u003c/div>\n          \u003cdiv class=\"item-area\" data-highlight=\"4\" style=\"position:relative;flex:.5;padding:4px;border-radius:8px;\">\n            \u003cdiv class=\"pin\" data-idx=\"4\" style=\"top:-8px;right:-6px;\">5\u003c/div>\n            \u003cdiv class=\"btn ghost\">취소\u003c/div>\n          \u003c/div>\n        \u003c/div>\n\n        \u003cdiv class=\"item-area\" data-highlight=\"5\" style=\"position:relative;padding:4px;border-radius:8px;margin-top:4px;\">\n          \u003cdiv class=\"pin\" data-idx=\"5\" style=\"top:-6px;right:-6px;\">6\u003c/div>\n          \u003cdiv style=\"font-size:10px;color:#64748b;\">게시자가 기한 내 수락하면 \u003cstrong>즉시 확정되어 구속력과 수수료 7.98 USDC가 발생\u003c/strong>하고 바로 이전(정산)으로 진행됩니다. 무응답 시 자동 만료되며, 신청 후 취소 기능은 없습니다.\u003c/div>\n        \u003c/div>\n      \u003c/div>\n\n      \u003c!-- 비참여 고지 -->\n      \u003cdiv class=\"zone\" data-idx=\"6\">\n        \u003cdiv class=\"zone-highlight\">\u003c/div>\n        \u003cdiv class=\"item-area\" data-highlight=\"6\" style=\"position:relative;padding:4px;border-radius:8px;\">\n          \u003cdiv class=\"pin\" data-idx=\"6\" style=\"top:-6px;right:-6px;\">7\u003c/div>\n          \u003cdiv class=\"note-inline reg\">DSRV는 가격 협의에 참여하지 않으며 신청·수락 기록만 보존합니다. 게시자 수락 전까지 구속력이 없으며, 수락 시 즉시 확정됩니다.\u003c/div>\n        \u003c/div>\n      \u003c/div>\n    \u003c/div>\n  \u003c/div>\n\n  \u003csvg id=\"connSvg\" style=\"position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:10;overflow:visible;\">\u003c/svg>\n\n  \u003cdiv class=\"items\" id=\"items\">\n    \u003cdiv class=\"nav-global\">\n      \u003cdiv class=\"nav-global-title\">진입 · 전역 이동\u003c/div>\n      \u003cdiv class=\"nav-note\">· \u003cstrong>전역 이동\u003c/strong> 상단 메뉴(GNB) · 기관 배지 · 뒤로가기의 동작은 대시보드(DASH-01)의 표와 같다. 다른 점 = 현재 탭 '교환게시판'을 다시 클릭하면 교환 게시판(BRK-01) 목록으로 간다([취소]와 같은 결과). 신청 전에 나가면 아무 효력이 없다.\u003cbr>\n      · \u003cstrong>진입\u003c/strong> 교환 게시판(BRK-01)의 타사 게시 행 클릭(게재중·협의중 모두). 진입 시 게시의 최신 상태와 내 잔고를 서버에서 조회하며 \"불러오는 중…\"을 보인다.\u003c/div>\n    \u003c/div>\n\n    \u003cdiv class=\"itm\" data-idx=\"0\">\n      \u003cdiv class=\"num\">1\u003c/div>\n      \u003cdiv>\n        \u003cdiv class=\"itm-title\">교환거래 요청 내역 — 게시 조건 (표시 전용)\u003c/div>\n        \u003cdiv class=\"itm-desc\">\u003cstrong>구성\u003c/strong> kv 9행. 포맷과 필드 순서는 '교환거래 요청 내역' 공통 폼(EXC-03·04 · BRK-04·05·06·07)을 따른다.\u003cbr>\u003cstrong>기준\u003c/strong> 방향과 수량은 게시자 기준으로 적고 라벨에 \"게시자가 보내는/받는\"을 명시한다. 신청자 기준 수량은 항목 2에 둔다.\u003cbr>\u003cstrong>값\u003c/strong> 비율은 notation 규칙(스테이블 페어 {받는}/{주는} 4자리 · ETH 페어 {스테이블}/ETH 2자리). 게시 일시와 게시 유효기한을 함께 적는다.\u003cbr>\u003cstrong>상태 칩\u003c/strong> 진입 시 최신 값을 표시한다(게재중 / 협의중 / 회수 / 완료 / 중지). 게재중이 아니면 항목 3 경고를 띄우고 항목 4를 비활성으로 둔다.\u003cbr>\u003cstrong>마스킹\u003c/strong> 게시자 상호는 확정 전까지 첫 글자만 노출하고(B***) 확정 후 BRK-05·07에서 해제한다. KYC 완료와 거래 안전성 검증은 ✓로 표기한다.\u003cbr>\u003cstrong>상태별 문구\u003c/strong> 로딩은 \"불러오는 중…\"이고 3초 초과 시 오류로 넘긴다. 조회 실패면 상단 배너를 띄우고 버튼을 비활성으로 둔다.\u003cbr>\u003cspan class=\"basis\">근거 F-1b · L6 설명의무 · 공통 포맷\u003c/span>\u003c/div>\n      \u003c/div>\n    \u003c/div>\n\n    \u003cdiv class=\"itm\" data-idx=\"1\">\n      \u003cdiv class=\"num\">2\u003c/div>\n      \u003cdiv>\n        \u003cdiv class=\"itm-title\">신청 조건 · 내 수수료 (표시 전용)\u003c/div>\n        \u003cdiv class=\"itm-desc\">\u003cstrong>구성\u003c/strong> kv 4행. 게시 조건을 신청자 기준으로 뒤집어 표시한다(내가 보내는 = 게시자가 받는 798.40 USDC · 내가 받는 = 게시자가 보내는 800 USDT). 입력 필드는 두지 않는다(역제안 없음).\u003cbr>\u003cstrong>신청 유효기간\u003c/strong> \"접수 시점부터 영업일 {정책값 2영업일}\"(ADM-03). 접수 시점은 진입 시각이 아니라 [이 조건으로 신청] 접수 시 서버 시각으로 확정하고 BRK-07에 표시한다.\u003cbr>\u003cstrong>내 수수료\u003c/strong> 내가 보내는 수량 × {정책값 1.00%}(ADM-03)를 보내는 자산 자릿수로 절사한다(798.40 × 1% = 7.984 → 7.98 USDC). 자기 측 금액만 표시하고 상대측 금액은 노출하지 않으며 \"확정 시 발생\"을 병기한다.\u003cbr>\u003cspan class=\"basis\">근거 09 §0 마목 수수료 · L6 설명의무(4요소④) · notation 산정값 절사\u003c/span>\u003c/div>\n      \u003c/div>\n    \u003c/div>\n\n    \u003cdiv class=\"itm\" data-idx=\"2\">\n      \u003cdiv class=\"num\">3\u003c/div>\n      \u003cdiv>\n        \u003cdiv class=\"itm-title\">신청 가능 여부 게이트 — 잔고·한도 표시 + 상태·게이트 경고 (표시 · 조건부 노출)\u003c/div>\n        \u003cdiv class=\"itm-desc\">\u003cstrong>검증 시점\u003c/strong> 진입 시 1회, 그리고 [이 조건으로 신청] 클릭 시 서버가 다시 판정한다.\u003cbr>\u003cstrong>상시 표시\u003c/strong> 「보유 {수량} {자산} · 처분 가능 {수량} {자산} ✓ (필요 {내가 보내는 수량} · ≈ {원화 환산액}원 상당, 1회 한도 {정책값 1,500,000원 상당} 이내)」 1줄. 처분 가능 = 실보유 − 기게시·기신청 중복분. 충족은 초록 ✓, 미충족은 빨강.\u003cbr>\u003cstrong>인라인 경고\u003c/strong> 해당 1건만 버튼 바로 위에 띄운다. 게시 상태 경고는 협의중·중지·회수·완료 4종, 게이트 경고는 잔고 부족과 한도 초과 2종이다. 우선순위는 게시 상태 → 한도 → 잔고.\u003cbr>\u003cstrong>한도 환산\u003c/strong> 내가 보내는 수량 × ADM-03 시세(요청 시점)로 계산한다. 게시 시점에는 한도 이내였어도 시세 변동으로 초과될 수 있어 신청자 측에서도 판정한다.\u003cbr>\u003cstrong>조회 실패\u003c/strong> \"—\"와 상단 배너를 띄우고 버튼을 비활성으로 둔다.\u003cbr>\u003cspan class=\"basis\">근거 09 §0 신청자 거래 안전성 검증·건별 한도 · V2(4요소①)\u003c/span>\u003c/div>\n        \u003cdiv class=\"itm-nav\">\u003cspan class=\"nav-tag\">화면 이동 · 인터랙션\u003c/span>\n          \u003cdiv class=\"nav-row\">\u003cspan class=\"nav-el\">경고 블록\u003c/span>\u003cspan class=\"nav-act\">클릭\u003c/span>\u003cspan class=\"nav-to stay\">무반응(표시 전용) · 닫기(×) 없음 · 재진입 시 재판정\u003c/span>\u003c/div>\n        \u003c/div>\n      \u003c/div>\n    \u003c/div>\n\n    \u003cdiv class=\"itm\" data-idx=\"3\">\n      \u003cdiv class=\"num\">4\u003c/div>\n      \u003cdiv>\n        \u003cdiv class=\"itm-title\">[이 조건으로 신청] 버튼\u003cspan class=\"req\">필수\u003c/span>\u003c/div>\n        \u003cdiv class=\"itm-desc\">\u003cstrong>노출\u003c/strong> 항상 보인다.\u003cbr>\u003cstrong>클릭 가능\u003c/strong> 게시 상태가 게재중이고, 처분 가능분과 건별 한도를 통과하고, KYC 예외가 아니고 잔고 조회가 성공했을 때만 활성이다.\u003cbr>\u003cstrong>확인 사항\u003c/strong> 확인 다이얼로그를 띄운다. 수락되면 즉시 구속력이 생기는 청약이기 때문이다(신청 자체는 수락 전까지 구속력 없음). 클릭 시 서버가 게시 상태·잔고·한도를 다시 판정한다.\u003cbr>\u003cstrong>액션\u003c/strong> 신청을 접수해 게시 상태를 '게재중'에서 '협의중'으로 바꾸고 게시당 동시 신청 1건 규칙으로 다른 기관의 추가 신청을 막는다. 게시자에게 이메일 ①을 보내고 신청 유효기간을 서버 시각으로 확정한다.\u003cbr>\u003cspan class=\"basis\">근거 F-1b · V2(통신중개 아님) · F-4 · 09 §0 마목 게시 상태\u003c/span>\u003c/div>\n        \u003cdiv class=\"itm-nav\">\u003cspan class=\"nav-tag\">화면 이동 · 인터랙션\u003c/span>\n          \u003cdiv class=\"nav-row\">\u003cspan class=\"nav-el\">[이 조건으로 신청] — 활성 조건\u003c/span>\u003cspan class=\"nav-act\">다음이 모두 아님: ①게시 상태가 게재중 아님(협의중·회수·완료·중지) ②내가 보내는 수량 &gt; 처분 가능분 ③건별 한도 {정책값 1,500,000원 상당} 초과 ④KYC 예외 배너 노출 중 ⑤게시·잔고 조회 실패 ⑥내 게시(구조적 불가 — BRK-01에서 BRK-06으로 분기)\u003c/span>\u003cspan class=\"nav-to stay\">하나라도 해당 → 회색 비활성(공통 UI 규격) · 사유는 항목 3 인라인 경고로 노출(툴팁 없음)\u003c/span>\u003c/div>\n          \u003cdiv class=\"nav-row\">\u003cspan class=\"nav-el\">[이 조건으로 신청] — 클릭(활성)\u003c/span>\u003cspan class=\"nav-act\">클릭 → \u003cstrong>다이얼로그: 제목 \"이 조건으로 신청\" / 본문 \"게시자가 수락하면 즉시 확정되어 구속력이 발생합니다. 중개 수수료 7.98 USDC(거래액 1%)는 확정 시 발생합니다.\" / [신청] [돌아가기]\u003c/strong> → [신청] 클릭 → 버튼 라벨 \"신청 중…\"·비활성(중복 클릭 차단) → 게시 상태·잔고·한도 서버 재검증 → 접수(신청 시점 확정 · 유효기한 = 접수 + 영업일 {정책값 2영업일}) · 게시 상태 협의중 · 게시자 이메일 ① 발송\u003c/span>\u003cspan class=\"nav-to\">\u003cstrong>내 신청 상세(BRK-07)\u003c/strong> — 단계 '수락 대기'(2026-09-02 변경 — 종전 BRK-01 복귀 폐기) · [돌아가기] = 다이얼로그 닫힘·화면 잔류·변경 없음\u003c/span>\u003c/div>\n          \u003cdiv class=\"nav-row\">\u003cspan class=\"nav-el\">[이 조건으로 신청] — 실패\u003c/span>\u003cspan class=\"nav-act\">재검증 실패: 클릭 사이 타 기관 신청 접수(협의중) · 회수 · 만료 · 중지 / 잔고·한도 미충족 / 시스템 오류\u003c/span>\u003cspan class=\"nav-to stay\">화면 잔류 · 상태 변경 → 게시 상태 칩 갱신 + 항목 3 해당 경고 노출 + 버튼 비활성 / 잔고·한도 → 항목 3 경고 + 비활성 / 오류 → 상단 배너 \"일시적인 오류입니다. 잠시 후 다시 시도해 주세요\" · 버튼 라벨 복귀\u003c/span>\u003c/div>\n        \u003c/div>\n      \u003c/div>\n    \u003c/div>\n\n    \u003cdiv class=\"itm\" data-idx=\"4\">\n      \u003cdiv class=\"num\">5\u003c/div>\n      \u003cdiv>\n        \u003cdiv class=\"itm-title\">[취소] 버튼\u003c/div>\n        \u003cdiv class=\"itm-desc\">\u003cstrong>노출\u003c/strong> 항상 보인다.\u003cbr>\u003cstrong>클릭 가능\u003c/strong> 항상 활성이다.\u003cbr>\u003cstrong>확인 사항\u003c/strong> 없다.\u003cbr>\u003cstrong>액션\u003c/strong> 아무 효력 없이 BRK-01로 돌아간다.\u003cbr>\u003cspan class=\"basis\">근거 notation 종료 동선\u003c/span>\u003c/div>\n        \u003cdiv class=\"itm-nav\">\u003cspan class=\"nav-tag\">화면 이동 · 인터랙션\u003c/span>\n          \u003cdiv class=\"nav-row\">\u003cspan class=\"nav-el\">[취소] — 활성 조건\u003c/span>\u003cspan class=\"nav-act\">항상 활성(\"신청 중…\" 동안만 비활성)\u003c/span>\u003cspan class=\"nav-to stay\">—\u003c/span>\u003c/div>\n          \u003cdiv class=\"nav-row\">\u003cspan class=\"nav-el\">[취소] — 클릭(활성)\u003c/span>\u003cspan class=\"nav-act\">클릭 → 확인 없음 → 아무 효력 없음(신청 기록 생성 안 함)\u003c/span>\u003cspan class=\"nav-to\">\u003cstrong>교환 게시판(BRK-01)\u003c/strong> 복귀 · 목록 재조회\u003c/span>\u003c/div>\n          \u003cdiv class=\"nav-row\">\u003cspan class=\"nav-el\">[취소] — 실패\u003c/span>\u003cspan class=\"nav-act\">해당 없음(서버 호출 없음)\u003c/span>\u003cspan class=\"nav-to stay\">—\u003c/span>\u003c/div>\n        \u003c/div>\n      \u003c/div>\n    \u003c/div>\n\n    \u003cdiv class=\"itm\" data-idx=\"5\">\n      \u003cdiv class=\"num\">6\u003c/div>\n      \u003cdiv>\n        \u003cdiv class=\"itm-title\">단독 실행 결과 고지 (표시 전용)\u003c/div>\n        \u003cdiv class=\"itm-desc\">\u003cstrong>문구\u003c/strong> 버튼 아래에 결과 고지 1문장을 상시 노출한다(즉시 확정·구속력·수수료). 수수료 금액은 항목 2 값을, 영업일은 ADM-03 값을 쓴다.\u003cbr>\u003cstrong>취소 여부\u003c/strong> \"신청 후 취소 기능은 없습니다\"를 쓴다. \u003cspan class=\"chk\">[확인필요: 신청 취소 허용 여부(BRK-07) — 허용 시 이 문장 수정]\u003c/span>\u003cbr>\u003cspan class=\"basis\">근거 notation 단독 실행 표기 · L6 설명의무\u003c/span>\u003c/div>\n      \u003c/div>\n    \u003c/div>\n\n    \u003cdiv class=\"itm\" data-idx=\"6\">\n      \u003cdiv class=\"num\">7\u003c/div>\n      \u003cdiv>\n        \u003cdiv class=\"itm-title\">\"DSRV 비참여·기록만\" 고지 (표시 전용)\u003c/div>\n        \u003cdiv class=\"itm-desc\">\u003cstrong>문구\u003c/strong> 고정 1블록. 가격 불관여·당사자성 방어, 수락 전 구속력 없음(수락 = 확정), 기록 보존을 한 번에 적고 BRK-04·07과 같은 문구를 쓴다.\u003cbr>\u003cstrong>내용\u003c/strong> 신청·수락 기록은 15년 보존한다. 자동 매칭·체결은 없고 수락은 게시자의 능동 행위다. 문구 변경은 법무 확인 후에 한다.\u003cbr>\u003cspan class=\"basis\">근거 V2 · L6 §9 · [로펌게이트] 비참여 범위\u003c/span>\u003c/div>\n      \u003c/div>\n    \u003c/div>\n\n    \u003cdiv class=\"itm\" data-idx=\"7\">\n      \u003cdiv class=\"num\">8\u003c/div>\n      \u003cdiv>\n        \u003cdiv class=\"itm-title\">KYC 예외 배너 (조건부 노출)\u003c/div>\n        \u003cdiv class=\"itm-desc\">\u003cstrong>노출\u003c/strong> 기관 KYC 상태가 '활성'이 아닐 때만 보인다. EXC-01·BRK-02와 같은 규격·문구를 쓴다.\u003cbr>\u003cstrong>동작\u003c/strong> 노출 중에는 [이 조건으로 신청]만 비활성으로 두고 조건 열람은 그대로 둔다. 내부 사유와 심사 내용은 노출하지 않는다.\u003cbr>\u003cstrong>문구\u003c/strong> 고정. \u003cspan class=\"chk\">[확인필요: 안내 이메일 주소]\u003c/span>\u003cbr>\u003cspan class=\"basis\">근거 G-3 · V2 KYC 담보(4요소②)\u003c/span>\u003c/div>\n        \u003cdiv class=\"itm-nav\">\u003cspan class=\"nav-tag\">화면 이동 · 인터랙션\u003c/span>\n          \u003cdiv class=\"nav-row\">\u003cspan class=\"nav-el\">배너\u003c/span>\u003cspan class=\"nav-act\">클릭\u003c/span>\u003cspan class=\"nav-to stay\">무반응(표시 전용) · 상태가 '활성'으로 바뀌면 다음 진입 시 배너 제거·버튼 활성\u003c/span>\u003c/div>\n        \u003c/div>\n      \u003c/div>\n    \u003c/div>\n  \u003c/div>\n\n\u003c/div>\n\n\u003csection class=\"footer-note\" style=\"padding-bottom:0;\">\n  \u003cdiv class=\"note-card\">\n    \u003cdiv class=\"note-title\">상세내용\u003c/div>\n    \u003cdiv class=\"detail-grid\" id=\"detailCol\">\n      \u003cdiv class=\"dtl\" data-idx=\"0\">\n        \u003cdiv class=\"detail-label\">\u003cspan class=\"dtl-num\">1\u003c/span>공통 포맷 적용 범위 · 마스킹\u003c/div>\n      \u003cdiv class=\"dtl-body\">\u003cspan class=\"box\">· 상세형(kv 폼): EXC-03·EXC-04(나목) · BRK-03·04·05·06·07(마목) · ADM-02 처리함 선택 건 — 같은 필드 순서 · 목록형(표): DASH-01·BRK-01\u003cbr>· 비율 표기는 notation 규칙(스테이블 페어 {받는}/{주는} 4자리 · ETH 페어 {스테이블}/ETH 2자리)\u003cbr>· 상대 상호 마스킹(B***)은 확정 시 해제 — 트래블룰·정산에 상대 확인 필요 · 해제 화면 = BRK-05·07(확정 후) \u003cspan class=\"chk\">[확인필요: 마스킹 규칙 — 첫 글자 vs 첫 2자]\u003c/span>\u003c/span>\u003c/div>\n      \u003c/div>\n      \u003cdiv class=\"dtl\" data-idx=\"1\">\n        \u003cdiv class=\"detail-label\">\u003cspan class=\"dtl-num\">2\u003c/span>수수료 · 수량 계산\u003c/div>\n      \u003cdiv class=\"dtl-body\">\u003cspan class=\"box\">· 신청자 수수료 = 내가 보내는 798.40 USDC × 1% = 7.984 → \u003cstrong>7.98 USDC\u003c/strong>(USDC 2자리 절사) · 게시자 수수료 = 800 USDT × 1% = 8.00 USDT(BRK-04 표시) — 양 당사자 각자, 상대측 금액 미노출\u003cbr>· 수수료 징수 방식(보내는 수량에서 차감 vs 별도)은 BRK-05 이전 단계 정의 \u003cspan class=\"chk\">[확인필요]\u003c/span>\u003cbr>· ETH 예: 0.3 ETH × 1% = 0.003 ETH · 0.3140 ETH × 1% = 0.0031 ETH(절사)\u003c/span>\u003c/div>\n      \u003c/div>\n      \u003cdiv class=\"dtl\" data-idx=\"2\">\n        \u003cdiv class=\"detail-label\">\u003cspan class=\"dtl-num\">3\u003c/span>신청자 거래 안전성 검증 — 판정 시점·범위\u003c/div>\n      \u003cdiv class=\"dtl-body\">\u003cspan class=\"box\">· 2026-09-02 확정: 신청 시점에 신청자가 보내는 자산의 보유·처분 가능분 + 건별 한도 검증 → 미충족 시 버튼 비활성 + 인라인 경고 (종전 \"수락 시 양건 확인\" 대안 폐기 — 수락 시 재검증은 보완 수단, BRK-04 상세)\u003cbr>· 처분 가능 = 실보유 − 같은 자산의 기게시(게재중·협의중) 보내는 수량 − 기신청(수락 대기) 보내는 수량 — 여러 게시에 동시 신청은 처분 가능분 범위에서 허용 \u003cspan class=\"chk\">[확인필요: 한 기관의 동시 신청 건수 상한]\u003c/span>\u003cbr>· 게시당 동시 신청 1건이므로 동일 기관 중복 신청 이슈 소멸 · 자기 게시 신청은 동선상 불가(BRK-01 내 게시 → BRK-06)\u003cbr>· 판정 위치: 게시 상태 판정도 이 화면에서(BRK-01 목록은 스냅숏 — BRK-01 상세 2)\u003c/span>\u003c/div>\n      \u003c/div>\n      \u003cdiv class=\"dtl\" data-idx=\"3\">\n        \u003cdiv class=\"detail-label\">\u003cspan class=\"dtl-num\">4\u003c/span>신청 이후 흐름 · 이메일 ① 신청 접수 (수신: 게시자) · 공통 원칙\u003c/div>\n      \u003cdiv class=\"dtl-body\">\u003cspan class=\"box\">· 접수 → 게시 협의중 → 게시자 BRK-06 신청 행 → BRK-04 수락(확정 → BRK-05 · 이메일 ②) / 거절·무응답 만료 → 게시 게재중 복귀·신청 종결 / 게시 회수(이메일 ④)·중지·게시 만료 → 신청 종결 — 신청자는 BRK-07에서 조회\u003cbr>· \u003cstrong>공통 원칙(4종 메일)\u003c/strong>: 발신전용(no-reply) · 본문에 로그인 링크·버튼 미포함(콘솔 직접 접속 안내) · 상호 마스킹은 화면과 동일 · 심사·AML 관련 내용 미포함 · 수신 = 법인 담당자 등록 이메일 \u003cspan class=\"chk\">[확인필요: 수신 범위(담당자 단일/복수)]\u003c/span>\u003cbr>· \u003cstrong>제목\u003c/strong>: [DSRV] 교환 게시에 새 신청 도착 — BRK-20260830-0027\u003cbr>· \u003cstrong>본문\u003c/strong>: \"회원님의 교환 게시에 새로운 신청이 접수되었습니다.\" + 요청번호 · 교환쌍·방향(USDT → USDC) · 800 USDT ↔ 798.40 USDC(게시 조건 그대로) · 신청자 A***(KYC 완료·거래 안전성 검증 ✓) · 신청 일시 2026-09-01 09:12 · \u003cstrong>수락 기한 2026-09-03 09:12(영업일 2일, 경과 시 자동 만료)\u003c/strong> + \"수락·거절은 DSRV Desk > 교환게시판 > 내 게시 > 받은 신청에서 처리해 주세요.\"\u003cbr>· 거절·만료 통지 메일은 4종에 없음 \u003cspan class=\"chk\">[확인필요: 거절·만료 통지 방식 — 메일 추가 vs BRK-07·DASH-01 상태만]\u003c/span>\u003c/span>\u003c/div>\n      \u003c/div>\n      \u003cdiv class=\"dtl\" data-idx=\"6\">\n        \u003cdiv class=\"detail-label\">\u003cspan class=\"dtl-num\">7\u003c/span>비참여 범위 [로펌게이트]\u003c/div>\n      \u003cdiv class=\"dtl-body\">\u003cspan class=\"box\">· '기록만' vs '관찰' 범위의 UI 반영 한계 확정 필요\u003cbr>· DSRV는 가격 제시·중재·호가 제공 안 함 · 자유 메시지 채널·역제안 없음(통신중개·개입 논란 차단)\u003cbr>· 채널 내 DSRV 개입 로그는 감사 대상 · 신청·수락 기록 15년 보존(L6 §9)\u003c/span>\u003c/div>\n      \u003c/div>\n    \u003c/div>\n  \u003c/div>\n\u003c/section>\n\n\u003csection class=\"footer-note\">\n  \u003cdiv class=\"note-card\">\n    \u003cdiv class=\"note-title\">비고\u003c/div>\n    \u003cdiv class=\"note-body\">\n      · 기존 RFQ에 거래를 거는 단계. \u003cstrong>[방어 핵심]\u003c/strong> DSRV는 \u003cstrong>가격에 관여하지 않고 기록만\u003c/strong> 보존(당사자성 방어) — 자유 메시지 채널·역제안 없음. \"가격 결정 = 당사자, 외부지표 = 중지 판단 기준\"을 화면 문구로 일관 유지.\u003cbr>\n      · 2026-09-02 변경: 협의중·종결(회수·완료·중지) 게시도 상세는 열림 — [이 조건으로 신청] 비활성 + 상태별 인라인 안내로 처리(종전 \"게시판 제외 → 진입 불가\" 서술 폐기) · 신청자 거래 안전성 검증(잔고·한도) 추가 · 확인 다이얼로그 문구 확정 · 수락 전 구속력 없음, 수수료(1% · 각자 보내는 자산 기준)는 수락 확정 시 발생.\u003cbr>\n      · 2026-09-02 설명 형식 개정 적용(핀 = 조작 요소 단위) — 표시 3·조건부 2(게이트 경고·KYC 배너)·버튼 2·고지 1 8핀 · 예시 800 USDT ↔ 798.40 USDC · 수수료 7.98 USDC.\u003cbr>\n      · \u003cspan class=\"chk\">[확인필요]\u003c/span> 신청 취소 허용 여부(BRK-07) · 동시 신청 건수 상한 · 수수료 징수 방식 · 거절·만료 통지 메일 · 마스킹 규칙 · 이메일 수신 범위 · KYC 배너 문의 주소.\u003cbr>\n      · 다음: (신청자) 내 신청 상세 (BRK-07) / (게시자) 받은 신청·수락 (BRK-04)\n    \u003c/div>\n  \u003c/div>\n\u003c/section>\n\n\u003cscript src=\"screen.js\">\u003c/script>\n\u003c/body>\n\u003c/html>\n", "brk-07.html": "\u003c!DOCTYPE html>\n\u003chtml lang=\"ko\">\n\u003chead>\n\u003cmeta charset=\"UTF-8\">\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n\u003ctitle>화면기획 — 내 신청 상세\u003c/title>\n\u003clink rel=\"stylesheet\" href=\"screen.css\">\n\u003c/head>\n\u003cbody>\n\n\u003cheader class=\"header\">\n  \u003cdiv class=\"crumb\">\u003cspan>마목 중개\u003c/span>\u003cspan class=\"s\">›\u003c/span>\u003cspan>교환게시판\u003c/span>\u003cspan class=\"s\">›\u003c/span>\u003cspan>내 신청\u003c/span>\u003c/div>\n  \u003ch1 class=\"title\">내 신청 상세\u003c/h1>\n  \u003cspan class=\"sid\">BRK-07\u003c/span>\n  \u003cspan class=\"defense\">신청자 측 진행 조회 · DSRV 비참여\u003c/span>\n\u003c/header>\n\n\u003cdiv class=\"main\">\n  \u003cdiv class=\"screen-panel\">\n    \u003cdiv style=\"position:relative;display:flex;\">\n      \u003cdiv class=\"labels\" id=\"labels\">\n        \u003cdiv class=\"lbl\">\u003cspan class=\"lbl-text\">전역\u003cbr>상단\u003c/span>\u003c/div>\n        \u003cdiv class=\"lbl\">\u003cspan class=\"lbl-text\">요청 내역\u003c/span>\u003c/div>\n        \u003cdiv class=\"lbl\">\u003cspan class=\"lbl-text\">진행 상태\u003c/span>\u003c/div>\n        \u003cdiv class=\"lbl\">\u003cspan class=\"lbl-text\">안내\u003c/span>\u003c/div>\n        \u003cdiv class=\"lbl\">\u003cspan class=\"lbl-text\">비참여 고지\u003c/span>\u003c/div>\n      \u003c/div>\n      \u003csvg id= div class=\"kv\">\u003cspan class=\"k\">신청 유효기한\u003c/span>\u003cspan class=\"v\">2026-09-04 11:30까지 (영업일 2일)\u003c/span>\u003c/div>\n          \u003cdiv class=\"kv\">\u003cspan class=\"k\">상태\u003c/span>\u003cspan class=\"v\">\u003cspan class=\"chip\" style=\"background:#fef3c7;color:#b45309;\">협의중\u003c/span> &nbsp;게시자 수락 대기\u003c/span>\u003c/div>\n        \u003c/div>\n        \u003cdiv class=\"item-area\" data-highlight=\"3\" style=\"position:relative;padding:4px;border-radius:8px;\">\n          \u003cdiv class=\"pin\" data-idx=\"3\" style=\"top:-6px;right:-6px;\">4\u003c/div>\n          \u003cdiv style=\"font-size:9px;color:#94a3b8;padding:0 8px 2px;\">▼ 상태 '확정'·'완료'에서만 노출 (목업 상태 '협의중'에서는 없음)\u003c/div>\n          \u003cdiv style=\"padding:0 8px 4px;font-size:11px;\">\u003cspan style=\"color:#1d4ed8;font-weight:700;text-decoration:underline;cursor:pointer;\">이전 진행 보기 →\u003c/span>\u003c/div>\n        \u003c/div>\n        \u003cdiv class=\"item-area\" data-highlight=\"4\" style=\"position:relative;padding:4px;border-radius:8px;\">\n          \u003cdiv class=\"pin\" data-idx=\"4\" style=\"top:-6px;right:-6px;\">5\u003c/div>\n          \u003cdiv class=\"kv\">\u003cspan class=\"k\">내 중개 수수료 (거래액 1% 고정)\u003c/span>\u003cspan class=\"v\">7.98 USDC \u003cspan style=\"color:#94a3b8;\">(내가 보내는 798.40 USDC 기준) — 확정 시 발생\u003c/span>\u003c/span>\u003c/div>\n        \u003c/div>\n      \u003c/div>\n\n      \u003c!-- 안내 -->\n      \u003cdiv class=\"zone\" data-idx=\"5\">\n        \u003cdiv class=\"zone-highlight\">\u003c/div>\n        \u003cdiv class=\"item-area\" data-highlight=\"5\" style=\"position:relative;padding:4px;border-radius:8px;\">\n          \u003cdiv class=\"pin\" data-idx=\"5\" style=\"top:-6px;right:-6px;\">6\u003c/div>\n          \u003cdiv class=\"note-inline\">게시자가 기한 내 수락하면 \u003cstrong>즉시 확정되어 이전(정산)으로 진행\u003c/strong>되고, 거절·무응답(기한 경과)·게시 회수·게시 중지 시 신청은 종결됩니다. 결과는 등록 이메일과 이 화면의 상태로 알려드립니다. 신청 후 취소 기능은 없습니다\u003c/div>\n        \u003c/div>\n      \u003c/div>\n\n      \u003c!-- 비참여 고지 -->\n      \u003cdiv class=\"zone\" data-idx=\"6\">\n        \u003cdiv class=\"zone-highlight\">\u003c/div>\n        \u003cdiv class=\"item-area\" data-highlight=\"6\" style=\"position:relative;padding:4px;border-radius:8px;\">\n          \u003cdiv class=\"pin\" data-idx=\"6\" style=\"top:-6px;right:-6px;\">7\u003c/div>\n          \u003cdiv class=\"note-inline reg\">DSRV는 가격 협의에 참여하지 않으며 신청·수락 기록만 보존합니다. 게시자 수락 전까지 구속력이 없으며, 수락 시 즉시 확정됩니다.\u003c/div>\n        \u003c/div>\n      \u003c/div>\n    \u003c/div>\n  \u003c/div>\n\n  \u003csvg id=\"connSvg\" style=\"position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:10;overflow:visible;\">\u003c/svg>\n\n  \u003cdiv class=\"items\" id=\"items\">\n    \u003cdiv class=\"nav-global\">\n      \u003cdiv class=\"nav-global-title\">진입 · 전역 이동\u003c/div>\n      \u003cdiv class=\"nav-note\">· \u003cstrong>전역 이동\u003c/strong> 상단 메뉴(GNB) · 기관 배지 · 뒤로가기의 동작은 대시보드(DASH-01)의 표와 같다. 다른 점 = 현재 탭 '교환게시판'을 다시 클릭하면 교환 게시판(BRK-01) 목록으로 간다. 조회 화면이라 버릴 입력값이 없다.\u003cbr>\n      · \u003cstrong>진입\u003c/strong> 신청하기(BRK-03) 신청 접수 직후 / 대시보드(DASH-01) 거래 목록의 마목 내 신청 행 클릭(협의중·거절됨·만료·종결) / 결과 메일을 받은 뒤 콘솔에 직접 접속(메일 본문에 링크 없음). 진입 시 서버에서 최신 상태를 조회하고 머무는 동안 자동 갱신은 없다.\u003c/div>\n    \u003c/div>\n\n    \u003cdiv class=\"itm\" data-idx=\"0\">\n      \u003cdiv class=\"num\">1\u003c/div>\n      \u003cdiv>\n        \u003cdiv class=\"itm-title\">교환거래 요청 내역 — 공통 포맷 · 신청자 관점 (표시 전용)\u003c/div>\n        \u003cdiv class=\"itm-desc\">\u003cstrong>구성\u003c/strong> '교환거래 요청 내역' 공통 폼(게시번호 · 교환쌍·방향 · 보내는 수량 · 받는 수량 · 비율 · 게시 일시)에 내 기준(신청자) 1행을 더한다. 앞부분은 게시자 기준 그대로 두고 라벨에 \"(게시 기준)\"·\"(게시자)\"를 부기한다.\u003cbr>\u003cstrong>내 기준\u003c/strong> 「내가 보내는 {게시 받는 수량} {자산} → 받는 {게시 보내는 수량} {자산}」에 KRW 환산 「≈ {금액}원 상당」을 붙인다(ADM-03 시세 · 신청 시점 값 고정). 항목 5 수수료의 기준 수량이 이 값이다.\u003cbr>\u003cstrong>자릿수\u003c/strong> ETH 4 / USDC·USDT 2, 뒤 0 생략. 비율은 스테이블 페어 4자리와 ETH 페어 {스테이블}/ETH 2자리.\u003cbr>\u003cstrong>마스킹\u003c/strong> 게시자 상호는 확정 전까지 첫 글자만 노출하고(B***) \"KYC 완료 · 거래 안전성 검증 ✓\"를 붙인다. 확정 시 해제한다.\u003cbr>\u003cstrong>상태\u003c/strong> 로딩은 \"불러오는 중…\"이고 3초 초과 시 상단 배너와 값 \"—\"로 넘긴다.\u003cbr>\u003cspan class=\"basis\">근거 F-1b · 공통 포맷 · notation 채번·자릿수\u003c/span>\u003c/div>\n      \u003c/div>\n    \u003c/div>\n\n    \u003cdiv class=\"itm\" data-idx=\"1\">\n      \u003cdiv class=\"num\">2\u003c/div>\n      \u003cdiv>\n        \u003cdiv class=\"itm-title\">진행 스텝바 — 신청 → 협의중 → 확정 → 이전·완료 (표시 전용)\u003c/div>\n        \u003cdiv class=\"itm-desc\">\u003cstrong>구성\u003c/strong> 4단계 고정(신청 → 협의중 → 확정 → 이전·완료). 완료 스텝은 ✓ 초록, 현재 스텝은 파랑, 미도달은 회색으로 두고 스텝 클릭은 동작시키지 않는다.\u003cbr>\u003cstrong>스텝 위치\u003c/strong> 협의중 2 · 확정 3 · 이전 진행·완료 4. 종결 상태(거절됨·만료·종결)는 마지막 도달 스텝에서 멈추고 종결은 항목 3 상태 칩이 표시한다. 별도 종결 스텝은 두지 않는다.\u003cbr>\u003cstrong>범위\u003c/strong> 확정 이후 이전 단계 상세(양측 이전 지시·완결성·트래블룰)는 BRK-05가 담당하고 이 스텝바는 요약만 보여준다.\u003cbr>\u003cspan class=\"basis\">근거 09 §0 마목 게시 상태 개정\u003c/span>\u003c/div>\n      \u003c/div>\n    \u003c/div>\n\n    \u003cdiv class=\"itm\" data-idx=\"2\">\n      \u003cdiv class=\"num\">3\u003c/div>\n      \u003cdiv>\n        \u003cdiv class=\"itm-title\">상태 행 — 신청 시점 · 유효기한 · 상태 칩 (표시 전용)\u003c/div>\n        \u003cdiv class=\"itm-desc\">\u003cstrong>값\u003c/strong> 신청 유효기한은 신청 시점 + 영업일 {정책값 2영업일}(ADM-03)을 「YYYY-MM-DD HH:MM까지 (영업일 N일)」로 쓴다. 만료 임박 강조는 두지 않는다. 칩 색은 진행 노랑 · 완료 초록 · 종결 회색.\u003cbr>\u003cstrong>① 협의중\u003c/strong> 「협의중 · 게시자 수락 대기」 · 스텝 2 · 상호 마스킹 유지. 게시판에는 해당 게시가 협의중 칩으로 노출되어 추가 신청이 막힌다.\u003cbr>\u003cstrong>② 확정\u003c/strong> 게시자 수락 즉시 「확정 · {확정 일시}」 · 스텝 3 · 상대 상호 마스킹 해제 · 항목 4 링크 노출 · 이메일 ②(수락·확정) 수신.\u003cbr>\u003cstrong>③ 완료\u003c/strong> 양측 이전 완결 시 「완료 · {완료 일시}」 · 스텝 4 ✓ · 링크 유지 · 이메일 ③(거래 완료) 수신.\u003cbr>\u003cstrong>④ 거절됨\u003c/strong> 게시자 [거절] 시 「거절됨 · {일시}」 · 스텝 2 정지 · 사유는 표시하지 않는다(BRK-04에 사유 입력이 없다). 자산 이동·수수료 없음. 게시는 게재중으로 돌아가 재신청할 수 있다.\u003cbr>\u003cstrong>⑤ 만료\u003c/strong> 유효기한 경과 무응답 시 「만료 · {유효기한}」 · 스텝 2 정지 · 자산 이동·수수료 없음 · 게시는 게재중 복귀.\u003cbr>\u003cstrong>⑥ 종결\u003c/strong> 게시 측 사유로 자동 종결하고 사유를 병기한다 — 「종결 · 게시 회수」(이메일 ④) / 「종결 · 게시 중지」(price guard 게시 시점 대비 ±{정책값 2.0%} 이탈 · 양측 이메일) / 「종결 · 게시 유효기간 만료」. 스텝 2 정지 · 자산 이동·수수료 없음 · 재개는 게시자 재게시 후 재신청.\u003cbr>\u003cstrong>노출 금지\u003c/strong> 시세 소스명과 내부 사유는 넣지 않는다. ④⑤⑥ 종결 건은 대시보드 거래 내역에 남긴다.\u003cbr>\u003cspan class=\"chk\">[확인필요: 거절·만료 통지 이메일 — 공통 6종에 신설분 반영 여부]\u003c/span>\u003cbr>\u003cspan class=\"basis\">근거 09 §0 마목 게시 상태 개정 · 공통 UI 규격 상태 칩 · states.html\u003c/span>\u003c/div>\n      \u003c/div>\n    \u003c/div>\n\n    \u003cdiv class=\"itm\" data-idx=\"3\">\n      \u003cdiv class=\"num\">4\u003c/div>\n      \u003cdiv>\n        \u003cdiv class=\"itm-title\">[이전 진행 보기 →] 링크 (조건부 노출)\u003c/div>\n        \u003cdiv class=\"itm-desc\">\u003cstrong>노출\u003c/strong> 상태 ② 확정과 ③ 완료에서만 보인다. 다른 상태에서는 비활성 링크를 두지 않고 숨긴다.\u003cbr>\u003cstrong>클릭 가능\u003c/strong> 노출되면 항상 활성이다. 이 화면의 유일한 조작 요소다(GNB 제외).\u003cbr>\u003cstrong>확인 사항\u003c/strong> 없다. 확인 다이얼로그를 띄우지 않는다.\u003cbr>\u003cstrong>액션\u003c/strong> BRK-05로 이동한다. 라벨은 완료 상태에서도 \"이전 진행 보기 →\"로 고정한다.\u003cbr>\u003cspan class=\"basis\">근거 공통 UI 규격 행 클릭\u003c/span>\u003c/div>\n        \u003cdiv class=\"itm-nav\">\u003cspan class=\"nav-tag\">화면 이동 · 인터랙션\u003c/span>\n          \u003cdiv class=\"nav-row\">\u003cspan class=\"nav-el\">[이전 진행 보기 →]\u003c/span>\u003cspan class=\"nav-act\">클릭 · 확인 없음\u003c/span>\u003cspan class=\"nav-to\">\u003cstrong>이전·완료(BRK-05)\u003c/strong> — 같은 게시번호의 이전 상태(신청자 관점 수수료 7.98 USDC)\u003c/span>\u003c/div>\n        \u003c/div>\n      \u003c/div>\n    \u003c/div>\n\n    \u003cdiv class=\"itm\" data-idx=\"4\">\n      \u003cdiv class=\"num\">5\u003c/div>\n      \u003cdiv>\n        \u003cdiv class=\"itm-title\">내 중개 수수료 (표시 전용)\u003c/div>\n        \u003cdiv class=\"itm-desc\">\u003cstrong>값\u003c/strong> 수수료율 {정책값 1.00%}(ADM-03 · 거래액 기준 고정)를 내가 보내는 자산 수량(항목 1 내 기준 행)에 적용하고 각 자산 자릿수로 절사한다 — 798.40 USDC × 1% = 7.984 → 7.98 USDC.\u003cbr>\u003cstrong>노출 범위\u003c/strong> 자기 측 금액만 표시하고 상대측(게시자 8.00 USDT)은 노출하지 않는다.\u003cbr>\u003cstrong>접미\u003c/strong> 협의중은 \"— 확정 시 발생\", 확정·완료는 \"— 확정으로 발생 · 이전 시 정산\", 종결 3종은 \"— 발생하지 않음\".\u003cbr>\u003cstrong>정산 방식\u003c/strong> 별도 정산이다(2026-09-02 결정) — 내가 보내는 수량에서 공제하지 않는다.\u003cbr>\u003cspan class=\"basis\">근거 L6 설명의무 · 09 §0 마목 수수료 · notation 절사\u003c/span>\u003c/div>\n      \u003c/div>\n    \u003c/div>\n\n    \u003cdiv class=\"itm\" data-idx=\"5\">\n      \u003cdiv class=\"num\">6\u003c/div>\n      \u003cdiv>\n        \u003cdiv class=\"itm-title\">결과 통지 · 취소 없음 안내 (표시 전용)\u003c/div>\n        \u003cdiv class=\"itm-desc\">\u003cstrong>문구\u003c/strong> 고정이며 상태와 무관하게 상시 노출한다. 결과(수락·거절·만료·회수·중지)는 이메일과 이 화면 상태, 대시보드 거래 내역으로만 알린다. 협의·역제안 채널은 두지 않는다.\u003cbr>\u003cspan class=\"basis\">근거 V2(통신중개 아님)\u003c/span>\u003c/div>\n        \u003cdiv class=\"itm-nav\">\u003cspan class=\"nav-tag\">화면 이동 · 인터랙션\u003c/span>\n          \u003cdiv class=\"nav-row\">\u003cspan class=\"nav-el\">(액션 없음 — [신청 취소] 버튼 미제공)\u003c/span>\u003cspan class=\"nav-act\">기존 결정(상세 6): ① 유효기간이 영업일 {정책값 2영업일}로 짧아 만료로 정리 가능 ② 신청·취소 반복이 가격 신호·협의 채널처럼 작동할 소지 → 통신중개 오인 차단 ③ 상태 전이는 게시자 행위·기한 경과·게시 종결로만\u003c/span>\u003cspan class=\"nav-to stay\">화면 내 (이동 없음) · 종결은 거절·만료·게시 회수·게시 중지로만\u003c/span>\u003c/div>\n        \u003c/div>\n      \u003c/div>\n    \u003c/div>\n\n    \u003cdiv class=\"itm\" data-idx=\"6\">\n      \u003cdiv class=\"num\">7\u003c/div>\n      \u003cdiv>\n        \u003cdiv class=\"itm-title\">\"DSRV 비참여·기록만\" 고지 (표시 전용)\u003c/div>\n        \u003cdiv class=\"itm-desc\">\u003cstrong>문구\u003c/strong> 고정. BRK-03·04·06과 같은 계열 문구를 쓰고 변경은 법무 확인 후에 한다. 신청·수락 기록은 15년 보존한다.\u003cbr>\u003cspan class=\"basis\">근거 V2 · [로펌게이트] 비참여 범위\u003c/span>\u003c/div>\n      \u003c/div>\n    \u003c/div>\n  \u003c/div>\n\n\u003c/div>\n\n\u003csection class=\"footer-note\" style=\"padding-bottom:0;\">\n  \u003cdiv class=\"note-card\">\n    \u003cdiv class=\"note-title\">상세내용\u003c/div>\n    \u003cdiv class=\"detail-grid\" id=\"detailCol\">\n      \u003cdiv class=\"dtl\" data-idx=\"0\">\n        \u003cdiv class=\"detail-label\">\u003cspan class=\"dtl-num\">1\u003c/span>신청자 화면 3종의 역할\u003c/div>\n      \u003cdiv class=\"dtl-body\">\u003cspan class=\"box\">· BRK-03 신청하기(행위 · 신청 시점 거래 안전성 검증) → \u003cstrong>BRK-07 내 신청 상세\u003c/strong>(진행 조회) → BRK-05 이전·완료(확정 후, 양측 공용)\u003cbr>· 게시자 측 대칭 화면: BRK-06 내 게시 상세 ↔ BRK-04 받은 신청·수락\u003cbr>· 신청 접수 직후 BRK-01 복귀가 아니라 이 화면으로 진입(2026-09-02 변경) — 접수 확인·기한 안내를 한 번에\u003c/span>\u003c/div>\n      \u003c/div>\n      \u003cdiv class=\"dtl\" data-idx=\"2\">\n        \u003cdiv class=\"detail-label\">\u003cspan class=\"dtl-num\">3\u003c/span>신청 상태값(신청자 도메인) · 게시 상태·대시보드 매핑\u003c/div>\n      \u003cdiv class=\"dtl-body\">\u003cspan class=\"box\">· 신청 상태: 협의중(PENDING_ACCEPT) → 확정(CONFIRMED) → 완료(COMPLETED) / 종결: 거절됨(REJECTED) · 만료(EXPIRED) · 종결(CLOSED_BY_POSTING — 사유 코드: 회수 WITHDRAWN · 중지 SUSPENDED · 게시 만료 POSTING_EXPIRED)\u003cbr>· 게시 상태(BRK-06)와의 대응: 협의중 ↔ 협의중 · 확정 ↔ 확정 · 완료 ↔ 완료(거래) · 거절됨/만료 → 게시 게재중 복귀 · 종결 3종 ↔ 회수/중지/완료(유효기간 만료)\u003cbr>· DASH-01 거래 목록 상태 칩 매핑: 협의중 → '승인 대기' 계열, 확정 → '진행중', 완료 → '완료', 종결 3종·거절됨·만료 → '종결' \u003cspan class=\"chk\">[확인필요: 고객 화면 상태 enum 확정 — states.html 고객 도메인 섹션]\u003c/span>\u003cbr>· 상태 전이는 전부 게시자 행위(수락·거절·회수)·기한 경과·price guard — DSRV·시스템이 신청을 매칭·정리하지 않음\u003c/span>\u003c/div>\n      \u003c/div>\n      \u003cdiv class=\"dtl\" data-idx=\"5\">\n        \u003cdiv class=\"detail-label\">\u003cspan class=\"dtl-num\">6\u003c/span>신청 취소 미제공 근거 (기존 결정)\u003c/div>\n      \u003cdiv class=\"dtl-body\">\u003cspan class=\"box\">· 유효기간이 영업일 {정책값 2영업일}로 짧아 취소 없이 만료로 정리 가능\u003cbr>· 취소를 허용하면 신청·취소 반복(게시자 탐색·가격 신호)이 협의 채널처럼 작동할 소지 — 통신중개 오인 차단\u003cbr>· 동시 신청 1건 규칙(2026-09-02)과 결합 시 취소 허용은 \"게시 점유 → 취소\" 반복으로 다른 신청자 차단 수단이 될 수 있어 미제공 유지\u003cbr>· 허용으로 결정이 바뀌면: [신청 취소] 버튼(협의중 상태에서만 · 확인 다이얼로그) + 게시자 이메일 통지 + 이상거래 룰(반복 취소) 추가\u003c/span>\u003c/div>\n      \u003c/div>\n    \u003c/div>\n  \u003c/div>\n\u003c/section>\n\n\u003csection class=\"footer-note\">\n  \u003cdiv class=\"note-card\">\n    \u003cdiv class=\"note-title\">비고\u003c/div>\n    \u003cdiv class=\"note-body\">\n      · 2026-09-02 신설 — 종전에는 신청 후 신청자가 자기 건을 볼 화면이 없어 대시보드 목록 [확인필요]로만 남아 있었음.\u003cbr>\n      · \u003cstrong>[방어 핵심]\u003c/strong> 조회 전용 + 협의·역제안·취소 채널 없음 — 신청 후에는 게시자의 수락/거절과 기한 경과·게시 종결만 존재(통신중개 아님). 수수료는 확정 전 자기 측 금액으로 사전 고지(설명의무).\u003cbr>\n      · 2026-09-02 설명 형식 개정 적용(핀 = 조작 요소 단위) — 표시 6 · 링크 1 · 버튼 0 · 상태 변형은 프레임 추가 대신 항목 3 상태 목록 · '내 기준(신청자)' 행 추가로 수수료 기준 수량 명시.\u003cbr>\n      · \u003cspan class=\"chk\">[확인필요]\u003c/span> 거절·만료 통지 이메일 신설 여부 · 고객 화면 상태 enum(states.html 고객 도메인 섹션) · 수수료 차감 방식(BRK-05와 공통).\u003cbr>\n      · 다음: 확정 시 [이전 진행 보기] → 이전·완료 (BRK-05, 양측 공용) / 거절·만료·종결 시 대시보드 거래 내역에 잔존\n    \u003c/div>\n  \u003c/div>\n\u003c/section>\n\n\u003cscript src=\"screen.js\">\u003c/script>\n\u003c/body>\n\u003c/html>\n", "brk-04.html": "\u003c!DOCTYPE html>\n\u003chtml lang=\"ko\">\n\u003chead>\n\u003cmeta charset=\"UTF-8\">\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n\u003ctitle>화면기획 — 받은 신청·수락\u003c/title>\n\u003clink rel=\"stylesheet\" href=\"screen.css\">\n\u003c/head>\n\u003cbody>\n\n\u003cheader class=\"header\">\n  \u003cdiv class=\"crumb\">\u003cspan>마목 중개\u003c/span>\u003cspan class=\"s\">›\u003c/span>\u003cspan>교환게시판\u003c/span>\u003cspan class=\"s\">›\u003c/span>\u003cspan>내 게시\u003c/span>\u003cspan class=\"s\">›\u003c/span>\u003cspan>받은 신청·수락\u003c/span>\u003c/div>\n  \u003ch1 class=\"title\">받은 신청·수락\u003c/h1>\n  \u003cspan class=\"sid\">BRK-04\u003c/span>\n  \u003cspan class=\"defense\">수락 = 즉시 확정 · 게시자 능동 행위 · 자동 매칭 없음\u003c/span>\n\u003c/header>\n\n\u003cdiv class=\"main\">\n  \u003cdiv class=\"screen-panel\">\n    \u003cdiv style=\"position:relative;display:flex;\">\n      \u003cdiv class=\"labels\" id=\"labels\">\n        \u003cdiv class=\"lbl\">\u003cspan class=\"lbl-text\">전역\u003c/span>\u003c/div>\n        \u003cdiv class=\"lbl\">\u003cspan class=\"lbl-text\">내 게시 내역\u003c/span>\u003c/div>\n        \u003cdiv class=\"lbl\">\u003cspan class=\"lbl-text\">받은 신청\u003c/span>\u003c/div>\n        \u003cdiv class=\"lbl\">\u003cspan class=\"lbl-text\">수락·거절\u003c/span>\u003c/div>\n        \u003cdiv class=\"lbl\">\u003cspan class=\"lbl-text\">비참여 고지\u003c/span>\u003c/div>\n      \u003c/div>\n      \u003csvg id=\"bracketSvg\" width=\"24\" style=\"flex-shrink:0;overflow:visible;\">\u003c/svg>\n    \u003c/div>\n\n    \u003cdiv class=\"frame\" id=\"frame\">\n      \u003c!-- 전역: 콘솔 상단 + GNB (핀 없음 — nav-global 행으로 처리) -->\n      \u003cdiv class=\"zone\" data-idx=\"\">\n        \u003cdiv class=\"zone-highlight\">\u003c/div>\n        \u003cdiv class=\"c-top\" style=\"border-radius:8px 8px 0 0;\">\n          \u003cspan class=\"brand\" style=\"cursor:pointer;\">DSRV Desk\u003c/span>\n          \u003cspan class=\"meta\">\u003cspan class=\"c-badge\">B사 (게시자)\u003c/span>\u003c/span>\n        \u003c/div>\n        \u003cdiv class=\"c-adminbar\" style=\"margin:0;\">\n          \u003cspan class=\"m\">대시보드\u003c/span>\n          \u003cspan class=\"m\">교환하기\u003c/span>\n          \u003cspan class=\"m on\" style=\"background:#dbeafe;color:#1d4ed8;\">교환게시판\u003c/span>\n        \u003c/div>\n      \u003c/div>\n\n      \u003c!-- 내 게시 내역 (표시 전용) -->\n      \u003cdiv class=\"zone\" data-idx=\"0\">\n        \u003cdiv class=\"zone-highlight\">\u003c/div>\n        \u003cdiv class=\"item-area\" data-highlight=\"0\" style=\"position:relative;padding:4px;border-radius:8px;\">\n          \u003cdiv class=\"pin\" data-idx=\"0\" style=\"top:-6px;right:-6px;\">1\u003c/div>\n          \u003cdiv class=\"zone-title\">내 게시 — 교환거래 요청 내역\u003c/div>\n          \u003cdiv class=\"kv\">\u003cspan class=\"k\">요청번호\u003c/span>\u003cspan class=\"v\">BRK-20260830-0027\u003c/span>\u003c/div>\n          \u003cdiv class=\"kv\">\u003cspan class=\"k\">교환쌍 · 방향\u003c/span>\u003cspan class=\"v\">USDT → USDC\u003c/span>\u003c/div>\n          \u003cdiv class=\"kv\">\u003cspan class=\"k\">보내는 수량\u003c/span>\u003cspan class=\"v\">800 USDT\u003c/span>\u003c/div>\n          \u003cdiv class=\"kv
