const JS="// DSRV 교환·중개 화면기획 — 공통 인터랙션 (영역 브래킷 · 핀↔항목↔상세 연결선 · 클릭 하이라이트 · iframe 높이)\nfunction drawBrackets(){\n  const zones=[...document.querySelectorAll('.frame .zone')];\n  const labels=[...document.querySelectorAll('.lbl')];\n  const svg=document.getElementById('bracketSvg');\n  if(!zones.length||!svg) return;\n  let totalH=0;\n  zones.forEach((z,i)=>{ const h=z.offsetHeight; if(labels[i]) labels[i].style.height=h+'px'; totalH+=h; });\n  svg.setAttribute('height',totalH); svg.innerHTML='';\n  const mk=(tag,attrs)=>{const el=document.createElementNS('http://www.w3.org/2000/svg',tag);Object.entries(attrs).forEach(([k,v])=>el.setAttribute(k,v));return el;};\n  let y=0;\n  zones.forEach((z)=>{ const h=z.offsetHeight; const top=y+6,bot=y+h-6,x=4;\n    svg.appendChild(mk('line',{x1:x,y1:top,x2:x,y2:bot,stroke:'#bbb','stroke-width':'1'}));\n    svg.appendChild(mk('line',{x1:x,y1:top,x2:x+8,y2:top,stroke:'#bbb','stroke-width':'1'}));\n    svg.appendChild(mk('line',{x1:x,y1:bot,x2:x+8,y2:bot,stroke:'#bbb','stroke-width':'1'}));\n    y+=h;\n  });\n}\nfunction drawConnectors(){\n  const svg=document.getElementById('connSvg'); const main=document.querySelector('.main');\n  if(!svg||!main) return; svg.innerHTML=''; const mRect=main.getBoundingClientRect();\n  document.querySelectorAll('.pin').forEach(pin=>{\n    const idx=pin.dataset.idx; const itm=document.querySelector(`.itm[data-idx=\"${idx}\"]`); if(!itm) return;\n    const pRect=pin.getBoundingClientRect(); const iRect=itm.querySelector('.num').getBoundingClientRect();\n    if(iRect.left\u003cpRect.right) return; // 좁은 창에서 항목 컬럼이 프레임 아래로 접히면 연결선 생략\n    const line=document.createElementNS('http://www.w3.org/2000/svg','line');\n    line.setAttribute('x1',pRect.right-mRect.left+4); line.setAttribute('y1',pRect.top+pRect.height/2-mRect.top);\n    line.setAttribute('x2',iRect.left-mRect.left-4); line.setAttribute('y2',iRect.top+iRect.height/2-mRect.top);\n    line.setAttribute('stroke','#ccc'); line.setAttribute('stroke-width','1'); line.setAttribute('stroke-dasharray','4,3'); line.setAttribute('data-idx',idx);\n    svg.appendChild(line);\n  });\n}\nlet activeIdx=null;\nfunction selectItem(idx,fromTop){\n  if(activeIdx===idx){clearSelection();return;} clearSelection(); activeIdx=idx;\n  const pin=document.querySelector(`.pin[data-idx=\"${idx}\"]`); if(pin) pin.classList.add('active');\n  const area=document.querySelector(`.item-area[data-highlight=\"${idx}\"]`); if(area) area.style.outline='2px solid #2563eb';\n  document.querySelectorAll('.zone').forEach(z=>{ const list=(z.dataset.idx||'').split(',').filter(Boolean); if(list.length===1&&list.includes(String(idx))) z.classList.add('active'); });\n  const itm=document.querySelector(`.itm[data-idx=\"${idx}\"]`); if(itm) itm.classList.add('active');\n  const dtl=document.querySelector(`.dtl[data-idx=\"${idx}\"]`); if(dtl){dtl.classList.add('active'); if(fromTop&&dtl.closest('.detail-grid')) dtl.scrollIntoView({block:'nearest',behavior:'smooth'});}\n  const line=document.querySelector(`#connSvg line[data-idx=\"${idx}\"]`); if(line){line.setAttribute('stroke','#2563eb');line.setAttribute('stroke-width','1.5');}\n}\nfunction clearSelection(){\n  activeIdx=null;\n  document.querySelectorAll('.pin.active').forEach(p=>p.classList.remove('active'));\n  document.querySelectorAll('.zone.active').forEach(z=>z.classList.remove('active'));\n  document.querySelectorAll('.itm.active').forEach(i=>i.classList.remove('active'));\n  document.querySelectorAll('.dtl.active').forEach(d=>d.classList.remove('active'));\n  document.querySelectorAll('.item-area').forEach(a=>a.style.outline='none');\n  document.querySelectorAll('#connSvg line').forEach(l=>{l.setAttribute('stroke','#ccc');l.setAttribute('stroke-width','1');});\n}\ndocument.addEventListener('click',(e)=>{\n  const pin=e.target.closest('.pin'); const itm=e.target.closest('.itm'); const dtl=e.target.closest('.dtl');\n  if(pin){selectItem(pin.dataset.idx,true);return;}\n  if(itm&&itm.dataset.idx!==undefined){selectItem(itm.dataset.idx,true);return;}\n  if(dtl&&dtl.dataset.idx!==undefined){selectItem(dtl.dataset.idx);return;}\n  if(!e.target.closest('.zone')&&!e.target.closest('.itm')&&!e.target.closest('.dtl')) clearSelection();\n});\nfunction relayout(){drawBrackets();drawConnectors();reportH();}\nfunction reportH(){var h=Math.max(document.documentElement.scrollHeight,document.body.scrollHeight);window.parent&&window.parent.postMessage({type:\"iframeHeight\",h:h},\"*\");}\nwindow.addEventListener('load',()=>{relayout();setTimeout(relayout,300);setTimeout(relayout,900);});\nwindow.addEventListener('resize',relayout);\n\n// ── 목업 인터랙션 (어드민 화면 — 행 확장 · 드롭다운 · 관리 메뉴 이동) ──\nfunction mkCloseMenus(){document.querySelectorAll('.mk-menu').forEach(m=>m.hidden=true);}\nfunction mkToggleRow(row){\n  const key=row.dataset.exp; const wasOpen=row.classList.contains('open');\n  document.querySelectorAll('.mk-row.open').forEach(r=>r.classList.remove('open'));\n  document.querySelectorAll('.mk-exp').forEach(x=>x.hidden=true);\n  if(!wasOpen){row.classList.add('open');\n    const exp=document.querySelector('.mk-exp[data-exp=\"'+key+'\"]'); if(exp)exp.hidden=false;}\n  document.querySelectorAll('.mk-row').forEach(r=>{const c=r.querySelector('.mk-caret'); if(c)c.textContent=r.classList.contains('open')?'▼':'▶';});\n  relayout();\n}\nfunction mkPick(op){\n  const dd=op.closest('.mk-dd'); const menu=op.closest('.mk-menu');\n  menu.hidden=true;\n  const host=dd.parentElement; host.querySelectorAll('.mk-hint').forEach(h=>h.remove());\n  if(op.dataset.set){\n    const lab=dd.querySelector('.mk-lab'); if(lab)lab.textContent=op.dataset.set;\n    menu.querySelectorAll('.op').forEach(o=>o.classList.toggle('cur',o===op));\n    if(op.hasAttribute('data-dirty')){const t=dd.querySelector('.inp'); if(t)t.classList.add('mk-dirty');}\n  }\n  if(op.dataset.hint){const s=document.createElement('span');s.className='mk-hint';s.textContent=op.dataset.hint;dd.insertAdjacentElement('afterend',s);}\n  relayout();\n}\ndocument.addEventListener('click',(e)=>{\n  if(e.target.closest('.pin')) return;                      // 핀 클릭은 항목 선택 전용\n  const op=e.target.closest('.mk-menu .op'); if(op){mkPick(op);return;}\n  const dd=e.target.closest('.mk-dd');\n  if(dd){const m=dd.querySelector('.mk-menu'); const willOpen=m&&m.hidden; mkCloseMenus(); if(m)m.hidden=!willOpen; relayout(); return;}\n  mkCloseMenus();\n  const go=e.target.closest('[data-go]');\n  if(go){window.parent&&window.parent.postMessage({type:'navigate',pageId:go.dataset.go},'*');return;}\n  if(e.target.closest('.act,.field,.btn,.dl')) return;   // 처리 버튼·입력은 행 확장 대상 아님\n  const row=e.target.closest('.mk-row'); if(row){mkToggleRow(row);return;}\n});\ndocument.addEventListener('keydown',(e)=>{if(e.key==='Escape')mkCloseMenus();});\n";
const PROC="\u003c!DOCTYPE html>\n\u003chtml lang=\"ko\">\n\u003chead>\n\u003cmeta charset=\"UTF-8\">\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n\u003ctitle>화면 흐름도 — DSRV 교환·중개\u003c/title>\n\u003cstyle>\n  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap');\n  *{margin:0;padding:0;box-sizing:border-box;}\n  body{font-family:'Noto Sans KR',system-ui,sans-serif;background:#fafafa;color:#222;padding:28px 36px 60px;}\n  h1{font-size:20px;font-weight:800;margin-bottom:6px;}\n  .subtitle{font-size:12px;color:#888;margin-bottom:20px;}\n  .legend{display:flex;gap:22px;margin-bottom:24px;padding:12px 18px;background:#fff;border:1px solid #ddd;border-radius:8px;width:fit-content;}\n  .legend-item{display:flex;align-items:center;gap:8px;font-size:12px;color:#555;}\n  .legend-box{width:46px;height:26px;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:9px;}\n  .legend-box.page{border:1.5px solid #2563eb;background:#fff;color:#2563eb;}\n  .legend-box.question{width:26px;height:26px;border:1.5px solid #aaa;background:#fff;transform:rotate(45deg);flex-shrink:0;}\n  .legend-box.internal{background:#64748b;color:#fff;}\n\n  .section{margin-bottom:10px;border-bottom:1px solid #e0e0e0;padding-bottom:12px;overflow:visible;}\n  .section:last-child{border-bottom:none;}\n  .section-header{display:flex;align-items:center;gap:10px;font-size:13px;font-weight:800;color:#1d4ed8;margin-bottom:14px;padding:6px 12px;background:#eff6ff;border-radius:6px;width:fit-content;}\n  .section-header .tag{font-size:9px;font-weight:700;color:#92400e;background:#fef9ec;border:1px solid #fde68a;padding:1px 7px;border-radius:8px;}\n  .flow-scroll{overflow-x:auto;overflow-y:visible;padding-bottom:10px;}\n  .flow-row{display:flex;align-items:center;gap:0;min-width:max-content;padding:4px 0;}\n\n  .box{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;flex-shrink:0;position:relative;}\n  .box .name{font-size:11px;font-weight:600;line-height:1.3;white-space:nowrap;}\n  .box .pid{font-size:8px;color:#94a3b8;margin-top:2px;font-family:monospace;}\n  .box.page .inner{border:1.5px solid #93c5fd;background:#fff;border-radius:6px;padding:7px 12px 5px;min-height:40px;display:flex;flex-direction:column;align-items:center;justify-content:center;}\n  .box.page .inner:hover{border-color:#2563eb;box-shadow:0 2px 8px rgba(37,99,235,.15);}\n  .box.question{width:70px;height:70px;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;position:relative;}\n  .box.question .inner{position:absolute;width:50px;height:50px;background:#fff;border:1.5px solid #aaa;border-radius:3px;transform:rotate(45deg);display:flex;align-items:center;justify-content:center;}\n  .box.question .name{transform:rotate(-45deg);font-size:9px;font-weight:600;line-height:1.2;white-space:normal;width:44px;text-align:center;}\n  .box.internal .inner{background:#64748b;color:#fff;border-radius:6px;padding:7px 12px 5px;min-height:40px;display:flex;flex-direction:column;align-items:center;justify-content:center;}\n  .box.internal .name{color:#fff;}\n  .box.internal .pid{display:none;}\n\n  .arrow{display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:30px;flex-shrink:0;position:relative;height:40px;}\n  .arrow .line{width:18px;height:1.5px;background:#94a3b8;position:relative;}\n  .arrow .line::after{content:'';position:absolute;right:-4px;top:50%;transform:translateY(-50%);width:0;height:0;border:3px solid transparent;border-left:4px solid #94a3b8;}\n  .arrow .label{font-size:9px;color:#334155;white-space:nowrap;margin-bottom:1px;font-weight:600;}\n\n  .fork{display:flex;flex-direction:column;gap:6px;flex-shrink:0;overflow:visible;}\n  .fork-row{display:flex;align-items:center;gap:0;min-width:max-content;overflow:visible;}\n  .fork-line{width:18px;flex-shrink:0;align-self:stretch;position:relative;}\n  .fork-line::before{content:'';position:absolute;left:0;width:1.5px;background:#94a3b8;}\n  .fork-line.fork-top::before{top:50%;bottom:0;}\n  .fork-line.fork-bottom::before{top:0;bottom:50%;}\n  .fork-line.fork-mid::before{top:0;bottom:0;}\n  .fork-line::after{content:'';position:absolute;left:0;top:50%;transform:translateY(-50%);width:18px;height:1.5px;background:#94a3b8;}\n  .fork-line .fork-arrow{position:absolute;right:-4px;top:50%;transform:translateY(-50%);width:0;height:0;border:3px solid transparent;border-left:4px solid #94a3b8;}\n\n  .section-note{font-size:11px;color:#777;margin-top:6px;padding-left:8px;font-style:italic;}\n  .flow-scroll::-webkit-scrollbar{height:6px;}\n  .flow-scroll::-webkit-scrollbar-thumb{background:#ccc;border-radius:3px;}\n\n  .box.page-current .inner{border-color:#f59e0b !important;box-shadow:0 0 0 3px rgba(245,158,11,.25);background:#fffbeb;}\n  .box.page-current .pid{color:#d97706;font-weight:700;}\n  .box.page-current .name{color:#92400e;}\n\n  #floating-thumb{display:none;position:fixed;width:240px;height:150px;border:1px solid #ddd;border-radius:8px;overflow:hidden;background:#fff;box-shadow:0 4px 16px rgba(0,0,0,.2);z-index:9999;pointer-events:none;}\n  #floating-thumb iframe{width:500%;height:500%;transform:scale(0.2);transform-origin:top left;border:none;pointer-events:none;}\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\n\u003ch1>화면 흐름도 — DSRV 교환·중개\u003c/h1>\n\u003cdiv class=\"subtitle\">온보딩·로그인 → 대시보드 → 나목 교환(교환하기 탭) · 마목 중개(교환게시판 탭) → 관리자 · 박스 클릭 시 해당 화면으로 이동\u003c/div>\n\n\u003cdiv class=\"legend\">\n  \u003cdiv class=\"legend-item\">\u003cdiv class=\"legend-box page\">화면\u003c/div>\u003cspan>기획된 화면(클릭 이동)\u003c/span>\u003c/div>\n  \u003cdiv class=\"legend-item\">\u003cdiv class=\"legend-box question\">\u003c/div>\u003cspan>분기\u003c/span>\u003c/div>\n  \u003cdiv class=\"legend-item\">\u003cdiv class=\"legend-box internal\">처리\u003c/div>\u003cspan>내부 처리·상태\u003c/span>\u003c/div>\n\u003c/div>\n\n\u003cdiv id=\"floating-thumb\">\u003ciframe id=\"floating-thumb-iframe\" loading=\"lazy\">\u003c/iframe>\u003c/div>\n\u003cdiv id=\"diagram\">\u003c/div>\n\n\u003cscript>\nfunction page(name,pid){return {type:'page',name,pid};}\nfunction question(name){return {type:'question',name,pid:''};}\nfunction internal(name){return {type:'internal',name,pid:''};}\nfunction arrow(label){return {type:'arrow',label:label||''};}\nfunction fork(paths){return {type:'fork',paths};}\n\nconst sections = [\n  {\n    title:'⓪ 진입 — 온보딩·로그인', tag:'최초 1회 활성화 + 매 로그인',\n    note:'* 가입 완료 후 초대 이메일 링크로 계정 활성화 3화면(비밀번호 본인설정 → 2FA 앱 연결 → 복구 코드 저장) → 로그인(2단계 인증) → 홈. 셀프가입 없음(초대 기반). 초기 비밀번호 생성·전달 없음.',\n    rows:[{ type:'flow', items:[\n      internal('가입 완료\\n(계정 개설)'), arrow('초대 메일'),\n      page('초대 이메일','ONB-00'), arrow('링크 클릭'),\n      page('비밀번호 설정','ONB-01'), arrow('다음'),\n      page('2FA 앱 연결','ONB-02'), arrow('검증'),\n      page('복구 코드 저장','ONB-03'), arrow('완료'),\n      page('로그인','AUTH-01'), arrow('성공'),\n      page('대시보드','DASH-01'),\n      fork([\n        { label:'교환하기', items:[ page('교환하기','EXC-01') ] },\n        { label:'교환게시판', items:[ page('교환 게시판','BRK-01') ] },\n        { label:'계정·보안', items:[ page('비밀번호 수정','DASH-02') ] },\n        { label:'', items:[ page('2차 인증 재설정','DASH-03') ] },\n      ])\n    ]}]\n  },\n  {\n    title:'① 나목 교환 (DSRV가 상대방)', tag:'교환하기 탭',\n    note:'* 자동체결 거래소·MM 아님 — 오더북/상시 양방향 호가 없음, 단건 RFQ, 외부지표+고정 스프레드(가격형성 아님), 비율은 시스템 자동 산정(2026-09-02 확정), 체결은 수락 + 건별 수동 승인·집행. 건별 한도 1,500,000원 상당(KRW 환산) · 가용 풀 한도 내에서만 교환. 종결은 EXC-04 3변형 — 완료 / 거절 / 만료(2026-09-02(8)). 거절 배너는 주체를 구분한다(「거절 (DSRV 심사)」 / 「거절 (고객 요청)」) · 거절 ⑤ · 만료 ⑥ 이메일 발송(2026-09-02(10)). 관리자 보류는 고객에게 노출하지 않고 EXC-03 「거래 진행중」으로 유지.',\n    rows:[{ type:'flow', items:[\n      page('대시보드','DASH-01'), arrow('교환하기'),\n      page('교환하기','EXC-01'), arrow('비율 요청'),\n      page('비율 확인·수락','EXC-02'),\n      fork([\n        { label:'수락', items:[ page('승인 진행','EXC-03'), arrow('DSRV 승인·집행'), page('내역 — 완료','EXC-04') ] },\n        { label:'거절\\n(고객·DSRV)', items:[ page('내역 — 거절','EXC-04') ] },\n        { label:'만료·이탈·\\n풀 부족', items:[ page('내역 — 만료','EXC-04') ] },\n      ])\n    ]}]\n  },\n  {\n    title:'② 마목 중개 — 게시(RFQ 등록)', tag:'교환게시판 탭',\n    note:'* 단순 게시판 아님(4요소: 거래 안전성 검증·KYC담보·정산연계·수수료). 게시 시 보유·처분권 게이트 + 편차 경고 + 시세변동 자동중지(내부 정책)·유효기간 30일 · 건별 한도 1,500,000원 상당(공통). 게시 회수는 BRK-06(게시자 능동 행위) · 회수 시 대기 신청 종결 + 이메일 ④. price guard 자동중지 시 대기 신청 전부 종결 + 양측 이메일. 자동 매칭·자동 체결 없음.',\n    rows:[{ type:'flow', items:[\n      page('대시보드','DASH-01'), arrow('교환게시판'),\n      page('교환 게시판','BRK-01'), arrow('+ 거래의향 등록'),\n      page('거래의향 등록','BRK-02'), arrow('게이트 통과\\n게시(단독)'),\n      page('내 게시 상세·회수','BRK-06'),\n      fork([\n        { label:'신청 도착', items:[ page('받은 신청·수락','BRK-04') ] },\n        { label:'게시 내리기', items:[ internal('회수 — 게시판 제외\\n자산이동·수수료 없음') ] },\n        { label:'시세변동·\\n유효기간 30일', items:[ internal('자동중지(내부 정책) /\\n완료(유효기간 만료)') ] },\n      ])\n    ]}]\n  },\n  {\n    title:'③ 마목 중개 — 수락(기존 RFQ 거래)', tag:'교환게시판 탭',\n    note:'* DSRV 비참여·기록만(당사자 간 신청·수락, 역제안 없음). 신청 유효 영업일 2일 — 기한 내 수락(가입자 단독 실행 — 1기관 1가입자, 2026-09-01) 시 즉시 확정·구속력 발생 → 커스터디 콜드 수동 이전(양건 확인 후 순차)·수수료 = 거래액 1% 고정·양측 각자(2026-09-02 확정). 이메일 통지 6종(신청 접수 ① · 수락·확정 ② · 거래 완료 ③ · 게시 회수 ④ · 거래 거절 ⑤ · 거래 만료 ⑥ — ⑤⑥은 2026-09-02(10) 신설, 나목 교환 대상 · 마목 신청 거절·만료 메일은 [확인필요]). 신청자 진행 조회 BRK-07 · 게시자 회수 BRK-06(2026-09-02 추가).',\n    rows:[{ type:'flow', items:[\n      page('교환 게시판','BRK-01'), arrow('행 선택·신청'),\n      page('신청하기','BRK-03'), arrow('신청 접수\\n(유효 영업일 2일)'),\n      page('내 신청 상세','BRK-07'), arrow('게시자 측\\nBRK-06 → 신청 선택'),\n      page('받은 신청·수락','BRK-04'),\n      fork([\n        { label:'수락\\n(즉시 확정)', items:[ page('이전·완료','BRK-05') ] },\n        { label:'거절·만료', items:[ internal('신청 종결 — 자산이동·수수료 없음\\n게시는 게재중 복귀') ] },\n      ])\n    ]}]\n  },\n  {\n    title:'④ 지갑·자산 — 별도 화면 없음 (입금은 대시보드 · 출금/이전은 서면 절차)', tag:'대시보드 → 지갑 잔고',\n    note:'* 고객 화면은 조회·입금까지만 — 출금/이전 요청은 커스터디 수탁 지갑의 서면 절차로 접수(온라인 화면 없음, 2026-09-01 제거). 화이트리스트는 내부 관리(고객·어드민 화면 없음). WAL-01 삭제(2026-09-01) — 입금 전용 주소는 대시보드 지갑 잔고 하단에 전문 표시(QR·말줄임 없음). 집행은 DSRV 어드민 홈(ADM-02) 처리함 승인 + 콜드 2인 멀티시그(커스터디 운영절차).',\n    rows:[{ type:'flow', items:[\n      page('대시보드','DASH-01'), arrow('출금/이전 필요 시'),\n      internal('서면 요청 접수\\n(커스터디 절차 · 오프라인)'), arrow(),\n      internal('DSRV 승인(ADM-02 처리함)\\n→ 콜드 집행(커스터디 절차)')\n    ]}]\n  },\n  {\n    title:'⑤ 관리자 (DSRV Admin)', tag:'고객사 노출 없음',\n    note:'* 개편 2026-09-01 — 어드민 2화면. 홈(ADM-02)의 알람·워닝 처리함이 EXC-03·BRK-04·출금 건 승인, 격리·동결, 잠금 해제의 처리처이고 조회성 데이터는 CSV 다운로드 6종(기관-가입자·거래 요청·통합 거래·구분회계·3면 대사·열람 기록). 설정(ADM-03)이 EXC-02·BRK-02 등 표출값의 단일 출처 + 기관·가입자 관리(기관당 1명). 처리함·집행 대기는 진입·새로고침 시에만 조회하고 자동 주기 갱신을 두지 않는다(2026-09-02(11)).',\n    rows:[{ type:'flow', items:[\n      page('어드민 홈\\n(알람·워닝 + CSV)','ADM-02'), arrow('정책·기관 관리'),\n      page('설정','ADM-03')\n    ]}]\n  },\n];\n\nconst FILE_MAP = {\n  'ONB-00':'onb-00.html','ONB-01':'onb-01.html','ONB-02':'onb-02.html','ONB-03':'onb-03.html','ONB-04':'onb-04.html','AUTH-01':'auth-01.html','AUTH-02':'auth-02.html','DASH-01':'dash-01.html','DASH-02':'dash-02.html','DASH-03':'dash-03.html',\n  'EXC-01':'exc-01.html','EXC-02':'exc-02.html','EXC-03':'exc-03.html','EXC-04':'exc-04.html',\n  'BRK-01':'brk-01.html','BRK-02':'brk-02.html','BRK-03':'brk-03.html','BRK-04':'brk-04.html','BRK-05':'brk-05.html','BRK-06':'brk-06.html','BRK-07':'brk-07.html',\n  'ADM-02':'adm-02.html','ADM-03':'adm-03.html',\n};\n\nconst diagram = document.getElementById('diagram');\n\nfunction renderItem(item){\n  if(item.type==='arrow'){\n    const el=document.createElement('div'); el.className='arrow';\n    if(item.label){const lbl=document.createElement('div');lbl.className='label';lbl.innerHTML=item.label.replace(/\\n/g,'\u003cbr>');el.appendChild(lbl);}\n    const line=document.createElement('div');line.className='line';el.appendChild(line);\n    return el;\n  }\n  const wrapper=document.createElement('div'); wrapper.className='box '+item.type;\n  const inner=document.createElement('div'); inner.className='inner';\n  const nameEl=document.createElement('div'); nameEl.className='name'; nameEl.innerHTML=item.name.replace(/\\n/g,'\u003cbr>'); inner.appendChild(nameEl);\n  if(item.pid){const pidEl=document.createElement('div');pidEl.className='pid';pidEl.textContent=item.pid;inner.appendChild(pidEl);}\n  if(item.type==='page'&&item.pid){\n    inner.style.cursor='pointer';\n    inner.onclick=()=>{ if(window.parent!==window) window.parent.postMessage({type:'navigate',pageId:item.pid},'*'); };\n  }\n  wrapper.appendChild(inner);\n  if(item.type==='page'&&item.pid&&FILE_MAP[item.pid]){wrapper.dataset.thumbSrc=FILE_MAP[item.pid];wrapper.dataset.thumbPid=item.pid;}\n  return wrapper;\n}\nfunction renderItems(items,container){ items.forEach(item=>{\n  if(item.type==='fork'){renderFork(item,container);return;}\n  const el=renderItem(item); if(el) container.appendChild(el);\n});}\nfunction renderFork(forkData,container){\n  const forkDiv=document.createElement('div'); forkDiv.className='fork';\n  const n=forkData.paths.length;\n  forkData.paths.forEach((path,idx)=>{\n    const rowDiv=document.createElement('div'); rowDiv.className='fork-row';\n    const fl=document.createElement('div'); fl.className='fork-line '+(idx===0?'fork-top':idx===n-1?'fork-bottom':'fork-mid');\n    const fa=document.createElement('div'); fa.className='fork-arrow'; fl.appendChild(fa); rowDiv.appendChild(fl);\n    if(path.label){const lbl=document.createElement('span');lbl.style.cssText='font-size:9px;color:#334155;font-weight:700;padding:0 5px;white-space:pre-line;align-self:center;text-align:center;';lbl.textContent=path.label;rowDiv.appendChild(lbl);}\n    renderItems(path.items,rowDiv);\n    if(path.subfork) renderFork(path.subfork,rowDiv);\n    forkDiv.appendChild(rowDiv);\n  });\n  container.appendChild(forkDiv);\n}\n\nsections.forEach(sec=>{\n  const sectionDiv=document.createElement('div'); sectionDiv.className='section';\n  const header=document.createElement('div'); header.className='section-header';\n  const t=document.createElement('span'); t.textContent=sec.title; header.appendChild(t);\n  if(sec.tag){const tg=document.createElement('span');tg.className='tag';tg.textContent=sec.tag;header.appendChild(tg);}\n  sectionDiv.appendChild(header);\n  const scrollDiv=document.createElement('div'); scrollDiv.className='flow-scroll';\n  const flowContainer=document.createElement('div'); flowContainer.className='flow-row';\n  sec.rows.forEach(row=>{ if(row.type==='flow') renderItems(row.items,flowContainer); });\n  scrollDiv.appendChild(flowContainer); sectionDiv.appendChild(scrollDiv);\n  if(sec.note){const nd=document.createElement('div');nd.className='section-note';nd.textContent=sec.note;sectionDiv.appendChild(nd);}\n  diagram.appendChild(sectionDiv);\n});\n\n// 부모에서 현재 화면 하이라이트\nwindow.addEventListener('message',(e)=>{\n  if(!e.data||e.data.type!=='highlightPage')return;\n  document.querySelectorAll('.box.page-current').forEach(el=>el.classList.remove('page-current'));\n  const pid=e.data.pid; if(!pid)return;\n  document.querySelectorAll(`.box[data-thumb-pid=\"${pid}\"]`).forEach(el=>{\n    el.classList.add('page-current');\n    el.scrollIntoView({behavior:'smooth',block:'center',inline:'center'});\n  });\n});\n\n// floating 섬네일 hover\nconst floatThumb=document.getElementById('floating-thumb');\nconst floatIframe=document.getElementById('floating-thumb-iframe');\nlet currentSrc='';\ndocument.addEventListener('mouseover',(e)=>{\n  const box=e.target.closest('.box[data-thumb-src]'); if(!box)return;\n  const src=box.dataset.thumbSrc; if(src!==currentSrc){floatIframe.removeAttribute('src');floatIframe.srcdoc=(window.SCREEN_DOCS&&window.SCREEN_DOCS[src])||'';currentSrc=src;}\n  const r=box.getBoundingClientRect(); const tw=240,th=150;\n  let top=r.top-th-8; if(top\u003c8) top=r.bottom+8;\n  let left=r.left+r.width/2-tw/2; left=Math.max(8,Math.min(left,window.innerWidth-tw-8));\n  floatThumb.style.top=top+'px'; floatThumb.style.left=left+'px'; floatThumb.style.display='block';\n});\ndocument.addEventListener('mouseout',(e)=>{\n  const box=e.target.closest('.box[data-thumb-src]'); if(!box)return;\n  if(box.contains(e.relatedTarget))return;\n  floatThumb.style.display='none';\n});\n\u003c/script>\n\u003cscript>window.addEventListener('message',function(e){if(e.data&&e.data.type==='screenDocs')window.SCREEN_DOCS=e.data.docs;});\u003c/script>\n\u003c/body>\n\u003c/html>\n";
const IA="\u003c!DOCTYPE html>\n\u003chtml lang=\"ko\">\n\u003chead>\n\u003cmeta charset=\"UTF-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n\u003ctitle>IA — 정보구조 (교환·중개 콘솔)\u003c/title>\n\u003cstyle>\n  @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');\n  * { margin:0; padding:0; box-sizing:border-box; }\n  body { font-family:'Pretendard', system-ui, -apple-system, sans-serif; background:#fafafa; color:#1e293b;\n         font-size:13px; line-height:1.6; padding:28px 32px 60px; }\n  .doc-head { max-width:1060px; margin:0 auto 22px; }\n  .doc-head h1 { font-size:19px; font-weight:800; letter-spacing:-.01em; }\n  .doc-head .sub { font-size:11.5px; color:#64748b; margin-top:3px; }\n  .cols { max-width:1060px; margin:0 auto; display:grid; grid-template-columns:1fr 1fr; gap:20px; align-items:start; }\n  @media (max-width:900px){ .cols { grid-template-columns:1fr; } }\n  .panel { background:#fff; border:1px solid #e2e8f0; border-radius:10px; padding:18px 20px 20px; }\n  .panel-title { font-size:13.5px; font-weight:800; display:flex; align-items:baseline; gap:8px; margin-bottom:4px; }\n  .panel-title .scope { font-size:10px; font-weight:600; color:#64748b; }\n  .panel-note { font-size:10.5px; color:#94a3b8; margin-bottom:12px; }\n\n  ul.tree { list-style:none; }\n  ul.tree ul { list-style:none; margin-left:14px; padding-left:14px; border-left:1.5px solid #e2e8f0; }\n  ul.tree li { margin:7px 0; }\n  .node { font-weight:700; font-size:12.5px; color:#0f172a; }\n  .node .lv { display:inline-block; font-size:9px; font-weight:700; color:#64748b; background:#f1f5f9;\n              border:1px solid #e2e8f0; border-radius:4px; padding:0 6px; margin-right:6px; vertical-align:1px; }\n  .node .lv.gnb { color:#1d4ed8; background:#eff6ff; border-color:#bfdbfe; }\n  .node .lv.tab { color:#7c2d12; background:#fff7ed; border-color:#fed7aa; }\n  .desc { display:block; font-size:10.5px; font-weight:400; color:#94a3b8; margin-top:1px; }\n\n  .scr { display:inline-flex; align-items:baseline; gap:5px; background:#fff; border:1px solid #cbd5e1;\n         border-radius:6px; padding:2px 8px; margin:2px 4px 2px 0; cursor:pointer; font-size:11px; color:#334155;\n         transition:all .12s; text-decoration:none; }\n  .scr:hover { border-color:#3b82f6; background:#eff6ff; color:#1d4ed8; }\n  .scr .sid { font-family:ui-monospace, Consolas, monospace; font-size:9px; font-weight:700; color:#94a3b8; }\n  .scr:hover .sid { color:#3b82f6; }\n  .arr { color:#94a3b8; font-size:11px; padding:0 2px; }\n  .need { display:inline-block; font-size:9.5px; font-weight:700; color:#888; background:#f2f2f2;\n          border-radius:5px; padding:0 6px; margin-left:4px; vertical-align:1px; }\n  .flowline { margin-top:4px; display:flex; flex-wrap:wrap; align-items:center; row-gap:3px; }\n\n  .foot { max-width:1060px; margin:20px auto 0; background:#fbfbf9; border:1px solid #e7e5e0; border-radius:10px;\n          padding:12px 16px; font-size:11px; color:#64748b; }\n  .foot b { color:#334155; }\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\n\u003cdiv class=\"doc-head\">\n  \u003ch1>IA — 정보구조\u003c/h1>\n  \u003cdiv class=\"sub\">교환(나목)·교환 중개(마목) 콘솔 · 화면 21개 · GNB 확정 2026-09-01 (대시보드 · 교환하기 · 교환게시판) · 2026-09-02 BRK-06·07 추가 · 계정 활성화 3화면 분리(ONB-01·02·03) · 화면 박스 클릭 시 해당 화면기획으로 이동\u003c/div>\n\u003c/div>\n\n\u003cdiv class=\"cols\">\n\n  \u003c!-- 고객 콘솔 -->\n  \u003cdiv class=\"panel\">\n    \u003cdiv class=\"panel-title\">고객 콘솔 — DSRV Desk \u003cspan class=\"scope\">초대 기반 · 국내 법인 전용\u003c/span>\u003c/div>\n    \u003cdiv class=\"panel-note\">로그인 전 진입은 GNB 밖(초대 링크·로그인). 로그인 후 GNB 3개 메뉴.\u003c/div>\n    \u003cul class=\"tree\">\n      \u003cli>\n        \u003cspan class=\"node\">\u003cspan class=\"lv\">진입\u003c/span>인증·온보딩 \u003cspan class=\"desc\">GNB 밖 · 셀프가입 없음(초대만)\u003c/span>\u003c/span>\n        \u003cdiv class=\"flowline\">\n          \u003cspan class=\"scr\" data-pid=\"ONB-00\">\u003cspan class=\"sid\">ONB-00\u003c/span>초대 이메일\u003c/span>\u003cspan class=\"arr\">→\u003c/span>\n          \u003cspan class=\"scr\" data-pid=\"ONB-01\">\u003cspan class=\"sid\">ONB-01\u003c/span>비밀번호 설정\u003c/span>\u003cspan class=\"arr\">→\u003c/span>\n          \u003cspan class=\"scr\" data-pid=\"ONB-02\">\u003cspan class=\"sid\">ONB-02\u003c/span>2FA 앱 연결\u003c/span>\u003cspan class=\"arr\">→\u003c/span>\n          \u003cspan class=\"scr\" data-pid=\"ONB-03\">\u003cspan class=\"sid\">ONB-03\u003c/span>복구 코드 저장\u003c/span>\u003cspan class=\"arr\">→\u003c/span>\n          \u003cspan class=\"scr\" data-pid=\"AUTH-01\">\u003cspan class=\"sid\">AUTH-01\u003c/span>로그인\u003c/span>\u003cspan class=\"arr\">→\u003c/span>\n          \u003cspan class=\"scr\" data-pid=\"AUTH-02\">\u003cspan class=\"sid\">AUTH-02\u003c/span>2차 인증\u003c/span>\n        \u003c/div>\n        \u003cdiv class=\"flowline\" style=\"margin-top:4px;\">\n          \u003cspan class=\"scr\" data-pid=\"ONB-00\">\u003cspan class=\"sid\">ONB-00\u003c/span>초대 이메일\u003c/span>\u003cspan class=\"arr\">→\u003c/span>\n          \u003cspan class=\"scr\" data-pid=\"ONB-04\">\u003cspan class=\"sid\">ONB-04\u003c/span>초대 링크 오류\u003c/span>\n          \u003cspan class=\"desc\" style=\"margin-left:6px;\">토큰 만료·이미 사용됨 통합 · 종결 화면(조작 요소 없음 · 재발급은 ADM-03 초대 재발송)\u003c/span>\n        \u003c/div>\n      \u003c/li>\n      \u003cli>\n        \u003cspan class=\"node\">\u003cspan class=\"lv gnb\">GNB 1\u003c/span>대시보드\u003c/span>\n        \u003cdiv class=\"flowline\">\u003cspan class=\"scr\" data-pid=\"DASH-01\">\u003cspan class=\"sid\">DASH-01\u003c/span>거래현황·계정·활동로그\u003c/span>\u003c/div>\n        \u003cul>\n          \u003cli>\n            \u003cspan class=\"node\">계정·보안 \u003cspan class=\"desc\">대시보드 내 계정 영역에서 진입\u003c/span>\u003c/span>\n            \u003cdiv class=\"flowline\">\n              \u003cspan class=\"scr\" data-pid=\"DASH-02\">\u003cspan class=\"sid\">DASH-02\u003c/span>비밀번호 수정\u003c/span>\n              \u003cspan class=\"scr\" data-pid=\"DASH-03\">\u003cspan class=\"sid\">DASH-03\u003c/span>2차 인증 재설정\u003c/span>\n            \u003c/div>\n          \u003c/li>\n          \u003cli>\n            \u003cspan class=\"node\">지갑·자산 \u003cspan class=\"desc\">별도 화면 없음 — 입금 주소는 대시보드 지갑 잔고 하단(WAL-01 삭제), 출금/이전은 서면 절차, 화이트리스트는 내부 관리\u003c/span>\u003c/span>\n          \u003c/li>\n        \u003c/ul>\n      \u003c/li>\n      \u003cli>\n        \u003cspan class=\"node\">\u003cspan class=\"lv gnb\">GNB 2\u003c/span>교환하기 \u003cspan class=\"desc\">나목 — DSRV가 상대방 · 단건 RFQ · 종결은 EXC-04 3변형(완료 · 거절 · 만료)\u003c/span>\u003c/span>\n        \u003cdiv class=\"flowline\">\n          \u003cspan class=\"scr\" data-pid=\"EXC-01\">\u003cspan class=\"sid\">EXC-01\u003c/span>교환하기\u003c/span>\u003cspan class=\"arr\">→\u003c/span>\n          \u003cspan class=\"scr\" data-pid=\"EXC-02\">\u003cspan class=\"sid\">EXC-02\u003c/span>비율 확인·수락\u003c/span>\u003cspan class=\"arr\">→\u003c/span>\n          \u003cspan class=\"scr\" data-pid=\"EXC-03\">\u003cspan class=\"sid\">EXC-03\u003c/span>승인 진행\u003c/span>\u003cspan class=\"arr\">→\u003c/span>\n          \u003cspan class=\"scr\" data-pid=\"EXC-04\">\u003cspan class=\"sid\">EXC-04\u003c/span>내역·완료\u003c/span>\n        \u003c/div>\n      \u003c/li>\n      \u003cli>\n        \u003cspan class=\"node\">\u003cspan class=\"lv gnb\">GNB 3\u003c/span>교환게시판 \u003cspan class=\"desc\">마목 — 법인 간 중개 · DSRV 비당사자\u003c/span>\u003c/span>\n        \u003cdiv class=\"flowline\">\u003cspan class=\"scr\" data-pid=\"BRK-01\">\u003cspan class=\"sid\">BRK-01\u003c/span>교환 게시판\u003c/span>\u003c/div>\n        \u003cul>\n          \u003cli>\n            \u003cspan class=\"node\">게시 (RFQ 등록)\u003c/span>\n            \u003cdiv class=\"flowline\">\u003cspan class=\"scr\" data-pid=\"BRK-02\">\u003cspan class=\"sid\">BRK-02\u003c/span>거래의향 등록\u003c/span>\u003cspan class=\"arr\">→\u003c/span>\u003cspan class=\"scr\" data-pid=\"BRK-06\">\u003cspan class=\"sid\">BRK-06\u003c/span>내 게시 상세·회수\u003c/span>\u003c/div>\n          \u003c/li>\n          \u003cli>\n            \u003cspan class=\"node\">신청·수락 (기존 RFQ 거래)\u003c/span>\n            \u003cdiv class=\"flowline\">\n              \u003cspan class=\"scr\" data-pid=\"BRK-03\">\u003cspan class=\"sid\">BRK-03\u003c/span>신청하기\u003c/span>\u003cspan class=\"arr\">→\u003c/span>\n              \u003cspan class=\"scr\" data-pid=\"BRK-07\">\u003cspan class=\"sid\">BRK-07\u003c/span>내 신청 상세\u003c/span>\u003cspan class=\"arr\">→\u003c/span>\n              \u003cspan class=\"scr\" data-pid=\"BRK-04\">\u003cspan class=\"sid\">BRK-04\u003c/span>받은 신청·수락\u003c/span>\u003cspan class=\"arr\">→\u003c/span>\n              \u003cspan class=\"scr\" data-pid=\"BRK-05\">\u003cspan class=\"sid\">BRK-05\u003c/span>이전·완료\u003c/span>\n            \u003c/div>\n          \u003c/li>\n        \u003c/ul>\n      \u003c/li>\n    \u003c/ul>\n  \u003c/div>\n\n  \u003c!-- 관리자 콘솔 -->\n  \u003cdiv class=\"panel\">\n    \u003cdiv class=\"panel-title\">관리자 콘솔 — DSRV Admin \u003cspan class=\"scope\">내부 전용 · PAM 세션·녹화\u003c/span>\u003c/div>\n    \u003cdiv class=\"panel-note\">관리 메뉴 탭 2개 — 처리할 일만 홈 알람·워닝, 조회는 CSV 다운로드 6종, 설정·기관 관리는 설정 (개편 2026-09-01). 처리함은 진입·새로고침 시에만 조회한다(자동 갱신 없음 · 2026-09-02(11)).\u003c/div>\n    \u003cul class=\"tree\">\n      \u003cli>\n        \u003cspan class=\"node\">\u003cspan class=\"lv tab\">탭 1\u003c/span>홈\u003c/span>\n        \u003cdiv class=\"flowline\">\u003cspan class=\"scr\" data-pid=\"ADM-02\">\u003cspan class=\"sid\">ADM-02\u003c/span>어드민 홈\u003c/span>\u003c/div>\n      \u003c/li>\n      \u003cli>\n        \u003cspan class=\"node\">\u003cspan class=\"lv tab\">탭 2\u003c/span>설정\u003c/span>\n        \u003cdiv class=\"flowline\">\u003cspan class=\"scr\" data-pid=\"ADM-03\">\u003cspan class=\"sid\">ADM-03\u003c/span>설정\u003c/span>\u003c/div>\n      \u003c/li>\n    \u003c/ul>\n  \u003c/div>\n\n\u003c/div>\n\n\u003cdiv class=\"foot\">\n  \u003cb>기준·비고\u003c/b> — GNB 메뉴명 확정 2026-09-01 (대시보드 · 교환하기 · 교환게시판) · 화면 ID·명칭은 index.html 목록과 동일 ·\n  ADM 탭 구성은 홈·설정 2탭(개편 2026-09-01 — 구 ADM-04~08 삭제, 조회는 CSV 다운로드).\n  ADM-01은 존재하지 않음(결번). 흐름(화살표)은 대표 경로만 표기 — 상세 분기는 화면 흐름도(process) 참조. 화면 표기·공통 UI 규격은 표기 규칙(notation), 상태 전이는 states 참조. 기준 2026-09-02 — 건별 한도 1,500,000원 상당 · 이메일 통지 6종 · 나목 고객 '보류' 라벨 폐지.\n\u003c/div>\n\n\u003cscript>\ndocument.querySelectorAll('.scr[data-pid]').forEach(el => {\n  el.addEventListener('click', () => {\n    window.parent.postMessage({ type: 'navigate', pageId: el.dataset.pid }, '*');\n  });\n});\n\u003c/script>\n\u003c/body>\n\u003c/html>\n";
const GLOSS="\u003c!DOCTYPE html>\n\u003chtml lang=\"ko\">\n\u003chead>\n\u003cmeta charset=\"UTF-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n\u003ctitle>표기 규칙 (교환·중개 콘솔)\u003c/title>\n\u003cstyle>\n  @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');\n  * { margin:0; padding:0; box-sizing:border-box; }\n  body { font-family:'Pretendard', system-ui, -apple-system, sans-serif; background:#fafafa; color:#1e293b;\n         font-size:13px; line-height:1.6; padding:28px 32px 60px; }\n  .doc-head { max-width:1060px; margin:0 auto 18px; }\n  .doc-head h1 { font-size:19px; font-weight:800; letter-spacing:-.01em; }\n  .doc-head .sub { font-size:11.5px; color:#64748b; margin-top:3px; }\n\n  .tbl-wrap { max-width:1060px; margin:0 auto; background:#fff; border:1px solid #e2e8f0; border-radius:10px;\n              overflow-x:auto; }\n  table { width:auto; max-width:100%; border-collapse:collapse; table-layout:auto; }\n  th { text-align:left; font-size:10.5px; font-weight:700; color:#64748b; background:#f8fafc;\n       padding:9px 14px; border:1px solid #d4d4d4; white-space:nowrap; }\n  td { padding:10px 14px; border:1px solid #d4d4d4; vertical-align:top; font-size:12.5px; }\n  td.grp-cell { font-weight:800; color:#0f172a; white-space:nowrap; background:#fcfcfb; }\n  td.item { font-weight:700; color:#0f172a; white-space:nowrap; }\n  .ex { font-family:ui-monospace, 'SF Mono', Consolas, monospace; font-size:11px; background:#f1f5f9;\n        border:1px solid #e2e8f0; border-radius:4px; padding:0 5px; white-space:nowrap; }\n  b.key { color:#1d4ed8; }\n  .need { display:inline-block; font-size:9.5px; font-weight:700; color:#888; background:#f2f2f2;\n          border-radius:5px; padding:0 6px; margin-left:4px; vertical-align:1px; }\n\n  .foot { max-width:1060px; margin:16px auto 0; background:#fbfbf9; border:1px solid #e7e5e0; border-radius:10px;\n          padding:12px 16px; font-size:11px; color:#64748b; }\n  .foot b { color:#334155; }\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\n\u003cdiv class=\"doc-head\">\n  \u003ch1>표기 규칙\u003c/h1>\n  \u003cdiv class=\"sub\">화면·문서·CSV 공통 표기 기준 · 현재 화면 21개에서 실제 사용 중인 표기를 집계해 정리 (2026-09-01 · 09-02 개정 — 한도 원화 표기 · 공통 UI 규격 · 전역 이동 기재 규칙 · 항목설명 기재(입력창 6슬롯·버튼 4단계) · 정책값 현재값 병기 · 편의기능 축소) · 규칙을 바꾸면 이 표를 먼저 고치고 화면을 일괄 수정\u003c/div>\n\u003c/div>\n\n\u003cdiv class=\"tbl-wrap\">\n\u003ctable>\n  \u003cthead>\n    \u003ctr>\u003cth>구분\u003c/th>\u003cth>항목\u003c/th>\u003cth>규칙\u003c/th>\u003cth>예시\u003c/th>\u003c/tr>\n  \u003c/thead>\n  \u003ctbody>\n    \u003ctr>\n      \u003ctd class=\"grp-cell\" rowspan=\"4\">날짜·시간\u003c/td>\n      \u003ctd class=\"item\">날짜 (화면)\u003c/td>\n      \u003ctd>\u003cb class=\"key\">YYYY-MM-DD\u003c/b> — 하이픈 구분, 연도 4자리\u003c/td>\n      \u003ctd>\u003cspan class=\"ex\">2026-09-01\u003c/span>\u003c/td>\n    \u003c/tr>\n    \u003ctr>\n      \u003ctd class=\"item\">일시 (화면)\u003c/td>\n      \u003ctd>YYYY-MM-DD HH:MM — \u003cb class=\"key\">24시간제\u003c/b>, 분 단위(초 생략)\u003c/td>\n      \u003ctd>\u003cspan class=\"ex\">2026-08-31 14:22\u003c/span>\u003c/td>\n    \u003c/tr>\n    \u003ctr>\n      \u003ctd class=\"item\">일시 (CSV·보고서)\u003c/td>\n      \u003ctd>ISO 8601 \u003cb class=\"key\">YYYY-MM-DDTHH:MM:SS+09:00\u003c/b> — 초 단위, 오프셋 명기\u003c/td>\n      \u003ctd>\u003cspan class=\"ex\">2026-08-31T14:22:05+09:00\u003c/span>\u003c/td>\n    \u003c/tr>\n    \u003ctr>\n      \u003ctd class=\"item\">타임존\u003c/td>\n      \u003ctd>\u003cb class=\"key\">KST(UTC+9) 고정\u003c/b> — 화면에는 별도 표기 없음, CSV는 +09:00으로 명기\u003c/td>\n      \u003ctd>—\u003c/td>\n    \u003c/tr>\n    \u003ctr>\n      \u003ctd class=\"grp-cell\" rowspan=\"5\">수량·자산\u003c/td>\n      \u003ctd class=\"item\">수량 (화면)\u003c/td>\n      \u003ctd>천 단위 쉼표 · 소수점 아래 \u003cb class=\"key\">자산별 최대 자릿수 — ETH 4자리 · USDC·USDT 2자리\u003c/b>(2026-09-02 확정 · 종전 \"최대 6자리\" 폐기 · ETH 4자리 = 0.0001 ETH ≈ 400원대로 천원 미만 분해능(ETH 3,000~3,500 USD · 1 USD ≈ 1,350원 가정), ETH 시세 약 9,500,000원 초과 시 5자리 재검토) · 불필요한 뒤 0 생략(입력 중에는 입력값 그대로) · 숫자와 티커 사이 공백 1칸 · 통화기호(₩·$) 사용 안 함 · 온체인 decimals(ETH 18 · USDC/USDT 6)와 별개의 UI 규칙\u003c/td>\n      \u003ctd>\u003cspan class=\"ex\">900 USDC\u003c/span> \u003cspan class=\"ex\">899.82 USDT\u003c/span> \u003cspan class=\"ex\">0.3489 ETH\u003c/span>\u003c/td>\n    \u003c/tr>\n    \u003ctr>\n      \u003ctd class=\"item\">수량 (CSV)\u003c/td>\n      \u003ctd>쉼표·통화기호 없음 — 단위는 자산 열이 정함\u003c/td>\n      \u003ctd>\u003cspan class=\"ex\">900.00\u003c/span> · \u003cspan class=\"ex\">0.3140\u003c/span>\u003c/td>\n    \u003c/tr>\n    \u003ctr>\n      \u003ctd class=\"item\">입력 자릿수·절사\u003c/td>\n      \u003ctd>입력: 숫자·소수점만 허용, 자산별 최대 자릿수 \u003cb class=\"key\">초과 입력은 무시(차단)\u003c/b> · 천 단위 쉼표 자동 삽입 · 산정값(받는 수량·수수료)은 \u003cb class=\"key\">해당 자산 자릿수로 절사(내림)\u003c/b> — 반올림 아님 · \u003cb class=\"key\">KRW 환산액은 원 단위 절사\u003c/b>(소수 없음 · 천 단위 쉼표 · 2026-09-02(9))\u003c/td>\n      \u003ctd>\u003cspan class=\"ex\">333.33 USDC × 0.9998 = 333.26 USDT\u003c/span> (333.263334 절사) · \u003cspan class=\"ex\">0.3 ETH × 1% = 0.003 ETH\u003c/span> · \u003cspan class=\"ex\">0.3489 ETH × 1% = 0.0034 ETH\u003c/span> (0.003489 절사)\u003c/td>\n    \u003c/tr>\n    \u003ctr>\n      \u003ctd class=\"item\">자산명\u003c/td>\n      \u003ctd>티커 \u003cb class=\"key\">대문자\u003c/b> · 복수 나열은 가운뎃점(·)\u003c/td>\n      \u003ctd>\u003cspan class=\"ex\">ETH · USDC · USDT\u003c/span>\u003c/td>\n    \u003c/tr>\n    \u003ctr>\n      \u003ctd class=\"item\">한도 (KRW 환산)\u003c/td>\n      \u003ctd>「\u003cb class=\"key\">{금액}원 상당\u003c/b>」 — 건별 한도는 \u003cb class=\"key\">원화\u003c/b> 환산액으로 표기(2026-09-02(9) · 종전 USD 상당 표기 폐기) · 환산 시세 = ADM-03 시세 소스의 KRW 시세 · 요청 시점 · ETH·스테이블 모두 환산(USD 1:1 아님) · 원 단위 절사\u003c/td>\n      \u003ctd>\u003cspan class=\"ex\">1,500,000원 상당\u003c/span>\u003c/td>\n    \u003c/tr>\n    \u003ctr>\n      \u003ctd class=\"grp-cell\" rowspan=\"2\">비율\u003c/td>\n      \u003ctd class=\"item\">교환비율 (화면)\u003c/td>\n      \u003ctd>스테이블 페어(USDC↔USDT): 「\u003cb class=\"key\">{비율} {받는코인}/{주는코인}\u003c/b>」 소수 4자리 · ETH 페어(ETH↔USDC·ETH↔USDT): \u003cb class=\"key\">방향 무관 「{비율} {스테이블}/ETH」\u003c/b>(1 ETH당 스테이블 수량) 소수 2자리 (2026-09-02 개정 — USDC→ETH를 받는/주는으로 쓰면 0.0003…이 되어 4자리 표현 불가) · 스프레드와 항상 별도 항목\u003c/td>\n      \u003ctd>\u003cspan class=\"ex\">0.9989 USDT/USDC\u003c/span> (USDC → USDT) · \u003cspan class=\"ex\">1.0000 USDC/USDT\u003c/span> (USDT → USDC) · \u003cspan class=\"ex\">3,184.00 USDC/ETH\u003c/span> (ETH → USDC와 USDC → ETH 공통)\u003c/td>\n    \u003c/tr>\n    \u003ctr>\n      \u003ctd class=\"item\">교환비율 (CSV)\u003c/td>\n      \u003ctd>단위 없이 숫자만 · 자릿수는 화면 규칙과 동일(스테이블 페어 4 · ETH 페어 2) · 받는 수량 = 스테이블 페어: 보내는 × 비율 / ETH 페어: ETH→스테이블은 ETH × 비율, 스테이블→ETH는 스테이블 ÷ 비율 — 결과는 받는 자산 자릿수로 절사\u003c/td>\n      \u003ctd>\u003cspan class=\"ex\">0.9989\u003c/span> · \u003cspan class=\"ex\">3184.00\u003c/span>\u003c/td>\n    \u003c/tr>\n    \u003ctr>\n      \u003ctd class=\"grp-cell\" rowspan=\"2\">스프레드\u003c/td>\n      \u003ctd class=\"item\">스프레드 (화면)\u003c/td>\n      \u003ctd>퍼센트 \u003cb class=\"key\">소수 2자리\u003c/b> — 비율과 합쳐 쓰지 않고 별도 항목\u003c/td>\n      \u003ctd>\u003cspan class=\"ex\">0.10%\u003c/span>\u003c/td>\n    \u003c/tr>\n    \u003ctr>\n      \u003ctd class=\"item\">스프레드 (CSV)\u003c/td>\n      \u003ctd>퍼센트가 아닌 \u003cb class=\"key\">소수 4자리 소수\u003c/b>로 기재\u003c/td>\n      \u003ctd>\u003cspan class=\"ex\">0.0010\u003c/span> (= 0.10%)\u003c/td>\n    \u003c/tr>\n    \u003ctr>\n      \u003ctd class=\"grp-cell\" rowspan=\"5\">식별자 (채번)\u003c/td>\n      \u003ctd class=\"item\">교환 거래\u003c/td>\n      \u003ctd>\u003cb class=\"key\">EXC-YYYYMMDD-NNNN\u003c/b> — 요청일 + 당일 일련번호 4자리 · 화면 표기 채번 (2026-09-01 통일, 종전 CSV 정의 EXC-YYYY-NNNNNN 폐기)\u003c/td>\n      \u003ctd>\u003cspan class=\"ex\">EXC-20260831-0142\u003c/span>\u003c/td>\n    \u003c/tr>\n    \u003ctr>\n      \u003ctd class=\"item\">중개 거래(마목)\u003c/td>\n      \u003ctd>\u003cb class=\"key\">BRK-YYYYMMDD-NNNN\u003c/b> — 게시일 + 당일 일련번호 4자리 · 게시(RFQ)·신청·이전이 같은 번호를 공유 (2026-09-02 추가 — 화면 BRK-03~05·DASH-01 기존 사용 표기를 규칙화)\u003c/td>\n      \u003ctd>\u003cspan class=\"ex\">BRK-20260830-0027\u003c/span>\u003c/td>\n    \u003c/tr>\n    \u003ctr>\n      \u003ctd class=\"item\">법인(고객사)\u003c/td>\n      \u003ctd>ORG-\u003cb class=\"key\">NNNN\u003c/b> — 예시 서술에서만 ORG-A·B·C 가명 사용\u003c/td>\n      \u003ctd>\u003cspan class=\"ex\">ORG-0001\u003c/span>\u003c/td>\n    \u003c/tr>\n    \u003ctr>\n      \u003ctd class=\"item\">승인자(내부)\u003c/td>\n      \u003ctd>DSRV-OPS-\u003cb class=\"key\">NN\u003c/b> · 복수는 세미콜론(;) 연결(CSV)\u003c/td>\n      \u003ctd>\u003cspan class=\"ex\">DSRV-OPS-01;DSRV-OPS-02\u003c/span>\u003c/td>\n    \u003c/tr>\n    \u003ctr>\n      \u003ctd class=\"item\">화면 ID\u003c/td>\n      \u003ctd>{영역}-NN — ONB·AUTH·DASH·EXC·BRK·ADM · \u003cb class=\"key\">ADM-01은 결번\u003c/b> · WAL 영역은 2026-09-01 삭제(결번) · BRK-06·07은 2026-09-02 추가(번호는 추가 순 — 흐름 순서 아님)\u003c/td>\n      \u003ctd>\u003cspan class=\"ex\">EXC-01\u003c/span>\u003c/td>\n    \u003c/tr>\n    \u003ctr>\n      \u003ctd class=\"grp-cell\" rowspan=\"2\">주소·해시\u003c/td>\n      \u003ctd class=\"item\">지갑주소·tx 해시 (화면)\u003c/td>\n      \u003ctd>앞 \u003cb class=\"key\">0x + 4자 … 뒤 4자\u003c/b> 마스킹 — 말줄임 문자는 U+2026(…) · 예외: 입금 전용 자체 지갑 주소(DASH-01 지갑 잔고)는 \u003cb class=\"key\">전문 표기\u003c/b>(2026-09-01)\u003c/td>\n      \u003ctd>\u003cspan class=\"ex\">0x9f3a…d81c\u003c/span>\u003c/td>\n    \u003c/tr>\n    \u003ctr>\n      \u003ctd class=\"item\">지갑주소·tx 해시 (CSV·감사기록)\u003c/td>\n      \u003ctd>\u003cb class=\"key\">전체 표기\u003c/b>(마스킹 없음) — 16진수 소문자\u003c/td>\n      \u003ctd>\u003cspan class=\"ex\">0x9f3a…(전체)\u003c/span>\u003c/td>\n    \u003c/tr>\n    \u003ctr>\n      \u003ctd class=\"grp-cell\" rowspan=\"2\">상태값\u003c/td>\n      \u003ctd class=\"item\">화면\u003c/td>\n      \u003ctd>\u003cb class=\"key\">한글 라벨\u003c/b> 배지\u003c/td>\n      \u003ctd>\u003cspan class=\"ex\">완료\u003c/span> \u003cspan class=\"ex\">승인 대기\u003c/span>\u003c/td>\n    \u003c/tr>\n    \u003ctr>\n      \u003ctd class=\"item\">CSV·시스템 코드\u003c/td>\n      \u003ctd>영문 \u003cb class=\"key\">대문자\u003c/b> 코드\u003c/td>\n      \u003ctd>\u003cspan class=\"ex\">COMPLETED\u003c/span> \u003cspan class=\"ex\">CANCELED\u003c/span>\u003c/td>\n    \u003c/tr>\n  \u003c/tbody>\n\u003c/table>\n\u003c/div>\n\n\u003cdiv class=\"doc-head\" style=\"margin-top:26px;\">\n  \u003ch1 style=\"font-size:16px;\">공통 UI 규격\u003c/h1>\n  \u003cdiv class=\"sub\">전 화면 공통 동작·문구 기준 (2026-09-02 확정 — \"규격은 공통으로\") · 화면별 기획서에는 예외만 적고, 여기 없는 동작은 디자이너·개발자가 이 표를 따른다\u003c/div>\n\u003c/div>\n\u003cdiv class=\"tbl-wrap\">\n\u003ctable>\n  \u003cthead>\n    \u003ctr>\u003cth>구분\u003c/th>\u003cth>항목\u003c/th>\u003cth>규칙\u003c/th>\u003cth>적용·예시\u003c/th>\u003c/tr>\n  \u003c/thead>\n  \u003ctbody>\n    \u003ctr>\n      \u003ctd class=\"grp-cell\" rowspan=\"4\">전역 내비게이션\u003c/td>\n      \u003ctd class=\"item\">로그아웃\u003c/td>\n      \u003ctd>상단바 우측 \u003cb class=\"key\">기관 배지 클릭 → 메뉴(로그아웃)\u003c/b> — 전 화면 동일 위치, 확인 문구 없음 · 세션 즉시 파기\u003c/td>\n      \u003ctd>→ AUTH-01 · 어드민 콘솔도 동일(→ 어드민 로그인)\u003c/td>\n    \u003c/tr>\n    \u003ctr>\n      \u003ctd class=\"item\">뒤로가기\u003c/td>\n      \u003ctd>브라우저 뒤로가기 \u003cb class=\"key\">전 화면 미지원\u003c/b> — \"접근할 수 없는 화면입니다\" 안내 후 대시보드 이동 · 화면 이동은 GNB·화면 내 버튼으로만 (DASH-01 항목 5 규칙)\u003c/td>\n      \u003ctd>→ DASH-01\u003c/td>\n    \u003c/tr>\n    \u003ctr>\n      \u003ctd class=\"item\">종료 동선\u003c/td>\n      \u003ctd>flow 마지막 화면의 \u003cb class=\"key\">[확인]\u003c/b> = 대시보드 이동 · 입력·행위 화면의 \u003cb class=\"key\">[취소]\u003c/b>(ghost) = 입력값 파기 후 직전 목록 화면 복귀, 확인 문구 없음\u003c/td>\n      \u003ctd>EXC-03·04·BRK-05 [확인] → DASH-01 · BRK-02·03 [취소] → BRK-01 · BRK-04 [취소] → BRK-06 · DASH-02·03 [취소] → DASH-01 (2026-09-02 추가 — 뒤로가기 미지원 규칙은 유지)\u003c/td>\n    \u003c/tr>\n    \u003ctr>\n      \u003ctd class=\"item\">기재 규칙\u003c/td>\n      \u003ctd>같은 프레임(셸)을 쓰는 화면군은 '진입 · 전역 이동'의 이동 표를 \u003cb class=\"key\">화면기획서 순서에서 그 프레임이 처음 나오는 화면에만 한 번\u003c/b> 적는다 — 나머지 화면은 \"프레임 동작은 ○○(화면 ID)의 표와 같다\" 한 줄 + \u003cb>다른 점만\u003c/b>(현재 탭 위치 · 입력 중 값 파기 여부 · 상세 화면의 탭 재클릭 동작 등) · 진입 경로는 화면마다 그대로 적는다 · 이 블록에는 \u003cb>진입 경로와 프레임 단위 이동만\u003c/b> 적고, 화면 안 요소의 동작 · 정책 수치 · 목업 예시 · 결정 이력은 항목설명·비고에 적는다(2026-09-02)\u003c/td>\n      \u003ctd>정본 3종 — 인증 셸(브랜드 패널 2단 프레임) \u003cb>ONB-01\u003c/b>(ONB-02·03·04 · AUTH-01·02 · DASH-02·03) · 고객 콘솔 셸 \u003cb>DASH-01\u003c/b>(EXC-01~04 · BRK-01~07) · 어드민 셸 \u003cb>ADM-02\u003c/b>(ADM-03) · ONB-00은 메일 프레임 단독 (2026-09-02 · 인증 셸 정본을 AUTH-01에서 순서상 첫 화면인 ONB-01로 이동)\u003c/td>\n    \u003c/tr>\n    \u003ctr>\n      \u003ctd class=\"grp-cell\" rowspan=\"3\">항목설명 기재\u003c/td>\n      \u003ctd class=\"item\">입력창\u003c/td>\n      \u003ctd>라벨 6개 순서 고정 — \u003cb class=\"key\">입력 가능 → 허용 문자 → 검증(시점·주체) → 실패 처리 → 연동 → 저장(선택)\u003c/b> · 1(입력 가능)·5(연동)는 해당 없어도 \"항상 가능하다\" / \"없음\"으로 명시, 2~4는 해당 없을 때 줄 생략 · desc = 규칙, nav-row = 이벤트→결과(중복 금지) · 규칙 번호 ①②③과 nav-row 실패 행 1:1\u003c/td>\n      \u003ctd>정본·예시 \u003cspan class=\"ex\">_TEMPLATE_component.md\u003c/span> §1 (EXC-01 수량 입력) · \u003cb>전 화면 적용 완료\u003c/b>(2026-09-02 · 21화면)\u003c/td>\n    \u003c/tr>\n    \u003ctr>\n      \u003ctd class=\"item\">버튼\u003c/td>\n      \u003ctd>라벨 4개 순서 고정 — \u003cb class=\"key\">노출 → 클릭 가능 → 확인 사항 → 액션\u003c/b> · 1(노출)은 해당 없어도 \"항상 보인다\", 3(확인 사항)은 \"없다. 확인 다이얼로그를 띄우지 않는다\"로 명시 · 생략 가능한 줄은 2(= 항상 활성)만 · 노출과 클릭 가능을 반드시 구분(조건부 노출을 비활성으로 잘못 구현하는 것 방지) · \u003cb>드롭다운(▾)도 버튼 템플릿\u003c/b> — 옵션은 '옵션' 줄, 입력창의 '허용 문자'로 쓰지 않음 · nav-row는 기존 3행(활성 조건 / 클릭(활성) / 실패) 유지\u003c/td>\n      \u003ctd>정본·예시 \u003cspan class=\"ex\">_TEMPLATE_component.md\u003c/span> §2 (EXC-01 [거래 요청]) · \u003cb>전 화면 적용 완료\u003c/b>(2026-09-02 · 21화면)\u003c/td>\n    \u003c/tr>\n    \u003ctr>\n      \u003ctd class=\"item\">정책값 표기\u003c/td>\n      \u003ctd>ADM-03 파라미터로 바뀔 수 있는 값은 \u003cb class=\"key\">매번 현재값을 병기\u003c/b> — \u003cspan class=\"ex\">{정책값 1,500,000원 상당}\u003c/span> · \u003cspan class=\"ex\">{정책값 5회}\u003c/span> · \u003cspan class=\"ex\">{정책값 72시간}\u003c/span> · 중괄호 안 '정책값' 토큰 유지(검색용) · 값 없는 \u003cspan class=\"ex\">{정책값}\u003c/span> 단독 표기는 폐기 (2026-09-02 사용자 결정)\u003c/td>\n      \u003ctd>값이 바뀌면 화면 전부 일괄 치환 — 검색 키 \"정책값\"\u003c/td>\n    \u003c/tr>\n    \u003ctr>\n      \u003ctd class=\"grp-cell\" rowspan=\"4\">버튼·확인\u003c/td>\n      \u003ctd class=\"item\">비활성(disabled)\u003c/td>\n      \u003ctd>회색 배경·회색 글자·\u003cb class=\"key\">cursor not-allowed\u003c/b>, 클릭 무반응 · 비활성 \u003cb>사유는 툴팁이 아니라 인라인 경고\u003c/b>로 버튼 위에 표시(EXC-01 패턴) · 툴팁·hover 설명 사용 안 함\u003c/td>\n      \u003ctd>\u003cspan class=\"ex\">.btn.disabled\u003c/span> · EXC-01 [거래 요청] — 자산 미선택·수량 미입력·한도·풀 초과·KYC 배너 노출 중 · EXC-01 받는 자산 ▾ — 보내는 자산 선택 전\u003c/td>\n    \u003c/tr>\n    \u003ctr>\n      \u003ctd class=\"item\">드롭다운(선택 목록)\u003c/td>\n      \u003ctd>클릭 → 목록 펼침(현재 선택 강조) · 항목 클릭 시 선택·닫힘 · 바깥 클릭/ESC 닫힘 · 미선택 상태는 회색 안내 문구(\"자산 선택\") · \u003cb class=\"key\">자산 쌍은 보내는 자산 먼저\u003c/b> — 받는 자산 ▾는 보내는 자산 선택 전 비활성, 목록에서 보내는 자산 제외(동일 자산 구조적 불가) · 보내는 자산 변경 시 받는 자산·수량 초기화 (2026-09-02 확정)\u003c/td>\n      \u003ctd>EXC-01 · BRK-02 자산 선택 · ADM-03 시세 소스·상태 변경\u003c/td>\n    \u003c/tr>\n    \u003ctr>\n      \u003ctd class=\"item\">확인 다이얼로그\u003c/td>\n      \u003ctd>\u003cb class=\"key\">구속력·비가역 행위 직전에만\u003c/b> 모달 확인 — 제목(행위명) + 결과 1~2문장 + [실행]/[돌아가기] · 그 외(취소·거절·저장)는 확인 없음\u003c/td>\n      \u003ctd>BRK-03 신청 · BRK-04 수락 · BRK-06 게시 내리기 · ADM-02 승인/거절/이전 중지 · \u003cb class=\"key\">EXC-02 [수락]은 확인 없음\u003c/b>(클릭 즉시 확정 — 참고·확정 비율 2회 고지로 대체, 2026-09-02)\u003c/td>\n    \u003c/tr>\n    \u003ctr>\n      \u003ctd class=\"item\">단독 실행 표기\u003c/td>\n      \u003ctd>가입자 1인 단독 실행 화면은 버튼 아래 \u003cb class=\"key\">결과 고지 1문장\u003c/b>(즉시 확정·구속력·수수료) 상시 노출 — 승인자 지정·2단계 승인 UI 없음(1기관 1가입자)\u003c/td>\n      \u003ctd>BRK-03·04 하단 문구\u003c/td>\n    \u003c/tr>\n    \u003ctr>\n      \u003ctd class=\"grp-cell\" rowspan=\"5\">상태 표시\u003c/td>\n      \u003ctd class=\"item\">빈 상태\u003c/td>\n      \u003ctd>목록·표 대신 점선 박스 + \u003cb class=\"key\">\"…이(가) 없습니다\"\u003c/b> 문구 1줄 + 다음 행동 안내 1줄 · 일러스트·아이콘 없음\u003c/td>\n      \u003ctd>BRK-01 \"게시된 거래의향이 없습니다\" · BRK-06 \"받은 신청이 없습니다\" · DASH-01 \"거래 내역이 없습니다\"\u003c/td>\n    \u003c/tr>\n    \u003ctr>\n      \u003ctd class=\"item\">로딩\u003c/td>\n      \u003ctd>영역 단위 \u003cb class=\"key\">\"불러오는 중…\"\u003c/b> 텍스트(스피너 없음, 스켈레톤 없음) · 3초 초과 시 오류 규격으로 전환\u003c/td>\n      \u003ctd>목록·잔고·시세 영역\u003c/td>\n    \u003c/tr>\n    \u003ctr>\n      \u003ctd class=\"item\">오류 문구\u003c/td>\n      \u003ctd>① 입력 오류 = 필드 아래 \u003cb class=\"key\">빨간 인라인 박스\u003c/b>(⚠ + 원인 + 해결 행동) ② 시스템 오류 = 상단 배너 \"일시적인 오류입니다. 잠시 후 다시 시도해 주세요\" ③ 권한·상태 게이팅 = 상단 배너(G-3 KYC 패턴) · \u003cb>내부 사유·AML 심사 내용 미노출\u003c/b> · 다른 관리자·다른 세션이 먼저 바꾼 경쟁 상태도 ②와 같은 배너 1종으로 처리하고 최신 값을 다시 불러온다 — 경쟁 전용 문구는 두지 않는다(2026-09-02(11))\u003c/td>\n      \u003ctd>EXC-01 한도·풀 초과 · EXC-01 KYC 배너 · EXC-04 '거절' 일반화 사유\u003c/td>\n    \u003c/tr>\n    \u003ctr>\n      \u003ctd class=\"item\">상태 칩\u003c/td>\n      \u003ctd>한글 라벨 배지(표기 규칙) · 색 3계열만 — 진행(노랑)·대기(파랑)·완료(초록), 종결·거절은 회색 · \u003cb>나목 고객 라벨 6종 확정\u003c/b> — 요청됨 / 비율 제시 / 진행 중 / 완료 / 거절 / 만료(관리자 '보류'는 고객에게 노출하지 않고 '진행 중'으로 표시 · 2026-09-02(8))\u003c/td>\n      \u003ctd>DASH-01 진행중 / 승인 대기 / 완료 · 마목 게시 상태: 게재중 / \u003cb>협의중\u003c/b>(신청 1건 접수·추가 신청 차단) / 확정 / 완료 / 회수 / \u003cb>중지\u003c/b>(price guard — 대기 신청 전부 종결) (2026-09-02 확정)\u003c/td>\n    \u003c/tr>\n    \u003ctr>\n      \u003ctd class=\"item\">완료 피드백\u003c/td>\n      \u003ctd>행위 결과는 \u003cb class=\"key\">토스트\u003c/b> 1개 또는 복귀 화면 상단 \u003cb class=\"key\">배너\u003c/b> 1개로만 알린다 · 배너는 \u003cb>닫기 버튼도 자동 닫힘도 없는 고정 배너\u003c/b> — 다음 조회·이동 시 사라진다 · 자동 닫힘 타이머를 두지 않는다(2026-09-02(11))\u003c/td>\n      \u003ctd>BRK-06 회수 완료 배너 · ADM-03 저장 토스트 · ADM-02 처리 결과 토스트\u003c/td>\n    \u003c/tr>\n    \u003ctr>\n      \u003ctd class=\"grp-cell\" rowspan=\"3\">목록\u003c/td>\n      \u003ctd class=\"item\">정렬·필터·페이징\u003c/td>\n      \u003ctd>\u003cb class=\"key\">없음\u003c/b> — 최신순 단일 리스트, 전체 나열(자동 매칭·조건 검색 부재 담보, BRK-01 결정) · 전량 표시 · 페이지 스크롤 — 페이지네이션·[더 보기]·무한 스크롤을 두지 않는다(2026-09-02 사용자 결정 · 종전 \"100행 초과 시 더 보기\" 폐기)\u003c/td>\n      \u003ctd>BRK-01 · DASH-01 · ADM-02 처리함·집행 대기 · ADM-03 기관 목록\u003c/td>\n    \u003c/tr>\n    \u003ctr>\n      \u003ctd class=\"item\">행 클릭\u003c/td>\n      \u003ctd>행 전체가 클릭 영역 · 이동 목적지는 각 화면 「화면 이동·인터랙션」 표에 명시 · 선택 불가 행(만료 등)은 회색 처리·클릭 무반응 · 타사 게시 '협의중'은 \u003cb class=\"key\">행 클릭 가능 — 상세(BRK-03) 열림, [이 조건으로 신청] 비활성 + 인라인 안내 \"협의 중인 게시입니다\"\u003c/b>(2026-09-02 개정)\u003c/td>\n      \u003ctd>BRK-01 → BRK-03/06 · DASH-01 → EXC-03/04·BRK-05/06/07\u003c/td>\n    \u003c/tr>\n    \u003ctr>\n      \u003ctd class=\"item\">갱신\u003c/td>\n      \u003ctd>\u003cb class=\"key\">화면 진입 시와 브라우저 새로고침 시에만 조회\u003c/b> — 자동 주기 갱신·폴링·푸시·신규 유입 토스트를 두지 않는다 · 화면 안에서 누른 버튼의 결과만 즉시 반영한다 · 시세·풀·비율 같은 외부 값도 자산 선택 시 1회 조회하고 체류 중 다시 조회하지 않는다 · CSV·명세 파일은 클릭 시 전체 기간을 1파일로 동기 생성한다(비동기 생성·완료 알림 없음) (2026-09-02(11))\u003c/td>\n      \u003ctd>ADM-02 처리함 · DASH-01 거래 목록 · EXC-01·BRK-02 시세 값 · ADM-02 CSV 6종\u003c/td>\n    \u003c/tr>\n    \u003ctr>\n      \u003ctd class=\"grp-cell\" rowspan=\"3\">어드민\u003c/td>\n      \u003ctd class=\"item\">로그인\u003c/td>\n      \u003ctd>별도 화면 \u003cb class=\"key\">없음(ADM-01 결번 유지)\u003c/b> — AUTH-01과 동일 규격(ID/PW + Google Authenticator) + PAM 전용세션에서만 접속 · 유휴 10분(관리자) \u003cspan class=\"need\">[확인필요]\u003c/span>\u003c/td>\n      \u003ctd>AUTH-01 규격 공용\u003c/td>\n    \u003c/tr>\n    \u003ctr>\n      \u003ctd class=\"item\">역할·노출\u003c/td>\n      \u003ctd>어드민 역할 \u003cb class=\"key\">1종(운영 관리자)\u003c/b> — 화면·버튼 노출 차이 없음 · 통제는 본인 기안 자기승인 차단(행 단위) + 감사로그 + PAM · 콜드 2인 서명자는 콘솔 밖 커스터디 절차\u003c/td>\n      \u003ctd>ADM-02·03 전 기능 동일 노출\u003c/td>\n    \u003c/tr>\n    \u003ctr>\n      \u003ctd class=\"item\">처리 버튼\u003c/td>\n      \u003ctd>처리함 행 내 인라인 버튼(승인·보류·거절·이전 중지 등)만 — 별도 상세 화면 없음 · 보류·거절은 사유 입력 필수(모달) · 상태명·버튼명은 states.html 도메인 상태와 동일\u003c/td>\n      \u003ctd>ADM-02 처리함\u003c/td>\n    \u003c/tr>\n    \u003ctr>\n      \u003ctd class=\"grp-cell\" rowspan=\"1\">정보 노출\u003c/td>\n      \u003ctd class=\"item\">고객 화면 미노출\u003c/td>\n      \u003ctd>내부 회계 계정명(운영손익·중개수익) · 내부 사유·AML 심사 내용 · 시세 소스명 — 고객 콘솔 어디에도 표시하지 않음, 구분회계는 어드민 CSV(ADM-02)에서만 (2026-09-02 확정)\u003c/td>\n      \u003ctd>EXC-04·BRK-05 결과 화면에서 계정명 행 제거\u003c/td>\n    \u003c/tr>\n    \u003ctr>\n      \u003ctd class=\"grp-cell\" rowspan=\"1\">이메일 통지\u003c/td>\n      \u003ctd class=\"item\">공통 원칙\u003c/td>\n      \u003ctd>발신전용(no-reply) · 본문에 링크·버튼 없음(콘솔 직접 접속 안내) · 상호 마스킹은 화면과 동일 · 심사·AML 내용 미포함 · \u003cb class=\"key\">6종\u003c/b>(신청 접수 ① / 수락·확정 ② / 거래 완료 ③ / 게시 회수 ④ / \u003cb class=\"key\">거래 거절 ⑤\u003c/b> / \u003cb class=\"key\">거래 만료 ⑥\u003c/b> — ⑤⑥은 2026-09-02(10) 신설, 나목 교환 대상 · 마목 신청 거절·만료 메일은 [확인필요]) · 거절 메일은 거절 주체(DSRV 심사 / 고객 요청)를 제목·본문에 구분 표기\u003c/td>\n      \u003ctd>BRK-03 상세(①·공통 원칙) · BRK-04(②) · BRK-05(③) · BRK-06(④) · EXC-04(⑤·⑥)\u003c/td>\n    \u003c/tr>\n  \u003c/tbody>\n\u003c/table>\n\u003c/div>\n\n\u003cdiv class=\"foot\">\n  \u003cb>기준·비고\u003c/b> — 화면 21개에서 실제 사용 중인 표기를 집계(2026-09-01 · 09-02 BRK-06·07 추가 · 계정 활성화 3화면 분리)해 다수 표기를 표준으로 채택.\n  비율 표기({비율} 받는코인/주는코인 · 스프레드 분리)와 거래 채번(EXC-YYYYMMDD-NNNN)은 2026-09-01 확정 규칙.\n  날짜는 현재 전 화면이 YYYY-MM-DD로 통일돼 있어 그대로 표준화 — 다른 형식(예: YY.MM.DD)으로 바꾸려면 이 표 개정 후 화면 일괄 수정.\n\u003c/div>\n\u003c/body>\n\u003c/html>\n";

font-weight:800; color:#fff; background:#0f172a; border-radius:6px; padding:1px 8px; }\n  .sec h2 { font-size:15px; font-weight:800; letter-spacing:-.01em; }\n  .sec .hint { font-size:11px; color:#64748b; }\n  .tblwrap { overflow-x:auto; }\n  .ct { width:auto; max-width:100%; border-collapse:collapse; table-layout:auto; font-size:10.5px; margin-top:8px; }\n  .ct th { background:#f1f5f9; color:#475569; font-weight:700; text-align:left; padding:5px 7px; border:1px solid #d4d4d4; font-size:10px; white-space:nowrap; }\n  .ct td { padding:6px 7px; border:1px solid #d4d4d4; color:#334155; vertical-align:top; line-height:1.5; }\n  .ct td:first-child { font-family:ui-monospace, Consolas, monospace; font-size:9.5px; color:#94a3b8; white-space:nowrap; }\n  .ct td .st { font-size:9.5px; padding:1px 7px; }\n  .ct tr.sub td { background:#fbfbf9; color:#64748b; font-size:10px; }\n  .st.gray { border-color:#cbd5e1; color:#64748b; background:#f8fafc; }\n  .who { display:inline-block; font-size:9px; font-weight:700; border-radius:4px; padding:0 5px; margin-right:3px; vertical-align:1px; }\n  .who.c { color:#b45309; background:#fef3c7; }      /* 고객 */\n  .who.a { color:#9d174d; background:#fce7f3; }      /* 관리자 */\n  .who.s { color:#0369a1; background:#e0f2fe; }      /* 시스템 */\n  .card { display:inline-block; font-size:9.5px; font-weight:700; border-radius:4px; padding:0 6px; border:1px solid; white-space:nowrap; }\n  .card.w { color:#1d4ed8; border-color:#bfdbfe; background:#eff6ff; }\n  .card.p { color:#b45309; border-color:#fde68a; background:#fffbeb; }\n  .card.d { color:#15803d; border-color:#bbf7d0; background:#f0fdf4; }\n  .card.x { color:#64748b; border-color:#e2e8f0; background:#f8fafc; text-decoration:line-through; }\n  .card.k { color:#0f172a; border-color:#cbd5e1; background:#fff; }\n  .rule { font-size:10.5px; color:#475569; margin-top:8px; }\n  .rule li { margin-top:3px; }\n  .rule ul { margin-left:16px; }\n  .legend-row { font-size:10.5px; color:#64748b; margin-top:6px; display:flex; flex-wrap:wrap; gap:6px 14px; align-items:center; }\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\n\u003cdiv class=\"doc-head\">\n  \u003ch1>케이스분기 — 거래·계정 상태가 갈리는 경우와 화면 반영\u003c/h1>\n  \u003cdiv class=\"sub\">한 건이 갈라지는 경우 · 트리거 · 고객 목록/상세·어드민 반영 (개발 이관용) · v0.4 2026-09-02 — 종전 \"상태 전이(처리함)\" 문서를 케이스분기로 확장: 나목·마목 고객 케이스 표 신설, 처리함 공통 상태 대응표 신설(카드 집계 정의는 2026-09-02 삭제 — 요약·KPI 카드 제거) · 어드민 유형 T1~T8·X3 전이는 §4에 유지 · 나목 고객 \"보류\" 라벨 폐지(진행 중 → 완료/거절만) 반영\u003c/div>\n\u003c/div>\n\n\u003cdiv class=\"wide\">\u003cdiv class=\"panel\">\u003cdiv class=\"panel-title\">이 문서를 읽는 법\u003c/div>\n\u003cdiv class=\"intro\">\n\u003cp>\u003cb>케이스분기\u003c/b> = 거래 한 건(교환 요청·게시·신청·출금·입금) 또는 계정 하나가 시작해서 끝날 때까지 \u003cb>갈라질 수 있는 경우\u003c/b>를 전부 나열한 것이다. 경우마다 ① 무엇이 상태를 바꾸는지(\u003cb>트리거\u003c/b>), ② 그 결과 고객 화면과 어드민 화면에 \u003cb>각각 무엇이 보이는지\u003c/b>, ③ 고객 목록의 \u003cb>칩 색 그룹\u003c/b>(대기·진행·완료·종결)을 한 행에 적었다.\u003c/p>\n\u003cp>상태는 세 축으로 나뉜다. \u003cb>고객 상태\u003c/b>(DASH-01 칩 라벨 — 내부 심사 단계를 감춘 고객용 이름) · \u003cb>어드민 업무 상태\u003c/b>(ADM-02 처리함 '상태' 컬럼 — 승인 대기·격리 중 등 실제 업무) · \u003cb>처리함 공통 상태 5종\u003c/b>(OPEN·ESCALATED·IN_PROGRESS·HOLD·RESOLVED — 처리함 집계 축). 같은 순간에 세 축의 값이 서로 다를 수 있고, 그 대응을 §1~§3 표가 정의한다. 코드 후보(영문)는 CSV·DB enum 초안이며 확정 전이다\u003cspan class=\"need\">결정필요 ⑨\u003c/span>.\u003c/p>\n\u003cp>화면 박스(\u003cspan class=\"mono\">EXC-02\u003c/span> 등)를 클릭하면 해당 화면기획으로 이동한다. 어드민 유형(T1~T8·X3)의 상세 전이는 §4에 그대로 두었다.\u003c/p>\n\u003c/div>\u003cdiv class=\"legend-row\">\u003cb>주체\u003c/b> \u003cspan class=\"who c\">고객\u003c/span>고객·게시자·신청자 \u003cspan class=\"who a\">관리자\u003c/span>DSRV 관리자 \u003cspan class=\"who s\">시스템\u003c/span>타이머·룰·배치·온체인 \u003cb style=\"margin-left:10px;\">칩 색\u003c/b> \u003cspan class=\"st start\">대기\u003c/span>파랑 \u003cspan class=\"st mid\">진행\u003c/span>노랑 \u003cspan class=\"st end\">완료\u003c/span>초록 \u003cspan class=\"st gray\">종결\u003c/span>회색\u003c/div>\u003c/div>\u003c/div>\n\n\u003cdiv class=\"sec\">\u003cspan class=\"no\">§1\u003c/span>\u003ch2>고객 거래 케이스분기\u003c/h2>\u003cspan class=\"hint\">나목 교환 · 마목 게시 · 마목 신청 — 한 행 = 갈라지는 경우 하나\u003c/span>\u003c/div>\n\u003cdiv class=\"wide\">\u003cdiv class=\"panel\">\u003cdiv class=\"panel-title\">나목 교환 — 고객 상태 흐름 \u003cspan class=\"scope\">EXC-01 → 02 → 03/04 · DASH-01 칩\u003c/span>\u003c/div>\n\u003cdiv class=\"flow\">\n  \u003cspan class=\"st start\">요청됨\u003c/span>\u003cspan class=\"fa\">\u003cspan class=\"by sys\">견적 자동 산정\u003c/span>\u003ci class=\"ar\">\u003c/i>\u003c/span>\n  \u003cspan class=\"st start\">비율 제시\u003c/span>\u003cspan class=\"fa\">\u003cspan class=\"by\">고객 수락(EXC-02)\u003c/span>\u003ci class=\"ar\">\u003c/i>\u003c/span>\n  \u003cspan class=\"st mid\">진행 중\u003c/span>\u003cspan class=\"fa\">\u003cspan class=\"by\">관리자 승인 → 집행(ADM-02)\u003c/span>\u003ci class=\"ar\">\u003c/i>\u003c/span>\n  \u003cspan class=\"st end\">완료\u003c/span>\n\u003c/div>\n\u003cdiv class=\"flow\">\n  \u003cspan class=\"st start\">비율 제시\u003c/span>\u003cspan class=\"fa\">\u003cspan class=\"by\">고객 거절\u003c/span>\u003ci class=\"ar\">\u003c/i>\u003c/span>\u003cspan class=\"st bad\">거절\u003c/span>\n  \u003cspan class=\"fa\">/\u003c/span>\u003cspan class=\"fa\">\u003cspan class=\"by sys\">기한 만료 · 재검증 실패\u003c/span>\u003ci class=\"ar\">\u003c/i>\u003c/span>\u003cspan class=\"st bad\">만료\u003c/span>\n\u003c/div>\n\u003cdiv class=\"flow\">\n  \u003cspan class=\"st mid\">진행 중\u003c/span>\u003cspan class=\"fa\">\u003cspan class=\"by\">관리자 거절(사유 · ADM-02)\u003c/span>\u003ci class=\"ar\">\u003c/i>\u003c/span>\u003cspan class=\"st bad\">거절\u003c/span>\n\u003c/div>\n\u003cdiv style=\"font-size:10.5px;color:#64748b;margin-top:4px;\">· 고객 라벨 \"진행 중\" 하나가 어드민의 승인 대기·에스컬레이션·\u003cb>보류\u003c/b>·집행 대기 네 단계를 덮는다(EXC-03 — 내부 단계·담당자 미노출) · \u003cb>고객 화면에 \"보류\" 상태 없음\u003c/b>(2026-09-02 결정) — 진행 중에서 갈 수 있는 곳은 완료 또는 거절 둘뿐. 관리자 보류는 어드민 내부 상태(T1 HOLD)로만 존재하고 고객에게는 진행 중으로 보인다 · 스키마 v0.7 EXCHANGE_REQUEST.status도 같은 6종(요청됨·비율 제시·진행 중·완료·거절·만료)으로 정합 완료(2026-09-02) · 거절은 단일 enum이고 화면 표기만 「거절 (DSRV 심사)」/「거절 (고객 요청)」로 구분(2026-09-02(10))\u003c/div>\u003c/div>\u003c/div>\n\u003cdiv class=\"wide\">\u003cdiv class=\"panel\">\u003cdiv class=\"panel-title\">A. 나목 교환 (DSRV 상대 교환) \u003cspan class=\"scope\">고객 1건 = 요청번호 EXC-YYYYMMDD-NNNN 1개\u003c/span>\u003c/div>\u003cdiv class=\"panel-note\">내부 승인 3단계(승인 대기·에스컬레이션·집행 대기)는 고객에게 \"진행 중\" 하나로만 보인다. 어드민 열의 \"행\"은 ADM-02 처리함 행을 뜻한다.\u003c/div>\u003cdiv class=\"tblwrap\">\u003ctable class=\"ct\">\u003cthead>\u003ctr>\u003cth>#\u003c/th>\u003cth>케이스 (무슨 일이 생겼나)\u003c/th>\u003cth>트리거 (누가·무엇이 바꾸나)\u003c/th>\u003cth>고객 상태 라벨 · 코드 후보\u003c/th>\u003cth>고객 목록 (DASH-01 칩 색)\u003c/th>\u003cth>고객 상세 화면\u003c/th>\u003cth>어드민 (ADM-02 · ADM-03)\u003c/th>\u003cth>통지\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>A1\u003c/td>\u003ctd>거래 요청 접수\u003c/td>\u003ctd>\u003cspan class=\"who c\">고객\u003c/span>\u003cspan class=\"scr\" data-pid=\"EXC-01\">\u003cspan class=\"sid\">EXC-01\u003c/span>[거래 요청]\u003c/span>\u003c/td>\u003ctd>요청됨 · \u003cspan class=\"mono\">REQUESTED\u003c/span>\u003c/td>\u003ctd>\u003cspan class=\"st start\">대기\u003c/span>\u003c/td>\u003ctd>\u003cspan class=\"scr\" data-pid=\"EXC-02\">\u003cspan class=\"sid\">EXC-02\u003c/span>\u003c/span> 견적 산정 중(\"불러오는 중…\")\u003c/td>\u003ctd>처리함 행 없음 — 견적은 시스템 자동 산정\u003c/td>\u003ctd>—\u003c/td>\u003c/tr>\u003ctr>\u003ctd>A2\u003c/td>\u003ctd>확정 비율 제시\u003c/td>\u003ctd>\u003cspan class=\"who s\">시스템\u003c/span> 견적 자동 산정 완료(ADM-03 스프레드·시세 소스)\u003c/td>\u003ctd>비율 제시 · \u003cspan class=\"mono\">QUOTED\u003c/span>\u003c/td>\u003ctd>\u003cspan class=\"st start\">대기\u003c/span>\u003c/td>\u003ctd>\u003cspan class=\"scr\" data-pid=\"EXC-02\">\u003cspan class=\"sid\">EXC-02\u003c/span>\u003c/span> 카운트다운 · [수락]·[거절] 활성\u003c/td>\u003ctd>행 없음\u003c/td>\u003ctd>—\u003c/td>\u003c/tr>\u003ctr>\u003ctd>A3\u003c/td>\u003ctd>고객 수락 → DSRV 내부 승인 시작\u003c/td>\u003ctd>\u003cspan class=\"who c\">고객\u003c/span>\u003cspan class=\"scr\" data-pid=\"EXC-02\">\u003cspan class=\"sid\">EXC-02\u003c/span>[수락]\u003c/span> 클릭 즉시 확정(확인 없음)\u003c/td>\u003ctd>진행 중 · \u003cspan class=\"mono\">IN_PROGRESS\u003c/span> — 내부 승인 대기·집행 대기를 한 라벨로\u003c/td>\u003ctd>\u003cspan class=\"st mid\">진행\u003c/span>\u003c/td>\u003ctd>\u003cspan class=\"scr\" data-pid=\"EXC-03\">\u003cspan class=\"sid\">EXC-03\u003c/span>\u003c/span> 스텝 2 \"진행중\" · 내부 단계·담당자 미노출\u003c/td>\u003ctd>\u003cb>T1 행 생성\u003c/b> 승인 대기 / 등급 주의↑이면 에스컬레이션 · 자동검증(한도·BLF·KYT·재고) 첨부\u003c/td>\u003ctd>없음(화면 접수 안내)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>A4\u003c/td>\u003ctd>관리자 보류 (내부)\u003c/td>\u003ctd>\u003cspan class=\"who a\">관리자\u003c/span> ADM-02 [보류] + 사유(필수)\u003c/td>\u003ctd>진행 중 (변화 없음) — 고객 화면에 보류 라벨 없음(2026-09-02 결정)\u003c/td>\u003ctd>\u003cspan class=\"st mid\">진행\u003c/span>\u003c/td>\u003ctd>\u003cspan class=\"scr\" data-pid=\"EXC-03\">\u003cspan class=\"sid\">EXC-03\u003c/span>\u003c/span> 변화 없음 · 보류 사유 미노출\u003c/td>\u003ctd>행 유지 · 상태 보류 · 공통 HOLD · [승인]·[거절]로 재검토 → A5 또는 A7\u003c/td>\u003ctd>없음\u003c/td>\u003c/tr>\u003ctr>\u003ctd>A5\u003c/td>\u003ctd>관리자 승인 → 집행 대기\u003c/td>\u003ctd>\u003cspan class=\"who a\">관리자\u003c/span> ADM-02 [승인](본인 기안 불가 · 재고·KYC 재검증)\u003c/td>\u003ctd>진행 중 (변화 없음)\u003c/td>\u003ctd>\u003cspan class=\"st mid\">진행\u003c/span>\u003c/td>\u003ctd>\u003cspan class=\"scr\" data-pid=\"EXC-03\">\u003cspan class=\"sid\">EXC-03\u003c/span>\u003c/span> 변화 없음\u003c/td>\u003ctd>처리함 행 제거 · 공통 RESOLVED(승인) → \u003cb>집행 대기 표\u003c/b>에 행 \"집행 대기\"\u003c/td>\u003ctd>없음\u003c/td>\u003c/tr>\u003ctr>\u003ctd>A6\u003c/td>\u003ctd>집행 완료\u003c/td>\u003ctd>\u003cspan class=\"who a\">관리자\u003c/span> 집행 대기 표 [완료 처리] — txhash 온체인 대사(주소·자산·수량) 일치 시만\u003c/td>\u003ctd>완료 · \u003cspan class=\"mono\">COMPLETED\u003c/span>\u003c/td>\u003ctd>\u003cspan class=\"st end\">완료\u003c/span>\u003c/td>\u003ctd>\u003cspan class=\"scr\" data-pid=\"EXC-04\">\u003cspan class=\"sid\">EXC-04\u003c/span>\u003c/span> 스텝 3 ✓ 완료 · 집행 방식·완료 일시·풀 차감\u003c/td>\u003ctd>집행 대기 표 행 제거 → 이후 조회는 CSV ③\u003c/td>\u003ctd>이메일 ③ 거래 완료\u003c/td>\u003c/tr>\u003ctr>\u003ctd>A7\u003c/td>\u003ctd>관리자 거절\u003c/td>\u003ctd>\u003cspan class=\"who a\">관리자\u003c/span> ADM-02 [거절] + 사유(필수 · 되돌릴 수 없음)\u003c/td>\u003ctd>거절 · \u003cspan class=\"mono\">REJECTED\u003c/span> — enum은 A8과 동일, 화면 표기는 「거절 (DSRV 심사)」로 구분(2026-09-02(10))\u003c/td>\u003ctd>\u003cspan class=\"st gray\">종결\u003c/span>\u003c/td>\u003ctd>\u003cspan class=\"scr\" data-pid=\"EXC-04\">\u003cspan class=\"sid\">EXC-04\u003c/span>\u003c/span> 「거절 (DSRV 심사)」 변형 + 사유 배너\u003c/td>\u003ctd>행 제거 · RESOLVED(거절) · AML 사유면 STR 검토 아이템 생성\u003c/td>\u003ctd>이메일 ⑤ 거래 거절 — 일반화 사유만 · STR 누설 금지\u003c/td>\u003c/tr>\u003ctr>\u003ctd>A8\u003c/td>\u003ctd>고객 거절\u003c/td>\u003ctd>\u003cspan class=\"who c\">고객\u003c/span>\u003cspan class=\"scr\" data-pid=\"EXC-02\">\u003cspan class=\"sid\">EXC-02\u003c/span>[거절]\u003c/span>(확인 없음)\u003c/td>\u003ctd>거절 · \u003cspan class=\"mono\">REJECTED\u003c/span>\u003c/td>\u003ctd>\u003cspan class=\"st gray\">종결\u003c/span>\u003c/td>\u003ctd>\u003cspan class=\"scr\" data-pid=\"EXC-04\">\u003cspan class=\"sid\">EXC-04\u003c/span>\u003c/span> 「거절 (고객 요청)」 변형 + 고정 문구 배너\u003c/td>\u003ctd>행 없음(견적 QUOTE 상태 거절 · 처리함 무관)\u003c/td>\u003ctd>이메일 ⑤ 거래 거절(고객 요청 문구)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>A9\u003c/td>\u003ctd>수락 기한 만료\u003c/td>\u003ctd>\u003cspan class=\"who s\">시스템\u003c/span> 카운트다운 00:00 · 종결 판정은 서버\u003c/td>\u003ctd>만료 · \u003cspan class=\"mono\">EXPIRED\u003c/span>\u003c/td>\u003ctd>\u003cspan class=\"st gray\">종결\u003c/span>\u003c/td>\u003ctd>\u003cspan class=\"scr\" data-pid=\"EXC-02\">\u003cspan class=\"sid\">EXC-02\u003c/span>\u003c/span> 체류 중이면 \"만료됨 — 비율 무효\" · 재진입 시 \u003cspan class=\"scr\" data-pid=\"EXC-04\">\u003cspan class=\"sid\">EXC-04\u003c/span>\u003c/span> 「만료」 변형\u003c/td>\u003ctd>행 없음\u003c/td>\u003ctd>이메일 ⑥ 거래 만료 · 재요청은 EXC-01(새 번호)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>A10\u003c/td>\u003ctd>풀 부족 · 비율 이탈 — 수락 클릭 시 재검증 실패, 또는 수락 후 집행 전 이탈(집행 정지)\u003c/td>\u003ctd>\u003cspan class=\"who s\">시스템\u003c/span> 서버 재검증 / 외부지표 ADM-03 이탈 임계 초과\u003c/td>\u003ctd>만료 · \u003cspan class=\"mono\">EXPIRED\u003c/span> (기획 가정 — QUOTE \"이탈\"을 고객에게는 만료로 · EXC-04 만료 사유 \"가용 풀 부족·비율 변동\")\u003c/td>\u003ctd>\u003cspan class=\"st gray\">종결\u003c/span>\u003c/td>\u003ctd>\u003cspan class=\"scr\" data-pid=\"EXC-02\">\u003cspan class=\"sid\">EXC-02\u003c/span>\u003c/span> 실패 안내 노출 · [수락] 비활성\u003c/td>\u003ctd>행 없음\u003c/td>\u003ctd>없음\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003c/div>\u003c/div>\n\u003c!-- 고객 도메인: 마목 게시 상태 (2026-09-02 개정) -->\n\u003cdiv class=\"wide\">\n  \u003cdiv class=\"panel\">\n    \u003cdiv class=\"panel-title\">마목 게시 상태 — 고객 도메인 \u003cspan class=\"scope\">BRK-01 칩 · BRK-06 상태 행 · 개정 2026-09-02\u003c/span>\u003c/div>\n    \u003cdiv class=\"panel-note\">처리함 아이템이 아닌 고객 콘솔의 게시 상태. T2는 이 상태가 '확정'으로 전이할 때 생성된다. 종전 명칭·복수 신청(선착순/게시자 선택) 처리 규칙은 폐기 — 게시당 동시 신청 1건.\u003c/div>\n    \u003cdiv class=\"flow\">\n      \u003cspan class=\"st start\">게재중\u003c/span>\n      \u003cspan class=\"fa\">\u003cspan class=\"by sys\">신청 1건 접수\u003c/span>\u003ci class=\"ar\">\u003c/i>\u003c/span>\n      \u003cspan class=\"st mid\">협의중\u003c/span>\n      \u003cspan class=\"fa\">\u003cspan class=\"by\">게시자 수락(BRK-04)\u003c/span>\u003ci class=\"ar\">\u003c/i>\u003c/span>\n      \u003cspan class=\"st mid\">확정\u003c/span>\n      \u003cspan class=\"fa\">\u003cspan class=\"by sys\">양측 이전 완결(BRK-05)\u003c/span>\u003ci class=\"ar\">\u003c/i>\u003c/span>\n      \u003cspan class=\"st end\">완료\u003c/span>\n    \u003c/div>\n    \u003cdiv class=\"flow\">\n      \u003cspan class=\"st mid\">협의중\u003c/span>\n      \u003cspan class=\"fa\">\u003cspan class=\"by\">거절(BRK-04)\u003c/span>\u003ci class=\"ar\">\u003c/i>\u003c/span>\n      \u003cspan class=\"st start\">게재중 복귀\u003c/span>\n      \u003cspan class=\"fa\">/\u003c/span>\n      \u003cspan class=\"fa\">\u003cspan class=\"by sys\">신청 유효기한 만료(무응답)\u003c/span>\u003ci class=\"ar\">\u003c/i>\u003c/span>\n      \u003cspan class=\"st start\">게재중 복귀\u003c/span>\n    \u003c/div>\n    \u003cdiv class=\"flow\">\n      \u003cspan class=\"st start\">게재중\u003c/span>\u003cspan class=\"fa\">·\u003c/span>\u003cspan class=\"st mid\">협의중\u003c/span>\n      \u003cspan class=\"fa\">\u003cspan class=\"by\">게시 내리기(BRK-06)\u003c/span>\u003ci class=\"ar\">\u003c/i>\u003c/span>\n      \u003cspan class=\"st bad\">회수\u003c/span>\n      \u003cspan class=\"fa\">/\u003c/span>\n      \u003cspan class=\"fa\">\u003cspan class=\"by sys\">게시 유효기간 만료\u003c/span>\u003ci class=\"ar\">\u003c/i>\u003c/span>\n      \u003cspan class=\"st end\">완료(유효기간 만료)\u003c/span>\n      \u003cspan class=\"fa\">/\u003c/span>\n      \u003cspan class=\"fa\">\u003cspan class=\"by sys\">price guard ±{정책값 2.0%} 이탈\u003c/span>\u003ci class=\"ar\">\u003c/i>\u003c/span>\n      \u003cspan class=\"st bad\">중지\u003c/span>\n    \u003c/div>\n    \u003cdiv style=\"font-size:10.5px;color:#64748b;margin-top:4px;\">\n      · \u003cb style=\"color:#334155;\">협의중\u003c/b> = 게시판(BRK-01)에 '협의중' 칩, 추가 신청 차단 · 게시자 화면(BRK-06)에 받은 신청 1건 카드 + [신청 보기] → BRK-04\u003cbr>\n      · \u003cb style=\"color:#334155;\">회수\u003c/b>(게시자 능동 행위)와 \u003cb style=\"color:#334155;\">중지\u003c/b>(시스템 자동)는 협의중이던 대기 신청을 \u003cb>자동 종결\u003c/b> — 회수는 신청자에게 이메일 ④, 중지는 양측 이메일(규격 \u003cspan class=\"need\">[확인필요]\u003c/span>) · 재개는 재게시(새 게시번호)만 · 자산 이동·수수료 없음\u003cbr>\n      · \u003cb style=\"color:#334155;\">확정\u003c/b> 이후 회수 불가 — 중지는 T2 '이전 중지'(관리자)만 · 확정·완료 게시는 BRK-05 링크로 이전 상태 조회\u003cbr>\n      · 신청자 도메인(BRK-07): 협의중 → 확정 → 완료 / 종결 = 거절됨 · 만료 · 종결(게시 회수·중지·유효기간 만료) — 게시 상태와 1:1 대응 · 신청 취소 없음(기존 결정)\u003cbr>\n      · 유효기간 만료 종결의 고객 라벨('완료' vs 별개 '만료')과 DASH-01 칩 매핑은 \u003cspan class=\"need\">결정필요 ⑥\u003c/span>\n    \u003c/div>\n  \u003c/div>\n\u003c/div>\n\n\n\u003cdiv class=\"wide\">\u003cdiv class=\"panel\">\u003cdiv class=\"panel-title\">B. 마목 게시 (게시자 관점) \u003cspan class=\"scope\">게시번호 BRK-YYYYMMDD-NNNN 1개 · 게시당 동시 신청 1건\u003c/span>\u003c/div>\u003cdiv class=\"panel-note\">게시·회수·중지·만료는 관리자 승인 대상이 아니라 처리함 행이 생기지 않는다. 처리함(T2)은 수락으로 확정된 순간에만 생긴다.\u003c/div>\u003cdiv class=\"tblwrap\">\u003ctable class=\"ct\">\u003cthead>\u003ctr>\u003cth>#\u003c/th>\u003cth>케이스 (무슨 일이 생겼나)\u003c/th>\u003cth>트리거 (누가·무엇이 바꾸나)\u003c/th>\u003cth>고객 상태 라벨 · 코드 후보\u003c/th>\u003cth>고객 목록 (DASH-01 칩 색)\u003c/th>\u003cth>고객 상세 화면\u003c/th>\u003cth>어드민 (ADM-02 · ADM-03)\u003c/th>\u003cth>통지\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>B1\u003c/td>\u003ctd>게시\u003c/td>\u003ctd>\u003cspan class=\"who c\">고객\u003c/span>\u003cspan class=\"scr\" data-pid=\"BRK-02\">\u003cspan class=\"sid\">BRK-02\u003c/span>[게시]\u003c/span> 서버 재검증(처분 가능분·한도·편차) 통과\u003c/td>\u003ctd>게재중 · \u003cspan class=\"mono\">POSTED\u003c/span>\u003c/td>\u003ctd>\u003cspan class=\"st start\">대기\u003c/span>\u003c/td>\u003ctd>\u003cspan class=\"scr\" data-pid=\"BRK-06\">\u003cspan class=\"sid\">BRK-06\u003c/span>\u003c/span> 받은 신청 빈 상태 · [게시 내리기] 활성 / \u003cspan class=\"scr\" data-pid=\"BRK-01\">\u003cspan class=\"sid\">BRK-01\u003c/span>\u003c/span> 게재중 칩 + \"내 게시\"\u003c/td>\u003ctd>행 없음 — 게시는 관리자 승인 대상 아님\u003c/td>\u003ctd>없음\u003c/td>\u003c/tr>\u003ctr>\u003ctd>B2\u003c/td>\u003ctd>신청 1건 접수\u003c/td>\u003ctd>\u003cspan class=\"who s\">시스템\u003c/span> 타 기관 \u003cspan class=\"scr\" data-pid=\"BRK-03\">\u003cspan class=\"sid\">BRK-03\u003c/span>[이 조건으로 신청]\u003c/span> 접수 → 게시당 동시 1건\u003c/td>\u003ctd>협의중 · \u003cspan class=\"mono\">NEGOTIATING\u003c/span>\u003c/td>\u003ctd>\u003cspan class=\"st start\">대기\u003c/span>\u003c/td>\u003ctd>\u003cspan class=\"scr\" data-pid=\"BRK-06\">\u003cspan class=\"sid\">BRK-06\u003c/span>\u003c/span> 신청 카드 + [신청 보기] → \u003cspan class=\"scr\" data-pid=\"BRK-04\">\u003cspan class=\"sid\">BRK-04\u003c/span>\u003c/span> / \u003cspan class=\"scr\" data-pid=\"BRK-01\">\u003cspan class=\"sid\">BRK-01\u003c/span>\u003c/span> 협의중 칩(추가 신청 차단)\u003c/td>\u003ctd>행 없음\u003c/td>\u003ctd>이메일 ① 접수(게시자)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>B3\u003c/td>\u003ctd>거절 또는 신청 유효기한 만료 → 게재중 복귀\u003c/td>\u003ctd>\u003cspan class=\"who c\">게시자\u003c/span>\u003cspan class=\"scr\" data-pid=\"BRK-04\">\u003cspan class=\"sid\">BRK-04\u003c/span>[거절]\u003c/span> / \u003cspan class=\"who s\">시스템\u003c/span> 신청 기한 경과(무응답)\u003c/td>\u003ctd>게재중 (복귀) · \u003cspan class=\"mono\">POSTED\u003c/span>\u003c/td>\u003ctd>\u003cspan class=\"st start\">대기\u003c/span>\u003c/td>\u003ctd>\u003cspan class=\"scr\" data-pid=\"BRK-06\">\u003cspan class=\"sid\">BRK-06\u003c/span>\u003c/span> 빈 상태 복귀(카드 제거) / \u003cspan class=\"scr\" data-pid=\"BRK-01\">\u003cspan class=\"sid\">BRK-01\u003c/span>\u003c/span> 재노출·다른 기관 신청 가능\u003c/td>\u003ctd>행 없음\u003c/td>\u003ctd>신청자 통지 메일 없음 \u003cspan class=\"need\">[확인필요]\u003c/span>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>B4\u003c/td>\u003ctd>수락 → 확정(구속력 발생)\u003c/td>\u003ctd>\u003cspan class=\"who c\">게시자\u003c/span>\u003cspan class=\"scr\" data-pid=\"BRK-04\">\u003cspan class=\"sid\">BRK-04\u003c/span>[수락]\u003c/span> 확인 다이얼로그 → 재검증(기한·게시 상태·양측 처분 가능분)\u003c/td>\u003ctd>확정 · \u003cspan class=\"mono\">CONFIRMED\u003c/span>\u003c/td>\u003ctd>\u003cspan class=\"st mid\">진행\u003c/span>\u003c/td>\u003ctd>\u003cspan class=\"scr\" data-pid=\"BRK-06\">\u003cspan class=\"sid\">BRK-06\u003c/span>\u003c/span> 상호 마스킹 해제 + [이전 진행 보기 →] → \u003cspan class=\"scr\" data-pid=\"BRK-05\">\u003cspan class=\"sid\">BRK-05\u003c/span>\u003c/span> 스텝 1 확정 / \u003cspan class=\"scr\" data-pid=\"BRK-01\">\u003cspan class=\"sid\">BRK-01\u003c/span>\u003c/span> 목록 제외\u003c/td>\u003ctd>\u003cb>T2 행 생성\u003c/b> 확인 대기 / KYT 주의↑ 에스컬레이션 · 판단 재료: 양측 BLF·KYT·트래블룰·처분 가능분·KYC\u003c/td>\u003ctd>이메일 ② 확정(양측)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>B5\u003c/td>\u003ctd>DSRV 이전 진행 승인\u003c/td>\u003ctd>\u003cspan class=\"who a\">관리자\u003c/span> ADM-02 [승인]\u003c/td>\u003ctd>확정 (칩 변화 없음) — BRK-05 스텝 이전 진행\u003c/td>\u003ctd>\u003cspan class=\"st mid\">진행\u003c/span>\u003c/td>\u003ctd>\u003cspan class=\"scr\" data-pid=\"BRK-05\">\u003cspan class=\"sid\">BRK-05\u003c/span>\u003c/span> 스텝 2~3 양건 확인 → 이전 진행 · 양측 이전 지시 상태 · 트래블룰 확인\u003c/td>\u0
