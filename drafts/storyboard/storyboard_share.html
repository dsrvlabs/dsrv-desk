class=\"req\">필수\u003c/span>\u003c/div>\n        \u003cdiv class=\"itm-desc\">\u003cstrong>노출\u003c/strong> 유형 '마목 확정 확인' 행에만 보인다.\u003cbr>\u003cstrong>클릭 가능\u003c/strong> 행 상태가 확인 대기·에스컬레이션·보류 중 하나이고 다른 관리자가 처리 중이 아닐 때 활성이다.\u003cbr>\u003cstrong>확인 사항\u003c/strong> 사유 모달이 확인 다이얼로그를 겸한다(비가역). 구조는 [거절]과 같다.\u003cbr>\u003cstrong>액션\u003c/strong> 확정된 마목 거래의 이전을 중지한다. 거래 취소가 아니다. 상태를 RESOLVED(이전 중지)로 바꾸고 행을 제거하며, 양측 고객 화면 BRK-05·BRK-07에 '이전 중지'를 표시한다. 계약상 귀결(무산·위약)은 약관·법무 판단이 필요하다(states 결정필요 ①).\u003cbr>\u003cspan class=\"chk\">[확인필요]\u003c/span> 이전 중지 시 양측에 이메일을 보낼지(현행 통지 6종에 없다).\u003cbr>\u003cspan class=\"basis\">근거 states T2 이전 중지 · notation 확인 다이얼로그(ADM-02 이전 중지)\u003c/span>\u003c/div>\n        \u003cdiv class=\"itm-nav\">\u003cspan class=\"nav-tag\">화면 이동 · 인터랙션\u003c/span>\n          \u003cdiv class=\"nav-row\">\u003cspan class=\"nav-el\">[이전 중지] — 활성 조건\u003c/span>\u003cspan class=\"nav-act\">다음이 모두 아님: ①행 상태가 확인 대기·에스컬레이션·보류 이외 ②다른 관리자 처리 중\u003c/span>\u003cspan class=\"nav-to stay\">하나라도 해당 → 회색 비활성(공통 UI 규격)\u003c/span>\u003c/div>\n          \u003cdiv class=\"nav-row\">\u003cspan class=\"nav-el\">[이전 중지] — 클릭(활성)\u003c/span>\u003cspan class=\"nav-act\">클릭 → 다이얼로그: 제목 \"이전 중지 — BRK-20260902-0001\" / 본문 \"확정된 거래의 자산 이전을 중지합니다. 되돌릴 수 없으며 양 당사자에게 중지 상태가 표시됩니다.\" / 카테고리 ▾ + 사유 입력(필수) / [이전 중지] [돌아가기] → \"처리 중…\"\u003c/span>\u003cspan class=\"nav-to stay\">행 제거 + 토스트 \"BRK-20260902-0001 이전 중지 처리되었습니다\" · 양측 BRK-05·07 상태 갱신 · 감사로그\u003c/span>\u003c/div>\n          \u003cdiv class=\"nav-row\">\u003cspan class=\"nav-el\">[이전 중지] — 실패\u003c/span>\u003cspan class=\"nav-act\">경쟁 상태 / 서버 오류\u003c/span>\u003cspan class=\"nav-to stay\">화면 잔류 · 모달 유지·입력값 보존 · 공통 배너 · 버튼 복귀\u003c/span>\u003c/div>\n        \u003c/div>\n      \u003c/div>\n    \u003c/div>\n\n    \u003cdiv class=\"itm\" data-idx=\"6\">\n      \u003cdiv class=\"num\">7\u003c/div>\n      \u003cdiv>\n        \u003cdiv class=\"itm-title\">[승인 → 집행 대기] — 출금·이전(T3 · 지연발효)\u003cspan class=\"req\">필수\u003c/span>\u003c/div>\n        \u003cdiv class=\"itm-desc\">\u003cstrong>노출\u003c/strong> 유형 '출금·이전' 행에만 보인다. 서면으로 접수해 관리자가 등록한 건이다.\u003cbr>\u003cstrong>클릭 가능\u003c/strong> 지연발효 타이머가 끝났고, 본인이 등록한 건이 아니며, 종결·집행 대기가 아니고, 다른 관리자가 처리 중이 아니며, 기관 KYC 상태가 '활성'일 때만 활성이다. 신규 주소는 화이트리스트 지연발효 타이머가 끝나야 한다(커스터디 기존 정책값이고 이 콘솔 설정이 아니다). 타이머가 도는 동안 상태 열에 \"대기(지연발효 중 · 잔여 HH:MM)\"가 1분 단위로 보이다가 만료되면 \"대기(승인 가능)\"로 바뀐다. 만료돼도 자동 승인은 하지 않는다. 이 건을 등록한 관리자가 지금 로그인한 관리자면 비활성으로 두고 인라인 ⚠ \"본인이 등록한 건은 승인할 수 없습니다\"를 띄운다.\u003cbr>\u003cstrong>확인 사항\u003c/strong> 확인 다이얼로그를 띄운다.\u003cbr>\u003cstrong>액션\u003c/strong> 상태를 집행 대기로 바꾸고 집행 대기 표에 행을 만든다. 집행 명세를 만들 때 BLF를 다시 검사하고, 적중하면 '차단'으로 두고 STR 검토를 만든다.\u003cbr>\u003cspan class=\"basis\">근거 states T3 · ISMS 2.2.2(직무분리) · 예외 H3·H4 · 화이트리스트 = 커스터디 정책\u003c/span>\u003c/div>\n        \u003cdiv class=\"itm-nav\">\u003cspan class=\"nav-tag\">화면 이동 · 인터랙션\u003c/span>\n          \u003cdiv class=\"nav-row\">\u003cspan class=\"nav-el\">[승인 → 집행 대기] — 활성 조건\u003c/span>\u003cspan class=\"nav-act\">다음이 모두 아님: ①지연발효 타이머 진행 중 ②본인 등록 건 ③종결·집행 대기 ④다른 관리자 처리 중 ⑤기관 KYC 상태 '활성' 아님\u003c/span>\u003cspan class=\"nav-to stay\">하나라도 해당 → 회색 비활성 · 타이머 중은 상태 열 잔여 시간이 사유 · 그 외 사유는 확장 패널 인라인 ⚠\u003c/span>\u003c/div>\n          \u003cdiv class=\"nav-row\">\u003cspan class=\"nav-el\">[승인 → 집행 대기] — 클릭(활성)\u003c/span>\u003cspan class=\"nav-act\">클릭 → 다이얼로그: 제목 \"출금·이전 승인\" / 본문 \"ORG-A · USDC 80,000 → 0x9f3a…d81c 출금을 승인합니다. 집행 대기로 이동하며 콜드월렛 수동 절차로 집행됩니다.\" / [승인] [돌아가기] → \"처리 중…\"\u003c/span>\u003cspan class=\"nav-to stay\">행 제거 + 토스트 \"출금 건 승인 — 집행 대기로 이동했습니다\" · 집행 대기 표 행 추가 · 감사로그\u003c/span>\u003c/div>\n          \u003cdiv class=\"nav-row\">\u003cspan class=\"nav-el\">[승인 → 집행 대기] — 실패\u003c/span>\u003cspan class=\"nav-act\">경쟁 상태 / BLF 재검사 적중 / 서버 오류\u003c/span>\u003cspan class=\"nav-to stay\">화면 잔류 · BLF → 상단 배너 \"제재 리스트 적중으로 차단되었습니다\" · 행 상태 '차단' → 제거 + 'STR 검토' 행 생성 / 경쟁·오류 → 공통 배너 · 버튼 복귀\u003c/span>\u003c/div>\n        \u003c/div>\n      \u003c/div>\n    \u003c/div>\n\n    \u003cdiv class=\"itm\" data-idx=\"7\">\n      \u003cdiv class=\"num\">8\u003c/div>\n      \u003cdiv>\n        \u003cdiv class=\"itm-title\">[소명 요청] — 입금 격리(T4)\u003cspan class=\"req\">필수\u003c/span>\u003c/div>\n        \u003cdiv class=\"itm-desc\">\u003cstrong>노출\u003c/strong> 유형 '입금 격리' 행에 보인다. 상태가 '소명 대기'로 바뀌면 같은 자리의 라벨이 \u003cstrong>[소명 인정]\u003c/strong>으로 바뀐다.\u003cbr>\u003cstrong>클릭 가능\u003c/strong> 상태가 '격리 중'이고 다른 관리자가 처리 중이 아닐 때 활성이다.\u003cbr>\u003cstrong>확인 사항\u003c/strong> 없다. 가역적인 중간 상태라 확인 다이얼로그를 띄우지 않는다. [소명 인정]은 다이얼로그를 띄운다 — 제목 \"소명 인정 — 격리 해제\" / 본문 \"격리 입금 USDT 2,500을 고객 잔고에 반영합니다.\" / [해제] [돌아가기].\u003cbr>\u003cstrong>액션\u003c/strong> 격리 중인 입금(잔고 미반영)에 대해 고객에게 자금 출처 소명을 요청한다. 상태를 HOLD(소명 대기)로 두고 행은 남기며 \"소명 대기 · 요청 {YYYY-MM-DD}\"를 표시한다. 요청은 이메일로 보낸다(발신전용 · 링크 없음). 소명 접수와 검토는 콘솔 밖 AML 시스템에서 한다. [소명 인정]을 확정하면 RESOLVED(해제)로 행을 제거하고 토스트 \"격리 해제 — 잔고에 반영되었습니다\"를 띄운다.\u003cbr>\u003cspan class=\"chk\">[확인필요]\u003c/span> 소명 시한과 시한을 넘겼을 때의 기본 처리(states 결정필요 ②).\u003cbr>\u003cspan class=\"basis\">근거 states T4 · 예외 B1·B2 · notation 이메일 통지 공통 원칙\u003c/span>\u003c/div>\n        \u003cdiv class=\"itm-nav\">\u003cspan class=\"nav-tag\">화면 이동 · 인터랙션\u003c/span>\n          \u003cdiv class=\"nav-row\">\u003cspan class=\"nav-el\">[소명 요청] — 활성 조건\u003c/span>\u003cspan class=\"nav-act\">다음이 모두 아님: ①상태 '격리 중' 이외(소명 대기·종결) ②다른 관리자 처리 중\u003c/span>\u003cspan class=\"nav-to stay\">하나라도 해당 → 회색 비활성(공통 UI 규격)\u003c/span>\u003c/div>\n          \u003cdiv class=\"nav-row\">\u003cspan class=\"nav-el\">[소명 요청] — 클릭(활성)\u003c/span>\u003cspan class=\"nav-act\">클릭 → 확인 없음 → 라벨 \"발송 중…\"·중복 클릭 차단\u003c/span>\u003cspan class=\"nav-to stay\">상태 '소명 대기 · 요청 {날짜}' · 이메일 발송 · 버튼 라벨 [소명 인정]으로 교체 + 토스트 \"소명 요청 이메일을 발송했습니다\" · 감사로그\u003c/span>\u003c/div>\n          \u003cdiv class=\"nav-row\">\u003cspan class=\"nav-el\">[소명 요청] — 실패\u003c/span>\u003cspan class=\"nav-act\">이메일 발송 실패 / 서버 오류\u003c/span>\u003cspan class=\"nav-to stay\">화면 잔류 · 상태 변경 없음 · 상단 배너(공통) · 버튼 복귀\u003c/span>\u003c/div>\n        \u003c/div>\n      \u003c/div>\n    \u003c/div>\n\n    \u003cdiv class=\"itm\" data-idx=\"8\">\n      \u003cdiv class=\"num\">9\u003c/div>\n      \u003cdiv>\n        \u003cdiv class=\"itm-title\">[STR·동결] — 입금 격리(T4)\u003cspan class=\"req\">필수\u003c/span>\u003c/div>\n        \u003cdiv class=\"itm-desc\">\u003cstrong>노출\u003c/strong> 유형 '입금 격리' 행에 보인다. 제재 적중 건은 만들 때부터 '동결'이라 이 자리에 [STR 검토]만 보인다.\u003cbr>\u003cstrong>클릭 가능\u003c/strong> 상태가 격리 중이거나 소명 대기이고 다른 관리자가 처리 중이 아닐 때 활성이다.\u003cbr>\u003cstrong>확인 사항\u003c/strong> 확인 다이얼로그를 띄우고(비가역) 사유를 필수로 받는다.\u003cbr>\u003cstrong>액션\u003c/strong> 격리 입금을 동결로 두어 잔고에 반영하지 않고, STR 검토 아이템(T5 성격)을 만든다. 상태를 RESOLVED(동결)로 바꾸고 행을 제거한다. 고객 화면에는 아무 표시도 하지 않는다(STR 누설 금지).\u003cbr>\u003cspan class=\"chk\">[확인필요]\u003c/span> 고객 입금 내역에 이 건을 어떤 문구로 둘지.\u003cbr>\u003cspan class=\"basis\">근거 states T4 불인정 → 동결+STR 검토 · L1 STR 누설 금지 · 예외 B2\u003c/span>\u003c/div>\n        \u003cdiv class=\"itm-nav\">\u003cspan class=\"nav-tag\">화면 이동 · 인터랙션\u003c/span>\n          \u003cdiv class=\"nav-row\">\u003cspan class=\"nav-el\">[STR·동결] — 활성 조건\u003c/span>\u003cspan class=\"nav-act\">다음이 모두 아님: ①상태 격리 중·소명 대기 이외 ②다른 관리자 처리 중\u003c/span>\u003cspan class=\"nav-to stay\">하나라도 해당 → 회색 비활성(공통 UI 규격)\u003c/span>\u003c/div>\n          \u003cdiv class=\"nav-row\">\u003cspan class=\"nav-el\">[STR·동결] — 클릭(활성)\u003c/span>\u003cspan class=\"nav-act\">클릭 → 다이얼로그: 제목 \"동결 · STR 검토 이관\" / 본문 \"입금 USDT 2,500을 동결하고 STR 검토 건을 생성합니다. 고객에게는 어떤 통지도 발송되지 않습니다.\" / 사유 입력(필수 · 10~500자) / [동결] [돌아가기] → \"처리 중…\"\u003c/span>\u003cspan class=\"nav-to stay\">행 제거 + 처리함에 'STR 검토' 행 생성(유형 이상거래 워닝 · High) + 토스트 \"동결 처리 — STR 검토 건이 생성되었습니다\" · 감사로그\u003c/span>\u003c/div>\n          \u003cdiv class=\"nav-row\">\u003cspan class=\"nav-el\">[STR·동결] — 실패\u003c/span>\u003cspan class=\"nav-act\">경쟁 상태 / 서버 오류\u003c/span>\u003cspan class=\"nav-to stay\">화면 잔류 · 모달 유지·입력값 보존 · 공통 배너 · 버튼 복귀\u003c/span>\u003c/div>\n        \u003c/div>\n      \u003c/div>\n    \u003c/div>\n\n    \u003cdiv class=\"itm\" data-idx=\"9\">\n      \u003cdiv class=\"num\">10\u003c/div>\n      \u003cdiv>\n        \u003cdiv class=\"itm-title\">[검토] — 이상거래 워닝(T5)\u003cspan class=\"req\">필수\u003c/span>\u003c/div>\n        \u003cdiv class=\"itm-desc\">\u003cstrong>노출\u003c/strong> 유형 '이상거래 워닝' 행에 보인다.\u003cbr>\u003cstrong>클릭 가능\u003c/strong> 상태가 '미처리'일 때만 활성이다.\u003cbr>\u003cstrong>확인 사항\u003c/strong> 없다. 가역적인 중간 상태라 확인 다이얼로그를 띄우지 않는다.\u003cbr>\u003cstrong>액션\u003c/strong> 룰에 적중한 워닝의 검토 착수를 표시한다. 상태를 IN_PROGRESS(검토중)로 두고 행은 남기며 \"검토중 · DSRV-OPS-01\"을 표시한다. 담당자를 표시해 중복 검토를 막는다. 토스트는 띄우지 않는다.\u003cbr>\u003cspan class=\"chk\">[확인필요]\u003c/span> 검토 담당자가 정해지면 다른 관리자의 [STR 검토]·[무혐의 종결]을 잠글지.\u003cbr>\u003cspan class=\"basis\">근거 states T5 · ISMS 2.11.3\u003c/span>\u003c/div>\n        \u003cdiv class=\"itm-nav\">\u003cspan class=\"nav-tag\">화면 이동 · 인터랙션\u003c/span>\n          \u003cdiv class=\"nav-row\">\u003cspan class=\"nav-el\">[검토] — 활성 조건\u003c/span>\u003cspan class=\"nav-act\">상태 '미처리'일 때만(검토중·종결이면 비활성)\u003c/span>\u003cspan class=\"nav-to stay\">해당 없음 → 회색 비활성(공통 UI 규격)\u003c/span>\u003c/div>\n          \u003cdiv class=\"nav-row\">\u003cspan class=\"nav-el\">[검토] — 클릭(활성)\u003c/span>\u003cspan class=\"nav-act\">클릭 → 확인 없음 → 라벨 \"처리 중…\"(1초 내)\u003c/span>\u003cspan class=\"nav-to stay\">상태 \"검토중 · {관리자 ID}\" · 버튼 비활성으로 전환 · 감사로그\u003c/span>\u003c/div>\n          \u003cdiv class=\"nav-row\">\u003cspan class=\"nav-el\">[검토] — 실패\u003c/span>\u003cspan class=\"nav-act\">경쟁 상태 / 서버 오류\u003c/span>\u003cspan class=\"nav-to stay\">화면 잔류 · 공통 배너 · 버튼 복귀\u003c/span>\u003c/div>\n        \u003c/div>\n      \u003c/div>\n    \u003c/div>\n\n    \u003cdiv class=\"itm\" data-idx=\"10\">\n      \u003cdiv class=\"num\">11\u003c/div>\n      \u003cdiv>\n        \u003cdiv class=\"itm-title\">[STR 검토] — 이상거래 워닝(T5)\u003cspan class=\"req\">필수\u003c/span>\u003c/div>\n        \u003cdiv class=\"itm-desc\">\u003cstrong>노출\u003c/strong> 유형 '이상거래 워닝' 행에 보인다.\u003cbr>\u003cstrong>클릭 가능\u003c/strong> 상태가 미처리이거나 검토중이고 다른 관리자가 처리 중이 아닐 때 활성이다.\u003cbr>\u003cstrong>확인 사항\u003c/strong> 확인 다이얼로그를 띄우고(종결·비가역) 사유를 필수로 받는다. 다이얼로그에 체크박스 ☐ \"해당 기관 신규 거래 일시제한 동시 적용\"을 둔다(T7 경로 → ADM-03 KYC 상태 일시제한).\u003cbr>\u003cstrong>액션\u003c/strong> 이관 기록만 남긴다. STR 작성과 보고는 별도 AML 시스템에서 한다(작성자와 보고책임자 분리 · FIU 보고 · 5년 보존). 상태를 RESOLVED(STR 이관)로 바꾸고 행을 제거한다. 고객 화면에는 아무 표시도 하지 않는다.\u003cbr>\u003cspan class=\"basis\">근거 states T5 STR 이관 · L1 STR 보고·누설 금지 · 예외 E3·E4·E7\u003c/span>\u003c/div>\n        \u003cdiv class=\"itm-nav\">\u003cspan class=\"nav-tag\">화면 이동 · 인터랙션\u003c/span>\n          \u003cdiv class=\"nav-row\">\u003cspan class=\"nav-el\">[STR 검토] — 활성 조건\u003c/span>\u003cspan class=\"nav-act\">다음이 모두 아님: ①상태 미처리·검토중 이외 ②다른 관리자 처리 중\u003c/span>\u003cspan class=\"nav-to stay\">하나라도 해당 → 회색 비활성(공통 UI 규격)\u003c/span>\u003c/div>\n          \u003cdiv class=\"nav-row\">\u003cspan class=\"nav-el\">[STR 검토] — 클릭(활성)\u003c/span>\u003cspan class=\"nav-act\">클릭 → 다이얼로그: 제목 \"STR 검토 이관\" / 본문 \"이 건을 STR 검토로 이관합니다. 이후 작성·보고는 AML 시스템에서 진행되며 고객에게 표시되지 않습니다.\" / ☐ 해당 기관 신규 거래 일시제한 동시 적용 / 사유 입력(필수) / [이관] [돌아가기] → \"처리 중…\"\u003c/span>\u003cspan class=\"nav-to stay\">행 제거 + 토스트 \"STR 검토로 이관되었습니다\" · 체크 시 기관 KYC 상태 → 일시제한(ADM-03 반영 · 고객 KYC 배너 노출) · 감사로그\u003c/span>\u003c/div>\n          \u003cdiv class=\"nav-row\">\u003cspan class=\"nav-el\">[STR 검토] — 실패\u003c/span>\u003cspan class=\"nav-act\">경쟁 상태 / 서버 오류\u003c/span>\u003cspan class=\"nav-to stay\">화면 잔류 · 모달 유지·입력값 보존 · 공통 배너 · 버튼 복귀\u003c/span>\u003c/div>\n        \u003c/div>\n      \u003c/div>\n    \u003c/div>\n\n    \u003cdiv class=\"itm\" data-idx=\"11\">\n      \u003cdiv class=\"num\">12\u003c/div>\n      \u003cdiv>\n        \u003cdiv class=\"itm-title\">[무혐의 종결] — 이상거래 워닝(T5)\u003cspan class=\"req\">필수\u003c/span>\u003c/div>\n        \u003cdiv class=\"itm-desc\">\u003cstrong>노출\u003c/strong> 유형 '이상거래 워닝' 행에 보인다.\u003cbr>\u003cstrong>클릭 가능\u003c/strong> 상태가 미처리이거나 검토중이고 다른 관리자가 처리 중이 아닐 때 활성이다.\u003cbr>\u003cstrong>확인 사항\u003c/strong> 확인 다이얼로그를 띄운다(종결). 종결 근거를 필수로 받는다(감사·재점검용).\u003cbr>\u003cstrong>액션\u003c/strong> 상태를 RESOLVED(무혐의)로 바꾸고 행을 제거한다. 고객 화면에는 아무 표시도 하지 않는다.\u003cbr>\u003cspan class=\"basis\">근거 states T5 무혐의 종결 · ISMS 2.11.3\u003c/span>\u003c/div>\n        \u003cdiv class=\"itm-nav\">\u003cspan class=\"nav-tag\">화면 이동 · 인터랙션\u003c/span>\n          \u003cdiv class=\"nav-row\">\u003cspan class=\"nav-el\">[무혐의 종결] — 활성 조건\u003c/span>\u003cspan class=\"nav-act\">다음이 모두 아님: ①상태 미처리·검토중 이외 ②다른 관리자 처리 중\u003c/span>\u003cspan class=\"nav-to stay\">하나라도 해당 → 회색 비활성(공통 UI 규격)\u003c/span>\u003c/div>\n          \u003cdiv class=\"nav-row\">\u003cspan class=\"nav-el\">[무혐의 종결] — 클릭(활성)\u003c/span>\u003cspan class=\"nav-act\">클릭 → 다이얼로그: 제목 \"무혐의 종결\" / 본문 \"이 워닝을 무혐의로 종결합니다. 종결 근거는 감사로그에 남습니다.\" / 종결 근거 입력(필수 · 10~500자) / [종결] [돌아가기] → \"처리 중…\"\u003c/span>\u003cspan class=\"nav-to stay\">행 제거 + 토스트 \"무혐의로 종결되었습니다\" · 감사로그\u003c/span>\u003c/div>\n          \u003cdiv class=\"nav-row\">\u003cspan class=\"nav-el\">[무혐의 종결] — 실패\u003c/span>\u003cspan class=\"nav-act\">경쟁 상태 / 서버 오류\u003c/span>\u003cspan class=\"nav-to stay\">화면 잔류 · 모달 유지 · 공통 배너 · 버튼 복귀\u003c/span>\u003c/div>\n        \u003c/div>\n      \u003c/div>\n    \u003c/div>\n\n    \u003cdiv class=\"itm\" data-idx=\"12\">\n      \u003cdiv class=\"num\">13\u003c/div>\n      \u003cdiv>\n        \u003cdiv class=\"itm-title\">[확인] — 월렛·키 알람(T6)\u003cspan class=\"req\">필수\u003c/span>\u003c/div>\n        \u003cdiv class=\"itm-desc\">\u003cstrong>노출\u003c/strong> 유형 '월렛·키 알람' 행에 보인다.\u003cbr>\u003cstrong>클릭 가능\u003c/strong> 상태가 '미확인'일 때만 활성이다.\u003cbr>\u003cstrong>확인 사항\u003c/strong> 없다. 확인 다이얼로그를 띄우지 않는다.\u003cbr>\u003cstrong>액션\u003c/strong> 보안 이벤트(비인가 이체 시도 High · 핫월렛 비중 {정책값 20}% 초과 스윕 워닝(ADM-03 값 표시) · 서명 시스템 장애)를 확인했다고 표시한다. 상태를 IN_PROGRESS(확인)로 두고 행은 남기며 \"확인 · {관리자 ID} · {일시}\"를 표시한다. 실제 조치(키 교체·콜드 이관 스윕·비상 대응)는 화면 밖 운영 절차이고, 처리함에는 확인과 조치 결과만 기록한다.\u003cbr>\u003cspan class=\"basis\">근거 states T6 · ISMS 2.7.2 · 예외 B6·F6\u003c/span>\u003c/div>\n        \u003cdiv class=\"itm-nav\">\u003cspan class=\"nav-tag\">화면 이동 · 인터랙션\u003c/span>\n          \u003cdiv class=\"nav-row\">\u003cspan class=\"nav-el\">[확인] — 활성 조건\u003c/span>\u003cspan class=\"nav-act\">상태 '미확인'일 때만\u003c/span>\u003cspan class=\"nav-to stay\">해당 없음 → 회색 비활성(공통 UI 규격)\u003c/span>\u003c/div>\n          \u003cdiv class=\"nav-row\">\u003cspan class=\"nav-el\">[확인] — 클릭(활성)\u003c/span>\u003cspan class=\"nav-act\">클릭 → 확인 없음 → \"처리 중…\"(1초 내)\u003c/span>\u003cspan class=\"nav-to stay\">상태 \"확인 · {관리자 ID} · {일시}\" · [확인] 비활성 · [조치완료] 활성으로 전환 · 감사로그\u003c/span>\u003c/div>\n          \u003cdiv class=\"nav-row\">\u003cspan class=\"nav-el\">[확인] — 실패\u003c/span>\u003cspan class=\"nav-act\">경쟁 상태 / 서버 오류\u003c/span>\u003cspan class=\"nav-to stay\">화면 잔류 · 공통 배너 · 버튼 복귀\u003c/span>\u003c/div>\n        \u003c/div>\n      \u003c/div>\n    \u003c/div>\n\n    \u003cdiv class=\"itm\" data-idx=\"13\">\n      \u003cdiv class=\"num\">14\u003c/div>\n      \u003cdiv>\n        \u003cdiv class=\"itm-title\">[조치완료] — 월렛·키 알람(T6)\u003cspan class=\"req\">필수\u003c/span>\u003c/div>\n        \u003cdiv class=\"itm-desc\">\u003cstrong>노출\u003c/strong> 유형 '월렛·키 알람' 행에 보인다.\u003cbr>\u003cstrong>클릭 가능\u003c/strong> 상태가 '확인'일 때만 활성이다. [확인]을 거치지 않으면 누를 수 없다(목업은 '미확인' 상태라 비활성이다).\u003cbr>\u003cstrong>확인 사항\u003c/strong> 확인 다이얼로그를 띄운다(종결). 조치 내용을 필수로 받는다(자유입력 10~500자).\u003cbr>\u003cstrong>액션\u003c/strong> 상태를 RESOLVED(조치완료)로 바꾸고 행을 제거한다. 서명 시스템 장애 건은 BCP/DR 절차를 마친 뒤에 종결한다.\u003cbr>\u003cspan class=\"basis\">근거 states T6 조치완료 · ISMS 2.11.1 · 예외 F6\u003c/span>\u003c/div>\n        \u003cdiv class=\"itm-nav\">\u003cspan class=\"nav-tag\">화면 이동 · 인터랙션\u003c/span>\n          \u003cdiv class=\"nav-row\">\u003cspan class=\"nav-el\">[조치완료] — 활성 조건\u003c/span>\u003cspan class=\"nav-act\">상태 '확인'일 때만(미확인 상태에서는 비활성 · 다른 관리자 처리 중 아님)\u003c/span>\u003cspan class=\"nav-to stay\">해당 없음 → 회색 비활성 · 미확인 상태 클릭 시 인라인 ⚠ \"먼저 [확인]을 눌러 주세요\"\u003c/span>\u003c/div>\n          \u003cdiv class=\"nav-row\">\u003cspan class=\"nav-el\">[조치완료] — 클릭(활성)\u003c/span>\u003cspan class=\"nav-act\">클릭 → 다이얼로그: 제목 \"조치완료\" / 본문 \"조치 내용을 기록하고 이 알람을 종결합니다.\" / 조치 내용 입력(필수) / [종결] [돌아가기] → \"처리 중…\"\u003c/span>\u003cspan class=\"nav-to stay\">행 제거 + 토스트 \"알람이 종결되었습니다\" · 감사로그\u003c/span>\u003c/div>\n          \u003cdiv class=\"nav-row\">\u003cspan class=\"nav-el\">[조치완료] — 실패\u003c/span>\u003cspan class=\"nav-act\">경쟁 상태 / 서버 오류\u003c/span>\u003cspan class=\"nav-to stay\">화면 잔류 · 모달 유지 · 공통 배너 · 버튼 복귀\u003c/span>\u003c/div>\n        \u003c/div>\n      \u003c/div>\n    \u003c/div>\n\n    \u003cdiv class=\"itm\" data-idx=\"14\">\n      \u003cdiv class=\"num\">15\u003c/div>\n      \u003cdiv>\n        \u003cdiv class=\"itm-title\">[신규 거래 제한] — KYC 재이행(T7)\u003cspan class=\"req\">필수\u003c/span>\u003c/div>\n        \u003cdiv class=\"itm-desc\">\u003cstrong>노출\u003c/strong> 유형 'KYC 재이행' 행에 보인다.\u003cbr>\u003cstrong>클릭 가능\u003c/strong> 상태가 '일시제한 예정'이고, 기관 KYC 상태가 이미 일시제한·동결·해지가 아니며, 다른 관리자가 처리 중이 아닐 때 활성이다.\u003cbr>\u003cstrong>확인 사항\u003c/strong> 확인 다이얼로그를 띄운다(계정 상태 변경).\u003cbr>\u003cstrong>액션\u003c/strong> 기관 KYC 상태를 활성에서 \u003cstrong>일시제한\u003c/strong>으로 바꾼다(ADM-03 상태 기계 · 전 화면 게이팅 G-3의 단일 출처). 상태를 RESOLVED(제한 적용)로 바꾸고 행을 제거한다. 고객 화면은 EXC-01·BRK-02·BRK-03에 KYC 예외 배너를 띄우고 신규 요청을 막되 진행 중 건은 유지한다. 재이행을 마치면 아이템은 사람 개입 없이 종결한다(states 결정필요 ③). 일시제한에서 활성으로 되돌리는 것은 ADM-03 [상태 변경 ▾]로 한다.\u003cbr>\u003cspan class=\"basis\">근거 states T7 · L1 §5의2 고객확인 재이행 · 예외 A6 · G-3\u003c/span>\u003c/div>\n        \u003cdiv class=\"itm-nav\">\u003cspan class=\"nav-tag\">화면 이동 · 인터랙션\u003c/span>\n          \u003cdiv class=\"nav-row\">\u003cspan class=\"nav-el\">[신규 거래 제한] — 활성 조건\u003c/span>\u003cspan class=\"nav-act\">다음이 모두 아님: ①상태 '일시제한 예정' 이외 ②기관 KYC 상태가 이미 일시제한·동결·해지 ③다른 관리자 처리 중\u003c/span>\u003cspan class=\"nav-to stay\">하나라도 해당 → 회색 비활성 · ②는 인라인 ⚠ \"이미 제한된 기관입니다\"\u003c/span>\u003c/div>\n          \u003cdiv class=\"nav-row\">\u003cspan class=\"nav-el\">[신규 거래 제한] — 클릭(활성)\u003c/span>\u003cspan class=\"nav-act\">클릭 → 다이얼로그: 제목 \"신규 거래 제한 — ORG-C\" / 본문 \"ORG-C의 KYC 상태를 일시제한으로 변경합니다. 신규 교환 요청·게시·신청이 차단되고 고객 화면에 안내 배너가 표시됩니다.\" / [제한 적용] [돌아가기] → \"처리 중…\"\u003c/span>\u003cspan class=\"nav-to stay\">행 제거 + 토스트 \"ORG-C 신규 거래 제한을 적용했습니다\" · ADM-03 KYC 상태 칩 '일시제한' 갱신 · 감사로그\u003c/span>\u003c/div>\n          \u003cdiv class=\"nav-row\">\u003cspan class=\"nav-el\">[신규 거래 제한] — 실패\u003c/span>\u003cspan class=\"nav-act\">경쟁 상태(재이행 완료로 자동 종결됨 등) / 서버 오류\u003c/span>\u003cspan class=\"nav-to stay\">화면 잔류 · 경쟁 → 배너 \"이미 처리된 건입니다 — 목록을 갱신했습니다\" · 행 제거 / 오류 → 공통 배너 · 버튼 복귀\u003c/span>\u003c/div>\n        \u003c/div>\n      \u003c/div>\n    \u003c/div>\n\n    \u003cdiv class=\"itm\" data-idx=\"15\">\n      \u003cdiv class=\"num\">16\u003c/div>\n      \u003cdiv>\n        \u003cdiv class=\"itm-title\">[본인확인 후 해제] — 계정 잠금(T8)\u003cspan class=\"req\">필수\u003c/span>\u003c/div>\n        \u003cdiv class=\"itm-desc\">\u003cstrong>노출\u003c/strong> 유형 '계정 잠금' 행에 보인다. 탈취 의심 건(High 등급 행)에는 이 자리에 \u003cstrong>[동결 전환]\u003c/strong>이 함께 보인다.\u003cbr>\u003cstrong>클릭 가능\u003c/strong> 상태가 '잠금'이고 다른 관리자가 처리 중이 아닐 때 활성이다.\u003cbr>\u003cstrong>확인 사항\u003c/strong> 확인 다이얼로그를 띄운다(계정 상태 변경). [동결 전환]은 제목 \"동결 전환\" / 본문 \"계정 탈취 의심으로 기관을 동결하고 STR 검토 건을 생성합니다.\" / [동결] [돌아가기]로 띄운다.\u003cbr>\u003cstrong>액션\u003c/strong> 로그인 5회 실패로 걸린 잠금(AUTH-01)을 푼다. 상태를 RESOLVED(해제)로 바꾸고 행을 제거하며, 가입자 계정 상태를 활성으로 되돌리고 실패 카운트를 0으로 만든다. 기존 비밀번호와 OTP는 그대로 쓴다. [동결 전환]은 기관 KYC 상태를 동결로 바꾸고 STR 검토를 만든다.\u003cbr>\u003cspan class=\"chk\">[확인필요]\u003c/span> 콘솔 밖에서 하는 본인확인 절차(유선·서면).\u003cbr>\u003cspan class=\"basis\">근거 states T8 · AUTH-01 잠금 · ISMS 2.5\u003c/span>\u003c/div>\n        \u003cdiv class=\"itm-nav\">\u003cspan class=\"nav-tag\">화면 이동 · 인터랙션\u003c/span>\n          \u003cdiv class=\"nav-row\">\u003cspan class=\"nav-el\">[본인확인 후 해제] — 활성 조건\u003c/span>\u003cspan class=\"nav-act\">다음이 모두 아님: ①상태 '잠금' 이외 ②다른 관리자 처리 중\u003c/span>\u003cspan class=\"nav-to stay\">하나라도 해당 → 회색 비활성(공통 UI 규격)\u003c/span>\u003c/div>\n          \u003cdiv class=\"nav-row\">\u003cspan class=\"nav-el\">[본인확인 후 해제] — 클릭(활성)\u003c/span>\u003cspan class=\"nav-act\">클릭 → 다이얼로그: 제목 \"계정 잠금 해제 — ORG-A 가입자 K\" / 본문 \"본인확인 완료를 기록하고 잠금을 해제합니다. 가입자는 기존 비밀번호·OTP로 다시 로그인할 수 있습니다.\" / ☐ 본인확인 완료(필수 체크) + 확인 방법 입력(필수) / [해제] [돌아가기] · 체크·입력 미충족 시 [해제] 비활성 → \"처리 중…\"\u003c/span>\u003cspan class=\"nav-to stay\">행 제거 + 토스트 \"잠금이 해제되었습니다\" · 계정 상태 '활성' · 감사로그(확인 방법 포함)\u003c/span>\u003c/div>\n          \u003cdiv class=\"nav-row\">\u003cspan class=\"nav-el\">[본인확인 후 해제] — 실패\u003c/span>\u003cspan class=\"nav-act\">경쟁 상태 / 서버 오류\u003c/span>\u003cspan class=\"nav-to stay\">화면 잔류 · 모달 유지 · 공통 배너 · 버튼 복귀\u003c/span>\u003c/div>\n        \u003c/div>\n      \u003c/div>\n    \u003c/div>\n\n    \u003cdiv class=\"itm\" data-idx=\"16\">\n      \u003cdiv class=\"num\">17\u003c/div>\n      \u003cdiv>\n        \u003cdiv class=\"itm-title\">[원인 규명] — 3면 대사 불일치(X3)\u003cspan class=\"req\">필수\u003c/span>\u003c/div>\n        \u003cdiv class=\"itm-desc\">\u003cstrong>노출\u003c/strong> 유형 '3면 대사 불일치' 행에 보인다.\u003cbr>\u003cstrong>클릭 가능\u003c/strong> 상태가 '미처리'일 때만 활성이다.\u003cbr>\u003cstrong>확인 사항\u003c/strong> 없다. 확인 다이얼로그를 띄우지 않는다.\u003cbr>\u003cstrong>액션\u003c/strong> 대사 배치에서 내부 장부·온체인·콜드 기록이 어긋난 건의 규명 착수를 표시한다. 상태를 IN_PROGRESS(원인 규명 중)로 두고 행은 남기며 \"원인 규명 중 · {관리자 ID}\"를 표시한다. 해당 지갑의 출금 자동 동결은 그대로 둔다. 규명 작업은 화면 밖에서 CSV ⑤ 3면 대사를 받아 대조하고, 처리함에는 착수와 종결만 기록한다.\u003cbr>\u003cspan class=\"basis\">근거 states X3 · 예외 X3 · ISMS 2.9.4\u003c/span>\u003c/div>\n        \u003cdiv class=\"itm-nav\">\u003cspan class=\"nav-tag\">화면 이동 · 인터랙션\u003c/span>\n          \u003cdiv class=\"nav-row\">\u003cspan class=\"nav-el\">[원인 규명] — 활성 조건\u003c/span>\u003cspan class=\"nav-act\">상태 '미처리'일 때만\u003c/span>\u003cspan class=\"nav-to stay\">해당 없음 → 회색 비활성(공통 UI 규격)\u003c/span>\u003c/div>\n          \u003cdiv class=\"nav-row\">\u003cspan class=\"nav-el\">[원인 규명] — 클릭(활성)\u003c/span>\u003cspan class=\"nav-act\">클릭 → 확인 없음 → \"처리 중…\"(1초 내)\u003c/span>\u003cspan class=\"nav-to stay\">상태 \"원인 규명 중 · {관리자 ID}\" · [원인 규명] 비활성 · [해제·종결] 활성 조건 검사 시작 · 감사로그\u003c/span>\u003c/div>\n          \u003cdiv class=\"nav-row\">\u003cspan class=\"nav-el\">[원인 규명] — 실패\u003c/span>\u003cspan class=\"nav-act\">경쟁 상태 / 서버 오류\u003c/span>\u003cspan class=\"nav-to stay\">화면 잔류 · 공통 배너 · 버튼 복귀\u003c/span>\u003c/div>\n        \u003c/div>\n      \u003c/div>\n    \u003c/div>\n\n    \u003cdiv class=\"itm\" data-idx=\"17\">\n      \u003cdiv class=\"num\">18\u003c/div>\n      \u003cdiv>\n        \u003cdiv class=\"itm-title\">[해제·종결] — 3면 대사 불일치(X3)\u003cspan class=\"req\">필수\u003c/span>\u003c/div>\n        \u003cdiv class=\"itm-desc\">\u003cstrong>노출\u003c/strong> 유형 '3면 대사 불일치' 행에 보인다.\u003cbr>\u003cstrong>클릭 가능\u003c/strong> 상태가 '원인 규명 중'이고, 최신 대사 배치 결과가 일치(matched)이며, 다른 관리자가 처리 중이 아닐 때만 활성이다. 일치 여부는 시스템이 판정하므로 불일치 상태에서는 종결할 수 없다(목업은 비활성이다).\u003cbr>\u003cstrong>확인 사항\u003c/strong> 확인 다이얼로그를 띄운다(동결 해제는 비가역이다). 규명 결과를 필수로 받는다.\u003cbr>\u003cstrong>액션\u003c/strong> 출금 동결을 풀고 상태를 RESOLVED(해제·종결)로 바꾸며 행을 제거한다.\u003cbr>\u003cspan class=\"basis\">근거 states X3(일치 확인 → 동결 해제·종결) · 구분회계 V11 · ISMS 2.9.4\u003c/span>\u003c/div>\n        \u003cdiv class=\"itm-nav\">\u003cspan class=\"nav-tag\">화면 이동 · 인터랙션\u003c/span>\n          \u003cdiv class=\"nav-row\">\u003cspan class=\"nav-el\">[해제·종결] — 활성 조건\u003c/span>\u003cspan class=\"nav-act\">다음이 모두 참: ①상태 '원인 규명 중' ②최신 대사 결과 일치 ③다른 관리자 처리 중 아님\u003c/span>\u003cspan class=\"nav-to stay\">하나라도 미충족 → 회색 비활성 · ②는 확장 패널 인라인 ⚠ \"최신 대사 결과가 아직 불일치입니다 — 재대사 후 종결할 수 있습니다\"\u003c/span>\u003c/div>\n          \u003cdiv class=\"nav-row\">\u003cspan class=\"nav-el\">[해제·종결] — 클릭(활성)\u003c/span>\u003cspan class=\"nav-act\">클릭 → 다이얼로그: 제목 \"대사 불일치 종결 · 출금 동결 해제\" / 본문 \"ORG-B 수탁 지갑의 출금 동결을 해제하고 이 건을 종결합니다.\" / 규명 결과 입력(필수) / [해제·종결] [돌아가기] → \"처리 중…\"\u003c/span>\u003cspan class=\"nav-to stay\">행 제거 + 토스트 \"출금 동결이 해제되고 종결되었습니다\" · 감사로그\u003c/span>\u003c/div>\n          \u003cdiv class=\"nav-row\">\u003cspan class=\"nav-el\">[해제·종결] — 실패\u003c/span>\u003cspan class=\"nav-act\">종결 시점 재대사 불일치 / 경쟁 상태 / 서버 오류\u003c/span>\u003cspan class=\"nav-to stay\">화면 잔류 · 재대사 불일치 → 인라인 ⚠ 재노출·버튼 비활성 / 경쟁·오류 → 공통 배너 · 버튼 복귀\u003c/span>\u003c/div>\n        \u003c/div>\n      \u003c/div>\n    \u003c/div>\n\n    \u003cdiv class=\"itm\" data-idx=\"18\">\n      \u003cdiv class=\"num\">19\u003c/div>\n      \u003cdiv>\n        \u003cdiv class=\"itm-title\">집행 대기 목록 (표시 전용)\u003c/div>\n        \u003cdiv class=\"itm-desc\">· 행 클릭 없음(확장 없음 — 상세는 집행 명세 Excel) · 열: 건 · 상태 · 집행 명세 · 콜드 집행 결과(txhash) · 처리\u003cbr>· \u003cstrong>유입\u003c/strong>: T1 나목 승인(1건 1행 — 고객→DSRV 900 USDC·DSRV→고객 899.73 USDT 양방향을 한 행으로, 2행 분리 여부 \u003cspan class=\"chk\">[확인필요]\u003c/span>) · T2 마목 이전 진행(양측 각 1행 = 2행) · T3 출금 승인 · 콜드→핫 보충·스윕(운영 지갑 이동 — 온라인 집행 버튼 없음)\u003cbr>· 상태 값: 집행 대기 / 이전 진행 / 조회 중 / 대사 불일치(회송) — 완료 시 행 제거(이후 조회는 CSV ③ 통합 거래)\u003cbr>· \u003cstrong>목록 규격\u003c/strong>: 승인 시각 오름차순(오래된 건 위) · 빈 상태 \"집행 대기 건이 없습니다\" + \"처리함에서 승인한 건이 여기에 표시됩니다\" · 로딩 \"불러오는 중…\" · 전량 표시 · 페이지 스크롤([더 보기]·페이지네이션·무한 스크롤 없음) · 갱신: 처리함 승인 즉시·완료 처리 즉시\u003cbr>· 마목 '이전 진행' 건을 states T2 '정산 배치(1영업일 3회)'가 아니라 이 표의 건별 수동 집행으로 처리하는 정합 \u003cspan class=\"chk\">[확인필요: BRK-05 정산 배치 서술과 통일]\u003c/span>\u003cbr>\u003cspan class=\"basis\">근거 states T1·T2·T3 집행 대기 · 09 §0 정산(콜드 수동) · L4 §26 · ISMS 2.7.2\u003c/span>\u003c/div>\n        \u003cdiv class=\"itm-nav\">\u003cspan class=\"nav-tag\">화면 이동 · 인터랙션\u003c/span>\n          \u003cdiv class=\"nav-row\">\u003cspan class=\"nav-el\">집행 대기 행(버튼·입력 제외 셀)\u003c/span>\u003cspan class=\"nav-act\">클릭\u003c/span>\u003cspan class=\"nav-to stay\">무반응(표시 전용)\u003c/span>\u003c/div>\n        \u003c/div>\n      \u003c/div>\n    \u003c/div>\n\n    \u003cdiv class=\"itm\" data-idx=\"19\">\n      \u003cdiv class=\"num\">20\u003c/div>\n      \u003cdiv>\n        \u003cdiv class=\"itm-title\">[집행 명세 다운로드 (Excel)]\u003cspan class=\"req\">필수\u003c/span>\u003c/div>\n        \u003cdiv class=\"itm-desc\">\u003cstrong>노출\u003c/strong> 집행 대기 표의 모든 행에 보인다(행마다 반복 · 대표 핀 1개).\u003cbr>\u003cstrong>클릭 가능\u003c/strong> 행이 표에 있는 동안 항상 활성이다. 온체인 조회 중이거나 대사가 불일치인 상태에서도 재확인용으로 활성이고, 파일 생성 중에만 비활성이다.\u003cbr>\u003cstrong>확인 사항\u003c/strong> 없다. 확인 다이얼로그를 띄우지 않는다.\u003cbr>\u003cstrong>액션\u003c/strong> 콜드에서 수행할 작업 명세를 1건 1파일로 내려받는다 — 거래번호 · 출금 지갑(내부 식별) · 수신 주소 \u003cstrong>전문\u003c/strong>(마스킹 없이 소문자) · 자산 · 수량(CSV 규격이라 쉼표 없음) · 명세 생성 시각(ISO 8601 +09:00) · 명세 해시 · 승인자 ID. 파일명은 \u003ccode>집행명세_{거래번호}_{YYYYMMDD-HHMM}.xlsx\u003c/code>다. 재다운로드를 허용하고 매회 열람 기록 ⑥에 감사기록으로 남긴다. 화면에는 다운로드 이력을 표시하지 않는다(열람 기록은 CSV ⑥으로만 확인한다).\u003cbr>\u003cspan class=\"basis\">근거 notation 주소·해시(CSV·감사기록 전문) · ISMS 2.9.4 · 예외 H4\u003c/span>\u003c/div>\n        \u003cdiv class=\"itm-nav\">\u003cspan class=\"nav-tag\">화면 이동 · 인터랙션\u003c/span>\n          \u003cdiv class=\"nav-row\">\u003cspan class=\"nav-el\">[집행 명세 다운로드] — 활성 조건\u003c/span>\u003cspan class=\"nav-act\">행이 표에 있는 동안 항상 활성(조회 중·대사 불일치 상태에서도 재확인용으로 활성) · 생성 중만 비활성\u003c/span>\u003cspan class=\"nav-to stay\">—\u003c/span>\u003c/div>\n          \u003cdiv class=\"nav-row\">\u003cspan class=\"nav-el\">[집행 명세 다운로드] — 클릭(활성)\u003c/span>\u003cspan class=\"nav-act\">클릭 → 확인 없음 → 라벨 \"생성 중…\"·중복 클릭 차단 → 브라우저 다운로드\u003c/span>\u003cspan class=\"nav-to stay\">라벨 복귀 · 버튼 아래 다운로드 이력 갱신 · 열람 기록 감사기록 · 이동 없음\u003c/span>\u003c/div>\n          \u003cdiv class=\"nav-row\">\u003cspan class=\"nav-el\">[집행 명세 다운로드] — 실패\u003c/span>\u003cspan class=\"nav-act\">생성 실패 / 3초 초과\u003c/span>\u003cspan class=\"nav-to stay\">화면 잔류 · 상단 배너 \"일시적인 오류입니다. 잠시 후 다시 시도해 주세요\" · 라벨 복귀\u003c/span>\u003c/div>\n        \u003c/div>\n      \u003c/div>\n    \u003c/div>\n\n    \u003cdiv class=\"itm\" data-idx=\"20\">\n      \u003cdiv class=\"num\">21\u003c/div>\n      \u003cdiv>\n        \u003cdiv class=\"itm-title\">txhash 입력\u003cspan class=\"req\">필수\u003c/span>\u003c/div>\n        \u003cdiv class=\"itm-desc\">\u003cstrong>입력 가능\u003c/strong> 집행 대기 표의 행마다 있다(대표 핀 1개). 항상 입력할 수 있고, [완료 처리]를 눌러 온체인을 조회하는 동안만 비활성이 된다. 플레이스홀더는 \"txhash 입력 (0x…)\"이다.\u003cbr>\u003cstrong>허용 문자\u003c/strong> \u003cstrong>0x + 16진수 64자(총 66자)\u003c/strong>만 받는다. 대문자는 소문자로 자동 변환하고, 붙여넣기한 값의 앞뒤 공백은 지우며, 66자를 넘는 입력은 무시한다.\u003cbr>\u003cstrong>검증\u003c/strong> ① 0x + 16진수 64자 형식일 것 ② 다른 건에 등록된 값이 아닐 것 ③ 온체인 내역이 집행 명세와 일치할 것 ④ 트랜잭션이 조회될 것. ①은 키 입력마다 보되 66자에 이르거나 포커스 아웃할 때 판정하고, ②③④는 [완료 처리]를 눌렀을 때 서버가 본다.\u003cbr>\u003cstrong>실패 처리\u003c/strong> ① 위반 → 빨간 테두리 + ⚠ \"txhash 형식이 올바르지 않습니다 — 0x로 시작하는 64자리 16진수를 입력해 주세요\". ② 위반 → ⚠ \"이미 다른 건에 등록된 txhash입니다\". ③ 위반 → 빨간 테두리 + ⚠ \"온체인 내역이 집행 명세와 일치하지 않습니다 — 주소·자산·수량을 확인해 주세요\". ④ 위반 → ⚠ \"트랜잭션을 찾을 수 없습니다 — 컨펌 후 다시 시도해 주세요\". 어느 쪽이든 [완료 처리] 비활성.\u003cbr>\u003cstrong>연동\u003c/strong> 형식이 정상이어야 [완료 처리]가 활성이 된다. 일치하면 초록 ✓ \"명세 일치\"를 붙인다(목업 3행). 입력값은 [완료 처리] 전까지 저장하지 않아 화면을 벗어나거나 새로고침하면 사라진다.\u003cbr>\u003cstrong>저장\u003c/strong> [완료 처리] 시점에 감사기록으로 남긴다. 화면 표기는 마스킹(0x7c1e…)하고 기록은 전문으로 둔다.\u003cbr>\u003cspan class=\"chk\">[확인필요]\u003c/span> 일치로 인정할 최소 컨펌 수.\u003cbr>\u003cspan class=\"basis\">근거 notation 주소·해시 표기 · 예외 F6·H4\u003c/span>\u003c/div>\n        \u003cdiv class=\"itm-nav\">\u003cspan class=\"nav-tag\">화면 이동 · 인터랙션\u003c/span>\n          \u003cdiv class=\"nav-row\">\u003cspan class=\"nav-el\">txhash 필드 — 정상 입력\u003c/span>\u003cspan class=\"nav-act\">66자 도달 또는 포커스 아웃\u003c/span>\u003cspan class=\"nav-to stay\">경고 제거 · [완료 처리] 활성\u003c/span>\u003c/div>\n          \u003cdiv class=\"nav-row\">\u003cspan class=\"nav-el\">txhash 필드 — 규칙 ① 위반(형식)\u003c/span>\u003cspan class=\"nav-act\">66자 도달 또는 포커스 아웃\u003c/span>\u003cspan class=\"nav-to stay\">⚠ \"txhash 형식이 올바르지 않습니다 — 0x로 시작하는 64자리 16진수를 입력해 주세요\" · [완료 처리] 비활성\u003c/span>\u003c/div>\n          \u003cdiv class=\"nav-row\">\u003cspan class=\"nav-el\">txhash 필드 — 규칙 ② 위반(중복)\u003c/span>\u003cspan class=\"nav-act\">[완료 처리] 클릭 시 서버 검증\u003c/span>\u003cspan class=\"nav-to stay\">⚠ \"이미 다른 건에 등록된 txhash입니다\" · 입력값 유지\u003c/span>\u003c/div>\n          \u003cdiv class=\"nav-row\">\u003cspan class=\"nav-el\">txhash 필드 — 규칙 ③ 위반(대사 불일치)\u003c/span>\u003cspan class=\"nav-act\">[완료 처리] 클릭 시 온체인 조회\u003c/span>\u003cspan class=\"nav-to stay\">⚠ \"온체인 내역이 집행 명세와 일치하지 않습니다 — 주소·자산·수량을 확인해 주세요\" · 입력값 유지\u003c/span>\u003c/div>\n          \u003cdiv class=\"nav-row\">\u003cspan class=\"nav-el\">txhash 필드 — 규칙 ④ 위반(트랜잭션 미확인)\u003c/span>\u003cspan class=\"nav-act\">[완료 처리] 클릭 시 온체인 조회\u003c/span>\u003cspan class=\"nav-to stay\">⚠ \"트랜잭션을 찾을 수 없습니다 — 컨펌 후 다시 시도해 주세요\" · 입력값 유지\u003c/span>\u003c/div>\n          \u003cdiv class=\"nav-row\">\u003cspan class=\"nav-el\">txhash 필드 (비활성)\u003c/span>\u003cspan class=\"nav-act\">온체인 조회 중\u003c/span>\u003cspan class=\"nav-to stay\">무반응 · 필드 비활성 · 라벨 \"조회 중…\"이 사유\u003c/span>\u003c/div>\n        \u003c/div>\n      \u003c/div>\n    \u003c/div>\n\n    \u003cdiv class=\"itm\" data-idx=\"21\">\n      \u003cdiv class=\"num\">22\u003c/div>\n      \u003cdiv>\n        \u003cdiv class=\"itm-title\">[완료 처리]\u003cspan class=\"req\">필수\u003c/span>\u003c/div>\n        \u003cdiv class=\"itm-desc\">\u003cstrong>노출\u003c/strong> 집행 대기 표의 모든 행에 보인다(행마다 반복 · 대표 핀 1개).\u003cbr>\u003cstrong>클릭 가능\u003c/strong> 같은 행의 txhash 형식이 정상일 때만 활성이다.\u003cbr>\u003cstrong>확인 사항\u003c/strong> 클릭하면 라벨을 \"조회 중…\"으로 바꾸고 필드를 비활성으로 둔 뒤 온체인을 조회한다(3초를 넘기면 오류). 명세와 대사(수신 주소·자산(컨트랙트)·수량 일치)가 맞을 때만 확인 다이얼로그를 띄운다 — 제목 \"집행 완료 처리\" / 본문 \"온체인 내역이 집행 명세와 일치합니다(수신 주소·자산·수량). 완료로 확정하면 거래 상태·잔고에 반영되며 되돌릴 수 없습니다.\" / [완료 확정] [돌아가기].\u003cbr>\u003cstrong>액션\u003c/strong> 나목은 EXC 상태를 '완료'로 바꾸고 고객 EXC-04에 표시하며 잔고에 반영하고 이메일 ③을 보낸다. 마목은 해당 방향의 이전을 완료로 두고, \u003cstrong>양측 2행이 모두 완료됐을 때\u003c/strong> BRK를 '완료'로 바꾸고 BRK-05에 표시하며 이메일 ③을 보낸다. 출금은 완료로 두고 행을 제거한다. txhash를 CSV ③에 기록하고 누가 언제 처리했는지 감사기록에 남긴다.\u003cbr>\u003cspan class=\"basis\">근거 states T1·T2·T3 완료 · notation 이메일 통지 ③ · ISMS 2.9.4\u003c/span>\u003c/div>\n        \u003cdiv class=\"itm-nav\">\u003cspan class=\"nav-tag\">화면 이동 · 인터랙션\u003c/span>\n          \u003cdiv class=\"nav-row\">\u003cspan class=\"nav-el\">[완료 처리] — 활성 조건\u003c/span>\u003cspan class=\"nav-act\">다음이 모두 아님: ①txhash 빈칸·형식 오류·중복 ②조회 중 ③이 행의 집행 명세 미다운로드(강제 여부 \u003cspan class=\"chk\">[확인필요]\u003c/span>)\u003c/span>\u003cspan class=\"nav-to stay\">하나라도 해당 → 회색 비활성(공통 UI 규격) · 사유는 txhash 필드 인라인 ⚠으로 이미 노출\u003c/span>\u003c/div>\n          \u003cdiv class=\"nav-row\">\u003cspan class=\"nav-el\">[완료 처리] — 클릭(활성)\u003c/span>\u003cspan class=\"nav-act\">클릭 → 라벨 \"조회 중…\"·필드 비활성 → 온체인 조회(3초 초과 → 오류) → 일치 → 다이얼로그: 제목 \"집행 완료 처리\" / 본문 \"온체인 내역이 집행 명세와 일치합니다(수신 주소·자산·수량). 완료로 확정하면 거래 상태·잔고에 반영되며 되돌릴 수 없습니다.\" / [완료 확정] [돌아가기]\u003c/span>\u003cspan class=\"nav-to stay\">행 제거 + 토스트 \"{거래번호} 집행 완료 — 고객 화면에 반영되었습니다\" · 고객 이메일 ③(나목·마목 완료 시) · 감사기록\u003c/span>\u003c/div>\n          \u003cdiv class=\"nav-row\">\u003cspan class=\"nav-el\">[완료 처리] — 실패\u003c/span>\u003cspan class=\"nav-act\">대사 불일치 / 트랜잭션 미확인 / 조회 오류\u003c/span>\u003cspan class=\"nav-to stay\">화면 잔류 · 불일치 → 행 유지·상태 '대사 불일치'·필드 상태 ⑥·처리함에 워닝 행 회송(유형 '집행 대사 불일치' · High — 프레임 처리함에 예시 행 없음 \u003cspan class=\"chk\">[확인필요: X3와 통합 여부]\u003c/span>) / 미확인 → 필드 ⑦·상태 유지 / 오류 → 공통 배너 · 라벨 복귀\u003c/span>\u003c/div>\n        \u003c/div>\n      \u003c/div>\n    \u003c/div>\n\n    \u003cdiv class=\"itm\" data-idx=\"22\">\n      \u003cdiv class=\"num\">23\u003c/div>\n      \u003cdiv>\n        \u003cdiv class=\"itm-title\">[CSV 다운로드] × 6종\u003cspan class=\"req\">필수\u003c/span>\u003c/div>\n        \u003cdiv class=\"itm-desc\">\u003cstrong>노출\u003c/strong> 6종 각각 버튼 1개로 항상 보인다(대표 핀 = ①). 어드민 역할이 1종이라 6종 모두 같은 조건으로 보인다.\u003cbr>\u003cstrong>클릭 가능\u003c/strong> 항상 활성이다. 같은 종류를 생성하는 동안만 비활성이고 다른 종류는 함께 받을 수 있다.\u003cbr>\u003cstrong>확인 사항\u003c/strong> 없다. 확인 다이얼로그를 띄우지 않는다.\u003cbr>\u003cstrong>액션\u003c/strong> 조회성 데이터를 화면 표 없이 CSV로만 내려받는다 — ① 기관-가입자 목록 ② 거래 요청 목록 ③ 통합 거래 목록 ④ 구분회계 집계(수탁·운영 원장 · 스프레드수익(운영손익)·중개수수료 계정 — \u003cstrong>고객 화면에 보이지 않고 어드민 CSV에만 있다\u003c/strong>) ⑤ 3면 대사 ⑥ 열람 기록. 컬럼 정의는 하단 부록에 있다. 기간·조건을 고르지 않고, 클릭하면 생성 시점 기준 전체 기간을 1파일로 동기 생성한다(비동기 생성도 완료 알림도 없다). 파일명은 \u003ccode>{종류}_{YYYYMMDD-HHMM}.csv\u003c/code>, 인코딩은 UTF-8(BOM), 표기는 notation CSV 규격을 따른다(ISO 8601 +09:00 · 수량 쉼표 없음 · 스프레드 소수 4자리 · 상태 영문 대문자 코드 · 주소·해시 전문 · 개인식별정보 마스킹). 개인키·passphrase·시드는 어디에도 기록하지 않는다. 모든 다운로드는 열람 기록 ⑥에 감사기록으로 남고, 그 기록도 ⑥으로 받는다.\u003cbr>\u003cspan class=\"basis\">근거 구분회계 V11 · 기록 보존 L6 §9 · ISMS 2.9.4·2.6.3 · 09 §0 고객 화면 미노출(2026-09-02)\u003c/span>\u003c/div>\n        \u003cdiv class=\"itm-nav\">\u003cspan class=\"nav-tag\">화면 이동 · 인터랙션\u003c/span>\n          \u003cdiv class=\"nav-row\">\u003cspan class=\"nav-el\">[CSV 다운로드] — 활성 조건\u003c/span>\u003cspan class=\"nav-act\">항상 활성 · 같은 종류 생성 중만 비활성(다른 종류는 병행 가능)\u003c/span>\u003cspan class=\"nav-to stay\">—\u003c/span>\u003c/div>\n          \u003cdiv class=\"nav-row\">\u003cspan class=\"nav-el\">[CSV 다운로드] — 클릭(활성)\u003c/span>\u003cspan class=\"nav-act\">클릭 → 확인 없음 → 라벨 \"생성 중…\"·중복 클릭 차단 → 브라우저 다운로드\u003c/span>\u003cspan class=\"nav-to stay\">라벨 복귀 · 열람 기록 ⑥ 감사기록 · 이동 없음\u003c/span>\u003c/div>\n          \u003cdiv class=\"nav-row\">\u003cspan class=\"nav-el\">[CSV 다운로드] — 실패\u003c/span>\u003cspan class=\"nav-act\">생성 실패 / 30초 초과\u003c/span>\u003cspan class=\"nav-to stay\">화면 잔류 · 상단 배너 \"일시적인 오류입니다. 잠시 후 다시 시도해 주세요\" · 라벨 복귀 · 부분 파일 없음\u003c/span>\u003c/div>\n        \u003c/div>\n      \u003c/div>\n    \u003c/div>\n  \u003c/div>\n\n\u003c/div>\n\n\u003csection class=\"footer-note\" style=\"padding-bottom:0;\">\n  \u003cdiv class=\"note-card\">\n    \u003cdiv class=\"note-title\">상세내용\u003c/div>\n    \u003cdiv class=\"detail-grid\" id=\"detailCol\">\n      \u003cdiv class=\"dtl\" data-idx=\"0\">\n        \u003cdiv class=\"detail-label\">\u003cspan class=\"dtl-num\">1\u003c/span>도메인 상태값 · 행 확장 내용(유형별)\u003c/div>\n      \u003cdiv class=\"dtl-body\">\u003cspan class=\"box\">· \u003cstrong>상태 열 값\u003c/strong>(states 총목록): T1 승인 대기 → 에스컬레이션·보류 → 집행 대기 → 완료 / 거절 · T2 확인 대기 → 에스컬레이션·보류 → 이전 진행 → 완료 / 이전 중지 · T3 대기(지연발효 중) → 대기(승인 가능) → 집행 대기 → 완료 / 거절 / 차단 · T4 격리 중 → 소명 대기 → 해제 / 동결 · T5 미처리 → 검토중 → STR 이관 / 무혐의 · T6 미확인 → 확인 → 조치완료 · T7 일시제한 예정 → 제한 적용 / 자동 종결 · T8 잠금 → 해제 / 동결 전환 · X3 미처리 → 원인 규명 중 → 해제·종결\u003cbr>· \u003cstrong>확장 패널 내용\u003c/strong>: T1 요청번호·기관·보내는/받는 수량·확정 비율·스프레드·수락 시각·자동검증(BLF·KYT·한도·KYC·재고) / T2 BRK 번호·양 당사자·양측 수량·비율·수수료·트래블룰 상태·양측 자동검증 / T3 접수번호·수신 주소 전문·자산·수량·화이트리스트 등록일·지연발효 만료 시각·등록 관리자 / T4 txhash·from 주소·자산·수량·KYT 점수·격리 지갑·소명 요청/응답 이력 / T5 룰 ID·연관 거래·기관·타임라인 / T6 이벤트 시각·시스템·내용 / T7 도래일·경과일·통지 이력 / T8 실패 시각·접속 IP(마스킹)·본인확인 체크 / X3 내부·온체인·콜드 3값·차이·스냅숏 시각 — 공통 하단: 처리 이력(처리자·행위·사유·시각)\u003cbr>· 구 화면 귀속: 심사 큐(구 ADM-07) → 승인 행 · 시장감시·알람함(구 ADM-02) → 이상거래·월렛/키 · 격리·동결(구 ADM-08) → 입금 격리 · 잠금·재이행(구 ADM-06) → T7·T8(초대·상태 전이는 ADM-03)\u003cbr>· 상태명·버튼명은 states.html 도메인 상태와 동일(notation 어드민 처리 버튼)\u003c/span>\u003c/div>\n      \u003c/div>\n      \u003cdiv class=\"dtl\" data-idx=\"1\">\n        \u003cdiv class=\"detail-label\">\u003cspan class=\"dtl-num\">2\u003c/span>처리 결과 → 고객 화면 반영\u003c/div>\n      \u003cdiv class=\"dtl-body\">\u003cspan class=\"box\">· 나목: 승인 대기·에스컬레이션·\u003cstrong>보류\u003c/strong>·집행 대기 = EXC-03 '거래 진행중' 단일 표시(보류도 고객 화면 변화 없음 — 고객 '보류' 라벨 폐지 2026-09-02) · 거절 = EXC-04 '거절'(일반화 사유) · 완료 = EXC-04 '완료'\u003cbr>· 마목: 확인 대기·에스컬레이션 = BRK-05 '확인 중' \u003cspan class=\"chk\">[확인필요: 문구]\u003c/span> · 이전 진행 = BRK-05 '이전 진행' · 완료 = BRK-05 '완료' · 이전 중지 = BRK-05·07 '이전 중지'\u003cbr>· T4~T8·X3 처리 결과는 고객 화면에 \u003cstrong>어떤 표시도 없음\u003c/strong>(STR 누설 금지) — 개별 거래 상태·KYC 배너로만 간접 반영\u003cbr>· 내부 사유·AML 심사 내용·처리자 ID는 고객 콘솔 미노출\u003c/span>\u003c/div>\n      \u003c/div>\n      \u003cdiv class=\"dtl\" data-idx=\"2\">\n        \u003cdiv class=\"detail-label\">\u003cspan class=\"dtl-num\">3\u003c/span>사유 모달 공통 규격 · 확인 다이얼로그 원칙\u003c/div>\n      \u003cdiv class=\"dtl-body\">\u003cspan class=\"box\">· \u003cstrong>사유 모달\u003c/strong>(보류·거절·이전 중지·STR·동결·STR 검토·무혐의 종결·조치완료·해제·종결): 카테고리 ▾(유형별) + 자유입력 10~500자 · 빈칸·10자 미만이면 실행 버튼 비활성 + 인라인 ⚠ · 내부 사유는 감사로그·CSV ②(reason)에만 — 고객에게는 일반화 문구\u003cbr>· \u003cstrong>확인 다이얼로그 원칙\u003c/strong>(이 화면): RESOLVED(종결)로 가는 클릭 + 승인(집행 개시) = 확인 있음 / IN_PROGRESS·HOLD로 가는 클릭(검토·확인·원인 규명·소명 요청·보류) = 확인 없음(보류는 사유 모달이 확정 클릭) — notation \"구속력·비가역 행위 직전만\"\u003cbr>· 모달 열림 중 바깥 클릭/ESC = [돌아가기]와 동일(입력값 파기)\u003c/span>\u003c/div>\n      \u003c/div>\n      \u003cdiv class=\"dtl\" data-idx=\"5\">\n        \u003cdiv class=\"detail-label\">\u003cspan class=\"dtl-num\">6\u003c/span>이전 중지의 계약상 귀결\u003c/div>\n      \u003cdiv class=\"dtl-body\">\u003cspan class=\"box\">· 마목은 수락 시점에 구속력 발생 — DSRV가 이전을 중지했을 때 무산 처리·위약 여부는 약관·법무 확인(states 결정필요 ①)\u003cbr>· 트래블룰 미비 건은 중지가 아니라 보류 → 보완 후 재진행\u003cbr>· \u003cspan class=\"chk\">[확인필요]\u003c/span> 양측 이메일 통지 추가 여부(현행 4종에 없음) · 수수료 8.00 USDT / 7.98 USDC 미수취 처리\u003c/span>\u003c/div>\n      \u003c/div>\n      \u003cdiv class=\"dtl\" data-idx=\"6\">\n        \u003cdiv class=\"detail-label\">\u003cspan class=\"dtl-num\">7\u003c/span>지연발효 · 자기승인 차단\u003c/div>\n      \u003cdiv class=\"dtl-body\">\u003cspan class=\"box\">· 화이트리스트 지연발효는 커스터디 출금(외부 반출) 전용 — 기존 커스터디 정책·시스템 값 그대로(ADM-03에서 설정하지 않음) · 나·마 내부 지갑 간 이전에는 미적용\u003cbr>· 타이머 만료 = 버튼 활성만(자동 승인 아님) · 출금 실행 시점 BLF 재검사 → 적중 시 차단 + STR 검토 생성\u003cbr>· 자기승인 차단은 아이템을 등록한 관리자 계정 기준(T3) — 어드민 역할 1종이므로 화면 노출 차이 없이 행 단위로만 차단\u003c/span>\u003c/div>\n      \u003c/div>\n      \u003cdiv class=\"dtl\" data-idx=\"18\">\n        \u003cdiv class=\"detail-label\">\u003cspan class=\"dtl-num\">19\u003c/span>집행 대기 상태 흐름\u003c/div>\n      \u003cdiv class=\"dtl-body\">\u003cspan class=\"box\">승인(처리함) → 집행 대기 → 집행 명세(Excel) 다운로드 → 콜드 2인 서명·집행(커스터디 절차 · 화면 밖) → txhash 입력 → 온체인 대사 일치 → [완료 처리] 확정 → 완료 반영·행 제거\u003cbr>· 불일치·미확인 시 완료 불가 — 처리함 워닝으로 회송\u003cbr>· 서명 시스템 장애 시 BCP/DR — 정산 일시 중지 공지(예외 F6) · 긴급 시 승인을 멈추면 집행도 멈춤 — 별도 긴급정지 버튼 없음(ISMS 2.11.1)\u003cbr>· 마목 2행은 각자 독립 집행(순차) — 한쪽만 완료된 상태의 고객 표시 \u003cspan class=\"chk\">[확인필요]\u003c/span>\u003c/span>\u003c/div>\n      \u003c/div>\n      \u003cdiv class=\"dtl\" data-idx=\"20\">\n        \u003cdiv class=\"detail-label\">\u003cspan class=\"dtl-num\">21\u003c/span>txhash 대사 규칙\u003c/div>\n      \u003cdiv class=\"dtl-body\">\u003cspan class=\"box\">· 대사 항목: 수신 주소(명세 전문과 대소문자 무시 비교) · 자산(ETH 네이티브 / ERC-20 컨트랙트 주소 일치) · 수량(온체인 decimals 환산 후 명세 수량과 완전 일치 — 절사 규칙 아님) · 발신 지갑이 명세의 출금 지갑\u003cbr>· 컨펌 수 미달 = '미확인'(⑦) · 다른 건에 이미 등록 = 중복(④) — 1 txhash 1 건\u003cbr>· \u003cspan class=\"chk\">[확인필요]\u003c/span> 필수 컨펌 수 · 1 tx에 복수 이전(배치)이 섞인 경우 처리\u003c/span>\u003c/div>\n      \u003c/div>\n      \u003cdiv class=\"dtl\" data-idx=\"22\">\n        \u003cdiv class=\"detail-label\">\u003cspan class=\"dtl-num\">23\u003c/span>CSV 6종 원천 · 구분회계 어드민 전용\u003c/div>\n      \u003cdiv class=\"dtl-body\">\u003cspan class=\"box\">· 기관-가입자: 구 ADM-06 ORG 목록 · 거래 요청: 구 ADM-07 큐·처리 이력 · 통합 거래: 구 ADM-04 통합 로그 · 구분회계·3면 대사: 구 ADM-04 집계(EXC-04·BRK-05 발생분과 정합) · 열람 기록: 구 ADM-05\u003cbr>· 구분회계 계정명(스프레드수익(운영손익)·중개수수료)은 \u003cstrong>이 CSV ④에서만\u003c/strong> — 고객 화면(EXC-04·BRK-05) 계정명 행 제거(2026-09-02)\u003cbr>· 원본은 WORM·해시무결성·NTP 보존 — 거래 15년·AML 5년 · 화면·CSV는 조회 전용(원장 직접 변경 기능 없음)\u003cbr>· 컬럼 정의는 하단 부록 — DB 스키마 v0.7(DB스키마_한글판_20260902) 매핑\u003c/span>\u003c/div>\n      \u003c/div>\n    \u003c/div>\n  \u003c/div>\n\u003c/section>\n\n\u003csection class=\"footer-note\">\n  \u003cdiv class=\"note-card\">\n    \u003cdiv class=\"note-title\">비고\u003c/div>\n    \u003cdiv class=\"note-body\">· 처리 현황 KPI 카드 제거(2026-09-02 사용자 결정) — 어드민 홈은 처리함·집행 대기·다운로드만 두고 집계 표시를 하지 않는다. 처리함 공통 상태 5종(OPEN·ESCALATED·IN_PROGRESS·HOLD·RESOLVED)은 states §3·§4 정의를 따른다.\u003cbr>· \u003cspan class=\"chk\">[확인필요]\u003c/span> High 워닝 N시간 미처리 시 상위 보고 룰 · 24×365 상시 확인 주체·당직 — toast+처리함은 상시 확인 주체 전제\u003cbr>\n      · 접속은 내부 전용 · PAM 전용세션에서만 · 관리자 배지 표시값 = 관리자 ID(DSRV-OPS-NN) \u003cspan class=\"chk\">[확인필요: 이름 병기 여부]\u003c/span> · 어드민 역할 1종(운영 관리자) — 화면·버튼 노출 차이 없음.\u003cbr>\n      · \u003cstrong>목업 인터랙션(2026-09-02)\u003c/strong>: 어드민 프레임 폭을 다른 화면의 \u003cstrong>1.5배(810px)\u003c/strong>로 넓히고, 처리함 \u003cstrong>행 클릭 → 유형별 확장 패널\u003c/strong>을 목업에서 실제로 열 수 있게 함(동시 1개 · 같은 행 재클릭 = 접기 · 처리 버튼·입력 클릭은 확장 아님 · 핀 클릭은 항목 선택). 관리 메뉴 '설정' 클릭 시 ADM-03으로 이동. 확장 패널의 값은 목업 예시.\u003cbr>\n      · DSRV 내부 관리자 화면(고객사 노출 없음). 어드민은 \u003cstrong>2화면(ADM-02 홈 · ADM-03 설정)\u003c/strong> — 처리할 일만 알람·워닝 처리함, 조회성 데이터는 CSV 다운로드 6종.\u003cbr>\n      · \u003cstrong>[방어 핵심]\u003c/strong> 자동검증은 1차 필터일 뿐, 승인·보류·거절은 전부 사람의 판단 — \"자동체결·자동심사 아님\" 소명. 본인 기안 자기승인 차단(DSRV 내부 직무분리)으로 담보.\u003cbr>\n      · 예외케이스 귀속: B1·B2(입금 격리·동결) · B6(스윕) · E3·E4·E7(심사) · F6(서명 장애) · H3·H4(출금) · X3(대사 불일치) → 이 화면 처리함 / A1~A6(온보딩·계정)은 ADM-03과 분담.\u003cbr>\n      · 연결: 유입 EXC-02·BRK-04·AUTH-01(잠금)·입금 감시 / 정책값·기관 관리는 설정(ADM-03) / 처리 결과는 고객 화면에 상태로만 반영(STR 누설 금지)\u003cbr>\n      · 2026-09-02 설명 형식 개정 적용(핀 = 조작 요소 단위) — 처리 버튼은 종류별 핀(같은 종류가 여러 행에 반복되면 대표 1개), 버튼 행 = 활성 조건 / 클릭(활성) / 실패 3행 · 예시 수량 1,500,000원 상당 이내로 재조정 · 서비스명 DSRV Admin.\u003cbr>\n      · \u003cspan class=\"chk\">[확인필요]\u003c/span> 유휴 10분·관리자 배지 표시값 · 처리함 정렬(에스컬레이션 상단 고정) · 마목 보류/확인 중 고객 문구 · 이전 중지 통지·계약상 귀결 · 출금 거절 고객 통지 방법 · 격리 입금 고객 표시 · 검토 담당자 잠금 · 본인확인 절차 · 나목 집행 대기 2행 분리 · 마목 정산 배치 vs 건별 집행 정합 · 필수 컨펌 수 · 명세 미다운로드 시 완료 차단 · 집행 대사 불일치 워닝 유형(X3 통합).\n    \u003c/div>\n  \u003c/div>\n\u003c/section>\n\n\u003csection class=\"footer-note\" style=\"padding-top:0;\">\n  \u003cdiv class=\"note-card\">\n    \u003cdiv class=\"note-title\">부록 — 데이터 다운로드 CSV 6종 컬럼 정의 (DB 스키마 매핑)\u003c/div>\n    \u003cdiv class=\"note-body\" style=\"margin-bottom:14px;\">\n      · 원천: \u003cstrong>DB스키마_한글판_20260902 (v0.7 · 2026-09-02)\u003c/strong> — 기획 참고용 초안 기준, 실제 컬럼·타입은 개발 설계 시 확정\u003cbr>\n      · 표기: \u003cspan style=\"color:#7c3aed;font-weight:700;\">파생\u003c/span> = 저장 필드가 아닌 계산값 · \u003cspan style=\"font-weight:700;\">[스키마 보완]\u003c/span> = 현행 스키마에 원천 필드 없음 → 스키마 개정 시 반영 필요 (v0.7 기준 잔여 없음 — 종전 6건은 v0.6에서 보완 완료)\u003cbr>\n      · 공통: 실명·연락처·이메일 등 개인식별정보는 CSV에서도 마스킹 · 모든 다운로드는 열람 기록(⑥)에 감사 기록\n    \u003c/div>\n    \u003cdiv class=\"appx-grid\">\n\n      \u003cdiv class=\"appx\">\n        \u003cdiv class=\"at\">① 기관-가입자 목록\u003c/div>\n        \u003cdiv class=\"as\">ORG · USER · KYC_RECORD\u003c/div>\n        \u003ctable class=\"tbl\">\n          \u003cthead>\u003ctr>\u003cth>컬럼\u003c/th>\u003cth>원천 (테이블.필드)\u003c/th>\u003cth>비고\u003c/th>\u003c/tr>\u003c/thead>\n          \u003ctbody>\n            \u003ctr>\u003ctd>고객사 ID\u003c/td>\u003ctd class=\"src\">ORG.org_id\u003c/td>\u003ctd>ORG-NNNN\u003c/td>\u003c/tr>\n            \u003ctr>\u003ctd>상호\u003c/td>\u003ctd class=\"src\">ORG.name\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\n            \u003ctr>\u003ctd>계약 상태\u003c/td>\u003ctd class=\"src\">ORG.contract_status\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\n            \u003ctr>\u003ctd>한도등급\u003c/td>\u003ctd class=\"src\">ORG.grade\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\n            \u003ctr>\u003ctd>KYC 상태\u003c/td>\u003ctd class=\"src\">ORG.kyc_status\u003c/td>\u003ctd>활성/심사중(EDD)/일시제한/동결/해지 — ADM-03 상태 기계\u003c/td>\u003c/tr>\n            \u003ctr>\u003ctd>확인 수준\u003c/td>\u003ctd class=\"src\">KYC_RECORD.level\u003c/td>\u003ctd>CDD/EDD\u003c/td>\u003c/tr>\n            \u003ctr>\u003ctd>위험등급\u003c/td>\u003ctd class=\"src\">KYC_RECORD.risk_rating\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\n            \u003ctr>\u003ctd>PEP 여부\u003c/td>\u003ctd class=\"src\">KYC_RECORD.pep_flag\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\n            \u003ctr>\u003ctd>실제소유자 확인\u003c/td>\u003ctd class=\"src\">ORG.rbo_verified\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\n            \u003ctr>\u003ctd>KYC 확인일\u003c/td>\u003ctd class=\"src\">KYC_RECORD.verified_at\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\n            \u003ctr>\u003ctd>재이행 도래일\u003c/td>\u003ctd class=\"src\">KYC_RECORD.next_review_at\u003c/td>\u003ctd>위험등급별 고1·중2·저3년 + 이벤트 트리거\u003c/td>\u003c/tr>\n            \u003ctr>\u003ctd>가입자 계정·역할\u003c/td>\u003ctd class=\"src\">USER.user_id · role\u003c/td>\u003ctd>기관당 1명\u003c/td>\u003c/tr>\n            \u003ctr>\u003ctd>이메일\u003c/td>\u003ctd class=\"src\">USER.email\u003c/td>\u003ctd>마스킹\u003c/td>\u003c/tr>\n            \u003ctr>\u003ctd>MFA 사용\u003c/td>\u003ctd class=\"src\">USER.mfa_enabled\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\n            \u003ctr>\u003ctd>계정 상태\u003c/td>\u003ctd class=\"src\">USER.status\u003c/td>\u003ctd>초대 발송됨/활성/잠금/해지 · 잠금 = 5회 실패(T8)\u003c/td>\u003c/tr>\n          \u003c/tbody>\n        \u003c/table>\n      \u003c/div>\n\n      \u003cdiv class=\"appx\">\n        \u003cdiv class=\"at\">② 거래 요청 목록\u003c/div>\n        \u003cdiv class=\"as\">EXCHANGE_REQUEST · QUOTE · EXCHANGE_APPROVAL · RFQ_INTENT · DEAL · WITHDRAWAL_REQUEST · INBOX_ITEM\u003c/div>\n        \u003ctable class=\"tbl\">\n          \u003cthead>\u003ctr>\u003cth>컬럼\u003c/th>\u003cth>원천 (테이블.필드)\u003c/th>\u003cth>비고\u003c/th>\u003c/tr>\u003c/thead>\n          \u003ctbody>\n            \u003ctr>\u003ctd>요청 구분\u003c/td>\u003ctd>\u003cspan class=\"drv\">파생\u003c/span>\u003c/td>\u003ctd>나목 교환 / 마목 중개 / 출금·이전\u003c/td>\u003c/tr>\n            \u003ctr>\u003ctd>요청 번호\u003c/td>\u003ctd class=\"src\">exc_id / rfq_id / wd_id\u003c/td>\u003ctd>EXC-YYYYMMDD-NNNN / BRK-YYYYMMDD-NNNN\u003c/td>\u003c/tr>\n            \u003ctr>\u003ctd>고객사\u003c/td>\u003ctd class=\"src\">org_id → ORG.name\u003c/td>\u003ctd>마목은 양 당사자\u003c/td>\u003c/tr>\n            \u003ctr>\u003ctd>기안자\u003c/td>\u003ctd class=\"src\">drafter_id → USER\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\n            \u003ctr>\u003ctd>자산·수량\u003c/td>\u003ctd class=\"src\">from/to_asset_id · from_qty / from·to_asset_id · from_qty·to_qty / asset_id · qty\u003c/td>\u003ctd>나목 / 마목 / 출금 순 · 쉼표 없음\u003c/td>\u003c/tr>\n            \u003ctr>\u003ctd>제시 비율·유효기한\u003c/td>\u003ctd class=\"src\">QUOTE.rate · valid_until\u003c/td>\u003ctd>나목만 · 스테이블 페어 4자리 / ETH 페어 2자리\u003c/td>\u003c/tr>\n            \u003ctr>\u003ctd>KYT 점수\u003c/td>\u003ctd class=\"src\">EXCHANGE_APPROVAL.kyt_score\u003c/td>\u003ctd>자동검증 1차 필터\u003c/td>\u003c/tr>\n            \u003ctr>\u003ctd>BLF 결과\u003c/td>\u003ctd class=\"src\">EXCHANGE_APPROVAL.blf_result\u003c/td>\u003ctd>자동검증 1차 필터\u003c/td>\u003c/tr>\n            \u003ctr>\u003ctd>트래블룰\u003c/td>\u003ctd class=\"src\">travel_rule_id → TRAVEL_RULE\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\n            \u003ctr>\u003ctd>자동검증 등급·수동검증 사유\u003c/td>\u003ctd class=\"src\">INBOX_ITEM.grade · reason\u003c/td>\u003ctd>주의 이상 = 에스컬레이션 · 보류·거절 사유 필수(카테고리+자유입력)\u003c/td>\u003c/tr>\n            \u003ctr>\u003ctd>처리자\u003c/td>\u003ctd class=\"src\">INBOX_ITEM.assignee_id · EXCHANGE_APPROVAL.dsrv_approver_id\u003c/td>\u003ctd>본인 기안 자기승인 차단\u003c/td>\u003c/tr>\n            \u003ctr>\u003ctd>판정·상태\u003c/td>\u003ctd class=\"src\">EXCHANGE_APPROVAL.decision · INBOX_ITEM.item_status · 대상 테이블 status\u003c/td>\u003ctd>승인/보류/거절 + 공통 5종 + 업무 상태 · 영문 대문자 코드\u003c/td>\u003c/tr>\n            \u003ctr>\u003ctd>출금·이전 요청\u003c/td>\u003ctd class=\"src\">WITHDRAWAL_REQUEST.wd_id · qty · to_address · status\u003c/td>\u003ctd>서면 접수 · 관리자 등록 (T3) · 주소 전문\u003c/td>\u003c/tr>\n          \u003c/tbody>\n        \u003c/table>\n      \u003c/div>\n\n      \u003cdiv class=\"appx\">\n        \u003cdiv class=\"at\">③ 통합 거래 목록\u003c/div>\n        \u003cdiv class=\"as\">EXCHANGE_EXECUTION · BROKER_SETTLEMENT · DEAL · WITHDRAWAL_REQUEST\u003c/div>\n        \u003ctable class=\"tbl\">\n          \u003cthead>\u003ctr>\u003cth>컬럼\u003c/th>\u003cth>원천 (테이블.필드)\u003c/th>\u003cth>비고\u003c/th>\u003c/tr>\u003c/thead>\n          \u003ctbody>\n            \u003ctr>\u003ctd>거래 유형\u003c/td>\u003ctd>\u003cspan class=\"drv\">파생\u003c/span> \u003cspan class=\"src\">원천 테이블별\u003c/span>\u003c/td>\u003ctd>교환 / 중개 / 이전(출금)\u003c/td>\u003c/tr>\n            \u003ctr>\u003ctd>거래 번호\u003c/td>\u003ctd class=\"src\">exec_id · exc_id / settle_id · deal_id / wd_id\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\n            \u003ctr>\u003ctd>당사자\u003c/td>\u003ctd class=\"src\">org_id / DEAL.poster_org · applicant_org\u003c/td>\u003ctd>중개는 양측\u003c/td>\u003c/tr>\n            \u003ctr>\u003ctd>자산·수량\u003c/td>\u003ctd class=\"src\">EXCHANGE_REQUEST · DEAL 참조\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\n            \u003ctr>\u003ctd>적용 비율\u003c/td>\u003ctd class=\"src\">applied_rate / DEAL.agreed_rate\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\n            \u003ctr>\u003ctd>서명자 1·2\u003c/td>\u003ctd class=\"src\">signer1_id · signer2_id\u003c/td>\u003ctd>2인 멀티시그 · DSRV-OPS-NN;DSRV-OPS-NN\u003c/td>\u003c/tr>\n            \u003ctr>\u003ctd>상태\u003c/td>\u003ctd class=\"src\">status\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\n            \u003ctr>\u003ctd>집행·정산 시각\u003c/td>\u003ctd class=\"src\">executed_at / settled_at\u003c/td>\u003ctd>시간순 정렬 키 · ISO 8601 +09:00\u003c/td>\u003c/tr>\n            \u003ctr>\u003ctd>온체인 txhash\u003c/td>\u003ctd class=\"src\">EXCHANGE_EXECUTION.txhash / BROKER_SETTLEMENT.txhash / WITHDRAWAL_REQUEST.txhash\u003c/td>\u003ctd>명세 대사 일치(recon_ok) 시 완료 · 전문\u003c/td>\u003c/tr>\n          \u003c/tbody>\n        \u003c/table>\n      \u003c/div>\n\n      \u003cdiv class=\"appx\">\n        \u003cdiv class=\"at\">④ 구분회계 집계\u003c/div>\n        \u003cdiv class=\"as\">LEDGER_ACCOUNT · ASSET (수익 원천: EXCHANGE_EXECUTION · BROKER_SETTLEMENT)\u003c/div>\n        \u003ctable class=\"tbl\">\n          \u003cthead>\u003ctr>\u003cth>컬럼\u003c/th>\u003cth>원천 (테이블.필드)\u003c/th>\u003cth>비고\u003c/th>\u003c/tr>\u003c/thead>\n          \u003ctbody>\n            \u003ctr>\u003ctd>계정 ID\u003c/td>\u003ctd class=\"src\">LEDGER_ACCOUNT.account_id\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\n            \u003ctr>\u003ctd>계정 구분\u003c/td>\u003ctd class=\"src\">LEDGER_ACCOUNT.type\u003c/td>\u003ctd>수탁 / 운영 / 스프레드수익(운영손익) / 중개수수료 — 고객 화면 미노출\u003c/td>\u003c/tr>\n            \u003ctr>\u003ctd>자산\u003c/td>\u003ctd class=\"src\">asset_id → ASSET.symbol · chain\u003c/td>\u003ctd>ETH·USDC·USDT\u003c/td>\u003c/tr>\n            \u003ctr>\u003ctd>잔액\u003c/td>\u003ctd class=\"src\">LEDGER_ACCOUNT.balance\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\n            \u003ctr>\u003ctd>기간 수익 발생분\u003c/td>\u003ctd>\u003cspan class=\"drv\">파생\u003c/span> \u003cspan class=\"src\">spread_revenue · fee_revenue 합계\u003c/span>\u003c/td>\u003ctd>예: BRK-20260902-0001 수수료 8.00 USDT + 7.98 USDC\u003c/td>\u003c/tr>\n            \u003ctr>\u003ctd>집계 기준 시각\u003c/td>\u003ctd class=\"src\">LEDGER_ACCOUNT.snapshot_at\u003c/td>\u003ctd>CSV 집계 기준\u003c/td>\u003c/tr>\n          \u003c/tbody>\n        \u003c/table>\n      \u003c/div>\n\n      \u003cdiv class=\"appx\">\n        \u003cdiv class=\"at\">⑤ 3면 대사\u003c/div>\n        \u003cdiv class=\"as\">RECONCILIATION · ASSET\u003c/div>\n        \u003ctable class=\"tbl\">\n          \u003cthead>\u003ctr>\u003cth>컬럼\u003c/th>\u003cth>원천 (테이블.필드)\u003c/th>\u003cth>비고\u003c/th>\u003c/tr>\u003c/thead>\n          \u003ctbody>\n            \u003ctr>\u003ctd>대사 ID\u003c/td>\u003ctd class=\"src\">RECONCILIATION.recon_id\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\n            \u003ctr>\u003ctd>자산\u003c/td>\u003ctd class=\"src\">asset_id → ASSET.symbol\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\n            \u003ctr>\u003ctd>내부장부 잔액\u003c/td>\u003ctd class=\"src\">internal_bal\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\n            \u003ctr>\u003ctd>온체인 잔액\u003c/td>\u003ctd class=\"src\">onchain_bal\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\n            \u003ctr>\u003ctd>커스터디 콜드 잔액\u003c/td>\u003ctd class=\"src\">custody_bal\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\n            \u003ctr>\u003ctd>일치 여부\u003c/td>\u003ctd class=\"src\">matched\u003c/td>\u003ctd>불일치 시 X3 워닝 · 출금 자동 동결 · [해제·종결] 활성 조건\u003c/td>\u003c/tr>\n            \u003ctr>\u003ctd>대사 시각\u003c/td>\u003ctd class=\"src\">RECONCILIATION.snapshot_at\u003c/td>\u003ctd>정기 배치 스냅숏\u003c/td>\u003c/tr>\n          \u003c/tbody>\n        \u003c/table>\n      \u003c/div>\n\n      \u003cdiv class=\"appx\">\n        \u003cdiv class=\"at\">⑥ 열람 기록\u003c/div>\n        \u003cdiv class=\"as\">AUDIT_LOG (조회·다운로드 행위 필터)\u003c/div>\n        \u003ctable class=\"tbl\">\n          \u003cthead>\u003ctr>\u003cth>컬럼\u003c/th>\u003cth>원천 (테이블.필드)\u003c/th>\u003cth>비고\u003c/th>\u003c/tr>\u003c/thead>\n          \u003ctbody>\n            \u003ctr>\u003ctd>로그 ID\u003c/td>\u003ctd class=\"src\">AUDIT_LOG.log_id\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\n            \u003ctr>\u003ctd>열람자\u003c/td>\u003ctd class=\"src\">actor_id → USER\u003c/td>\u003ctd>어드민 포함\u003c/td>\u003c/tr>\n            \u003ctr>\u003ctd>행위\u003c/td>\u003ctd class=\"src\">action\u003c/td>\u003ctd>조회 / CSV 다운로드 / 집행 명세 다운로드\u003c/td>\u003c/tr>\n            \u003ctr>\u003ctd>대상\u003c/td>\u003ctd class=\"src\">source · ref_id\u003c/td>\u003ctd>다운로드한 CSV 종류·조회 대상·거래번호\u003c/td>\u003c/tr>\n            \u003ctr>\u003ctd>기록 시각\u003c/td>\u003ctd class=\"src\">created_at\u003c/td>\u003ctd>NTP 동기화\u003c/td>\u003c/tr>\n            \u003ctr>\u003ctd>해시\u003c/td>\u003ctd class=\"src\">hash\u003c/td>\u003ctd>WORM · 무결성\u003c/td>\u003c/tr>\n            \u003ctr>\u003ctd>보존 기간\u003c/td>\u003ctd class=\"src\">retention\u003c/td>\u003ctd>거래 15년 / AML 5년\u003c/td>\u003c/tr>\n          \u003c/tbody>\n        \u003c/table>\n      \u003c/div>\n\n    \u003c/div>\n  \u003c/div>\n\u003c/section>\n\n\u003cscript src=\"screen.js\">\u003c/script>\n\u003c/body>\n\u003c/html>\n", "adm-03.html": "\u003c!DOCTYPE html>\n\u003chtml lang=\"ko\">\n\u003chead>\n\u003cmeta charset=\"UTF-8\">\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n\u003ctitle>화면기획 — 설정\u003c/title>\n\u003clink rel=\"stylesheet\" href=\"screen.css\">\n\u003cstyle>\n  .tbl{width:100%;border-collapse:collapse;font-size:11px;}\n  .tbl th{background:#f1f5f9;color:#64748b;font-weight:700;text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);font-size:10px;}\n  .tbl td{padding:7px 8px;border-bottom:1px solid #f1f1ee;color:#334155;vertical-align:middle;}\n  .act{display:inline-block;font-size:9px;font-weight:700;padding:2px 7px;border-radius:6px;border:1px solid #93c5fd;color:#2563eb;background:#fff;margin:1px 2px 1px 0;white-space:nowrap;}\n  .inp{display:inline-block;border:1px solid #d7dbe0;border-radius:6px;background:#fff;padding:3px 8px;font-family:ui-monospace,'SF Mono',Consolas,monospace;font-size:10.5px;color:#334155;min-width:72px;}\n  .inp .u{color:#9aa3ad;font-family:'Pretendard',system-ui,sans-serif;font-size:9.5px;margin-left:3px;}\n\u003c/style> n\" data-idx=\"17\" style=\"top:-4px;right:-4px;\">18\u003c/div>\n          \u003cdiv class=\"kv\">\u003cspan class=\"k\">기관 KYC 상태 전이\u003c/span>\u003cspan class=\"v\">심사중(EDD) → 활성 ⇄ 일시제한 → 동결 → 해지\u003c/span>\u003c/div>\n          \u003cdiv class=\"kv\">\u003cspan class=\"k\">가입자 계정 상태\u003c/span>\u003cspan class=\"v\">초대 발송됨 → 활성 ⇄ 잠금 → 해지 (시스템·홈 처리함이 전이)\u003c/span>\u003c/div>\n          \u003cdiv class=\"kv\">\u003cspan class=\"k\">KYC 재이행 주기\u003c/span>\u003cspan class=\"v\">고1년 · 중2년 · 저3년 + 이벤트 트리거\u003c/span>\u003c/div>\n          \u003cdiv class=\"kv\">\u003cspan class=\"k\">해지 처리\u003c/span>\u003cspan class=\"v\">진행 거래 완결 → 전량 출금 → 비활성화\u003c/span>\u003c/div>\n        \u003c/div>\n      \u003c/div>\n\n    \u003c/div>\n  \u003c/div>\n\n  \u003csvg id=\"connSvg\" style=\"position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:10;overflow:visible;\">\u003c/svg>\n\n  \u003cdiv class=\"items\" id=\"items\">\n    \u003cdiv class=\"nav-global\">\n      \u003cdiv class=\"nav-global-title\">진입 · 전역 이동\u003c/div>\n      \u003cdiv class=\"nav-note\">· \u003cstrong>전역 이동\u003c/strong> 관리 메뉴 · 관리자 배지 · 뒤로가기의 동작은 어드민 홈(ADM-02)의 표와 같다. 다른 점 = 현재 탭이 '설정'이라 다시 클릭해도 무반응. '홈' 탭 · 로고 · 로그아웃으로 나가면 저장하지 않은 변경을 확인 없이 버린다 \u003cspan class=\"chk\">[확인필요: 관리자 화면에는 이탈 확인 다이얼로그를 둘지]\u003c/span>.\u003cbr>\n      · \u003cstrong>진입\u003c/strong> 어드민 홈(ADM-02) '설정' 탭 클릭. 진입 시 서버의 저장값을 조회해 보여준다.\u003c/div>\n    \u003c/div>\n\n    \u003cdiv class=\"itm\" data-idx=\"0\">\n      \u003cdiv class=\"num\">1\u003c/div>\n      \u003cdiv>\n        \u003cdiv class=\"itm-title\">취급자산 상태 ▾ × 3\u003cspan class=\"req\">필수\u003c/span>\u003c/div>\n        \u003cdiv class=\"itm-desc\">\u003cstrong>노출\u003c/strong> 자산 3종(ETH · USDC · USDT) 행마다 드롭다운 1개씩 항상 보인다. 자산을 추가·삭제하는 UI는 없다. 취급자산 변경은 변경신고 사안이라 화면 밖에서 처리한다.\u003cbr>\u003cstrong>클릭 가능\u003c/strong> 항상 활성이다.\u003cbr>\u003cstrong>옵션\u003c/strong> 활성 · 중지 2개다. 현재 값을 강조한다.\u003cbr>\u003cstrong>확인 사항\u003c/strong> '중지'를 고르면 확인 다이얼로그를 띄우고 사유를 필수로 받는다(10~500자). '활성' 복귀는 확인 없이 진행한다.\u003cbr>\u003cstrong>액션\u003c/strong> [변경 저장]과 무관하게 즉시 적용한다. 페어는 활성 자산끼리 자동으로 3종이 된다(ETH↔USDC · ETH↔USDT · USDC↔USDT). 중지하면 그 자산이 든 페어 2종의 신규 교환 요청·게시·신청을 차단하고 EXC-01·BRK-02 자산 목록에서 뺀다. 진행 중 건은 유지한다. 변경은 감사로그에 남긴다(ASSET 상태 · POLICY_VERSION과 별개).\u003cbr>\u003cspan class=\"chk\">[확인필요]\u003c/span> 게재중인 게시를 자동으로 중지할지.\u003cbr>\u003cspan class=\"basis\">근거 09 §0 취급자산 3종·Ethereum 단일(2026-09-02) · notation 드롭다운·확인 다이얼로그 규격\u003c/span>\u003c/div>\n        \u003cdiv class=\"itm-nav\">\u003cspan class=\"nav-tag\">화면 이동 · 인터랙션\u003c/span>\n          \u003cdiv class=\"nav-row\">\u003cspan class=\"nav-el\">취급자산 ▾ → '활성'\u003c/span>\u003cspan class=\"nav-act\">클릭 → 목록 펼침(활성 / 중지 · 현재 선택 강조) → '활성' 클릭\u003c/span>\u003cspan class=\"nav-to stay\">칩 갱신·목록 닫힘 · 바깥 클릭/ESC = 변경 없이 닫힘 · 즉시 적용 · 토스트 \"{자산} 취급을 재개했습니다\" · 고객 화면 목록 복귀\u003c/span>\u003c/div>\n          \u003cdiv class=\"nav-row\">\u003cspan class=\"nav-el\">취급자산 ▾ → '중지'\u003c/span>\u003cspan class=\"nav-act\">'중지' 클릭 → 다이얼로그: 제목 \"{자산} 취급 중지\" / 본문 \"{자산}이 포함된 페어({페어 2종})의 신규 교환 요청·게시·신청이 즉시 차단됩니다. 진행 중 건은 유지됩니다.\" / 사유 입력(필수 · 10~500자) / [중지] [돌아가기] → \"처리 중…\"\u003c/span>\u003cspan class=\"nav-to stay\">칩 '중지'(회색) · 토스트 \"{자산} 취급을 중지했습니다 — 신규 요청 차단\" · EXC-01·BRK-02 목록 제외 · 감사로그(사유 포함)\u003c/span>\u003c/div>\n          \u003cdiv class=\"nav-row\">\u003cspan class=\"nav-el\">취급자산 ▾ — 실패\u003c/span>\u003cspan class=\"nav-act\">경쟁 상태(다른 관리자 변경) / 서버 오류\u003c/span>\u003cspan class=\"nav-to stay\">상단 배너 \"일시적인 오류입니다. 잠시 후 다시 시도해 주세요\" 1종 · 최신 값을 다시 불러와 칩에 반영한다(경쟁 상태 전용 문구 없음)\u003c/span>\u003c/div>\n        \u003c/div>\n      \u003c/div>\n    \u003c/div>\n\n    \u003cdiv class=\"itm\" data-idx=\"1\">\n      \u003cdiv class=\"num\">2\u003c/div>\n      \u003cdiv>\n        \u003cdiv class=\"itm-title\">나목 고정 스프레드 — 페어별 입력 3개\u003cspan class=\"req\">필수\u003c/span>\u003c/div>\n        \u003cdiv class=\"itm-desc\">\u003cstrong>입력 가능\u003c/strong> 항상 가능하다. 페어별로 입력 3개(ETH↔USDC · ETH↔USDT · USDC↔USDT)이고 단위는 %다.\u003cbr>\u003cstrong>허용 문자\u003c/strong> 숫자와 소수점만 받는다. 소수 2자리를 넘는 입력은 무시한다.\u003cbr>\u003cstrong>검증\u003c/strong> ① 빈칸이 아닐 것 ② 0.01~5.00 범위 안일 것(상세 2). 문자·자릿수는 키 입력마다, ①②는 포커스 아웃 시 클라이언트가 본다. [변경 저장] 클릭 시 서버가 ②를 다시 본다.\u003cbr>\u003cstrong>실패 처리\u003c/strong> ① 위반 → 빨간 테두리 + ⚠ \"값을 입력해 주세요\". ② 위반 → ⚠ \"0.01~5.00 사이 값을 입력해 주세요\". 어느 쪽이든 [변경 저장] 비활성.\u003cbr>\u003cstrong>연동\u003c/strong> 값이 바뀐 셀은 ●와 노란 배경으로 표시하고 상단 \"저장되지 않은 변경 {N}건\"에 반영한다. 저장한 뒤 신규 요청부터 EXC-01 스프레드 표시와 EXC-02 비율 산정에 쓴다. 이미 제시한 견적은 요청 시점 값을 유지한다. 화면 표기는 소수 2자리, CSV는 소수 4자리다.\u003cbr>\u003cspan class=\"chk\">[확인필요]\u003c/span> ETH 페어 요율(목업 0.10은 예시 · 요율 미정) · 스프레드 갱신주기 파라미터가 따로 필요한지.\u003cbr>\u003cspan class=\"basis\">근거 09 §0 나목 견적 산정(2026-09-02) · V2 · notation 스프레드 표기\u003c/span>\u003c/div>\n        \u003cdiv class=\"itm-nav\">\u003cspan class=\"nav-tag\">화면 이동 · 인터랙션\u003c/span>\n          \u003cdiv class=\"nav-row\">\u003cspan class=\"nav-el\">스프레드 필드(각각) — 정상 입력\u003c/span>\u003cspan class=\"nav-act\">포커스 아웃\u003c/span>\u003cspan class=\"nav-to stay\">경고 제거 · 셀 dirty ● · [변경 저장] 활성 조건 재검사\u003c/span>\u003c/div>\n          \u003cdiv class=\"nav-row\">\u003cspan class=\"nav-el\">스프레드 필드(각각) — 규칙 ① 위반(빈칸)\u003c/span>\u003cspan class=\"nav-act\">포커스 아웃\u003c/span>\u003cspan class=\"nav-to stay\">⚠ \"값을 입력해 주세요\" · [변경 저장] 비활성\u003c/span>\u003c/div>\n          \u003cdiv class=\"nav-row\">\u003cspan class=\"nav-el\">스프레드 필드(각각) — 규칙 ② 위반(범위)\u003c/span>\u003cspan class=\"nav-act\">포커스 아웃\u003c/span>\u003cspan class=\"nav-to stay\">⚠ \"0.01~5.00 사이 값을 입력해 주세요\" · [변경 저장] 비활성\u003c/span>\u003c/div>\n        \u003c/div>\n      \u003c/div>\n    \u003c/div>\n\n    \u003cdiv class=\"itm\" data-idx=\"2\">\n      \u003cdiv class=\"num\">3\u003c/div>\n      \u003cdiv>\n        \u003cdiv class=\"itm-title\">나목 견적 유효시간 입력\u003cspan class=\"req\">필수\u003c/span>\u003c/div>\n        \u003cdiv class=\"itm-desc\">\u003cstrong>입력 가능\u003c/strong> 항상 가능하다. 단위는 초(s)이고 현재 값은 120이다.\u003cbr>\
