const FILES={"onb-00.html": "\u003c!DOCTYPE html>\n\u003chtml lang=\"ko\">\n\u003chead>\n\u003cmeta charset=\"UTF-8\">\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n\u003ctitle>화면기획 — 초대 이메일\u003c/title>\n\u003clink rel=\"stylesheet\" href=\"screen.css\">\n\u003cstyle>\n  .mail-subject{font-size:14px;font-weight:800;color:#1a1a1a;margin:2px 0 8px;}\n  .mail-body{font-size:12px;color:#475569;line-height:1.7;background:#fbfbf9;border:1px solid var(--line);\n             border-radius:8px;padding:12px 14px;}\n  .mail-body strong{color:#1a1a1a;}\n  .mail-from{width:26px;height:26px;border-radius:50%;background:#0f172a;color:#fff;font-size:11px;font-weight:700;\n             display:flex;align-items:center;justify-content:center;flex-shrink:0;}\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\n\u003cheader class=\"header\">\n  \u003cdiv class=\"crumb\">\u003cspan>인증·온보딩\u003c/span>\u003cspan class=\"s\">›\u003c/span>\u003cspan>초대 이메일\u003c/span>\u003c/div>\n  \u003ch1 class=\"title\">초대 이메일\u003c/h1>\n  \u003cspan class=\"sid\">ONB-00\u003c/span>\n  \u003cspan class=\"defense\">본인 이메일 초대 · 셀프가입 없음\u003c/span>\n\u003c/header>\n\n\u003cdiv class=\"main\">\n  \u003cdiv class=\"screen-panel\">\n    \u003cdiv style=\"position:relative;display:flex;\">\n      \u003cdiv class=\"labels\" id=\"labels\">\n        \u003cdiv class=\"lbl\">\u003cspan class=\"lbl-text\">메일\u003cbr>클라이언트\u003c/span>\u003c/div>\n        \u003cdiv class=\"lbl\">\u003cspan class=\"lbl-text\">발신·수신\u003cbr>·제목\u003c/span>\u003c/div>\n        \u003cdiv class=\"lbl\">\u003cspan class=\"lbl-text\">초대 본문\u003c/span>\u003c/div>\n        \u003cdiv class=\"lbl\">\u003cspan class=\"lbl-text\">활성화\u003cbr>링크\u003c/span>\u003c/div>\n      \u003c/div>\n      \u003csvg id=\"bracketSvg\" width=\"24\" style=\"flex-shrink:0;overflow:visible;\">\u003c/svg>\n    \u003c/div>\n\n    \u003cdiv class=\"frame\" id=\"frame\">\n      \u003c!-- 전역: 메일 클라이언트 (콘솔 아님 — 아직 로그인 전) -->\n      \u003cdiv class=\"zone\" data-idx=\"\">\n        \u003cdiv class=\"zone-highlight\">\u003c/div>\n        \u003cdiv class=\"c-top\" style=\"border-radius:8px 8px 0 0;background:#334155;\">\n          \u003cspan class=\"brand\">✉ 받은편지함\u003c/span>\n          \u003cspan class=\"meta\">\u003cspan class=\"c-badge\">manager@***.co.kr\u003c/span>\u003c/span>\n        \u003c/div>\n      \u003c/div>\n\n      \u003c!-- 발신·수신·제목 -->\n      \u003cdiv class=\"zone\" data-idx=\"0\">\n        \u003cdiv class=\"zone-highlight\">\u003c/div>\n        \u003cdiv class=\"item-area\" data-highlight=\"0\" style=\"position:relative;padding:8px;border-radius:8px;\">\n          \u003cdiv class=\"pin\" data-idx=\"0\" style=\"top:-4px;right:-4px;\">1\u003c/div>\n          \u003cdiv class=\"row\" style=\"gap:10px;align-items:flex-start;\">\n            \u003cdiv class=\"mail-from\">D\u003c/div>\n            \u003cdiv style=\"flex:1;\">\n              \u003cdiv class=\"kv\">\u003cspan class=\"k\">발신\u003c/span>\u003cspan class=\"v mono\">portal.kyc@dsrvlabs.com\u003c/span>\u003c/div>\n              \u003cdiv class=\"kv\">\u003cspan class=\"k\">수신\u003c/span>\u003cspan class=\"v mono\">manager@***.co.kr\u003c/span>\u003c/div>\n              \u003cdiv class=\"kv\">\u003cspan class=\"k\">제목\u003c/span>\u003cspan class=\"v\" style=\"font-family:inherit;\">[DSRV Desk] 계정 초대 · 활성화 안내\u003c/span>\u003c/div>\n            \u003c/div>\n          \u003c/div>\n        \u003c/div>\n      \u003c/div>\n\n      \u003c!-- 초대 본문 -->\n      \u003cdiv class=\"zone\" data-idx=\"1\">\n        \u003cdiv class=\"zone-highlight\">\u003c/div>\n        \u003cdiv class=\"item-area\" data-highlight=\"1\" style=\"position:relative;padding:8px;border-radius:8px;\">\n          \u003cdiv class=\"pin\" data-idx=\"1\" style=\"top:-4px;right:-4px;\">2\u003c/div>\n          \u003cdiv class=\"mail-subject\">A자산운용 담당자님, DSRV Desk 계정이 개설되었습니다.\u003c/div>\n          \u003cdiv class=\"mail-body\">\n            아래 \u003cstrong>계정 활성화\u003c/strong> 버튼을 눌러 진입한 뒤,\u003cbr>\n            ① \u003cstrong>비밀번호\u003c/strong>를 직접 설정하고 ② \u003cstrong>2차 인증(OTP)\u003c/strong>을 등록하면 로그인할 수 있습니다.\n          \u003c/div>\n          \u003cdiv class=\"mail-body\" style=\"margin-top:8px;background:#fffbeb;border-color:#fcd34d;\">\n            이 계정은 \u003cstrong>A자산운용에 발급되는 유일한 계정\u003c/strong>입니다.\n            한 조직(기관)에서는 \u003cstrong>1명만 가입\u003c/strong>할 수 있으며, 계정을 다른 사람과 공유할 수 없습니다.\u003cbr>\n            담당자가 변경되는 경우 이 계정을 해지한 뒤 새 담당자 앞으로 다시 초대해 드립니다.\n          \u003c/div>\n        \u003c/div>\n      \u003c/div>\n\n      \u003c!-- 활성화 링크 -->\n      \u003cdiv class=\"zone\" data-idx=\"2\">\n        \u003cdiv class=\"zone-highlight\">\u003c/div>\n        \u003cdiv class=\"item-area\" data-highlight=\"2\" style=\"position:relative;padding:8px;border-radius:8px;\">\n          \u003cdiv class=\"pin\" data-idx=\"2\" style=\"top:-4px;right:-4px;\">3\u003c/div>\n          \u003cdiv class=\"btn primary\">계정 활성화 · 비밀번호 설정 &nbsp;→\u003c/div>\n          \u003cdiv class=\"mail-body\" style=\"margin-top:8px;color:#94a3b8;font-size:11px;\">이 링크는 \u003cstrong>72시간\u003c/strong> 동안 유효하며 1회만 사용할 수 있습니다. 만료된 경우 관리자에게 재발급을 요청하세요.\u003c/div>\n        \u003c/div>\n      \u003c/div>\n\n    \u003c/div>\n  \u003c/div>\n\n  \u003csvg id=\"connSvg\" style=\"position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:10;overflow:visible;\">\u003c/svg>\n\n  \u003cdiv class=\"items\" id=\"items\">\n    \u003cdiv class=\"nav-global\">\n      \u003cdiv class=\"nav-global-title\">진입 · 전역 이동\u003c/div>\n      \u003cdiv class=\"nav-note\">· \u003cstrong>진입\u003c/strong>: DSRV 관리자가 설정(ADM-03)에서 초대 발송 → 담당자 본인 이메일로 수신 (콘솔 화면 아님 — 메일 클라이언트)\u003cbr>\n      · 활성화 링크 외 클릭 요소 없음 — 메일 본문에 로그인 버튼·기타 링크를 두지 않음(피싱 방지 원칙과 동일 맥락)\u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"itm\" data-idx=\"0\">\n      \u003cdiv class=\"num\">1\u003c/div>\n      \u003cdiv>\n        \u003cdiv class=\"itm-title\">본인 이메일로 초대 수신\u003cspan class=\"req\">필수\u003c/span>\u003c/div>\n        \u003cdiv class=\"itm-desc\">· 계약·고객확인(CDD)을 마친 회사의 담당자 본인 이메일로 발송\u003cbr>· 스스로 가입하는 경로는 없고, 계정마다 따로 초대\u003cbr>\u003cspan class=\"basis\">근거: 초대 기반 계정 개설 방식(스스로 가입 불가)\u003c/span>\u003c/div>\n      \u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"itm\" data-idx=\"1\">\n      \u003cdiv class=\"num\">2\u003c/div>\n      \u003cdiv>\n        \u003cdiv class=\"itm-title\">초대 본문 안내\u003cspan class=\"req\">필수\u003c/span>\u003c/div>\n        \u003cdiv class=\"itm-desc\">· 무엇을 해야 하는지(비밀번호 설정·2차 인증 등록) 안내\u003cbr>· 비밀번호는 메일이 아니라 설정 화면에서 본인이 입력\u003cbr>· \u003cstrong>1조직 1계정 고지\u003c/strong> — 한 조직(기관)에서는 1명만 가입 가능하고 계정 공유 불가, 담당자 변경 시 기존 계정 해지 후 재초대. 초대 메일에서 먼저 알림\u003cbr>\u003cspan class=\"basis\">근거: 정보보호 관리체계(ISMS) 인증기준 2.5(비밀번호·인증정보 관리) · 기관당 가입자 1명(ADM-03 초대 정책)\u003c/span>\u003c/div>\n      \u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"itm\" data-idx=\"2\">\n      \u003cdiv class=\"num\">3\u003c/div>\n      \u003cdiv>\n        \u003cdiv class=\"itm-title\">계정 활성화 링크\u003cspan class=\"req\">필수\u003c/span>\u003c/div>\n        \u003cdiv class=\"itm-desc\">· 클릭하면 계정 활성화 화면(ONB-01)으로 이동\u003cbr>· 링크는 1회만 쓸 수 있고 72시간 지나면 만료 · 만료 시 재발급\u003cbr>\u003cspan class=\"basis\">근거: 정보보호 관리체계(ISMS) 인증기준 2.5(인증정보 관리) · 1회용 활성화 링크\u003c/span>\u003c/div>\n        \u003cdiv class=\"itm-nav\">\u003cspan class=\"nav-tag\">화면 이동 · 인터랙션\u003c/span>\n          \u003cdiv class=\"nav-row\">\u003cspan class=\"nav-el\">[계정 활성화 · 비밀번호 설정 →] 버튼(링크)\u003c/span>\u003cspan class=\"nav-act\">클릭 — 1회용·72시간 유효 토큰 검증\u003c/span>\u003cspan class=\"nav-to\">\u003cstrong>계정 활성화(ONB-01)\u003c/strong> 이동 · 만료·재사용 링크는 오류 안내(재발급은 관리자에게 요청 — ADM-03 초대 재발송)\u003c/span>\u003c/div>\n        \u003c/div>\n      \u003c/div>\n    \u003c/div>\n  \u003c/div>\n\n\u003c/div>\n\n\u003csection class=\"footer-note\" style=\"padding-bottom:0;\">\n  \u003cdiv class=\"note-card\">\n    \u003cdiv class=\"note-title\">상세내용\u003c/div>\n    \u003cdiv class=\"detail-grid\" id=\"detailCol\">\n      \u003cdiv class=\"dtl\" data-idx=\"0\">\n        \u003cdiv class=\"detail-label\">\u003cspan class=\"dtl-num\">1\u003c/span>왜 이메일 초대인가\u003c/div>\n      \u003cdiv class=\"dtl-body\">\u003cspan class=\"box\">· 본인 이메일 수신·링크 접근 자체가 1차 신원 확인 축\u003cbr>· 계정별 개별 초대(공용 계정 금지) → 활동 로그 책임 추적\u003c/span>\u003c/div>\n      \u003c/div>\n      \u003cdiv class=\"dtl\" data-idx=\"1\">\n        \u003cdiv class=\"detail-label\">\u003cspan class=\"dtl-num\">2\u003c/span>본문이 담는 것\u003c/div>\n      \u003cdiv class=\"dtl-body\">\u003cspan class=\"box\">· 비밀번호를 \u003cstrong>메일에 담지 않음\u003c/strong>(회사가 생성·전달하지 않음 — 서버·이메일에 평문으로 존재한 적 없음)\u003cbr>· \u003cstrong>왜 1조직 1계정인가\u003c/strong> — 계정과 실제 사용자를 1:1로 묶어 모든 행위의 책임자를 특정(공용 계정 금지·감사 추적). 조직 내 다른 인원의 추가 가입 경로가 없으므로, 이 메일 수신자가 조직의 유일한 사용자임을 초대 시점에 못 박음\u003c/span>\u003c/div>\n      \u003c/div>\n    \u003c/div>\n  \u003c/div>\n\u003c/section>\n\n\u003csection class=\"footer-note\">\n  \u003cdiv class=\"note-card\">\n    \u003cdiv class=\"note-title\">비고\u003c/div>\n    \u003cdiv class=\"note-body\">\n      · 온보딩 \u003cstrong>시작점\u003c/strong>. KYC 게이팅 화면은 별도로 없음 — 계정은 \u003cstrong>KYC 완료 법인에만 생성·초대\u003c/strong>, KYC 예외(보류·재이행)는 EXC-01 배너 + 거래 요청 차단으로 처리(관리자 설정 ADM-03 종속).\u003cbr>\n      · 다음 화면: 계정 활성화(ONB-01)\n    \u003c/div>\n  \u003c/div>\n\u003c/section>\n\n\u003cscript src=\"screen.js\">\u003c/script>\n\u003c/body>\n\u003c/html>\n", "onb-01.html": "\u003c!DOCTYPE html>\n\u003chtml lang=\"ko\">\n\u003chead>\n\u003cmeta charset=\"UTF-8\">\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n\u003ctitle>화면기획 — 계정 활성화\u003c/title>\n\u003clink rel=\"stylesheet\" href=\"screen.css\">\n\u003cstyle>\n  .qr{width:104px;height:104px;border-radius:8px;border:1px solid var(--line);\n      background:\n        repeating-linear-gradient(0deg,#111 0 6px,#fff 6px 12px),\n        repeating-linear-gradient(90deg,#111 0 6px,#fff 6px 12px);\n      background-blend-mode:multiply;flex-shrink:0;}\n  .qr-wrap{display:flex;gap:12px;align-items:center;}\n  .bkcode{font-family:monospace;font-size:11px;color:#334155;background:#f8fafc;border:1px dashed var(--line);\n          border-radius:6px;padding:8px 10px;letter-spacing:.05em;line-height:1.8;}\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\n\u003cheader class=\"header\">\n  \u003cdiv class=\"crumb\">\u003cspan>인증·온보딩\u003c/span>\u003cspan class=\"s\">›\u003c/span>\u003cspan>계정 활성화\u003c/span>\u003c/div>\n  \u003ch1 class=\"title\">계정 활성화\u003c/h1>\n  \u003cspan class=\"sid\">ONB-01\u003c/span>\n  \u003cspan class=\"defense\">초대 기반 · 비번 본인설정 · MFA 등록\u003c/span>\n\u003c/header>\n\n\u003cdiv class=\"main\">\n  \u003cdiv class=\"screen-panel\">\n    \u003cdiv style=\"position:relative;display:flex;\">\n      \u003cdiv class=\"labels\" id=\"labels\">\n        \u003cdiv class=\"lbl\">\u003cspan class=\"lbl-text\">전역 상단\u003c/span>\u003c/div>\n        \u003cdiv class=\"lbl\">\u003cspan class=\"lbl-text\">초대·계정\u003cbr>확인\u003c/span>\u003c/div>\n        \u003cdiv class=\"lbl\">\u003cspan class=\"lbl-text\">비밀번호\u003cbr>설정\u003c/span>\u003c/div>\n        \u003cdiv class=\"lbl\">\u003cspan class=\"lbl-text\">2차 인증\u003cbr>(QR)\u003c/span>\u003c/div>\n        \u003cdiv class=\"lbl\">\u003cspan class=\"lbl-text\">완료·\u003cbr>백업코드\u003c/span>\u003c/div>\n      \u003c/div>\n      \u003csvg id=\"bracketSvg\" width=\"24\" style=\"flex-shrink:0;overflow:visible;\">\u003c/svg>\n    \u003c/div>\n\n    \u003cdiv class=\"frame\" id=\"frame\">\n      \u003c!-- 전역: 활성화 진입 (로그인 전 — ORG 미표시) -->\n      \u003cdiv class=\"zone\" data-idx=\"\">\n        \u003cdiv class=\"zone-highlight\">\u003c/div>\n        \u003cdiv class=\"c-top\" style=\"border-radius:8px;\">\n          \u003cspan class=\"brand\">DSRV Desk\u003c/span>\n          \u003cspan class=\"meta\">\u003cspan class=\"c-badge\">계정 활성화\u003c/span>\u003cspan>보안 설정\u003c/span>\u003c/span>\n        \u003c/div>\n      \u003c/div>\n\n      \u003c!-- 초대·계정 확인 -->\n      \u003cdiv class=\"zone\" data-idx=\"0\">\n        \u003cdiv class=\"zone-highlight\">\u003c/div>\n        \u003cdiv class=\"item-area\" data-highlight=\"0\" style=\"position:relative;padding:8px;border-radius:8px;\">\n          \u003cdiv class=\"pin\" data-idx=\"0\" style=\"top:-4px;right:-4px;\">1\u003c/div>\n          \u003cdiv class=\"kv\">\u003cspan class=\"k\">초대 대상 ORG\u003c/span>\u003cspan class=\"v\">A자산운용\u003c/span>\u003c/div>\n          \u003cdiv class=\"kv\">\u003cspan class=\"k\">담당자 이메일\u003c/span>\u003cspan class=\"v mono\">manager@***.co.kr\u003c/span>\u003c/div>\n        \u003c/div>\n      \u003c/div>\n\n      \u003c!-- 비밀번호 설정 -->\n      \u003cdiv class=\"zone\" data-idx=\"1\">\n        \u003cdiv class=\"zone-highlight\">\u003c/div>\n        \u003cdiv class=\"item-area\" data-highlight=\"1\" style=\"position:relative;padding:8px;border-radius:8px;\">\n          \u003cdiv class=\"pin\" data-idx=\"1\" style=\"top:-4px;right:-4px;\">2\u003c/div>\n          \u003cdiv style=\"font-size:11px;color:#94a3b8;font-weight:600;margin-bottom:6px;\">비밀번호 설정\u003c/div>\n          \u003cdiv class=\"field\" style=\"margin-bottom:8px;\">\u003cspan class=\"ph\">새 비밀번호\u003c/span>\u003c/div>\n          \u003cdiv class=\"field\">\u003cspan class=\"ph\">새 비밀번호 확인\u003c/span>\u003c/div>\n          \u003cdiv class=\"pw-guide\" style=\"margin-top:8px;line-height:1.75;font-size:11px;color:#475569;background:#fbfbf9;border:1px solid var(--line);border-radius:8px;padding:10px 12px;\">\n            \u003cstrong style=\"color:#1a1a1a;\">안전한 비밀번호를 위해 아래를 지켜주세요.\u003c/strong>\u003cbr>\n            ① 영문 대·소문자, 숫자, 특수문자 중 3종 이상 조합 8자 이상\u003cbr>\n            ② 이메일과 동일한 문자 사용 불가\u003cbr>\n            ③ 동일 문자 4번 이상 사용 불가\u003cbr>\n            ④ 특수문자는 !@#$%^&amp;*() 만 사용 가능\n          \u003c/div>\n        \u003c/div>\n      \u003c/div>\n\n      \u003c!-- 2FA QR -->\n      \u003cdiv class=\"zone\" data-idx=\"2\">\n        \u003cdiv class=\"zone-highlight\">\u003c/div>\n        \u003cdiv class=\"item-area\" data-highlight=\"2\" style=\"position:relative;padding:8px;border-radius:8px;\">\n          \u003cdiv class=\"pin\" data-idx=\"2\" style=\"top:-4px;right:-4px;\">3\u003c/div>\n          \u003cdiv style=\"font-size:11px;color:#94a3b8;font-weight:600;margin-bottom:6px;\">2차 인증 등록 (Google Authenticator)\u003c/div>\n          \u003cdiv class=\"qr-wrap\">\n            \u003cdiv class=\"qr\">\u003c/div>\n            \u003cdiv style=\"flex:1;\">\n              \u003cdiv style=\"margin-top:0;font-size:11px;color:#64748b;\">Google Authenticator 앱으로 QR을 스캔한 뒤, 표시되는 6자리 코드를 입력하세요.\u003c/div>\n              \u003cdiv class=\"field\" style=\"margin-top:8px;text-align:center;letter-spacing:.3em;\">\u003cspan class=\"ph\">· · · · · ·\u003c/span>\u003c/div>\n            \u003c/div>\n          \u003c/div>\n        \u003c/div>\n      \u003c/div>\n\n      \u003c!-- 완료·백업코드 -->\n      \u003cdiv class=\"zone\" data-idx=\"3\">\n        \u003cdiv class=\"zone-highlight\">\u003c/div>\n        \u003cdiv class=\"item-area\" data-highlight=\"3\" style=\"position:relative;padding:8px;border-radius:8px;\">\n          \u003cdiv class=\"pin\" data-idx=\"3\" style=\"top:-6px;right:-4px;\">4\u003c/div>\n          \u003cdiv style=\"font-size:11px;color:#94a3b8;font-weight:600;margin-bottom:6px;\">백업코드 저장 (기기 분실 대비)\u003c/div>\n          \u003cdiv class=\"bkcode\">4F2A-9C11 · 7B0E-3D5A · A18C-62F4\u003cbr>D904-1EB7 · 2C6F-88AB · 55E3-0A9D\u003c/div>\n          \u003cdiv class=\"btn primary\" style=\"margin-top:10px;\">활성화 완료 → 로그인\u003c/div>\n        \u003c/div>\n      \u003c/div>\n    \u003c/div>\n  \u003c/div>\n\n  \u003csvg id=\"connSvg\" style=\"position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:10;overflow:visible;\">\u003c/svg>\n\n  \u003cdiv class=\"items\" id=\"items\">\n    \u003cdiv class=\"nav-global\">\n      \u003cdiv class=\"nav-global-title\">진입 · 전역 이동\u003c/div>\n      \u003cdiv class=\"nav-note\">· \u003cstrong>진입\u003c/strong>: 초대 이메일(ONB-00) 링크 클릭(1회용·72시간) — 콘솔 GNB 밖(로그인 전) · 2차 인증 재설정(DASH-03) 재발송 링크도 이 화면 재수행\u003cbr>\n      · 중도 이탈·링크 만료 시 재진입은 초대 재발급(ADM-03)으로만 \u003cspan style=\"color:#991b1b;\">[확인필요: 중도 이탈 시 기존 링크 재사용 허용 여부]\u003c/span>\u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"itm\" data-idx=\"0\">\n      \u003cdiv class=\"num\">1\u003c/div>\n      \u003cdiv>\n        \u003cdiv class=\"itm-title\">초대 토큰 검증\u003cspan class=\"req\">필수\u003c/span>\u003c/div>\n        \u003cdiv class=\"itm-desc\">· 초대 이메일 링크의 일회성·유효기간 토큰 검증\u003cbr>· 셀프가입 없음(초대 기반 ORG) · 만료 시 재발급\u003cbr>\u003cspan class=\"basis\">근거 32 §2 ONB-01 · 초대 기반\u003c/span>\u003c/div>\n      \u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"itm\" data-idx=\"1\">\n      \u003cdiv class=\"num\">2\u003c/div>\n      \u003cdiv>\n        \u003cdiv class=\"itm-title\">비밀번호 본인 설정\u003cspan class=\"req\">필수\u003c/span>\u003c/div>\n        \u003cdiv class=\"itm-desc\">· 담당자가 직접 설정(회사가 초기 비밀번호를 만들어 전달하지 않음)\u003cbr>· 비밀번호 규칙 4개 항목 안내 노출 · 원문 저장·전송 없음 · \u003cstrong>같은 안내문구를 비밀번호 수정(DASH-02)에서도 재사용\u003c/strong>\u003cbr>\u003cspan class=\"basis\">근거: 계정 활성화·비밀번호 설정 화면 · 정보보호 관리체계(ISMS) 인증기준 2.5.3·2.5.4(비밀번호 관리)\u003c/span>\u003c/div>\n        \u003cdiv class=\"itm-nav\">\u003cspan class=\"nav-tag\">화면 이동 · 인터랙션\u003c/span>\n          \u003cdiv class=\"nav-row\">\u003cspan class=\"nav-el\">새 비밀번호 · 확인 입력\u003c/span>\u003cspan class=\"nav-act\">비밀번호 규칙(4항목) 검증 — 위반 시 다음 진행 불가\u003c/span>\u003cspan class=\"nav-to stay\">화면 내 (이동 없음)\u003c/span>\u003c/div>\n        \u003c/div>\n      \u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"itm\" data-idx=\"2\">\n      \u003cdiv class=\"num\">3\u003c/div>\n      \u003cdiv>\n        \u003cdiv class=\"itm-title\">2FA(Google Authenticator) QR 등록\u003cspan class=\"req\">필수\u003c/span>\u003c/div>\n        \u003cdiv class=\"itm-desc\">· Google Authenticator로 QR 스캔 → 6자리 코드로 등록 확인\u003cbr>· 전 권한자 MFA 의무\u003cbr>\u003cspan class=\"basis\">근거 ISMS 2.5 · F-5\u003c/span>\u003c/div>\n        \u003cdiv class=\"itm-nav\">\u003cspan class=\"nav-tag\">화면 이동 · 인터랙션\u003c/span>\n          \u003cdiv class=\"nav-row\">\u003cspan class=\"nav-el\">QR 스캔 + 6자리 코드 입력\u003c/span>\u003cspan class=\"nav-act\">Google Authenticator 등록 확인 — 실패·우회 시도는 감사로그\u003c/span>\u003cspan class=\"nav-to stay\">화면 내 (이동 없음)\u003c/span>\u003c/div>\n        \u003c/div>\n      \u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"itm\" data-idx=\"3\">\n      \u003cdiv class=\"num\">4\u003c/div>\n      \u003cdiv>\n        \u003cdiv class=\"itm-title\">백업코드·활성화 완료\u003cspan class=\"req\">필수\u003c/span>\u003c/div>\n        \u003cdiv class=\"itm-desc\">· 백업코드 발급(기기 분실 대비) · 저장 안내\u003cbr>· 활성화 완료 → 로그인 이동\u003cbr>\u003cspan class=\"basis\">근거 ISMS 2.5 세션·인증 복구\u003c/span>\u003c/div>\n        \u003cdiv class=\"itm-nav\">\u003cspan class=\"nav-tag\">화면 이동 · 인터랙션\u003c/span>\n          \u003cdiv class=\"nav-row\">\u003cspan class=\"nav-el\">[활성화 완료 → 로그인] 버튼\u003c/span>\u003cspan class=\"nav-act\">클릭 — 비밀번호 설정·2FA 등록 완료가 전제 · 백업코드 발급 후 활성화 확정\u003c/span>\u003cspan class=\"nav-to\">\u003cstrong>로그인(AUTH-01)\u003c/strong> 이동\u003c/span>\u003c/div>\n        \u003c/div>\n      \u003c/div>\n    \u003c/div>\n  \u003c/div>\n\n\u003c/div>\n\n\u003csection class=\"footer-note\" style=\"padding-bottom:0;\">\n  \u003cdiv class=\"note-card\">\n    \u003cdiv class=\"note-title\">상세내용\u003c/div>\n    \u003cdiv class=\"detail-grid\" id=\"detailCol\">\n      \u003cdiv class=\"dtl\" data-idx=\"1\">\n        \u003cdiv class=\"detail-label\">\u003cspan class=\"dtl-num\">2\u003c/span>비번 방식 근거\u003c/div>\n      \u003cdiv class=\"dtl-body\">\u003cspan class=\"box\">· '초기 비밀번호 생성·전달' 대신 \u003cstrong>활성화 링크 → 본인 설정\u003c/strong>\u003cbr>· 비밀번호가 서버·이메일에 평문으로 존재한 적 없음\u003cbr>· 심사기관 설명·감사 대응 용이\u003c/span>\u003c/div>\n      \u003c/div>\n      \u003cdiv class=\"dtl\" data-idx=\"2\">\n        \u003cdiv class=\"detail-label\">\u003cspan class=\"dtl-num\">3\u003c/span>2FA 등록·복구\u003c/div>\n      \u003cdiv class=\"dtl-body\">\u003cspan class=\"box\">· Google Authenticator 사용 — 시간 기반 일회용 비밀번호(TOTP, RFC 6238) 표준 · 로그인·민감행위 재인증에 사용\u003cbr>· 등록 실패·우회 시도는 감사로그 기록\u003c/span>\u003c/div>\n      \u003c/div>\n      \u003cdiv class=\"dtl\" data-idx=\"3\">\n        \u003cdiv class=\"detail-label\">\u003cspan class=\"dtl-num\">4\u003c/span>백업코드 취급\u003c/div>\n      \u003cdiv class=\"dtl-body\">\u003cspan class=\"box\">· 기기 분실 시 로그인 2FA 입력칸에 그대로 입력(AUTH-01 · 별도 화면 없음)\u003cbr>· 1회용 — 사용 즉시 폐기 · 사용 이력 로그\u003cbr>· 재발급은 2FA 재설정(초대 재발송→ONB-01 재수행) 완료 시 자동 — 이전 코드 전량 폐기\u003c/span>\u003c/div>\n      \u003c/div>\n    \u003c/div>\n  \u003c/div>\n\u003c/section>\n\n\u003csection class=\"footer-note\">\n  \u003cdiv class=\"note-card\">\n    \u003cdiv class=\"note-title\">비고\u003c/div>\n    \u003cdiv class=\"note-body\">\n      · 가입 완료 직후 \u003cstrong>1회성 계정 활성화\u003c/strong> 화면. 초대 이메일 링크 → 비밀번호 본인 설정 + 2FA(QR) 등록 → 백업코드 → 로그인.\u003cbr>\n      · 이전: 초대 이메일(ONB-00) · 다음 화면: 로그인(AUTH-01)\n    \u003c/div>\n  \u003c/div>\n\u003c/section>\n\n\u003cscript src=\"screen.js\">\u003c/script>\n\u003c/body>\n\u003c/html>\n", "auth-01.html": "\u003c!DOCTYPE html>\n\u003chtml lang=\"ko\">\n\u003chead>\n\u003cmeta charset=\"UTF-8\">\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n\u003ctitle>화면기획 — 로그인\u003c/title>\n\u003clink rel=\"stylesheet\" href=\"screen.css\">\n\u003c/head>\n\u003cbody>\n\n\u003cheader class=\"header\">\n  \u003cdiv class=\"crumb\">\u003cspan>인증\u003c/span>\u003cspan class=\"s\">›\u003c/span>\u003cspan>로그인\u003c/span>\u003c/div>\n  \u003ch1 class=\"title\">로그인\u003c/h1>\n  \u003cspan class=\"sid\">AUTH-01\u003c/span>\n  \u003cspan class=\"defense\">MFA 의무 · 비정상 로그인 통제\u003c/span>\n\u003c/header>\n\n\u003cdiv class=\"main\">\n  \u003cdiv class=\"screen-panel\">\n    \u003cdiv style=\"position:relative;display:flex;\">\n      \u003cdiv class=\"labels\" id=\"labels\">\n        \u003cdiv class=\"lbl\">\u003cspan class=\"lbl-text\">전역 상단\u003c/span>\u003c/div>\n        \u003cdiv class=\"lbl\">\u003cspan class=\"lbl-text\">계정 입력\u003c/span>\u003c/div>\n        \u003cdiv class=\"lbl\">\u003cspan class=\"lbl-text\">2차 인증\u003cbr>(MFA)\u003c/span>\u003c/div>\n        \u003cdiv class=\"lbl\">\u003cspan class=\"lbl-text\">세션·\u003cbr>로그인\u003c/span>\u003c/div>\n        \u003cdiv class=\"lbl\">\u003cspan class=\"lbl-text\">계정 잠금\u003cbr>안내\u003c/span>\u003c/div>\n      \u003c/div>\n      \u003csvg id=\"bracketSvg\" width=\"24\" style=\"flex-shrink:0;overflow:visible;\">\u003c/svg>\n    \u003c/div>\n\n    \u003cdiv class=\"frame\" id=\"frame\">\n      \u003c!-- 전역: 콘솔 상단 (로그인 전 — ORG 미표시) -->\n      \u003cdiv class=\"zone\" data-idx=\"\">\n        \u003cdiv class=\"zone-highlight\">\u003c/div>\n        \u003cdiv class=\"c-top\" style=\"border-radius:8px 8px 0 0;\">\n          \u003cspan class=\"brand\">DSRV Desk\u003c/span>\n          \u003cspan class=\"meta\">\u003cspan>로그인\u003c/span>\u003c/span>\n        \u003c/div>\n      \u003c/div>\n\n      \u003c!-- ID/PW -->\n      \u003cdiv class=\"zone\" data-idx=\"0\">\n        \u003cdiv class=\"zone-highlight\">\u003c/div>\n        \u003cdiv class=\"item-area\" data-highlight=\"0\" style=\"position:relative;padding:8px;border-radius:8px;\">\n          \u003cdiv class=\"pin\" data-idx=\"0\" style=\"top:-4px;right:-4px;\">1\u003c/div>\n          \u003cdiv style=\"font-size:11px;color:#94a3b8;font-weight:600;margin-bottom:6px;\">로그인\u003c/div>\n          \u003cdiv class=\"field\" style=\"margin-bottom:8px;\">\u003cspan class=\"ph\">이메일(담당자 계정)\u003c/span>\u003c/div>\n          \u003cdiv class=\"field\">\u003cspan class=\"ph\">비밀번호\u003c/span>\u003c/div>\n        \u003c/div>\n      \u003c/div>\n\n      \u003c!-- 2FA -->\n      \u003cdiv class=\"zone\" data-idx=\"1\">\n        \u003cdiv class=\"zone-highlight\">\u003c/div>\n        \u003cdiv class=\"item-area\" data-highlight=\"1\" style=\"position:relative;padding:8px;border-radius:8px;\">\n          \u003cdiv class=\"pin\" data-idx=\"1\" style=\"top:-4px;right:-4px;\">2\u003c/div>\n          \u003cdiv style=\"font-size:11px;color:#94a3b8;font-weight:600;margin-bottom:6px;\">2차 인증 (Google Authenticator)\u003c/div>\n          \u003cdiv class=\"field\" style=\"text-align:center;letter-spacing:.3em;\">\u003cspan class=\"ph\">· · · · · ·\u003c/span>\u003c/div>\n          \u003cdiv style=\"font-size:11px;color:#94a3b8;margin-top:6px;\">기기 분실 시 백업코드(예: 4F2A-9C11)를 위 칸에 입력\u003c/div>\n        \u003c/div>\n      \u003c/div>\n\n      \u003c!-- 세션·로그인 -->\n      \u003cdiv class=\"zone\" data-idx=\"2\">\n        \u003cdiv class=\"zone-highlight\">\u003c/div>\n        \u003cdiv class=\"item-area\" data-highlight=\"2\" style=\"position:relative;padding:8px;border-radius:8px;\">\n          \u003cdiv class=\"pin\" data-idx=\"2\" style=\"top:-6px;right:-4px;\">3\u003c/div>\n          \u003cdiv class=\"btn primary\">로그인\u003c/div>\n        \u003c/div>\n      \u003c/div>\n\n      \u003c!-- 계정 잠금 안내 (잠금 상태에서만 노출) -->\n      \u003cdiv class=\"zone\" data-idx=\"3\">\n        \u003cdiv class=\"zone-highlight\">\u003c/div>\n        \u003cdiv class=\"item-area\" data-highlight=\"3\" style=\"position:relative;padding:8px;border-radius:8px;\">\n          \u003cdiv class=\"pin\" data-idx=\"3\" style=\"top:-4px;right:-4px;\">4\u003c/div>\n          \u003cdiv style=\"background:#fef2f2;border:1px solid #fecaca;border-radius:6px;padding:10px 12px;font-size:11.5px;color:#991b1b;line-height:1.55;\">\n            비밀번호를 5회 이상 잘못 입력해 계정이 잠겼습니다.\u003cbr>\n            잠금 해제는 담당자에게 문의해 주세요 — \u003cstrong>portal.kyc@dsrvlabs.com\u003c/strong>\n          \u003c/div>\n        \u003c/div>\n      \u003c/div>\n    \u003c/div>\n  \u003c/div>\n\n  \u003csvg id=\"connSvg\" style=\"position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:10;overflow:visible;\">\u003c/svg>\n\n  \u003cdiv class=\"items\" id=\"items\">\n    \u003cdiv class=\"nav-global\">\n      \u003cdiv class=\"nav-global-title\">진입 · 전역 이동\u003c/div>\n      \u003cdiv class=\"nav-note\">· \u003cstrong>진입\u003c/strong>: 계정 활성화(ONB-01) 완료 직후 / 로그아웃·세션 만료(유휴 15분·최대 8시간) 후 재접속\u003cbr>\n      · 비밀번호 찾기·아이디 찾기 링크 없음 — 분실 시 2차 인증 재설정(DASH-03)·초대 재발송(ADM-03) 운영 절차로 처리\u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"itm\" data-idx=\"0\">\n      \u003cdiv class=\"num\">1\u003c/div>\n      \u003cdiv>\n        \u003cdiv class=\"itm-title\">ID/PW 입력\u003cspan class=\"req\">필수\u003c/span>\u003c/div>\n        \u003cdiv class=\"itm-desc\">· 담당자 계정(이메일)·비밀번호\u003cbr>· 스스로 가입할 수 없고 초대받은 회사 담당자만 로그인 · 5회 실패 시 계정 잠금(항목 4) · 비밀번호 규칙 적용(설정은 ONB-01 · 수정은 DASH-02)\u003cbr>\u003cspan class=\"basis\">근거: 로그인 인증 화면 · 정보보호 관리체계(ISMS) 인증기준 2.5.3·2.5.4(비밀번호 관리)\u003c/span>\u003c/div>\n      \u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"itm\" data-idx=\"1\">\n      \u003cdiv class=\"num\">2\u003c/div>\n      \u003cdiv>\n        \u003cdiv class=\"itm-title\">2FA/MFA 인증\u003cspan class=\"req\">필수\u003c/span>\u003c/div>\n        \u003cdiv class=\"itm-desc\">· Google Authenticator 2차 인증 — ONB-01에서 등록한 앱의 6자리 코드 입력\u003cbr>· 기기 분실 시 \u003cstrong>같은 입력칸에 백업코드 입력\u003c/strong>(별도 화면·모달 없음) — 6자리 숫자는 인증코드, 8자리 영숫자는 백업코드로 자동 구분\u003cbr>· 백업코드는 1회용 — 사용 즉시 폐기 · 사용 시 홈(DASH-01)에 2차 인증 재설정 권고 배너 노출\u003cbr>· 전 권한자 MFA 의무 · 민감행위 재인증\u003cbr>\u003cspan class=\"basis\">근거 ISMS 2.5 · F-5\u003c/span>\u003c/div>\n        \u003cdiv class=\"itm-nav\">\u003cspan class=\"nav-tag\">화면 이동 · 인터랙션\u003c/span>\n          \u003cdiv class=\"nav-row\">\u003cspan class=\"nav-el\">2차 인증 칸에 백업코드 입력\u003c/span>\u003cspan class=\"nav-act\">8자리 영숫자 → 백업코드로 자동 구분 · 1회용, 사용 즉시 폐기\u003c/span>\u003cspan class=\"nav-to\">성공 → \u003cstrong>DASH-01\u003c/strong> + 홈 상단에 2차 인증 재설정 권고 배너 노출\u003c/span>\u003c/div>\n        \u003c/div>\n      \u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"itm\" data-idx=\"2\">\n      \u003cdiv class=\"num\">3\u003c/div>\n      \u003cdiv>\n        \u003cdiv class=\"itm-title\">세션 정책·로그인\u003cspan class=\"req\">필수\u003c/span>\u003c/div>\n        \u003cdiv class=\"itm-desc\">· 유휴 타임아웃: 무조작 \u003cstrong>15분\u003c/strong> 후 자동 로그아웃(\u003cspan style=\"color:#b45309;\">[확인필요]\u003c/span> 관리자·특권 계정은 10분 별도 적용)\u003cbr>· 세션 최대 지속: 재인증 없이 최대 \u003cstrong>8시간\u003c/strong> 후 재로그인\u003cbr>· 동시세션: \u003cstrong>계정당 1세션 원칙\u003c/strong> — 새 기기 로그인 시 기존 세션 종료(\u003cspan style=\"color:#b45309;\">[확인필요]\u003c/span> 예외 허용 여부)\u003cbr>· 로그아웃·브라우저 종료 시 세션 즉시 파기\u003cbr>\u003cspan class=\"basis\">근거: 세션·인증 관리 · 정보보호 관리체계(ISMS) 인증기준 2.5(인증)·2.6(접근통제)\u003c/span>\u003c/div>\n        \u003cdiv class=\"itm-nav\">\u003cspan class=\"nav-tag\">화면 이동 · 인터랙션\u003c/span>\n          \u003cdiv class=\"nav-row\">\u003cspan class=\"nav-el\">[로그인] 버튼\u003c/span>\u003cspan class=\"nav-act\">클릭 — ID/PW + 2차 인증(6자리) 검증\u003c/span>\u003cspan class=\"nav-to\">성공 → \u003cstrong>대시보드(DASH-01)\u003c/strong> / 실패 → 오류 표시·화면 잔류(연속 5회 실패 시 계정 잠금)\u003c/span>\u003c/div>\n        \u003c/div>\n      \u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"itm\" data-idx=\"3\">\n      \u003cdiv class=\"num\">4\u003c/div>\n      \u003cdiv>\n        \u003cdiv class=\"itm-title\">계정 잠금·알림\u003cspan class=\"req\">필수\u003c/span>\u003c/div>\n        \u003cdiv class=\"itm-desc\">· 비밀번호 연속 5회 오류 → \u003cstrong>계정 잠금 · 로그인 차단\u003c/strong>(해제 전 재시도 불가)\u003cbr>· 잠금 발생 즉시 \u003cstrong>어드민 콘솔(ADM-02 알람함) 알림\u003c/strong> — DSRV 담당자 인지·조치\u003cbr>· 화면 하단에 잠금 안내 문구 + 문의 이메일 \u003cstrong>portal.kyc@dsrvlabs.com\u003c/strong> 노출(잠금 상태에서만)\u003cbr>\u003cspan class=\"basis\">근거: 비정상 로그인 통제 · 정보보호 관리체계(ISMS) 인증기준 2.5(인증)·2.6(접근통제)\u003c/span>\u003c/div>\n        \u003cdiv class=\"itm-nav\">\u003cspan class=\"nav-tag\">화면 이동 · 인터랙션\u003c/span>\n          \u003cdiv class=\"nav-row\">\u003cspan class=\"nav-el\">계정 잠금 상태에서 로그인 시도\u003c/span>\u003cspan class=\"nav-act\">차단 — 해제 전 재시도 불가\u003c/span>\u003cspan class=\"nav-to stay\">화면 잔류 · 잠금 안내(문의 이메일) 노출 — 해제는 어드민 홈(ADM-02) 처리함의 '계정 잠금' 알람 처리\u003c/span>\u003c/div>\n        \u003c/div>\n      \u003c/div>\n    \u003c/div>\n  \u003c/div>\n\n\u003c/div>\n\n\u003csection class=\"footer-note\" style=\"padding-bottom:0;\">\n  \u003cdiv class=\"note-card\">\n    \u003cdiv class=\"note-title\">상세내용\u003c/div>\n    \u003cdiv class=\"detail-grid\" id=\"detailCol\">\n      \u003cdiv class=\"dtl\" data-idx=\"0\">\n        \u003cdiv class=\"detail-label\">\u003cspan class=\"dtl-num\">1\u003c/span>접근 전제\u003c/div>\n      \u003cdiv class=\"dtl-body\">\u003cspan class=\"box\">· 초대받은 ORG 담당자만 계정 보유(셀프가입 없음)\u003cbr>· KYC·계약 완료 전에는 로그인 후에도 기능 게이팅(G-3 배너)\u003c/span>\u003c/div>\n      \u003c/div>\n      \u003cdiv class=\"dtl\" data-idx=\"1\">\n        \u003cdiv class=\"detail-label\">\u003cspan class=\"dtl-num\">2\u003c/span>MFA 적용 범위\u003c/div>\n      \u003cdiv class=\"dtl-body\">\u003cspan class=\"box\">· 로그인 시 1회 + 승인·정책변경 등 \u003cstrong>민감행위를 할 때 다시 인증\u003c/strong>\u003cbr>· \u003cstrong>정보변경 시 다시 인증하는 대상 = 계정정보\u003c/strong>(비밀번호·2차 인증·세션·기기, DASH-01) — 화이트리스트 등록은 교환·중개에 없으므로 대상에서 제외\u003cbr>· 인증 실패·우회 시도는 감사기록에 남김 \u003cspan style=\"color:#94a3b8;\">— 근거: 정보보호 관리체계(ISMS) 인증기준 2.10.4(중요정보 변경 시 재인증)\u003c/span>\u003c/span>\u003c/div>\n      \u003c/div>\n      \u003cdiv class=\"dtl\" data-idx=\"2\">\n        \u003cdiv class=\"detail-label\">\u003cspan class=\"dtl-num\">3\u003c/span>세션 이후 흐름\u003c/div>\n      \u003cdiv class=\"dtl-body\">\u003cspan class=\"box\">· 로그인 성공 → 대시보드 → 교환하기(나목)·교환게시판(마목) 탭 진입\u003cbr>· 유휴 타임아웃 시 자동 로그아웃·재인증\u003c/span>\u003c/div>\n      \u003c/div>\n      \u003cdiv class=\"dtl\" data-idx=\"3\">\n        \u003cdiv class=\"detail-label\">\u003cspan class=\"dtl-num\">4\u003c/span>잠금 해제·알림 처리\u003c/div>\n      \u003cdiv class=\"dtl-body\">\u003cspan class=\"box\">· 잠금 해제: DSRV 관리자가 본인확인 후 해제 또는 초대 재발송 — 처리는 \u003cstrong>어드민 홈(ADM-02) 처리함의 '계정 잠금' 알람\u003c/strong>, 백업코드 분실과 동일한 운영 프로세스\u003cbr>· 잠금·해제·알림 이력은 감사로그 기록\u003cbr>· 허용 IP 화이트리스트·디바이스/위치 이상 탐지는 적용하지 않음(제외)\u003c/span>\u003c/div>\n      \u003c/div>\n    \u003c/div>\n  \u003c/div>\n\u003c/section>\n\n\u003csection class=\"footer-note\">\n  \u003cdiv class=\"note-card\">\n    \u003cdiv class=\"note-title\">비고\u003c/div>\n    \u003cdiv class=\"note-body\">\n      · 모든 화면의 \u003cstrong>진입점(로그인)\u003c/strong>. 인증 후 콘솔 상단(G-2/G-4)·KYC 배너(G-3)가 전역으로 유지.\u003cbr>\n      · \u003cstrong>[비밀번호 규칙]\u003c/strong> ① 영문 대·소문자·숫자·특수문자 중 3종 이상 8자 이상 ② 이메일과 동일한 문자 사용 금지 ③ 동일 문자 4번 이상 사용 금지 ④ 특수문자는 !@#$%^&amp;*()만 허용 ⑤ 연속 5회 실패 시 계정 잠금 ⑥ 단방향 해시+salt 저장(원문 미보관 — 초대·본인설정 방식이라 임시 비밀번호 없음) ⑦ \u003cstrong>변경주기는 강제하지 않고 권고\u003c/strong>(유출 정황 시 즉시 변경 원칙). 실제 입력·안내문구는 ONB-01·DASH-02 화면에 노출 — 근거: 정보보호 관리체계(ISMS) 인증기준 2.5.4(비밀번호 관리).\u003cbr>\n      · \u003cstrong>[최소 구현]\u003c/strong> 잠금 알림은 어드민 알람함 재사용(외부 메신저·webhook 없음) · 백업코드는 비밀번호와 동일한 해시 방식으로 저장, 사용·실패 감사로그 기록 · 재설정·재발급은 기존 초대 재발송(ONB-00→ONB-01) 재사용(신규 화면 없음).\u003cbr>\n      · \u003cspan style=\"color:#991b1b;\">[확인필요]\u003c/span> 유휴 타임아웃 값·특권계정 별도 정책·동시세션 예외.\u003cbr>\n      · 다음 화면: 대시보드 DASH-01 (GNB에서 교환하기 EXC-01 / 교환게시판 BRK-01 진입)\n    \u003c/div>\n  \u003c/div>\n\u003c/section>\n\n\u003cscript src=\"screen.js\">\u003c/script>\n\u003c/body>\n\u003c/html>\n", "dash-01.html": "\u003c!DOCTYPE html>\n\u003chtml lang=\"ko\">\n\u003chead>\n\u003cmeta charset=\"UTF-8\">\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n\u003ctitle>화면기획 — 대시보드\u003c/title>\n\u003clink rel=\"stylesheet\" href=\"screen.css\">\n\u003cstyle>\n  .tbl{width:100%;border-collapse:collapse;font-size:11px;}\n  .tbl th{background:#f1f5f9;color:#64748b;font-weight:700;text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);font-size:10px;}\n  .tbl td{padding:7px 8px;border-bottom:1px solid #f1f1ee;color:#334155;vertical-align:middle;}\n  .st{display:inline-block;font-size:9px;font-weight:700;padding:1px 7px;border-radius:8px;}\n  .st.ing{background:#fef9ec;color:#92400e;}\n  .st.done{background:#dcfce7;color:#166534;}\n  .st.wait{background:#e0f2fe;color:#075985;}\n  .actrow{display:flex;gap:8px;flex-wrap:wrap;}\n  .action{flex:1;min-width:120px;border:1px solid var(--line);border-radius:8px;padding:9px 11px;background:#fff;}\n  .action .at{font-size:11px;font-weight:700;color:#334155;}\n  .action .ad{font-size:9.5px;color:#94a3b8;margin-top:3px;}\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\n\u003cheader class=\"header\">\n  \u003cdiv class=\"crumb\">\u003cspan>대시보드\u003c/span>\u003c/div>\n  \u003ch1 class=\"title\">대시보드\u003c/h1>\n  \u003cspan class=\"sid\">DASH-01\u003c/span>\n  \u003cspan class=\"defense\">거래현황 · 계정·보안 · 활동로그\u003c/span>\n\u003c/header>\n\n\u003cdiv class=\"main\">\n  \u003cdiv class=\"screen-panel\">\n    \u003cdiv style=\"position:relative;display:flex;\">\n      \u003cdiv class=\"labels\" id=\"labels\">\n        \u003cdiv class=\"lbl\">\u003cspan class=\"lbl-text\">전역·\u003cbr>상단 메뉴\u003c/span>\u003c/div>\n        \u003cdiv class=\"lbl\">\u003cspan class=\"lbl-text\">내 거래\u003cbr>현황\u003c/span>\u003c/div>\n        \u003cdiv class=\"lbl\">\u003cspan class=\"lbl-text\">지갑 잔고\u003c/span>\u003c/div>\n        \u003cdiv class=\"lbl\">\u003cspan class=\"lbl-text\">계정·보안\u003c/span>\u003c/div>\n        \u003cdiv class=\"lbl\">\u003cspan class=\"lbl-text\">활동 로그\u003c/span>\u003c/div>\n      \u003c/div>\n      \u003csvg id=\"bracketSvg\" width=\"24\" style=\"flex-shrink:0;overflow:visible;\">\u003c/svg>\n    \u003c/div>\n\n    \u003cdiv class=\"frame\" id=\"frame\">\n      \u003c!-- 전역: 상단 고정 메뉴(GNB) -->\n      \u003cdiv class=\"zone\" data-idx=\"4\">\n        \u003cdiv class=\"zone-highlight\">\u003c/div>\n        \u003cdiv class=\"item-area\" data-highlight=\"4\" style=\"position:relative;\">\n          \u003cdiv class=\"pin\" data-idx=\"4\" style=\"top:-4px;right:-4px;\">5\u003c/div>\n          \u003cdiv class=\"c-top\" style=\"border-radius:8px 8px 0 0;\">\n            \u003cspan class=\"brand\" style=\"cursor:pointer;\">DSRV Desk\u003c/span>\n            \u003cspan class=\"meta\">\u003cspan class=\"c-badge\">A자산운용\u003c/span>\u003c/span>\n          \u003c/div>\n          \u003cdiv class=\"c-adminbar\" style=\"margin:0;\">\n            \u003cspan class=\"m on\" style=\"background:#dbeafe;color:#1d4ed8;\">대시보드\u003c/span>\n            \u003cspan class=\"m\">교환하기\u003c/span>\n            \u003cspan class=\"m\">교환게시판\u003c/span>\n          \u003c/div>\n        \u003c/div>\n      \u003c/div>\n\n      \u003c!-- 내 거래 현황 -->\n      \u003cdiv class=\"zone\" data-idx=\"0\">\n        \u003cdiv class=\"zone-highlight\">\u003c/div>\n        \u003cdiv class=\"item-area\" data-highlight=\"0\" style=\"position:relative;padding:6px;border-radius:8px;\">\n          \u003cdiv class=\"pin\" data-idx=\"0\" style=\"top:-4px;right:-4px;\">1\u003c/div>\n          \u003cdiv class=\"zone-title\">내 거래 현황\u003c/div>\n          \u003cdiv class=\"kpi\">\n            \u003cdiv class=\"card\">\u003cdiv class=\"n\">2\u003c/div>\u003cdiv class=\"t\">진행중\u003c/div>\u003c/div>\n            \u003cdiv class=\"card\">\u003cdiv class=\"n\">1\u003c/div>\u003cdiv class=\"t\">승인 대기\u003c/div>\u003c/div>\n            \u003cdiv class=\"card\">\u003cdiv class=\"n\">24\u003c/div>\u003cdiv class=\"t\">완료(전체)\u003c/div>\u003c/div>\n          \u003c/div>\n          \u003cdiv style=\"font-size:10px;font-weight:700;color:#64748b;margin:8px 0 4px;\">전체 거래 목록 (시간순)\u003c/div>\n          \u003ctable class=\"tbl\">\n            \u003cthead>\u003ctr>\u003cth>구분\u003c/th>\u003cth>수량\u003c/th>\u003cth>교환코인\u003c/th>\u003cth>비율\u003c/th>\u003cth>상태\u003c/th>\u003c/tr>\u003c/thead>\n            \u003ctbody>\n              \u003ctr>\u003ctd>나목 교환\u003c/td>\u003ctd>300,000\u003c/td>\u003ctd>USDT→USDC\u003c/td>\u003ctd>1.0000 USDC/USDT\u003c/td>\u003ctd>\u003cspan class=\"st ing\">진행중\u003c/span>\u003c/td>\u003c/tr>\n              \u003ctr>\u003ctd>마목 중개\u003c/td>\u003ctd>500,000\u003c/td>\u003ctd>USDT→USDC\u003c/td>\u003ctd>0.9980 USDC/USDT\u003c/td>\u003ctd>\u003cspan class=\"st wait\">승인 대기\u003c/span>\u003c/td>\u003c/tr>\n              \u003ctr>\u003ctd>나목 교환\u003c/td>\u003ctd>120,000\u003c/td>\u003ctd>USDC→USDT\u003c/td>\u003ctd>0.9989 USDT/USDC\u003c/td>\u003ctd>\u003cspan class=\"st lass=\"nav-tag\">화면 이동 · 인터랙션\u003c/span>\n          \u003cdiv class=\"nav-row\">\u003cspan class=\"nav-el\">계정·보안 '비밀번호 수정' 카드\u003c/span>\u003cspan class=\"nav-act\">클릭\u003c/span>\u003cspan class=\"nav-to\">\u003cstrong>비밀번호 수정(DASH-02)\u003c/strong>\u003c/span>\u003c/div>\n          \u003cdiv class=\"nav-row\">\u003cspan class=\"nav-el\">계정·보안 '2차 인증 재설정' 카드\u003c/span>\u003cspan class=\"nav-act\">클릭\u003c/span>\u003cspan class=\"nav-to\">\u003cstrong>2차 인증 재설정(DASH-03)\u003c/strong>\u003c/span>\u003c/div>\n        \u003c/div>\n      \u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"itm\" data-idx=\"3\">\n      \u003cdiv class=\"num\">4\u003c/div>\n      \u003cdiv>\n        \u003cdiv class=\"itm-title\">활동 로그\u003cspan class=\"req\">필수\u003c/span>\u003c/div>\n        \u003cdiv class=\"itm-desc\">· 활동 로그(로그인·거래·설정변경 이력)는 화면 내 조회 표 없이 \u003cstrong>CSV 다운로드로만 제공\u003c/strong>\u003cbr>· 위변조 방지·보존(거래 15년/AML 5년)\u003cbr>\u003cspan class=\"basis\">근거 L6 §9 · ISMS 감사로그\u003c/span>\u003c/div>\n        \u003cdiv class=\"itm-nav\">\u003cspan class=\"nav-tag\">화면 이동 · 인터랙션\u003c/span>\n          \u003cdiv class=\"nav-row\">\u003cspan class=\"nav-el\">[활동 로그 다운로드 (CSV)]\u003c/span>\u003cspan class=\"nav-act\">클릭 — 파일 다운로드 · 다운로드 행위 감사기록\u003c/span>\u003cspan class=\"nav-to stay\">화면 이동 없음\u003c/span>\u003c/div>\n        \u003c/div>\n      \u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"itm\" data-idx=\"4\">\n      \u003cdiv class=\"num\">5\u003c/div>\n      \u003cdiv>\n        \u003cdiv class=\"itm-title\">상단 고정 메뉴(GNB)\u003cspan class=\"req\">필수\u003c/span>\u003c/div>\n        \u003cdiv class=\"itm-desc\">· 대시보드 / 교환하기(나목 EXC-01) / 교환게시판(마목 BRK-01) — 상단 고정, 전 화면 공통\u003cbr>· \u003cstrong>'DSRV Desk' 로고 클릭 → 대시보드(DASH-01) 이동\u003c/strong>\u003cbr>· \u003cstrong>[뒤로가기 전역 규칙]\u003c/strong> 브라우저 뒤로가기는 전 화면 미지원 — \"접근할 수 없는 화면입니다\" 안내 후 대시보드로 이동, 화면 이동은 GNB·화면 내 버튼으로만\u003cbr>\u003cspan class=\"basis\">근거 IA 1Depth 네비게이션\u003c/span>\u003c/div>\n        \u003cdiv class=\"itm-nav\">\u003cspan class=\"nav-tag\">화면 이동 · 인터랙션\u003c/span>\n          \u003cdiv class=\"nav-row\">\u003cspan class=\"nav-el\">GNB '교환하기'\u003c/span>\u003cspan class=\"nav-act\">클릭\u003c/span>\u003cspan class=\"nav-to\">\u003cstrong>교환하기(EXC-01)\u003c/strong>\u003c/span>\u003c/div>\n          \u003cdiv class=\"nav-row\">\u003cspan class=\"nav-el\">GNB '교환게시판'\u003c/span>\u003cspan class=\"nav-act\">클릭\u003c/span>\u003cspan class=\"nav-to\">\u003cstrong>교환 게시판(BRK-01)\u003c/strong>\u003c/span>\u003c/div>\n          \u003cdiv class=\"nav-row\">\u003cspan class=\"nav-el\">GNB '대시보드' · 'DSRV Desk' 로고\u003c/span>\u003cspan class=\"nav-act\">클릭 — 전 화면 공통\u003c/span>\u003cspan class=\"nav-to\">\u003cstrong>대시보드(DASH-01)\u003c/strong> (현재 화면)\u003c/span>\u003c/div>\n        \u003c/div>\n      \u003c/div>\n    \u003c/div>\n  \u003c/div>\n\n\u003c/div>\n\n\u003csection class=\"footer-note\" style=\"padding-bottom:0;\">\n  \u003cdiv class=\"note-card\">\n    \u003cdiv class=\"note-title\">상세내용\u003c/div>\n    \u003cdiv class=\"detail-grid\" id=\"detailCol\">\n      \u003cdiv class=\"dtl\" data-idx=\"0\">\n        \u003cdiv class=\"detail-label\">\u003cspan class=\"dtl-num\">1\u003c/span>통합 거래 뷰\u003c/div>\n      \u003cdiv class=\"dtl-body\">\u003cspan class=\"box\">· 나목(DSRV 상대 교환)과 마목(당사자 중개)을 한 화면에서 상태별로 요약\u003cbr>· 승인 대기 = 나목: DSRV 거래 진행중(약 2영업일) / 마목: 상대방 수락·DSRV 확인 대기\u003c/span>\u003c/div>\n      \u003c/div>\n      \u003cdiv class=\"dtl\" data-idx=\"1\">\n        \u003cdiv class=\"detail-label\">\u003cspan class=\"dtl-num\">2\u003c/span>조회 전용 · 집행 분리\u003c/div>\n      \u003cdiv class=\"dtl-body\">\u003cspan class=\"box\">· 출금/이전 집행은 어드민 홈(ADM-02) 처리함 승인 + 콜드 2인 멀티시그(커스터디 운영절차)\u003cbr>· 원장 분리·풀 구조 상세는 거래구조 문서 참조\u003cbr>· 입금 예외 귀속: 오입금(B3)·컨펌 중(B4)·스팸(B5)은 잔고 미반영·안내, KYT 고위험(B1)·제재 적중(B2)은 격리·동결·STR — 판정·처리는 ADM-02 처리함, 고객 화면에는 상태만 노출 · 오입금 반환 가스비 부담 주체 \u003cspan class=\"red\">[확인필요]\u003c/span>\u003c/span>\u003c/div>\n      \u003c/div>\n      \u003cdiv class=\"dtl\" data-idx=\"2\">\n        \u003cdiv class=\"detail-label\">\u003cspan class=\"dtl-num\">3\u003c/span>2FA 재설정 흐름\u003c/div>\n      \u003cdiv class=\"dtl-body\">\u003cspan class=\"box\">· 재설정 흐름·백업코드 취급 상세는 DASH-03 참조\u003cbr>· 백업코드 로그인 직후에는 홈 상단에 재설정 권고 배너 노출\u003c/span>\u003c/div>\n      \u003c/div>\n      \u003cdiv class=\"dtl\" data-idx=\"3\">\n        \u003cdiv class=\"detail-label\">\u003cspan class=\"dtl-num\">4\u003c/span>활동 로그 성격\u003c/div>\n      \u003cdiv class=\"dtl-body\">\u003cspan class=\"box\">· 원본 로그는 서버 보관 — 화면 노출 최소화\u003cbr>· 관리자 알람·워닝(ADM-02)과 별개 — 이용자 관점 이력\u003c/span>\u003c/div>\n      \u003c/div>\n    \u003c/div>\n  \u003c/div>\n\u003c/section>\n\n\u003csection class=\"footer-note\">\n  \u003cdiv class=\"note-card\">\n    \u003cdiv class=\"note-title\">비고\u003c/div>\n    \u003cdiv class=\"note-body\">\n      · 로그인 성공 후 \u003cstrong>첫 페이지\u003c/strong>. 상단 고정 메뉴(GNB) + 내 거래 현황 + 지갑 잔고·주소 + 계정·보안 + 활동 로그(CSV).\u003cbr>\n      · 지갑 별도 화면 없음(구 WAL-01~03 삭제) — 잔고·주소는 이 화면, 출금/이전은 커스터디 서면 요청 절차, 화이트리스트는 내부 관리.\u003cbr>\n      · ISMS 2.10.4(중요정보 변경 시 재인증)는 현재 비밀번호 확인으로 충족한다고 보되 심사 시 해석 \u003cspan style=\"color:#991b1b;\">[확인필요]\u003c/span>.\u003cbr>\n      · 이전: 로그인(AUTH-01) · 다음: 교환하기(EXC-01) / 교환게시판(BRK-01)\n    \u003c/div>\n  \u003c/div>\n\u003c/section>\n\n\u003cscript src=\"screen.js\">\u003c/script>\n\u003c/body>\n\u003c/html>\n", "dash-02.html": "\u003c!DOCTYPE html>\n\u003chtml lang=\"ko\">\n\u003chead>\n\u003cmeta charset=\"UTF-8\">\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n\u003ctitle>화면기획 — 비밀번호 수정\u003c/title>\n\u003clink rel=\"stylesheet\" href=\"screen.css\">\n\u003c/head>\n\u003cbody>\n\n\u003cheader class=\"header\">\n  \u003cdiv class=\"crumb\">\u003cspan>홈\u003c/span>\u003cspan class=\"s\">›\u003c/span>\u003cspan>계정·보안\u003c/span>\u003cspan class=\"s\">›\u003c/span>\u003cspan>비밀번호 수정\u003c/span>\u003c/div>\n  \u003ch1 class=\"title\">비밀번호 수정\u003c/h1>\n  \u003cspan class=\"sid\">DASH-02\u003c/span>\n  \u003cspan class=\"defense\">현재 비밀번호 확인 · 비밀번호 규칙\u003c/span>\n\u003c/header>\n\n\u003cdiv class=\"main\">\n  \u003cdiv class=\"screen-panel\">\n    \u003cdiv style=\"position:relative;display:flex;\">\n      \u003cdiv class=\"labels\" id=\"labels\">\n        \u003cdiv class=\"lbl\">\u003cspan class=\"lbl-text\">전역 상단\u003c/span>\u003c/div>\n        \u003cdiv class=\"lbl\">\u003cspan class=\"lbl-text\">비밀번호\u003cbr>변경\u003c/span>\u003c/div>\n      \u003c/div>\n      \u003csvg id=\"bracketSvg\" width=\"24\" style=\"flex-shrink:0;overflow:visible;\">\u003c/svg>\n    \u003c/div>\n\n    \u003cdiv class=\"frame\" id=\"frame\">\n      \u003c!-- 전역: 로그인 후 계정·보안 진입 -->\n      \u003cdiv class=\"zone\" data-idx=\"\">\n        \u003cdiv class=\"zone-highlight\">\u003c/div>\n        \u003cdiv class=\"c-top\" style=\"border-radius:8px;\">\n          \u003cspan class=\"brand\">DSRV Desk\u003c/span>\n          \u003cspan class=\"meta\">\u003cspan class=\"c-badge\">A자산운용\u003c/span>\u003c/span>\n        \u003c/div>\n      \u003c/div>\n\n      \u003c!-- 비밀번호 변경 -->\n      \u003cdiv class=\"zone\" data-idx=\"0\">\n        \u003cdiv class=\"zone-highlight\">\u003c/div>\n        \u003cdiv class=\"item-area\" data-highlight=\"0\" style=\"position:relative;padding:8px;border-radius:8px;\">\n          \u003cdiv class=\"pin\" data-idx=\"0\" style=\"top:-4px;right:-4px;\">1\u003c/div>\n          \u003cdiv style=\"font-size:11px;color:#94a3b8;font-weight:600;margin-bottom:6px;\">비밀번호 변경\u003c/div>\n          \u003cdiv class=\"field\" style=\"margin-bottom:8px;\">\u003cspan class=\"ph\">현재 비밀번호\u003c/span>\u003c/div>\n          \u003cdiv class=\"field\" style=\"margin-bottom:8px;\">\u003cspan class=\"ph\">새 비밀번호\u003c/span>\u003c/div>\n          \u003cdiv class=\"field\">\u003cspan class=\"ph\">새 비밀번호 확인\u003c/span>\u003c/div>\n          \u003cdiv class=\"pw-guide\" style=\"margin-top:8px;line-height:1.75;font-size:11px;color:#475569;background:#fbfbf9;border:1px solid var(--line);border-radius:8px;padding:10px 12px;\">\n            \u003cstrong style=\"color:#1a1a1a;\">안전한 비밀번호를 위해 아래를 지켜주세요.\u003c/strong>\u003cbr>\n            ① 영문 대·소문자, 숫자, 특수문자 중 3종 이상 조합 8자 이상\u003cbr>\n            ② 이메일과 동일한 문자 사용 불가\u003cbr>\n            ③ 동일 문자 4번 이상 사용 불가\u003cbr>\n            ④ 특수문자는 !@#$%^&amp;*() 만 사용 가능\u003cbr>\n            \u003cspan style=\"color:#94a3b8;\">※ 주기적 변경은 권고 사항이며, 유출이 의심되면 즉시 변경하세요\u003c/span>\n          \u003c/div>\n          \u003cdiv class=\"btn primary\" style=\"margin-top:10px;\">비밀번호 변경 저장\u003c/div>\n        \u003c/div>\n      \u003c/div>\n\n    \u003c/div>\n  \u003c/div>\n\n  \u003csvg id=\"connSvg\" style=\"position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:10;overflow:visible;\">\u003c/svg>\n\n  \u003cdiv class=\"items\" id=\"items\">\n    \u003cdiv class=\"nav-global\">\n      \u003cdiv class=\"nav-global-title\">진입 · 전역 이동\u003c/div>\n      \u003cdiv class=\"nav-row\">\u003cspan class=\"nav-el\">상단 GNB(전 화면 공통)\u003c/span>\u003cspan class=\"nav-act\">대시보드/교환하기/교환게시판 메뉴 · 로고 클릭 — 목업에는 상단 요약만 표시\u003c/span>\u003cspan class=\"nav-to\">\u003cstrong>DASH-01 / EXC-01 / BRK-01\u003c/strong> (규칙: DASH-01 항목 5)\u003c/span>\u003c/div>\n      \u003cdiv class=\"nav-note\">· \u003cstrong>진입\u003c/strong>: 대시보드(DASH-01) 계정·보안 → '비밀번호 수정' 카드 클릭\u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"itm\" data-idx=\"0\">\n      \u003cdiv class=\"num\">1\u003c/div>\n      \u003cdiv>\n        \u003cdiv class=\"itm-title\">비밀번호 변경 입력·규칙 안내\u003cspan class=\"req\">필수\u003c/span>\u003c/div>\n        \u003cdiv class=\"itm-desc\">· \u003cstrong>MFA 재인증 없음\u003c/strong> — 본인 확인은 \u003cstrong>현재 비밀번호 확인\u003c/strong>으로 수행, 새 비밀번호는 본인이 직접 입력\u003cbr>· 안내문구 4개 항목 + 주기 변경 권고(※) 노출 · 규칙 위반 시 저장 불가\u003cbr>\u003cspan class=\"basis\">근거: 정보보호 관리체계(ISMS) 인증기준 2.5.4(비밀번호 관리)\u003c/span>\u003c/div>\n        \u003cdiv class=\"itm-nav\">\u003cspan class=\"nav-tag\">화면 이동 · 인터랙션\u003c/span>\n          \u003cdiv class=\"nav-row\">\u003cspan class=\"nav-el\">현재 · 새 비밀번호 입력\u003c/span>\u003cspan class=\"nav-act\">규칙(4항목) 검증 — 위반 시 저장 불가\u003c/span>\u003cspan class=\"nav-to stay\">화면 내 (이동 없음)\u003c/span>\u003c/div>\n          \u003cdiv class=\"nav-row\">\u003cspan class=\"nav-el\">[비밀번호 변경 저장] 버튼\u003c/span>\u003cspan class=\"nav-act\">클릭 — 현재 비밀번호 일치 확인 후 변경 · 타 기기 세션 전체 로그아웃·감사기록(백엔드)\u003c/span>\u003cspan class=\"nav-to\">저장 완료 → \u003cstrong>대시보드(DASH-01)\u003c/strong> 복귀 (별도 완료 화면 없음 — 기획 가정)\u003c/span>\u003c/div>\n        \u003c/div>\n      \u003c/div>\n    \u003c/div>\n  \u003c/div>\n\n\u003c/div>\n\n\u003csection class=\"footer-note\" style=\"padding-bottom:0;\">\n  \u003cdiv class=\"note-card\">\n    \u003cdiv class=\"note-title\">상세내용\u003c/div>\n    \u003cdiv class=\"detail-grid\" id=\"detailCol\">\n      \u003cdiv class=\"dtl\" data-idx=\"0\">\n        \u003cdiv class=\"detail-label\">\u003cspan class=\"dtl-num\">1\u003c/span>진입 경로 · 안내문구 정합\u003c/div>\n      \u003cdiv class=\"dtl-body\">\u003cspan class=\"box\">· 홈(DASH-01) → 계정·보안 → '비밀번호 수정'에서 진입 — 입력 → 저장의 최소 화면\u003cbr>· 화면 안내문구는 최초 설정(ONB-01)과 동일 문구 재사용 + 수정 화면에는 '주기 변경 권고(※)' 한 줄 추가\u003cbr>· 규칙 판정(조합·길이·이메일 동일 문자·동일 문자 반복·허용 특수문자)은 AUTH-01 정책과 동일\u003c/span>\u003c/div>\n      \u003c/div>\n    \u003c/div>\n  \u003c/div>\n\u003c/section>\n\n\u003csection class=\"footer-note\">\n  \u003cdiv class=\"note-card\">\n    \u003cdiv class=\"note-title\">비고\u003c/div>\n    \u003cdiv class=\"note-body\">\n      · 홈(DASH-01) 계정·보안의 '비밀번호 수정' 진입 화면 — \u003cstrong>현재 비밀번호 확인 → 변경\u003c/strong>의 최소 화면.\u003cbr>\n      · \u003cstrong>[백엔드 통제]\u003c/strong> '변경 후 처리'는 화면 표시 없이 시스템 동작 — 변경 시 타 기기 세션 전체 로그아웃 · 변경 이력 감사기록 · 단방향 해시+salt 저장(원문 미보관). 근거: 정보보호 관리체계(ISMS) 인증기준 2.5.4·2.9.4.\u003cbr>\n      · \u003cspan style=\"color:#991b1b;\">[확인필요]\u003c/span> ISMS 2.10.4(중요정보 변경 시 재인증)의 현재 비밀번호 확인 충족 해석 · 강제 변경주기 도입 여부.\u003cbr>\n      · 이전: 대시보드(DASH-01) · 관련: 2차 인증 재설정(DASH-03) · 규칙 전문: 로그인(AUTH-01) 비고\n    \u003c/div>\n  \u003c/div>\n\u003c/section>\n\n\u003cscript src=\"screen.js\">\u003c/script>\n\u003c/body>\n\u003c/html>\n", "dash-03.html": "\u003c!DOCTYPE html>\n\u003chtml lang=\"ko\">\n\u003chead>\n\u003cmeta charset=\"UTF-8\">\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n\u003ctitle>화면기획 — 2차 인증 재설정\u003c/title>\n\u003clink rel=\"stylesheet\" href=\"screen.css\">\n\u003c/head>\n\u003cbody>\n\n\u003cheader class=\"header\">\n  \u003cdiv class=\"crumb\">\u003cspan>홈\u003c/span>\u003cspan class=\"s\">›\u003c/span>\u003cspan>계정·보안\u003c/span>\u003cspan class=\"s\">›\u003c/span>\u003cspan>2차 인증 재설정\u003c/span>\u003c/div>\n  \u003ch1 class=\"title\">2차 인증 재설정\u003c/h1>\n  \u003cspan class=\"sid\">DASH-03\u003c/span>\n  \u003cspan class=\"defense\">2FA 재설정 · 백업코드 재발급\u003c/span>\n\u003c/header>\n\n\u003cdiv class=\"main\">\n  \u003cdiv class=\"screen-panel\">\n    \u003cdiv style=\"position:relative;display:flex;\">\n      \u003cdiv class=\"labels\" id=\"labels\">\n        \u003cdiv class=\"lbl\">\u003cspan class=\"lbl-text\">전역 상단\u003c/span>\u003c/div>\n        \u003cdiv class=\"lbl\">\u003cspan class=\"lbl-text\">2차 인증\u003cbr>재설정\u003c/span>\u003c/div>\n      \u003c/div>\n      \u003csvg id=\"bracketSvg\" width=\"24\" style=\"flex-shrink:0;overflow:visible;\">\u003c/svg>\n    \u003c/div>\n\n    \u003cdiv class=\"frame\" id=\"frame\">\n      \u003c!-- 전역: 로그인 후 계정·보안 진입 -->\n      \u003cdiv class=\"zone\" data-idx=\"\">\n        \u003cdiv class=\"zone-highlight\">\u003c/div>\n        \u003cdiv class=\"c-top\" style=\"border-radius:8px;\">\n          \u003cspan class=\"brand\">DSRV Desk\u003c/span>\n          \u003cspan class=\"meta\">\u003cspan class=\"c-badge\">A자산운용\u003c/span>\u003c/span>\n        \u003c/div>\n      \u003c/div>\n\n      \u003c!-- 2차 인증 재설정 -->\n      \u003cdiv class=\"zone\" data-idx=\"0\">\n        \u003cdiv class=\"zone-highlight\">\u003c/div>\n        \u003cdiv class=\"item-area\" data-highlight=\"0\" style=\"position:relative;padding:8px;border-radius:8px;\">\n          \u003cdiv class=\"pin\" data-idx=\"0\" style=\"top:-4px;right:-4px;\">1\u003c/div>\n          \u003cdiv style=\"font-size:11px;color:#94a3b8;font-weight:600;margin-bottom:6px;\">2차 인증 재설정\u003c/div>\n          \u003cdiv style=\"font-size:11px;color:#475569;line-height:1.7;background:#fbfbf9;border:1px solid var(--line);border-radius:8px;padding:10px 12px;\">\n            인증 앱을 새 기기로 옮기거나 백업코드를 다시 받으려면 재설정하세요.\u003cbr>\n            본인 이메일로 재설정 링크가 발송되며, 링크에서 \u003cstrong style=\"color:#1a1a1a;\">비밀번호 재설정과 2차 인증 재등록\u003c/strong>을 진행합니다.\u003cbr>\n            \u003cspan style=\"color:#94a3b8;\">※ 재등록이 끝나면 새 백업코드가 발급되고 이전 코드는 모두 폐기됩니다\u003c/span>\n          \u003c/div>\n          \u003cdiv class=\"btn\" style=\"margin-top:10px;\">재설정 이메일 발송\u003c/div>\n        \u003c/div>\n      \u003c/div>\n\n    \u003c/div>\n  \u003c/div>\n\n  \u003csvg id=\"connSvg\" style=\"position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:10;overflow:visible;\">\u003c/svg>\n\n  \u003cdiv class=\"items\" id=\"items\">\n    \u003cdiv class=\"nav-global\">\n      \u003cdiv class=\"nav-global-title\">진입 · 전역 이동\u003c/div>\n      \u003cdiv class=\"nav-row\">\u003cspan class=\"nav-el\">상단 GNB(전 화면 공통)\u003c/span>\u003cspan class=\"nav-act\">대시보드/교환하기/교환게시판 메뉴 · 로고 클릭 — 목업에는 상단 요약만 표시\u003c/span>\u003cspan class=\"nav-to\">\u003cstrong>DASH-01 / EXC-01 / BRK-01\u003c/strong> (규칙: DASH-01 항목 5)\u003c/span>\u003c/div>\n      \u003cdiv class=\"nav-note\">· \u003cstrong>진입\u003c/strong>: 대시보드(DASH-01) 계정·보안 → '2차 인증 재설정' 카드 클릭 · 기기 분실로 로그인 불가 시에는 백업코드 로그인(AUTH-01) 후 이 화면 진입\u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"itm\" data-idx=\"0\">\n      \u003cdiv class=\"num\">1\u003c/div>\n      \u003cdiv>\n        \u003cdiv class=\"itm-title\">2차 인증 재설정\u003cspan class=\"req\">필수\u003c/span>\u003c/div>\n        \u003cdiv class=\"itm-desc\">· 버튼 클릭 → 본인 이메일로 재설정 링크 발송(초대 재발송 ONB-00 재사용 — 신규 화면 없음)\u003cbr>· 링크에서 \u003cstrong>비밀번호 재설정 + 2차 인증 재등록\u003c/strong>(ONB-01 절차 재수행)\u003cbr>· 완료 시 새 백업코드 발급·이전 코드 전량 폐기 · 기존 세션 전체 로그아웃\u003cbr>· \u003cstrong>2FA 재인증 입력 없음\u003c/strong> — 기기 분실 상태에서 진입하는 화면이므로 코드 입력을 요구하지 않고, 본인 확인은 본인 이메일 링크 수신으로 갈음\u003cbr>\u003cspan class=\"basis\">근거: 인증수단 재등록 · 정보보호 관리체계(ISMS) 인증기준 2.5(인증)\u003c/span>\u003c/div>\n        \u003cdiv class=\"itm-nav\">\u003cspan class=\"nav-tag\">화면 이동 · 인터랙션\u003c/span>\n          \u003cdiv class=\"nav-row\">\u003cspan class=\"nav-el\">[재설정 이메일 발송] 버튼\u003c/span>\u003cspan class=\"nav-act\">클릭 — 본인 이메일로 재설정 링크 발송(ONB-00 재사용) · 발송 이력 감사기록\u003c/span>\u003cspan class=\"nav-to stay\">화면 이동 없음 — 발송 완료 안내 표시 · 이후 흐름: 이메일 링크 → \u003cstrong>ONB-01 재수행\u003c/strong>(비밀번호 재설정 + 2FA 재등록) → 완료 시 새 백업코드 발급·기존 세션 전체 로그아웃 → \u003cstrong>AUTH-01\u003c/strong> 재로그인\u003c/span>\u003c/div>\n        \u003c/div>\n      \u003c/div>\n    \u003c/div>\n  \u003c/div>\n\n\u003c/div>\n\n\u003csection class=\"footer-note\" style=\"padding-bottom:0;\">\n  \u003cdiv class=\"note-card\">\n    \u003cdiv class=\"note-title\">상세내용\u003c/div>\n    \u003cdiv class=\"detail-grid\" id=\"detailCol\">\n      \u003cdiv class=\"dtl\" data-idx=\"0\">\n        \u003cdiv class=\"detail-label\">\u003cspan class=\"dtl-num\">1\u003c/span>진입 경로 · 재설정 흐름\u003c/div>\n      \u003cdiv class=\"dtl-body\">\u003cspan class=\"box\">· 대시보드(DASH-01) → 계정·보안 → '2차 인증 재설정'에서 진입 · 화면은 이 단락 하나(안내문 + 발송 버튼) · 비밀번호 수정은 별도 화면(DASH-02)\u003cbr>· 발송 → 이메일 링크(ONB-00 방식) → 활성화·재등록(ONB-01) → 새 백업코드 발급\u003cbr>· 기기 분실로 로그인 자체가 안 되면: 백업코드 로그인(AUTH-01) 후 이 화면에서 재설정\u003cbr>· 백업코드까지 분실·소진 시 DSRV 관리자 본인확인 후 초대 재발송(운영 처리)\u003cbr>· 발송·재등록·폐기 이력은 감사로그 기록\u003c/span>\u003c/div>\n      \u003c/div>\n    \u003c/div>\n  \u003c/div>\n\u003c/section>\n\n\u003csection class=\"footer-note\">\n  \u003cdiv class=\"note-card\">\n    \u003cdiv class=\"note-title\">비고\u003c/div>\n    \u003cdiv class=\"note-body\">\n      · 대시보드(DASH-01) 계정·보안의 '2차 인증 재설정' 진입 화면 — 안내문 + 발송 버튼만 있는 최소 화면.\u003cbr>\n      · \u003cstrong>[백엔드 통제]\u003c/strong> 발송·재등록·폐기 이력은 화면 표시 없이 감사기록으로 보존 — 근거: 정보보호 관리체계(ISMS) 인증기준 2.9.4.\u003cbr>\n      · 이전: 대시보드(DASH-01) · 관련: 비밀번호 수정(DASH-02) · 재등록 절차: 계정 활성화(ONB-01)\n    \u003c/div>\n  \u003c/div>\n\u003c/section>\n\n\u003cscript src=\"screen.js\">\u003c/script>\n\u003c/body>\n\u003c/html>\n", "exc-01.html": "\u003c!DOCTYPE html>\n\u003chtml lang=\"ko\">\n\u003chead>\n\u003cmeta charset=\"UTF-8\">\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n\u003ctitle>화면기획 — 교환하기\u003c/title>\n\u003clink rel=\"stylesheet\" href=\"screen.css\">\n\u003c/head>\n\u003cbody>\n\n\u003cheader class=\"header\">\n  \u003cdiv class=\"crumb\">\u003cspan>나목 교환\u003c/span>\u003cspan class=\"s\">›\u003c/span>\u003cspan>교환하기\u003c/span>\u003c/div>\n  \u003ch1 class=\"title\">교환하기\u003c/h1>\n  \u003cspan class=\"sid\">EXC-01\u003c/span>\n  \u003cspan class=\"defense\">방어: 자동체결 거래소·MM 아님\u003c/span>\n\u003c/header>\n\n\u003cdiv class=\"main\">\n  \u003cdiv class=\"screen-panel\">\n    \u003cdiv style=\"position:relative;display:flex;\">\n      \u003cdiv class=\"labels\" id=\"labels\">\n        \u003cdiv class=\"lbl\">\u003cspan class=\"lbl-text\">전역\u003cbr>상단·배너\u003c/span>\u003c/div>\n        \u003cdiv class=\"lbl\">\u003cspan class=\"lbl-text\">타이틀\u003c/span>\u003c/div>\n        \u003cdiv class=\"lbl\">\u003cspan class=\"lbl-text\">교환 입력\u003c/span>\u003c/div>\n        \u003cdiv class=\"lbl\">\u003cspan class=\"lbl-text\">성격 고지\u003c/span>\u003c/div>\n        \u003cdiv class=\"lbl\">\u003cspan class=\"lbl-text\">액션\u003c/span>\u003c/div>\n      \u003c/div>\n      \u003csvg id=\"bracketSvg\" width=\"24\" style=\"flex-shrink:0;overflow:visible;\">\u003c/svg>\n    \u003c/div>\n\n    \u003cdiv class=\"frame\" id=\"frame\">\n      \u003c!-- 전역: 콘솔 상단 + KYC 배너(조건부) -->\n      \u003cdiv class=\"zone\" data-idx=\"6\">\n        \u003cdiv class=\"zone-highlight\">\u003c/div>\n        \u003cdiv class=\"c-top\" style=\"border-radius:8px 8px 0 0;\">\n          \u003cspan class=\"brand\" sty
