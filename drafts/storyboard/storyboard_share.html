 범위 안일 것(상세 2). 문자·자릿수는 키 입력마다, ①②는 포커스 아웃 시 클라이언트가 본다. [변경 저장] 클릭 시 서버가 ②를 다시 본다.\u003cbr>\u003cstrong>실패 처리\u003c/strong> ① 위반 → 빨간 테두리 + ⚠ \"값을 입력해 주세요\". ② 위반 → ⚠ \"0.1~10.0 사이 값을 입력해 주세요\". 어느 쪽이든 [변경 저장] 비활성.\u003cbr>\u003cstrong>연동\u003c/strong> 저장한 뒤 게시 시점 기준가 대비 이탈이 이 값을 넘으면 게시를 자동으로 '중지'하고 대기 신청을 전부 종결하며 양측에 이메일을 보낸다. 재개는 재게시로만 한다. 판정에 쓰는 시세는 항목 8의 소스다.\u003cbr>\u003cspan class=\"chk\">[확인필요]\u003c/span> 이 값이 BRK-02 게시자 설정값의 기본값인지 고정값인지.\u003cbr>\u003cspan class=\"basis\">근거 09 §0 price guard(외부지표 = 이탈 감지 가드 · 가격 결정 아님) · 마목 게시 상태 '중지'(2026-09-02)\u003c/span>\u003c/div>\n        \u003cdiv class=\"itm-nav\">\u003cspan class=\"nav-tag\">화면 이동 · 인터랙션\u003c/span>\n          \u003cdiv class=\"nav-row\">\u003cspan class=\"nav-el\">price guard 임계 필드 — 정상 입력\u003c/span>\u003cspan class=\"nav-act\">포커스 아웃\u003c/span>\u003cspan class=\"nav-to stay\">경고 제거 · 셀 dirty ● · [변경 저장] 활성 조건 재검사\u003c/span>\u003c/div>\n          \u003cdiv class=\"nav-row\">\u003cspan class=\"nav-el\">price guard 임계 필드 — 규칙 ① 위반(빈칸)\u003c/span>\u003cspan class=\"nav-act\">포커스 아웃\u003c/span>\u003cspan class=\"nav-to stay\">⚠ \"값을 입력해 주세요\" · [변경 저장] 비활성\u003c/span>\u003c/div>\n          \u003cdiv class=\"nav-row\">\u003cspan class=\"nav-el\">price guard 임계 필드 — 규칙 ② 위반(범위)\u003c/span>\u003cspan class=\"nav-act\">포커스 아웃\u003c/span>\u003cspan class=\"nav-to stay\">⚠ \"0.1~10.0 사이 값을 입력해 주세요\" · [변경 저장] 비활성\u003c/span>\u003c/div>\n        \u003c/div>\n      \u003c/div>\n    \u003c/div>\n\n    \u003cdiv class=\"itm\" data-idx=\"6\">\n      \u003cdiv class=\"num\">7\u003c/div>\n      \u003cdiv>\n        \u003cdiv class=\"itm-title\">건별 한도 입력 (원 상당)\u003cspan class=\"req\">필수\u003c/span>\u003c/div>\n        \u003cdiv class=\"itm-desc\">\u003cstrong>입력 가능\u003c/strong> 항상 가능하다. 단위는 \u003cstrong>원 상당\u003c/strong>이고 현재 값은 \u003cstrong>1,500,000\u003c/strong>이다(2026-09-02(9) 원화 기준 · 나목·마목 공통 1회 한도).\u003cbr>\u003cstrong>허용 문자\u003c/strong> 정수만 받고 최대 10자리다. 천 단위 쉼표는 입력하는 동안 자동으로 넣는다.\u003cbr>\u003cstrong>검증\u003c/strong> ① 빈칸이 아닐 것 ② 10,000~1,000,000,000 범위 안일 것(상세 2). 문자는 키 입력마다, ①②는 포커스 아웃 시 클라이언트가 본다. 입력하는 동안 천 단위 쉼표를 자동으로 넣는다. [변경 저장] 클릭 시 서버가 ②를 다시 본다.\u003cbr>\u003cstrong>실패 처리\u003c/strong> ① 위반 → 빨간 테두리 + ⚠ \"값을 입력해 주세요\". ② 위반 → ⚠ \"10,000~1,000,000,000 사이 정수를 입력해 주세요\". 어느 쪽이든 [변경 저장] 비활성.\u003cbr>\u003cstrong>연동\u003c/strong> 저장한 뒤 신규 요청부터 EXC-01 수량 한도 검증과 \"1회 최대 {정책값 1,500,000원 상당}\" 표기, BRK-02 게시 게이트, BRK-03 신청자 검증에 쓴다. 환산은 항목 8 시세 소스의 \u003cstrong>KRW 시세\u003c/strong>로 요청 시점에 한다(ETH·USDC·USDT 모두 KRW 시세로 환산한다).\u003cbr>\u003cspan class=\"chk\">[확인필요]\u003c/span> 일간·월간 누적 한도 파라미터는 두지 않았다.\u003cbr>\u003cspan class=\"basis\">근거 09 §0 건별 한도(2026-09-02) · notation 한도 표기\u003c/span>\u003c/div>\n        \u003cdiv class=\"itm-nav\">\u003cspan class=\"nav-tag\">화면 이동 · 인터랙션\u003c/span>\n          \u003cdiv class=\"nav-row\">\u003cspan class=\"nav-el\">건별 한도 필드 — 정상 입력\u003c/span>\u003cspan class=\"nav-act\">포커스 아웃\u003c/span>\u003cspan class=\"nav-to stay\">경고 제거 · 셀 dirty ● · [변경 저장] 활성 조건 재검사\u003c/span>\u003c/div>\n          \u003cdiv class=\"nav-row\">\u003cspan class=\"nav-el\">건별 한도 필드 — 규칙 ① 위반(빈칸)\u003c/span>\u003cspan class=\"nav-act\">포커스 아웃\u003c/span>\u003cspan class=\"nav-to stay\">⚠ \"값을 입력해 주세요\" · [변경 저장] 비활성\u003c/span>\u003c/div>\n          \u003cdiv class=\"nav-row\">\u003cspan class=\"nav-el\">건별 한도 필드 — 규칙 ② 위반(범위)\u003c/span>\u003cspan class=\"nav-act\">포커스 아웃\u003c/span>\u003cspan class=\"nav-to stay\">⚠ \"10,000~1,000,000,000 사이 정수를 입력해 주세요\" · [변경 저장] 비활성\u003c/span>\u003c/div>\n        \u003c/div>\n      \u003c/div>\n    \u003c/div>\n\n    \u003cdiv class=\"itm\" data-idx=\"7\">\n      \u003cdiv class=\"num\">8\u003c/div>\n      \u003cdiv>\n        \u003cdiv class=\"itm-title\">시세(외부지표) 소스 ▾\u003cspan class=\"req\">필수\u003c/span>\u003c/div>\n        \u003cdiv class=\"itm-desc\">\u003cstrong>노출\u003c/strong> 항상 보인다. 현재 값은 바이낸스이고 목업 예시라 확정값이 아니다.\u003cbr>\u003cstrong>클릭 가능\u003c/strong> 항상 활성이다.\u003cbr>\u003cstrong>옵션\u003c/strong> 업비트 · 빗썸 · 바이낸스 3개다. 하나만 고른다(복수 조합·가중은 없다).\u003cbr>\u003cstrong>확인 사항\u003c/strong> 없다. 확인 다이얼로그를 띄우지 않는다.\u003cbr>\u003cstrong>액션\u003c/strong> 칩을 갱신하고 목록을 닫으며 셀을 ●로 표시한다. 즉시 적용하지 않고 [변경 저장]으로 반영한다. 저장 뒤에는 나목 비율 산정 기준가(EXC-02), 건별 한도 KRW 환산(EXC-01·BRK-02·BRK-03), price guard 이탈 판정에 쓴다. 소스명은 고객 화면에 보이지 않는다. 업비트·빗썸은 KRW 마켓이라 환산에 바로 쓰고, 바이낸스는 USD 마켓이라 USD→KRW 환율을 거친다 — 환율 소스와 갱신 주기는 개발이 정한다(2026-09-02(10) 사용자 결정).\u003cbr>\u003cspan class=\"chk\">[확인필요]\u003c/span> 소스 수신이 끊겼을 때 대체 소스를 쓸지 요청을 차단할지.\u003cbr>\u003cspan class=\"basis\">근거 09 §0 나목 외부지표 참조 스프레드 고정·price guard · 고객 화면 미노출 · notation 드롭다운 규격\u003c/span>\u003c/div>\n        \u003cdiv class=\"itm-nav\">\u003cspan class=\"nav-tag\">화면 이동 · 인터랙션\u003c/span>\n          \u003cdiv class=\"nav-row\">\u003cspan class=\"nav-el\">시세 소스 ▾\u003c/span>\u003cspan class=\"nav-act\">클릭 → 목록 펼침(업비트 / 빗썸 / 바이낸스 · 현재 선택 강조) → 항목 클릭\u003c/span>\u003cspan class=\"nav-to stay\">칩 갱신·목록 닫힘 · 바깥 클릭/ESC = 변경 없이 닫힘 · 셀 dirty ● · 저장 후 신규 요청부터 기준가·환산·판정에 반영\u003c/span>\u003c/div>\n        \u003c/div>\n      \u003c/div>\n    \u003c/div>\n\n    \u003cdiv class=\"itm\" data-idx=\"8\">\n      \u003cdiv class=\"num\">9\u003c/div>\n      \u003cdiv>\n        \u003cdiv class=\"itm-title\">핫월렛 비중 임계 입력\u003cspan class=\"req\">필수\u003c/span>\u003c/div>\n        \u003cdiv class=\"itm-desc\">\u003cstrong>입력 가능\u003c/strong> 항상 가능하다. 단위는 %이고 현재 값은 20이다.\u003cbr>\u003cstrong>허용 문자\u003c/strong> 정수만 받고 최대 2자리다.\u003cbr>\u003cstrong>검증\u003c/strong> ① 빈칸이 아닐 것 ② 0~20 범위 안일 것(콜드 80% 요건의 상한). 문자는 키 입력마다, ①②는 포커스 아웃 시 클라이언트가 본다. [변경 저장] 클릭 시 서버가 ②를 다시 본다.\u003cbr>\u003cstrong>실패 처리\u003c/strong> ① 위반 → 빨간 테두리 + ⚠ \"값을 입력해 주세요\". ② 위반 → ⚠ \"0~20 사이 정수를 입력해 주세요\". 어느 쪽이든 [변경 저장] 비활성.\u003cbr>\u003cstrong>연동\u003c/strong> 저장한 뒤 다음 감시 주기부터, 핫월렛 보유 비중이 이 값을 넘으면 ADM-02 처리함에 월렛·키 알람(T6 스윕 워닝)을 만든다. 현행 운영은 100% 콜드라 실질 0%다.\u003cbr>\u003cspan class=\"chk\">[확인필요]\u003c/span> 콜드 80% 요건의 고시 원문.\u003cbr>\u003cspan class=\"basis\">근거 states T6 · 09 §0 지갑(콜드 100% 수동 운영) · §11 콜드 80%\u003c/span>\u003c/div>\n        \u003cdiv class=\"itm-nav\">\u003cspan class=\"nav-tag\">화면 이동 · 인터랙션\u003c/span>\n          \u003cdiv class=\"nav-row\">\u003cspan class=\"nav-el\">핫월렛 비중 필드 — 정상 입력\u003c/span>\u003cspan class=\"nav-act\">포커스 아웃\u003c/span>\u003cspan class=\"nav-to stay\">경고 제거 · 셀 dirty ● · [변경 저장] 활성 조건 재검사\u003c/span>\u003c/div>\n          \u003cdiv class=\"nav-row\">\u003cspan class=\"nav-el\">핫월렛 비중 필드 — 규칙 ① 위반(빈칸)\u003c/span>\u003cspan class=\"nav-act\">포커스 아웃\u003c/span>\u003cspan class=\"nav-to stay\">⚠ \"값을 입력해 주세요\" · [변경 저장] 비활성\u003c/span>\u003c/div>\n          \u003cdiv class=\"nav-row\">\u003cspan class=\"nav-el\">핫월렛 비중 필드 — 규칙 ② 위반(범위)\u003c/span>\u003cspan class=\"nav-act\">포커스 아웃\u003c/span>\u003cspan class=\"nav-to stay\">⚠ \"0~20 사이 정수를 입력해 주세요\" · [변경 저장] 비활성\u003c/span>\u003c/div>\n        \u003c/div>\n      \u003c/div>\n    \u003c/div>\n\n    \u003cdiv class=\"itm\" data-idx=\"9\">\n      \u003cdiv class=\"num\">10\u003c/div>\n      \u003cdiv>\n        \u003cdiv class=\"itm-title\">[되돌리기] 버튼\u003c/div>\n        \u003cdiv class=\"itm-desc\">\u003cstrong>노출\u003c/strong> 항상 보인다(ghost).\u003cbr>\u003cstrong>클릭 가능\u003c/strong> 바뀐 셀이 1개 이상일 때만 활성이다(오류 상태 셀도 센다).\u003cbr>\u003cstrong>확인 사항\u003c/strong> 없다. 확인 다이얼로그도 서버 호출도 없다.\u003cbr>\u003cstrong>액션\u003c/strong> 항목 2~9 입력값을 마지막 저장값으로 되돌리고 인라인 ⚠와 ● 표시를 지운다. \"저장되지 않은 변경 0건\"이 되고 두 버튼은 비활성으로 돌아간다. 토스트는 띄우지 않는다. 즉시 적용형인 취급자산 상태와 KYC 상태는 되돌리기 대상이 아니다.\u003cbr>\u003cspan class=\"basis\">근거 notation 종료 동선([취소]·되돌리기 = 확인 없음)\u003c/span>\u003c/div>\n        \u003cdiv class=\"itm-nav\">\u003cspan class=\"nav-tag\">화면 이동 · 인터랙션\u003c/span>\n          \u003cdiv class=\"nav-row\">\u003cspan class=\"nav-el\">[되돌리기] — 활성 조건\u003c/span>\u003cspan class=\"nav-act\">dirty 셀 1개 이상(오류 상태 셀 포함)\u003c/span>\u003cspan class=\"nav-to stay\">dirty 0 → 회색 비활성(공통 UI 규격)\u003c/span>\u003c/div>\n          \u003cdiv class=\"nav-row\">\u003cspan class=\"nav-el\">[되돌리기] — 클릭(활성)\u003c/span>\u003cspan class=\"nav-act\">클릭 → 확인 없음\u003c/span>\u003cspan class=\"nav-to stay\">전 필드 마지막 저장값 복원 · 인라인 ⚠ 제거 · dirty 표시 제거 · \"저장되지 않은 변경 0건\" · [되돌리기]·[변경 저장] 비활성 · 토스트 없음\u003c/span>\u003c/div>\n          \u003cdiv class=\"nav-row\">\u003cspan class=\"nav-el\">[되돌리기] — 실패\u003c/span>\u003cspan class=\"nav-act\">해당 없음(서버 호출 없음)\u003c/span>\u003cspan class=\"nav-to stay\">—\u003c/span>\u003c/div>\n        \u003c/div>\n      \u003c/div>\n    \u003c/div>\n\n    \u003cdiv class=\"itm\" data-idx=\"10\">\n      \u003cdiv class=\"num\">11\u003c/div>\n      \u003cdiv>\n        \u003cdiv class=\"itm-title\">[변경 저장] 버튼\u003cspan class=\"req\">필수\u003c/span>\u003c/div>\n        \u003cdiv class=\"itm-desc\">\u003cstrong>노출\u003c/strong> 항상 보인다(primary).\u003cbr>\u003cstrong>클릭 가능\u003c/strong> 바뀐 셀이 1개 이상이고 인라인 오류가 0이며 저장 중이 아닐 때만 활성이다. 비활성 사유는 해당 셀 인라인 ⚠로 이미 보인다.\u003cbr>\u003cstrong>확인 사항\u003c/strong> 확인 다이얼로그를 띄우지 않는다(구속력 없는 설정 저장). 2인 승인도 없다. 클릭하면 서버가 범위·자릿수를 다시 검증하고 정책 버전이 어긋나지 않았는지 본다.\u003cbr>\u003cstrong>액션\u003c/strong> 라벨을 \"저장 중…\"으로 바꾸고 입력 필드를 비활성으로 두어 중복 클릭을 막는다. 항목 2~9 값을 한 번에 저장하고 POLICY_VERSION을 1 올리며 변경자·전후값·시각을 감사로그에 남긴다. 토스트 \"정책값이 저장되었습니다 (v13) — 신규 요청부터 적용\"을 띄우고 상단 \"현재 정책 버전 v{N} · 최종 변경 {일시} · {관리자 ID}\"를 갱신한다. ● 표시를 지우고 두 버튼을 비활성으로 되돌린다. 새 값은 저장 이후 신규 요청·게시·신청부터 쓰고, 진행 중 건은 생성 시점 값을 유지한다. 변경 이력을 보는 화면은 없다 — 감사로그(DB)로만 본다.\u003cbr>\u003cspan class=\"chk\">[확인필요]\u003c/span> 정책 변경 이력 CSV를 추가할지.\u003cbr>\u003cspan class=\"basis\">근거 V2 · 09 §0 line 51 · 정책 변경통제 [스키마 POLICY_VERSION] · notation 확인 다이얼로그 규격\u003c/span>\u003c/div>\n        \u003cdiv class=\"itm-nav\">\u003cspan class=\"nav-tag\">화면 이동 · 인터랙션\u003c/span>\n          \u003cdiv class=\"nav-row\">\u003cspan class=\"nav-el\">[변경 저장] — 활성 조건\u003c/span>\u003cspan class=\"nav-act\">다음이 모두 참: ①dirty 셀 1개 이상 ②인라인 오류 0 ③저장 중 아님\u003c/span>\u003cspan class=\"nav-to stay\">하나라도 미충족 → 회색 비활성(공통 UI 규격) · 사유는 해당 셀 인라인 ⚠으로 이미 노출\u003c/span>\u003c/div>\n          \u003cdiv class=\"nav-row\">\u003cspan class=\"nav-el\">[변경 저장] — 클릭(활성)\u003c/span>\u003cspan class=\"nav-act\">클릭 → 확인 없음 → 라벨 \"저장 중…\"·전 필드 비활성(중복 클릭 차단) → 서버 검증(범위·자릿수 재검증) → 저장\u003c/span>\u003cspan class=\"nav-to stay\">토스트 \"정책값이 저장되었습니다 (v13) — 신규 요청부터 적용\" · 버전 라인 갱신 · dirty 표시 제거 · 두 버튼 비활성 복귀 · 감사로그\u003c/span>\u003c/div>\n          \u003cdiv class=\"nav-row\">\u003cspan class=\"nav-el\">[변경 저장] — 실패\u003c/span>\u003cspan class=\"nav-act\">서버 검증 실패 / 동시 수정 충돌(다른 관리자가 먼저 저장 · 버전 불일치) / 서버 오류\u003c/span>\u003cspan class=\"nav-to stay\">화면 잔류 · 검증 실패 → 해당 셀 인라인 ⚠ · 입력값 유지 / 충돌 → 상단 배너 \"다른 관리자가 먼저 저장했습니다 — 최신 값을 불러왔습니다. 변경 내용을 다시 입력해 주세요\" · 전 필드 최신 저장값으로 리로드·dirty 0 / 오류 → 배너 \"일시적인 오류입니다. 잠시 후 다시 시도해 주세요\" · 입력값 유지 · 라벨 복귀\u003c/span>\u003c/div>\n        \u003c/div>\n      \u003c/div>\n    \u003c/div>\n\n    \u003cdiv class=\"itm\" data-idx=\"11\">\n      \u003cdiv class=\"num\">12\u003c/div>\n      \u003cdiv>\n        \u003cdiv class=\"itm-title\">기관·가입자 목록 (표시 전용)\u003c/div>\n        \u003cdiv class=\"itm-desc\">· 행 클릭 없음 · 열: 기관 · 가입자 · KYC 상태 · 계정 상태 · 조치 — 조치 열은 모든 행 [상태 변경 ▾], 계정 상태 '초대 발송됨' 행에만 [초대 재발송] 추가\u003cbr>· \u003cstrong>KYC 상태 칩\u003c/strong>(기관 · G-3 게이팅 단일 출처): 활성(초록) / 심사중(EDD)(파랑) / 일시제한(노랑 · 부가 사유 \"재이행 미응답\" 등) / 동결(빨강) / 해지(회색) · \u003cstrong>계정 상태 칩\u003c/strong>(가입자): 초대 발송됨(파랑) / 활성(초록) / 잠금(노랑) / 해지(회색) — 계정 상태는 시스템·홈 처리함이 전이(ONB-01~03 활성화 · AUTH-01 잠금 · ADM-02 T8 해제), 이 화면에서 직접 변경 없음\u003cbr>· 가입자 열 표시값(이름 vs 이메일 마스킹) \u003cspan class=\"chk\">[확인필요]\u003c/span> · 기관당 가입자 1명 — 고객사 기안·승인 2인 분리 없음\u003cbr>· \u003cstrong>목록 규격\u003c/strong>: 최신 등록순 단일 리스트 · 검색·필터·정렬 없음(전체 조회는 ADM-02 CSV ①) · 빈 상태 \"등록된 기관이 없습니다\" + \"아래 초대 발송으로 첫 기관을 초대하세요\" · 로딩 \"불러오는 중…\" · 전량 표시 · 페이지 스크롤([더 보기]·페이지네이션·무한 스크롤 없음) · 갱신: 초대 발송·상태 변경·ADM-02 처리(잠금 해제·신규 거래 제한) 즉시\u003cbr>\u003cspan class=\"basis\">근거 F-12 관리자 콘솔 ORG·KYC 통합 · 예외 A1·A2·A6 · notation 상태 칩·목록 규격\u003c/span>\u003c/div>\n        \u003cdiv class=\"itm-nav\">\u003cspan class=\"nav-tag\">화면 이동 · 인터랙션\u003c/span>\n          \u003cdiv class=\"nav-row\">\u003cspan class=\"nav-el\">기관 행(조치 버튼 제외)\u003c/span>\u003cspan class=\"nav-act\">클릭\u003c/span>\u003cspan class=\"nav-to stay\">무반응(표시 전용 — 기관 상세 화면 없음)\u003c/span>\u003c/div>\n        \u003c/div>\n      \u003c/div>\n    \u003c/div>\n\n    \u003cdiv class=\"itm\" data-idx=\"12\">\n      \u003cdiv class=\"num\">13\u003c/div>\n      \u003cdiv>\n        \u003cdiv class=\"itm-title\">[초대 재발송] 버튼\u003c/div>\n        \u003cdiv class=\"itm-desc\">\u003cstrong>노출\u003c/strong> 계정 상태가 '초대 발송됨'인 행에만 보인다(링크 만료 72h · 미수신 · 분실). 활성 계정 행에는 보이지 않는다.\u003cbr>\u003cstrong>클릭 가능\u003c/strong> 발송 중이 아니면 활성이다.\u003cbr>\u003cstrong>확인 사항\u003c/strong> 없다. 확인 다이얼로그를 띄우지 않는다.\u003cbr>\u003cstrong>액션\u003c/strong> 라벨을 \"발송 중…\"으로 바꿔 중복 클릭을 막고, 기존 링크를 즉시 무효로 만든 뒤 72시간·1회 유효한 새 링크로 초대 이메일(ONB-00)을 다시 보낸다. 토스트 \"초대 이메일을 다시 발송했습니다 — 72시간 유효\"를 띄우고 감사로그에 남긴다. 화면 이동은 없다.\u003cbr>\u003cspan class=\"chk\">[확인필요]\u003c/span> 재발송 횟수 제한 · 백업코드를 다 쓴 경우 가입자 자체 재설정(DASH-03)과 재초대 중 어느 경로인지.\u003cbr>\u003cspan class=\"basis\">근거 ONB-00 초대(72h·1회) · ISMS 2.5\u003c/span>\u003c/div>\n        \u003cdiv class=\"itm-nav\">\u003cspan class=\"nav-tag\">화면 이동 · 인터랙션\u003c/span>\n          \u003cdiv class=\"nav-row\">\u003cspan class=\"nav-el\">[초대 재발송] — 활성 조건\u003c/span>\u003cspan class=\"nav-act\">계정 상태 '초대 발송됨' · 발송 중 아님\u003c/span>\u003cspan class=\"nav-to stay\">그 외 → 버튼 미노출(활성 계정) 또는 회색 비활성(발송 중)\u003c/span>\u003c/div>\n          \u003cdiv class=\"nav-row\">\u003cspan class=\"nav-el\">[초대 재발송] — 클릭(활성)\u003c/span>\u003cspan class=\"nav-act\">클릭 → 확인 없음 → 라벨 \"발송 중…\"·중복 클릭 차단\u003c/span>\u003cspan class=\"nav-to stay\">토스트 \"초대 이메일을 다시 발송했습니다 — 72시간 유효\" · 기존 링크 무효 · 라벨 복귀 · 감사로그 · 이동 없음(\u003cstrong>초대 이메일(ONB-00)\u003c/strong> 재발송)\u003c/span>\u003c/div>\n          \u003cdiv class=\"nav-row\">\u003cspan class=\"nav-el\">[초대 재발송] — 실패\u003c/span>\u003cspan class=\"nav-act\">이메일 발송 실패 / 서버 오류\u003c/span>\u003cspan class=\"nav-to stay\">화면 잔류 · 상단 배너 \"일시적인 오류입니다. 잠시 후 다시 시도해 주세요\" · 기존 링크 유지 · 라벨 복귀\u003c/span>\u003c/div>\n        \u003c/div>\n      \u003c/div>\n    \u003c/div>\n\n    \u003cdiv class=\"itm\" data-idx=\"13\">\n      \u003cdiv class=\"num\">14\u003c/div>\n      \u003cdiv>\n        \u003cdiv class=\"itm-title\">[상태 변경 ▾] — 기관 KYC 상태\u003cspan class=\"req\">필수\u003c/span>\u003c/div>\n        \u003cdiv class=\"itm-desc\">\u003cstrong>노출\u003c/strong> 목록의 모든 행에 보인다(대표 핀 = A행).\u003cbr>\u003cstrong>클릭 가능\u003c/strong> 현재 KYC 상태가 '해지'가 아니고 다른 관리자가 그 기관을 바꾸는 중이 아닐 때 활성이다. 해지 행은 비활성이고 인라인 \"해지된 기관입니다\"를 둔다.\u003cbr>\u003cstrong>옵션\u003c/strong> 현재 상태에서 허용된 전이만 보여준다 — 심사중(EDD) → 활성·해지 / 활성 → 일시제한·동결·해지 / 일시제한 → 활성·동결·해지 / 동결 → 일시제한·해지 / 해지 → 없음.\u003cbr>\u003cstrong>확인 사항\u003c/strong> 모든 전이에 확인 다이얼로그를 띄우고 사유를 필수로 받는다(10~500자). 본문은 상태마다 다르다 — 활성 \"고객 화면 안내 배너가 제거되고 거래가 재개됩니다.\" · 일시제한 \"신규 교환 요청·게시·신청이 즉시 차단되고 고객 화면에 안내 배너가 표시됩니다. 진행 중 건은 유지됩니다.\" · 동결 \"모든 거래·출금이 차단됩니다. 홈 처리함에 STR 검토 건이 생성됩니다.\" · 해지 \"진행 중 거래 완결·전량 출금 확인 후 계정이 비활성화됩니다. 되돌릴 수 없습니다.\" 해지는 진행 중 거래와 잔고가 없어야 통과한다.\u003cbr>\u003cstrong>액션\u003c/strong> [변경 저장]과 무관하게 즉시 적용한다. 칩을 갱신하고 토스트 \"{기관} KYC 상태를 {상태}로 변경했습니다\"를 띄우며 사유를 감사로그에 남긴다. 이 값이 전 화면 게이팅 G-3의 단일 출처라 고객의 다음 요청·진입부터 EXC-01·BRK-02·BRK-03 KYC 배너에 반영된다. '해지'는 가입자 계정 상태도 '해지'로 연동한다(상세 14). 심사 자체는 별도 AML 시스템에서 하고 이 화면은 결과만 반영한다.\u003cbr>\u003cspan class=\"chk\">[확인필요]\u003c/span> 동결에서 활성으로 바로 돌아갈 수 있는지 · 동결 시 ADM-02 처리함에 'STR 검토' 행을 만들지.\u003cbr>\u003cspan class=\"basis\">근거 L1 §5의2 고객확인 재이행 · 예외 A1·A4·A6 · G-3 · notation 드롭다운·확인 다이얼로그(ADM-03 상태 변경)\u003c/span>\u003c/div>\n        \u003cdiv class=\"itm-nav\">\u003cspan class=\"nav-tag\">화면 이동 · 인터랙션\u003c/span>\n          \u003cdiv class=\"nav-row\">\u003cspan class=\"nav-el\">[상태 변경 ▾] — 활성 조건\u003c/span>\u003cspan class=\"nav-act\">현재 KYC 상태가 '해지' 아님 · 다른 관리자가 이 기관 변경 중 아님\u003c/span>\u003cspan class=\"nav-to stay\">해당 없음 → 회색 비활성 · 해지 행은 인라인 \"해지된 기관입니다\"\u003c/span>\u003c/div>\n          \u003cdiv class=\"nav-row\">\u003cspan class=\"nav-el\">[상태 변경 ▾] — 클릭(활성)\u003c/span>\u003cspan class=\"nav-act\">클릭 → 목록 펼침(허용 전이만 · 예 A자산운용: 일시제한 / 동결 / 해지) → 항목 클릭 → 다이얼로그: 제목 \"KYC 상태 변경 — {기관} {현재} → {선택}\" / 본문(상태별): 활성 \"고객 화면 안내 배너가 제거되고 거래가 재개됩니다.\" · 일시제한 \"신규 교환 요청·게시·신청이 즉시 차단되고 고객 화면에 안내 배너가 표시됩니다. 진행 중 건은 유지됩니다.\" · 동결 \"모든 거래·출금이 차단됩니다. 홈 처리함에 STR 검토 건이 생성됩니다.\" · 해지 \"진행 중 거래 완결·전량 출금 확인 후 계정이 비활성화됩니다. 되돌릴 수 없습니다.\" / 사유 입력(필수 · 10~500자) / [변경] [돌아가기] · 바깥 클릭/ESC = 변경 없이 닫힘 → [변경] → \"처리 중…\"\u003c/span>\u003cspan class=\"nav-to stay\">칩 갱신 + 토스트 \"{기관} KYC 상태를 {상태}로 변경했습니다\" · 감사로그(사유) · G-3 게이팅 반영 · 동결 시 ADM-02 처리함 'STR 검토' 행 생성 \u003cspan class=\"chk\">[확인필요]\u003c/span>\u003c/span>\u003c/div>\n          \u003cdiv class=\"nav-row\">\u003cspan class=\"nav-el\">[상태 변경 ▾] — 실패\u003c/span>\u003cspan class=\"nav-act\">해지 전제 미충족(진행 중 거래·잔고 있음) / 경쟁 상태 / 서버 오류\u003c/span>\u003cspan class=\"nav-to stay\">화면 잔류 · 해지 전제 → 다이얼로그 내 인라인 ⚠ \"진행 중 거래 또는 잔고가 있어 해지할 수 없습니다 — 완결·출금 후 다시 시도해 주세요\" · [변경] 비활성 / 경쟁·서버 오류 → 상단 배너 \"일시적인 오류입니다. 잠시 후 다시 시도해 주세요\" 1종 · 최신 값을 다시 불러와 칩에 반영한다\u003c/span>\u003c/div>\n        \u003c/div>\n      \u003c/div>\n    \u003c/div>\n\n    \u003cdiv class=\"itm\" data-idx=\"14\">\n      \u003cdiv class=\"num\">15\u003c/div>\n      \u003cdiv>\n        \u003cdiv class=\"itm-title\">기관명 입력\u003cspan class=\"req\">필수\u003c/span>\u003c/div>\n        \u003cdiv class=\"itm-desc\">\u003cstrong>입력 가능\u003c/strong> 항상 가능하다. 선택 목록이 아니라 자유 입력이다(신규 기관 등록). 플레이스홀더는 \"기관명\"이다.\u003cbr>\u003cstrong>허용 문자\u003c/strong> 한글·영문·숫자·공백·괄호·마침표만 받고 2~50자다. 초과 입력은 무시하고 앞뒤 공백은 자동으로 지운다.\u003cbr>\u003cstrong>검증\u003c/strong> ① 허용 문자로 2~50자일 것 ② 이미 등록된 기관명이 아닐 것. ①은 포커스 아웃 시 클라이언트가, ②는 [초대 발송] 클릭 시 서버가 본다.\u003cbr>\u003cstrong>실패 처리\u003c/strong> ① 위반 → 빨간 테두리 + ⚠ \"기관명은 2~50자 한글·영문·숫자로 입력해 주세요\". ② 위반 → ⚠ \"이미 등록된 기관입니다 — 기존 계정 해지 후에만 새 가입자를 초대할 수 있습니다\". 어느 쪽이든 [초대 발송] 비활성. 다시 입력하면 기존 경고를 지운다.\u003cbr>\u003cstrong>연동\u003c/strong> 값이 정상이면 [초대 발송] 활성 조건을 다시 본다.\u003cbr>\u003cstrong>저장\u003c/strong> ORG.name으로 저장한다. 고객사 ID(ORG-NNNN)는 발송 시 자동으로 채번한다.\u003cbr>\u003cspan class=\"basis\">근거 notation 식별자(ORG-NNNN) · 1기관 1가입자(09 §0 승인·통제)\u003c/span>\u003c/div>\n        \u003cdiv class=\"itm-nav\">\u003cspan class=\"nav-tag\">화면 이동 · 인터랙션\u003c/span>\n          \u003cdiv class=\"nav-row\">\u003cspan class=\"nav-el\">기관명 필드 — 정상 입력\u003c/span>\u003cspan class=\"nav-act\">포커스 아웃\u003c/span>\u003cspan class=\"nav-to stay\">경고 제거 · [초대 발송] 활성 조건 재검사\u003c/span>\u003c/div>\n          \u003cdiv class=\"nav-row\">\u003cspan class=\"nav-el\">기관명 필드 — 규칙 ① 위반(문자·길이)\u003c/span>\u003cspan class=\"nav-act\">포커스 아웃\u003c/span>\u003cspan class=\"nav-to stay\">⚠ \"기관명은 2~50자 한글·영문·숫자로 입력해 주세요\" · [초대 발송] 비활성\u003c/span>\u003c/div>\n          \u003cdiv class=\"nav-row\">\u003cspan class=\"nav-el\">기관명 필드 — 규칙 ② 위반(중복)\u003c/span>\u003cspan class=\"nav-act\">[초대 발송] 클릭 시 서버 검증\u003c/span>\u003cspan class=\"nav-to stay\">⚠ \"이미 등록된 기관입니다 — 기존 계정 해지 후에만 새 가입자를 초대할 수 있습니다\" · 입력값 유지\u003c/span>\u003c/div>\n        \u003c/div>\n      \u003c/div>\n    \u003c/div>\n\n    \u003cdiv class=\"itm\" data-idx=\"15\">\n      \u003cdiv class=\"num\">16\u003c/div>\n      \u003cdiv>\n        \u003cdiv class=\"itm-title\">가입자 이메일 입력\u003cspan class=\"req\">필수\u003c/span>\u003c/div>\n        \u003cdiv class=\"itm-desc\">\u003cstrong>입력 가능\u003c/strong> 항상 가능하다. 플레이스홀더는 \"가입자 이메일\"이다.\u003cbr>\u003cstrong>허용 문자\u003c/strong> 로컬@도메인.TLD 형식으로 최대 254자다. 대문자는 소문자로 자동 정규화하고 공백은 지운다.\u003cbr>\u003cstrong>검증\u003c/strong> ① 이메일 형식일 것 ② 이미 초대·가입된 이메일이 아닐 것. ①은 포커스 아웃 시 클라이언트가, ②는 [초대 발송] 클릭 시 서버가 본다.\u003cbr>\u003cstrong>실패 처리\u003c/strong> ① 위반 → 빨간 테두리 + ⚠ \"이메일 형식이 올바르지 않습니다\". ② 위반 → ⚠ \"이미 초대·가입된 이메일입니다\". 어느 쪽이든 [초대 발송] 비활성. 다시 입력하면 기존 경고를 지운다.\u003cbr>\u003cstrong>연동\u003c/strong> 값이 정상이면 [초대 발송] 활성 조건을 다시 본다.\u003cbr>\u003cstrong>저장\u003c/strong> USER.email로 저장한다. CSV와 화면 표시는 마스킹한다.\u003cbr>\u003cspan class=\"chk\">[확인필요]\u003c/span> 개인 이메일 도메인을 허용할지(법인 도메인 제한).\u003cbr>\u003cspan class=\"basis\">근거 ONB-00 본인 이메일 초대(셀프가입 없음) · ISMS 2.5\u003c/span>\u003c/div>\n        \u003cdiv class=\"itm-nav\">\u003cspan class=\"nav-tag\">화면 이동 · 인터랙션\u003c/span>\n          \u003cdiv class=\"nav-row\">\u003cspan class=\"nav-el\">이메일 필드 — 정상 입력\u003c/span>\u003cspan class=\"nav-act\">포커스 아웃\u003c/span>\u003cspan class=\"nav-to stay\">경고 제거 · [초대 발송] 활성 조건 재검사\u003c/span>\u003c/div>\n          \u003cdiv class=\"nav-row\">\u003cspan class=\"nav-el\">이메일 필드 — 규칙 ① 위반(형식)\u003c/span>\u003cspan class=\"nav-act\">포커스 아웃\u003c/span>\u003cspan class=\"nav-to stay\">⚠ \"이메일 형식이 올바르지 않습니다\" · [초대 발송] 비활성\u003c/span>\u003c/div>\n          \u003cdiv class=\"nav-row\">\u003cspan class=\"nav-el\">이메일 필드 — 규칙 ② 위반(중복)\u003c/span>\u003cspan class=\"nav-act\">[초대 발송] 클릭 시 서버 검증\u003c/span>\u003cspan class=\"nav-to stay\">⚠ \"이미 초대·가입된 이메일입니다\" · 입력값 유지\u003c/span>\u003c/div>\n        \u003c/div>\n      \u003c/div>\n    \u003c/div>\n\n    \u003cdiv class=\"itm\" data-idx=\"16\">\n      \u003cdiv class=\"num\">17\u003c/div>\n      \u003cdiv>\n        \u003cdiv class=\"itm-title\">[초대 발송] 버튼\u003cspan class=\"req\">필수\u003c/span>\u003c/div>\n        \u003cdiv class=\"itm-desc\">\u003cstrong>노출\u003c/strong> 항상 보인다(primary).\u003cbr>\u003cstrong>클릭 가능\u003c/strong> 기관명과 이메일이 모두 정상이고 인라인 오류가 0이며 발송 중이 아닐 때만 활성이다. 목업은 빈칸이라 비활성이다.\u003cbr>\u003cstrong>확인 사항\u003c/strong> 확인 다이얼로그를 띄우지 않는다. 클릭하면 서버가 기관명·이메일 중복을 검증한다.\u003cbr>\u003cstrong>액션\u003c/strong> 라벨을 \"발송 중…\"으로 바꾸고 필드를 비활성으로 두어 중복 클릭을 막는다. ORG를 만들고(ORG-NNNN 채번) USER를 만든 뒤(계정 상태 '초대 발송됨') 초대 이메일(ONB-00)을 72시간·1회 유효로 보낸다. 생성과 발송은 원자적으로 처리하고 발송이 실패하면 생성을 되돌린다. 목록 최상단에 행을 추가하고 폼을 비우며 토스트 \"초대 이메일을 발송했습니다 — {이메일 마스킹} · 72시간 유효\"를 띄운다. 화면 이동은 없다. 이후 가입자는 ONB-01~03에서 계정을 활성화하고 AUTH-01로 들어온다. KYC 상태 초기값은 '심사중(EDD)'로 만들고 활성 전환은 [상태 변경 ▾]로 한다. 기관당 1계정이라 기존 가입자가 있으면 해지 후에만 초대할 수 있다.\u003cbr>\u003cspan class=\"chk\">[확인필요]\u003c/span> KYC 초기값 — CDD를 오프라인에서 마쳤다는 전제라면 '활성'이어야 한다.\u003cbr>\u003cspan class=\"basis\">근거 ONB-00 · ISMS 2.5(계정·인증 관리) · 09 §0 고객(CDD 완료 법인)\u003c/span>\u003c/div>\n        \u003cdiv class=\"itm-nav\">\u003cspan class=\"nav-tag\">화면 이동 · 인터랙션\u003c/span>\n          \u003cdiv class=\"nav-row\">\u003cspan class=\"nav-el\">[초대 발송] — 활성 조건\u003c/span>\u003cspan class=\"nav-act\">다음이 모두 참: ①기관명 정상 ②이메일 정상 ③인라인 오류 0 ④발송 중 아님\u003c/span>\u003cspan class=\"nav-to stay\">하나라도 미충족 → 회색 비활성(공통 UI 규격) · 사유는 필드 인라인 ⚠\u003c/span>\u003c/div>\n          \u003cdiv class=\"nav-row\">\u003cspan class=\"nav-el\">[초대 발송] — 클릭(활성)\u003c/span>\u003cspan class=\"nav-act\">클릭 → 확인 없음 → 라벨 \"발송 중…\"·필드 비활성 → 서버 중복 검증 → ORG·USER 생성 → 이메일 발송(원자적 — 발송 실패 시 생성 롤백)\u003c/span>\u003cspan class=\"nav-to stay\">목록 최상단 행 추가(KYC '심사중(EDD)' · 계정 '초대 발송됨' · [초대 재발송] 노출) · 폼 초기화 · 토스트 \"초대 이메일을 발송했습니다 — {이메일 마스킹} · 72시간 유효\" · 감사로그 · 이동 없음\u003c/span>\u003c/div>\n          \u003cdiv class=\"nav-row\">\u003cspan class=\"nav-el\">[초대 발송] — 실패\u003c/span>\u003cspan class=\"nav-act\">기관명·이메일 중복 / 발송 실패 / 서버 오류\u003c/span>\u003cspan class=\"nav-to stay\">화면 잔류 · 중복 → 해당 필드 인라인 ⚠ ④ · 입력값 유지 / 발송 실패·오류 → 상단 배너 \"일시적인 오류입니다. 잠시 후 다시 시도해 주세요\" · ORG·USER 미생성 · 입력값 유지 · 라벨 복귀\u003c/span>\u003c/div>\n        \u003c/div>\n      \u003c/div>\n    \u003c/div>\n\n    \u003cdiv class=\"itm\" data-idx=\"17\">\n      \u003cdiv class=\"num\">18\u003c/div>\n      \u003cdiv>\n        \u003cdiv class=\"itm-title\">상태 전이·재이행 요약 (표시 전용)\u003c/div>\n        \u003cdiv class=\"itm-desc\">· 클릭 요소 없음 · 기관 KYC 상태 기계(심사중(EDD) → 활성 ⇄ 일시제한 → 동결 → 해지) · 가입자 계정 상태(초대 발송됨 → 활성 ⇄ 잠금 → 해지) · 재이행 주기(고1년·중2년·저3년 + 실소유자·지배구조 변경 등 이벤트 트리거 → 재심사 중 거래 제한, 예외 A4) · 해지 흐름(상세 18)\u003cbr>· 고정 문구 · 값은 이 화면의 수정 가능 파라미터가 아니라 규칙 요약\u003cbr>\u003cspan class=\"basis\">근거 L1 §5의2 · L6 §9 기록 보존 · 예외 A4·A5\u003c/span>\u003c/div>\n      \u003c/div>\n    \u003c/div>\n  \u003c/div>\n\n\u003c/div>\n\n\u003csection class=\"footer-note\" style=\"padding-bottom:0;\">\n  \u003cdiv class=\"note-card\">\n    \u003cdiv class=\"note-title\">상세내용\u003c/div>\n    \u003cdiv class=\"detail-grid\" id=\"detailCol\">\n      \u003cdiv class=\"dtl\" data-idx=\"0\">\n        \u003cdiv class=\"detail-label\">\u003cspan class=\"dtl-num\">1\u003c/span>자산 중지 파급 범위\u003c/div>\n      \u003cdiv class=\"dtl-body\">\u003cspan class=\"box\">· 중지 자산 포함 페어: EXC-01 보내는/받는 자산 ▾ 목록 제외 · BRK-02 자산 칩 목록 제외 · BRK-01 게재중 게시(해당 자산) 표시·신청 가능 여부 \u003cspan class=\"chk\">[확인필요]\u003c/span>\u003cbr>· 진행 중 건(수락된 견적·확정 거래·집행 대기)은 영향 없음 — 집행은 콜드 수동 절차로 계속\u003cbr>· 자산 3종 중 2종 이상 중지 시 페어 0 → 나·마 서비스 전체 정지와 동일 — 별도 '서비스 정지' 플래그 없음(승인 중단 + 사고대응 절차서)\u003c/span>\u003c/div>\n      \u003c/div>\n      \u003cdiv class=\"dtl\" data-idx=\"1\">\n        \u003cdiv class=\"detail-label\">\u003cspan class=\"dtl-num\">2\u003c/span>입력 범위 표 · 단일 출처 원칙\u003c/div>\n      \u003cdiv class=\"dtl-body\">\u003cspan class=\"box\">· \u003cstrong>범위(기획 가정 — 상·하한 전부 \u003cspan class=\"chk\">[확인필요]\u003c/span>)\u003c/strong>: 스프레드 0.01~5.00% 2자리 · 견적 유효시간 30~600 s 정수 · 수수료율 0.00~5.00% 2자리 · 게시 유효기간 1~90일 정수 · 신청 유효기간 1~10영업일 정수 · price guard 0.1~10.0% 1자리 · 건별 한도 10,000~1,000,000,000원 정수 · 핫월렛 비중 0~20% 정수\u003cbr>· 공통 입력 규격: 숫자·소수점만 · 자릿수 초과 입력 무시 · 오류 = 빨간 테두리 + 셀 아래 인라인 ⚠(원인 + 해결 행동) · dirty = ● + 노란 배경\u003cbr>· EXC-01/02·BRK-02/03/04/07은 이 값을 표출만 — 화면 하드코딩 없음, '가격형성 아님' 소명값의 단일 출처\u003cbr>· 수수료 1% = 거래액 기준 고정·양측 각자(2026-09-02 확정) · 건별 한도 1,500,000원 상당(2026-09-02(9) 원화 기준 · 종전 표기(1,000 USD 상당 · 그 이전 원화 억 단위 · 코인 수량) 모두 폐기)\u003cbr>· \u003cspan class=\"chk\">[확인필요]\u003c/span> 1% 요율 합리성·설명의무 소명 수위 · 한도 환산 시세 장애 시 처리\u003c/span>\u003c/div>\n      \u003c/div>\n      \u003cdiv class=\"dtl\" data-idx=\"7\">\n        \u003cdiv class=\"detail-label\">\u003cspan class=\"dtl-num\">8\u003c/span>시세 소스 용도 · KRW 환산 경로\u003c/div>\n      \u003cdiv class=\"dtl-body\">\u003cspan class=\"box\">· 용도 3종: ① 나목 기준가(EXC-02 산정 = 기준가 ± 스프레드) ② 건별 한도 KRW 환산(ETH·USDC·USDT 모두 소스 KRW 시세 · USD 마켓 소스면 환율 경유) ③ price guard 이탈 판정(게시 시점 기준가 vs 현재)\u003cbr>· 소스명은 고객 콘솔 어디에도 미노출 — 고객 화면은 \"외부지표 기준\" 문구만\u003cbr>· 바이낸스(USD 마켓) 선택 시 USD→KRW 환율 소스·갱신 주기는 \u003cstrong>개발 결정\u003c/strong>(기획 미지정 · 2026-09-02(10)) · \u003cspan class=\"chk\">[확인필요]\u003c/span> 소스 장애 시 대체 소스 자동 전환 vs 신규 요청 차단 · 마목은 시세 불관여 원칙 — price guard는 '가드'로만 사용\u003c/span>\u003c/div>\n      \u003c/div>\n      \u003cdiv class=\"dtl\" data-idx=\"10\">\n        \u003cdiv class=\"detail-label\">\u003cspan class=\"dtl-num\">11\u003c/span>저장·버전·적용 시점\u003c/div>\n      \u003cdiv class=\"dtl-body\">\u003cspan class=\"box\">· 저장 1회 = POLICY_VERSION 1건(전후값·변경자·시각) — 진행 중 건은 자기 생성 시점의 버전을 참조(견적·게시·신청 레코드에 version 기록)\u003cbr>· 확인 다이얼로그 없음 = 저장 자체는 구속력 없음(고객 거래는 신규 요청부터) · 즉시 적용형 2종(자산 상태·KYC 상태)만 확인\u003cbr>· 동시 수정 = 낙관적 잠금(버전 불일치 → 리로드) · 2인 승인 없음(DSRV 단일 처리)\u003cbr>· dirty 상태 이탈('홈' 탭·로그아웃) = 파기·확인 없음(공통) — 관리자 화면 예외(이탈 경고) 여부 \u003cspan class=\"chk\">[확인필요]\u003c/span> · 변경 이력 조회 UI 없음 — 이력 CSV 추가 여부 \u003cspan class=\"chk\">[확인필요]\u003c/span>\u003c/span>\u003c/div>\n      \u003c/div>\n      \u003cdiv class=\"dtl\" data-idx=\"13\">\n        \u003cdiv class=\"detail-label\">\u003cspan class=\"dtl-num\">14\u003c/span>KYC 상태 기계 → 게이팅·연동\u003c/div>\n      \u003cdiv class=\"dtl-body\">\u003cspan class=\"box\">· 활성 = 배너 없음·전 기능 / 심사중(EDD)·일시제한·동결 = EXC-01·BRK-02·BRK-03 KYC 예외 배너 + 요청 차단(내부 사유 미노출) / 해지 = 로그인 불가\u003cbr>· 전이 주체: 활성 → 일시제한은 ADM-02 T7 [신규 거래 제한]·T5 [STR 검토] 체크박스에서도 발생 · 동결 전환은 ADM-02 T8(탈취 의심)에서도 · 일시제한 → 활성 복귀는 이 화면에서만(사람)\u003cbr>· 해지 = 기관 KYC '해지' + 가입자 계정 '해지' 연동 · 전제: 진행 중 거래 0·잔고 0(전량 출금) — 미충족 시 다이얼로그 내 차단\u003cbr>· 1기관 1가입자: 고객사 내부 기안↔승인 분리 전제 없음 — 구속력 행위는 고객 화면 결과 고지 1문장으로 대체 · DSRV 측 직무분리(자기승인 차단)는 ADM-02 유지\u003cbr>· \u003cspan class=\"chk\">[확인필요]\u003c/span> 동결 → 활성 직접 복귀 허용 여부 · 동결 시 STR 검토 자동 생성 여부 · 일시제한 중 조회·출금 허용 범위\u003c/span>\u003c/div>\n      \u003c/div>\n      \u003cdiv class=\"dtl\" data-idx=\"16\">\n        \u003cdiv class=\"detail-label\">\u003cspan class=\"dtl-num\">17\u003c/span>온보딩 연결\u003c/div>\n      \u003cdiv class=\"dtl-body\">\u003cspan class=\"box\">· [초대 발송] → 초대 이메일(ONB-00 · 72h·1회 링크 — 이메일 링크 없음 원칙의 유일한 예외) → 계정 활성화(ONB-01~03 · 비밀번호·Google Authenticator·복구 코드) → 로그인(AUTH-01) · 활성화 완료 시 계정 상태 '초대 발송됨' → '활성'(시스템)\u003cbr>· 초대 발송·재발송·상태 변경은 전부 감사로그(ISMS 2.5) · 셀프가입·소셜 로그인 없음\u003cbr>· \u003cspan class=\"chk\">[확인필요]\u003c/span> 초대 시 KYC 초기값(심사중 vs 활성) · 재발송 횟수 제한 · 개인 이메일 도메인 허용\u003c/span>\u003c/div>\n      \u003c/div>\n      \u003cdiv class=\"dtl\" data-idx=\"17\">\n        \u003cdiv class=\"detail-label\">\u003cspan class=\"dtl-num\">18\u003c/span>해지(탈퇴) 흐름 · 기록 보존\u003c/div>\n      \u003cdiv class=\"dtl-body\">\u003cspan class=\"box\">해지 요청 → 진행 중 거래 완결 대기(신규 거래는 요청 즉시 차단) → 자산 전량 출금 확인 → 비활성화(기관·가입자 '해지')\u003cbr>· 해지 후에도 기록은 법정 기간 보존 — 거래 15년·AML 5년(L6 §9 · 예외 A5) · CSV ①에 '해지' 상태로 잔존\u003cbr>· \u003cspan class=\"chk\">[확인필요]\u003c/span> 일시제한 중 조회·출금 허용 범위 · KYC 심사 도구 연동 범위(심사 자체는 별도 AML 시스템 — 이 화면은 상태 전이·계정 조치만)\u003c/span>\u003c/div>\n      \u003c/div>\n    \u003c/div>\n  \u003c/div>\n\u003c/section>\n\n\u003csection class=\"footer-note\">\n  \u003cdiv class=\"note-card\">\n    \u003cdiv class=\"note-title\">비고\u003c/div>\n    \u003cdiv class=\"note-body\">\n      · DSRV 내부 관리자 화면(고객사 노출 없음). 어드민은 홈(ADM-02)·설정(ADM-03) 2화면.\u003cbr>\n      · \u003cstrong>목업 인터랙션(2026-09-02)\u003c/strong>: 어드민 프레임 폭을 다른 화면의 \u003cstrong>1.5배(810px)\u003c/strong>로 넓히고, 드롭다운 3종(취급자산 상태 ▾ · 시세 소스 ▾ · 상태 변경 ▾)을 목업에서 실제로 펼칠 수 있게 함(바깥 클릭·ESC = 변경 없이 닫힘). 확인 다이얼로그가 필요한 선택(중지·일시제한·동결·해지)은 값을 바꾸지 않고 다음 단계를 노란 배지로 표시 — 다이얼로그·사유 모달 자체는 항목 설명 기준. 관리 메뉴 '홈' 클릭 시 ADM-02로 이동.\u003cbr>\n\n      · \u003cstrong>[긴급대응 전용 플래그 없음]\u003c/strong> 모든 집행이 사람의 승인·서명을 거치는 구조 — 승인을 멈추면 집행도 멈춤. 별도 '거래정지·긴급출금중단' 버튼 없이 승인 중단 + 사고대응 절차서로 대응 — 근거: ISMS 2.11.1(사고 대응·복구). 취급자산 '중지'는 자산 단위 신규 요청 차단이며 긴급정지 플래그가 아님.\u003cbr>\n      · \u003cstrong>[화이트리스트 관리 제외]\u003c/strong> 화이트리스트 지연발효는 커스터디 출금(외부 반출) 전용 — 기존 커스터디 정책·시스템 그대로 사용, 이 콘솔에서 중복 관리하지 않음. 나·마 교환·중개(내부 지갑 간 이전)에는 미적용.\u003cbr>\n      · 연결: 초대 발송 → ONB-00 · 정책값 표출 EXC-01/02·BRK-02/03/04/07 · 발생 알람 처리(잠금·재이행 도래·격리 등)는 홈(ADM-02) 처리함 · 기관 KYC 상태 = 전 화면 게이팅(G-3) 단일 출처\u003cbr>\n      · 2026-09-02 설명 형식 개정 적용(핀 = 조작 요소 단위) — 파라미터는 그룹 단위 핀(입력 규격 명시), '페어별' 스프레드 프레임을 3페어 입력 3개로 수정, 취급자산 상태·정책 버전 라인·dirty 표시 추가, 조치 열 '—' 제거([상태 변경 ▾] 전 행), 저장 = 확인 없음 / 자산 중지·KYC 상태 변경 = 확인 다이얼로그로 통일 · 서비스명 DSRV Admin.\u003cbr>\n      · \u003cspan class=\"chk\">[확인필요]\u003c/span> 입력 범위 상·하한 전부 · ETH 페어 스프레드 요율 · 스프레드 갱신주기 파라미터 · 수수료율 변경 절차 · 영업일 캘린더 · price guard 기본값 vs 고정값 · 일간·월간 누적 한도 · 시세 소스 장애 대체 · 콜드 80% 고시 원문 · 이력 CSV · 관리자 이탈 경고 예외 · 가입자 열 표시값 · 백업코드 소진 경로 · 재발송 횟수 제한 · 동결 → 활성 복귀 · 동결 시 STR 자동 생성 · KYC 초기값 · 개인 이메일 도메인 · 게재중 게시 자동 중지(자산 중지 시).\n    \u003c/div>\n  \u003c/div>\n\u003c/section>\n\n\u003cscript src=\"screen.js\">\u003c/script>\n\u003c/body>\n\u003c/html>\n"};
const CSS="/* DSRV 교환·중개 화면기획 — 데스크톱 콘솔 공통 스타일 (Liberti 3컬럼 구조 유지, 목업만 콘솔형) */\n@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap');\n:root{\n  --bg:#f5f5f0; --surface:#fff; --border:#ddd; --text:#1a1a1a; --text-sub:#888;\n  --accent:#2563eb; --console:#0f172a; --line:#e2e8f0;\n  --font:'Noto Sans KR', sans-serif; --mono:'SFMono-Regular',Consolas,monospace;\n  --req:#991b1b; --reqbg:#fef2f2; --reqbd:#fecaca;\n}\n*{margin:0;padding:0;box-sizing:border-box;}\nbody{font-family:var(--font);background:var(--bg);color:var(--text);}\n\n/* 헤더 */\n.header{background:var(--surface);padding:20px 32px;border-bottom:1px solid var(--border);display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;}\n.crumb{font-size:12px;color:#aaa;font-weight:600;}\n.crumb .s{margin:0 6px;}\n.title{font-size:24px;font-weight:800;}\n.sid{font-size:11px;color:var(--accent);background:#e8eefb;padding:3px 8px;border-radius:4px;font-weight:600;font-family:var(--mono);}\n.defense{font-size:11px;color:#92400e;background:#fef9ec;border:1px solid #fde68a;padding:3px 10px;border-radius:4px;font-weight:600;}\n\n/* 3컬럼 레이아웃 */\n.main{display:flex;padding:20px 32px 0;gap:28px;align-items:flex-start;position:relative;}\n.screen-panel{display:flex;gap:0;flex-shrink:0;}\n.labels{display:flex;flex-direction:column;width:64px;flex-shrink:0;}\n.lbl{flex:none;display:flex;align-items:center;justify-content:flex-end;position:relative;}\n.lbl-text{font-size:11px;font-weight:600;color:#888;text-align:right;padding-right:10px;line-height:1.3;}\n\n/* 콘솔 프레임 */\n.frame{width:540px;background:var(--surface);border:1px solid #ccc;border-radius:10px;overflow:visible;flex-shrink:0;position:relative;}\n/* 콘솔 상단바 (전역 G-2/G-4) */\n.c-top{background:var(--console);color:#fff;border-radius:10px 10px 0 0;padding:8px 14px;display:flex;align-items:center;justify-content:space-between;font-size:11px;}\n.c-top .brand{font-weight:700;letter-spacing:.02em;}\n.c-top .meta{display:flex;gap:10px;align-items:center;color:#cbd5e1;}\n.c-badge{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);border-radius:10px;padding:1px 8px;font-size:10px;font-weight:600;}\n.c-badge.ok{background:rgba(34,197,94,.18);border-color:rgba(34,197,94,.4);color:#bbf7d0;}\n/* 콘솔 탭 */\n.c-tabs{display:flex;gap:2px;background:#f1f5f9;padding:6px 10px 0;border-bottom:1px solid var(--line);}\n.c-tab{font-size:12px;font-weight:600;color:#64748b;padding:8px 14px;border-radius:6px 6px 0 0;}\n.c-tab.on{background:#fff;color:var(--accent);border:1px solid var(--line);border-bottom:1px solid #fff;margin-bottom:-1px;}\n/* 전역 배너 (G-3 KYC / G-7 차단통지) */\n.c-banner{font-size:11px;padding:7px 14px;display:flex;align-items:center;gap:8px;line-height:1.4;}\n.c-banner.kyc{background:#ecfdf5;color:#065f46;border-bottom:1px solid #d1fae5;}\n.c-banner.warn{background:#fffbeb;color:#92400e;border-bottom:1px solid #fde68a;}\n/* 콘솔 본문 */\n.c-body{padding:0;}\n.zone{padding:16px 18px;border-bottom:1px dashed #e6e6e6;position:relative;}\n.zone:last-child{border-bottom:none;}\n.zone-highlight{display:none;position:absolute;inset:4px;border:2px solid var(--accent);border-radius:8px;pointer-events:none;z-index:4;}\n.zone.active .zone-highlight{display:block;}\n.zone-title{font-size:13px;font-weight:800;color:#334155;margin-bottom:12px;}\n\n/* 콘솔 위젯 프리미티브 */\n.field{border:1px solid #d7dbe0;border-radius:8px;padding:10px 12px;font-size:12px;color:#475569;background:#fff;display:flex;align-items:center;justify-content:space-between;gap:8px;}\n.field .ph{color:#9aa3ad;}\n.field.sel::after{content:'▾';color:#9aa3ad;font-size:11px;}\n.row{display:flex;gap:8px;align-items:stretch;}\n.chip{font-size:10px;font-weight:700;padding:2px 8px;border-radius:10px;background:#eef2f7;color:#475569;}\n.chip.asset{background:#e8eefb;color:#1d4ed8;font-family:var(--mono);}\n.chip.ok{background:#dcfce7;color:#166534;}\n.chip.info{background:#e0f2fe;color:#075985;}\n.btn{padding:10px 14px;border-radius:8px;font-size:13px;font-weight:700;text-align:center;}\n.btn.primary{background:var(--accent);color:#fff;}\n.btn.ghost{border:1.5px solid #cbd5e1;color:#94a3b8;background:#fff;}\n.btn.danger{border:1.5px solid #fca5a5;color:#dc2626;background:#fff;}\n.btn.disabled{background:#e2e8f0;color:#94a3b8;cursor:not-allowed;pointer-events:none;} /* 공통 UI 규격(notation) — 비활성 버튼 */\n.note-inline{font-size:11px;color:#64748b;line-height:1.6;background:#f7f7f5;border-radius:6px;padding:8px 10px;border-left:3px solid #cbd5e1;}\n.note-inline.reg{border-left-color:#f59e0b;background:#fffdf5;color:#7c5b12;}\n.kv{display:flex;justify-content:space-between;font-size:12px;padding:5px 0;border-bottom:1px solid #f1f1ee;}\n.kv:last-child{border-bottom:none;}\n.kv .k{color:#94a3b8;}\n.kv .v{color:#334155;font-weight:600;font-family:var(--mono);}\n.pooltag{font-size:11px;font-weight:700;color:#166534;background:#dcfce7;border-radius:6px;padding:2px 8px;}\n.pooltag.zero{color:#991b1b;background:#fee2e2;}\n.steps{display:flex;align-items:center;gap:6px;font-size:11px;}\n.step{display:flex;align-items:center;gap:5px;color:#94a3b8;}\n.step .dot{width:16px;height:16px;border-radius:50%;background:#e2e8f0;color:#94a3b8;font-size:9px;font-weight:700;display:flex;align-items:center;justify-content:center;}\n.step.done .dot{background:#22c55e;color:#fff;}\n.step.now .dot{background:var(--accent);color:#fff;}\n.step.now{color:var(--accent);font-weight:700;}\n.arrow{color:#cbd5e1;}\n\n/* 화면 안 번호 마커 */\n.pin{position:absolute;width:22px;height:22px;border-radius:50%;background:#e0e0e0;color:#888;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:5;transition:all .2s;user-select:none;}\n.pin:hover{background:#ccc;}\n.pin.active{background:var(--accent);color:#fff;box-shadow:0 0 0 3px rgba(37,99,235,.2);}\n#connSvg{position:absolute;top:0;left:0;pointer-events:none;z-index:3;overflow:visible;}\n\n/* 가운데: 항목설명 */\n.items{flex:1;min-width:240px;max-width:340px;}\n.itm{display:flex;gap:12px;padding:14px 8px;border-bottom:1px solid #eee;align-items:flex-start;border-radius:6px;transition:background .2s;margin:0 -8px;}\n.itm:last-child{border-bottom:none;}\n.itm.active{background:#e8eefb;}\n.itm>div:nth-child(2){flex:1;min-width:0;}\n.num{width:24px;height:24px;border-radius:50%;background:#e0e0e0;color:#888;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px;transition:all .2s;}\n.itm.active .num{background:var(--accent);color:#fff;}\n.itm-title{font-size:13px;font-weight:700;margin-bottom:3px;}\n.itm-title .req{font-size:9px;font-weight:700;padding:1px 6px;border-radius:10px;margin-left:6px;background:var(--reqbg);color:var(--req);border:1px solid var(--reqbd);vertical-align:middle;}\n.itm-title .opt{font-size:9px;font-weight:700;padding:1px 6px;border-radius:10px;margin-left:6px;background:#f0fdf4;color:#166534;border:1px solid #86efac;vertical-align:middle;}\n.itm-desc{font-size:12px;color:var(--text);line-height:1.55;}\n.itm-desc .basis{font-size:10.5px;color:#888;font-weight:600;}\n\n/* 오른쪽: 상세내용 */\n.detail-col{flex:1;min-width:260px;max-width:420px;}\n.dtl{padding:14px 0 14px 20px;border-bottom:1px solid #eee;border-left:2px solid #e8eefb;min-height:53px;transition:border-left-color .2s,background .2s;}\n.dtl:last-child{border-bottom:none;}\n.dtl.active{border-left-color:var(--accent);background:#f5f8ff;border-radius:0 6px 6px 0;}\n.detail-label{font-size:10px;font-weight:700;color:#b0b0b0;letter-spacing:.07em;text-transform:uppercase;margin-bottom:6px;}\n.dtl-body{font-size:12px;color:var(--text);line-height:1.55;}\n.dtl-body .box{display:block;padding:8px 10px;background:#f7f7f5;border-radius:6px;font-size:11.5px;color:var(--text);line-height:1.7;margin-top:4px;}\n.dtl-body strong{color:#222;}\n.dtl-body .red{color:var(--text);font-weight:700;}\n.dtl-body .grn{color:#16a34a;font-weight:600;}\n\n/* 하단 비고 */\n.footer-note{padding:20px 32px 24px;}\n.note-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:24px 28px;}\n.note-title{font-size:14px;font-weight:700;margin-bottom:12px;padding-left:12px;border-left:3px solid var(--accent);}\n.note-body{font-size:12px;color:var(--text);line-height:1.7;}\n.note-body strong{color:#334155;}\n\n/* ── 관리자(Admin) 공통 ── */\n.c-top.admin{background:#111827;}\n.c-badge.adm{background:rgba(168,85,247,.22);border-color:rgba(168,85,247,.45);color:#e9d5ff;}\n.c-badge.pam{background:rgba(239,68,68,.2);border-color:rgba(239,68,68,.45);color:#fecaca;}\n.c-adminbar{display:flex;gap:2px;background:#f1f5f9;padding:6px 10px;border-bottom:1px solid var(--line);flex-wrap:wrap;}\n.c-adminbar .m{font-size:11px;font-weight:600;color:#64748b;padding:5px 10px;border-radius:6px;}\n.c-adminbar .m.on{background:#ede9fe;color:#6d28d9;}\n.tbl{width:100%;border-collapse:collapse;font-size:11px;}\n.tbl th{background:#f1f5f9;color:#64748b;font-weight:700;text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);font-size:10px;}\n.tbl td{padding:7px 8px;border-bottom:1px solid #f1f1ee;color:#334155;vertical-align:middle;}\n.tbl td.mono,.tbl td .mono{font-family:var(--mono);}\n.sev{display:inline-block;font-size:9px;font-weight:700;padding:1px 7px;border-radius:8px;}\n.sev.hi{background:#fee2e2;color:#991b1b;}\n.sev.mid{background:#fef9ec;color:#92400e;}\n.sev.lo{background:#dcfce7;color:#166534;}\n.kpi{display:flex;gap:8px;flex-wrap:wrap;}\n.kpi .card{flex:1;min-width:88px;background:#f8fafc;border:1px solid var(--line);border-radius:8px;padding:8px 10px;}\n.kpi .card .n{font-size:18px;font-weight:800;color:#0f172a;font-family:var(--mono);}\n.kpi .card .t{font-size:10px;color:#94a3b8;font-weight:600;margin-top:2px;}\n.diff{font-size:11px;font-family:var(--mono);border-radius:6px;overflow:hidden;border:1px solid var(--line);}\n.diff .d{padding:4px 10px;}\n.diff .old{background:#fef2f2;color:#991b1b;}\n.diff .new{background:#f0fdf4;color:#166534;}\n\n/* ── 레이아웃 v2: 항목 컬럼 확장 + 항목 내 화면이동·인터랙션 + 상세내용 하단 카드 ── */\n.items{max-width:640px;min-width:300px;}\n.itm-nav{margin-top:9px;padding-top:7px;border-top:1px dashed #e2e8f0;}\n.nav-tag{display:inline-block;font-size:9.5px;font-weight:700;color:#1d4ed8;background:#e8eefb;border-radius:4px;padding:1px 6px;margin-bottom:4px;letter-spacing:.03em;}\n/* 이동표(진입·전역 이동 / 화면 이동·인터랙션): 회색 격자 + 글자수에 맞춘 열 폭 (2026-09-02) */\n.itm-nav,.nav-global{display:grid;grid-template-columns:fit-content(200px) fit-content(160px) minmax(150px,1fr);}\n.nav-tag,.nav-global-title,.nav-note{grid-column:1/-1;justify-self:start;}\n.nav-row{display:grid;grid-template-columns:subgrid;grid-column:1/-1;gap:0;font-size:11px;line-height:1.5;padding:0;align-items:stretch;}\n.nav-row>span{padding:4px 8px;border-bottom:1px solid #d4d4d4;border-right:1px solid #d4d4d4;}\n.nav-row>span:first-child{border-left:1px solid #d4d4d4;}\n.nav-row:not(.nav-row + .nav-row)>span{border-top:1px solid #d4d4d4;}\n@supports not (grid-template-columns:subgrid){\n  .itm-nav,.nav-global{display:block;}\n  .nav-row{grid-template-columns:minmax(84px,26%) 1fr minmax(96px,30%);}\n}\n.nav-el{color:var(--text);font-weight:600;}\n.nav-act{color:var(--text);}\n.nav-act strong{color:var(--text);}\n.nav-to{color:var(--text);font-weight:700;}\n.nav-to::before{content:'→ ';color:#94a3b8;font-weight:400;}\n.nav-to.stay{color:var(--text);font-weight:600;}\n.nav-global{background:#f8fafc;border:1px solid var(--line);border-radius:8px;padding:10px 12px 8px;margin-bottom:4px;}\n.nav-global-title{font-size:10px;font-weight:700;color:#94a3b8;letter-spacing:.07em;text-transform:uppercase;margin-bottom:4px;}\n.detail-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:10px 18px;}\n.detail-grid .dtl{padding:12px 14px;border:1px solid #eee;border-left:3px solid #e8eefb;border-radius:8px;min-height:0;cursor:pointer;}\n.detail-grid .dtl.active{border-left-color:var(--accent);background:#f5f8ff;border-radius:8px;}\n.dtl-num{display:inline-flex;width:18px;height:18px;border-radius:50%;background:#e0e0e0;color:#888;font-size:10px;font-weight:700;align-items:center;justify-content:center;margin-right:7px;vertical-align:-3px;transition:all .2s;}\n.dtl.active .dtl-num{background:var(--accent);color:#fff;}\n.detail-grid .detail-label{margin-bottom:4px;display:flex;align-items:center;}\n.nav-note{font-size:11px;color:var(--text);line-height:1.65;margin-top:6px;padding-top:6px;border-top:1px solid #eef2f7;}\n.nav-note strong{color:var(--text);}\n\n/* ── 넓은 프레임(어드민 전용) — 표 가독성 위해 기본 540px의 1.5배 ── */\n.frame.wide{width:810px;}\n.main.wide-main{flex-wrap:wrap;}\n.main.wide-main .items{max-width:none;}\n/* 목업 인터랙션(어드민): 클릭 가능한 행·드롭다운 */\n.mk-row{cursor:pointer;}\n.mk-row:hover>td{background:#f8fafc;}\n.mk-row.open>td{background:#eef4ff;}\n.mk-caret{display:inline-block;width:11px;color:#94a3b8;font-size:8px;margin-right:3px;line-height:1;}\n.mk-row.open .mk-caret{color:#2563eb;}\n.mk-exp>td{background:#f8fafc;padding:4px 8px 8px !important;}\n.mk-panel{font-size:10px;color:#475569;line-height:1.7;font-family:ui-monospace,Consolas,monospace;}\n.mk-panel .ph2{font-family:var(--font);font-size:9.5px;color:#94a3b8;margin-bottom:3px;}\n.mk-panel .hist{font-family:var(--font);font-size:9.5px;color:#94a3b8;margin-top:5px;padding-top:4px;border-top:1px dashed #e2e8f0;}\n.mk-dd{position:relative;display:inline-block;cursor:pointer;}\n.mk-menu{position:absolute;z-index:20;top:100%;left:0;margin-top:4px;min-width:132px;background:#fff;border:1px solid #d7dbe0;border-radius:8px;box-shadow:0 6px 18px rgba(15,23,42,.12);padding:4px;}\n.mk-menu .op{font-size:10.5px;color:#334155;padding:5px 8px;border-radius:6px;white-space:nowrap;}\n.mk-menu .op:hover{background:#eff6ff;color:#1d4ed8;}\n.mk-menu .op.cur{color:#1d4ed8;font-weight:700;background:#f5f8ff;}\n.mk-menu .op.warn{color:#b91c1c;}\n.mk-dirty{background:#fef9c3;border-color:#fde047;}\n.mk-hint{display:inline-block;font-size:9.5px;color:#92400e;background:#f
