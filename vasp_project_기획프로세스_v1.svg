<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="940" viewBox="0 0 1240 940" role="img" font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif">
<title>VASP 교환·중개 기획 프로세스 — 조건·참고자료 → 이슈 → 정책 → 산출물 순환 (v1, 2026-09-07)</title>
<desc>기획팀 내부 설명용. v8 구조도(전제·원천자료·기획 덱·최종 산출의 층 구조)를 바탕으로, 화면 수정이 아니라 전제(knowledge/09 §0)와 근거(knowledge/)·참고자료(reference/)를 입력으로 이슈(issues/)를 등록·판정하고, 정책 정본(§0 변경이력)을 먼저 고친 뒤 drafts → 스토리보드 → DB 스키마 → 공유 아티팩트 순으로 전파하는 순환 과정을 그림. 검증은 에이전트 6종(도메인 4 + 교차 2) 리뷰 → 사람 판정. 하단에 실제 사례 2건(2026-09-03(15) 에스크로 = ⓪ 회귀 · 2026-09-04(17) 어드민 재구성 = 기획 수정).</desc>
